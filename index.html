仁钦珠（宝成，1290～1364），纳唐版丹珠尔的编纂者，曾对藏译密典详作考订、著述等。宗喀巴曾从其弟子学密法。喇嘛荡巴法名为索南坚赞（福幢，1312～1375）。", "嘉赛瓦即嘉赛·妥美桑波（无著贤，1295～1369），萨迦派著名师长，他将噶当派之修心教授传与宗喀巴之师长仁达瓦。详见本书“第十五天”。", "简言之，生起一切善法的根本是菩提心，有菩提心者，就算小到布施给乌鸦一口之食的善根，都能转成佛位之因，所以，地道的圆满将极其迅速。己十、成就出生众生无余安乐之良田正如《入中论》中所言：声闻中佛能仁生，诸佛复从菩萨生。世间的快乐及声闻、独觉、转轮王等，全是由佛的力量所产生的，而佛是由菩萨产生，菩萨则是由菩提心所产生。因此，菩提心是一切众生安乐的根本。不仅如此，菩提心又是一切法蕴的心要、诸大菩萨的修持中心。密法的殊胜，也是因为菩提心的力量才得以呈现。格西敦巴曾向一人打听“三昆仲”的情况，对方一一回答后，他说：“了不起！这是一件好事。”然后又问了康陇巴的情况，那人告诉他，康陇巴住在一座岩崖边上，时而坐着半闭着眼睛，时而哭泣不已。格西敦巴听完后双手合十，说：“他是真的在修法！”所以，如《入行论》中所言：是搅正法乳，所出妙醍醐。菩提心是一切法心要中的心要，请大家尽全力专修菩提心生起之法。大乘教法的有无，以菩提心的有无为标准，所以，大家应将其他所谓的“甚深法”暂时放下，勤修菩提心。", "假如不了解这项重要的关键，就会像萨迦、格鲁、噶举、宁玛各派中许多人想修速道成佛，却以为修密宗“二次第”不需要菩提心，这不就像世人所说的：“只想要颈子，不要颈上瘤？”三世诸佛不发菩提心是不会成佛的，不需发菩提心便可成佛，这尊佛恐怕也是闻所未闻。所以说，如果想求佛位，没有菩提心是不可能成功的。丧失菩提心就是丧失获得佛位的希望。因此，我们对此应郑重努力。徕果论师曾对杰·珠康巴说：“您来访时，我可以轻松愉快地讲论菩提心，与近来的人就谈不了这个话题。与别人谈则话不投机。”同样地，我们之中有些人声称菩提心太难生起而自暴自弃，也有人认为这是大乘共同道，比不上深奥的“二次第”等法门就将它摈弃，导致现在修菩提心者为数极少。这就像不入大海之中寻找如意宝，反而在牛蹄水洼中寻找一样。宗喀巴大师也曾赞叹菩提心是修持的中心，他说：菩萨如是善了知，以菩提心为心要。如今有些人说某某本尊是他们所主修的法，也有人说“汉地退灾法”“息灭黑诤讼陀罗尼”等是他们主修的法，但如果没有修菩提心的缘分，成佛的那一天永远不会到来。阿底峡尊者认定金洲是他所有师长中最殊胜的师长，并在手痛时对仲敦巴说：“您的心地很好，您来加持这只手。", "”这是对菩提心的高度赞叹。（帕绷喀大师又介绍了法铠大师先是持一切有部见，后来因菩提心的关系转成中观派的典故。又说，阿底峡尊者在印藏两地事业如此弘大，与他如理依止善知识及修菩提心有关。）噶当派祖师说：如果没有菩提心，纵然入三摩地、耳边有人击鼓也都浑然不知，仍然毫无用处。", "大师罗怙罗鞠多也说：能亲见本尊之面，获得神通与神变，三摩地不动如山，这些都不是什么大成就；应该专修慈心与悲心！佛经里将菩提心喻为转轮王的轮宝、人的命根以及双手。《宝性论》中说：信解大乘为种子，慧是能生佛法母。譬如父亲是种姓的不共因、母是共因那般，菩提心宝是佛的不共因，而证空性慧是三种菩提的共因，大、小乘与智慧空性结合，即成大、小乘的菩提因。所以说，对菩提心略有了解，也要比修没有菩提心的“大印”“大圆满”“二次第”或亲见众多本尊天众等方法，成佛更为迅速，这是很重要的。通晓并成就圣教一切正法的阿底峡尊者的中心教言，就在于：“修慈心、悲心与菩提心！”所以，不要只想着修本尊、念密咒，而应勤修菩提心。能在相续中生起这样的正法心要而苦修，所做的一切努力都是值得的，将来也一定会生起菩提心，因为有为法不会停留在原状，所以菩提心也定能生起。阿底峡尊者未来藏地之前，藏人只是在传“发心供养仪轨”时，于仪轨之首念一念“为利一切母亲有情故当成佛”，就算是发菩提心了。然而，要在相续中生起菩提心需要修心。不经修心，只是像传别解脱律仪的做法一样，不要说是发菩提心，就连菩提心是什么也难以了知。", "以前阿底峡尊者对西藏人这种做法很不高兴，呵斥道：“不明白何为慈心与悲心的菩萨，只有你们藏人才有！”藏人询问该怎么做，尊者答道：“当依次修心。”我们未发起大悲心体验之前，无从生起菩提心，因此必须依着次第来修心。", "戊二、发菩提心之理分两节来讲：（己一）正明修菩提心次第；（己二）以仪轨受持发心。己一、正明修菩提心次第分两个方面：（庚一）由七因果之门修心法；（庚二）由自他相换之门修心法。由“七因果”之门修一切有情成悦意相，是月称论师与月官、寂护等师的传承；由“自他相换”之门修心，是寂天的传承。这两派教诫由大师佛陀赐予弥勒、文殊等人传下来，修其中任何一种均能生起菩提心。后来在《菩提道灯论》中，阿底峡尊者将拥有两派教诫的金洲大师之教授做了解释。虽然旧噶当派广传七因果法，自他相换教授则作为“密封法”隐藏传授。宗喀巴大师接受了有关本法的所有传承，并结合两派教诫传修心法，我们在此也应按照教授将两派合修。虽然修菩提心时应该合起来修，在讲解的时候却需分开来讲。庚一、由七因果之门修心法共分八小节：（辛一）修平等舍；（辛二）知母；（辛三）念恩；（辛四）报恩；（辛五）悦意慈；（辛六）悲心；（辛七）增上意乐；（辛八）正修发心。其中“知母”至“增上意乐”六节为因，“发心”为果。其因果相生的情况如下：在生起为利一切有情而愿成佛之前，必须先有担负利他责任的“增上意乐”；", "在这之前先要有不忍见一切有情受苦的“悲心”，否则就生不起“增上意乐”；生起“悲心”之前，又得先生起珍惜一切有情如爱子般的“悦意慈”，我们目前能够轻易对亲友生悦意相，对仇敌则不然，所以要将一切有情视为亲友，而母亲又为亲友之最，所以应修一切有情为母，生起“念恩”“报恩”之心，珍爱之慈才会生起。所以，这里所谓的“因果”，是指后者的生起要有前者为前提。此道程绵长悠远，不可急躁，只要依次去修，肯定能生起。总体来说，噶当派教授已十分深奥且殊胜，但文殊怙主宗喀巴大师的教法，像至尊文殊的口气余温未散那般，无论就显密而言都是圆满齐备而远离染污的，所以比以前的教授更为殊胜。我的归依怙主大宝师长对此有感而发，他说：“藏地古代的教法，是为了宗喀巴大师如纯金般教法的诞生做的准备。”达仓译师曾以公正的态度评价道：一切显密别于金刚乘，一切续部别于无上部，一切二次别于幻身义，空前善说宝藏尊前赞！大圆满派师长贝格的文章中也提到：“显密善说之源宗喀巴”等，这些都是符合实情的赞叹。虽然他派自诩有“掌中成佛”的大法，但他们的法连“下品资粮道”都难以交付掌中。如果依靠此“道次第”，则佛位决定会出现在我们掌中！", "假如不遵循道的次第来修，菩提心无从生起，所以，我们在此先从“知母”修起。在这方面如果不郑重修习，就像求乐之人刻意造罪，恰成颠倒一样，我们所求的目标是佛位，如果不勤修菩提心，便是行持颠倒；纵然勤修密宗速道，也会重演“南辕北辙”的故事：以前有人想去后藏，策马奔驰，最后到达工布，却以为到了后藏。因此，应当致力于菩提心修法。在生起“知母”之前，必须先修“平等舍”。譬如绘画时，柔软的布面如果高低不平，再怎么画都画不好，假如对一切有情心不平等，即便修慈悲等法，所生的慈悲也有偏颇，因此，应当先生起“舍无量”。", "辛一、修平等舍七因果修心之中不包括自他相换修心；自他相换修心中则包括七因教授的全部。七因果之首所修的平等舍即“舍无量”，即从自己的立场以平等心看待一切有情。我们往往对某些人生瞋、对某些人生贪，内心并不平等。其所缘境，一派先以中庸为对象来修心，然后依次以亲友、仇敌等为对象来修；另一派则同时以亲友、仇敌、中庸三者为对象。由于第二种修法较为流行，所以，在面前观修亲友、仇敌、中庸三者作为对象，自然地会分别对三者生起贪、瞋、漠然三种不同的心态。此时，应当观察：“我们现在对视为仇敌的那人有瞋心，但为什么会厌恶他呢？”我们会发现，是因为想起此人以前对我所做的伤害。接着，就应按照先前“思惟生死总苦”时所讲的怨亲不定的道理，思惟此人在过去多生中也曾作过我的亲友，从而断除瞋恚。我们对现在的亲友感到欢喜，原因是因为此人目前施予我衣食等微小的利益所致，然而我们也应当思惟此人以前也曾无数回与我为敌，从而将贪著破除。现在非敌非友，视为中庸，舍弃一旁的有情，过去既曾是亲友，也曾是敌人，而一切有情全都作过我的仇敌与亲友，所以，都是亲友、仇敌与中庸之辈，一切平等。既然如此，孰当贪著？孰当瞋恨？", "贪著亲友是不合道理的，因为他们过去曾多次与我为敌；瞋恨仇敌也是没有道理的，因为他们以前也曾多次作我的亲友。不仅如此，虽然目前眼下某人是友、某人是敌，不可能有任何人是永远的仇敌，或永远的亲友。所以，自他双方从自身这方面来看，对有情生贪或生瞋都是没有道理的；从对方来看，也是平等的，因为他们受苦相同，求乐与厌苦相同；因此，从他们那方面来讲，对一切有情也无从偏袒，只能平等待之。", "有人或许会想：“这到底有些不同，因为他们是在今生中帮助过我，或伤害过我，所以还是有区别的。”这种想法并不正确，因为过去的帮助与现在的帮助都一样，过去的伤害与现在的伤害也全相同。譬如，去年用棍子打我的头，与今年用棍子打我的头一样；去年请我喝茶，与今年请我喝茶也是一样。又譬如，有十个乞丐前来乞讨时，就他们这边来讲，十人所受的饥、渴之苦是相同的，乞讨的行为也相同；从自身这边来讲，对他们须远离亲疏之念也应该是相同的。如此思惟之后，若能平等对待亲友、仇敌、中庸三者，便应转向一切有情来修。如果能对一切众生平等对待，则因分别敌友而产生的世俗恶行，如打击仇敌、保护亲友等事，就会永远得到止息。否则将某某人剔出“一切有情”之外而抛弃不顾，这一类人的心中是无从生起菩提心的。单“平等舍”这一节，就得花费数月、数年来苦修。花数座时间就想打下圆满菩提的基础，是不会有任何进展的。对以上修菩提心法痛下苦功实修，要比毕生做观修本尊、念咒、观心本面等利益微渺之事要有价值得多。（最后，帕绷喀大师又将上述内容重述了一遍。）462掌中解脱菩提道次第二十四天教授"]}, {"c": "第十七天", "segs": ["七重因果与修心七义之一（嘉杰·帕绷喀仁波切首先引用寂天大菩萨的话说：何人生此珍贵心，我即敬礼彼士夫！谁令害己者得乐，我即归敬彼乐源！说明相续中发菩提心的人，能将造毁谤等恶因的人安置于究竟安乐等。在介绍了一些菩提心的利益之后，大师接着又说：简言之，怀有此心所做的一切既是法的修行，更是成佛之因、大乘之法，所以我们在修行时，不要除了修修本尊、念念咒之外便无事可做，我们必须以“菩提道次第”，尤其是道次第中的“菩提心”，作为所修法的根基。否则，就算一辈子住在人迹罕至的深山里，自以为是地修一些别的法，也丝毫无法靠近佛位。所以，我们必须以菩提心作为修持的中心。（帕绷喀大师又说明了菩提心的生起依赖于修心教授等情况。在简示如何改正动机之后，大师将已经讲述的各科回顾了一遍，接着又重述了菩提心的利益与平等舍修法。）修菩提心七因果教授中，第一节是“知母”，这一点在相续中极难生起，但生不起“知母”之心，其后的因果便无从修起，所以对此应当郑重努力。辛二、知母所谓“知母”，就是要认知一切有情是我们最亲爱的人——我们的母亲。假如在相续中未生起此一认知，与菩提心的缘分就断了。", "其他甚深空性等内容，可以运用多种不同的正理来思考，所以要理解空性不算很难；但对“知母”来讲，如果只用某一则经教来思惟，在心底深处是难以生起定解的，利根随法行的人士还需要用正理来成立。然而，能够运用的正理只有一条，所以很难通达。这一条正理即《释量论》中所说的：最初受生时，呼吸、根、觉等，非不待自类，唯从于身生。这里我们先要证明心的存在是没有上限的，今天的心是昨日心的延续，昨日的心是前日心的延续，这样一路推溯：刚从母胎出生的婴儿的心，是其出生那一刻心的延续，刚入胎的心是入胎前那一刻心的延续。由于生死没有开端，所以也没有所谓心的起始点，进而成立我们的受生并没有开端。该命题若成立，就能证明受生的次数不可计算，受生的时间并无上限。我们今生有母亲，同样地，以前在胎生与卵生中受生时，每一次也都会有一位母亲。受生一百次，就有一百位母亲，受生一千次，便有一千位母亲。如此推演下去，母亲的数量是无法计算的，所以不能不推到一个结论：没有一个有情未曾作过我们的母亲。对此，有人或许会说：我们虽然肯定有过许许多多的母亲，但未必无量无边的一切有情都是母亲。", "当知：不只是从总体上而言，我们受生的次数众多，分别来讲，我们所受取的鹿、羊、虫蚁等每一种身也有无数次。因为我们曾经无数次地受取过每一类有情的身体，所以受生的次数要多于有情的数量。而母亲的数量也必须与我受生数量相同，因此，一切有情不仅都曾经作过我们的母亲，而且还作过许多次，否则母亲就不足数了。《亲友书》中说：“虽将地丸如柏子，数母边际未能尽”等，虽然正说的是母亲之母，母亲之母之母等，但此处根据师长的教授，可略加改变来思惟：假如将大地上的泥土做成许多像柏子仁那样大小的丸子，然后计算：“这是我今生之母，这是前世之母，这是二世之前的母亲……”丸子全部数完，也不及母亲数量的百、千分之一。因此，若不是一切有情都作过我的母亲，母亲的数量就不足额了。不仅如此，因为一切有情决定会成佛，所以有情终有穷尽的一天，而自己的生死又没有上限，因此，我们受生的次数要多于有情的数量。由此观之，一切有情若不是每一位都曾无数次作过我的母亲，母亲的数量也不足额。所以，每一位有情都曾经是我们的母亲，而且还曾作过多生多世。因为没有任何一种有情身我不曾受取过，而且次数多至不可胜数。", "以受取人身为例，此洲中没有任何地方我们未曾受生，受生的次数也无法统计。同样地，我们在东、西、南、北等各世界中均受生无数次，并且次数要多于有情的数量，所以一切有情非但作过我们的母亲，也都作过受取人身时的母亲。为此，我们应当将所有有情都看成自己的母亲。如果经思惟后还是生不起这种感觉，就要自问：我是否根本就没有母亲？此时就会想到我有今生之母这一事实，然后再将她看成是前一世等时候之母亲。以上关于“知母”的修法，《坦途》与《捷径》中仅简略提及，我现在将此科再予以开广。这个如教授般的科判是我在师长跟前苦修的成果，以本法为定课和肩负弘法重任的人士，若能将这一规矩保持下去，将极有助于人们生起“道次第”的证悟。修“知母”时，先观修今生母亲曾多次为我前世之母，然后观父亲、再及于其他亲友、中庸人士。一旦生起很好的感受，再以仇敌为对象来修，最后以一切有情为对象来修。有人也许会想：“如果他们是我的母亲，我应该会认识。而我却不认得他们，所以他们并非我的母亲。”当知在佛看来，没有一个有情不曾作过我们的母亲，一个也没有，不管我们自己是不是认识，事实就是如此。今生的母亲，后世可能受生为狗来到我们面前，但我们不认识。", "单纯的不认识，不能成为否认的理由，例如莲华色比丘尼的故事，与“食父鞭母”的故事。已过去者也不能成为否认的理由。否则，上半生的母亲将不是下半生的母亲，昨天的母亲也不是今天的母亲，因为她们都已成为过去。这是微细无常的道理，不经听闻难以通达。例如，拿这条披单来说吧，去年还是新的时候，既无气味、也未破洞；到现在，这条披单既有气味而且破洞，好像前后两者是不同的东西。就像去年救我命者，今年仍需念其恩德一样。既然已过去者不能作为否认的理由，我们就必须想到：前后世两位母亲，就其同为母亲而言，并无差别。经这样再三修习之后，“知母”在相续中生起的标准是：当我们见到任何有情，即便是一只蚂蚁时，我们都会明显地想到当自己是她的子女时，所有生计都要仰赖这位母亲等情形。（帕绷喀大师指出，我们应当如阿底峡尊者那般在相续中生起“知母”的证德。）辛三、念恩（七因果教授的）第二节为“念恩”。既然一切有情都是自己的母亲，那么我们应该思惟一下她们作母亲时所给予我们的深重恩德。以今生的母亲为例，在初、中、后三个阶段，母亲的恩德都很深。起初，在我住胎的九个月零十天期间，母亲因为怕伤害到我，对一切饮食、住行均十分小心，呵护有加。", "那时候，母亲真可称得上是护理专家，要不然，我们现在不可能有机会接触并学习正法。这不是我们自己精明能干的结果，而是母亲的恩德所致。在我出生之后，什么都不懂，就像一只雏鸟，母亲却以十指捧玩，高兴得像呵护什么宝贝似的。她用体温温暖我，将我放在柔软的褥垫上，待我以慈爱的微笑。因为担心用手替我擦鼻涕会碰伤我，便用嘴来帮我吸吮；担心用木条替我清除残粪会刮伤我，便用手来帮我擦拭。如果当时她丢下我不管，在一天甚至一个小时之内，我肯定会因野狗嘶咬、老鹰衔走或从高处坠落等意外而死。她要时时刻刻保护我不出意外，并总把孩子的苦乐放在首位，即使在睡觉的时候，仍然一心想着孩子，再也不能像以前那样安怡自在。不仅如此，走路、说话、饮食等行为举止，都是在母亲的教导下逐渐学会的，我们现在能自如地行走、谈话等，不是都得自于母亲？当我长大后，母亲会将自己从来舍不得用、比自己身体还珍贵的钱财倾囊授予，要知道，这每一分钱都是她不顾造罪、恶名与辛苦所赚来的。她又将房产交给我们，为我们操办婚嫁，或是安排我们出家等，耗尽了全部心血来养育我们。", "简言之，母亲用尽了全部智慧与能力来帮助我，为我造就一切利乐，消除损害与痛苦，她的恩惠实在是无量无边。父亲等其他一切有情都同样以恩情来养育我。单是我受生为人时，一切有情作我母亲的次数已无法计算，她们都像现在的母亲一样以恩情养育过我。同样地，当我受生为其他种类的众生，如野鹿之类，有道是舐犊情深，作为我的母亲，她们也同样的克尽慈母之责哺育我成长。当我受生为鸟类时，母亲用翅膀孵化我达一个月之久，遇到有人用棍棒来打我时，虽然她有翅膀可以飞走，却因爱子心切而舍命保护。外出觅食虽然只获得一条虫子，她也要留下来喂给我吃。这种事并非只有一次、二次，母亲时时刻刻都在照料我，她的恩德是数也数不尽的。过去果洛有个盗匪将刀刺入一匹母马的腹部，马胎堕地，母马死前还用舌头舐抚幼马，那名强盗深受感动，从此洗手，不再干打劫的勾当。我们谁也不敢保证，那时候的那匹幼马不是自己，而那匹母马不是其他某位有情，就像今生之母深恩养育我，当思一切有情都曾以同样的方式恩养过我。", "辛四、报恩《集学论》中说：烦恼狂痴盲，于多悬险路，步步而颠踬，自他恒忧事，众生苦皆同。假如我们今生的母亲是个盲人、又无人引导，心神狂乱，快要从悬崖边跳下时，这位母亲不去指望她身边的儿子，还能指望谁？这个儿子不去救他母亲还要救谁？同样地，一切有情缺乏辨别法与非法的眼目，每一刹那都受到贪欲与邪行的影响，每走一步都被恶行所绊倒，没有遇到像导盲者一般指导是非取舍的善知识，心被烦恼三毒魔所扰乱、神志不清而疯狂，跳下恶趣的悬崖，多劫之中身体与火无法分开。此次我们好不容易与善知识相遇，遇到了大乘法，稍知取舍之理，与那些有情相比，情况算是好多了。所以就应该想到，救护那些有情的担子就落在我们肩上。又如《弟子书》中所言：诸亲趣入生死海，现如沉没漩涡中，易生不识而弃舍，自离无愧何过此！母亲有情正陷于生死大海的漩涡之中，而此番我们已有救度的方法，如果不救援，我们将是最卑贱的人。因此，应想到救度众生之责就落在自己肩上而勤修报恩。至于“报恩”的含义，如《中观心论》所说：昔由惑魔使，伤害已成疮，我如注硝盐，反令苦病苦。若有于余生，慈敬及恩益，欲极其恩惠，除涅槃何有？", "惠施有情食物、衣服等，只能暂时消除他们的饥渴、寒冷，并没有究竟的利益。能使有情具足一切安乐、远离一切痛苦，对他们就有稳固而重大的利益；若能将有情安置于佛位，有情便能具足一切安乐、远离一切痛苦，所以，我们应该想到：“我应将一切有情置于佛位！”（帕绷喀大师又打比方说，当母亲发疯持刀欲杀其子时，儿子不仅不会恨她，反而会力求治愈她的疯病；同样地，我们也应对怨家、仇敌报恩。）辛五、悦意慈“悦意慈”是一种珍视、爱护众生的心态。格西博朵瓦对一位老太太说：“悦意慈就是您对儿子妥勒廓的那种慈爱。”将一切有情视如悦意之子，即是“悦意慈”。此处不需另修所缘，修上面三节——“知母”“念恩”“报恩”，如果已发起体验，“悦意慈”自然就会出现。一切有情的相续中不仅没有无漏之乐，连有漏之乐也没有，现在他们自称的所谓快乐，本质上全是痛苦。所以，我们应当想：“如果现在一切有情能具足一切安乐该有多好！愿他们具足所有安乐吧！我要帮助他们达到这个目标！”关于修“慈”的利益，《宝鬘论》中开示说：每日三时施，三百罐饮食，然不及须臾，修慈福一分。天人皆慈爱，彼等恒守护，喜乐多安逸，毒刀不能侵。", "无劳事得成，当生梵世间，设未能解脱，得慈法八德。", "有获得“慈法八德”等极大的利益。根据修慈对象数量的多寡，我们将来便能受生为统治该数量群众的转轮王或大梵天。此修慈法又称“梵住”，道理即在于此。如果以遍虚空际一切有情为对象来修，当得大梵无住涅槃。辛六、悲心大悲心是力量强大的成佛不共亲因。宗喀巴大师在《菩提道次第广论》“修菩提心次第”科判中特别提出：“开示大乘道之根本即是大悲”以及“诸余因果是此因果道理”。经中也说，大悲心如转轮王之轮与人之命根，大乘一切道果均观待于此。正如吉祥月称在《入中论》篇首所说：悲性于佛广大果，福犹种子长如水，常时受用若成熟，故我先赞大悲心。大悲心最初重要如种子——它是大乘的决定因素与发菩提心的根本；大悲心中间重要如水肥——它是生起对佛子行不退缩“披甲精进”的动力；大悲心最后重要如果实——它是成佛后利他事业恒不间断的保证。菩提心力量的强弱，视此大悲心而定；菩萨们修道的速度快慢也由大悲心力量的大小来决定；有些菩萨入密宗门求修捷径，且能快速完成，也是因为大悲心的力量。当孩子掉入火坑时，父母会立即设法救出他们，但亲戚就未必会有那么急迫的行动，这是因为悲心有强弱的关系。", "我们修悲心时，若以即将被屠夫宰杀的羔羊等为对象来观修，比较容易生起感受，所以此处应思惟羔羊被杀的惨状：它被摔倒在地，四脚朝天，羊蹄被细绳绑住，再怎么使劲也无法挣开。虽然它清楚死亡就在眼前，却无法逃脱，没有依怙与救星。它流泪不断、眼睁睁地望着屠夫的脸，心中充满了难以忍受的恐惧与痛苦。就在这种情形下，被各种残酷手段屠宰致死。我们看到羊被宰杀时，心里会想它哪里知道将发生什么事，然而它们是知道的。过去有个屠夫，在宰杀了许多头羊之后，正当他用绳索将下一头羊绑起来时，屠夫的刀掉在一头羊的附近，那头羊急忙用蹄子刨土，想把刀埋藏起来。所以说，它们死时一定有着难以忍受的恐惧与痛苦。那些在山上放养的羊，虽然目前没有在屠宰场面临开膛剖肚的场面，但也只是迟早的问题罢了，实际上与屠宰场里的羊并无区别。我们应该想到，这些羊在过去生作我母亲时的情形，从而修习悲心。当我们生起悲心体验时，便应回忆以前在自身上所修的恶趣痛苦，然后推及其他有情，观修他们现在正遭受种种痛苦：有些母亲在地狱中被燃烧的铁丳烧灼，在烊铜中炖煮；有的受生在饿鬼中受饥渴所苦……如是等等，如此思惟生起悲心。", "对恶趣有情生起悲心之后，接着再以善趣众生为对象。就像在山上放牧的羊与正被宰杀的羊，除被杀的时间有先有后，此外并无其他区别；现在住在人群里那些貌似精明的汉子，迟早也会坠入恶趣，实际上与已堕恶趣者并无两样。然后再对今生之母修习悲心，因为她正在造作苦因。其他亲戚、朋友等人也是为现世的享受而一味造罪犯堕。虽然他们目前处于人天善趣中，却依然为三苦所折磨，同时造集比现在的痛苦尤为强烈的恶趣苦因。不仅是他们，一切有情都在承受痛苦和造作苦因，所以我们应当生起悲心，心想：“如果这些具恩母亲能远离痛苦与苦因该有多好！我要帮助他们达到这个目标！”对于较难生起悲心的对象尤其应该特意修习，例如对梵天等难以生起悲心，便应按照中士道中所讲的来思惟，由此即可生起。大悲心在相续中生起的标准是：像慈母一心系念身患重病的爱子一样，下至饮食亦都祈愿一切有情远离痛苦。单是希望远离痛苦的悲心，是与声闻、独觉共同的悲心；欲救拔痛苦的悲心，才是大乘的不共悲心；我们要生起的是后者。纵然这些悲心难以生起，仍然要努力起大精进，力求生起。当我们看到别人生病时，回想起自己以前所受的病痛，便能生起悲心。", "同样地，我们应将中、下士阶段在自身上所修的生死与恶趣苦，扩展到别的有情身上。珍视、爱护有情的“悦意慈”，与“欲令具乐慈”两者，虽然都是慈心，但略有总、别之分。“悦意慈”是由“知母”“念恩”“报恩”三者引生的，由于能生起“大悲心”，所以是“大悲心”的必要前提。“欲令具乐慈”与“悲心”则无一定的因果关系。《菩提道次第广论》中，将“欲令具乐慈”修法放在“报恩”后面讲，所以在有些论著中，也是放在“悲心”前面修。这种作法虽然可行，如果按照教授派的修法，则是在“悲心”之后修“欲令具乐慈”，然后再修“增上意乐”。因此，我们在此处主修“欲令具乐慈”。另外，根据《菩提道次第广论》科判，也应在“悲心”之前配合“悦意慈”稍作思惟。辛七、增上意乐正如子女要承担起照顾母亲的责任，为一切有情除苦、予乐的担子就由我来承担，由我独立将有情置于佛地，这就是胜过声闻、独觉的“增上意乐”。“慈心”与“悲心”好比不忍见到母亲掉入深坑而希望有人出手相救；“增上意乐”则是毫不迟疑地决定由自己亲自救她出离险境。总的来说，虽然声闻、独觉也有“慈心”与“悲心”，但却没有这样的“增上意乐”。", "根据我大宝师长的口授，此“增上意乐”与“报恩”二者间承担利生责任的关系，就好比商人决意购买货物与准备购买货物，有决定与尚未决定的区别。", "辛八、正修发心在勇敢地担起利生的责任之后，再观察一下自己是否具有这样的能力。我们将发现，现在自己连利益一位有情的本事都没有。我们应当研究一下究竟谁具有这种能力，以及自己是否也能达到他们的水准：这个世界上，地位最高的是梵天、帝释之辈，但他们丝毫无法利益有情；声闻、独觉阿罗汉尚未解脱一切系缚，所以利生事业也不圆满；初地菩萨的利生事业虽然极为广大，却无法与一生补处菩萨相比；一生补处菩萨无法与最后有菩萨坐在菩提树下一天的利生事业相比；菩提树下菩萨的利生事业，无法与诸佛相比，事业大小犹如虚空与手掌之别。因此，只有诸佛的利生事业才是无与伦比的，诸佛能根据有情不同的界、意乐、心量，毫不费力任运自然地利益有情。当获得佛位之时，便能拥有以前归依部分中所说种种功德，所以想要利生就一定要获得一切智，为此必须发起为了利他而希求圆满菩提之心。“平等舍”“知母”“念恩”“报恩”是发起希求利他心的基础，“慈心”“悲心”“增上意乐”三者是发起希求利他心的正行。发心欲求圆满菩提者，如所谓：发心为利他，欲正等菩提。合格、圆满的发心，不仅是为利他成佛，也要为自身断证功德等自利的圆满而求成佛。", "当然，这不是纯粹为了自利，应该像先前“慈心”“悲心”“增上意乐”各节中发起希求利他之心一样，为了利他发起获得圆满菩提之心。如此修习之后，真能获得圆满菩提吗？一定会的。因为发菩提心的时机没有比现在更殊胜了，我们得到的这个人身，能用来修行成佛；所遇到的法是佛的圣教，而且是佛教中的大乘法，甚至是能即生成佛的密宗教法，这是各宗所共有的殊胜处。在宗喀巴大师的耳传教法中，不仅有能在人寿十二年中成佛的法，还有更快的在三年又三个月中获双运位的多种殊胜教授，由以前嘉瓦父子等祖师们的传记，便可明白。我们总喜欢说现在是浊世，然而现在所拥有的好运与良机是前所未有的。杰·密勒日巴与温萨巴的身体并不比我们这个身体优越，因此，我们就像吐谷浑跛子骑野骡一样现在就要努力修法。我们怕修“道次第”胜过怕死，大多数人喜欢以读书、学习、念诵等度过一生，这是不得要领的做法。因为谁也不确定以后是否还会获得这样的身体；纵然得到，恐怕也很难遇到佛法，尤其是圆满无误第二胜者宗喀巴的教法。因此，我们应该认真考虑，在失去这个身体之前，是否能够发起菩提心——圆满菩提之因。若能发起，则自他二利均能成就。", "以前某个地方发生饥荒，有家老少濒临死亡时，偶然得到一腿牲畜肉，父亲心里盘算，这块肉若分给大家吃，每人仅能得到一小块，仍解除不了饥饿，终究于事无补。于是，他决定自己将肉全都吃了，等身体有了力气去外边找食物，这样家人才会得救。那位父亲便把所有的肉都吃了，后来果然找到食物，全家人因而得以继续生存。我们无论是在修密法的时候，或念“嘛呢”的时候，或游学辩经院的时候，都要怀着菩提心。一旦发起为利有情欲成佛的“有励力觉受”，即不过是发起了如甘蔗皮一般的菩提心；等到一见有情便能自然发起为利此有情欲获圆满菩提之心的“无励力觉受”，才是在相续中发起了真正的菩提心。由此进入大乘资粮道，也是三大阿僧祇劫积集资粮的开端。若发起这样的体验，我们将生起无边功德，例如获得“菩萨”与“佛子”的称号等。在这个基础上修密宗道，则更是锦上添花，肯定很快将成佛。", "发心按体性来分，有“愿心”与“行心”两种；按阶段来分，有“胜解行地”等四种；按方式来分，有“如王”等三种。另外，了解一下有关二十二种发心的论述也很重要。庚二、由自他相换之门修心法以上是讲由七因果之门发心法，接着讲寂天大菩萨的自他相换之门修心法。虽然以上述七因果教授来修心也能发菩提心，但为了使力量更勇猛，我们还需要以自他相换的方式来修心。这一修法在以前是保密的，并与“取舍”修法分开来讲，名为“修心”。对非器来讲，这一自他相换的修法，不太容易接受，正如《入行论》中所言：若人欲速疾，救护自与他，当修上密诀，名自他相换。所以，从阿底峡尊者到切喀瓦这段期间里，此法是作为“密封法”隐密传授。有关修心法类的著作，如《孔雀化毒论》等虽有很多，但开示全圆“修心”道体的，则为《修心七义论》。因为修习此法的效益要胜过其他，所以我现在根据《修心七义论》根本文古本，将此引导供养给大家。各派讲解此论的方式不一，这里我依据欧曲瓦父子的引导传承来讲。", "先讲“作者殊胜”，本法由大师释迦牟尼佛传下来，一直到阿底峡尊者，尊者将此法密封传予仲仁波切。仲仁波切为弟子们公开传授“道次第”，而将此法秘密地传给博朵瓦等人。博朵瓦将之传予朗日塘巴与霞惹瓦二人，霞惹瓦又传给继承菩提心法的及门弟子——格西切喀瓦。从切喀瓦开始，此法才公开传授。格西切喀瓦出生于一宁玛派大密宗师世家，对五明等十分善巧，仍不以为足。后来，他看到朗日塘巴写的《修心八偈》，为了弄清楚偈中“胜利归于他，亏损则自取”等的意思，特来拜访朗日塘巴，那时朗日塘巴已去世，但遇到了霞惹瓦，于是他求了修心教授修习，在相续中发起了菩提心。后来，他将此法传给很多麻风病人，这些人修了之后，病都痊愈了，所以此法也被称为“麻风病治法”。切喀瓦感到将此法密传太可惜，于是便为大众普传，并记录成文字，形成分为七节文义的《修心七义论》。所谓“甘露藏教授”，是指“修心”乃是能获得无死佛位的究竟教诫。“法殊胜”，比喻此法如金刚宝的道理，以前讲本法的利益时已讲过了。又如同少许日光却能消除黑暗，本法能消除我爱执之暗；如少许药树叶片即能除病，本法能祛除我爱执之病；", "在五浊恶世、修法难以入道的时代，以此“修心”法为伴侣，即能免受恶缘侵扰，如是等等，本法有许多殊胜处。本文开头所说的“敬礼大悲”，并非是向圣观自在敬礼，而是像月称论师在《入中论》篇首礼赞悲心一样，是礼赞大悲心。修心正行分七节。", "第十七天七重因果与修心七义之一479克珠·丹巴达吉在《般若总义》中解释说：“胜义谛中二相隐没之大乘圣者心王意识，复是无住涅槃圆满意乐之见行二者中属于见分之智，乃胜义发心之相。”“为利他而心缘圆满菩提，且与希求自身圆满菩提之欲相应之大乘人心王意识，见行二者中属于行分之大乘道入门智，乃世俗发心之相。”大乘道具有“方便”与“智慧”二大要素。方便分指菩提心、广大行等方面；智慧分指空性见、奢摩他等方面。又名摩当格巴，龙猛弟子之一，系“集密”传承祖师，见本书附录二。故事待查。根据欧曲瓦《修心七义笔记·佛子心宝》中的说法，先讲世俗发心，次讲胜义发心，是针对钝根讲的，否则，他们有可能心生恐惧而退心；先讲胜义发心，次讲世俗发心，是针对利根讲的，利根者因证空性而起大悲心，进而发心成佛利生。并说这两种方法并无相违之处。彩却林雍增造有两种重要的《修心七义》引导文：一、《大乘修心引导文·甘露藏》，以实修为主；二、《大乘修心引导文·善慧密意庄严》，以讲解为主。指毗钵舍那，见本书“第二十二天”。详见汉译《杂宝藏经》（T04，no.203）卷1，《慈童女缘》。详见汉译《大方便佛报恩经》（T03，no.156）卷2。", "《供养师长仪轨》中所说的“痛苦虽微终不欢”等来思惟。现在我们对所谓的“我”十分珍视、爱护，对别人则不然，这是自他不平等所致。然而，从道理上讲，自他两者并没有这么大的差别，应该思惟：自他双方都想要快乐、不要痛苦，二者平等。关于这一节除上述所说外，没有其他众多理则。“修心”中的“知母”“念恩”“报恩”三节，以及后面的“增上意乐”“菩提心”两节，与前述“七因果”中的相关内容并无二致，但“悦意慈”与“悲心”两节，则有强、弱的差别：在修“念恩”时，“七因果”只提到有情作我们母亲时的恩德；“修心”则讲到有情未作我们母亲时的恩德。辛二、由众多门思惟我爱执过患在修“自他相换”之前，需要思惟违缘我爱执的过患，与顺缘他爱执的功德。这里先讲前者。《供养师长法》中说：观我爱执如重病，引发非爱众苦因。《入行论》中也揭示：尽世所有苦，皆从自利生。又说：世间诸灾害，所有怖畏苦，悉从我执生，留此魔何益？本论根本文中也提到：众过归于一。", "我们不想要的所有麻烦都是由我爱执产生的。兵刃、毒药、天龙等非人的侵害，受生于地狱、饿鬼、畜生等，都是为了自己的利益，做杀生、悭吝、轻蔑他人等恶业所招来的。同样地，现在所患的风、胆、涎等病，敌人的威胁、诤讼、官家法令的惩罚等，也都是因为贪爱口腹之欲等，以及放不下对衣、食、名三者的贪著，缺乏坚忍等缘故而造成的。大到国王与臣民之间的争执、国与国之间的战争，小到市井小民的不和、出家人之间的打斗，这一切都是我爱执招来的。如果能够不起我爱执，而对他人说：“这对我无所谓，悉听尊便”，前面的所有过患就不会出现。我们对小偷、强盗，甚至是将糌粑袋拖进墙洞的老鼠感到很讨厌，这也是我爱执的反映。有人被毒药毒死、或是饮食不当而死，这也是因为有我爱执而乱吃东西所致，真正致命的是我爱执而非毒药。我们现在无故受到诬陷，也是因我爱执加害他人的结果。我爱执就像是斩断善趣与解脱命根的刽子手；身背三毒之袋偷窃善业收成的盗匪；在无明田中播下恶业种子生成生死收成的耕夫；为了谋利而冲锋陷阵的贪心汉；一旦吃亏便怪罪师长、亲教师、父母的薄情寡义、无耻之徒；无始以来不曾积累一件善功德的空手裸汉；无事自扰的庸人；", "对高过我者起嫉妒心、对同与我者起竞争心、对低于我者起轻蔑心；赞则起慢、毁则生瞋，世界上一切不祥之事的召集者；一切不善的生源；无始以来使自己遭祸、受苦的枭头鬼。驱鬼抛朵玛的时候，由于魔就在自己的心中，所以应当抛到自己的心上。平时抛朵玛时，我们总是将它抛到母亲有情的头上，认为他们是敌人，这是错误的。称我爱执是传报凶信的蓝头鸟、“修心”是驱魔法，道理也在于此。我的大宝师长曾经提到这么一件事：过去有个觉巴，抢了厉鬼的一块地盘。有一天，觉巴的两位施主发生争吵，觉巴前来调停，结果被其中一位杀害了。这类事件的发生，根本源由也归究于我爱执。《入行论》中说：意汝欲自利，虽经众多劫，以诸大辛劳，汝唯令我苦。从无始以来让我们在生死中受苦的，就是这个我爱执。虽然我爱执与我执有别，但因为这两者十分近似，在《修心》中说来却是同一件事，简言之，都是一切过失的根本：一个是将“我”执为实有，一个是舍不下这个“我”而舍命保护。总而言之，一切过失都是内心深处的自私心造成的，所以，如果不将这个我爱执调伏，我们不可能会有快乐。以前我们没有深查造成痛苦的根由，现在已经找到了，所以要将这个我爱执视如怨敌，想办法消灭它。", "辛三、由众多门思惟他爱执利益寂天菩萨曾说：尽世所有乐，悉从利他生。《供养师长仪轨》中也提到：爱护诸母令享乐，视为无边功德门。《修心七义论》中也说：思众皆有恩。善趣的身体、受用，生死中的一切圆满，都是从他爱执而来。因为爱惜其他有情的生命、断除杀生，不杀生的善果成熟，便得善趣与长寿等；因为他爱执而布施、不偷盗等，感得巨大财富。简言之，正如所谓：此何须繁说，凡愚作自利，能仁行利他，观此二差别。", "以及《供养师长仪轨》中所言：总之凡愚为自利，能仁专修利他行，了知功罪利害心，自他相换愿加持。最初大师佛陀也是与我们一样在生死中流转，因发起他爱执，才断尽一切过失、圆满一切功德，二利臻于究竟。我们则因为从无始生死以来抱着我爱执不放，一味地想着自己的快乐，结果到现在连一件自利的事也没有完成，乃至于不堕恶趣的方法也无力成办，而只有受苦的份。如果我们以前就已改正这一心态，像大悲大师一样，非但现在不会有这些痛苦，而且必能具足妙乐，利他也已圆满；正因为我们以前未能这么做，所以才沦为现在这个局面。这些原则也可以运用到修“酬补仪轨”上，达波地区有位格西，在某寺修“酬补”时，将《修心利器轮》中说的“由此我获敌，……是我执无疑”一颂插入仪轨中修，这是当危机出现时，懂得如何认识真正敌人的做法。（帕绷喀大师又讲了两个故事：过去有个咒师，对许多盗贼施法，多人因此丧命，拉准的儿子嘉瓦敦珠（胜者义成）发愿将法力引到我爱执头上，因为他不起我爱执，所以咒师的法力不能伤他一根毫毛。竹巴衮勒（普善）为其弟却嘉做佛事时，出于打击我爱执的用意，他未将朵玛抛到外面，而将它抛到弟弟的怀里。", "）大悲大师因为有他爱执，所以过去受生为“莲华”王时，为了消除瘟疫，受生为赤鱼，用自己的肉来治疗众多有情的疾病。大师受生为海龟时，将五百位坠入湖中的商人救起送到岸边，并将身体布施给八万只蚊虫。（大师又详述了“胜军”王施舍一半身躯，“顶宝”将顶髻摩尼宝割下来赠与他人；“大志”王见一母虎饿极欲食其子时舍身饲虎，以及“月光”施头等本生故事。）大悲大师能够如此，我们却除了自私之外没有其他想法。要做得像大悲大师一样固然很难，至少也应该从发愿开始修习。而且，爱执他人也是应该的，因为现前的衣、食等一切，都需依赖有情才能出生，有情就像能生长丰硕果实的大地或如意宝一样。有情不仅在作我母亲时有恩于我，在未作我母亲之时，也还是要依靠他们的恩德才能生存。例如，我们吃的一小袋糌粑，先要有人耕种、有人浇水、有人推磨等，经过无量劳力工作才能享用；我们的房屋也归功于很多人与牲畜运土、砌墙、伐木、送水等才能建成；这件被单要有人剪羊毛、有人编织、有人裁剪，现在才可以穿。", "此外，现前暇满身的获得、究竟菩提心的发起、学行、成佛，这一切也都是有情的恩德所致，因此有情是我悲心生起的对象、发心的对象、布施的对象、持戒的基础、安忍的对象。正如《入行论》中所言：有情与诸佛，同能生佛法，如是敬信佛，何不敬有情？我们之所以能够成佛，一半是因为师长的恩德，一半是因为有情的恩德。由此缘故，朗日塘巴也说：我视诸有情，胜过如意宝，能成大义利，愿恒常爱执！有情如同如意摩尼宝，能成办现前与究竟一切利益，所以，爱执他人是应该的。"]}, {"c": "第十八天", "segs": ["修心七义之二（嘉杰·帕绷喀仁波切先引用法王宗喀巴大师的言教，即“四瀑流冲难遮止”等，为我们简示前行改正动机之法。在回顾了以前已讲的各科之后，大师将修菩提心法类中的“七因果”重新讲了一遍。“正明修心”一科的第二部分有五节，即“自他平等”“由众多门思惟我爱执过患”“由众多门思惟他爱执利益”“正修自他相换”与“依此修取舍法”。帕绷喀大师将前三节复讲了一遍。）辛四、正修自他相换在观察思惟了我爱执的过患与他爱执的功德之后，当如《供养师长仪轨》中“观我爱执如重病”等四个偈颂所言，由见功过之门，将我爱执之心与抛弃他人之心互换，以此来修自他相换。这并非将他人想成是自己、将自己想成是他人，而是将以前因我爱执而抛弃他人的心颠倒过来，也就是将我爱执转移到别人身上，名为“相换”。当思：“以前如何抛弃别人，今后就如何抛弃自己；以前如何珍爱自己，今后就如何珍爱他人。”以这样的方式来修心，等修习纯熟之后，便能做到自他相换；就像从此山转移到对面的山上，而对对面的山生起“此山”的感觉。", "辛五、依此修取舍法修“取”是着重于“悲心”所缘；修“舍”是着重于“慈心”所缘。根本文中说：取舍间杂修。这一修法能增长先前所讲的慈心与悲心。虽然在许多引导文中，将“舍”放在“取”之前修。但是按规矩应先修“取”，或是不修“舍”单修“取”也可以。因为若不先取苦，舍乐并无大益。所以，先侧重悲心的所缘，发起悲心令一切有情远离痛苦。然后观想众生所有痛苦如刀断发，成黑光相，融入自己心间我爱执中。如果想要广修，可观想热地狱中的炎热之苦与烈火热乎乎地进入心间、融入我爱执魔的身中。同样地，我们亦可将寒地狱、饿鬼、畜生、非天、人、天等，直至十地菩萨的一切苦与罪障等取到自己身上，然后，信解一切有情远离痛苦、罪障清净，并发愿其痛苦、罪障皆成熟于自身。修“取”时，对师长与诸佛二者无苦可取。由于补特伽罗的心量有高有低，某些初业行者无法接受取舍的修法，对这些人来讲，如所谓：先从自身取。亦即上午取下午的苦来修，今日取明天的苦，同理依次取下月、明年、此生、后世、一切生的苦，以及父母、亲友、中庸、仇敌等一切有情的苦。前者修习熟练之后，再以后者为对象，如此便能将别人的苦、罪障等取到自己身上，应依此次序来修习。", "通常一开始很难萌生取仇敌苦的心，所以，要从自己开始修。有时候从地狱修到十地菩萨，有时候从山沟头往下修，有时候从山沟尾往上修，像这样修习，下至狗被石头击打的痛苦也能取受过来。取的时候，不是让苦消失，或是将苦搁置一边，而是要确实地取到自己心里，那时若能生起恐惧的感受，是好的现象。", "若能这样思惟，纵然不能真的取他人之苦，也能圆满广大福德资粮。娴熟之后，甚至能真实取苦，如慈瑜伽师的故事。至于着重于“慈心”所缘的“舍”，即：为利诸有情，转成如意身。以及《华严经·金刚幢品》等所说的施舍身体、受用等。观自身变化成其他有情所需的东西，施予情器世间：先是为热地狱中的有情变化出甘霖，解除他们的痛苦；变化出暇满身，设法使他们获得。其次变化出悦意的处所、楼房，让他们愉快地享受；变化出丰盛的饮食，让他们得到饱足；变化出衣服，让他们穿着；变化出善知识为他们说法，使他们接近佛位。然后为寒冷地狱中的有情，变化出日光与衣服等；为饿鬼变化出饮食等；为畜生施予辨法慧；为非天变化出坚甲；为天神变化出五欲乐；因为人的欲望最重，所以凡是人所想要的都变化来施予，并为这些有情施舍受用与善根等。观想自身变化出供养云，献与师长、诸佛，师长的寿量、事业因而增长。三世善根均可施舍，身与受用两者中现世与来世的可舍，已过去的则不可。如前已述，修舍时，当思惟众有情匮乏安乐的情形，以生起“慈心”；我们应将这一修心所缘作为修持的中心。又如（根本文）所说：于彼策念故，威仪尽诵持。", "为了提醒我们修“取舍”，应在任何场合念诵与“取舍”有关的文句。虽然《金光明经》中有一些这样的文句，如果大家不清楚，亦可念“唯愿大悲师加持”等，有些祖师就是用此一颂文来计数修持。不仅如此，我们也应将一切威仪转成增长菩提心的方便。有关这些内容，可参阅《华严经·净行品》等。想要将菩提心作为修持重点的人，应效仿文殊怙主宗喀巴大师的行持，对《华严经》多多闻思。当我们对“取舍”所缘较为熟悉的时候，即按照（根本文）所说：复令乘风息呼气时配合修“舍”，吸气时配合修“取”。此乘风息法一开始较难掌握，经过不断练习而能自然运用后，因为风心同转的关系，就成为自他平等相换菩提心顺易生起的极大助缘。此法与密法中所说的“金刚诵”有些类似。克珠杰曾赞叹宗喀巴大师说：怙主师尊鼻中息，亦成治疗众生因。道理也在于此。这里面虽然还有其他教授，但不宜为非以此法为定课的人讲。三、转恶缘为菩提道这一教授对浊世时代的修行者极有帮助。在修法障难众多又难以排除的情况下，必须设法将逆缘转变成顺缘，否则，善妙或恶劣外缘的出现都会使修法的心消退。有的修行人因荣登高位，心生骄慢而退心；有的人因为有了钱，忙于经营而退心；", "有的人因为遇到不幸，心灰意冷而退心。在这些情况下，修法是很困难的。如果连平时少得可怜的法也退失不修，必然每况愈下，因此，我们要设法使任何恶缘都转变成不妨害修法之道。这里分为“以意乐转变”与“以加行转变”两种方法。以意乐转变中，又分“以行转变”与“以见转变”两种。第一，即如《供养师长仪轨》中所说的“情器充满诸恶果”等，以及《修心根本文》中所说的：罪满情器时，恶缘转觉道。往常出现患病、怨敌、魔崇等不如意的事时，我们总是将责任归咎于他人，不明白所有疾病都是由业所生，却归因于饮食、邪魔等，然而探究它的根本或起因，则如先前下士道业果一节中所说，一切不如意之事都是我们的业所造成的，而业又是从我爱执产生的，因此，我爱执才是祸根所在！遭盗贼偷窃时，不应指责小偷，而应埋怨自己的恶业以及发起恶业的我爱执。所以，在出现患病、苦恼等恶缘的时候，应当想成是获得菩提的助伴；所谓“病扫罪障帚”，若能把病苦等任何恶缘的出现，想成是往昔所造必定受生恶趣的恶业罪障，在此身中成熟而消尽了，从而感到高兴。不仅如此，我们也应高兴地想到：“以前修取舍时，就是要把有情的苦取到自己身上，现在这个目的终于达到了！", "”又发愿有情剩余的痛苦也成熟于自身，以此代替众生受一切痛苦，这样来做观修，心想：“此次能有机会实际取受有情痛苦，真是太好了！”能彻底放下，病痛就不会成为障难，反而能增长善行。例如，以前离俗修行者扎坚巴有个弟子身患麻风病，到机摩杂逞后病就好了。又如所谓：“恶缘劝修善”，如果不想受苦，就需断恶！将苦看成是提醒我们积福净罪的信息而勤修积净之法。未出现恶缘时，我们常松懈下来而不念及修法；遭受不幸、灾祸、疾病等恶缘时，却反而能激发出离心、消除懒惰懈怠而趣入善行。有道是：“魔鬼佛神变”“苦为法性显”。当出现王魔、厉鬼等损害时，应当用以下的想法来观修：“我以前不念正法，受了世间法的欺骗，现在它们来劝我修法，对我有恩！”如果懂得如何转念，痛苦也会变成证悟法性的助缘。疾病是由我爱执所产生的，生病时应当想：“病魔来帮助我降伏自己无法降伏的我爱执怨敌，恩德深重。”当我们遭到恶缘的时候，通常会将平时的修持弃置一旁，以后不要再如此。就像行人在通过险关时，需加倍小心；在疾病恶缘等出现时，也应特别谨慎，继续修持不松懈，努力修习“取舍”等法，这才是最重要的。", "《入行论》中说：苦有诸功德：厌离除骄慢，悲愍生死者，羞恶而喜善。有苦的时候，我们会心生厌离而消除我慢，因自身之苦而对他人心生悲愍，并且希望断除苦因等。我们往往将快乐视为好事，而将痛苦视为坏事，然而这并不正确，有道是：乐不可喜苦可喜，乐则昔集福德尽，苦则恶业罪障净。身居高位的人，像是独自遭受软禁一样，想去的地方都不能去，那些大活佛和大官们不正是如此？珠却·洛桑南杰也说：“高者如软禁”“卑下乃佛座”。过去所有的智者、成就师，都是身居卑下而获得佛位的。我们应效法仲仁波切向香·章嘎贝穹顶礼那样的谦卑，能自处卑位，只有流水才比自己更低，这样的话与朋友也能相处的很融洽。赞不可喜谤可喜，谤则自过全彰显。听到别人的赞叹，我慢会变得愈来愈重，这会贻祸于现、后两世，也发现不了自己的过失。若受到毁谤，虽然一时间感觉不太顺耳，却能使我们以后检点自己的行为，谨慎取舍。所谓“咒骂如天馔”，毁谤好像是天的悉地一样。在身陷他人交相谤辱等恶缘时，应当如此思惟。享受快乐的时候，应当想到这是善业的结果，因而对修菩提心发起更大的勇悍。", "第二，以见转变，根本文中所说的“乱境观四身”等，这是古人的讲法，如果照这个方式观察，稍有不便。此句意为：当痛苦现前时，观其自性，其中本来不生是为“法身”等，但这种说法意义不大。简言之，当自身出现苦乐与妙劣外缘时，应观察其各自本性：除因缘缘起聚合而有“妙缘”“恶缘”“苦”“乐”等名言现前显现、不可否认之外，实际上，它们都是无自性的。而且应观察“自”“他”无谛实的道理，破除忧愁与贪著等，这样思惟即可。如果不了解正见，则应思惟：“在我死时，目前自己所有的一切苦乐，都像南柯一梦那样，只能成为回忆中的事件。所以，在这短暂的生命中生贪起瞋是毫无意义的！”494掌中解脱菩提道次第二十四天教授"]}, {"c": "第十九天", "segs": ["修心七义之三（嘉杰·帕绷喀仁波切首先引用《弥勒愿》中的“能遮恶趣道”等，略示前行改正动机之法，然后回顾了以前所讲的科判，并重述了“正修自他相换”与“依此修取舍法”两节，以及“修心七义”中的前二段。大师接着指出：）将爱执心与舍弃心两者生起的基础——即自他的地位做相换或交换后，为了增强这一修法，我们应修以悲心所缘为主的“取”苦，和以慈心所缘为主的“舍”身、受用、善根。熟练之后，再配合呼吸修“取舍”。另外为了不忘记这一修法，我们应在一切威仪中念诵文句来提醒自己。虽然两种修菩提心教授合一修法在次第、科判、开合上有别，章节数量有多有少、稍有出入，但总结起来，共有十一种所缘类，亦即先修“平等舍”“知母”“念恩”与“殊胜念恩”“报恩”四节；然后修“自他平等”“由众多门思惟我爱执过患”“由众多门思惟他爱执利益”；以真正的自他相换心为基础，配合“悲心”所缘修“取”；配合两种慈心中的“欲令具乐慈”所缘修“舍”；之后当做观察：自己所做的取舍是否真有其事？发觉这只不过是一种想象，实际上并未成办利乐，于是想到若要实际达到这一目标，就应生起由自己承担责任的“增上意乐”；再为此正发起欲获圆满菩提之心的“菩提心”。", "上述十一种所缘类是“七因果”与“自他相换”两种教授的合修法。", "最后当修“以果为道发心”法，其所缘为：观想自身变成释迦牟尼佛，放光净治有情的痛苦，使一切有情均转成大师释迦佛之身。次修欢喜心，心想：“一切有情已具足安乐”。这一修法能帮助我们积聚巨大的资粮，和密宗的“胜曼荼罗王”修法相似、具有缘起的关要，也与婆罗门“海尘”与“辐辋”王所发之愿近似。境毒三善根当见到悦意、不悦意、平常三种境而生起贪、瞋等烦恼时，我们便以三境中任何一种为对象，设想将其他有情相续中所生起的贪、瞋等一切烦恼，以及依此三毒将在恶趣、生死中所受的一切苦与苦因，均收到自身上，从而使一切有情具足无贪、无瞋、无痴的善根，如此配合观修。在了解到争斗、病痛等一切恶缘的根由是我爱执之后，便会明白遭遇的恶缘是自己恶业果消尽之因，也是所取的他有情众之苦在自身上成熟的表现，因此感到纯然的喜悦。由于修习修心法能使恶缘变成助缘，永无烦恼，所以修心法也被称作“快乐泉源”。我们不应该连一点逆境也承受不起，并且应该改变对逆境的态度。譬如，在外经商的人，当思遇雨则强盗不会出没，遇雪则驮畜的蹄子不会跛瘤。又如《入行论》中所言：若事尚有救，云何不欢喜？若已无可治，不喜有何益？", "有苦的时候，纵然心里不高兴也于事无补，所以应设法将之转成助缘。我们经常见到某些人在为病所苦、苟延残喘时，即便未听闻像“道次第”等法，也会自然地生起无常心。", "当恶缘出现的时候，若能发愿将一切有情的不幸、苦恼转移到自己身上，这种功德是最大的。（帕绷喀大师又将转恶缘为菩提道中的“以意乐转变法”重述了一遍。）现在接着讲“以加行转变法”。加行有四种：积集资粮、净障、施朵玛于魑魅、向护法嘱托事业。善于修心的人士，在患病期间向护法嘱托事业时是这么说的：“这个病是一切有情的苦在我身上成熟所致，我需要用它来修取舍，所以，请帮忙让我的病再加重一点吧！”为魑魅布施朵玛时，心里想的是：“您对我所做的妨碍，是为我清净罪障，让我圆满资粮，让我的修法更有效，所以恩德很大，请再给我比过去更大、更多的灾害吧！”修心还不够熟练的人，不可能这样去做，而且会感到害怕。在这种情形下，应如常请求惠助免受病苦。在痛苦出现的时候，如住所漏水，需查明根源堵塞漏洞，我们应当断除苦因、净治罪障；成办乐因、积福修善。《百分朵玛》的后面若依《堕忏》修忏悔，则四种加行全备，在该仪轨最后发“修心”愿也很恰当。遇缘即修习在突遇善缘或恶缘的情况下，都应迅速配合修心法来做应对。四、开示一生修持之总纲“五力”是指：白法种子力、串习力、牵引力、对治力与发愿力。五力中以“牵引力”为最重要。", "每日早晨起床后，应立即猛力发愿：“总体上说今生、特别是今年、尤其是今日，我不能轻易浪费，而要降伏我爱执这个敌人，做有意义的事！”发心决定了我们行为的善与不善、决定我们将要行的是小乘事业还是大乘事业；小到杀一只虱子或是做午饭，都是发心后去做的。我们从今晨起床系腰带开始，起心动念都是为了衣、食、名等现世的安乐。不应再继续如此下去，系腰带时应塞一张便笺在结子里提醒自己，如前发愿，痛下决心。“白法种子力”，为了增长菩提心而由“加行法”等门所做的积福净障。我们平日所做的善多半流于现世的目的，纠正这种做法是很重要的。“串习力”，在行、住、坐、卧诸威仪中均设法使两种菩提心增长，不间断地修行。大菩萨们能布施自己的头颅与四肢等，做出我们难以接受与实践的菩萨行，也是在心熟习之后才得以成就。刚开始学打铁、斫木，做起来总是很不顺手，入门后就不难了；布施自己的生命也一样，熟练后，就会像惠施蔬菜那般容易，所谓：久习不成易，此事定非有。据说有些古德骑马时，在一只脚套入马蹬另一只脚尚悬空前，就已将“道次第”做了一遍“忆念修”，这也是习惯所致。", "串习与修习是同样的意思，即便是一口气喝一碗茶，如果不经练习，也不是件容易的事！“对治力”，我爱执初露苗头，即予铲除，就像打偷食的狗一样，应用这样的方式来对治我爱执。“发愿力”，晚上临睡前，将日间所做的善根回向，使两种菩提心增长。以上所说为现世五力，至于临终五力，即是修心法门的“迁识法”，所谓：大乘迁识法，五力重威仪。修心迁识法中，虽然不需要念“嘿嘎”与“呸”，但与其他迁识法相比，此法却更为深奥。", "五力的名目与前相同，其中“牵引力”，是指发愿自己在临终与中有阶段，能够不离菩提心。“白法种子力”，将自己最贪著的东西做上供下施等，布施给殊胜福田，或是将所有财物分成几份回施他人。如此一来，心无贪著，这要比死后由别人代为荐福好得多。以前有一个比丘，因贪恋钵盂而受生为蛇，被佛陀驱入林中后，瞋火炽燃，焚毁树林，自己也被烧死，堕入地狱。因此，这位比丘前后连续三生的身体，为三种火所烧。又如某人将黄金埋入地下，因为贪著黄金，死后也受生为蛇，后来将黄金供养佛陀。如果我们不愿布施财物，结局可能与他们相同。同样地，如果贪著于自己的身体，将受生为身中的寄生虫。以前某湖边有一具女尸，一条类似蛇的虫子在尸体的口、鼻、眼、耳等各窍爬进爬出，缠着尸身不走。这是因为那个女人的前世对自己的身体很贪恋，时常在镜子前顾影自怜，死后变成虫子留连不去。所以说，我们在临终时要积福、猛力发愿求菩提心增长，尤其重要的是不可贪著自己的身体等。（帕绷喀仁波切又举了另一个事例，有个出家人生前对银钱十分贪著，死后变成一只蛤蟆，用爪子紧抱住银块不放。）某些人因为贪著的关系，临终时很难断气。安多有位老喇嘛，平时爱吃酥油，死的时候很困难。", "贡唐绛贝央十分善巧，他要老喇嘛发愿往生兜率净土，并说那里的酥油比他们寺院里的好吃得多。老喇嘛闻言，立即断气。我们将来也可能会有类似的危险，所以，断除贪著是极为重要的。“对治力”，是指临终时要修强力的忏悔、防护。如果临终者是密宗行者，届时应修“自入灌顶”或求师灌顶，还净菩萨律仪与密宗律仪。其他人则应尽力善修忏悔、防护，这在平时就很重要，临终时尤其关键。否则，即便本来可以往生净土，也将因为这个障碍而去不成。“发愿力”，这不是指发愿往生净土等，而是发愿将一切有情的苦与罪障成熟到自己身上，以及发愿能生起菩提心。“串习力”，是指平时精熟于菩提心的修法，临终时因习惯的力量，在修菩提心当中往生，此外没有更高深的修法了。至于临终者的威仪，应效法大悲大师涅槃时的威仪，做右胁卧，以狮子卧姿去世。单是这一卧姿对往生净土也有很大的帮助。总的来说，下士道者应在修“归依”中往生；上士道者应在修“菩提心”中往生，如是等等。有人或许会怀疑，这些修法当中似乎没有往生净土之法，然而实质上绝对是有的。切喀瓦临终时命近侍急设供品，他说：“我原本发愿为利一切有情而去无间地狱，但是现在看来是去不了了，净土的景象已经出现。", "”格西博朵瓦也是这样圆寂的。以前有母女二人被水冲走时，彼此关心着对方，发起善心，结果受生于兜率天。又如，洛卡洽萨地区有一条皮筏因载物过重，快要破裂下沉时，有位邮差发起善心，跃入水中，他并未淹死，有彩虹贯照。如果临终时能清楚地想起殊胜善心，即便是造作的菩提心，亦能往生善处，当可无疑。我们往往对“嘿嘎”“呸”之类的迁识法很重视，并将出现迁识前兆看成是了不得的事情；其实，就算我们不修任何所缘，多练几次“嘿嘎”，头顶上也会出现迁识前兆等。这是风的活动，并不稀奇。修心迁识法中，虽没有“嘿嘎”与“呸”，但却是所有迁识法中最深奥者。修其他迁识法难说是否能在临终时关闭恶趣之生门；但如能以五力而往生，则保证不堕恶趣。", "五、修心纯熟之量诸法归一要薄伽梵所说的一切法蕴，都是用来对付我爱执的，法与非法的判定标准，即在于是否成为烦恼的对治。最殊胜的成就征相即在于能减轻烦恼，其他的成就相是没什么大不了的，因为兀鹰也能在空中飞翔，老鼠也能钻入地下，鱼儿也能在水中游泳。此修心法被称作衡量法与非法的天平，如果修法结果是烦恼的减轻，即达纯熟的标准。二证取其主做证明的有自己与他人两种。自己没有真正的修持却诈现有德，使别人误认为是持戒清净的修行人，这是属于内外熟与未熟四种庵没罗果中“外熟内未熟”的一类。好像潜伏的猫一样，善于弄鬼，不明底细的人于是误认这种人为善士。这种行为是要不得的。另外，也不要成为“内熟外不熟”那一类人，而要做到内外清净；因为外调伏，所以不会遭到他人的耻笑；因为内调伏，所以自相续富有修持。菩萨对外在的威仪要谨慎，尽力摈除会招致不好名声的言行，如所谓“于恶声誉不护雪”，要做到问心无愧，这是很重要的。常怀欢喜心当我们富有时，会被攒积、守护财产的众多念头搞得心神不宁；贫穷时，又要辛苦追求无法休息。若能如此思惟财物的过患，就可以将任何妙劣缘都转化为道，快乐而知足。", "同样地，对毁、誉等八法等量齐观，快乐的时候观察一下为什么会快乐，痛苦的时候分析一下为什么会痛苦，就不会愁苦忧恼了。", "散乱亦能主骑术不精的人，在精神集中的情况下，还不致于被马摔下来，但精神一散乱就很容易摔落马下；而擅于马术的人，纵然在散乱时也照样能坐得安稳。同样地，修心尚不纯熟的人与不会骑术的人一样，在心思散乱的时候，别人骂他会先发怒，提起正念后才消除怒气；修心纯熟的人，纵然心思散乱，任凭别人如何打骂，也不会动怒，此即修心纯熟的标准。纯熟量为倒死无常心的纯熟标准，是对现世虚荣丧失兴趣；出离心的纯熟标准，是对生死盛事不生羡慕；同样地，修心纯熟的标准，即是将我爱执颠倒过来。五大纯熟相痛苦与伤害等出现时，自心不为烦恼所动而能心平气和地接受事实，此为“大苦行师”；珍爱他人胜过自己，此为“大菩萨”；一切威仪不逾十法行，此为“大沙门”；不染丝毫罪与不善、调柔而住，此为“大持律师”；与真正的大乘道相应，此即“大瑜伽师”。成功的修心法行者会成为这五种人。六、修心三昧耶修心三昧耶共有十八条：1至3为“常学三总义。”三总义是指：1．修心与持戒不相违，不可以修心为借口而轻视毗奈耶等下级戒。2．修心不流于怪诞，不应借口修心，貌似无爱执而无所顾忌地去触怒人与非人，如做斩树妖等狂行。", "3．修心不分党类，不可只容忍亲友而不容忍仇敌、只容忍人而不容忍非人等。4．“心改身如故。”我们不应让心持续刚强难调，而应设法改善、使它逐渐调柔。上者当求在今日改变；中者当求在本月改变；下者当求在今年改变。否则，即便出家之后上了年纪，心还是与出家之前一样。我们的心不要像屋子后面的大岩石那样固执不变。至于要用什么来改呢？当修菩提心、出离心、无常等，外在的举止仍须维持平常的样子。内在的功德连五分钱也不值，外面的举止却又显得冠冕堂皇，如眨眨眼皮以示深入禅定的样子等，这是不对的。我们不应有这样的矫饰，而应以寂天菩萨、圣槃陀迦等为榜样，体验与进步只在心上面表现出来，外表则不露声色，不让任何人知道自己修道的进程，而臻断证功德的高峰。（帕绷喀大师又举例说：吉祥月称外表与普通班智达一样，从不突显自己，内在却已获得能从绘画的牛身上挤出乳汁的成就。）这些大师都是韬光养晦的典范，噶当派的祖师们也是专重实修，从不在口头上大肆宣传他们所获得的成就。此外，如同向他人炫耀摩尼宝会招灾一样，表露自己的功德也会招来许多障碍。我们与世俗人一样地流于现世，修一点点法，也要跑到山顶上摇旗呐喊，唯恐他人不知，这样做是不对的。", "应当遵循阿底峡尊者噶当派的宗风，像置灯于瓶中一样，将功德隐藏起来。5．“勿说缺支节。”意谓不谈论别人的过失。6．“莫思他人事。”不观察他人的过失，而应细审自己的缺点。否则，专找别人过失，例如法友扎仓、康村里的僧人等，那么自然连大师佛陀也不免有过失可责。如此一来，就难免会造成轻蔑、毁谤等，所以不要去挑别人的毛病。", "7．“先治重烦恼。”自己相续中哪一种烦恼重，就先对付哪一种。比如说，贪烦恼重的人，应修不净观来加以对治。8．“不求于果报。”不要做了某种善事，就希望得到善报与好的异熟果。9．“莫啖杂毒食。”不食搀杂有我爱执毒素的善食。10．“不可讲情义。”烦恼生起时，不可对之容忍讲义气，而不加对治。11．“勿作世诤骂。”如“沙门四法”中所说，当他人辱骂自己时，不报之以辱骂。若不具足四法，即不成为沙门，这些都是我们曾在亲教师与轨范师面前承许过的。所以，对方骂我们是“老狗”时，不要回骂他是“小偷”；别人打我们一下，不要回打两下等等。12．“勿俟于狭路。”不可为了报复，在别人有难时落井下石，以报宿仇。世俗愚人将当面陪笑、内挟仇恨的谄诳视作机灵聪明，我们是修行人，行为应当与世俗人有所分别。13．“不可刺其心。”当我们获悉别人的重大缺失时，不要在大众之中侮辱当事人，不要说刻毒的话刺伤他的心；以此为例，也不应做出念诵猛咒惩罚非人等事。14．“莫推诿他人。”自己做了不对的事情，不要耍花招移花接木，或是诿过于人。15．“莫作经忏用。", "”此修心法是用来降伏我执的，若用来对付非人的侵扰和获取名闻利养，反而会导致我爱执的增长，所以，要避免用作经忏之类的错误用途。16．“众利勿争先。”对于公共财物，不要设法抢先获得，也不要设法先取得最好的部分。17．“天莫变成魔。”不要把修心法变成我爱执的助缘而非对治，否则，即是天变成魔。18．“乐莫求他苦。”不要为了自己的快乐而希望仇人倒霉和死亡，亦即不要将自己的快乐建立在他人的痛苦上。上述内容为十八条三昧耶。七、二十二条学处1．“一贯众瑜伽。”本法行者不需修许多种善行，而应时时将一切行持与自他平等相换心结合起来。例如在进餐时，因为已将自身布施给有情，所以应该想到：“为了利益有情，我现在需要吃饭来滋养这个色身。”其他一切威仪可依此类推。此外，在念诵密咒与嘱托护法成办事业等时，也都应以此心为基础。2．“一除诸障难。”正如在药物无效时，医师要用针灸那样，此平等相换之心能以一当百，治愈一切烦恼疾患。3．“初后修二事。”改正动机与回向二事，是一切善行之初与之后所应做的。我们也应在早晨起床时发愿，并在日间随时观察自己的行动是否与之相符。4．“二境皆安忍。”不论是苦是乐，都不能舍弃修心的修持。", "有些人因升官发财等，有了享乐就退失正法；有些人因遇到仇人等，受了痛苦就退失正法。", "5．“舍命护二戒。”防护佛法总的三昧耶与修心三昧耶，纵然舍弃生命也在所不惜。6．“勤学三难事。”“三难事”是指：认识烦恼难、修对治难以及断除难。对这三件难事，要努力认识并修学。7．“取三主要因。”“三主要因”为：值遇贤善师长、自心堪能、衣食顺缘具足。我们应当发愿获取这三个修法的主因。8．“修三不退失。”不可退失信敬师长、欢喜“修心”、以正念、正知守护学处这三件事。9．“具三不舍离。”不应该让身、语、意三者空闲松懈，而应督促三门勤修善业。身之善行并非仅限于顶礼、旋绕等，即使端身正坐也是善行。10．“于境无偏党。”不可将修心的对象做怨家、亲人，或是有情、非有情等的分党。11．“周遍且深透。”修心要像切喀瓦那样，从心底发起且遍及一切对象。12．“特殊尤常修。”对于一些特殊的对象，例如难修安忍的怨敌，以及师长、父母、室友等，要单独分开来专修。13．“不待众缘备。”修法不应考虑衣、食等顺缘是否具备，不要沦为下面颂文所说的那种人：腹饱日暖法相严，恶缘临头变俗人。14．“今当修主要。”我们现在所修的菩提心等法，虽然难生，却利益弘大。修这些法是为了成办自、他二利，而非为了现世的目的。", "（帕绷喀大师进一步指出：我们应重后世更甚于今世，重正法更甚于世间法，重修心法的修习更甚于其他法的讲说。15．“远离六颠倒。”六颠倒依次为：“安忍颠倒”，能忍受世间俗务的辛苦，反而对修法缺乏毅力、吃不了苦。“味著颠倒”，对闻、思、修等法味不知爱乐，反而对世俗言谈、商务、军事等极感兴趣。“悲心颠倒”，对有罪之人不修悲心，反而对为法苦行者心生悲悯。“希求颠倒”，心中不求修清净法，反而垂慕世间的快乐、财势。“照顾颠倒”，不教学生们能利益后世的正法，反而让他们学习经商、诉讼等对后世极有害的事情。“随喜颠倒”，对自他之善与他人的快乐不生随喜，反而对不善遭遇与仇人之痛苦随喜。以前有一个比丘，得知对手犯了“他胜”罪后心生随喜，格西博朵瓦听说此事后指出：随喜者的罪要比当事人的罪更加重大。16．“莫轻尝便舍。”有时我们听师长说法，会生起冲动的出离心，连着好几天拼命用功、勤修一切善行。但过了不久，便感到厌倦而放弃了，这种时做时息的做法应当避免。贡巴仁钦喇嘛曾说：眼光要放远一点，心量要放大一点，情绪要放松一点。修善行要做到松紧有度、从长远考量。", "（帕绷喀仁波切进一步开示说：先从“起瑜伽”开始给自己立下规矩，以后再逐渐开广，这样较易有成就，如“虱子与跳蚤”之寓意所示。）17．“斩绝专修习。”此句有人解释为全心投入到“修心”的修持中，但更确切的意思是：如同医师为病人放血时，皮肤血脉同时做深度切入那样，“修心”与自相续也要做到“彻骨透石”。18．“观察令解脱。”对修心法应以寻、伺做观察修，从而断疑解惑。哪一种烦恼较重，即应修相应的对治法来对付。19．“不思有所恃。”为了利益有情而修行是我们的本份，而且自己也已经立誓要这么做，所以不能因此而居功自傲。20．“气量勿狭小。”不可暴躁生气，不要因为当众受辱等而发怒。21．“莫须臾便舍。”不要像春天的天空须臾变化，不要随着细小的外缘变化而时喜时怒。22．“勿著于声誉。”帮助别人时，不要指望别人回馈。上述内容为修心学处。如果能够做到以上所说，纵然身处“寿浊”等五浊厚重的时代，也能将恶缘转成菩提道。此一教授是由金洲大师所传承下来的。切喀瓦本人说，他在修了这个法之后，满心喜悦、死而无憾。除正见部分之外，至此我已将《修心七义论》讲述完毕。虽然有许多释论是按照噶当派早期祖师的见地来讲的，但是不可凭信。", "《修心日光论》中的正见内容，是根据中观应成派的见解，应遵照应成派之见来思惟。据说金洲大师最初是持唯识派之见，后来亦改成中观派。（帕绷喀大师最后开示说，讲道次第“经验引导”时，“发心”以前的内容应重复讲三、四遍，在这之后则不需要了。）512掌中解脱菩提道次第二十四天教授"]}, {"c": "第二十天", "segs": ["第二十天六度总说0u\u0017lA+°\u001aØ79C×\u0004\u0002\u0003*T0u\u0002>î7\u0016C×\u0004\bB\u0017\u003c\u0006¢\u0004\u00025\u0015æ\u0017lL,+°\u0003H>«U\u001aØ\u0003·\u0015æ\ 履行之道全都包括在六度行之中，除此之外，显密经续中并未言及其他内容。并指出这样的道就是“道次第”类著作所开示的内容。然后，大师简要地讲了改正动机之法，回顾了以前已述的各节科判，并重讲了一遍“转恶缘为菩提道”与“开示一生修持之总纲”等内容。在讲完“发菩提心之理”后，大师暂时将“（已二）以仪轨受持发心”一节跳过，留待后面再讲。）如果没有菩提心却想成佛，纵然修大印、大圆满、中观、生圆次第等任何法，也照样进不了大乘之门，更不要说能稍微向佛位靠拢一些了。因此，所有人都要将菩提心作为修持的中心。诸佛以一切智经多劫观察，发现没有比这个更殊胜的方便，也没有任何不需要菩提心之道可修。戊三、既发心已学行之理仅仅有发心是不够的，还需要学习菩萨行，就像某人想去印度，假如不动身踏上旅途，终究无法抵达。想获得佛的法、色二身，必须双修福德、智慧两种资粮，学习方便、智慧互不乖离之道。", "佛子行总结起来，可包括在方便、智慧两类之中。方便即前五度，智慧即最后一度、或称毗钵舍那。此科分两大段：（己一）成熟自相续学六度之理；（己二）成熟他相续学四摄之理。己一、成熟自相续学六度之理此科分三段来讲：（庚一）总学佛子行之理；（庚二）别学后二度之理；（庚三）学不共金刚乘之理。庚一、总学佛子行之理此段分六节：（辛一）学习布施之理；（辛二）学习净戒之理；（辛三）学习安忍之理；（辛四）学习精进之理；（辛五）学习静虑之理；（辛六）学习智慧之理。辛一、学习布施之理欲舍身、受用及善根之心，即布施的体性。细分的话，有三种：一、财施；二、法施；三、无畏施。一、财施大到生命、小到一勺子糌粑，都可以用来布施。如果不想施舍，便应做如下思惟：“我以前受生为梵天、帝释、转轮王等时，虽然财富众多，却不做布施，未获取任何有价值的事物，所以现在的情况才会这么糟糕。”现在便应布施，不求回报、不求好的异熟果。如果能以菩提心为动机，即便向穷人或虫蚁等布施一口食物或少许干净的糌粑，也将成为布施波罗蜜多的修持及佛子之行。为了保证布施的果不致削弱，布施的物品要尽量让布施的对象感到满意。", "当我们向三宝献大供养时，往往会有傲慢心，以为自己的布施很了不得，这是不清净的布施。同样地，在施舍之后感到懊悔，心想“我给了太多”或是“给错了对象”等等也是不对的。在布施之始与布施之末，都要认真地纠正动机，以确保有利益有情之心，并做强有力的发愿。所做的布施不论大小，都不能有想获取名利等自私的念头。二、法施以饶益心为想听法的人开示四句偈以上的法，即是法施。为学生讲解经论也是法施，并非一定要被称作“师长”、登上法座正式开讲才算数。与其他布施相比，法施最为殊胜。我们在背诵经书的时候，可以想象善品天神等一切有情坐在周围听法，这样做也是法施。如果连虫蚁等也能因听到法音而熏留习气，其他高级的有情就不必说了。在施主家念经等时都应这样观想。我们出家人在做经忏时要特别小心，将大悲大师所说即生成佛的方便——密法——用来谋取利养恭敬，这是为财卖法的行为，无异于将国王从宝座上请下来且强迫他去打杂。做经忏法事必须要有良好的动机。正式说法固然是法施，然而在平常谈话之间，若能直接或间接地将他人引入佛法，也同样是法施。出家众当以法施为主，若能不费力地获得钱财，也应做财施。", "但格西霞惹瓦曾对出家人说：“我不为您说布施功德，而说悭吝过患。”三、无畏施释放在监牢中受苦者，拯救落水者，冬夏时节保护虫子等动物免受寒、热之苦等等，都是无畏施。修无畏施不需要跑到很远的地方，对自己身上的虱子就可以做这样的布施。譬如拯救落水的虫蚁，不过是举手之劳而已。", "“修心”法中所修的那些“舍”所缘，也是布施的修持。布施波罗蜜多的主要含义，如《入行论》中所说：若除众生贫，始成施度者，今犹见饥者，昔佛如何成？布施并非指消除有情的贫穷或克服悭吝而已，因为这些是声闻、独觉阿罗汉都能办到的。其正确含义当如《入行论》中所言：一切有及果，心施予众生，说名为施度，故施即是心。亦即通过思惟布施功德与不施过患，将自己的身体、受用、善根毫无悭吝地至诚施舍，并将布施之果也施予他人，这样的心修习圆满，即称为“布施波罗蜜多”，所以说，设法使施舍心增长是很重要的。假使有穷人来乞讨除三法衣外等物品，我们应该毫不迟疑地立刻生起能舍的心。这也要等到惯熟之后才做得到，所以应从细小的物品开始逐渐修习，增长舍心，直到最后连身体也能不费力地施舍。增长舍心的方法之一是思惟无常：自己死亡的时候，财物等一件也带不走，全都得遗留下来徒然浪费掉。倘若能将这些东西至心回施给他人，不仅比较不会犯爱著自利而受用等堕罪，而且也是修布施的一种方式。然而，除了有舍心之外，还必须尽力做实际的布施。当乞丐前来乞讨时，我们应尽力施予。在缺乏布施之物时，不能以邪命的方式去谋取。", "总的来说，前三度是在家众的主要修持，所谓：如是施等三种法，如来多为在家说。尚有不可舍之物，例如身体，因为我们目前施心尚未纯熟，不应施舍身体，而应致力于增长舍心。如《入行论》中所说，将来能像施舍蔬菜一样毫不困难地施舍身体，那时候才是施身之时。所谓不应舍，是指在地点、时间、施物等方面特别禁止的东西不可用于布施。出家人不可将自己的三法衣等布施出去；不可在下午向出家人布施食物；不可向婆罗门等有饮食规定者布施葱蒜等不净物；不可布施有恶臭之物；不可布施经书给在教义上向佛教挑衅的人；不可布施毒药和兵器给欲寻短见之人；不可为非器之人开示密法；不可为损害圣教与有情的罪人脱罪卸责等等。此外，我们也应学习让所做的布施不为下列过失所染：以为“布施无善果”的邪见；为了救护一个有情而罔顾众人造成的利小；以牲畜供施之类的恶见；轻视毁谤；想与他人竞争；傲慢心；想出名；怯弱；后悔以及偏党等。我们也应当学习《集学论》中所说的四法。与身有关的四法是：1．增长舍身之心；2．时际来到之前应保护自身远离违缘；3．不利用身体做不善业而使之清净。", "以上为“舍”“护”“净”三法，再加上4．“增”，以此身修善因，将来获得具足八种异熟功德的人身。与受用有关的四法：1．实际施舍或增长舍心；2．未遇殊胜田之前加以保护；3．不为邪命与罪恶所染，使之清净；4.修习布施增长将来的受用。与善根有关的四法：1．至诚施予有情；2．不为瞋恚所坏而保护之；3．不为希求现世快乐或只为后世不堕恶趣等自利的不良动机所染而清净之；4．以随喜增长之。", "辛二、学习净戒之理《入行论》中说：获得断恶心，说为戒度圆。对损害他人的念头及行为深感厌舍并欲断除的心即为“戒”，这样的心修习圆满即是“净戒波罗蜜多”。戒分三种：一、断除恶行戒（律仪戒）；二、摄善法戒；三、饶益有情戒。一、断除恶行戒（律仪戒）此戒以三律仪为代表。《菩提道灯论》中说：若常具余七，别解脱律仪，乃有菩萨律，善根余非有。此颂似乎明白指示，受菩萨戒需要有别解脱戒为前提条件。这是因为考虑到受别解脱戒者是受菩萨戒的殊胜身，如同密宗里面说比丘是最殊胜的修密之身。实际情况则不能一概而论，因为天与龙也能受菩萨戒。那么，到底应该怎样来理解律仪戒呢？如果受菩萨戒者具足别解脱律仪，那么与别解脱律仪共同的能断律仪是律仪戒；如果不具足别解脱律仪，则断十不善的能断律仪是律仪戒。菩萨相续中的断十不善戒与别解脱律仪，其体性据说与菩萨律仪不同。二、摄善法戒具足菩萨戒者对三门善业的一切努力，例如，向殊胜福田顶礼、供养、恭敬、侍奉；做闻、思、修；听、讲正法等等，简言之，就是能成熟自、他相续的六度万行。", "一切佛子行均能含摄在三戒之中，广义上讲，一切“道次第”都是为了增长这三种戒律。三、饶益有情戒此即“四摄”的行持等。饶益有情的方式分十一种：1．帮助他人的事业与受苦的人；2．帮助不懂方法的人；3．帮助曾有恩于我的人；4．帮助危难恐惧之人；5．帮助忧伤的人；6．帮助缺乏资具的人；7．帮助求依止的人；8．随顺他人的意愿而给予帮助；9．帮助入正道的人；10．帮助入邪道的人；11．以神通助人。除“以神通助人”之外，其他十种都是我们能力范围内可以做到的。简言之，一切以利他心为动机所做的三门诸业，都可以包括在此戒中。因此，即使我们不受别解脱律仪，也应学习断十不善等戒，学习六度以成熟自相续，然后学习各种可能的利他之行，此即学习三戒之法。辛三、学习安忍之理不受损害与痛苦干扰之心，即忍的体性。我们应当消灭瞋心，如《入行论》中所言：顽者如虚空，岂能尽降伏，若摧此瞋心，则如破众敌。如果不消灭瞋心，任由瞋心发展，就会造成十分严重的过失，所谓：罪恶莫过瞋，难行莫胜忍。忍分三种：一、耐怨害忍；二、安受苦忍；三、定解法忍。", "一、耐怨害忍耐怨害忍，意思是当仇敌伤害我们时，对之不生瞋恨而修安忍。为此，我们需要了解瞋恚的过患。瞋是不善之中最坏的一种。据说，每一念瞋心可摧毁千劫的善根。在明白了瞋恚的过患之后，应该生起精进，时常修习安忍。我们无法知道瞋恨的对象中是否有菩萨，如果对菩萨生瞋，过失将极为严重。《入中论》与《入行论》中提到，力弱菩萨对力强菩萨生瞋会坏百劫善根；非菩萨对菩萨生瞋会坏千劫善根。因此，修安忍是势在必行，而且应该在瞋恚未生之前或生起之时即加以克制，思惟过患，修习安忍。否则，瞋恚将使自他双方都不得安宁，甚至会让人结束生命，或增加许多敌人。有些人或许会想：“虽然如此，但是让我生气的对象太多了，所以我忍受不了。”如果这么想，应该思考一下《入行论》中所说的一个偈颂：怎得足量革，尽覆此大地？片革垫鞋底，即同覆大地。我们能否完全调伏所有的敌人呢？当知有情是无量无边的，所以敌人也永远存在、不可能完全降伏；然而，如果能够调伏自己的瞋恚，就不会有任何一个敌人，这不也就如同降伏了所有的敌人吗？在正确了解安忍的体性、差别、瞋恚的过患等之后，如果还是让瞋恚充满全身，那么所有的修持都将徒劳无功。", "有一个作弟子的，气愤地殴打一个小偷，他的师长出面制止时仍不住手，于是师长用手指戳他的鼻子高声说：“安忍！安忍！”他才想起了要修忍。倘若等我们怒气全发完之后，再假装修忍，那有什么用呢？虽然刚开始比较困难，但经过一段时间的修心，惯熟之后便容易了。我们有各种理由不应对损害我们的人发怒。譬如被人用棍子击头，不应对出手的人生气，而应想到：“如果要恨真正造成痛苦的祸首，应该要恨棍棒才是。”有人或许会想：“棒子是身不由己，受他人支配的。”那么打我的人，本身不也同样是身不由己、受烦恼支配才会动手的吗？所以，我们理应恨烦恼而不应恨那人。另一种理由是：我们之所以遭到棍击，直接原因是由于自己的不良行为，根本原因则是由于过去伤害他人等恶业所造成的。既然是自作自受，又何必为此感到愤怒呢？不仅如此，《四百论》中也说：能仁见烦恼，非具惑众生。正如医师或父亲不会因为被发疯的病人或儿子殴打而生气，反而会努力设法治愈他们；我们也不要对因烦恼而疯狂、身不由己伤害我们的人生瞋，而应努力设法消除他们的烦恼。此外，手被火焰烧灼，对火生瞋没有道理，因为是我们自己伸手去碰触火焰所造成的；", "同样地，我们对对手也不应生瞋，因为是我们自己去招惹的。正如热与燃烧是火的本性，如果害人是那个有情的本性，那么就像被火烧时不应瞋恨火焰一样，我们也不应瞋恨那个人。有人或许会想：“如果这是他的本性，恨他当然不对，但那是意外的从他发生的，所以我要恨他。”那么，当天空下冰雹时，是否也要责怪天空呢？这当然没道理的，所以也不应恨那个人。因此，受到别人打骂而身心痛苦时，不要去报复，因为那将成为恶趣痛苦的因，而应设法对治瞋恚，修习忍辱。《入行论》中说：于今少许苦，我若不能忍，地狱之苦因，瞋恚何不除？耐怨害忍只能对伤害我们的人修，而无法对帮助我们的人修。伤害愈多，修忍的机会也就愈多，所以，应该将伤害我们的人看成是增长安忍的助伴。例如，阿底峡尊者跟前有个性情恶劣的瑜伽师，别人劝尊者不要留此人在身边，尊者却说：“因为此人，我才能圆满安忍功德。”简言之，我们应当想到：“即使是以自利为目的声闻，也不会去瞋恨损害他的人；我既然自诩大乘行者，又怎么能生瞋呢？”（帕绷喀大师又讲了“忍辱仙人”的故事，鼓励我们要以他作为修安忍的榜样。）二、安受苦忍除了不贪安乐之外，还应将痛苦视为庄严之事而甘之如饴。", "如以前讲“修心”时所说的，应将一切痛苦，例如为法而承受的苦行、疾病的痛楚、不想遭遇的敌人，甚至梦中所受的苦等，都转成修法的助伴。将这些苦看成是消尽恶业的因；以此比知他人的苦而对之生起悲心；借此思惟生死过患等，来修习安忍。受苦的时候，应该想到此一痛苦能使今后恶趣的苦重罪轻报而感到高兴，就像死囚被改判斩手后获释，应当感到喜悦一样。为了消除病苦，就得忍受针灸之苦；同样地，我们应将为法所修的苦行视为恶趣众苦的抵偿，所以是值得的。此时也应忆念痛苦的功德，《入行论》中说：痛苦有诸德：厌离除骄慢，悲愍生死者，羞恶乐行善。不仅如此，对我们出家人来讲，虽然衣、食、住等方面的品质比较差，但应心想这是学习知足于简陋的法衣、乞食与卧具等四圣种的好时机，对修习苦行、少欲知足等增长梵行时所受众苦，都须安忍承受，否则我们便会去追求上好的食品与财富等，从而设法追求财富、不思正法，将这一生无谓地浪费掉。", "以前大师佛陀发现一堆宝藏，说道：“此毒蔓延迅速，其性极烈。”有个卖柴人听说后，便跑去观看，结果得到了黄金，因而致富。国王询问他致富的缘由，卖柴人谎言以对，国王查明事实后下令将他处死。临刑前，卖柴人口中喃喃自语：“此毒蔓延迅速，其性极烈。”国王问及话中之意，他才将事情的来龙去脉老实交代了出来，最后免于一死。正如故事所言，钱财就像毒品。倘若能做到少欲知足，一般僧人的生活自然不愁。例如，宗喀巴大师放下俗事专心修持，师徒九人身上只有八钱银子，但依然能少欲知足。如果衣服不是太过破旧，就可以穿；如果因为有福报而获得充足的衣食等，只要不妨碍修持，也是可以受用的。发生遭人非议等诽谤之事时，我们必须修安忍。此外，也应安忍身体保持端正等威仪的苦；安忍供养三宝等因修持佛法所产生的苦；不论外表再丑陋，穿着再粗劣，也都能舍弃对外在华美的追求，安忍因摈除五欲享受所产生的苦；安忍勤修善法疲惫生倦所产生的苦；安忍利益有情所产生的苦，例如：预见到保护濒临被屠杀的有情可能遭受的辛苦而加以忍受；安忍日常事务所产生的苦，如舍弃经商、务农等发财之道所产生的苦而加以忍受等。安受苦忍的涵盖面十分广泛。", "三、定解法忍《捷径》中对这方面讲得很详细。定解法忍包括：修习善行，实践关要；记持、背诵经论，从而分析处与非处的取舍、三宝的功德、所获的菩提、往趣菩提之道、无我以及深广法藏。在现阶段，我们对《道次第》的词义生起定解，也算是定解法忍。法相学人在辩论时思惟因明的义理，也属定解法忍。", "三种忍之中，第一种只有在伤害出现时才能修；后两种则在任何时候都可以修。例如，在法会中，我们应忍受听法时间过久等苦，专心听闻、思惟法义；上大殿或辩经院时，身威仪应保持肃穆，并忍受饥渴之苦；背诵经论时，应一心思惟文义。不仅如此，就是去做经忏时，也要具备后二种忍。辛四、学习精进之理热衷于修善业，即精进的体性，所谓：进者勇于善。这是完成任何善事业的殊胜方便。《经庄严论》中称精进为一切善法之最，且是出生佛位等一切功德之源：善资粮中进第一，由依此故彼后得，精进现得胜乐住，及世出世诸成就。精进能得三有财，精进能得善清净，精进越度失坏聚，精进觉悟大菩提。《入中论》中也说：功德皆随精进行。因此，当我们在诵经等时，不要像被征派的驴子被硬拉着往上走，而应兴致盎然地从事善业。刚开始的时候先从小事情做起，时间也不要太长，逐渐地修习，使精进力愈来愈大。精进的障碍为三种懈怠：一、推延懈怠；二、贪著劣事懈怠；三、怯弱懈怠。", "一、推延懈怠将所修的善业往后推延，今天推到明天、明天推到后天，日复一日，不生即刻修法之心。其对治法，应修死无常与暇满、利大、难得。二、贪著劣事懈怠对追求名利、凑热闹、开玩笑、务农、经商、缝纫、纺织等世间俗事与不善业不生厌倦，反而沉溺其中，这类事不能称为精进，只能说是刻苦。其对治法，当思惟生死之事毫无意义且为痛苦之因而加以克服，如《入行论》中所言：弃正法妙喜，无边欢乐因，汝何故反喜，散掉等苦因？三、怯弱懈怠怯弱懈怠的具体表现，例如心想：“像我这种人怎么可能成佛？”“怎么可能利益一切有情？”“怎么可能布施头与手足等？”其对治法，当思：“每一种佛法，例如暇满、难得等所缘类，纵使每一项都需花一生的时间，我也要耐心修习。”或想：“在这个世界上，那些忙于无谓之事的商人等，为了一点蝇头小利，尚需吃苦耐劳，如果我把同样的力气用在勤修菩提上，一定能够修成。”如《入行论》中所说：不应自退怯，谓我不证觉。如来谛语者，说此真实言，所有蚊虻蜂，如是诸虫蛆，若发精进力，咸证无上觉。况我生为人，能辨利与害，若不废觉行，何故不证觉？", "当思：“大师佛陀为谛实语者，既然佛说连蚂蚁也能成佛，那么像我这般生而为人、能言又解义，为何不能获证菩提呢？当然能够证得！”我们或许又担心说：“虽然如此，但修布施头与手足等苦行，则非我所能。”如果这么想，就再来看一下《入行论》中的几个偈颂：若谓我畏惧，须舍手足等，是未察轻重，愚者徒自畏。导师先令行，惠施蔬菜等。又说：若时于自身，觉如诸菜叶，尔时舍肉等，于此有何难？当思：“我从小事情做起，等熟练之后，觉得布施头颅、手足与布施蔬菜差不多，到时再布施，就不是件难事了。”如此思惟，生起勇悍。如果因为佛的功德无边，而担心自己难以修成，就应当想能修之道也同样既深且广、无量无边，只要实修，必能证得。有人或许又会说：“为了利益有情而去地狱，这种事似乎太难了。”《入行论》中对此的答复是：恶断故无苦，善巧故无忧。断除罪恶者无苦亦无忧，所以，为了利益有情而住在无间地狱中的修行者，不会感到不快，而且还像进入净土一般快乐，因为“不遇未造业”是业果的一项原则。精进有三种：一、披甲精进；二、摄善法精进；三、饶益有情精进。", "一、披甲精进如《供养师长仪轨》中“假使为利一有情，无间火内经劫海”等所说：假如为了每一位有情，必须在无间地狱的烈火中各住上数十万劫，我也能忍受。如此修习安忍意乐。修密法时，则必须想：虽然我们自己能够忍受，但对有情而言，受苦的时间太过长久，所以应该像儿子救落水淹溺的母亲一样，以尽速救苦的急切之心投入修法。上士道的“披甲精进”，是修习为利有情甘入无间地狱之心。有人或许会认为，这与中士道发解脱生死之心互相抵触；事实上并无矛盾。菩萨也应害怕因业烦恼的力量而受生恶趣，否则，别说是利他，就连自利也成就不了。但在已精熟菩提心、已无所畏惧之后，以悲心与愿力欢喜受生，就没有丝毫的痛苦与忧伤。（帕绷喀大师指出：当我们感到利他太难，或怕因此导致所修之法退转等时，应学此“披甲精进”。）二、摄善法精进即勤修积净、供养、六度万行等。三、饶益有情精进勤修“四摄”即其代表，此与“饶益有情戒”相似。精进的后两种，与净戒的后两种、安忍的后两种似乎没什么区别，可以混合一起，但也可以就一事之上，从勤奋、想修、想断不顺品这几方面分开讲。因此，即便修一座“生起次第”，如果能怀着菩提心来修，也将具足六度全部的修持。", "（最后，帕绷喀大师大致介绍了一下静虑与智慧二度的体性，详细情况留待后二度时再讲。）530掌中解脱菩提道次第二十四天教授"]}, {"c": "第二十一天", "segs": ["第二十一天（嘉杰·帕绷喀仁波切先引述补处菩萨弥勒怙主的话说：初依听闻如理作意生，如理作意复生胜义慧。然后概述了前行做法，回顾了已讲的各科，并将“总学佛子行之理”当中的布施等前四度简略复讲了一遍。接着说：）庚二、别学后二度之理此节分两部分：（辛一）学习静虑体性奢摩他之理；（辛二）学习智慧体性毗钵舍那之理。辛一、学习静虑体性奢摩他之理这部分又分六小节：（壬一）依止奢摩他资粮；（壬二）正修奢摩他之理；（壬三）依此修九住心之理；（壬四）由六力成办之理；（壬五）彼中具四种作意之理；（壬六）由此生起正奢摩他之理。我之所以没有在中士道阶段讲定学与慧学，是为了放在后二度当中来解释。奢摩他本身的体性与外道所讲的相同。虽然外道认为奢摩他是色界定与无色界定修持中最低的一种，但如果怀着出离心来修，即是解脱的因；怀着归依心来修，即成正法。假如缺乏奢摩他，那么显教的空性与密宗的生圆次第等高级的“修所成”证悟也无从生起。想要生起任何一种显密三摩地功德，都需要有奢摩他，这就像想倒水不能没有盛水的容器。因此，先成就坚固的奢摩他是很重要的。", "单是为了斩断生死之根、获得解脱，也需要生起证空性的毗钵舍那；为了生起毗钵舍那，必须先生起坚固的奢摩他。因为明见空性之义首先要有坚固的“住分”。比方说，为了看清楚黑夜里的壁画，需要一盏既明亮又不会遭风吹熄的灯。不仅如此，当我们成就奢摩他之时，很容易就能改善修暇满、难得、无常等的证德。《菩提道灯论》中说生起奢摩他是为了成就神通，这不过是举其一例而已。生起奢摩他的主要用意，如寂天菩萨所说：知具止胜观，能灭诸烦恼，故应先求止。这才是成就奢摩他的用意所在。因此，最初应当先成就奢摩他。再者，奢摩他不一定要放在“发心”之后修，在“发心”之前亦可。如果奢摩他成就，修三乘的任何一种法，都会有极大的进展。壬一、依止奢摩他资粮首先应该准备修奢摩他的资粮，资粮不具足，奢摩他就修不成，《菩提道灯论》中说：失坏止支分，虽励力修习，纵经数千年，不成三摩地。依止奢摩他资粮有六个方面：一、住合宜处；二、少欲；三、知足；四、断诸杂务；五、戒律清净；六、断除贪等分别。一、住合宜处修奢摩他的地方应具足五种功德，亦即《经庄严论》中所讲的：具慧修行处，善得贤善处，善地及善友，瑜伽乐资具。", "假如我们不能很容易就获得如法的生活来源，必须跑到城镇里头去。所谓“善得”，意为如法地获得。由邪命所获得的食物，或接受罪恶之食，师长称之为“恶得”。因此，“善得”是指容易获得食物，又不搀杂重罪。所住的地方，当选先德曾经莅临加持过的，因为对初业行人来讲，是由地加持人。如果没有这样的条件，至少这一地区没有破誓者居住、也未曾发生过扰乱僧团这类事情。不要住在有野兽、强盗、凶猛非人出没的地方，而应住在有加持力的“贤善处”。如果我们自恃胆大而随便居住，很有可能会受到外来的侵害。例如，过去有位师长曾在某地遭厉鬼算计。如果修行的地方有非人居住，我们不能将他们赶走，而应以温和的方式调伏其相续，这很重要。所谓“善地”，是指不生寒病、热病，且水土合适的地方。我们当与见、行一致的人为友，有道是：“结伴第二阴影友”，这句话并不是说，我们只能有两个朋友、或是独居，而是指与自己同志者为友。初业行者离友独居是很危险的，法友不能少于三个，如果见行一致的话，法友众多亦无妨。不论是多是少，法友应该是能给予我们警告的眼神，而不是放荡不羁的人。“声为静虑之刺”，所住的地方白天应听不见人声、夜间应听不见狗吠或水声。", "根据我师长的说法，“乐资具”也包括对所修之法以闻思断疑、条理井然，亦即具足修法所需的灌顶、引导、法本等条件，最主要的，是要精通所修的内容。现在的人多半先考虑如何安排生活，然后才发现对真正要修的法所知不多，于是临时抱佛脚，去找人占卦等。我们不要如此，而应认真地将所修之法准备妥当。二、少欲对衣食等不求好、不求多。三、知足对获得粗劣的衣食应当知足。如果不能做到少欲知足，就会贪著享受，忙于攒积、照顾财物等事，而无法生起三摩地。四、戒律清净总的来说，戒是一切功德的基础；特别来讲，息灭微细的内散乱，先要断除粗显的外散乱，如果分别粗重，内心是无法保持宁静的，所以要以戒来制约、平息身语的恶行。五、断诸杂务如果杂务缠身，我们的时间就会花在无意义之事和谈话上面。为了生起静虑，必须做到少事少业以减轻散乱。少欲知足，就自然能做到少事少业。一心专修的时候，历算、医药、占卦、经忏等均属杂务而应断除。这些事不仅对我们这些初业行人，就是对大德们也极有害。（帕绷喀大师举例说，白哈尔魔为了加害布顿与喇嘛荡巴两位而供养铁笔，致使他们在生前忙于研究历算、用尽上千支铁笔而未能成就殊胜悉地。", "）菩萨妥美桑波因修习慈悲心，所以白哈尔魔不能加害于他。宗喀巴大师著有十八函文集，但在书首标题不使用“三文对照”的体裁。大师并非不懂梵文，而是担心这样做会影响修行。", "我也曾花一年时间去练习基本运算，练到手指磨破、好几块粉板的表面磨坏，但这些都是杂务，对修行并无帮助。如果勤学这类事物，除了这方面的习气之外，是无法留下增上生与决定善的习气的。因此，我们要修习有真正价值的东西，不要贪著甘蔗皮而丢掉蔗糖。这些次要的学问意义不大，对此不必勤学。（帕绷喀大师指出，某些人上了年纪还在为五欲乐奋斗，这是很让人怜悯的。以前有个名叫“善顺”的乞丐，他将所得的如意宝转送给波斯匿王，说：“您是这个地方贪欲最深的人，所以最贫穷。”大师又讲了格西奔贡嘉打点行装的故事。）六、断除贪等分别我们应思惟五欲过患与无常的道理来克服贪等分别。如果具足上述诸因努力修习，成就奢摩他当不迟于六个月。壬二、正修奢摩他之理《辩中边论》中说依靠“八行”来对治“五过”：依止八行因，断除五过失。懈怠忘教授，沉没与掉举，不作行作行，是为五过失。成办三摩地的教授，无过于弥勒诸论、《五地论》、中观派《修习次第》等大论中的开示。因此，我们应当寻求这些教授来修。", "如果将这些大论当作只是用来讲说的法，而看重一些与大论不符的师长教授，或是简短的密籍、笔记、夹注之类，宗喀巴大师在《道次第广论》奢摩他章结偈中，说这类人不在有处求而偏在无处求，这样是找不到修行教授的。因此，忽视那些大论而随意轻信某位师长的言论和教授，即便一辈子在山洞里度过，大多数人也难免将微细沉没误为正确的修行，或是将缘心的奢摩他误为大密之道，因而堕入极危险的歧途。再怎么努力，也只是浪费自己的一生。许多被誉为智者的西藏大德，在见、修等方面犯有错误，有辨别能力的人仔细读一下他们的作品便能知道。宗喀巴大师在见、修、行三方面，均以印度最伟大智者、成就师的论著为准绳，并由至尊文殊亲自解疑，经大师抉择后所撰写的著作没有错误的污垢。所以，应该依靠这样的教授。如果看重某种大论中未说过的或与之不符的教授，便有生起某种以前从未听说过的证悟之险！因此，大到密宗生圆次第，小到基础三摩地，都要依据真实可信的论典中所说的奢摩他教授来修，断五过、依八行是必不可少的。第一过：懈怠懈怠的对治有四种：认识三摩地功德之“信”；希求三摩地之“欲”；努力修三摩地之“勤”；以及努力的结果“轻安”。", "所修的对象是三摩地，而修三摩地首先遇到的障碍，是不愿意修或无法持续的懈怠过失，其正对治为“轻安”。我们目前虽然没有轻安，但应该思惟三摩地的功德而起“信”，且应思惟散乱的诸般过患，《入行论》中说：虽久习念诵，及众苦行等，然心散他处，佛说无义利。在成就奢摩他之后，修善行时心与所缘对象将紧密结合，由此能迅速获得悉地；共同的神通、神变等也是依奢摩他成就的；睡眠将变成三摩地；烦恼减轻；尤其是从依止善知识法直至生圆次第的一切道将快速、顺易地生起。我们应当思惟这些三摩地功德而生起认识三摩地功德的“信”。获得“信”之后，就能依次引发“欲”“勤”与“轻安”，这四种有因果关系。第二过：忘失教授这里讲的“忘失教授”意为对所缘境失去正念，这是修三摩地时的最大障碍。如《中观心论》中所言：意象不正行，当以正念索，缚所缘坚柱，慧钩渐调伏。我们应当将心这头大象绑在所缘柱上，因此需要一种奢摩他所缘作为系心的对象。至于所缘境，缘任何一种法均可修成奢摩他。外道以石子或木块为对象，苯教徒以“阿”字为对象。修奢摩他的所缘境是意识的对象，并不是用眼睛观看来修的。有一派用眼睛观看来修奢摩他，这比外道与苯教更为糟糕。", "奢摩他当用意识来修、而非眼识，五世达赖喇嘛等众多大德均曾驳斥用眼识的方式。以前有个印度人，修其他所缘境成不了“住心”，后来以牛角为所缘境修习成就，这说明用任何熟悉的对象作为所缘境来修均能成就。虽然如此，我们仍应遵循宗喀巴大师的规矩，缘佛身修奢摩他。因为可作为积福、净障之田，所以最为殊胜。对修密宗本尊瑜伽也极有帮助，且有“随念佛”等重大功德。因此，我们观想从顶上师长分出一尊师长释迦牟尼，约拇指大小，停在正对自己眉间或脐间的位置，缘此而修；或观想自己转成释迦牟尼，缘此而修。有一类人感觉以无色为所缘境比较容易，所以可以用心作为对象来修。宗喀巴大师此一密意见之于《道次第略论》，后来由班禅·却吉坚赞在“甘丹大印”引导中首创修规。这一修法与他派的“观心本面”有点类似。我们也可以配合生起次第，缘天身来修；或是配合圆满次第，缘形如垂笔的短音“阿”字来修。另有四种奢摩他所缘：周遍所缘、善巧所缘、净行所缘与净惑所缘。修的时候，我们应该选择自己较易生起的所缘，在未修成之前不做更改。经中所讲的四种所缘不必全修，选择一种合意的所缘，将心安住其上即可。", "又如吉祥圣勇所言：应于一所缘，坚固其意志，若转多所缘，意为烦恼扰。修的时候应安住于单一所缘，改换所缘是修不成的。譬如摩擦燧木，如果一直换燧木，火焰是永远无法引燃的。不仅如此，在修奢摩他时，除了吃饭、睡觉及大小便之外，其他时间都要用于修持，就像不停地摩擦燧木一样，应当持续不断地修上一年半载等。如果修一种所缘觉得烦了，便换另一种所缘，或是隔个三天便休息一阵子，这样是修不成的。这里所讲的“教授”是指：先将或绘或塑的佛像特征记在心里，然后在心中现起所缘境来修，或是按照师长的指示，在心中现起某种特定的所缘境来修。若能现起所缘总相粗分的一半，即得所缘境。如果它从正念境中溜走，即是第二种过失——“忘失教授”。其对治为八行中的第五行——“正念”，就像手持念珠一样，应以强力正念持续“握住”所缘境。由于各人的正念有坚固与不坚固之分，所以成就奢摩他也有易有难。正念，如《集论》中所说：云何为念？于串习事，心不忘为相，不散为业。正念具有三种差别：1．境差别：正念只缘熟悉的事物，因此，所缘境必须是以前曾经见过、并熟记在心的；2．行相差别：不忘所缘行相，使之持续现起。譬如，当我们饥饿时，会对食物记忆犹新；", "3．作用差别：除所缘之外，心不流散于别的境上。因此，心中观想住于面前的佛像等，这是所缘，应以坚固行相保持所缘而不散乱，并且只允许这一种所缘在心中现起。第三过：沉掉在正修中以正念保持所缘境的时候，会发生第三种过失——“沉没”与“掉举”。分不清沉没、昏昧、掉举这三件事，就像对冤家仇人认识不清，所以先要加以认识。昏昧，是一种身心沉重、想睡觉的心理障碍。它可以是无记的，也可以是不善的；但不可能是善的。昏昧是沉没之因。沉没有粗、细两种。当以正念保持所缘境时，有“住分”但无“明分”，为粗沉没；所缘行相未失去、“住分”与“明分”俱存，但因行相力松弛导致“明分”无力，为细沉没。这是修止的主要障碍。所谓“无力”，是指有住分但心力变得松弛。此阶段于所缘境加强住分，将导致细沉没。明分“有力”是指心对所缘境保持紧张感。住分、明分与明分力的有无，好比拿念珠与捧茶碗时，用劲松紧的差别；或如平常对某位师长素有信心但并不强烈，间或生起不寻常的强大信心，这时候的行相要比平素来得有紧张感，明分力的有无与此类似。（帕绷喀大师指出，这点只能靠我们自己去体验，用语言是无法讲清楚的。", "）明分与澄分不是指境，而是指有境心是否明了或澄净。当明分未出现的时候，心似乎被障碍物所遮蔽。细沉没与三摩地两者都具有住分与明分，对这两者加以区分较为困难。有细沉没的人甚至可以做到停止呼吸、其心坚固达一昼夜。因此，过去有些藏人对此产生误解，提出“善缓即是善修”等赞语，这反映出他们对修行关要并不理解。如果将细沉没误认为正确修行，那么，连色与无色界的果也成就不了，现世中失念将变得严重；由于智慧将变得不明了，所以像是特为求生畜生道而修一样。掉举，如《集论》中所说：云何掉举？净相随转，贪分所摄，心不静相，障止为业。掉举能使心流散于可爱境或贪欲境，而回忆起可爱境或贪欲境，就像白天看戏、晚上仍能清晰地回忆起戏中景象一样。流散与掉举是有区别的。例如，由瞋恚心所导致对仇人等不可爱境的流散，以及修止时对布施、净戒等善境的流散等，这些属于流散而非掉举。既然流散与掉举两者同为奢摩他的障碍，为何单立掉举为障碍呢？这是因为流散于善所缘境与瞋恚境的机会比较少、时间也短，而流散于贪欲境则是日夜不断。由于掉举发生的机会多，或者说较易生起，所以只提及掉举。", "因此，修奢摩他时，不论心流散于可爱境或不可爱境，或流散于布施、顶礼等善境，两者都是修止的障碍，均应加以防止。所缘境在心境中消失为粗掉举；例如，观修天身时完全忘记所缘等，所缘境虽未丢失，但在心的一角，分别犹如冰下之暗流涌动、准备现起可爱境相，这样的掉举为细掉举。虽然正知不是斩断这些违缘的正对治，但也是对治的一部分。正知就像侦察敌军的人员，能够观察沉掉是否出现，所以应该依止正知，它是八行中的第六行。如果不间断地运用正知，也会对”止”造成障碍；如果根本不运用正知，则三摩地发生过失时我们也未能察觉，就像财宝被盗贼偷走却浑然不晓。因此，我们应将正知准备好，如《大印》中所说：及安住正知，心动即觉了。时时观察沉掉是否现起而守望之。《入行论》中说：应数数观察，身心诸状态，仅此简言之，即护正知义。当我们手捧一碗茶时，除了要用手拿稳，另外要注意茶水是否摇晃；同样地，我们要用正念来保持所缘境、行相要坚固，另以正知来观察沉掉是否现起，如此来观修所缘。正知是智慧的一种形式。第四过：不作行当沉没或掉举发生时，不加以对治是一种过失。", "此时不要放任不管，应立即运用粗、细沉掉各自相应的对治法来加以对治，亦即应当依靠八行中的第七行——作行之思。这好比侦察员发现了敌人，然后派兵将之击退。应该使用什么样的对治法呢？", "细沉没也就是退没，事实上，“沉没”或“退没”在梵文中是同一词的不同译名。因此，如果有明分与住分，但行相变弱、没有明分力而生起细沉没时，此时不需下座和放弃所缘，只要收紧心的行相即可。收得太紧则会生掉举，所以，松紧程度要适中。薄伽梵曾以琵琶弦为例说，弦绷得太紧或太松都不行，只有松紧合适才能弹奏出悦耳的音乐。当我们感到这样做会产生掉举的时候，便应略微放松；那样做会产生沉没的时候，便应稍加收紧。这两者的界限只能由自己亲身体验来决定，若不以担任侦察员角色的正知来做观察，其界限是难以确定的。月官论师曾示现失望相，说：若依精进掉举生，弃之则有退弱起，此情形中难修定，我心烦乱奈何之？譬如将敌人误认为朋友，因为难以识别，所以格外危险；沉没很容易与三摩地混淆，如果犯有这一错误，那将十分危险。因此，必须着重于加紧力道。但如果将心收紧而仍失去明分力，心变得死气沉沉或是行相不明了，此时若不设法消除，便会导致粗沉没，如《中观心论》中所说：退没应宽广，修广大所缘。此乃过于摄心之过，这时应当将心放开来修。如果这样做不能解决问题，则应放弃所缘而设法使退没的心振奋起来。", "此时可以思惟暇满、利大、难得，或思惟三宝功德、依止善知识功德以及菩提心功德等，使心振奋起来。也可以作意“光明相”与修“舍”所缘等。如果因此心不再低沉而清醒，便应回头来继续修先前的所缘。如果以前修心不够，临时则难有成效。否则，思惟已获暇满、难得之身等，就像在脸上泼冷水一样，会产生一种欣喜感。", "如果这样做还不能解决问题，便应使用强硬的方法：先在心间观想自心成一团白光，然后口念“呸”字，同时观想光团从头顶上出去、升到高空，与虚空混为一体。根据需要重复数次。如果问题依然存在，便应下座，设法消除产生沉没的因，如昏昧、睡眠、昏暗心态等。可以住在清凉处或登高远望、来回散步、用水洗脸等方法来消除。等清醒后，便应如前继续修所缘。细掉举是指未失去所缘境的心散乱，当收心太紧时，就会产生这个问题，所以应稍稍将行相放松。如果仍然无效而照样散乱，即生较粗的掉举，这是因为心情兴奋产生的，所以，应避免过于兴奋。太过兴奋是有害的，以前净饭王就因为此而无法获得预流果。此时无需下座，如《中观心论》中所说：作意无常等，息灭掉举心。应当思惟死亡无常、生死与恶趣苦等，让心减少兴奋，生起厌恶感。如果依然无效，则应使用强硬断除掉举的方法，这与思虑多者所修的数息观相似。呼吸时，心想“呼出”“吸进”，并默数为一，在心里记数。刚开始的时候，可能只能数到三、四次就无法继续了，此时应从头开始。如果能够数二十一遍保持心不散乱，即达成就第一住心的标准。", "以前耶巴地方有个大成就者，名叫彭措嘉措（圆满海），他的一个亲戚是第司·桑结嘉措的侍从。在第司主仆遇难时，彭措嘉措一时无法专心修行，后来靠数息观才得以成就。歇息之后仍不见效，此时应当暂时下座。刚开始修的时候，应决意只修一小段时间，如果时间拖得太久，以后看到禅座时，心里会生厌甚至呕吐！“在还有想修之心时即应停止”，如此话所说，像与好友离别一样暂停修习，是很重要的。譬如，两人好聚好散，以后彼此见面会感到很高兴。还有一种说法是：“明则明中停，不明则不明中止”，换句话说，感到再稍加修习便有好结果时，即应停止。这样以后便还有兴趣修，并且能从上次的修法获得经验而继续修行。在所缘境不明显的时候，虽经一再改正仍消除不了，此时再硬撑下去，也劳而无功，下次将在不明显中继续修习。以前，珠却·洛桑南杰传《噶当零散文集》时，当他念到“现今浊世乃调伏自相续之时，而非调伏他相续之时”处，忍不住失声痛哭，因不能继续传法而暂停，连续两天他都无法在断句处继续往下传。", "我们都希望在一开始就有稳定长久的住分，但因目前对所缘只能稍加接触而无法久住，所以应按教授所说，在一天之中划分十八座等修，每一座的时间放短，但要保证质量、没有沉掉。上座时间短而次数多，以后住分自然会来，届时再延长上座的时间。第五过：作行在没有沉掉两者的情况下修对治也是一种过失，其对治法即八行中的第八行——不作行之平等舍。在获得第八住心之前，沉掉是不会消失的。得第八住心时，沉掉已息灭，那时如果再观察沉掉是否产生并勤加对治，将对住心造成妨碍。因此，此时不再勤于运用正知，可放缓运用“行舍”。虽然以前有许多大德说明放松的必要性，但这些都是针对第八住心之后心已不为沉掉所控制、需要放松正知功用的情况来说的，而不是说在未到该阶段之前，任何时候都应放松正念与所缘行相的力度。某些先人提出的“善缓即是善修”，是不明白何时该放松的界限。在这之前放松正念是一种错误，不应听从这一说法。为什么呢？因为这种做法虽然能较快地带来住分，却容易流于细沉没而远离三摩地。上述教授除所缘境有别之外，修法自圆满次第以下均相同。正修奢摩他之法现在讲正修奢摩他的方法。我们先要具足奢摩他的资粮，如具足功德的修行处等。", "然后，以毗卢七法坐在安适座垫上。观想从顶上师长分出一尊释迦牟尼，约拇指大小，住于正对自己脐间的空中。所缘境起初并不明显，也不必太花力气去修。如果头、手足等支分总相，以及大略的金色等粗略形相现起，便以正念记持住，“心不散乱、紧握行相”。这个单一的修念法中，双具断沉与断掉之法，所以是大修行者们极为珍视的无上教授。具体说来，“紧握行相”可以断沉没；“心不散乱”能够断掉举。住分出现时，沉没极可能跟着来，因此，此时要提防沉没，保持明分，愈加紧握行相；明分出现时，掉举就可能产生，所以，要提防掉举而求住分。有些人装作会修行，却不明白三摩地需要具备哪些功德；三摩地应具有两种功德：住分与明分，其中住分是基础，明分是主体，而明分又是由紧握行相来修的。如先前所述，我们必须以正念保持所缘境不让它溜走，如果粗、细沉掉任何一种快要产生时，立即以正知觉察出来，各别以对治法加以阻绝。沉掉断了的时候，就不再用功对治，而一心安住于所缘境。此外，必须要保住极为明显而且有力的明分。如果按照“大印”来修，则所缘境与任持所缘境的心为同一事。就像牧童在放羊的时候，走到山里的羊与没有走失的羊都要注意；", "当分别生起时，观察它的体性而让它自动消失，或是以对治法断除分别，然后再缘明知之心，断除分别的方法有这两种。详细修法见之于“甘丹大印”引导，有兴趣缘心修奢摩他的人，应该去了解这些教授。", "壬三、依此修九住心之理想修定的人必须要有住心的体验，为此先要了解九住心的内容，亦即：内住、等住、安住、近住、调顺、寂静、最极寂静、专注一趣、等持这九种。一、内住心由听闻师长所说所缘境教授的力量成办。这一阶段只能短时间安住于所缘境而无法久住，所以不能持续。此时因为观心的关系，会发现容易受到散乱影响而感到分别比以前更多，但这并非是分别变多而只是分别被认识到罢了。二、等往心修习了一段时间之后，心住于所缘境的时间略能延长，例如，在念一圈“嘛呢”的时间内修行，可以做到心不散乱。在这一阶段，分别时有时无，可以体验到分别似乎在休憩。等住心由“思惟力”成办。在第一与第二住心阶段，沉掉众多而住分稀少，是具有四种作意中第一种作意“有励力运转”的阶段。在这两个阶段，散乱的时间要比安住的时间长。三、安住心安住心如同在衣服上打补丁，在持续安住所缘境的基础上，当心散乱离开所缘境时，能立即了知，然后重新修补，安住于所缘境，故称“安住心”。与前两个阶段相比，这一阶段中的散乱时间较短，并能生起强有力的正念。", "四、近住心这一阶段能生起强有力的正念安住于所缘境。由于从此所缘境不再丧失，所以要胜过前面三个阶段。虽然所缘境不会丧失，但有强力的沉掉，所以需要运用沉掉的对治法。第三与第四住心由“正念力”成办。从这里开始，正念就像成年人一样成熟了，或者说，正念力已告圆满。五、调顺心在第四阶段，如果摄心太猛，极有可能犯细沉没。所以，当生起有力正知而做检查，并思惟三摩地的功德让心活泼起来。此阶段与前两阶段的区别在于：在此阶段，粗的沉掉已不再产生。六、寂静心在第五阶段，如果让心过于活跃，便有生细掉举之险。一旦产生细掉举，必须生起能了知它的有力正知、视细掉举为过失而消除之。与前一阶段相比，此阶段已没有生细沉没之虞。第五与第六住心由“正知力”成办。从这里开始，正知力已告圆满。七、最极寂静心在第七阶段，由于正念力与正知力均已圆满，沉掉难以生起，但仍必须将细沉掉视为过患，生起精进力，尽力加以断除。这阶段与前两阶段的差别在于：此处已不需过于担心会流于细沉掉。虽然此阶段已没有太多生起细沉掉的危险，但仍需生起精进设法断除之。（帕绷喀大师指出，在第五与第六阶段有遭沉掉伤损之虞。", "但在第七阶段，沉掉虽生而以精进力能遮止，沉掉不再成为重大障碍。）第三至第七的五个住心，虽然住定较久，但仍为沉掉等所中断。", "因此，这些阶段具有“有间缺运转作意”。八、专注一趣在第八阶段，只需在座首稍加用功，便能在整座中不起任何沉掉。在这一阶段，沉掉就像被击败的敌人，它们先是有力量，然后力量逐渐减弱，最后彻底丧失。所以，从第八住心开始，可以不再需要正知的功用。在此第八住心，只需稍加用功便能保持整座不受沉掉等的中断，所以是具有“无间缺运转作意”的阶段。第七与第八住心由“精进力”成办。九、等持此阶段具有“无功用运转作意”。由于第八阶段不断地练习，此时不加功用而自然地成就。所以，此时不需丝毫努力，如同熟记功课者的念诵一样，能够全然进入三摩地中。此为欲界心一境性近似奢摩他。第九住心是“串习力”成办。上述九住心中，第一阶段有认识到分别的体验；第二阶段有分别在休息的体验；第三阶段有分别变困乏的体验。简言之，第一与第二住心有安住久暂之分；第二与第三住心有散乱久暂之别；第三与第四住心有所缘境是否丧失之异；第四与第五住心有粗沉没是否生起之分；第五与第六住心有需不需要提防细沉没之别，不仅如此，第六住心中的细掉举要比第五住心中的少；第六与第七住心有需不需要特意戒备细掉举之分；第七与第八住心有有无沉掉之别；", "第八与第九住心有需不需功用之异。在第七阶段，只需断除沉掉而不需担心会流于沉掉，这就像与敌人打仗时，当敌人的力量已被削弱，就不需再特别提防，只要稍加阻止即可。"]}, {"c": "第二十二天", "segs": ["第二十二天（嘉杰·帕绷喀仁波切先引述吉祥月称的话：世俗真实广白翼，鹅王引导众生鹅，复承善力风云势，飞渡诸佛功德海。然后解释说，要以世俗、胜义两种菩提心与两种资粮抵达佛地，必须听闻其中道理。经由这段讲说，大师简略地做了前行说法。在回顾了已讲述的各科之后，大师又将“学习奢摩他之理”中的依止五种或六种资粮、正修法、依止八行对治五过之理，以及由此成办九住心等情况重述了一遍。）壬四、由六力成办之理第一住心由“听闻力”成办；第二住心由“思惟力”成办；第三、第四住心由“正念力”成办；第五、第六住心由“正知力”成办；第七、第八住心由“精进力”成办；第九住心由“串习力”成办。详细情况已在前面九住心时介绍过了。壬五、彼中具四种作意之理第一、第二住心为“有励力运转作意”；中间五住心为“有间缺运转作意”；第八住心为“无间缺运转作意”；第九住心为“无功用运转作意”。四种作意分别立名的原因是：第一与第二阶段，沉掉很多而入定时间极短，还谈不上三摩地是否中断的问题，是须特意提起正念、正知的时候，故而立名为“有励力运转作意”。", "中间五个阶段并非不需提起正念、正知，但入定时间已逐渐延长，而且时常被沉掉中断，故而立名为“有间缺运转作意”。第八阶段只需在座首稍加用功，整座就不会被沉掉中断，故而立名为“无间缺运转作意”。第九阶段能不费力地安住于所缘境，故而立名为“无功用运转作意”。四种作意分别以其特色立名。壬六、由此生起正奢摩他之理获得第九住心之后，若能远离细微沉掉，不费力地长久入定，即能得近似奢摩他，但仍非正奢摩他。为了获得正奢摩他，必须进一步修习直到获得殊胜身心轻安之乐。两种轻安中，心轻安先生起；两种乐中，则身轻安之乐先生起。当身粗重风息灭时，会产生一种乐感，头顶内部似乎沉甸甸的，类似刚剃完头用温热的手抚摸。紧接着，属于烦恼品、于善事不能随欲而行的粗重消失，生起心轻安。此心轻安使一种能带来身轻安的风遍布全身，因而远离身粗重，生起对善事不再迟疑、随欲而行、轻快如棉的身轻安，由此生起以极悦意触为体性的身轻安的巨大乐感。此时，自身等其他景象均不现起，似乎都已融入所缘境中，生起心轻安的巨大乐感，心中欢喜踊跃，似乎不能将所缘境把持住。", "稍后，觉得心轻安的踊跃性减退，乐感也逐渐减轻，在这当中，获得与坚固安住所缘境三摩地相顺的不动轻安。与此同时，获得属于第一静虑近分无不堪能奢摩他。因为这是获得世间与出世间众多证悟不可或缺之道，故称“无不堪能”。之后再修习其后诸近分，而后再修习静虑与无色八定亦能成就，但因为意义不大，所以不必去修。外道们能断除“无所有处”以下所有烦恼现行，得“有顶心”，误以为已得解脱，但仅凭“有顶心”还是不能解脱生死。《赞应赞》中说：未入佛正法，盲痴诸有情，纵上至有顶，仍受三界苦。经中说：世人虽修三摩地，然彼不能坏我想，其后仍为烦恼扰，如增上行修此定。“增上行”外道多年入“有顶定”，出定后发现自己的头发被老鼠咬烂而发怒，结果定力退失并堕入恶趣。奢摩他的成就能带来许多好处：内心将变得极为清明，甚至墙壁等的极微尘的数量都能数得清楚；外界色等五境的五相、三毒的三相，加上男女二相共为十相，看到这十相中的任何一相，都能忆念起它们的过患而生厌恶；少有烦恼生起，纵然生起，力量也极微弱；由于住分深厚，甚至睡眠也将与三摩地融为一体，如此等等。", "现今有些自以为是的人企图不依靠大论，单凭一、两篇简短易解的文章，就想理解大印、大圆满等见地，却连大论中所说的真正的共同奢摩他也成就不了。再者，《大印根本文》中所说的“观心本面”修法，仅是对世俗名言心的体认。那些自认为修行很好的人，实际是将铜块当作金子来修，除落入邪道歧途之外，不会有其他成果。将沉没的累积误认为是修行，这样的修习非但不会带我们到上二界，反而像是刻意修畜生因。萨迦班智达曾说：愚者修大印，多成畜生因，或堕声闻灭，或生无色界。", "没有任何“三主要道”的基础，观察心以无色无形为体性，在所谓“前者不断、后者不迎”之中体认心性，这种自以为是的修法只是无意义地浪费一生，无法获得任何修道的进步。反之，如果有菩提心、出离心、正见与归依的基础，所修的法即分别成为大乘法、解脱法与佛法，应该修习这样的无谬之道。否则，纵有心性明空无执等证悟，也绝不能破除我执，最上者不过是得到“增上行”外道之类的结果，十分危险。必须避免将劣道误认为妙法，懂得如何分辨清净道与相似道。辛二、学习智慧体性毗钵舍那之理这部分共分三大段：（壬一）抉择补特伽罗无我；（壬二）抉择法无我；（壬三）由此生起毗钵舍那之理。壬一、抉择补特伽罗无我此段分两方面讲：（癸一）定中修如虚空；（癸二）后得修如幻化。癸一、定中修如虚空定中修如虚空有四种扼要：（子一）所破决定扼要；（子二）周遍决定扼要；（子三）离谛实一品扼要；（子四）离谛实异品扼要。成就坚固奢摩他之后，不要去修只能暂伏烦恼现行的世间道粗静行相毗钵舍那，因为我们所追求的主要目标是解脱，所以应当生起能断生死根本、观察无我义的出世间毗钵舍那。", "若能生起出世间毗钵舍那，纵然没有修上二界根本定，也能逐渐消除三有过患，《赞应赞》中说：若随佛教行，纵未得本定，魔眼虽监视，亦能断三有。", "为此，必须抉择甚深空性之义，否则无法获得解脱，其他的菩萨行也会染上执相的错误。譬如翅膀残缺的鸟无法飞翔，单有方便或智慧也无法前往佛地，因此，必须双学方便菩提心与智慧空性见，如宗喀巴大师所言：不具通达真性慧，虽修出离菩提心，不能断除有根故，应勤通达缘起法。经中也说，即便只是对空性生起“合理疑”，也能使我执像残破的布，或像被冰雹击倒的农作物一样。《四百论》中说：薄福于此法，犹豫亦难生；虽仅起犹豫，亦能坏三有。通达空性必备的资粮：依止正确了解佛经要义的大德、听取开示空性的教诫；积福净障；视师长本尊无别而祈祷等。必须具足这些在相续中生起正见的条件，否则无法通达空性。虽然印度佛教四宗的见地各不相同，但其中最主要的是中观应成派。此宗解释空性即为缘起，缘起即为空性。根据所化弟子理解程度的高低，大悲大师先开示独立实物有空，以破除补特伽罗我执；次为较高程度的弟子分辨诸法是否谛实有；次为高层次的弟子开示谛实无而自性有；次为最高层次者开示一切法无自性。因此，最后一种是薄伽梵的最上究竟密意。此外，我们必须追随怙主龙猛以求得正见，因为大师佛陀曾授记说：南方贝达城，比丘吉祥称，名称为龙者，能破有无边。", "这是说，在解释断有无边佛陀密意方面，无人可与龙猛相比。应该追随龙猛而求正见；虽然各随己意而创新的“甚深见”众说纷纭，但必须以龙猛密意来加以检验，符合的即为究竟见，否则即为倒说佛陀密意。藏地那些浅慧之人不必提了，就连印度大智者清辩论师与藏地班钦觉囊巴等许多大师也将正见的关要弄错。有些论师虽然追随龙猛，却不能通达他的密意。也有些人非但不追随龙猛，更加以驳斥。这种不依龙猛父子之规、不同于龙猛父子的臆造之见，月称批评说：出离龙猛论师道，更无寂灭正方便，彼失世俗及真谛，失此不能得解脱。如果另外有一条通往寂灭的门径，自然没有问题；因为没有，所以无法不追随龙猛宗规。追随龙猛的论师之中，以月称论师最为殊胜，阿底峡尊者曾说：如何得证空，如来记龙猛，现见法性谛，弟子名月称，依彼传教授，能见法性谛。藏地各派先德大多追随月称。虽然那些开派祖师本人的密意大多为应成见，但为顺应所化弟子的心量，说有各种不同的引导。后来的学人多半未能获得祖师们的真正密意，而逐渐将错误的观念搀入其中。", "文殊怙主宗喀巴大师也曾因为难以找到可从之研习究竟见的师长，在正见方面对西藏其他多数学者亦无信心，一度打算去印度谒见龙智论师、大成就者弥札等人，后经洛札大成就者力劝才作罢。通过洛札大成就者的转达，宗喀巴大师向金刚手询问了一些关于见地的问题，金刚手的回答收录在《答复·妙药甘露鬘》一文中——现在通行的版本有许多疑虑。宗喀巴大师对此未能满意，于是视师长与文殊无别而祈祷、长时间猛力地积福净罪、并修习各种所缘，三事合一，最后得以亲见文殊。", "总的来说，见本尊有三种情形：一、在风入脉时出现的景象中见到；二、在修行体验意识中见到本尊显现；三、根识亲见，像人与人见面一样。宗喀巴大师亲见本尊属于第三种，所以，他与文殊的交流就像师徒会晤一样。当时，宗喀巴大师询问了一些有关正见方面的疑难点，虽经至尊文殊解答，仍无法领悟。于是至尊文殊对他说：“去找仁达瓦解决这些疑难，但他也无法为你解决所有的问题。如果以我所开示的内容为基础努力研习，将来有一天，你会借由智者之论正确通达甚深见。”根据文殊的授记，宗喀巴大师后来勤修积资净障等法，由此亲见佛护论师，并因阅读《佛护释》而在相续中生起应成派究竟正见。宗喀巴大师曾亲见许多印度的智者成就师现身，但他对这些现象不以为意。经朵丹巴传达，至尊文殊对宗喀巴大师说：“不要忽视这些现象，依靠他们的论著，对你本人和他人将有极大的利益。”当宗喀巴大师正确通达中观见时，对大师佛陀生起了无比的信心，于是造了一篇短文，题为《缘起赞·善说藏》。后来，博东·巧勒南杰（战胜各方）听到一位朝山的乞丐念诵这个赞偈，起先以为是龙猛造的，后来又猜测是月称造。", "但在结尾部分听到有文句表明此论是依靠龙猛与月称的论著而造的，才知另有其人，于是向乞丐打听此论的作者，乞丐答复说是宗喀巴大师。博东巴因此对宗喀巴大师生起了不退转的信心，前来拜访，那时宗喀巴大师为了利他已逝往净土，所以未能见到。博东巴将金、银等原本用作见面礼的供品抛向空中，并且发愿。据说这些供品落到了兜率天上，这是段奇妙的往事。宗喀巴大师的善说是能阐明甚深义的无上注解。最初宗喀巴大师并未将那些印度论著当作抉择正见的标准论著。至尊文殊为他答疑时说：“月称是某佛刹中一位地位崇高的菩萨，具有极大的智慧与毅力，为了弘扬怙主龙猛甚深见的教法，特意来到这个世界上，他的论著不会有错误。”根据这个开示，宗喀巴大师才将月称的论著以及师长文殊的言教视为标准。对宗喀巴大师开示正见的著作进行闻思的时候，最初总会由于内容深邃而难以理解，通过不断地仔细研究之后，将会发现宗喀巴大师著作中许多殊胜的地方、清晰而甚深，为他论所无。因此，能有效地帮助我们了解空性而依次生起“闻所成慧”等。现在我以宗喀巴大师的意趣为基础，为大家简单地介绍一下正见。", "这里先要讲的是抉择补特伽罗无我之理，这是依据《四百论》的教授所安排的：先遮止非福，中间当破我，得断一切见，知者为善巧。此颂表明修行的次第为：先应在下、中士阶段破除执无业果的邪见；次破补特伽罗我；最后破法我。虽然两种无我所无的“我”没有差别，但基于补特伽罗之上的无我较易理解，所以先讲补特伽罗无我。抉择空性的正理有许多种，如“缘起”正理、“七相”正理等，但对初学者而言，最容易理解的是“离一异”正理。因此，宗喀巴大师及众多门人在这里均配合四种关要来讲这一正理。子一、所破决定扼要四种扼要中，第一种为“所破决定扼要”。如《入行论》中所说：", "不明施设事，不识彼无事。如果不先去认识所破或所无的“我”，便无法体认破此的“无遮”。譬如，不见靶子则无的放矢，不识盗贼则无法缉捕。所以，先要认清所破的我。这个我与所谓“无谛实”中的“谛实”“非自性有”中的“自性”“非从自己这边有”中的“自己这边”同义，此如《四百论释》中说：所言我者，谓诸法之不依仗他性，由无彼性，名为无我。意为不倚赖他缘而从它自己那边而有，或是说不依靠别的东西而由自己本身能够成立。光是肤浅地知道字面上的意思，在辩论时或许可以驳倒对方，但如果缺乏经验上的体认，我们还是不清楚什么是所要破的。譬如，光是嘴里讲“小偷是个穿白衣服的人”，是无法识别小偷的。因此，不可满足于基于别人解释而得到的理解，和对名词抽象的了解，必须透过自心观察，在直接的体验上加以认知。如果未能发现所破，纵然运用多种正理来成立无我，也有堕入破坏缘起之断见的危险。例如，有人将瓶子的名言定为目标，然后分析瓶子的口不是瓶、瓶子的底不是瓶，在排除了瓶子的各部分之后，找不到瓶子，于是以为了解了空性而去佯修一番。", "他们不明白在空性所依之上破除所破的差别，这样做只会破坏瓶子的名言而流于什么都没有的恶趣空，并走上臆造空性的歧途。寻求所破的时候，必须要探查俱生我执如何将“我”执为自性有，因此，要观察俱生心中我的显现理与执著理是怎样的。那时将会发现：我们所认为的这个“我”，不只是心所施设的，而是从蕴聚上面成立的。这一想法即是俱生我执，它深植于包括蚊虫在内一切有情的心中，甚至在做梦时也念念不忘。总之，在所依补特伽罗之上对“我”的执取有三类情况：一、已生起空性见的人认为，“我”只是由分别在施设所依之上所施设的，界定为无实；二、未受宗派学说影响的普通凡夫，对“我”是否为自性有不加界定；三、界定为自性所成。其中第二种是安立我之名言的合格心。作为此心对象的唯我在名言中是有的，也可以作为业果的所依。第三种则是对治所要破除的错乱识我执，其相之境是正理所破。据俱生我执显现理而起的“我吃饭”之类的念头，是对我的执著。若以未经观察之心所施设的我为满足，而作“我行”“我坐”等事，便是唯名言施设中作用得成的道理。", "俱生我执中“我”显现理的一部分也出现在安立名言我的心中，但此心中的俱生我执显现理，因与其他境相混合而不能清晰、如实地现起。所以，应当懂得如何区别我由自性自立的显现理，与“我”显现理这两者的不同。虽然我们心中一直有这个俱生我执伴随着，甚至在梦中也未曾离开，但在未遇外缘的情况下，它的显现理并不明显。当出现赞叹、诋毁等导致苦乐的重大外缘时，它就变得明显了。例如，当别人指控我们偷窃时，我们会因为受到诬陷而生起愤怒难以平息，抱怨说：“我无法忍受”。那时候，作为被指控偷窃对象，以及“我无法忍受”所指称的这个“我”的念头，从内心深处清晰、牢固地现起，此即所破之现起情形。同样地，我们可以利用喜、怒、哀、乐等情绪的回应，逼迫自心现前生起强有力的俱生我执，接着应当观察此俱生我执的显现理。好像俩人在路上结伴同行时，用眼角观察同伴与路况一样；心的主体必须安住在俱生我执的体性之中，使之现起所破显现理，另以心的一角来观察它。如果观察的心太猛，则会破坏俱生我执的执取力而变得空无或不明了，因此，以善巧方便来观察是十分重要的。", "在观察俱生我执之我如何显现时，它有时候似乎存在于身上，有时候又似乎存在于心上，有各种显现的情况，但这些都不是真正的俱生我执我相的显现理。当我们发现，在施设所依身心与所施设法补特伽罗混然一体之上，有个鲜明生动的我，非唯名言施设、而是能自存自立、从它自己那边成立过来时，这一显现才是真正的所破显现理。若能认识，破它是不难的。由于这一扼要十分精微，所以很容易犯太过或不及的毛病。在我们不去辨认它的时候，它一直在那里显现，一旦想去辨认，它又藏到身心聚集体里面无法找到，因此要想些办法让它现身。例如，当我们靠近悬崖边的时候，常生起“我会掉下去”的恐惧感，此时不会想到“我的身体会掉下去”或“我的心会掉下去”，而是在身心两者如水乳交融之上，有个将掉下去的、鲜明生动的我浮现出来。同样地，当见奔马时，我们不会称马的身或马的心为马，而是在身心聚集体之上，有个非唯施设的、被称作“马”的鲜明生动之物，将之执为马。又如，当我们说“色拉寺”“哲蚌寺”等的时候，感到那里的房屋、僧人等都成为混然的一体，在施设所依情器聚集体之上，有个与施设所依大小相等，被称作“色拉”“哲蚌”的鲜明生动之物显现过来。", "又如，当我们称某人为“十难论师”时，十难论师的身心聚集体即是它的施设所依，在这之上，有个不观待任何其他事物的鲜明生动之物显现过来。简言之，如格邬仓‧绛央蒙朗（妙音愿）所说，某某法名为“某某”所指称的、与施设所依大小相等之物从境上显现过来，此即正理之究竟所破，或称为“实执所缘境”。如果未能认识这个谛实显现而另找一个所谓“所破实有”，这样的实有只是所谓“自立”“实有”之类的抽象名词，任凭我们用各种中观论著中所说的正理来佯作观察，也只会成为空洞的说辞，对实执不会有丝毫损伤。对自己新发明的、非自然现起的“我”做观察，只会形成一种臆造的见地。总而言之，如至尊洛桑却坚所说：对我们凡夫而言，除了现在的显现理之外，别无正理的所破显现理。这是因为凡夫的一切心识均为无明所染，所以任何境相都是谛实显现。对我们这些普通人来讲，个人、诸蕴、山、房屋等现在的任何显现，都是世俗显现与谛实显现混合的一种显现。“这部分为谛实显现”“那部分不是谛实显现”，这样的区别是没有的，一切法全都是谛实显现。在凡夫心中，不与所破混合的显现理一个也没有，因此，对我们而言，这种显现就是所破显现理或实有显现理。", "对此放任不管、而拚命想在别处找到所破，就会犯下大错。章嘉·若贝多杰曾说：如今我派诸明慧，耽著实有等名相，鲜明显现未留意，另觅所破如兔角。离障老母面庞上，彼之显现本来无，未达关要说法多，然恐老母早溜走。我们应将外缘师长教授与内缘积资净障结合起来，依靠这些力量，再以精细、卓越的智慧来认真分析，这是很重要的。若能正确认识所破，“缘起”等任何一种正理都能将实执须弥山击破、碎成灰土，通达空性便不再是一件难事。章嘉·若贝多杰说：不需寻觅即求者。意为不必跑到远方去寻找空性，它与寻求者本来就住在一起。因此，单是认识这个所破也值得花费数月或数年的时间来修。", "子二、周遍决定扼要如此，当心里能清楚地现起前面所说的、正确的所破之抽象含义时，次应决定：假如俱生我执所执的“我”是自性有，它与施设所依诸蕴的关系必然是体性相同或相异，除此之外没有第三种可能。作为一项总的原则，一个法的存在，必然是以一或多的形式出现。如果这项原则成立，实有的事物就必然是谛实一或谛实多。因此，假如这样的“我”是存在的，那么它与诸蕴的关系不是自性一就是自性异，除此之外没有其他可能。如果这两种可能性都排除了，则可断定这样的我不存在。引发这样的定解即是“周遍决定扼要”。对此扼要未获坚固定解之前要持续修，不可只修一、二天便算完事。子三、离谛实一品扼要先将所破的情形回忆起来，然后作如下思考：如果我与蕴是谛实一的，它们就不可能在心里显现成异，而应当是绝对没有任何差异的一体。其理由是：作为世俗的虚妄形式，体同相异、现象与本质不符是可以接受的，但对实有来讲则不可以，现象与本质必须相符。既然如此，承认有我就没有意义了。", "因为“我之蕴”也可以说成“蕴之蕴”或“我之我”，所以，将“我”与“我之蕴”分开来讲就变成毫无意义，而且将犯“所取”五蕴之外没有“能取”我的过失，如《根本慧论》中所言：离取我非有，是事已成时，若取即是我，则无汝之我。", "再者，如《入中论》中所说：取者取一不应理，业与作者亦应一。所取与取者，身与有身，支与有支都将成一。不仅如此，如果我与蕴是一，则问题丛生，如《入中论》中所言：若谓五蕴即是我，由蕴多故我应多。如同蕴有五种，我也将有五个，或者如我只有一个，蕴也只能有一种而不能有五种；因为我即五蕴，那么入胎结生即无必要；又因为我与身体自性为一，那么死后遗体烧成灰时，我也将成为灰烬；而且，我在后世结生时，身体也将跟着一起结生，或者说，身体不可能在后世结生，所以我也将不可能结生，在无色界受生时，我将不存在；或者我即成色体。如果我与心是一体，因为心无寒冷、饥饿之感，我也不会有寒冷、饥饿之感。冷、热、饥、渴之时，也不能说“我冷”“我饿”之类的话。如果我与身心两者同体，那么作“我之身”“我之心”这样的区别就没有意义了。再者，如果我与蕴是自体成立的一事，就应在任何时间、地点都完全一致。如《根本慧论》所说：设若蕴是我，则当有生灭。正如五蕴有生有灭，我也将有生有灭。如此一来，由于色蕴前后相续间断而有生灭，我也将相续间断而有生灭。如果前后世之我与前后世不同的五蕴自性为一，那么，前世之我与今世之我两者的自性到底是一还是异？", "如果是一，前世受生为畜生时所受的愚痴苦，今世也应当受；前世畜生也能感受到现在人的快乐。如果前后世之我是自性异，则如《入中论》所言：", "如依慈氏近密法，由是他故非一续，所有自相各依法，是一相续不应理。正如慈氏与近密相续各异，则是没有自性联系的两个人，这就不可能有能回忆前世的神通。又如《根本慧论》中所说，将有所作业失坏的过失：设若此者异，无彼亦当有。如是彼当住，未死亦当生。断及业失坏，他所造诸业，由他各别受，复有彼等过。如果认为前世之我虽已消失，但仍有后世之我来受报，那么自性有补特伽罗所造的业，可以由其他自性有补特伽罗来受报，这将犯“值遇未造业”的过失。基于上述这么多的过失，由此得出结论：我与五蕴自性为一根本不能成立，此即“离谛实一决定”。子四、离谛实异品扼要如前决定了离谛实一之后，我们应接着思考：“现在只剩下我与蕴两者为自性异的可能性了。”如果是自性异，情况又该如何呢？如《根本慧论》中所说：离取别有我，是事则不然，若异则无取，应可得实非。如果山羊、绵羊、牛三头牲畜同时存在，那么除了山羊与绵羊之外，还剩下牛可以示人。同样地，如果我与五蕴自性为异，除了色、受、想、行、识五蕴之外，还应该有个与蕴无关的我可以指认出来，然而这是办不到的。《根本慧论》又说：若与诸蕴异，则当无蕴相。我应该不具足五蕴所表有为法的生、灭等相。", "虽然五蕴有生、老、病、死，但我却没有。对五蕴的饶益或伤害对我没有影响，这些都是与世间名言相违背的。主张我与蕴自性为异还有许多其他方面的过失，例如，在无蕴的所依上也将生起“我”想，以及“已造业失坏”“值遇未造业”等，如前已述。因为有这么多不合理的地方，由此可得出结论：我与蕴自性为异也根本不能成立，此即“离谛实异扼要”。现在总结上述四种扼要如下：首先，将“所破决定”的显现理牢记在心，不要让它跑掉。然后，用“一异”正理来观察。当肯定这两种可能性都不成立时，又将如何？譬如，有一头牛走失了，它只有两条山沟可走，别人告诉你说牛找不到了，但你不相信，从两条山沟的沟头至沟尾寻找却遍寻不获，这时你会清楚地意识到，自己心里想找的这头牛已经不在了。同样地，作为俱生我执所著境的这个“我”本来也是十分鲜明的，好像可以用眼睛看到、用手捉到，但在用正理观察之后，它便完全地消失了、没有了，当我们清楚地生起这一定解时，即获中观正见。在那一时刻，利根习气强的人有如获至宝的感觉，钝根的人则会感到惊恐，像突然失去某件重宝，这是正常的。", "以前宗喀巴大师在色拉却顶传正见引导时，杰‧喜饶森格（慧狮子）因通达正见而发生恐惧，伸手抓自己的衣领。宗喀巴大师见状十分高兴，说：“那塘巴正在抓世俗的衣服。”欧曲瓦传正见引导时，他的一些弟子也出现恐惧的情况。", "当所破彻底消失时，心里可能会有“这是空性！我证到了！”之类的念头，因为这些是非遮或能立之相，所以不要跟着它走。在确定所破我没有时，这一决定智应具有两个特点：决定相——确定无自性的决定智十分坚固；显现相——唯破所破实有而产生的一种空朗朗的感觉。应以正念保住这一决定智、不要忘失。当行相力开始减弱、变得不明显时，如果此时尚不需出定，则应如前作四扼要观察，当重获定解时，即应生起有力的决定智，在持续有力的定解中一心入定。在定中唯破所破实有产生出空朗朗如虚空的感觉，此即定中如虚空的修法。此时，遮破所破我，会间接导致名言我相的丧失而找不到它，但不必因担心堕入断见而费心去找回名言我。癸二、后得修如幻化在出定后的后得位中，应观察何为破除所破之后的遗留物，将会发现只有我的名字留了下来，对此引发这样的坚固定解：这个唯名言我就像幻化物一般，它能造善不善业、也能领受黑白异熟果。譬如，幻化的象、马虽然对魔术师显现，但在意识中，他确定象、马是不存在的，于是确定这些是虚妄相。与此同时，他还是能直接地、无可否认地看见象、马有来来去去的作用。", "同样地，我们应该懂得，这个我是无自性的唯名言施设有，虽然它不真实，但还是可以造业受报，与它有关的作用缘起可以成立是无法否认的。要学习显现而空、空而显现之如幻现起法。在最初寻求正见的时候，由于实执的习气很强，心里似乎觉得容不下空性，过后又觉得难以安立现相。然而，如龙猛所说：诸法缘起者，乃因自性空，此是无等伦，如来所示教。", "我们必须明白，空性以缘起为原由，所以，空性是现相的助伴；缘起以空性为原由，所以，缘起是空性的助伴。缘起因在这里起着关键作用。例如，以缘起因成立芽等非实时，必须破除俱生心的执取理，亦即破除“芽非唯名言安立而是从它自己那边而有”的执取。如何破呢？如果芽像俱生心执著的那样是自性有，就不需要依靠因缘以及能安立的名言等其他条件，而能自存自立。事实上并非如此，芽需要依靠种子、水、肥、合宜的温度、湿度等因缘才能生起，它是倚赖其他条件的观待而成之法，这可以用现量成立，故为缘起。这样的缘起正理或缘起因，能破除不观待其他条件、能自存自立的自性有边，所以，称为“以现相除有边”而“空性是缘起助伴”的说法。如果芽由自性成立，它就不可能受因缘影响，芽的自性也不会改变。然而，芽最后会长成禾穗，结出的青稞等物可以为人或畜生所食用，这一切有作用的缘起建立都是可成立的，所以，又有“以空性除无边”“空性是缘起的助伴”的说法。这些道理见之于众多经论。《无热恼龙王请问经》中说：若从缘生即不生，其中无有自性生，若法依缘即说空，知空即是不放逸。《根本慧论》中说：非缘起之法，少分亦非有，是故非空法，少分亦非有。《入中论》中说：", "由说诸法依缘起，非诸分别能观察，是故以此缘起理，能破一切恶见网。宗喀巴大师也说：不复轮替而同时，甫见不欺缘起已，定解普灭所执境，彼时见观察圆满。又由现相除有边，及由空性除无边，若知空性现因果，不为边执见所夺。若能理解空性与缘起互不矛盾、相互助成的道理，就能对因果等有作用的缘起产生定解而重视缘起，促使我们尽己所能、努力实修断恶修善之行，尤其是修慈心、悲心、菩提心及学处等，将之付诸实行。简言之，我们将成为智慧与方便互不乖离的修行者。（帕绷喀大师同时指出：有些人以为重视业果等是初学人的法，所以，另为弟子开示所谓殊胜教授，声称没有业果，这实际上与顺世外道没有两样。）壬二、抉择法无我这部分分两小节：（癸一）抉择有为法无自性；（癸二）抉择无为法无自性。癸一、抉择有为法无自性这小节又分三方面来讲：（子一）抉择色无自性；（子二）抉择心无自性；（子三）抉择不相应行无自性。上述对补特伽罗无自性义获得定解的方法，也可以用到其他法上。经中说：如汝知我想，如是观诸法。", "《四百论》中也说：说见一法者，即见一切者，以一法空性，即一切空性。子一、抉择色无自性凡夫的心识为无明所染，当色等显现时，除“从自己这边有”显现理之外，别无其他显现的模式。这种显现就是所破显现理，必须破除如其显现而有。虽然一切都是以各自施设所依他法支分为基础、而在施设所依之上唯名言安立的缘起，但在未得正见的凡夫心中，此处以瓶子为例，瓶子并不显现为只是在自己施设所依上所施设的所施设法，而是显现为在施设所依与所施设法浑然一体之上，有个鲜明生动的瓶子，此即所破的显现理。虽然如此显现，但因为施设所依与所施设法相异的关系，俱生实执所执取的瓶，与瓶的施设所依为实有一体是不成立的。而且，在瓶的施设所依之外，也没有其他“此是瓶”的显现理。因此，瓶只是依靠腹、口、足等聚集体合格施设所依而有的名言量显现。由于瓶子只是世俗有，所以，瓶与瓶的施设所依为实有异体也不成立。总的来说，一个法的存在，必然是以一或异的形式出现。如果此法系实有，它就一定是实有一体或异体。当这两种可能性都不存在时，它就不是实有，瓶等非实有就是透过这个方法成立的。", "简言之，以瓶子为代表的色等一切法，都必须依靠施设所依，无法自存自立，所以不是实有。《四百论》中说：一切非自主，是故我非有。此外，从总体上说，瓶子为单一体，但必须依靠众多支分而有，所以它虽然是单一体，但不是自性有。再者，虽然瓶与柱两者立为相异，但这只不过是相对于对方来讲的，瓶、柱两者就其自身而言并非异体；否则瓶、柱本身也将成为异体，而无法成为单一体了。因此，瓶柱虽异，但瓶子本身是单一体。而瓶子之上的一、异两者也只是分别所安立而非自体有，如《根本慧论》中所言：异依异成异，无异异不异。以及：若异异于异，则无异亦异。子二、抉择心无自性心为与境交涉的明、知之体。心有很多种类，例如心王、心所等，是根据领受境的主体或特点来分。在这些支分之上，以及在前后刹那众多支分合集施设所依之上，除了唯分别所施设之外，心丝毫不是从自己这边而有。然而，心却不是这样对我们显现，它似乎不观待任何东西而能自主地领受外境，这种自存自立或在境上可找到它的显现，即所破显现理。如果如这种显现而有，那么，以今日之心为例，它就必须与其前后刹那众支分自体为一或自体为异。假如是异体，在排除了上午与下午两种心识后，应仍可找到“今日之心”。", "因为分不出来，所以今日之心与上、下午心不能成立为实有异体。假如今日之心与上、下午两种心是实有一体，因为这两种心为多，所以今日之心也将为多。或者因为说今日之心在上午就有了，所以下午之心应该在上午就出现了。又因为上午没有下午之心，所以上午应该没有今日之心。因此，今日之心与自己支分为实有一体也不成立。必须如此来获得心识无实的定解。再者，如果心的三轮是实有一体，就会犯能知、所知成一的过失；如果是实有异体，则在没有所知的情况下也应该有能知，没有能知也应该有知等。所以，心识的三轮非自体有。“心”只不过是在前后刹那众多支分等缘起聚集体上，由名言量所施设。就此而言，生死、涅槃的一切能作、所作都是合理的。子三、抉择不相应行无自性此处以时间为例，年只不过是在十二个月合集之上显现而有的，但所破显现理却与之相反。在找到所破显现理之后，接着应当确定年与施设所依十二个月自性非一，否则，如同施设所依月有十二个，年也将有十二个；又因为年是一个单一体，十二个月也将成为单一体。如果这两者自性为异，在十二个月之外，应该能指认出一个名为“年”的事物，事实不然。", "因此，年只不过是在施设所依十二个月之上、由能施设的合格心所施设的，除此之外，年根本不是从它自己这边而有的。癸二、抉择无为法无自性两种灭、虚空、空性等，因为不是由因缘造作而生，所以称作“无为法”。此处以虚空为代表，只是对遮除所破质碍的无遮立“虚空”名。除此之外，如果虚空整体与东、南、西、北各部分自性为一，那么，东面与西面的虚空应成为一体。这样一来，当太阳出现在东胜身洲上空时，西牛货洲上空也应该有太阳升起。如果自性为异，整体与支分就没有联系而变成别的东西，除了方隅上下虚空各部分之外，还应该有虚空可以指认出来，而实不然。有些人将空性执为实有，极不合理。佛经中称此为不可救药之见：宁执我见如须弥，不应执空为实有。根据施设所依的不同，空性可以被分成很多支分，在空性所依之上，也有周延不等的众多空性支分。空性与这些支分的关系是一体或是异体？空性与空性所依有法是否相互观待？透过观察即可了知。经中说：此中色尚不可得，况有色真如可得？壬三、由此生起毗钵舍那之理前面我已介绍了如何以九住心方便三摩地成办合格奢摩他的方法，但即便能保任它，单靠这种轻安是无法获得毗钵舍那的。", "此处以补特伽罗无我为例，谈一下毗钵舍那生起的情况：如前所述，先透过四扼要观察，确定在五蕴之上根本没有俱生实执所执的、由自性所成之我。当这种定解清楚地生起时，应以正念保持这一所缘不忘，另以正知消灭沉掉而入定。当行相力减弱或变得不明了时，应重新如前作四扼要观察，以获得有力的定解，然后一心专注于此，如此寻求空性的住分。当住分获得时，便在坚固的止住修中作四扼要等观察，就像小鱼在澄净、平静的湖中游水一样。以这种住分与妙观察慧平等的模式长时间地修习，如前依次成就九住心之后，以观察力引发的殊胜轻安，将比以前获奢摩他时的轻安更为殊妙。当观察修能毫不费力地转成止住修时，即得缘空性的正毗钵舍那，止观也成为双运的状态。576掌中解脱菩提道次第二十四天教授"]}, {"c": "第二十三天", "segs": ["金刚乘、四摄与发心仪轨（预备）（嘉杰·帕绷喀仁波切先引用法王宗喀巴大师的言教，“如是三主道诸要”等，简述纠正动机之法。在回顾了已讲的各科之后，大师接着说：）庚三、学不共金刚乘之理如前所述，我们首先应当依靠下士道、中士道，生起出离心的体验；然后依靠上士道发起菩提心的体验；再对空性见获得定解，此后方进入密宗。如果不做这些准备直接进入密宗，我们的努力就无法成为解脱与无上菩提的方便。就像小孩骑野马，不仅无益，反而有极大的危险。生起“三主要道”体验之后再进入密宗道，密宗的迅捷特色将因此而决定得到体现。据说密宗教法比佛还要稀有，如果依靠无上瑜伽之道，我们在浊世短暂的一生中即可获得无学双运位，因此一定要学习密宗道。只是为了扫除现前的违缘，去求一些诸如“马头”“金刚手”等随许是不够的。我们应当依止合格的金刚阿阇梨，在“集密”“胜乐”“大威德”任何一位本尊的曼荼罗中，妥善地获得决定培植四身种子的清净四灌顶，如护眼珠般爱护灌顶时所接受的三昧耶与律仪，在这基础上听闻二次第甚深引导并实修。如此便完成了对整个教法的修持，这是极大的成就！", "若能妥善地学习这些修道之法，对于从依止善知识开始，至无学双运之间的显密妙道，便能获得彻底的了解。（帕绷喀大师说，按照规矩，在有很多弟子未得无上部灌顶的情况下，“学习金刚乘之理”这一节只提一下科判，而不细讲。）己二、成熟他相续学四摄之理《经庄严论》中说：施同示劝学，自亦随顺转，是为爱乐语，利行及同事。如此颂所言，菩萨必须努力饶益其他有情，并以“四摄”的方式来成熟有情的相续。“四摄”之中第一为“布施”，由于凡夫容易受财物的诱惑，所以先布施财物让他们欢喜，摄受为眷属，再逐渐引入正道。第二为“爱语”，和他们谈谈与世间道理相符合的话，此外，更主要的是根据他们的根机与喜好，为之说法。第三为“利行”，要设法使他们一步步去学习为他们所开示的、符合其根机的正法之道。第四为“同事”，自己也要照着为他人开示的内容身体力行。必须以此“四摄”来利益有情。上述为正行的内容。己二、以仪轨受持发心前面我曾提到，“以仪轨受持发心”一科留待后面再讲，现在补讲这部分内容。", "此科分两大段：（庚一）未得律仪令得之理；（庚二）已得守护不退之理。庚一、未得律仪令得之理所谓“以仪轨受持发心”，是指先要对菩提心有所体验，再去受戒，律仪才会生起；没有任何体验，只是跟着句子念诵，是没有益处的。但是纵然没有体验，受戒还是能培植习气的。所以，大家对此要郑重其事，这很重要。已经生起体验的诸位，明日受戒时要认真地观修所缘，凭借殊胜境而获菩萨律仪，发心也将增长并坚固。发心仪轨有三种形式：无预备法的为略轨；预备、正行在同日完成的为中轨；一天为预备、一天为正行的为广轨，这次按广轨来传。如果在灌顶、引导和传经等之后传发心仪轨，由于这些法不同于“菩提道次第引导”，所以规矩上在前行阶段，需要详细讲解全部共同道次第。这次因为与“菩提道次第引导”一起传授，前行内容已在前面详细地介绍过了，所以没有必要再做重述。（帕绷喀大师又指出，今后准备为他人传发心仪轨者，必须记住是否配合“道次第”讲解其间的区别。）（接着，预会大众念诵了“加行法”，其中供养鬘系长颂，曼荼罗计数多遍。奉献了求法曼荼罗之后，大师简要地开示了前行纠正动机之法，然后说：）今晚与明日早晨，大众务必尽力观修以前所讲的所缘。", "明天我们要恭请诸佛菩萨来做发心的见证而做顶礼、供养等事，如果像穷人请转轮王来家中，让转轮王坐在污秽肮脏、积满灰土的环境中十分不妥，现在散会后要认真打扫会场，但不要伤及虫蚊，然后喷洒香水，铺设鲜花，阿阇梨的法座要用花与珍宝装饰。至于供品，阿底峡尊者曾经讲过：“藏人供养太恶不生发心”，所以供品不应太差，据说应奉献全部财产的六分之一。无论如何，大家要尽可能陈设丰盛供品，让自己的同伴吃一惊！", "明天传发心时，为了发起菩提心，要修积资净障、防护中断等法。虽说最理想的做法，是在明日早晨念诵《甘珠尔》，否则也应念《华严经》。再不然，擅长念诵的人，一定要认真地念诵《般若八千颂》与《贤劫经》。此外，还要施水供、部多朵玛，所以我们先施放三分朵玛，然后再进入正行。世俗人在除旧迎新时，都要盛装庆祝一番，我们要发菩提心、入大乘道成为佛子，为何不来庆祝一下呢？明日早晨请大家沐浴更衣，出家人要披上法衣、祖衣等，像过去诸佛所做，手上捧着发心的供养来到这里。当大家进入会场时，不要把会场看成是一幢普通的房屋，而应视作无量宫，并有四门，四方有四大天王及千万名眷属保卫守护，外围四周有善品天神为了得到发心而等待着。室内四面壁画上，绘有我们的大师在有学道时修菩萨行的故事，应把壁画想象成活生生的样子，对之随喜并做发愿。第二次集会的时候，礼请师长到场，为了菩提心的生起，要广修“加行法”，认真地积资净障。修的时候，对积资净障的所缘要郑重。大家必须将师长视为真正的薄伽梵释迦牟尼，对师长所开示的每一种所缘行相，都要认真地观修。", "总的来说，为利一切有情而愿成佛之心为“愿心”，发心之后想学菩萨行之心为“行心”，前者好比准备去印度，后者则如正式上路。以仪轨受持发心有两种情形，根据《菩萨地》中的说法，愿心与行心需要各别受；根据《入行论》中的说法，愿心与行心可同时受。这两种做法实际上并无区别。有人认为这两种做法分属中观派与唯识第二十三天金刚乘、四摄与发心仪轨（预备）583全颂为：“殊胜大宝菩提心，若未生者令生起，若已生者令不退，辗转向上愿增长！”。见龙树造《发菩提心仪轨》。全颂为：“愿诸父母具安乐，愿诸恶趣常空无，诸凡各方菩萨众，彼等诸愿悉成就！”全颂为：“吉祥师长寿坚固，自他积资净障已，等空众生安乐源，佛位速疾愿获得！”贡唐·贡却丹贝准美著，汉译全文见《三主要道甚深引导笔记·开妙道门》之附录，收录于《解脱之门》，昆明：云南民族出版社出版，2006。584掌中解脱菩提道次第二十四天教授"]}, {"c": "第二十四天", "segs": ["发心仪轨（正行）（第一次集会时，我们一齐念诵经典，也修了施放朵玛等法。第二次集会时，迎请大宝师长入座，并修“加行法”，供养鬘等均为长颂。随后奉献请求授予发心律仪的曼荼罗。当时每人手里都捧着发心供养，献完曼荼罗之后，大家将供品献到师长跟前、累积成堆。帕绷喀大师先引述三界法王宗喀巴大师的话，“大乘道命为发心”等，如前介绍了发心的种种功德。接着说：）从“暇满”“难得”开始，大家要依次修心，使心地调柔。在观修所缘的时候，应设想一切有情围绕在自己身边，六道众生全都现为人相，观一切男性有情为父、一切女性有情为母，分坐于右、左两侧。次观师长为释迦佛，周围有贤劫千佛等围绕。在迎请来的师长、佛、菩萨面前，右膝下跪。（随后，大宝师长解释了仪轨中的各颂文意，并由师长领诵，弟子跟随。师长先念了“归依发心偈”三遍、“为救众生远离有寂畏”等一颂三遍，这是“归依”与“立誓受持发心”。其次为正行，愿心与行心同时并受，诵“诸位师长佛菩萨”等以请求许可为先的受戒文三遍。", "“如今此生有果利”等二颂一遍，这是有关生欢喜心与受持学处的内容。大师接着说：）今天就在我们发菩提心时，十方无量世界中的诸佛刹土及宝座大为震动，众眷属询问是何因缘，诸佛回答说：“在雪域藏地名为曲桑茅篷的地方，弟子‘某某’与‘某某’在其师降巴丹增成烈嘉措座前发大菩提心，因此力量而震动”。他们都发愿：希望各位不退初心且功行圆满。（随后，大师尽力捧起一堆发心供养，剩余的由侍从捧着，大师说：）因为参加这次“菩提道次第”法会发菩提心，我们积聚了无量善根，以此善根为代表，为了保证三世善资粮不致浪费，我们现在做如是回向：“我们将这些善根托付给至尊弥勒怙主，凭借这些善根的力量，将来有一天，当弥勒怙主在这个世界上示现殊胜化身时，愿我们成为胜者弥勒怙主的最初弟子，受用语教甘露，获得成就无上菩提的授记！”念完三遍之后，我会把供养抛向空中，大家应当设想自己的善根变成八吉祥、七政宝等供品，落到兜率天至尊弥勒的四周，弥勒怙主也将接受这些供养并为你们发愿。（大师亲自领诵“何时金刚座山顶”“彼时弥勒佛喜悦”等二颂，三遍之后，将供品抛向空中。）庚二、已得守护不坏退之理这段分两部分：一、愿心学处；二、行心学处。", "一、愿心学处愿心学处包括两方面：1．学习此生中发心不退之因；2．学习余生中不离发心之因。1．学习此生中发心不退之因共有四种：（1）忆念发心功德；（2）昼三次夜三次受持发心、令发心增长不退；（3）阻止于害我者不思饶益的恶心生起；（4）积集资粮使发心增长。2．学习余生中不离发心之因分两组四种，前四种为断除四黑法：（1）说妄语欺骗师长、亲教师、轨范师等；（2）令他人对行善生起悔意；（3）以瞋恚心对菩萨恶语相向；（4）心不正直欺诳他人。后四种为依止四白法：（1）断除故意妄语；（2）具正直心、不欺诳有情；（3）对菩萨起大师佛陀想并如实赞叹；（4）令自己所成熟的有情受取正等觉。二、行心学处（帕绷喀大师详细讲述应该如何如法奉持菩萨戒，不为十八根本堕、四十六恶作所染污之法。又说：）有道是：我为汝示解脱法，是否解脱自决定。你们要尽量将前面所讲的内容用于实修，不能只视为外在的讲说之法。譬如，商人根据骡、马等牲畜的承受能力，让它们驮负适合的货担。大家也应根据自己上、中、下不同的心力，无论如何要修一些最起码的法；尤其要将菩提心作为修持的中心，并将其他所缘作为修持的助伴。", "首先，我们要如理地依止善知识，发心实修善知识所开示的教诫内容，使暇满具有真正的意义。这一“取心要”的工作从现在起就要开始，因为这个人身是不会久住的，死后去哪里受生自己也无法做主。一旦受生在恶趣之中，便会有难以忍受的痛苦，所以，我们必须寻求救护远离恶趣苦的归依处，以及解脱恶趣苦的方法。虽然勤修这些方法能保证我们不堕恶趣，但善趣身也不外乎是苦，而且难保将来不再堕入恶趣。在仔细思考了这些情况之后，我们应当发起出离生死之心。但是，只是自己一个人解脱生死还不行，因为一切有情都是对我们有恩的父母，对他们不予关心是一种卑劣的行径。不仅如此，单是解脱生死还不够，因为我们迟早要进入大乘道，所以从现在起就应入大乘道，而发心是大乘的唯一入门，所以要勤修发心之法。当我们能生起菩提心的“无励力觉受”时，从我们来讲，虽然不会计较为利益有情而做长时间的苦行，却不忍见母亲有情这样长时间地受苦，所以，要发殊胜菩提心而进入一切乘之最——密宗道。我们必须在合格的金刚阿阇梨跟前获得能熟四灌顶，修习“光明”与“幻身”双运的双运亲因，及能熟道生起次第等，以期在浊世短暂的一生中，获得无学双运位。", "在获得无学双运之前，需先有双运的亲因——胜义光明与净、不净幻身。在这之前，能成熟这些道的生起次第粗分至少要臻于究竟。在这之前，必须要获得决定培植四身种子的清净四灌顶。在这之前，又必须先以共同道菩提心净治相续，以造就殊胜的密宗合格根器。为了菩提心的生起，我们先要有对一切有情受苦心生不忍的悲心；生起悲心的基础，是自己先要对生死的总、别痛苦发起无法忍受的出离心；发出离心之前，又先要对恶趣苦产生恐惧；而真正恐惧心的产生，需要我们先思惟业果与死期不定。唯一能促使我们生起修道之心的，是思惟暇满、利大、难得。这一切的证德，必须依靠以意乐与加行如理依止善知识才会生起。所以，刚开始修的时候，不要好高骛远，应从依止善知识法开始，依次修心，先生起“通达”。所谓“通达”，是指获得这样的自信：“如果我将来修这一所缘，定能在相续中生起！”然后再从头开始，从“道次第”之首依止善知识法开始，对每一个所缘发起“有励力觉受”。对已生起体验的各科做“速修”即可，对未生起体验的所缘，则着重专修。由于我们现在有机会遇到这样的圆满无误显密无垢教法，如果对密法不加以熏习，是极为可惜的。", "我们无论如何要对“集密”“胜乐”“大威德”三大本尊之一的生圆次第做速修。这样的人能速修全圆教法，所以能将一切教法放在一座中修习。对上至菩提心的那些所缘发起“有励力觉受”之后，又应从头开始，对每一种所缘发起“无励力觉受”。这就像是一条唯一可以通行的大道一样。以这种方式对上至菩提心的所缘发起体验之后，我们便应如法地勤修密宗道二次第，如此一来，密续与大成就者论著中所说的殊胜证悟将在相续中生起。过不了多久，我们便能像嘉瓦温萨巴父子那样，在浊世短暂的一生中现证双运金刚持位。如今我们已发起了菩提心，为了趣入无上佛子之行，我们应当发愿消除尽虚空际六道众生各自的痛苦而将他们置于无上菩提之位，所以，大家要一起念“入行愿”。这虽说不是我大宝师长的规矩，但在以前赤钦父子的时代是这样做的，我觉得很有必要恢复这一妙规。因此，请大家配合文义心不散乱来做念诵。（接着，由帕绷喀大师领诵，与会大众同念《入行论·回向品》。", "最后，我们奉献了酬谢曼荼罗，并念诵发愿文与吉祥颂等。由于大宝师长的恩德，全圆教法心要菩提道次第妙轨纵然到了时劫的最后一刻也不会消失，它将以最为灿烂的光明消除三界的黑暗！）您以慈慧之剑毁灭三有，在如来教中昂然现为执金刚之主。无边大慧宣说诸佛妙业，将众生从昏睡的床上唤起。您那空悲妙印的明月，使究竟乐游戏海水高涨，绿意盎然！我的心莲由此盛开，再次将您——百部之主，奉为我的顶上庄严！怙主的口授如千万种财宝，能满足有寂的一切所需。把这个可见可触的宝盒装满，它将成为有缘之士的心宝！您将圣教众多次第汇集一处，这是一切智破除相违之舞。您以无比吉祥伟大的教证，依据根器将有情置于大乘。释迦佛无量殊胜的言教是众生之宝，理解它们是最上教授，由此一切万物现为最上，能享用这样的景观是诸佛欢喜之道！", "战胜四魔的胜利鼓音，将牟尼甚深密意的无误言诠传播，以此顺易赐给二利的信息，能使众多学人受行此难得之道！不染过失遍行大海中，成熟道要的自证界，为众开示没有生、灭、我的缘起义，还有何道比此更为殊妙？一切如意宝难以比拟的难得身，不应用于享受现世的盛事，当为自己的永久安乐考虑，这样的人除了修此妙道，还有何求？因此，想求解脱的人们，不要将相似道自夸为妙，当服用凝聚全圆教授的精华，这样才会使你们的愿望满足。勤编本书的善资粮如恒河长流，这一美丽如月的水晶璎珞，庄严各方连绵亘长，以此缘起幻化的无量神奇，愿人天众生顶戴的摩尼宝，无垢佛教的清凉月，令有缘睡莲开敷呈祥，将三界热恼永远地消除！", "从此宝藏发出无尽讲修的阵阵波浪，涌到虚空的尽头，愿金莲花盛开的大海，甘丹格鲁妙规永久住世！用诸佛智、悲、力的宝粉，堆砌起来的须弥山高达有寂之顶，愿持教海住世百劫不动摇！愿他的事业耳饰像日月般明亮！快乐三时城的吉祥，降落此地如同圆满时夏日的云彩，愿此悬挂在福德空中的华盖，降下利乐的甘霖！愿我们能如理依止具恩师长，愿他住在顶上无价明点中永不分离，也愿我们鹏程万里，迅速地修完大乘之道！总之愿我圆满六度万行，以利益量等虚空一切众生，愿我很快地成为吉祥菩提金刚，坐菩提树下拥有十力的妙德！我们的根本师长——遍主金刚持帕绷喀巴，名讳至尊降巴丹增成烈嘉措贝桑波，合集三世诸佛菩萨智、悲、力、事业为一体，由悲心所发动，以不可思议的善巧方便，使我与同伦的愚痴之辈成为大乘的有缘人，恩德无与伦比。大师应拉鲁噶采瓦家夫人、信誓无比的女施主拉江·央宗彩玲（聚音长寿）之请，为二位已故公爵季美南杰（无畏胜）与彭措饶杰（圆满盛）荐福而传授此一教授。时间为第十五胜生周铁鸡年（1921），地点在曲桑茅蓬的辩经院。", "大师将《菩提道次第明晰引导捷径》、中传派与南传派《文殊口授》三种教授合并起来，再加上修心法中的《修心七义》，逐一详细地恩赐经验引导，以成熟我们的相续。像我这般的愚钝之人，也有幸能受用大师甚深、广大的语教甘露。当时，惹堆札雅东贡仁波切按日笔录教授，并向大师本人请益核校。由于大师的利他事业广大如虚空，这一编审工作只能进行到第四加行观想资粮田而告暂停。为了推广具恩师长的事业，我心里一直想着要把这一工作完成，在师长怙主的亲教弟子——包括许多散居各地荷负弘法重担的师长活佛、开演百论的格西们一再催促下，以上述笔录作为基础，参考其他可信的师长金刚持先后开示的道次第笔记，去芜存菁、详加审订。然而，由于散乱的牵绊、终不得暇，故而请求大师的秘书，来自丹玛的比丘洛桑多杰（善慧金刚）校阅我所收集的资料，审订先后次序与各节科判的内容。他曾以如教修行的供养长期侍奉大师，且多闻犹如阿难。他不辞辛劳，出色地协助我完成这一工作。我本人也抽空详加校订，对少量与师长言教不符之处做了修正，并将笔记中所遗漏、我所记得的口传教授做了增补，尽力完成了本书的编辑工作。希望本书能成为大师言教的代表，有益于一切读者。", "从我七、八岁开始，师长怙主便欢喜摄受，以无上加持的大悲哺育我成长。师长之卑微弟子、言行不一而没有正法的慵懒之人，僭名雍增甘丹墀江活佛洛桑益西丹增嘉措，完稿于第十六胜生周火鸡年（1957）十月十五日。以此祝愿菩提道次第大宝教法在所有地区、一切时期中弘扬昌盛，长久住世！", "附录一菩提道次第明晰引导捷径前行念诵次第易行仪轨·有缘颈严597菩提道次第明晰引导捷径前行念诵次第易行仪轨·有缘颈严绛贝伦珠大师造仁钦曲札译一切时中顶礼归依于师长与能仁金刚持无别足下，伏请大悲摄受！一、观归依境自己正前方虚空中，有一八大狮子擎举高广宝座，其上为杂色莲花与月、日轮垫，体为自己具恩根本师长、相为释迦牟尼佛安住其中。身如纯金色，头具顶髻。一面二臂，右手按地，左手定印，上托甘露盈满之钵。身披红黄色法衣，相好庄严，以澄净光明为体。于自身所出光蕴中央，双足结金刚跏趺而坐。于彼周围，根本传承诸师、本尊、佛、菩萨、勇士、空行、护法等众围绕而住。彼等各各前方圆满座上，置有各自所说诸教正法，光明为体，经函为相。资粮田诸尊对己现欢喜相，自亦忆念资粮田诸尊之功德及恩德，于此之中，生大信心。二、归依我与一切母亲有情，从无始以来乃至现在，虽已领受总生死、别三恶趣种种痛苦，然苦之深度与边际犹难测度。我如今已得难得、利大之殊胜暇满人身，已遇难遇之大宝佛教。值此之际，若我不当即求得断一切生死苦之殊胜解脱正等觉位者，又必将领受总生死、别三恶趣种种痛苦。", "因前方所住师长三宝具有救苦之能力故，我为利益一切母亲有情当获正等觉位，是故今当归依师长三宝。归依师长归依佛归依法归依僧三、发菩提心诸佛正法以及众中尊，直至菩提于彼我归依。我以所修施等诸资粮，为利一切众生愿成佛。一切有情远离亲疏贪瞋安住于舍岂不善哉！愿其安住！我令安住！唯愿师长本尊加持能如是行！一切有情具足安乐及安乐因岂不善哉！愿其具足！我令具足！唯愿师长本尊加持能如是行！一切有情远离痛苦及痛苦因岂不善哉！愿其远离！我令远离！唯愿师长本尊加持能如是行！一切有情不离善趣与解脱妙乐岂不善哉！愿其不离！我令不离！唯愿师长本尊加持能如是行！四、发殊胜心为利一切母亲有情故，我应尽力速速证得大宝正等觉位，故当由甚深道师长本尊瑜伽之门，趣入修习菩提道次第引导。", "五、加持地基及供品一切地基愿清净，瓦砾等等悉皆无，平整柔软如掌心，成吠琉璃之自性。天人微妙供养物，实设以及意变化，普贤无上供养云，愿悉周遍虚空界。嗡那莫薄伽瓦德班杂萨惹巴惹麻达耐达塔伽达雅阿尔哈德桑雅桑布达雅达雅塔嗡班再班再麻哈班再麻哈德杂班再麻哈微德雅班再麻哈菩提支达班再麻哈菩提曼卓巴桑嘎惹麻那班再萨瓦嘎麻阿瓦惹那比肖达那班再娑哈愿以三宝谛力、诸佛菩萨加持力、二资粮圆满大威力以及法界清净不可思议力，愿如是成就！六、观资粮田乐空无别、广虚空中，普贤供养云海内，枝叶花果、美妙庄严，满愿如意宝树端，八雪狮擎、大宝座上，莲华日月为褥敷，具足三恩、根本师长，一切诸佛为体性。现比丘相、袈裟着身，一面二臂含笑颜，右手说法、左手定印，持钵甘露极充满，身披三衣、郁金花色，金色智帽顶上严。心内能仁、金刚持王，一面二臂身蓝色，手持铃杵、抱界王妃，受用乐空俱生智，种种珍宝、以为装饰，杂色天衣甚端严。相好庄严、放千光明，五色彩霞周围绕。足结金刚、跏趺坐式，五蕴清净为五佛，四界清净、即四明妃，诸处脉节诸菩萨，二万一千、毛孔罗汉，一切支分即明王，光即护方、药叉密迹，诸世间众为足垫。", "周匝亲疏、诸师长等，本尊坛中诸圣众，诸佛菩萨、勇士空行，护法海众遍围绕。每尊三门、三金刚相，吽字放光如钩形，从本性处、迎请智尊，和合无分安稳住。唯愿一切有情大依估，摧恶魔军及其眷属天，正知诸事一切悉无余，世尊偕眷于此请降临。杂吽榜霍，与三昧耶尊无二无别。七、沐浴圣众此妙浴室异香馥，水晶为地极晃耀，炽燃宝柱甚悦意，珍珠伞盖具光焰。犹如佛陀降诞时，诸天神众献沐浴，我今亦以净天水，如是沐浴资粮田。嗡萨瓦达塔伽达阿毗克迦达萨麻雅室利耶啊吽俱胝圆满乐善所生身，能满无边众生希愿语，如实观见无余所知意，沐浴本师能仁金刚持。嗡萨瓦达塔伽达阿毗克迦达萨麻雅室利耶啊吽沐浴广大行派诸师长，沐浴甚深见派诸师长，沐浴修加持派诸师长，沐浴诸位传承师长尊。嗡萨瓦达塔伽达阿毗克迦达萨麻雅室利耶啊吽沐浴无上大师诸佛陀，沐浴无上救怙诸正法，沐浴无上向导诸僧伽，沐浴无上归处三宝尊。嗡萨瓦达塔伽达阿毗克迦达萨麻雅室利耶啊吽以诸无等净香衣，拭擦诸佛菩萨身。嗡吽掌舍啊嘎雅毗穴达那耶娑哈三千界中皆蒙熏，以诸妙香涂佛身，犹如清洗紫摩金，诸能仁身光炽盛。轻薄柔软妙天衣，具不退信我献于，已获不坏金刚躯，愿我亦得金刚身。", "佛具相好本性饰，不须余饰为庄严，仍供宝饰愿众生，悉得相好庄严身。悲悯我与众生故，愿佛神变威德力，乃至我能供养时，世尊安住不离此。八、供七支及曼荼罗俱胝圆满乐善所生身，能满无边众生希愿语，如实观见无余所知意，释迦主尊之前我敬礼。", "具大悲心如来金刚持，胜观谛洛巴与那若巴，吉祥种毗巴及阿底峡，修行加持传承我敬礼。弥勒、无著、世亲、解脱军，胜军、调伏军及名称祥，狮贤、二孤萨黎、金洲师，广大行派传承我敬礼。文殊、破有无边龙猛尊，月称以及大理杜鹃师，善护佛意圣者父子等，甚深见派传承我敬礼。具足讲修妙诀阿底峡，噶当教法祖师仲敦杰，四瑜伽师及三昆仲等，噶当教派传承我敬礼。开辟雪域车轨宗喀巴，事势正理自在嘉曹杰，显密教法之主克珠杰，父子传承诸师我敬礼。遍摄归处师长金刚持，随机调伏显现知识相，能赐殊胜共同诸悉地，具恩诸师长前我敬礼。遍视无量圣言之眼目，有缘趣向解脱妙津梁，悲心撼动方便善开显，此诸善知识前我敬礼。集密、胜乐、欢喜嘿汝嘎，及大吉祥威德金刚等，四密续部无数坛城主，本尊诸天众前我敬礼。恒为兄弟修习菩萨行，共同发愿稀有善资粮，同于贤劫之中至究竟，千尊圆满正觉我敬礼。善名、大宝、妙金、无忧恼，法称、神通、药师、释迦佛，广大希愿意趣悉圆满，八大如来之前我敬礼。集谛痴暗种子令解脱，根本拔除痛苦毒箭者，《佛母般若波罗蜜多》等，三藏正法之前我敬礼。", "文殊、金刚手与观自在，地藏以及除盖障菩萨，虚空藏与弥勒、普贤尊，八大菩萨之前我敬礼。善修甚深十二缘起故，无需依靠他人善领悟，获得自然自觉之智慧，诸圣独觉之前我敬礼。能仁付嘱主持圣教幢，支分生与难胜、住林薮，遇时、金刚子及贤善者，金纹、跋黎堕阇具金者，圣薄拘罗以及罗睺罗，小路、宾度罗跋罗堕阇，大路、龙军、藏护及不坏，上座并诸眷属我敬礼。最上殊胜空行刹土中，具足神通神变大能力，如母爱子看护修行者，三处空行众前我敬礼。昔于如来薄伽梵跟前，承许护佑如法修行者，犹如守护子女不暂舍，诸护法众之前我敬礼。护国以及圣增长，广目及与多闻子，调伏眷属护四门，四大天王我敬礼。于彼一切应敬前，自身化作无量身，量等一切刹尘数，以最上信我敬礼。敬礼圣妙吉祥童子！所有十方世界中，游于三世人狮子，我以清净身语意，遍礼一切悉无余。以彼贤行为愿力，一切如来意现前，一身复现刹尘身，一一遍礼尘数佛。于一尘中尘数佛，各住菩萨众会中，无尽法界亦复然，我信诸佛皆充满。", "诸功德海赞无尽，普以音支大海声，称扬一切佛功德，我今赞叹诸如来。以诸妙花妙花鬘，伎乐涂香胜伞盖，最胜灯明妙烧香，我悉供养诸如来。诸妙衣服最胜香，未香积等妙高峰，一切最胜庄严具，我悉供养诸如来。所有无上广大供，我悉供养诸如来，深心信受贤行力，顶礼供养诸如来。嗡班杂普弥啊吽，大自在金刚地基；嗡班杂惹克啊吽，外铁围山围绕；中央须弥山王，东胜身洲，南赡部洲，西牛货洲，北俱卢洲；身及胜身洲，拂及妙拂洲，谄及胜道行洲，俱卢及俱卢月洲；众宝山，如意树，满欲牛，自然稻；轮宝，珠宝，妃宝，臣宝，象宝，马宝，将军宝，宝藏瓶；嬉女，鬘女，歌女，舞女，花女，香女，灯女，涂女；日，月，众宝伞，尊胜幢；其中人天圆满富乐无不具足，以此奉献具恩根本传承诸吉祥师长正士；以及善慧能仁大金刚持诸天众眷属。为利众生，愿哀纳受。又愿受已，以大悲心加持自他一切有情。香涂地基遍敷众鲜花，须弥四洲日月为庄严，观为清净佛土而奉献，愿诸众生受用清净刹。自他身口意三受用三世善资粮，微妙宝曼荼罗以及普贤供养聚，以心摄取供养师长本尊并三宝，唯愿悲悯纳受加持自他众有情。", "伊当古如惹那曼札拉冈尼雅达雅弥我由贪瞋痴增上，从身语意之所起，诸所造作恶不善，我今一一皆悔除。十方一切佛菩萨，独觉有学及无学，一切趣中诸有情，所有福善我随喜。十方所有世间灯，现证菩提得无滞，我今劝请诸世尊，旋转无上妙法轮。诸佛若欲示涅槃，我悉合掌而劝请，利乐一切有情故，唯愿久住刹尘劫。敬礼供养悔露罪，随喜劝转请住世，尽我所积少善根，一切回向大菩提。九、三大事启请归依师长三宝，唯愿汝等加持我之相续。我与一切如母有情，从不恭敬善知识起，乃至执著二种我相，所有一切颠倒心，唯愿加持消灭；恭敬善知识等一切不颠倒心，唯愿加持顺易生起；唯愿加持息灭一切内外障缘。", "十、道次第传承师长启请吉祥大宝根本师长尊，安住于我顶上莲月座，由大恩德之门哀摄受，伏请赐予身语意悉地。无等向导大师“薄伽梵”，最上补处至尊“无能胜”，佛陀授记圣者“无著”足，三大佛菩萨前我启请。南洲智者顶严“世亲”尊，获中观道“圣者解脱军”，安住信地“尊者解脱军”，三大开世间眼我启请。成最稀有之处“最胜军”，深道净治相续“调伏军”，广大行藏“毗卢遮那”师，三大众生亲友我启请。弘扬般若胜道“狮子贤”，普持佛陀教授“孤萨黎”，悲悯摄受众生“具善”师，三大众生商主我启请。娴熟菩提心法“金洲”师，主持大车轨辙“燃灯智”，光显妙道“敦巴仁波切”，三大圣教栋梁我启请。无等善说导师“释迦顶”，遍集诸佛智慧“文殊”尊，见甚深义胜圣“龙猛”足，三大善说顶严我启请。显明圣者密意“月称”师，“大理杜鹃”为彼最长子，佛子“第二正理杜鹃”足，三大正理自在我启请。如实观见甚深缘起故，主持大车轨辙“燃灯智”，光显妙道“敦巴仁波切”，南洲二大庄严我启请。瑜伽自在吉祥“贡巴瓦”，深三摩地坚
