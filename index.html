火相比，人间火的热度就像牛头旃檀香水那般清凉。以前目犍连曾将一点点热地狱的灰烬带回人间放在海边，当地所有人都热得受不了。那些受生在烈火中央的有情，如果他们身躯短小，马上被全部烧焦也就算了，偏偏他们的躯体都如山脉那么庞大；如果他们的皮肤像我们脚底的皮那么厚，也还好，偏偏他们的肌肤幼嫩如喝奶的婴儿。简单地说，热地狱中有各种无法忍受的痛苦，例如：所烧之身极其庞大的痛苦、如新肉般忍受力弱的痛苦、能烧之火至极炙热的痛苦等等。像这样的热地狱一共有八种：一、等活地狱虽然等活地狱中没有狱卒，然而因为恶业的关系，受生在那里的有情，彼此一见面就会产生瞋怒，手里拿的东西会自动变成武器，互相砍击，彼此身体都被切成一块一块的，最后昏厥倒地。然后空中发出声音说：“愿尔等复活！”同时一阵凉风吹来，散落的骨血重新聚拢，身体又恢复原状，随后故事重演。每天当中，像这种假名为死的昏迷要发生上百次，复活也要发生上百次。我们现在应该想象自己受生在那里的情景，以及被兵器砍击、昏倒、苏醒等的情形，以生起真切的感受。平时我们只要被小刀刺死一次，就会有不可思议的恐惧和苦楚；", "而在等活地狱，像这样的事每天总要发生许多次。等活地狱有情的寿命很长，这也是人间无法与之相比的。《亲友书》中说：此间日以三百矛，极猛贯刺所生苦，此于地狱轻微苦，非喻非能及少分。", "二、黑绳地狱从此地狱开始，地狱中出现有名为“阿傍牛头”“雅夏猪头”等的狱卒。这些执事狱卒，身躯像山一般高大，眼睛血红，形状十分可怕。地狱有情听到他们叫喊打杀的声音，顿即魂飞魄散，觉得身体好像要碎裂一样。随后，他们会被狱卒逮住，推倒在赤热的铁地上，狱卒用灼热的铁丝在他们庞大的身体上烙下许多线条，烧焦后形成黑色印痕。接着，就像木匠锯木一样，有的狱卒用锯子锯，有的用斧头劈，有的用小斧削，虽然劈开后脱落的肉块和血滴掉到赤铁上面，但仍然和心识相连，能感到疼痛。受生该狱的因，可以是十不善业中的任何一种，或是用马鞭抽打别人等等。三、众和地狱生在此狱的大多数情况，是属于杀生的报应。地狱有情被赶入两座状如羊头的山中，或是两座如同以前杀生时被害者的形像中，当两山对撞时，地狱有情被挤在中间，无处可逃。当两山分离时，身体又平复如故，像这样不断地被挤压。那里的有情痛苦万状，有的被压磨成粉末，有的像臼里的芝麻一样被研磨，有的被拉入铁的网眼中等等。（帕绷喀大师举例说，假如我们现在用手指将虱子杀死，将来我们在地狱中，就会被状如手指的山压死。）四、号叫地狱此狱有情被赶入赤热无门、里里外外都有火燃烧的铁房子里，备受煎熬。", "他们因为无法脱逃，心里生起极大痛苦而大声号叫。", "五、大号叫地狱此狱与“号叫地狱”不同的是，它有二重铁室，所以痛苦也加倍增大。他们纵然能逃出一间铁室，也绝对逃不出另一间；心理痛苦则更大。受生该狱的因是：十不善业中的任何一种，以及无节制地饮酒，经中说：饮酒生于号叫处，斟者生于彼近边。六、烧热地狱此狱有情被燃烧的铁丳从肛门贯穿到头顶，所有内脏全被烧焦，并从口、眼等各窍喷射出火焰。他们又被放在烊铜沸腾的大铜锅里煮，等骨头、关节再度接合、全身复原后，又被放回去煮，如是等等。七、极热地狱此狱比“烧热地狱”热两倍，此狱有情的肉、筋、脉、内脏全被煮烂，只剩下骨骼，然后关节接合、平复如故。有的有情身体细长，被缠绕在扁平赤铁上；有的身上被捆绑上赤热铁丝，全身骨肉像捏面团一样被挤出来；有的被燃烧的三尖叉从肛门贯穿到头顶，他们的舌头被拉出许多踰缮那之外，狱卒拖着犁耙在舌上耕耘；有的像书本一样，身体被夹在像经板似的铁板里，各种各样的受苦情形难以尽述。（帕绷喀大师又讲了提婆达多的弟子瞿波离如何在此狱受生的故事。）八、无间地狱无间地狱中的痛苦，要比在它之上的那些热地狱的痛苦大得多，那里没有丝毫的安乐。", "当我们将石头或铁放在火里烧的时候，这些东西似乎与火没什么两样。生在此狱的那些有情，身体与火也分不出来，只有通过他们号哭的声音，才知道那是有情。他们的身体好像供灯的灯芯，火从四面八方、上下及身内十一个方向烧过来，苦不堪言。将“极热地狱”以上三界所有的痛苦加起来，也不及无间地狱的痛苦大，《亲友书》中说：正如一切安乐中，爱尽乐为乐之主，如是一切苦之最，无间地狱苦无尽。有人或许会想：“地狱中虽然有这些痛苦，但我们大概不会投生到那里去吧？”但是，谁也不敢做这样的保证。我们没有不堕恶趣的把握，相反地，却拥有许多决定往生地狱的因——“作而未坏”力量强大的恶业。凡造任何一种严重十不善业的，将受生于地狱；中等的，将受生于饿鬼；轻微的，将受生于畜生。地狱之中，凡藐视别解脱“恶作”罪的，将生于等活地狱；藐视“他胜”罪的，将生于无间地狱，其他应按经中所说依次类推。我们相续中有许多异常严重的过失，如别解脱戒与密宗戒的罪堕，对菩萨起瞋恨心，不敬师长等等。若犯密宗根本堕，在我们以忏悔、防护等加以还净之前，将在无间地狱待上与此时间长度中刹那数相同的劫数。", "藐视别解脱五篇堕罪而犯戒者，将依次受生于八大热地狱，这种业我们也已经造了。一旦受生到那里，在恶业果未竭尽前，我们身体与心识的联系是不可能断的，也因此必定会承受极大的痛苦，《亲友书》中说：", "如是诸苦极难忍，百俱胝年虽领受，乃至不善未尽出，尔时与命终不离。地狱有情的寿命极其悠长。八种热地狱中，寿命最短的是“等活地狱”。人间五十年为四天王天一昼夜。以这样的三十天算作一个月，十二个月算作一年，四天王天的寿命为五百年。将这五百年加起来算作一昼夜，三十天为一月，十二月为一年，这样五百年的时间，便是“等活地狱”有情的寿量。换句话说，即是人间一万六千二百亿年。《文殊口授》旧版中说的六百亿是错的，应采用《口授》梅鲁版和“南传派道次第”的说法。上述那些热地狱，在我们看来似乎远在许多踰缮那之外，但事实上，我们与恶趣的距离只是一息之隔，并非那么遥远。仔细想想，说不定明年或明天这个时候，我们已经来到那样的地狱里了。如果真是那样，我们该怎么办呢？现在我们连火灸、针刺都吃不消，又怎能受得了地狱的那种苦呢？像噶当派祖师常说的那样，我们的一只脚虽在人间，另一只脚却已落在地狱大铜锅的锅口了；投生地狱的因我们早就已经具备了。（帕绷喀大师指出，一旦我们在恶趣中受生，便无法从那里逃脱，也无法找到依靠。所以，我们在堕恶趣之前的余生当中，最上当求成佛；次等当求获悉地；最差也应勤修忏悔等法，以免投生恶趣。", "）辛二、思近边地狱苦热地狱的外边，如铁山围绕般，有四种“近边狱”：煻煨坑、烂尸泥、利刃塘和无极河。进入近边地狱有两种情形：当热地狱中的有情恶业减轻的时候，他们便脱离大地狱而进入近边地狱；也有一开始就受生在那里的。", "一、煻煨坑热地狱的有情将脱离那里的时候，会生起逃离的念头，进而夺门外出。然而一出热地狱，便掉进了“煻煨坑”中，膝盖以下全部没入而烧焦，拔出来时又复原，像这样每走一步，腿就要烧焦一次。那些有情承受着这般大苦，怀着解脱的愿望，在火坑中跋涉数十万年之久。二、烂尸泥当他们有朝一日脱离“煻煨坑”的时候，却又连着遇到了“烂尸泥”。他们脖子以下全部陷入泥中，不断地翻滚挣扎，泥中有无数名为“利嘴”的虫子，其嘴尖利如针，将他们的身体扎得像网筛一样，狠命地吞噬他们的肉。像这样怀着逃离的愿望，他们又跋涉了数十万年。三、利刃塘随后，他们又将来到布满刀子的“利刃塘”，那里到处都是如同锋利的铁剑般尖端上仰的利刃。他们将长时间领受利刃割足和刺扎的痛苦。当他们离开那里的时候，又接着到了“剑叶林”。他们错认那些刀剑为树，于是来到树下，不料树叶变成利剑落下来，砍截他们的身体，然后又恢复如初等等，受无量苦。过了剑叶林后，他们又将来到长满无数锋利铁刺的“铁设末梨树林”。树端有以前恩爱的亲戚朋友在呼唤，于是他们寻声登树，那些铁刺尖端朝下刺割其身，他们痛苦地慢慢爬到树端，不料有可怕的怪鸟等着他们，啄食他们的眼睛和脑髓。", "下面又传来亲友呼唤的声音，于是他们又爬下来，这时候铁刺转而朝上，扎入他们的身体，等到爬下树后，又有狗和其他野兽来撕咬他们的腿。（帕绷喀大师说，在他们业尽之前，将无数次领受这种登降之苦。并且指出：这三种受兵刃伤害的地区应算作一个近边地狱。）四、无极河当他们脱离那些地方后，便来到了“无极河”。河内具有腐蚀性的盐水和烈火相杂，他们的身体像被扔进沸水中的豆子一样，必须长时间经受水深火热之苦。由于我们随时可能投生到那些热地狱中去，因此重要的是，我们现在必须勤做善恶取舍，以期避免投生到那里。辛三、思寒冷地狱苦寒冷地狱的位置，在热地狱正北面的同一层次上，这也是为什么我们这个地方会这么寒冷的缘故！各寒冷地狱之间，上下相隔二千踰缮那。虽然如此，但是寒冷地狱的雪山高二千踰缮那，尽管间距不同，但各层寒地狱与热地狱仍在同一层面上。行将投生于冷地狱的人，临终时会希求冷触，于是引发受生寒冷地狱的业成熟。经过如梦般的“中有”阶段后，好像醒来一样，此人发现自己已受生在寒冷地狱。那里的雪山有许多踰缮那之高，终年没有日、月的光明和火光等，所以一片黑暗，连手是伸是蜷都看不到。地面上布满冰块，天空中风雪交加，中间寒风呼啸。", "丝毫没有取暖的火焰和阳光，及保暖的衣物。像这样的寒冷地狱一共有八种，冷的程度依次递增：一、寒疱地狱因为寒冷而身上起疱疤。二、疱裂地狱寒冷更剧，导致疱疤破裂，流出脓血。", "三、頞哳咤地狱寒冷更甚，身体僵硬如石不能活动，口中除了“阿啾”之外，其他什么话也说不出来。四、郝郝婆地狱寒冷更剧，不能说话，只能从喉管里略微发生“嗟呼”的声音。五、虎虎婆地狱寒冷更甚，连“嗟呼”声也发不出，只能略微张口，传出牙齿打颤的声音。六、裂如青莲地狱寒冷更剧，身体如死尸一样，颜色变青，随着声响，身体开裂成青莲花状。七、裂如红莲地狱寒冷更甚，身体粉红色嫩肉开裂成红莲花状。八、裂如大红莲地狱寒冷尤甚于前，身体开裂程度更大，犹如百瓣或千瓣大红莲花。“頞哳咤”以下的地狱有情，他们的身体像是塔的镶嵌部分，冻结在雪山或冰原上，全身僵直、动弹不得。而且如《弟子书》中所说：无比严寒侵骨力，遍身栗战而缩屈，百疱起裂生诸虫，嚼抓脂髓水淋滴。从他们身上疱疤中流出的脓水，引来许多毒蜂叮咬，掉在地上的血滴等仍与心识相连，所以一直会感受寒冷和皴裂的痛苦。此外，还有罹患各种瘟疫的痛苦。受生寒冷地狱的因，为固执无业果等邪见，如《本生鬘》中说：断无见者于后世，当住寒风黑暗中，由此能销诸骨节，谁欲自利而趣彼？除此之外，我们还有众多“造而未坏”的业，足以投生到那里。", "例如，抢走他人的衣服，剥夺佛像上的供衣，将虱子等有情活活冻死等。关于寒冷地狱有情的寿量，《本地分》中说：“当知望于诸大有情、地狱有情，次第相望各近其半。”或如《俱舍论》中所说：寒疱狱寿量，如一婆诃麻，百年除一尽，后后倍二十。意为从摩揭陀国量制八十斛（一婆诃）的胡麻筐中，每隔百年取出一粒胡麻，取完全部胡麻所需的时间，才是第一寒冷地狱“寒疱地狱”有情的寿量。（帕绷喀大师又进一步解释说，一把胡麻大约有一万五千粒。“寒疱地狱”以下各狱有情的寿量，均以前者的二十倍递增。）辛四、思独一地狱苦独一地狱的位置，在人间和海边等有多处。以前，有一群商人邀请圣僧护一同去一个海岛。到某地之后，其他商人继续前进，留下圣僧护一人在海边漫步，海边有一座美丽的寺院，内有五百位出家众，他们邀请圣僧护入寺。圣僧护发现，这些比丘每天一到中午便互相争斗，中午过后又恢复正常。当问及原因时，他们回答说，那是因为在迦叶佛教法时期，某日中午他们因为不和而发生争斗，所以感得此报。圣僧护后来又陆续发现其他“如墙”“如柱”“如臼”“如绳”“如帚”“如连筋”“如锅”等地狱。", "他返回后，向释迦牟尼佛询问造成这些地狱的原因，详细情形“加行法”中已说过。“如臼”是迦叶佛时代，有个比丘对沙弥发怒，口出恶言要将沙弥放进臼里杵，由此感受此报。（帕绷喀大师又指出，他们从迦叶佛时代开始，一直受苦到现在。）另外还有一些有关“独一地狱”的故事，譬如：以前有一位商主名叫亿耳，他一生下来耳朵上就有一个宝饰，价值一亿枚金币，故此得名。亿耳有一次外出采宝回来，在海岸边倦极入睡，其他商人抛下他先走。当他醒来的时候，商人走过的踪迹已被风吹得无影无踪，装载货物的驴子也因为嗅觉失灵，无法辨识前路而不受驱赶。亿耳四处流浪，最后来到一座状如宫殿的房屋前，他发现屋内住着一个男人，晚上有四个天女服侍，享受天界的快乐。但一到白天，宫殿般的房子却变成烈火熊熊的铁屋，四个女人变成四只花斑恶犬，将那个男人扑倒在地，它们一口口将他撕裂、吃掉。太阳落山后，一切又恢复成原状。于是亿耳询问那个男人是何缘故，那人回答说，他以前是瓦萨瓦城里的屠夫，遵照圣者噶达雅耶那的劝告，晚上持戒不杀生，但白天无法不杀，所以感得此果。此人请求亿耳捎个口信回家说：“请您转告我的屠夫儿子，不要再杀生，让他为圣者供养午餐，为我回向善根。", "”并告之在存放刀具的地方藏有一罐金子，可以此为凭证。亿耳继续赶路，又发现一幢漂亮的房子，内有一对俊男倩女，纵欲享乐。昼夜的情形与前例相反；到了晚上，那个女人变成一条蛇吞食男人的头。当问及缘由时，那男人说，他以前是婆索婆城内的一个婆罗门，曾与女人通奸，后来在噶达雅耶那跟前受白天不淫乱的戒，所以感得现在的果报。他也要求亿耳带口信给他的儿子，并告以藏在祭灶下面的金瓶为证。（帕绷喀大师接着讲述了亿耳继续前进、看到一只四脚绑着四个饿鬼的椅子及其宿因等内容，说明有这样的“独一地狱”存在。）人世间也有“独一地狱”。以前在印度，当具寿“吉祥”某日散步的时候，见到一个屠夫受生在半空中，外表如一座楼阁，实际上纯系熊熊燃烧的烈火。他以前的助手也变成与骨骼山一样的形状而受苦。（帕绷喀大师又讲了吉祥所看到的另一个“独一地狱”有情的情况：此人具有像山那样巨大的睾丸，乃是以前阉割动物之报。并且指出：我们也造集了许多类似这种的“定受业”，这些业就像是抵押品一样，随时可以被兑现。", "）又有一位大成就者，在雅卓的湖内，发现后藏达那地方的一位喇嘛，因滥受信众超荐祈福的供养而受生为一条大鱼，体积至少有雅卓湖一半大，身体被许多其他生物所啖食。这位大成就者因此告诫他的弟子说：“勿滥受信施！勿滥受信施！”虽然我们都知道“僧人消信施，孔雀化毒药”这句话，但对于如何如法地修行以消化信施，我们仍需十分谨慎。徒具僧人的外形，却没有确实的修行，并不能“消化”信施，律经中说：宁食热铁丸，火焰极炽猛；不以破戒身，受用信施食。犯戒者受用信食，与吞食燃烧的赤铁丸无异。具戒者之中，只有那些如理精进“诵断”之业的人才能消化所吃的信食，不然的话便难以消化，如欠他债。现在我们将衬钱、供养等放进腰包是很容易，等到将来要用自己身上的肉来偿还时就难了。作师长的在接受回向礼的时候，如果只写一张收条而未作为回向祈愿的话，将来肯定要用自己身上的肉来还，这是必然无疑的。（帕绷喀大师又讲了几个相关的故事。例如，以前有块磐石中，一只大蛙被无数小蛙所食。另外有个德格师长，某日吩咐他的弟子说：“今日不管河里漂来什么，你们都把它捞上来给我。”结果有一棵树被打捞上来，剖开一看，树洞里有一只大蛙，正被许多小蛙所攒噬。", "据说，前者曾是一个滥受信施的师长，后者是曾任德格某寺的大管家。当师长大金刚持访问康区的时候，曾亲闻这么一桩事情：在多须地区一个名叫“浦”的湖里，有一只状似黑牛毛帐篷的大怪物，它夏天潜没在湖里，冬天水位降低结冰的时候，背部就露出湖面，被鸟等许多动物噬食。大师说，这些也都是“独一地狱”。受生于这种地狱的业因我们已造集了无数，并且还在继续造，所以，我们应经常思惟自己领受这种痛苦的情形。）庚二、思饿鬼苦《文殊口授》中先说畜生苦后说饿鬼苦，是因为饿鬼的智慧比较大，所以层次比较高，有些饿鬼能够理解为他们开示的法；而畜生则十分愚钝，因此比较低级。由于畜生修法的障碍比饿鬼大，所以先讲畜生苦。《捷径》中则先讲饿鬼苦，因为就整体而言，饿鬼的痛苦比畜生要大。这一节又分两部分：思惟冷热、饥渴、疲倦、恐惧等饿鬼总苦，以及思惟饿鬼别苦。辛一、思惟饿鬼总苦我们应这样来思惟饿鬼共有的痛苦：虽然我们现在未受生到地狱去，但如果受生在饿鬼中的话，仍将遭受冷热、饥渴、疲倦和恐惧等难以忍受的痛苦。这时候不要说是修法，就连想修的心也无法生起。", "幸运的是，仰仗师长的大恩我们没有堕入其中，又似乎能修一修像“菩提道次第”这样的法，福报算是不小！然而，我们相续中仍有众多强有力的、造而未坏的能引业，以我们目前的能力来看，是无法在死前将这些业完全弄干净的。而且一般来讲，临终之心极其重要：今生造有大罪的人，如果临终时能在单纯的善心中死去的话，就能触发某种善性宿业成熟；修行人在临终时，如果是在瞋怒等不善心中死去的话，将触发某种不善业成熟。但在多数情况下，往往是今生最熟悉的那种心在临终时现前。由于我们对三毒烦恼的熏习力最大，所以临终时必然也是不善业被触发。当我们临终时对饮食产生厌倦，心想：“我连饮食的名字都不想听见”，如果生起像这样的瞋心或贪心，便触发受生饿鬼的业成熟。因此我们不仅没有不会堕入饿鬼恶道的保证，而且还很有可能会堕入其中。如果我们受生在那里，饿鬼道又是怎样的情形呢？离地面五百踰缮那的下边，有一座饿鬼城，名叫“劫毗罗”。那里寸草不生，滴水全无，地面像被太阳烤热的破铜皮。饿鬼的躯干和四肢大小极不相称；巨头乱发，脸上布满皱纹，颈脖极细撑不起头颅。躯体庞大如山，手足却像草一样细弱、难以支撑身体，这要比人世间老人四肢无力的困难还要大一百倍。", "肢分的数量也多少不等。由于多年的干渴，饿鬼身中没有丝毫像血、脓等含水分的东西，他们就像干皮革包裹的枯木，干枯的皮肤覆盖着枯萎的筋脉。当饿鬼走动的时候，手臂和腿脚的关节会互相敲磨，像枯木互击一样发出破裂的声音，又像石块互击一般冒出一簇簇火星。", "由于千百年得不到饮食，饿鬼的饥渴痛苦极其巨大。希望获得饮食的愿望驱使他们不得不去四处寻找，一旦找到了，身体又疲惫不堪，而且若被阎摩手下的狱卒发现，他们将恐惧得全身骨骼都要散掉般。（帕绷喀大师又指出：夏天热的时候，饿鬼连月光也觉得热；冬季冷的时候，他们又觉得日光也冷得很，所以他们有很大的寒冷、灼热之苦。）辛二、思惟饿鬼别苦饿鬼别苦分三种：一、具外障某些饿鬼从远处望见果树或水等，便极辛苦地走来，等他们靠近时，那些东西又突然消失了。有些饿鬼虽然到了那里，但那些饮食由狱卒保卫着，不让他们受用。这时候除了先前的饥渴苦之外，他们还需经受不可想象的身体上的疲倦之苦和心理上的失望之苦。二、具内障某些饿鬼虽能侥幸获得食物，但却无法放进口中，有的颈部有结难以吞咽；有的患有颈瘤，只能喝其中的脓液等；还有的对食物本身有障碍，如《亿耳传》中所说，食物一入口即变成燃烧的铁丸、糠秕、脓血和自己的肉，与以前所造的业相应，领受众多无法忍受的苦果。有些饿鬼虽能吞咽饮食，但到了腹中之后，即变成烊铜、沸水等物，不但无益于消除饥渴，反而增添无限痛苦。也有一些饿鬼虽然没有这些问题，但他们的肚子很大，食物永远填不满；", "还有一类饿鬼，口中因饥饿而冒出阵阵火焰，所谓“鬼火”即是指饿鬼口中燃烧的火焰。", "三、具喉结例如，阿难某日经行的时候，曾见到一个母饿鬼，喉间有三个结，嘴里发出五种可怕的声音。这类饿鬼因为颈部有三重结，由此引起的痛苦更是无穷。《亲友书》中说：于饿鬼中须领受，欲乏所生相续苦，无治饥渴寒热劳，怖畏所生难忍苦。或有口细如针孔，腹等山量为饥逼，下劣捐弃不净物，尚不具足寻求力。有存皮骨裸形体，如枯枝叶多罗树，有于夜分口炽燃，受用口中烧燃食。有下种类于不净，脓粪血等亦无得，面互相冲而受用，颈瘿成熟所生脓。诸饿鬼中于夏季，月炎冬季日亦寒，令树无果诸饿鬼，略视江河亦当干。《弟子书》中也说：猛渴遥见无垢河，欲饮驰趣彼即变，乱发青污及烂脓，臭泥血粪水充满。风扬雨洒山清凉，檀树青荫末拉耶，至成猛焰遍烧林，无量株杌杂乱倒。若奔巨浪高翻滚，泡沫充溢大水藏，彼于此见热沙雾，红风猛乱大旷野。彼住此中望云雨，云降铁箭具炭烟，流飞灸炽金刚石，金色电闪降于身。", "热逼雪纷亦炎热，寒迫虽火亦令寒，难忍业熟所愚蒙，于此种种皆颠倒。针口无量由旬腹，苦者虽饮大海水，未至宽广咽喉内，口毒滴水悉干消。又如嘉却·格桑嘉措所说：腹大如山喉道阻塞四肢纤弱如细脉，身躯枯瘦灰尘遍覆关节摩擦出火星，略起顾视诸江河等亦令干涸常劳倦，于诸饥渴热恼饿鬼请赐饮食甘露雨！我们明年此时是否也会受生成这样的饿鬼，实在是说不准的。投生饿鬼道的业因是：悭吝财物、贪婪心极大、不断抚摸自己的财物并生起极大的贪著、阻碍别人布施、抢夺盗窃他人财物、阻止供养僧伽、领取双份衬钱等不予取、骂别人为饿鬼等等。特别是骂僧伽为饿鬼，将连续五百世受生为饿鬼。具喉结的饿鬼，有时候只能得到所施的一滴水，这是以前不吝施水的报应，但仍然无福受用其他饮食。佛智论师来到饿鬼境内时，那里有个十分苦恼的女鬼，生有五百个小孩。她请论师带口信说：“我丈夫十二年前去人间觅食，在此期间我生了五百个小孩，我们连一点一滴的饮食也没有，受了很大的辛劳和痛苦。“阿阇梨，当您返回人间的时候，请告诉我丈夫赶快带吃的东西回来。”论师说：“那里饿鬼很多，不知哪一个是你丈夫？”女鬼答道：“我丈夫的相貌特征是：眼睛有一只是瞎的，一只手和一条腿是瘸的。", "”论师回到人间后，发现在饿鬼当中果然有这么一位，于是告诉他事情的经过，并转告他太太的口信。该饿鬼闻言说道：“我虽然外出那么久，但十二年中所得到的食物只有这个。”他指的是紧紧握在手心里的一小口干痰，它被十分珍惜地保存着。他解释说：“这是一个具戒比丘吐出后回向给我们的，那时有许多饿鬼来挣抢，但被我得到了。”如果我们不谨慎的话，恐怕日后也会有将干痰当午饭的那一天！传说沙弥“优多罗”在母亲去世廿五年之后，有一天看到一个可怕的饿鬼，沙弥心里害怕准备逃走。饿鬼说：“不要逃！”沙弥问：“你是谁？”答道：昔生汝独子，慈母我即是，饮食皆远离，饿鬼群中生。自我死殁后，已满廿五载，滴水亦未见，遑论见食物？于是沙弥跑去求佛陀为其母回向发愿，依靠佛力其母死后变成大力女鬼，财物极其富足，但因其悭吝习气比过去重六倍，所以不肯做任何布施。虽然沙弥设法将一匹布取来供养佛陀，但她觉得惋惜又将布偷回，此事来来回回发生了许多次。（帕绷喀大师又讲了另一个故事：以前有个比丘对自己的一件上好法衣心生贪著，结果死后变成一个穿着法衣的饿鬼。", "大师告诫我们说，现在有人称赞吝啬的人有“节俭”之德，但是悭吝是受生于饿鬼的主要原因，因此即使我们不投生于地狱，这种非常吝啬的心态和做法，也会保证明年此时或最久不过四、五十年后，我们将受生为饿鬼！）庚三、思畜生苦此节分两部分：（辛一）思惟畜生总苦；（辛二）思惟畜生别苦。", "辛一、思惟畜生总苦畜生总苦有五种：（壬一）思互相吞啖苦；（壬二）思愚痴苦；（壬三）思寒热苦；（壬四）思饥渴苦；（壬五）思役使苦。壬一、思互相吞啖苦三恶趣中受苦最轻的是畜生，但如果我们受生为畜生的话，仍会有互相吞食等痛苦。畜生中体形较大的，是摩羯鱼等动物。最小的摩羯鱼称为“鱼种”；能将它整个吞下的称作“吞鱼”；能将吞鱼整个吞下的称为“吞吞鱼”。这些鱼可以有许多踰缮那那般大，其他无数海洋生物在它们身上作巢并啖食它们的肉，有时候它们忍不住了，便靠在岩石上磨擦，身上那些被杀的生物的血可以染红数个踰缮那的海面。虽然一般情况下是大动物吞食小动物，但也有小吃大的例子，尽管大动物无法忍受，但也只能匍匐在原地无法转动。在大海中，许多生物聚成一堆，下面的被上面的所食。那些出生在洲与洲之间黑暗地带的动物，母子互不认识，凡是到口的就吃，互相啖食。人世间的动物也一样，老鹰吃小鸡，小鸡吃虫子。猛兽与其他野兽相互杀戮，猎犬追逐和撕咬猎物等等。我们不要像看戏那样来看那些受苦的有情，而应设想一下，如果自己也变成这个样子的话该怎么办。必须用这样的思惟来修。", "壬二、思愚痴苦畜生的愚痴，别的不用说了，就连要被送去屠宰场，还是送去喂养都不知道。", "壬三、思寒热苦（帕绷喀大师又讲述了畜生所承受的不可想象的冷热之苦，如夏天被热死，冬天被冻死等。）以前有个师长，手里抓住一条长长的红虫，问道：“你是不是康巴比丘？”那虫子作人言道：“是！”所以很难说我们将来是否也会变成这样的虫子。（帕绷喀大师又举了另一个例子：过去有户苯波人家死了父亲，杰·密勒日巴开示说，此人已变成某个山谷中一堆粪便里的虫子，随后再将它超度。）虽然很多人可能会想：“我怎么可能会变成那样子呢？”然而只需一小时左右，我们便可能受生到那里。所以，我们无法肯定自己下辈子是不是会变成虫，在地底下苟延残喘地蠕动；也说不定会被鸡等动物啄食，上半身被吃掉了仍不能死，下半身还在蠕动。我们纵然成不了别的事，至少也要努力避免投生到这样恶劣的环境中。壬四、思饥渴苦大多数畜生的形状和颜色都很丑陋。除冷热之外，它们还有饥饿和干渴之苦，往往觅食一整天也一无所获。我们现在被别人骂一句“老狗”都无法忍受，等到自己真的变成一条狗时该怎么办呢？想一想狗的饮食和睡的地方。狗通常只有跑进房内，在人的跟前才能觅到食物，当它进屋的时候，大家都很讨厌地叫到：“哎呀！来了一只狗。”并毫无理由地把它当成鬼似的。", "这除了是它本身的恶业果报外，还会是什么呢？某些寺院一到吹螺集合的时候，一些狗就会嚎叫，这是该寺过去僧人受生为狗的征相。某些畜生手足全无，形状就像一只肉球。以前达波地方有个师长，他有两位施主固定给他送东西，一户供酥油，一户供肉，后来这个师长在未偿清信施的情况下死去，变成供酥油那家饲养的母牦牛，产奶极多。后又摔下悬崖掉进河里，被供肉那家所获，那家人把牦牛肉吃完后，赫然发现在牛的肋骨上有一行字“已偿还某家的肉和某家的酥油。”所以，师长、执事、十难论师、格西等纵然生前在寺里可以受到某种优待，但死后却无法得到业果律的豁免。如果现在不谨慎的话，屋里的主人和门旁的狗、驴子等是很容易换位置的。有这样一个故事：过去有户人家，在房子背后杀生祭祀外道的神，感得大富，这家主人死时还立下遗嘱，要求继续杀生祭祀以繁荣家业。后来此人六次投生为牛，均被他的儿子杀掉上祭。另外一个故事说，一户人家的主人死后，变成屋子后面池塘里的一条鱼。这种事情说不定也会发生在我们身上。壬五、思役使苦帕绷喀大师开示说，以驴子为例，即便它背上长满鞍疮，但还是要被迫背东西。临死前被主人随地扔掉，还未断气，眼睛已经被乌鸦啄掉等等，死状凄惨。", "我们应该设想一下自己受生为畜生苦不堪忍的情景，以发起真切的感受。辛二、思惟畜生别苦思惟别苦分两部分：（壬一）思水中畜生苦；（壬二）思陆上畜生苦。壬一、思水中畜生苦水中的畜生，大部分栖息在大海深处和洲与洲之间的黑暗地带，像堆积的酒糟一样上下挤压，下面的生物往往被上面的生物压得喘不过气来，如是等等。", "壬二、思陆上畜生苦这是指人间所见的那些畜生，他们受苦的情形也是各种各样、无量无边。我们会受生为畜生的圆满有力因很多，其中最坏的例子，是不敬法和法师，以及梵行者互相用畜生的名字来称呼彼此等，如“劫比罗”的事例。（帕绷喀大师又举了另外一些例子：以前印度有个人，因为要施主减少对安居僧伽的供养，结果在一个烂泥潭中，受生为一条头如比丘的虫子。经中说，以前有个人称一位比丘如猴，结果五百世中受生为猴子等。）重大不善业感生地狱；中等不善业感生饿鬼；微小不善业感生畜生。决定业之大小的因素，可以有意乐、福田、事物等几个方面。大不善业并不就是如杀人之类很显著的坏事，我们现在对“殊胜福田”开开玩笑或是动动嘴皮子，这些业便足以使我们来世堕恶趣。《俱舍论》中说，“忍不堕恶趣”，只有获得加行道忍位的人，才有把握不堕恶趣。我们非但没有这样的把握，相反地，看看我们现在的行为，恐怕到死为止也无法忏除以前所造的往生恶趣的因。而一旦投生恶趣中，我们便难以找到解脱的方法和可依靠的人了，《入行论》中说：谁能善护我，离此大怖畏？睁凸恐惧眼，四处觅救护。见四方无依，次乃遍迷闷，彼处非有依，尔时我何为？", "我们观察一下三恶趣中受苦最轻的畜生便可知道：它们连念一句“嘛呢”的能力都没有，却有强烈的三毒烦恼，自然会造集许多新的恶业，从恶趣走向恶趣。《入行论》中又说：若具行善缘，然我未作善，恶趣苦蒙蔽，尔时我何为？既未行诸善，复造集众恶，纵历百亿劫，不闻善趣名。以现在的人身，我们至少要寻求后世不堕恶趣的依怙和方法，如果不努力的话，一旦堕入，则悔之晚矣，我们与大名鼎鼎的“三恶趣”之间的距离，实际上就在一口气断与未断之间。快的话今年年底，慢的话明年此时或若干年之后，有一天我们会像做梦醒来似的，或是生在地狱中，身体与火没有差别；或是生于饿鬼中，连一粒米、一滴水都找不到；或是生在畜生中，头上戴角、身上披毛。这些事并不是不可能发生的。当我们忆念这些恶趣的状况时，重要的是不要像听故事或看演戏那样，以为那是离我们很远的事。第一，我们应生起已投生恶趣的感觉；第二，要生起肯定会投生的感觉。这好比我们观看许多罪犯在监狱里受刑，接着自己突然被人从观众中抓出来、经受残酷的刑罚，就像刚才看到的那样。同样地，不要只想到“恶趣”就是某个有许多众生正在受苦的地方；", "在观看屠夫宰羊的时候，我们应该立即设想自己已来到恶趣中，正变成那头压在屠夫手下的羊，亲身面临开膛剖肚的局面，体验一下那种恐惧和痛苦，生起那种真切的感受。佛薄伽梵说：未来我的声闻弟子，将如口朝下的砂袋中的砂子一般堕入恶趣。我们应将这句话看成是佛对我们的授记。我们就像是将被推下悬崖受刑的罪犯，暂时在悬崖边休息一样，然而我们对此情况却一无所知，反而比“所作已办”的阿罗汉显得更轻松，这是我们行将堕入恶趣的前兆！因此，我们必须反省一下：“我是否能成为这砂袋里剩下的少许砂子之一？”设想自己受生在这些恶趣中而生起真切感受的修法，能够引生我们的出离心。所以，就目前来讲，我们与其观修本尊，还不如观修恶趣苦来得好。（帕绷喀大师又讲了念恶趣苦圆满的标准：以前阿难的两个外甥被托付给目犍连管教，但他们不愿读诵，于是目犍连为他俩展示地狱，最后，两人想起地狱便自然地生起出离心，我们也应如此。随后大师又广略适中地重讲了一遍上述的内容，并简略开示了如何保持所缘的方法。）312掌中解脱菩提道次第二十四天教授"]}, {"c": "第十二天", "segs": ["归依——入圣教之门法王大宗喀巴说：暇满难得寿无常，串习能除此生欲。（嘉杰·帕绷喀仁波切援引上述颂文为我们略示改正动机之法，然后回顾了已讲述的那些科判，并重述一遍“思惟后世二趣苦乐如何”中恶趣苦的内容。大师接着说：）由此想从有暇身获取有价值的东西。在思惟恶趣苦产生深切的恐惧之后，如果想寻求能拯救恶趣痛苦的依怙与后世安乐的方法，当知能拯救后世恶趣苦的依怙，就是归依三宝；而方法即是对一切安乐的根本——业果发起深忍信，而做如理取舍。戊二、依止后世安乐方便分两部分：（己一）趣入圣教最胜之门修净归依；（己二）于一切安乐根本业果发深忍信。己一、趣入圣教最胜之门修净归依归依分五小节：（庚一）依何因归依；（庚二）归依何境；（庚三）归依量为几何；（庚四）归依利益；（庚五）归依学处。庚一、依何因归依归依是否清净，取决于心中是否有清净的归依之因。如《答极白增上心问·善慧笑声》中说：", "归依体性之要义：自身生起大怖畏，知三宝具救护力，由此所生之归依，是一切智汝所许。归依必须具备以下二因：自己对生死与恶趣苦心生恐惧；信任三宝有能力保护我们远离那些怖畏，对三宝起深忍信。不具备上述条件，就不是清净归依。如果对痛苦没有畏惧心，我们就生不起寻求归依的心；如果对归依境没有信心，我们就不会想去归依，或是虽想归依但心里并不相信、只当归依是一句空话。再者，对自身恶趣苦心生畏惧、对生死心生畏惧、对他人在生死中受苦心生不忍起悲悯心，这三者依次是下士、中士和上士的归依因。所以，对昨日讲的恶趣苦生起恐惧，便是此处所说归依因中的一项。庚二、归依何境归依何境分两部分：（辛一）正说认明归依境；（辛二）可归依此之原因。辛一、正说认明归依境如《百五十赞》中说：若彼一切过，毕竟皆永无，若是一切种，一切德依处。倘若有心者，即应归依此，赞此恭敬此，应住其教法。凡是有能力辨别谁是可归依、谁是不可归依的人，即应归依内道佛教的大师、大师的教法，以及安住于该教法的人士。世上大多数人喜欢寻求世间王魔、天、龙、厉鬼等的庇护；外道则多以梵天、帝释等为归依处，然而这些鬼神本身也是生死中人，所以不堪归依。", "那么究竟谁是可归依的对象呢？《归依七十颂》中说：佛、法及僧伽，是求解脱依。只有佛、法、僧三宝才是我们可归依的对象。但是，如果我们对这三者认识不清，也不可能会有清净的归依。在没有深自省察的情形下，外表上似乎是一位大乘持明行者，但一遇到生病等灾难，或是要做重要的决定时，便跑去求助于世间护法和王魔、厉鬼、地方土地神祇等，带着一肘长烟施用的柏枝，有庙就进、见像就拜。这是内心不信三宝、而把鬼神看得比三宝重要的外在反映。即使寺院的名册上有他的名字，事实上这种人连内道佛教徒也谈不上，更遑论是大乘的持明行者。龙、王魔、厉鬼等没有悲、智、力三者的功德，他们连自己什么时候死都不知道，而且大部分属于畜生道和饿鬼道，比我们的层次还低。我们无论如何也还是人，所以还有比归依他们更卑劣的事吗？对于生死和恶趣苦，世间鬼神不仅无力相救，就算是在处理暂时的小事上，也是利小害大。（帕绷喀大师举例说，以前有个身患肿瘤的人，来到夏鲁山神住的地方，正巧碰上山神要对其他非人交肉税，山神便将那人的肉瘤取来充数，于是豁然痊愈。另外一个患肿瘤的人听到此一消息后，也来求助，但结果是旧瘤未消又添新瘤。", "像这样，世间鬼神有时对我们有帮助、有时反而有损害，所以不是永远可以信赖的对象。）外道们以梵天、帝释、大自在天、威猛天、六面天等为归依的对象，他们虽然要比上述那些鬼神好一些，但本身并没有解脱生死和恶趣，所以也无法救护他人。内道佛教的大师则与他们不同，《赞应赞》中说：", "宣告我是汝，无怙者助伴，由大悲抱持，一切诸众生。大师具大悲，有愍愿哀愍，勤此无懈怠，有谁与尊等？汝是诸有情，依怙总胜亲。大师佛陀具备圆满的智、悲、力功德，我将在下面讲解三宝各别功德时加以详细叙述。王魔、厉鬼等鬼神不仅丝毫没有这些功德，而且就算把天、龙等世人所相信的归依处所有功德加起来，也还不及一位内道证预流果声闻所具有的功德。所以，佛陀是二利已臻圆满的究竟归依处，是断尽一切过、圆满一切德的导师。简单地说：二种法身就是胜义佛宝，二种色身即是世俗佛宝。至于法宝，其中的胜义法宝即是指“灭”或“道”所包含的圣者心中的“清净谛”。所谓“灭谛”是指各无间道所引发本分障盖的解脱分；所谓“道谛”是指圣者心中能得该“灭”方便的现观。如果要为未曾学过大论的劣慧者举例说明，则胜义法宝可以说就是这个“三士道次第”；十二分教等为世俗法宝。僧宝中的胜义僧宝，为具足智解脱八种功德中任何一种功德的圣补特伽罗；凡夫具戒比丘满四人者，为世俗僧宝。对他们施行利益或损害，会产生依僧伽而造的善不善业之果。如果只是解救一种怖畏，不需归依处三者全备，每一归依处均有解救的能力。", "以前多康有一人被老虎衔走，他向观自在祈祷，老虎立即将他放在地上走开，由此脱离虎难；再如富楼那出家证阿罗汉果后，他的弟兄和商人们入海取“胜地旃檀”，当旃檀的守护神准备将他们的船只捣毁时，富楼那尊者的兄弟们齐声向他祈祷，得以逃过这场灭顶之灾；又如当龙王向波斯匿王抛洒兵刃之雨时，目犍连将之转变成花雨。然而，要救离所有的生死和恶趣苦，则需三宝全备。譬如身患沉疴的病人，需要药物、医师和护士三者来治愈他的病；同样地，为了能脱离生死、恶趣之苦以及有寂重怖之沉疴，也需要如医师般能开示解脱道的佛，如药物般能得解脱三士道的法，以及如护士般修法良友的僧，三者缺一不可。所以，我们归依的对象就是这三者。辛二、可归依此之原因三宝之所以可归依，主要是因为佛宝的功德，其中有四项原因：一、佛本人已经解脱一切怖畏如果引导我们的归依境本身尚未解脱一切怖畏的话，怎能解脱其他人的怖畏呢？这就像一伙人一同被水冲走或一起陷进泥淖，自顾尚且无暇，如何互助？然而，大师佛陀已解脱一切怖畏。以前提婆达多想谋害佛陀，他抛投大石，却伤不了佛陀；", "未生怨王曾在王宫放出一头愤怒疯狂的大象“护财”出来伤害佛陀，其他阿罗汉因为害怕而飞到空中，只有佛陀毫无畏惧并将“护财”调伏。（帕绷喀大师又详细讲述了德护长者二次害佛未果的故事：一次暗设火坑，一次食中下毒，但均未能得逞。大师又指出，那时“德护长者”及其妻认定佛陀也是个会害怕火坑和毒药的凡人。这些情节也适用于修“依止善知识法”中“自所见相无法决定”一节。）这些是佛陀断除二障及其习气之力，解脱自身一切怖畏的具体表现。二、佛善巧解脱他人一切怖畏之法即使能够解脱自身的一切怖畏，但未能善巧方便，不知如何解救他人，也救不了别人，就像双手残废的母亲救不了落水的孩子一样。然而，佛薄伽梵却极善巧调伏各类所化之方便。瞋恚如“指鬘”一样的大罪人，我慢如乾闼婆王“善爱”及“优楼频螺迦叶”之辈，大力非人如药叉女“鬼子母”与药叉“旷野”之类，愚痴如槃陀迦般的钝根，或如年迈长者“福增”等善根非常少的人，以及像佛弟子难陀那样贪欲极重的人，佛陀均能度化。三、佛大悲普度无有亲疏如果某人的悲心有偏颇，就只会利益亲友而不利益仇敌。佛陀则不然，他对所有众生都一视同仁。", "佛陀对害他的仇人提婆达多和自己的儿子罗怙罗不存亲疏之心，也没有利此而不利彼的区别。提婆达多为了与佛陀争胜，吃下一些药用油无法消化而得病。大师以谛实语祝愿，说他对提婆达多与罗怙罗平等慈爱，因此治好了他的病。（帕绷喀大师指出，释迦牟尼佛是最近出世的佛，以此为代表，可推知其他佛的功德。）四、无论有恩无恩佛皆饶益若非有恩无恩悉皆饶益，就会和我们一样，在稍微有点财势的时候，往往不屑与那些比自己贫弱的人交谈，更不用说出手援助。只帮助对自己有恩的人、无恩的就不顾，是无法保护弱小者的。佛陀却不是如此，他对所有众生都做饶益，无论是对他有恩还是无恩。以前有位比丘病苦无依，佛陀亲自照顾，为他清洗沾在身上的粪尿。佛陀还收留了一个婆罗门青年，此人长有十八种丑相，连乞丐群中都进不去。（帕绷喀仁波切又详述了佛陀保护和摄受其他不幸有情的故事：波斯匿王的女儿“金刚女”有着形似猪脸的丑恶面容，这类丑陋的众生，佛陀依然饶益；长者“通晓”的儿子“善来”福报极劣，在他出生之后，家中财产逐渐耗尽，最后沦为乞丐，凡是与他同行乞讨的人都得不到食物，名字也被改称作“恶来”。", "不论任何地方他都找不到友伴，甚至于进不了乞丐群中，连接近都不被许可，厄运连连，也是由于佛陀的庇护、摄受，而得到拯救。）所以，佛陀的大悲不仅对众生没有亲疏之分，而且普做饶益，不论对方对佛是有恩还是无恩。事实上，佛陀对弱小的众生还特别悲悯。（帕绷喀大师总结说，如果我们所归依的对象缺乏大悲心，想要得到保护也是枉然；由于佛陀具有大悲心，纵使不向之求助，佛陀也必然会救护。）庚三、归依量为几何简单地解释了归依因和归依境之后，现在要接着讲归依的量，分为以下四个方面：", "辛一、由知功德之门归依我们应该在了解三宝各自的功德后做归依，所以分三点来讲：佛功德、法功德和僧功德。一、佛功德佛功德又可细分成身、语、意、事业四种功德：1．身功德佛身以三十二相、八十种好为庄严，即如《现观庄严论》中所说的“手足轮相具、足底如龟腹”等三十二相以及“佛爪赤铜色”等八十种好。“相”表拥有者为大丈夫；“好”为具有内在功德的象征。若能思惟相、好体性的功德和因的功德等，会更有力量，所以在此我们按照《宝鬘论》中所说的教授来修：假如我们将独觉、有学和无学声闻，以及转轮王等世间所有的福德加起来，也只能成就佛身的一个“毛孔”；成就所有“毛孔”福德的一百倍方成一种“好”；成就所有“八十种好”福德的一百倍方成一种“相”；成就“三十二相”福德的一千倍方成“白毫相”；成就“白毫相”福德的十万倍方成“顶髻相”；成就该相福德的一千兆倍方成“佛语梵音”。此外，如来的相、好等全身各支分，均有说话的功能，宣讲佛法。顶髻和毛孔等也有心的功能，可以明见一切如所有和尽所有的所知境。因此，按照“道次第”传承祖师的规矩，“俱胝圆满乐善所生身”等三句，每一句均可配合身、语、意来解释。", "因此，佛身周遍一切所知境，凡是佛身周遍的地方，佛语和佛意也同样周遍。所以说，一切世界映现于佛身，佛身周遍于一切世界，佛身秘密不可思议。经中说：智所周遍处，身亦如是覆。佛陀的顶髻通常在瞻仰时只有四指高，但如果真要加以测量，那是无法办到的。《秘密不可思议经》中说，“持力”菩萨曾以神通向上飞越无量世界来观看，但始终无法见到如来顶髻的尖端，最后倦而返回。佛陀的衣服不触及身体，总是离体四指左右，但前来觐见者均能清楚地见到佛身的轮廓；佛陀的双脚虽不碰地，但能清晰在地上留下法轮等纹路的足迹；如果虫蚁等正好进入佛的脚下，它们将在七日内沉浸于极大的快乐，然后从畜生道死殁往生天界。此外，我们也应忆念《喻赞》中所说的那些功德：相庄严尊身，殊妙眼甘露，如无云秋空，群星为庄严。能仁具金色，法衣瑞严覆，等同金山顶，为霞云缚缠。尊怙无严饰，面轮极光满，离云满月轮，亦莫能及比。尊口妙莲花，与日开敷莲，蜂见疑为同，当如悬索转。尊面具金色，洁白齿端严，如净秋月光，照入金山隙。应供尊右手，为轮相殊饰，以手作抚慰，生死所怖人。能仁游行时，双足如妙莲，印画此地上，莲苑何能美？", "（帕绷喀大师说，此处如果要广修，应配合《现观庄严论》等经论中所说内容。）324掌中解脱菩提道次第二十四天教授汉译《守护国界主陀罗尼经》卷6:“一音普遍无边刹,各各得闻随类音。”（T19，no.997，p.553c29-554a1）汉译《大萨遮尼乾子所说经》卷6：“所有众生界，众生所摄，彼一一众生言音不同，一时各各作百千种种异问，彼一一众生所问之事，余不重问，能以一念相应智慧，以一音答尔所众生，能令一时各得其解。”（T09，no.272，p.343c20-24）引自《三时颂》。《般若波罗蜜多经》的别名，广本为十万颂，中本为二万五千颂，略本为八千颂。详见汉译《佛说如来不思议秘密大乘经》（T11，no.312）卷7。汉译《一百五十赞佛颂》：“美颜宣妙词，如月流甘露。慈云洒法雨，能清染欲尘，如彼金翅王，吞灭诸龙毒，能殄无明暗，喻如千日光，摧碎我慢山，譬犹天帝杵。现证非虚谬，静虑除乱心，如实善修行，三事皆圆满。创闻佛所说，心喜已开明，从此善思惟，消除诸垢染。遭苦能安慰，放逸令生怖，著乐劝厌心，随事皆开诱。上智证法喜，中根胜解生，浅劣发信心，尊言遍饶益。", "”（T32，no.1680，p.760a24-b8）摧坏极无知，翳障如日光，由摧我慢山，故亦等金刚。见义故无欺，无过故随顺，善缀故易解，尊语具善说。初闻尊之语，能夺闻者意，次若正思惟，亦除诸贪痴。庆慰诸匮乏，诸放逸所归，令乐者厌离，尊语相称转。能生智者喜，能增中者慧，能摧下者翳，此语利众生。（帕绷喀大师又指出，佛语不仅具有上述功德，而且还有身与意的功用等，佛语秘密深不可测。）3．意功德关于意功德的详细情况，应当参阅各大教典，了解十力、十八不共法等二十一种无漏智品类功德。已经闻思过大论的人，也应将大论中广泛开示的内容在此加以利用而做思惟。简言之，意功德可分“智功德”和“悲功德”两种：智功德，佛陀能在如所有性中入定的同时，明见一切尽所有法，如观手中庵摩罗果。《赞应赞》中说：世尊堕时法，一切种生本，如掌中酸果，是尊意行境。诸法动非动，若一若种种，如风行于空，尊意无所碍。比如说吧，过去释迦族有个名叫难达嘎的人去世之后，一些自然外道为他做超度法事，这些外道照往常风俗将死者召来现形并施予饮食，难达嘎的亲戚都信以为真。佛陀说，那是乾闼婆“毗雅巴嘎”和药叉“桑噶达”等鬼神变化成死者的样子而来。", "但他们都不相信，于是大师命释迦族每户各带一个米袋来，内藏各户的姓名条。释迦族人照办了，因为户口众多，结果需要一头大象才能将那些米袋驮来，佛陀一个也不差地辨别出哪个米袋是属于哪一家的。至此，释迦族人才由衷生信。这是经里讲的。律典中也说，如果世界上所有的树被火烧成灰烬，并放在海里随浪翻搅多时，再呈交给佛陀，佛陀甚至能一一辨别出这些灰烬原是树的哪个部分、属于哪个树种、生长在哪个地方。除此之外，佛陀还有许多其他方面的功德：所谓“身随示神变”，是指佛陀能在千万亿等任何数量的所化前面各现一个化身；所谓“语普说神变”如前已释，是说佛陀能随顺每一有情的语言和意愿，开演佛法；所谓“意等持神变”，是说大师在做“世俗发心”时，能使一切有情，甚至蚂蚁如此微小的生物也能了知其他有情的心思以及如来的意向；在做“出世间发心”时，则连“最后有”菩萨也无法知道佛陀的想法。（帕绷喀大师又说，佛在说《佛母》时，曾将一切世界转变成净土。如是等等，佛的功德无量无边。", "）“悲功德”，如伟大的第七世嘉却·格桑嘉措所说：或有凡夫于自钟爱偶为瞋恨自在时，亦行弑戮然汝恒念诸有情众如独子，损恼之意下至少分心中久已抛弃故，如我自爱较汝悲心纵然一分亦难及。我们对自己的珍爱再怎么深切，也比不上佛对有情悲愍心的一小部分。而且佛的悲心与我们有或增或减的悲心不同，不是见到受苦的有情才生起、没有见到就不生起，因为佛陀永远观见一切有情在受苦，所以他的大悲心也从不间断，永远地对有情运转。佛陀的悲心，是早在入道以前就开始修习并获究竟纯熟的力量所致。由鉴于此，《百五十赞》中说：", "此一切众生，惑缚无差别，为解众生惑，尊久为悲缚。《谛者品》中也说：观见痴黑暗，常覆众生心，陷入生死狱，胜仙发悲心。4．事业功德对此，我们应按照《宝性论》中所说的九种譬喻来思惟：如帝释鼓云梵天，如日亦如摩尼宝，如来犹如谷响者，亦如虚空与大地。当帝释的影像不待功用和分别，映现在吠琉璃地面上时，小天神见到后都想获得同样的成就，于是去修集资粮以求获得天主帝释的果位；同样地，当人们看到相好庄严的佛身时，也会想获得佛身而积聚其因，这是佛身事业。三十三天界中有一只大鼓，称作“持力”，系由诸天神福德所成。该鼓不捶自响，发出法音，开演四法印，劝说天神们去追求解脱；同样地，诸佛不需要有动机的造作，便能普宣佛语，将众生安置于增上生和决定善中，为有缘和可堪教化的众生说法，这即是佛语事业。犹如云中降下的雨水能使禾苗生长，能使所化相续中的善根稼穑生长，是为佛意事业，如是等等。此外，佛以示现身神变调伏有情，以语事业说法，借由“无烦恼三摩地”而行意事业。", "简言之，八地以下的菩萨需要依靠粗显的功用，八地以上的菩萨仍需要微细的动机，所以无法做出同时利益一切有情的事业。佛的事业则不然，佛不需要有“我当饶益有情”这样的动机和功用等。正如空中的月亮本身没有分别心，在任何有水的容器，甚至草尖上的露水，只要水面上澄清不动，就会倒映出月影；同样地，一旦所化的相续清净、调伏的时机已到，佛的事业便会不假功用、自然而然地发生作用。（帕绷喀大师指出，所谓“佛的事业”，事实上是指“以自因智慧法身为增上缘所生的白善功德。”）二、法功德诸位当中已学习过大论者，应思惟如见道、无间道断除自道本分障盖的道理。不了解的人，可以想一想，以前所讲佛所具有的不可思议功德是从哪里来的？这些功德是借由灭、道等证法和教法才得以产生，所以法具有生出如是不可思议功德的功德。（大师解释说：总的说来，法宝是就灭谛及见、修无间道等五道、十地而言，但此处所说的法是以调伏自心为主。所以粗浅地说，如前所言，可依此“道次第”作为代表。）三、僧功德以声闻资粮道行人为例，因为对三有生起厌离即入资粮道，培养“十三种菩提资粮”并获得三十七菩提分中的初三分，为了利他而显现变化和神通等；", "加行道行人抽象地通达四谛十六行相；见道行人有现证空性等功德；修道行人逐渐断除八十一种修所断烦恼；证阿罗汉者功德更大：他们可以将物体由多变少；凭借地遍、水遍、火遍、风遍和空遍三摩地显现多种变化；能到临任何有所化的地方。（帕绷喀大师说，声闻阿罗汉也有无量功德：佛陀涅槃后，阿难调伏外道，在七日之内令八万人见谛；近隐阿罗汉说法时，有恶魔降下食雨和宝雨，又变化成舞者表演舞蹈，近隐为她套上花鬘，加持成异常丑陋的面目。）我们现在大多将“声闻”看得很低微，但如果我们仅有声闻的功德，恐怕也会被归入大成就者之列。独觉因为百劫积集资粮等缘故，所以其功德要较声闻更胜百倍、千倍。菩萨的功德更是浩瀚无际。资粮道、加行道位“胜解行地”的菩萨，以闻、思、修抉择空性义，因修习悲心、菩提心和甚深见，压伏现前的能取、所取分别，圆满第一阿僧祇劫资粮；见道位初地菩萨布施波罗蜜多修持为最殊胜；修道位二地至十地的菩萨，随着观见法性的不断深入，获得其他九种波罗蜜多的修持圆满。此外，初地菩萨能在一刹那间获得十二种百功德：化一百身；每一化身有百位菩萨围绕；能见百劫；震动百世界；入百种三摩地；见百位佛；得百佛加持；化现一百佛刹；", "游访一百净土；开启一百法门；成熟百位有情和住世百劫。十二种功德一一对照，二地为千，三地为十万，四地为百俱胝，五地为千俱胝，六地为十万俱胝，七地为百千俱胝那由他，八地为十万三千大千世界微尘数，九地为等同百万阿僧祇世界微尘数，十地为等同不可说不可说三千大千世界微尘数。（简言之，不净七地获得圆满第二阿僧祇劫资粮的功德，清净三地获得圆满第三阿僧祇劫资粮的功德。如是等等，详如各大经论所说，僧功德无量。）辛二、由知差别之门归依由知差别之门归依分六部分：一、体性差别佛的定义是现证菩提者，亦即没有任何障盖、直见一切诸法真理的人。菩提一词藏文为“强曲”，其中“强”的意思是熟练，就像我们称精于念诵为熟练一样，证德达到究竟亦名如是；法的定义是佛出世的结果，如佛转四谛法轮时，“五贤士”相续中相应生起见道等种种证德，乃随程度不同而异；僧的定义是修习佛法者。二、事业差别佛的事业是讲经说法；法的事业是断除应断之烦恼；僧的事业是从旁协助积极向善，例如，以身作则修法证果而为他人楷模等等。三、信解差别归依时，对三宝信解不同，如同渡江时对船师、航船和同行之人的态度：对佛，应当看成是供养承事的对象；", "对法，应看成是自心中应当现证的内容；对僧，应看成是如法同行的伴侣。四、修行差别即将上述三种信解用于实修。五、随念差别即按照《随念三宝经》中所说的内容，来忆念三宝的功德。", "六、生福差别生福差别在于佛是凭借一位补特伽罗就能增长福德；僧则是凭借多位补特伽罗增长福德。佛与僧是就补特伽罗而言；法是依靠非补特伽罗来增长福德。所以，归依佛是以供养和敬奉之心归依；归依法，是要令法在自己相续中生起而归依。辛三、由承许之门归依由承许门归依分三个方面：承认佛为开示归依的大师；承认法是正归依；承认僧是修行归依的助伴。就像病人对医师、药物和护士寄予三种不同的期望一样。在相续中每生起一种断、证正法，就能解脱一种怖畏，因此以法为正归依。辛四、由不言有余之门归依以前，印度的超成主论师兄弟二人，最初乃外道，为了供养大自在天，前往岗底斯山，当他们目睹大自在天也归依佛陀，便投入佛门，成为大乘的大阿阇梨。之后，为歌颂佛的卓越功德，造《殊胜赞》一文。应如赞中所说，以我们的大师为归依处，坚定不移地学习佛的教法；不以苯教和印度外道六师等佛法以外的对象为归依处。内道与外道的大师、教义及学习该教的僧伽，其胜劣之区别，如《殊胜赞》中所言：我舍诸余师，我归依世尊，若问是何故？尊无过具德。又说：于余外道教，云何善思惟，如是于怙主，我心起深信。", "《赞应赞》也说：何应趣应遮，何净何杂染，此是大雄教，与他言说别。藏地虽然没有真正的印度外道，但有些自称是佛教徒和学者的人，在遇到紧要关头，或是为了广收徒众，或顾全别人的面子，对信奉苯教或蛮夷宗教也觉得无所谓。这是认为有两种归依处的做法，已舍弃了心中的归依，而被摒出内道之列。有些人说：“我爱好佛教，也爱好苯教。”然而苯教的大师、教义及其信徒并没有堪作归依的原因存在。苯教大师并不具备断尽一切过失等功德，教义中连如何减轻烦恼的方法都没有；虽然苯教的僧团表面上也受别解脱戒，但并没有律仪的传承，所以这三者都不具足功德。苯教中连内道的归依都没有，所以不宜归依。（帕绷喀大师告诫说，佛、苯之间不应像吵架一样，相互说一些贪自瞋他的话。重要的是，我们应当阅读过去智者的权威论著，以了解苯教的起源，例如土观·达摩伐折啰（法金刚）的著作《论一切宗派之源流与教义·善说晶镜》等。）苯教在祖师、教义、见地三方面，混杂有外道的见地和修持，并剽窃佛经伪造成自己的经典，从古代生存下来流传至今。这种低劣的教派绝不是求解脱者可以归依和信任的对象。", "止贡·季丹贡波（世间依怙）基于这些考量，说道：“在苯教的见修类文章中，有的说一切情器世间是从卵中出生，也有说是由卦象或自在天所创造，这都是外道邪见的流衍。”《噶当子法》中说：外道苯教悉地速，暂乐终堕恶趣中，外道苯教似炉火，稍近虽有安乐起，若行接触即焚烧。", "瑜伽自在杰·密勒日巴也说：苯教根源为邪法，具力龙魔之所创，不入解脱究竟道，苯教乃是极劣种。外内二道差别者，乃归依处相径庭：内道归依为三宝，外道梵王遍入天。自身解脱生死已，方能解脱他有情，此唯佛陀正等觉；大自在等世间天，自为生死系缚故，虽有能力为他人，赐予暂时小悉地，解脱生死何能赐？又说：《白色十万龙经》等，说于五部龙坛城，愿求成佛甚荒谬，龙者乃是畜生故。“苯身普贤”等坛城，花样虽多率皆是，往昔蓝裙班智达，所臆造之诸邪法。现在有些人将苯教的“辛拉沃噶”与观自在视为同一，并说一切有情皆诸佛所化之故，苯教中也有许多佛菩萨的化身，所以修苯教只有好处没有坏处。这种说法只是自己被邪见恶习所染污蒙蔽的过甚之辞。如果这不是过甚之辞，试问，畜生中也有佛菩萨的化身，如果仿效猪狗的行为，是否也是有德无过呢？所以，凡是求善之人，应该将所有令人反胃的恶见像擦粪的石头一样丢弃，认定佛教的三宝为真正的归依处，全心交付三宝，这是最重要的。简言之，归依并不是口中念诵的文句而已，归依就好像罪犯向有权势的官员寻求庇护的心态一样，因为害怕恶趣与生死，相信三宝有能力拯救，企盼三宝作为依靠，这是归依的标准。", "归依是否在相续中生起，取决于是否已有这种心态。所以，在归依的体性没了解清楚前，先不要急着只是念完十万遍归依文，而应努力设法在相续中生起不造作的归依因和体性等等。", "归依有两种形式：以他相续中已成就的三宝为对象而祈求庇护的“普通归依”，以及以未来在自相续将出现的三宝为对象而决心证取的“殊胜归依”。每一种均有“三士”各别的归依做法。学习大论的人，应以“殊胜归依”为主而努力修习。如果到了修归依的时候，向来所学却派不上用场，与一般在家老先生的归依没有区别，这是闻思不能致用所犯的错误。不懂经论的人，也应具足归依的二因而全心全意信赖三宝。具体做法应当如病人指望医生、药品和护士的态度来修。如能由具足二因之门至心信仰归依三宝，便是在相续中生起了清净归依，因此这是最主要的。否则，计数念归依偈也好，自称是菩萨和持明者也好，都一无是处。正如噶当派祖师所说：“睨视顾盼的上座，或许尚未入内道佛教徒之列。”庚四、归依利益归依利益有八种：（辛一）入内道佛子数；（辛二）为一切律仪之基础；（辛三）灭尽往昔所集诸业障；（辛四）顺易累积广大福德；（辛五）人与非人不能为害；（辛六）不堕恶趣；（辛七）无劳成就现前与究竟诸事；（辛八）速疾成佛。辛一、入内道佛子数修归依时，不要像学舌一样流于空洞言词，而是能至诚归依。心中何时生起清净归依，何时即进入内道佛教徒之列。", "否则，即使计数满十万遍“归依偈”，也不是内道中人。现在可以听到很多人说念归依计数，而很少有人要在心中生起归依。以前达波地区有位比丘名叫“阿塔”，与朋友们一起念归依偈计数。阿塔因认真思惟归依的内涵，需时甚久；其他人却只顾计数，念第十二天归依——入圣教之门335详见《阿阇世王问五逆经》（T14，no.508）。藏译《摄波罗蜜多论》（ཕ་རྲོལ་ཏུ་ཕིན་པ་བསྡུས་པ་ཞེས་བྱ་བ།D213Khi，no.3944），马鸣菩萨作。汉译《大悲经》卷3：“阿难！譬如长者营田之时，地不荒秽、无诸荆棘及以瓦砾、粪壤肥良、垦治调柔。以新种子盛以宝器不腐不败，依于时节下种田中，随时溉灌、锄治、料理，于一切时常善护持。阿难！若是长者营田之士于余时中到彼田所，住在田畔作如是言：‘咄哉，种子！汝莫作种、莫生、莫长，我不求利亦不求报。’阿难！于意云何？可以田夫语故，种子不生、不作种也？阿难言：不也，婆伽婆！不也，修伽陀！彼必作果，非无果实。佛言：如是如是。阿难！若有众生乐著生、死、三有爱果，于佛福田种善根者作如是言：‘以此善根愿我莫般涅槃。’阿难！是人若不涅槃，无有是处。阿难！", "是人虽不乐求涅槃，然于佛所种诸善根，我说是人必得涅槃、尽涅槃际；乃至佛所得一发心、一生敬信种善根者，一切皆当得般涅槃、尽涅槃际。”（T12，no.380，p.959c27-960a14）“阿难，譬如某长者有一广大良田，无诸岩石、树根、荆棘及砂砾，善作耕耘。所选之种亦新鲜未腐，未受风吹日灼，不因断裂、腐烂而损耗。此等种子应时播入田中，时时灌溉，或令干燥，以一切种善护之。阿难，若彼长者后时复至田前，立于塍言：愿汝种不成！愿汝种不生！愿不增长！我不需有果！我不需所得！阿难，于意云何？彼长者能以言辞令彼等种不成种否？”答曰：“不也，世尊！不也，如来！”复问：“彼果不成果否？不现前得否？”答曰：“不也，世尊！不也，如来！”佛说：“阿难！彼赞叹三有、欢喜三有者亦复如此，彼供佛已，发愿永不以此善根成究竟涅槃，然不成究竟涅槃者无有是处。阿难！于佛所生之诸善根，不欲亦成涅槃果，我说彼等终成涅槃。如是乃至于佛世尊一念心生，彼等一切善根之果即是涅槃，我说彼等终成涅槃。”辛五、人与非人不能为害归依者，人与非人不能为害。以前有外道修“风绳法”成就，企图用风绳套住一位年轻的佛教居士，未能得逞；", "印度有一人触犯王法，被放逐到尸陀林中，以前凡是被扔进尸陀林的人，当晚就被食肉非人攫走吃掉，没有一人存活，此人用一块僧衣碎布放在头上，并作归依，得免非人之害。过去有个藏人牧民，在荒原迷路一天，遭到熊的攻击，几乎死去，他醒来时头部已受到重创。后来有位师长问起他受伤的原因，便向师长陈述了遇险的经过，于是师长为他开示“归依”教授。后来有一天，他又再次与熊遭遇，便疾做归依，那头熊用鼻子嗅了嗅，居然闻不出人的气味而走开了。", "又如给孤独长者的故事，他只是口诵“归依偈”，便在夜晚看见逃离尸陀林的路，非人也无法伤害他，后来因为礼拜一座外道神像而失去加持。有一小偷，窥知有人供养一位比丘布匹，便在夜间前来行窃，比丘设计捆绑住他的双手，一边口称三宝之名，一边用棍子痛打三下。小偷逃走后，来到一座桥梁下方，那座桥上经常有非人出没。他复诵先前比丘的话，暗自嘀咕道：“幸亏只有这三句，要是更多，我今天就死定了。”当天晚上，没有非人敢经过那座桥。（帕绷喀大师例举了这些故事，接着说道：我们面临紧要关头时不要恐慌，应衷心仰赖三宝，以三宝为唯一的归依处而修归依。）辛六、不堕恶趣归依能免堕生恶趣。以前有位天子，死后确定受生为猪，临终时向帝释求救，但帝释无力救助而转求佛陀，佛陀开示了“归依”教诫，后来天子依佛教诫在归依中死去。后来帝释观察该天子死后受生在何处，由于各界天神只能见到比自己低下的地方而无法看到上层天，帝释无法在上层天发现他的踪迹，便向佛请示，佛揭示说，他已受生在兜率天中。由此可见，“归依”修法不仅使必然受生为猪的天子免堕恶趣，还令让他往生更高层的天界！", "现在我们口诵“归依发心偈”时，不知道“归依”法的重要性，总是东看西瞧、心生散乱；而在念“娑跋瓦”等观空咒的时候，却喜欢装模作样、故弄玄虚地闭闭眼睛，这反映出：我们根本不知道内道的入门和免堕恶趣的稀有方法在哪里！阿底峡尊者洞察归依和业果的重要性，而开示这方面的教授，故而得到“归依师长”和“业果师长”的称谓。尊者听说此事后言道：“单凭我的这个名字，也能利益圣教！”所以，我们与其假装修一修在临终时使不上力的生圆次第，还不如修习清净归依，因为它能保证我们下一辈子不堕恶趣。桑结绷曾说：总之死无常，心中若未生，“集密”未为深；心生死想时，三归依亦深。辛七、无劳成就现前与究竟诸事随愿成就的方法，没有比归依更殊胜的了。正如菩萨热振瓦所说的那样：别太指望于人，而应启请于天。过去的大德，其暂时和究竟诸事一切都是依靠祈祷三宝（天）而实现愿望。以前热振地方有个人，就是靠这个方法赢得诉讼等事。辛八、速疾成佛现在因做归依而形成“造作等流果”，能使我们在今生中一遇到恶缘便立刻一心归依。因为心总是跟着习惯走，法尔如是；所以临终之时，也能忆念佛陀。如《三摩地王经》中所说：如是念能仁，佛身无量智，常能修随念，心趣注于此。", "又说：", "清净身语意，常赞佛胜德，如是修心续，昼夜见世怙。若时病不安，受苦至于死，念佛不退失，苦受莫能夺。（帕绷喀大师总结说，归依不仅有上述利益，还能令一切生中获暇满身，遇归依处，不离归依行，学究竟道而在自相续中成就三宝、速疾成佛。）庚五、归依学处归依学处可分两种：（辛一）各别学处；（辛二）共同学处。辛一、各别学处各别学处中又分：（壬一）应遮学处；（壬二）应修学处二种。壬一、应遮学处一、不归依世间天神归依佛后不可归依世间天神。现在连一些比丘在遇到意外，窘困无奈时，也跑到世间天神像前，叩头如捣蒜，这种行为败坏了佛弟子的声誉。如前已述，如果认为有两种不同归依处，将破坏自相续的归依律仪，并被逐出内道的行列。我们可以对天、龙、王魔、厉鬼等施食及做香施、烟施，只是请他们作如法的助伴，而不必归依。就像给别人送礼，请他们帮忙办事，而不需归依一样。二、不损害有情归依法的人不应伤害有情。伤害的意思，不仅是指屠杀、捶打和掠夺等情节特别恶劣的事情，指派不正当的苛捐杂税，以及虐待动物，如强迫牲畜超重驮负等，也是损害有情的行为，不可以去做。三、不与外道共住归依僧后不可与外道交往。", "虽然在藏地并没有真正的印度外道，但还是有与之类似的人，他们不信三宝和业果，认为这些都是善辩的师长、格西们捏造出来的。我们应避免与这类人深交。我们的见地尚不坚固，很有可能轻信他们的话而改变信念，所以应当与这些恶友保持距离。某人在格西博朵巴面前提出他对佛陀降世的怀疑，当时格西善巧地反驳说：“那么您的祖先德乌那贡也从未出现过。”此人说：“他是确有其人，因为他留下某某手迹、某某遗物。”博朵瓦引用相同的理路说：“佛陀也留有这些遗规、这些经典！”此人才相信佛陀曾降临于世。壬二、应修学处一、恭敬佛像犹如大师归依佛后，对一切佛像都应想成是真正的佛，包括质地低劣或形状丑陋的佛像，甚至“擦康”内的残破佛像亦然。《亲友书》中说：随工巧拙木造等，智者应供善逝像。我们往往对来自印度的“利玛”像和铜像、金像等抱有很大的敬重，将这些佛像安置在佛龛的最深处；对泥等制成的佛像却没什么信心，已残破的佛像就放在堆垃圾的地方，准备有一天送到“擦康”。先辈祖师们说过，将佛像往外送，无异于将自己的福报往外推。", "同样地，唐卡一旧，就把缎质边幅拆掉，卷起正中的画面处理掉。这已暴露出当事者对三宝缺乏信敬，内心已经腐烂。二、下至一字纸页应敬如法宝归依法后，下至一字也应敬之如真正的法宝，否则生生世世将变成愚痴无知之辈等，过失极大。霞惹瓦曾说：我们对法任意戏弄，不恭敬法与法师，这是恶慧之因。我们现在已经够愚昧了，不要再积集愚痴的因。如果将来比现在更愚痴，我们又该如何呢？我们通常把一枚五分硬币看得比一张字纸更贵重。如果我们发现有钱掉入泥坑里，会设法用长棍等物捞取，对字纸则不然。以前嘉旺却杰（佛王法主）担任基巧堪布时，政府任命他负责“铁虎年调查组”。当时他的办公处堆满了各地宗谿众多的官书文契，每当要走动，像入厕的时候，他总是先搬移文件，空出一条通道才走，此做法应当效法。三、下至红黄僧衣残布应敬如僧宝归依僧后，对掉落在地上的僧衣残布、补钉或穿在身上的僧衣也应保持极大的恭敬。格西敦巴仁波切和大瑜伽师在路上发现一块黄布补钉时，不是贸然踩过，而是捡拾起来抖动干净后，再放在洁净的地方以示恭敬。这样的行持我们应当效法。《地藏十轮经》中说：", "瞻波花虽枯，尤胜诸余花；犯戒罪比丘，仍胜诸外道。假如我们对犯戒比丘不敬，会导致什么样的过失呢？其过失当如《劝发增上意乐经》中所说：希乐功德住林薮，不应观察他过失，不应起心作是念：我是超胜我第一。此骄是诸放逸本，永不应轻劣比丘，一劫不能得解脱，此是此教之次第。辛二、共同学处共同学处有六条：（壬一）由念三宝功德之门再再归依；（壬二）由念恩之门嚼啖之先应作供养；（壬三）安置他有情于归依；（壬四）由念利益之门昼三次夜三次归依；（壬五）随作何事皆倚仗三宝；（壬六）下至戏笑乃至命难亦不舍三宝。壬一、由念三宝功德之门再再归依我们应该经常回忆先前讲述的内、外道大师和教法的差别，以及三宝各别的功德，而不断地归依三宝。壬二、由念恩之门嚼啖之先应作供养佛、法、僧三宝应时刻铭记在心，每当享用饮食的时候，先将荐新部分供养三宝，如此供养，功德极大。（帕绷喀大师进一步开示说，因为三宝乃是无上福田，所以供养时不能掺杂有轻蔑、放逸、懈怠等心，下至供养一杯净水，也应恭敬如新任司膳官上茶予嘉瓦汤吉钦巴。", "）壬三、安置他有情于归依相信并归依“富兰那”等外道祖师或苯教祖师“辛饶”及其教法、入教恶友等，因而造集恶业的人士，应当劝喻说服；其他尚未对三宝有信仰恭敬而可以引导的人士，应当在谈话间讲述三宝的功德。透过这些方式使人归依三宝。壬四、由念利益之门昼三次夜三次归依认可三宝为真正归依处，至诚生起信心，昼夜六时归依三宝。壬五、随作何事皆倚仗三宝事情无论大小，都应倚仗三宝，勤供三宝后进行。不能怀有恶意谄诳等，也不可归依土地神、王魔、厉鬼、占卜师和苯教徒等。壬六、下至戏笑乃至命难亦不舍三宝一旦舍弃归依，就会脱离内道。既然不是内道，就再也不是沙弥、比丘、菩萨种姓和密宗师。归依虽然不是舍弃一切律仪的唯一因素，但如果舍弃了归依，就舍弃了所有律仪。所以，大到生命危难，小到玩笑赌誓，都不能舍弃三宝。《道次第广论》中说：若与为命亦不弃舍，有违犯者，实舍归依；如是虽未舍弃三宝，然亦爱执三宝异品大师等三，亦违不言有余大师，心未诚归，故亦成舍。（帕绷喀大师接着讲述了一个宁舍生命也不舍三宝的例子：过去有外道胁迫一位佛教居士，如果不舍弃三宝就得死亡，居士不愿舍弃归依，遂遭外道杀害，死后投生天界。", "随后大师又将上述内容复讲一遍。）344掌中解脱菩提道次第二十四天教授"]}, {"c": "第十三天", "segs": ["深信业果——一切安乐之本（嘉杰·帕绷喀仁波切先引述三界法王大宗喀巴的话——“死后难保不堕落”等，作为第十三天教授的开场白。在简略地介绍了一些有关前行的内容后，大师回顾了前面已经讲过的科判，重讲了“开示后世安乐方便”两部分的第一部分——归依，并简要讲述其观修之法。接着说：）在引导的科判中，思惟“恶趣苦”和“归依”二科虽然是分开的，但在修习“体验引导”时，则应如下所说将这二科合起来修。具体修法是：向顶上师长祈祷后，从师长心间放出整个“归依境”，布局结构和“资粮田”一样。先猛力思惟地狱、饿鬼、畜生各别的痛苦，对每一种痛苦产生怖畏时，就各修一次归依，此即二科合修。譬如世俗上，绝望的重刑犯得知某位首长大官愿意出面帮忙，虽然他感到自己能力渺小，但因为想到有大官作靠山，便放心地委托大官去求情。同样地，在对恶趣产生恐惧时，当思能救此苦的无欺归依处——三宝就在面前保护和拯救我们，将心整个交给三宝而归依。（帕绷喀大师指出，归依计数可以在“加行法”的开头部分做，也可以在这里配合三种所缘，口诵“归依师长本尊三宝”来计数。", "）举例来说，思惟“等活地狱”苦时，这三种所缘分别是：第一，发起自身受生其中的真切感受，思惟该地狱苦且难忍的情形。那时我们会想，自己现在并没有在那里受生。于是接修第二所缘：虽然现在尚未受生其中，但自己已累积许多可能导致受生其中、强而有力并未失坏的业，而且无法在死前净除这些恶业的情况；并且思惟：若不能净治恶业则确定受生该地狱，从而生起怖畏心。然后修第三所缘：心想救护我们不堕这种恶趣的归依境，具足悲、智、力等无量功德，自己能有这样的归依处实在是太幸运了，因而发起归依。其他各节均可照此依次类推。（以上为归依的广、中、略三种引导，大师妥善讲授完毕。）己二、于一切安乐根本业果发深忍信如此归依三宝之后，虽然肯定可以保证一、两次不堕恶趣，但却不能究竟解脱恶趣。所以，如果希望有十足的把握不再入恶趣，必须努力于“归依学处”。否则，就像一个罪犯，虽然得到一位有权势的官员庇护，今后什么事该做、什么事不该做的告诫却不听从，仍然一味地胡作非为，即使是再高位的官员也救不了他，以后还是得受法律的制裁；同样地，如果我们不能如法遵守“归依学处”，三宝也爱莫能助。", "因此，大师所开示保护我们远离恶趣的正归依就是法，更明确地说，就是业果的取舍。如果对业果未生起深忍信，我们便难以做到“莫因善小而不为，不因罪小而不断”。假如对业果不能如理取舍，不论是精通三藏的学者、还是获得悉地的瑜伽师，全都要堕入地狱。师长阿瓦都底巴有一次准备过桥时，回头望着阿底峡尊者说：“在断我执之前，如果不重视业果，纵如某某学者和某某瑜伽师那样的人物，也会投生在地狱中。”据说连惹译师这样的大师也必须堕入地狱，虽然时间极短，像击彩球那样一弹即起。印度有个修“大威德金刚”的瑜伽师，死后受生为凶恶的饿鬼，形状却像本尊，当他来到藏地时，阿底峡尊者说，如果此鬼留下，将危害藏地。于是抛朵玛回向，将他赶了回去。提婆达多虽能背诵一个法蕴，仍然无济于事，死后受生在极热地狱。又有个叫“杂那加”的婆罗门青年，修“降阎摩”成就，以诛法杀死许多人，死堕无间地狱。如果我们不能如法地取舍业果，纵然闭关专修也无益处可言。潘波的泊朵地区有个“大威德金刚”瑜伽师，此人死后也变成状如本尊的饿鬼，来找生前的道友，请求为他做一次烟施。（帕绷喀大师又讲述了止迦摩啰室啰寺的一位上座，如何受生变成一个双手反长的饿鬼。", "）因此，如果不能深信业果而如理取舍，不论是学者或是成就者，都没有用。不仅如此，如果轻视业果，就连那些大菩萨也照样会在恶趣中受生，有道是：业异熟难思，具悲堕畜生。所以说，禅修之始为改正动机；“道次第”之始为暇满；修法之始为如理取舍业果。最后一项也称为“世俗正见”。这里所谓的“世俗”是指凡夫，意为对我们凡夫来说，应当以此为最主要的正见。现在有很多人似乎对空性正见有极大的兴趣，但对初学者来讲，应该首先对业果起深忍信、进而做出如理的取舍才最要紧。那些缺乏这一认识的人，或是一副忙于修正法念诵的样子，或是一副忙于修正见禅定的样子，都是不知道如何修行佛法的征相。某些人一天到晚作奸犯科，并教唆仆从和弟子外出到处造罪。虽然他们早起晚睡，貌似勤于念诵，实际上却是一种颠倒的行持。为了对业果起深忍信，我们必须思惟业果。思惟业果分三部分：", "（庚一）思惟业果总相；（庚二）思惟别相；（庚三）思已如何进退之理。庚一、思惟业果总相此科分二段：（辛一）正明思惟总相；（辛二）分别思惟。辛一、正明思惟总相共分四节：（壬一）业决定理；（壬二）业增长广大；（壬三）不遇未造业；（壬四）已造业不失。薄伽梵所说的这四种业果道理极其重要。壬一、业决定理律典中说：造作何等业，即生何等果。为善之因所生之果，只会是乐不会是苦；为不善之因所生之果，只会是苦不会是乐，这就是因果决定。正如辛辣的种子决定生出辛辣的果实，苦涩的种子决定生出苦涩的果实，甘甜的种子决定生出甘甜的果实，所以，必须在当下的因位时就小心谨慎，果一旦成熟就无法改变。有时候经忏对治病等并无效用，这表明其因果作用不同。就像先前种植的辛辣种子如辣椒等已经生长，为了使它变甜，再在周围种上葡萄、桃子等种子并无济于事，它们只会各长各的。所以，造集什么样的因就会出现什么样的果，业果的运作方式极其微细。过去，有位长老名叫“具妙音”，他的身体很丑陋，声音却很动听。这是因为以前某位国王建造大塔的时候，他是一位造塔的雇工，因为工程浩大而口出怨言，他认为没必要造那么庞大的塔、这样巨大的工程难以完成。", "当塔落成时，他又为以前所说的话忏悔，并为塔献上一只风铃，于是产生那样的果报。阿底峡尊者来到藏地后，有个藏人在他面前随意地造些小罪，尊者对此心生不忍，说道：“老汉！老汉！不可这么大胆。业果是微细的，业果是深邃的！”以前有个比丘，因破坏僧伽集会的座垫，后世变成一个背上长黑斑的人。另有一个比丘在沸水里染法衣，衣服变成一张小牛皮，引起一场偷牛的诉讼，被监禁了六个月。因为此人以前曾诬告一位独觉偷牛犊，致使独觉蒙冤坐了六天牢狱，所以感受此报。舍卫城有个大臣名叫梨耆弥，他母亲萨噶玛生有三十二个儿子，个个都是大力士。由于其他大臣向波斯匿王进馋言，于是国王将这三十二个儿子全部斩首，并将首级交给他们的母亲。这是因为以前三十二个窃贼偷牛、杀牛之报；杀牛时客栈的老板娘在场，此人即萨噶玛。（帕绷喀大师详细地讲述了这一故事，并说此即“业决定”。）壬二、业增长广大与外因果相比，内因果的增长程度尤为巨大。所谓外因果者：譬如小小的一个桃核，可以长成一棵大树，每年又可以繁殖增长出成百上千的树叶和果子，而内因果增长的程度更为惊人。", "当薄伽梵来到尼拘类的时候，有个妇女供养佛陀一握芝麻饭团，佛陀因此授记说，她未来将受生为独觉，名为“善愿”。她的丈夫却批评佛陀说：“请你不要为了得到一点吃的就说谎。”佛陀于是以尼拘类树为例，说：该树的树种只有芥子那么小，但长成的树却极为硕大，树荫下可平放五百个车乘而绰绰有余；同样地，小小的业也会生出巨大的果。那位丈夫于是信受。又如以前有几位比丘，因为讥笑其他比丘的声音像狗叫、青蛙叫，形状像猴子，由此分别五百世受生成狗、蛙和猴子。以前，汉地有人写了一本《蛇喻论》，书中称当时的学者都像蛇一样。有一天，这位作者体内剧烈疼痛，手脚与躯干粘合在一起，变成了蛇身。最后头颅裂开，里面伸出一只蛇头，当生即变为真蛇。过去印度有五百渔夫曾逮住一条长有十八个头的大鱼，佛陀为人解疑说，此鱼的前生为“摩纳瓦劫比罗”，因受其母教唆，对僧伽口出恶言、骂人像狗等而感得此报。虽然薄伽梵是为了向大家开示业果的运作情形而来，那些外道却说，沙门乔达摩也喜欢看热闹等等，做了种种毁谤，详细内容在前面讲“加行法”时已讲过。上述这些事例，均是因为只说了几句骂人的话所造成，这些尚非杀人、打马之类的大罪。", "又如比丘尼“具优波罗色”的故事：这位比丘尼在出家前曾生有两个儿子，一个溺水淹死，一个被狼吞食，丈夫也被蛇咬身亡，父母一家都被火烧死。后来嫁给一个流浪汉，又生下一个儿子。孩子出生时，她的丈夫在别人家里喝醉了酒，回家后把婴儿杀掉，又强迫她吃儿子的肉。于是她逃走了，遇上另一个丧妻不久的男人，然后又嫁给此人为妻。过不多久，这位丈夫也死了，根据当地的习俗，她被活埋陪葬。之后被一个盗墓者掘出，成了盗墓人的妻子。这个强盗头子后来又被国王处死，她再次被活埋陪葬；受尽了千辛万苦。这是因为她前生当王后时，曾将王妃的儿子杀掉，为表明清白，发了一系列毒誓，于是感受此报。像这样的故事为数极多。业果的道理比空性更微细难测，声闻、独觉阿罗汉也能通达和开演空性的精微义理；但对业果的微细道理，只能通过圣教量来加以推测，因为这个领域只有佛智才能达到。正因为业果极其微细，所以即使是最微小的罪，我们亦应羞于造作。《集法句经》中说：莫思做轻罪，不随自后来，如落诸水滴，能充满大器，如是集少罪，愚夫当极满。同样的道理，微小的善业也会增长成妙果。", "“我乳”转轮王能统治四洲和部分天界，是因为他过去将一握豆子洒向毗婆尸佛，其中四颗落入佛的钵内，一颗留在佛的顶髻上，因而感生的果。以前佛陀在世的时候，有个名叫“金财”的婆罗门青年，手中不断生出金币。这是因为他前生做木柴生意，用贩卖木柴得来的一枚金币，放在陶瓶里注满清水，供养迦叶佛而感生的果。上座“金犊”降生的时候，家中仓库自然生出七头金色的象，大象排泄的尿、粪也会变成黄金。未生怨王先后抢去七次，但都没入地下回到原先的地方。这是因为在迦那迦牟尼佛时代，金犊曾修复一座佛陀坐骑象的塑像，并涂上石黄，感生此果。比丘尼“白女”诞生时，从母胎里带出一件迦尸迦布衣。出家时，这件衣服又变成法衣。这是因为以前一对贫穷夫妇，只有一件衣服，谁外出谁就穿上，他俩毅然将这件衣服供养迦那迦牟尼佛，不怕受窘，因而感生此果。当时，他俩也因此而受到国王及王妃馈赠衣服，果报在现世即成熟。所以，我们不要因善小而不为，《集法句经》中说：莫思做少善，后世不相随，如落诸水滴，能充满大瓶，由略集诸善，坚固极充满。（帕绷喀大师总结说，在修“业决定”与“增长广大”这二节时，我们下定决心：善决定当修，罪决定当断；善小亦当修，恶小亦当断。", "）壬三、不遇未造业战争期间，某些人惊讶地报告说：“我没有任何护身的物品，在枪林弹雨中却没有受伤。”此即不遇未造业的一个例证。有些人起初能够避免武器的伤害，后来却被杀，有人说这是护身符失效的缘故，这显示出此人不懂业果的道理。实际情况是：那些人起初未遇到致死的业，后来却遇上了。如果未遇应受业，就是被火焚烧也不会死亡。（帕绷喀大师举例说，以前有个名为“火生”的长者，与母亲的尸体一起被火焚烧却没有死，后来证阿罗汉果。）又如上说，未生怨王企图抢夺金象七次，均因金象没入地下而未果。国王优陀夷的王后“绀容女”已得不还果，五百名侍女也已见谛。当婆罗门“无忧”放火烧宫时，她们却无法腾空远飞。绀容女说：“自作自集之业如果自己不负责，还有谁来负责？”于是像飞蛾扑火一般，全部坠入火中烧死。只有一个叫“曲脊”的婢女由水沟逃脱，而她却没有丝毫神通。琉璃王带兵攻打释迦族的时候，当时释迦族有七万七千人已得预流果，但全部无法躲过此劫而被杀。只有一些未做此业的人，在释迦摩诃那摩（大名）潜入水里的时候逃脱。洛惹噶城被土雨淹没时，国王、大臣和百姓全部遭殃，只有两名大臣逃出。这些也都是不遇未造业的例子。", "壬四、已造业不失经中说：纵然经百劫，所作业不失，因缘会遇时，果报还自受。我们所做的业不会随着时间的变迁而变旧，也不会逐渐变小而消失。微小而久远的业终有一天也会成熟。例如，圣者“梨军支”虽已证阿罗汉果，但却乞化不到食物，偶然得到的食物，也因为种种原因而失去，最后在临终时食灰糊而去世。“福增长者”相续中的顺解脱分善根极其微小，连阿罗汉们都观察不到，仍然能生果。他以前受生为苍蝇的时候，为一堆动物干粪的气味所吸引，盘旋在粪堆上，随着水的流动，偶然地绕塔转了一周，从而积下这一善根。另如一头猪被狗追逐而绕塔一周，死后生于天上。琉璃王屠杀释迦族时，薄伽梵本人也示现背痛之相。这是因为佛过去受生为渔夫的儿子时，见众渔夫生吃两大尾活鱼而心生随喜之报。琉璃王后来死于火灾，尽管当时他正处身在湖的中央。佛陀曾为一个名叫“苦得”的裸形外道授记说，他将身患饮食不消化的病症去世。那个裸体外道虽然预先做了断食，仍然因为无法消化糖、水而死去。吉祥龙猛虽然得到“长寿持明”的成就，但因为宿世割草时，不小心将一只蚂蚁连腰斩断，于是此生因为他人前来乞讨头颅而去世。", "虽然目犍连在佛的声闻弟子中为“神通第一”，却遭到那些手持棍棒、头挽发髻的顺世外道乱棒痛击，全身骨肉被打得像烂泥一样。事后舍利弗问他为何不显神通，目犍连回答说，因为受到业力的障蔽，当时对自己的神通连想都没想到，更不要说运用神通了。这是因为他宿世曾对母亲口出恶言，业不唐捐，故而感受此报。所以，如果不能以“四力”忏悔、防护来清净恶业果，直到“最后有”时，恶业还是紧咬不放。善、恶二业一旦造集，不会不感果而自动消失，因此我们的取舍工作务必做得微细而又微细。具体情况可参阅《贤愚经》《百业经》《百喻经》和律典等。在修上述两节时，应当思惟如何忏罪和如何使善根免受瞋心摧毁之法，必须下定决心如理取舍业果。这四节对生起业果的深忍信十分重要。当产生取舍业果的愿望时，为便于入手，可以将粗显的善、恶业概括在黑、白双十业道中加以思惟，而且如《入中论》中所说：", "若诸异生、诸语生，若诸自力证菩提，及诸佛子决定胜，增上生因戒非余。这十种善资粮业道，对未入道的人来讲，是获得增上生的根本依靠；对声闻、独觉种姓的人来讲，是证得声闻、独觉菩提的根本依靠；对菩萨来讲，是证得无上正等觉的根本依靠。因此，一开始在下士道中，守护取舍黑、白业果的戒律是格外重要的。辛二、分别思惟分别思惟分三段：（壬一）思黑业果；（壬二）思白业果；（壬三）附带开示具力业门。壬一、思黑业果此分三节：（癸一）正明黑业道；（癸二）轻重差别；（癸三）示彼等之果。癸一、正明黑业道既然业果是如此的重要、又是那样的微细，我们对业果所做的取舍基础又是什么？当知粗显的善、不善业可概括为十种，《俱舍论》中说：摄其中粗显，善不善如应，说为十业道。不仅出家人要对此做取舍，就是在家居士也要这样做。所以，过去隆睹喇嘛曾特别出资，将发露忏悔十不善文刻成袖珍本广为散发。又如《入行论》中所说：", "众生欲除苦，奈何苦更增；愚人虽求乐，毁乐如灭仇。我们虽然想得到快乐，但却不知修善——快乐的因；虽然不想受苦，却不知断罪——痛苦的因，反而像对待仇人一样，将想要的快乐毁灭。我们的取舍完全颠倒了。有些人认为自己愚笨，听不懂什么是十不善，但我们可以学会二、三十首歌舞段子，怎么会听不懂十不善呢？我们并不是单纯因为没有学过或不懂正法而堕恶趣，而是因为知而不修，所以，实修佛法很重要。所应断除的十不善为：身业者三种，口业有四种，意业复有三，忏悔十不善。十不善业中属身业的有三种：杀生、不与取、欲邪行；属语业的有四种：妄语、离间语、粗恶语和绮语；属意业的有三种：贪婪心、瞋恚心和邪见。每一种业又各有四种因素：事、意乐、加行和究竟。一、杀生杀生的“事”为除自己之外的其他有情，例如：被屠宰的羊。“意乐”中又分想、动机和烦恼三部分。“想”为无误地知道所杀的对象；“动机”为想要去杀；“烦恼”为三毒中任何一毒：以瞋发起的，如仇恨怨敌而用武器将对方杀死；以贪发起的，如爱羊的肉、皮等而宰羊；以痴发起的，如外道等故意杀生以血肉祭祀，以为这样做没有过失而大肆向别人宣扬。“加行”为使用毒药、武器、咒语等各种手段。", "所谓杀生，并不一定就是用刀将对方捅死，用恶咒和巫术也能杀生。", "“究竟”为对方在自己之前死去。如果这四种因素全部具备，杀生业道即告圆满。教唆别人杀和自己亲自杀没有区别，如《俱舍论》中说：军等若同事，皆成如作者。假设有八个人杀一头羊，这罪业并不是由八人分摊，而是每个人均犯有杀一头羊的全部罪行。又以军官为例，当他指挥许多士兵杀人时，如果总共杀了一千个人，每个士兵所造的罪业大小与各自所杀人数成正比，而军官则造下屠杀一千个人的全部罪业。在前藏地区，社会风气还算不错，但在边远地区，似乎有出家人找人代宰牲畜的习惯，屠宰者和教令屠宰者二人都各造一杀生罪。如果只是自己动手，则只有一种罪；所以，与其连累帮忙的人造罪，还不如单独自己一人动手。虽然有些人认为，如果自己没有亲手杀，就没有杀生罪，然而事实上教唆他杀的人不仅有罪，而且罪过更大。（接着，帕绷喀大师详细讲述了《某些僧人的午餐实景——显实明镜》中，有关僧人和山羊、绵羊、牛三者的故事：）以前，有一些比丘和沙弥将一头山羊、一头绵羊和一头牛拴在墙边，准备屠宰，山羊对其他两个说：“他们准备要杀我们了。", "”牛听了不以为然，说道：“他们每天都念归依，又双手合掌、闭起眼睛，念着‘愿一切有情具足安乐和安乐因’等等，我想他们不至于要杀我们。”绵羊也附和说：“对呀！他们都是佛弟子，在入教的时候，同意要守护归依学处，而主要的学处就是不伤害有情，所以我想他们肯定不会伤害我们。”它们在那里商谈良久。到了晌午时分，有位做屠宰勾当的在家人来到那些僧人面前。山羊发现了，便仔细倾听他们的谈话。屠夫一再推脱道：“我今天不得空，你们还是找别人帮忙吧。”但是比丘坚持说：“我们要些食物当午饭，你今天一定要把那三头牲畜宰了。”屠夫没法，只好同意。山羊将它所听到的话告诉了另外两个，山羊、绵羊和牛都伤心地哭泣起来。这时候，比丘手里提着念珠走了过来，一边不停地念“归依偈”和“嘛呢”，一边检查哪一头牲畜长得肥壮。它们三个齐声对比丘说：“出家人不可杀生，也不可教唆别人杀生。”又说：“最好是不要杀我们，如果一定要杀，就请比丘您自己动手吧！”比丘不答应。", "最后屠夫来了，用细皮绳将它们三个的前后蹄捆绑起来，用大锤子敲破牛的脑袋，用利刃将山羊和绵羊的胸膛剖开，把手伸进去，用尖利的指甲掐断它们最宝贵的命根动脉，这三头动物经受了不可思议的痛苦。十方诸佛听见牛的惨叫声，于是宣告：“在某某地方，空有出家相的某某，教人杀害母亲有情，那就是被杀的有情发出的哀鸣！”法幢倾颓，魔幢高竖，诸佛菩萨对此都感到极为失望。这种人乃是佛教的败家子！我们要谨慎防范，避免杀生，这很重要。我的依怙大宝师长看到能断除杀生的人特别地感到喜悦。当我访问康区的时候，成功地改变了索·旃檀寺等寺院常年杀生的习惯，我想这也许是我此生在佛法上得到的最大成就吧！二、不与取不与取的“事”为属于他人的财物。“意乐”三支中，“想”为不错乱；“动机”为想要不与而取；“烦恼”为三毒中任何一毒：以瞋发起的，如抢劫仇人的财物；以贪发起的，如见到别人的财物合自己的意，便将之窃走等；以痴发起的，如某些外道宗派声称“梵志穷时可行窃”，认为偷别人的财物没有错。至于“加行”，不与取并不一定就是夜里行窃，出家人一人取两份供养、做官的征收不合理的罚款、做买卖的对顾客短斤缺两等等都是不与取。", "寺院里订有各种惩罚办法，如强制做大礼拜等，目的也在于防止这类过失发生。", "简言之，我们最容易犯不与取的一种情形是：为了得到某种别人不想给的财物，便想出各种欺诈的方法，迫使他人不得不拿出那件东西，从而占为己有。又如，他人将价值一分银子以上的物品或用品，委托我们保管或借给我们使用，时间久了，主人已忘记此事，自己却唯恐主人记得，最后生起此物归我所有之心，这也是偷盗。（帕绷喀大师指出，此事对沙弥而言，是“近他胜罪”，对比丘而言，则为“他胜罪”。）三、欲邪行欲邪行的“事”，对在家人而言，为产门之外的“非道”；怀孕或持八关斋戒期间的“非时”；在师长或佛塔附近的“非处”；对象为母亲等的“不应行”。对出家人而言，任何形式的性行为都是欲邪行。“想”必须是没有错认欲邪行的对象，但对出家人来说，不论错还是不错，均犯非梵行“他胜罪”；“烦恼”为三毒中的任何一种；“动机”为想做邪行。“加行”为二根和合等。“究竟”为由此生起快感。四、妄语妄语的“事”有八种：眼见或未见之事物；耳闻或未闻之事物；鼻、舌、身三种识所了别、领受或未了别、未领受之事物；意识知道或未知之事物。说妄语的对象为能言、解义的人。“意乐”三支中，“想”的例子是，自己曾经见过的事物，想做改变而谎称未见过；", "“动机”为想要这么说；“烦恼”为三毒中的任何一种。“加行”为口说妄语，或是虽不说话、但用表情或姿势来撒谎。“究竟”为对方了解意思。（帕绷喀大师同时指出，如果企图行凶的人来询问被害者的所在，我们不可老实回答，而应该尽量引开他的话题，如说“今晚我要到某某地方去”等等。）五、离间语离间语的“事”可以是和合的人，也可以是不和合的人。“想”为不错乱；“动机”为意欲离间；“烦恼”为三毒中的任何一种。“加行”为企图离间和合者或阻止不和者和解，而对他们进行挑拨离间，不论是实话还是妄语，全都是离间语。某些人把这种行为看作是功德，事实上，这不仅没有功德，而且还有很大的过失，所以不可以说离间语。“究竟”为对方理解你所说的意思。如果对方因为离间语而关系破裂，此业道即成圆满；假如对方不理解而没有造成不和，这便成绮语而非离间语。六、粗恶语粗恶语的“事”有两种：一、使自己愤怒的有情；二、刺、角等非有情。“想”为不错乱；“烦恼”为三毒中的任何一种；“动机”为想说粗恶语。“加行”为批评他人戒律、家族、身体等方面的缺点。实说和妄语均犯，例如，称一只眼睛瞎掉的人为“独眼龙”和称正常人“独眼龙”，两者均犯。", "如果用意是在伤对方的心，尽管语调柔和，仍然犯粗恶语的过失。“究竟”为对方解义。因为此处必需要有“解义”这一条，所以对非有情的四大等说粗恶语，业道不会圆满。七、绮语绮语的“事”为没有意义的事情。“想”为知道想要说的事，不论有没有对象，心里想到什么随口说出，便是绮语正行；“动机”为想说绮语；“烦恼”为三毒中的任何一种。“加行”为谈论王室、战争等事。现在我们这些出家人，在寺院巡礼道散步的时候，喜欢很多人聚在一起，讨论有关政府、汉地、印度等方面的新闻。虽然绮语在十不善业中是最轻的，却是浪费人生的“无上方便”。（帕绷喀大师又指出，有些出家人上殿时就喜欢讲废话，随后又相互到寮房中串门、整天闲聊，每天就这样瞎混过去。我们应当像阿底峡尊者所说：“众中观自语”，即便只有一个朋友在场，也要谨慎小心不说绮语。其他如讲故事、谈论外道典籍等，均属绮语。再者，除欲邪行之外，若教唆他人做其余六种身、语不善业，自己也犯业道。）八、贪婪心贪婪心的“事”为他人的财物和用具，例如，在逛市场的时候，见到惬意的东西而生起想占有的强烈欲望。“想”为知道发生贪婪心的事为何。", "贪婪心的动机、加行和究竟等都必须在一念之上加以安立，其“动机”就是想把财物等归自己所有；“烦恼”为三毒中的任何一种；“加行”为这种念头变得强烈而希望为我所有；“究竟”为此念更为强烈，决定设法将财物等弄到手。我们对自己的财产也会产生贪婪。在拉萨集市游逛的时候，贪婪心能生起十万次之多。此时，心中不要随意胡思乱想，而应思惟财物犹如幻化、没有真正的价值来加以对治。九、瞋恚心瞋恚心的“事”和“烦恼”等与前面粗恶语中所说的相同。“动机”为想要使用杀害、殴打等手段使对方受到伤害，或是希望对方遭到不幸。“加行”为在此事上努力。“究竟”为生起决定。（帕绷喀大师告诫说，我们修息、增、怀、诛事业法，如果不是出于好的动机、不是纯粹为了利益圣教和众生，很有可能沦为贪婪心和瞋恚心等，所以一定要小心。）十、邪见邪见的“事”必须是真实存在的，例如业果、四谛和三宝等。如果认为这些事不存在就是邪见，声称它们不存在即是诽谤。例如，外道“足目仙人”因为贪恋自己的女儿，想与她发生性行为，而写了十万颂的论著，否认有前后世，并且臆造了六十余种邪说。“想”是认为以有为无的毁谤是正确的，其他二支与前面所说相同。“加行”为发起毁谤。", "“究竟”为决定否定。虽然我们较难生起这一业道的正行，但福报差而受恶友影响的人则容易犯邪见。所以要小心警惕、认清恶友的真面目，这很重要。癸二、轻重差别一、因体性故业重身、语七种业道中，以杀生为最重，前者依次比后者重，后者依次比前者轻。其原因是：这些业所引起对方的痛苦，依次由重到轻。例如，我们每一个人爱惜生命的程度要胜过爱惜资具，所以杀生和不与取所造成的对方痛苦有大小之别。意的三种业道与此相反，前者依次比后者轻，后者依次比前者重。二、因意乐故业重由极为猛力的烦恼意乐所造的业较为严重。例如，粗恶语在体性方面较轻，但如果极端愤怒地辱骂别人为“老狗”，这一粗恶语则变成重业。三、因加行故业重以杀生为例，使用各种残酷手段将对方折磨致死的业较为严重。再者，杀害体形庞大的动物罪业较重，例如杀害大象比杀死虫子的业为重。其原因在于体力庞大的动物所受的痛苦也大，所以在加行方面成为重业。某些地方的人们喜欢将蛙、鸡、虫子等放在火上活活烤死，这在体性和加行二方面都是很重的业。四、因事故业重即便只是对师长、阿阇梨、菩萨、僧伽和父母等殊胜福田怒目而视，也是极为严重的罪业。", "五、因久做故业重以绮语为例，因为经常犯的缘故会成为重业。六、因无对治故业重连一种善业都不做的人，其相续中的罪业将极为沉重。只具备上述一种业重因素，乃至六种全备都有可能，例如：以暴烈的瞋恚心对菩萨怒目相向或以各种残酷手段折磨动物致死者，具备了两种因素；怀着强烈的贪欲心吟唱歌曲者，具足一种因素；又如，经常造罪又不做善事的屠夫，以强烈的愤怒，使用各种残酷手段，折磨父母等致死，则是六种全备。由此可见，我们所造的罪无罪不重，常被沉沉的重业压在身上。癸三、示彼等之果业果有三种：（子一）异熟果；（子二）等流果；（子三）增上果。等流果又分领受等流果和造作等流果。所以任何一种十不善业，都可以使我们领受这四种果。子一、异熟果重大的不善业感生地狱；中等不善业感生饿鬼；微小不善业感生畜生。", "以杀生为例，杀生的异熟果能使我们受生在地狱中。虽然有朝一日从地狱解脱，其领受等流果又会使我们短寿多病；其造作等流果使我们从小便以杀生为乐。其增上果体现在外部环境上，亦即饮食、药物等效用微弱。（帕绷喀大师又特别指出，一切不善果之中以造作等流果最为不利。例如与生在地狱、身体与烈火无法区分相比，生在人中、却乐于杀生者情况更糟，因为杀生的等流果能不断地把我们引入恶趣，所以，应当尽力改正不善的造作等流，而培养善的造作等流。）子二、等流果不与取等其他九种不善业的领受等流果依次是：1．不与取：受用匮乏；2．欲邪行：不能保有妻子和奴婢；3．妄语：不受他人信任；4．离间语：亲友稀少，丧失仆从等；5．粗恶语：经常领受别人强硬的语气；6．绮语：所说的话常不受重视，言不威肃；7．贪婪心：达不到目的；8．瞋恚心：容易害怕；9．邪见：迷于正见。有些造罪的人寿命很长、运气也很好；一些修法的人却寿命短促、罹患重病，不幸的事很多，这是宿世的其他因果所造成。每当有不如意事，我们常会认为是自己或他人一时的行为不当所造成的，其实并非如此，这些事情往往是前世的业所造成。", "其他九种不善业的造作等流果，以不与取为例，某些人因为前世造不与取的业，所以现世从小就喜欢偷鸡摸狗，小到一根针也要偷，像猫和老鼠那般善于行窃。其他几种比较容易理解，其中贪婪心、瞋恚心和邪见三者的造作等流果，分别为贪、瞋、痴三者相应地增长。子三、增上果其他九种不善业的增上果分别是：", "1．不与取：收成稀少，经常发生霜雹和干旱等灾害，乳、酪等奶制品产量稀少；2．欲邪行：被迫住在满布污泥浊水的地方；3．妄语：周遭多骗子；4．离间语：被迫住在地势崎岖不平的地方；5．粗恶语：出生在多朽木、荆棘的地方；6．绮语：果树不按时结果，或在不当的季节成熟；7．贪婪心：所有盛事渐渐衰微；8．瞋恚心：战争和瘟疫传播频繁；9．邪见：水和矿藏资源消失。已经听闻和了解不善果报情况，还要故意造作十不善业，就像眼明之人往悬崖跳。某些地方以前有很多收成，现在却没有了，这绝不只是因为土地失肥的关系，而是业力使然。在劫运良好的时代，土地广阔而丰饶；但终会逐渐退化，变成充满沟壑和悬崖的地方。壬二、思白业果此分二节：（癸一）正明白业道；（癸二）示彼等之果。癸一、正明白业道单是不做十不善业，并不意味着白业道圆满。为使白业道圆满，必须先认识十不善；其次将之视为过失，防止造这些不善业作为加行；最后生起决定防护的断除心作为究竟。以断除杀生的善业为例，杀生有事、意乐、加行和究竟四种因素，以断除宰羊的白业为代表，羊即是此业的“事”；视杀羊为过失，认为杀之不可而想要断除杀生者，为此业的“动机”；", "这一动机转趋强烈后，视杀羊为过失之心，促成断除杀生的努力，为断除杀羊白业的“加行”；决定断除杀羊为业道圆满，因视杀羊为过失而防止杀生的“思”达到圆满所发起的身业，即是断除杀羊白业的正行或“究竟”。在可能发生不与取——窃盗或抢劫的时候，意识到“这些财物是痛苦和罪孽的根源，不可以为了财物去做这种坏事，那是恶趣的因”，即是发起断除此业的“动机”；努力断除此业为“加行”；决定断除为业道圆满。其他断除欲邪行等白业道均可以此类推。癸二、示彼等之果白业道的果也有三种：子一、异熟果大、中、小善业的异熟果，分别感生上界天、欲界天和人。子二、等流果等流果分领受和造作两种。领受等流果依次为：长寿、受用广大、与妻子和睦相处、言辞有威慑力、与友亲睦等。造作等流果，例如某些大德的转世化身，一生下来便自然地表现有出离心和悲心。子三、增上果此即饮食和药物效用力大等，与上述十不善的增上果正好相反，所以容易理解。壬三、附带开示具力业门此分四节：一、由福田门故力大对普通凡夫、父母、沙门、在家和出家菩萨、佛、师长所做的布施，后者依次要比前者力量更大。将三界所有的有情都关进监狱、挖掉眼睛，也比不上对菩萨怒目而视的罪更为深重；", "比起将三界的有情放出监狱、施予眼睛，也比不上信仰菩萨、合掌恭敬的功德更大。如比丘杀畜生犯的是“堕罪”，害人性命犯的却是“他胜罪”。二、由所依门故力大经中说，未受戒与受戒二者所做的善差别极大，造不善业也一样。出家人犯细小“恶作”的罪，比在家人胡作非为造全部十不善业要来得重，受菩萨律仪的人和受密宗律仪的人所犯的过失，一一比前者更为严重。有些人听说受戒后所犯的罪要比不受戒所犯的罪大，便不敢受戒，这种态度完全错误，《入中论》中说：增上生及决定胜，其因除戒定无余。为了后世得到合适的身体，现在一定要受戒、守戒。否则，只做布施会受生成龙类的畜生。不仅如此，受律仪的人，其善业之流将连续不断；受“非律仪”的人，其不善业之流也将持续不断。例如，以屠宰或卖酒为生的人，在睡眠和谈笑的时候，罪业仍不断地增长。设想有两个人，一人具有不杀生的律仪，另一人没有。在未做杀生的某一段时间内，两人虽然都没有杀生，但是不受戒的人并没有不杀生的善根，而受戒的人，不杀生的善根每天都在增长。同样地，受了近事律仪、沙弥律仪、比丘律仪的人，即使没有刻意修善根，在睡觉的时候，所受的五戒、三十六戒和二百五十三戒的善根仍在增长。", "受菩萨律仪者所获得的善根，比上述所有人还要更多，不可胜数，《入行论》中说：即从彼时起，纵眠或放逸，福德相续生，量多等虚空。具有密宗律仪的人，其善根的增长数量相较之下，更大上一百倍、一千倍。所以说，什么戒也不受的人，只有经过特别修习才会有善根；而受戒的人其善根每天都在不停地增长。因为受戒有很大的利益，所以不要对受戒作狭隘短浅的邪分别。即便是在家人，也应受长净、近事和菩萨律仪。罪分“性罪”和“遮罪”二种。“性罪”在因、体性和果方面各有特征。从因上讲，其直接动机必然是由不善发起的；从体性上讲，其本身与罪不善同体；从果上讲，其本身能够产生不可爱异熟。不论是否受戒，任何人只要触犯此事即生性罪。“遮罪”，即是与佛的规定相违背的业障。从因上讲，其直接动机可以是由善心或无记心发起的；从体性上讲，其本身与无记同体；从果上讲，其本身并不能产生不可爱异熟。如果动机与蔑视戒律等不善心相关，而犯单纯遮罪，那么性罪和遮罪这两种罪堕都有。如果单由无记心动机犯过，则只有违犯佛制之“堕”，而无性罪之“罪”。例如，比丘杀了一头动物，他便犯杀生之性罪之“罪”，以及杀生堕罪之遮罪之“堕”，罪堕二者俱有。", "像这样的罪堕二者，体性为一，遮回为异。所以，虽然“四力对治”能够完全清净这类罪堕一体的“罪”，但要清净罪堕一体的“堕”，则非得做“还净法”不可；反之，虽然还净法能清净“堕”，但为了清净“罪”，还是要靠“四力对治”来忏悔。由于别解脱律仪是受自于亲教师、轨范师和僧伽，所以必须在僧伽或比丘前举行“还净”仪规；违犯菩萨律仪的过失，必须在师长和佛菩萨面前忏悔清净；违犯密宗律仪的过失，必须在曼荼罗圣众面前忏悔清净。（帕绷喀大师最后指出，我们在供养、积福等修广大善根的时候，至少受了“大乘长净律仪”再来修，功德会更大。）三、由事物门故力大以布施和供养为例，法施比财施殊胜、修行供养比财物供养殊胜等等。四、由意乐门故力大例如，以菩提心为动机，即使只念一遍《二十一度母赞》或供养一盏灯，善根的力量也会很大，甚至超过非以菩提心为动机的十万盏灯供养。上述四节，简要开示了什么是应断的主要不善业、什么是应修的主要善业。对此若能善巧修习，花很小的力气就能积聚广大的善根，并使不善业的造作降到最低。所以，我们应该认真学习上述要点。比丘以菩提心为动机修“六加行”等法，其所依、意乐、境、事四种力大全部具备。", "以下是一些与业有关的其他说明：业有“能引业”和“能满业”之分。“能引业”的善业能引善趣，恶业能引恶趣。“能满业”则不一定：善能引业将我们引入善趣后，决定特殊生存环境的能满业既有善的、也有不善的；恶能引业将我们引入恶趣后，能满业也可以有善、恶两种，所以共有以下四种情况：第一，例如转轮王等人，一生荣华富贵享用不尽；第二，例如一辈子劳苦度日的穷人；第三，例如地狱；第四，例如嘉旺（佛王）父子的马、骡及爱犬等。", "此外，有一业引多生的情况，例如讥骂别人像青蛙一句话，能感五百世受生为青蛙之报；反之，也有多业引一生的情况。业还有“决定受”“不决定受”“作而增长”与“作不增长”等区别。“决定受”业中，按照受果的时间，可分三类：第一“现法受”，由于福田和意乐的特别，现世所造业的果报，在现世即可领受；第二“顺生受”，在下一世领受果报；第三“顺后受”，在第三世以后成熟受报。（帕绷喀大师建议说，有关这些内容的详细情况，大家应参阅《道次第》广、略论等著作。）庚二、思惟业果别相对不善果心生恐惧之后，若能遵守断十不善的戒，如理修习十善，后世一定不会堕入恶趣而获得天人之身。然而，仅止如此还不足以成办解脱和一切智，只有获得具足八种异熟功德的殊胜身，在修行方面才会有与众不同的进步，所以，必须设法获得具足八种功德的身体。宗喀巴大师说：若未获得众德身，欲修胜道亦难达，故应学此圆满因。此处分三方面来讲：（辛一）异熟功德；（辛二）异熟作用；（辛三）修异熟因。辛一、异熟功德八种异熟功德为：1．长寿、2．形体端严、3．种族高贵、4．有大权势、5．言辞威肃、6．声誉卓著、7．男性、8．身心健壮。", "正如世俗上农事做得好、收成也会好，依靠宿世所造的妙业，我们现在才会有人身和受用等等，这是必然的道理。又如农夫并不以今年的秋收为满足，还要为来年的秋收而忙碌一样；如果我们不去想后世，或是虽有考虑但只是一味地害怕，那是没有用的。而且只是修普通善趣的因，也成不了大事。所以，我们必须要修善因，以得到殊胜人身，修行正法。换句话说，就是应设法获得具有长寿、形体端严等八种异熟功德的人身。辛二、异熟作用第一，长寿功德，可使我们长期修习利益自他的善根，使修法获得圆满。第二，形体端严功德，可使他人一见便深受摄伏，就像阿底峡尊者一样。第三，种族功德，可使他人接受自己的教导。第四，有大权势，即财富广大、眷属众多之意，先用财物吸引有情，再以正法成熟有情，做广大的利他事业。第五，言辞威肃功德，可使他人产生信任感。第六，声誉卓著功德，可以保证我们所有的教导能迅速、确实地贯彻，如同国王的旨谕一般。第七，男性功德，可以使我们不怕处身在大众之中，也能独自住在僻静处修法等，不易遭受障碍和影响。第八，身健壮功德，可以使我们像密勒日巴那样，以苦行来修习难修之法；", "心健壮功德，可以让我们对利益自他之事不生厌烦，并因勇猛坚固而获得分别观察慧力，由此迅速发起神通。辛三、修异熟因有人心想：“虽然这些功德对修法会有帮助，但我恐怕不大可能会有这些功德吧？”然而这绝对是有可能的。正如农夫知道秋天会结出果实而在春天播种一样，如果在此生中能修这八种异熟功德之因、并结合清净愿，后世一定会得到这些善果。因为只要条件具足，果就会出生，这是自然的规律。这八种因分别是：长寿之因：对有情不加伤害和杀戮；放生；赎命救生，如买鱼放入池中；施食；释放囚犯；为病者施药及看护病人等。形体端严之因：修安忍；为“所依”供养明灯；新造或修葺三种“所依”；重新涂金和彩绘；供养新的佛装；布施别人新衣和饰物等。种族高贵之因：无论是在家还是出家，不可因自己的功德、种族、戒律、智慧、眷属、地位等而生起骄慢心；克服所有的慢和过慢，保持谦虚；恭敬师长、亲教师、轨范师和僧伽等殊胜福田。尤其对出家众而言，应当恭敬比自己戒腊年长的比丘，当戒腊少的人向我顶礼、表达敬意的时候，应该明白：这是别人恭敬我们的学处，应予以接受。传授比丘律仪仪轨中所说的规矩，也适用于受戒后的其他场合。", "虽然还有其他礼遇活佛、顷则等上层人士的风俗，但是尊重戒腊和敬礼等规矩于佛陀在世时就存在，我们应该如法遵行。甘丹颇章高层十分熟悉的“十六条清净法规”中，包含有许多极其重要的规定：例如，尊敬长辈，孝敬父母等有恩之人或有德之人，帮助贫穷和患病的人等等。如果大家都能遵守这些法规，将有助于全体大众的幸福安乐。（帕绷喀大师随后举了一个律经的例子：以前有四头动物，人称“和合四兄弟”，长幼有序、彼此恭敬。因为它们遵守这一规矩，所以给迦尸全境带来了幸福。既然畜生也能做到长幼有序，我们这些修法的出家人不是更应该做得到？如果大家都能做到这一点，一定会更快乐。）受用丰富之因：重新彩绘三所依和供养新衣；布施饮食、饰品、衣服等给乞讨者；纵然无人乞讨，我们也应尽力对饶益田、功德田与受苦的有情上供下施。言辞威肃之因：说话谨慎，努力断除语不善业。声誉卓著之因：恭敬供养亲教师、轨范师、三宝、父母等殊胜福田，以及比自己年长的人；发愿自身获得种种功德。男性之因：喜欢男身；不喜女事，视女身为过患，对此心生厌恶，“但愿自己永不得女人身”；消除欲得女身的想法；", "念诵大菩萨的名号，例如：智上、光明幢，如是愿智慧，寂根、文殊前，我今恭敬礼。此外，不说尊贵对象的坏话，解救将遭阉割的有情等。身心健壮之因：他人因生理或心理原因无法完成的事，代为完成；帮助他人；不捶打他人；惠施饮食等。如果发愿得到具足八种功德的身体，成为修善之器，将来就会成为像阿底峡尊者、前辈法王等人一样；如果不发净愿，这种身体反而会变成造集不善的工具。例如，边地国王纵然获得具足八种异熟功德之身，但这样的人身只会被用来造集力量强盛的不善业。所以，我们应当努力发愿，使之成为修善的工具，这很重要。（帕绷喀大师最后总结说，虽然“无常”法类等在初、中、后三个阶段都很重要，但在下士道中，修持的基础或正行即是此处所说的“业果取舍”。）庚三、思业果已如何进退之理分两部分：", "一、总开示在座上修的时候，应当不断思惟业果道理；座与座之间，则应保持正念、正知和不放逸，对业果做正确的取舍。我们应该效法格西奔：他用黑、白石子来计算所做的善、恶二业，以提醒自己断恶修善。《入行论》中说：苦从不善生，如何解脱此，我昼夜恒常，理应思惟此。又说：能仁说胜解，一切善品本，又此之根本，恒修异熟果。我们首先应该了解黑白业果，然后在平时保持正念、正知和不放逸。造杀生、妄语等恶业的端倪一出现，应立刻停止。对于微细的恶业，也应忏悔、防护，《亲友书》中说：先时虽放逸，后若改勤修，犹如云翳除，良宵睹明月。孙陀罗难陀，央具理摩罗，达舍绮莫迦，翻恶皆成善。我在前面讲“加行法”的时候说过，即便像贪欲深重的难陀、残害九百九十九人的央具理摩罗，害死已得不还果父亲的达舍，和杀死亲生母亲的绮莫迦之辈也能净罪，既然过去造集的罪业可以清净，所以一心专修忏悔、防护极为重要。简言之，在下士道这个阶段，修持的关键总要就在重视业果。阿底峡尊者对此也十分注重。（帕绷喀大师接着讲了以下这个故事：以前潘域有个人喜欢念《百拜忏悔经》，但是他曾将出售《十万颂般若经》得来的钱用于私人用途。", "死了之后，立即被阎摩鬼卒牵往地底，到了阎摩法王面前。由于他没有说出实话，法王于是出示业镜，镜内显示了出售《般若经》的人、买主、用于交换的豆子，以及小孩捡拾洒出来的豆子的情景。这下他才无法抵赖。就在将被扔进大铜锅的时候，他想起归依《百拜忏悔经》，于是又起死回生。博朵瓦听说后，建议此人将这段经历告诉别人。）某些人以为，自己在这个世界上所造的罪业，如果不为轨范师、亲教师或官员所知，就不会有麻烦。然而，佛所说的业果定律是绝无欺诳的真实教诫，《三摩地王经》中说：设月星处皆堕落，具山聚落地坏散，虚空界亦变余相，然尊不说非谛语。最细微的善、恶业也不会丧失感果的能力，所以必须要如理地取舍。但由于无始以来恶习深厚，难免会沾染上少许罪恶，这时候应该如法地修持“四力对治”的忏悔、防护。二、别以四力净罪之法这方面的内容已经在“加行法”一章叙述过了，但因为四力净罪极其重要，依正行科判次序，在此再简略地讲一遍。四力中的“破坏力”，即是对过去所造的罪业发起强烈的追悔心。这在四力之中破坏力最为重要，具备此力，其他三力自然随之而来。此力的生起，端赖我们对业果的深忍信。", "如前所说，“遍行对治力”主要是《集学论》中所讲的六种，其他凡是为了净罪目的而做的善事，都构成“遍行对治力”。", "“遮止罪恶力”，即是生起今后纵有生命危险也不再犯的防护心。虽然很难从一开始就永远戒除一切恶行，但可以从较容易根除的恶行下手；对于难断的恶行，则应每天生起“今日不犯”的防护心。“依止力”即是归依、发心，这也是为何在“金刚萨埵修诵”和《堕忏》等颂文的篇首，先说归依、发心的缘故。我们从无始以来造集的罪业，每一种都多得像国王库藏一样。然而，如“加行法”时所说，如果所修的四力忏悔、防护十分有力，纵使定业也能清净。此外，如果能修习《集学论》中所说的“虚空藏忏法”、配合顶礼的《堕忏》、文殊怙主大宗喀巴散集中收录的《胜金光明经忏悔文》等，那是再好不过了。（帕绷喀大师指出，在忏悔的最后，应想到通过修法，自己的罪业已完全清净，并以罪之三轮无所缘来加以印定，这将大大增强净罪法的功效。）对罪业抱无所谓的态度和一味害怕都是不足取的。对初业行人来说，最要紧的修法就是忏悔。所以《准提陀罗尼经》中所说的净罪之相尚未持续明显地出现之前，应当长时间猛力忏悔。如我先前已述，出家人在上殿或前去辩经院的时候，在闻思求学的时候，甚至在立宗辩论的时候，如果是抱着忏罪、积福的心，这一切活动都将成为净罪、积福的途径。", "再者，由于观察经义就是观察修，所谓的“修”不一定要另外再跑到山洞里端身正坐。如果上殿只是为了领取酬金，听闻只是为了在辩论中击败对手，这些行为也都不会成为正法的修行。所以辩论之时，不应只是视同学为敌方作答辩，也应把自心当作敌方来立宗。以此为例，我们出家人可以将任何日常活动转成修法，只要将这些活动看作是修法即可，不需要额外再修。对在家白衣来说，才需要在世间俗务之外，另外找时间勤修正法。然而，不管在家也好、出家也好，十善是每个人所应当奉行的。我的师长说，往后的中士道等内容，即是业果修法的开广。关于业果的实修，例如将虱子放在指甲上准备掐死的时候，应当要想到这是不对的，将之放生；谎话要说出口的时候，提起正念，管住自己的舌头。以此为例，罪恶从小处尽力断起，善业从小处点点滴滴逐渐累积。有些人以为，犯一些小罪没有大碍，因为忏悔就可以清净。然而，从未造罪和造罪之后再忏悔清净，二者间差别极大；就像从未断过腿的与断了之后再接合痊愈，两者间有很大的区别一样。虽然强烈的忏悔、防护能使罪业净治，免受异熟果，但因犯罪而造成的另一种严重伤害却是逃避不了的：即获得地道的时间将被延迟达数劫之遥。", "“菩提道次第”教授讲到这里，在听了“暇满”“无常”“恶趣苦”“归依”与“业果”等法类之后，如果以成办后世利益为主，想着从现在开始要为来世做点事，并对现世的虚荣不再在意，下士道次第的证德便初露端倪。即便能生起这样的心，仍然要再接再厉、不断修习。宗喀巴大师曾说：然须令坚固，故此生已，仍须励力，善为修习。所以，这也就是为什么我说：在“菩提道次第”中，证德的“端380掌中解脱菩提道次第二十四天教授汉译《贤愚经》（T04，no.202）。藏译《百业经》（ལས་བརྒྱ་ཐམ་པ།D73Ha-74A，no.340）。汉译《百喻经》（T04，no.209）。汉译《正法念处经》（T17，no.721）。即藏译《毗奈耶分别》（འདུལ་བ་རྣམ་པར་འབྱེད་པ།D5Ca-8ña，no.3）、《毗奈耶本事》（འདུལ་བ་གཞི།DKa-4ṅa，no.1）、《毗奈耶杂事》（འདུལ་བ་ཕན་ཚེགས་ཀི་གཞི།D10Tha-11Da，no.6）及《毗奈耶上分》（འདུལ་བ་གཞུང་བླ་མ།D12Na-13Pa，no.7）。"]}, {"c": "第十四天", "segs": ["第十四天（帕绷喀仁波切引用法王宗喀巴大师所造的两个偈颂，即“身命动摇犹如水中泡”等，先简略地开示了前行改正动机之法，接着回顾了前面讲过的科判，并重述了“获得后世安乐正方便业果法类”的内容。）丁二、于共中士道次第修心此科分为两部分：（戊一）发起求解脱心；（戊二）抉择趣解脱道自性。戊一、发起求解脱心分两方面：（己一）思惟生死总苦；（己二）思惟生死别苦。如果按照先前所说的共下士道次第来修习，受持断十不善的戒律，便能暂时解脱恶趣之苦而受生于某一善趣之中。然而，不应以此为足！譬如，对于一个月之后将被处决的罪犯来说，鞭笞、火漆等日常的刑罚纵然减轻了，最终还是难逃一死；同样地，如果不能彻底从生死中解脱，善妙能引业一旦竭尽，必将再入恶趣，正如《入行论》中所说：数数来善趣，数数享诸乐，死后堕恶趣，常受难忍苦。因此，如果想截断今后的痛苦之流，就应当设法彻底从生死中解脱。这也是为什么要在中士道中发起求解脱心的原因。", "发起求解脱心的方法有两种：一、由思惟四谛自性之门而发起；二、由思惟十二缘起之门而发起。所谓“解脱”，即是从系缚中脱离之意。譬如从绳索捆绑等束缚中挣脱时，便可说“解脱了绳索的束缚”。我们被业烦恼的绳索捆绑在有漏取蕴上的情况与此类似。具体说来，因受业与烦恼的控制，以“界”而言，在三界中结蕴；以“道”而言，在六道或五道中结蕴；以“生处”而言，在胎生等四生中结蕴——这就是“束缚”的本质。从这种束缚中脱离，便是此处所说的“解脱”。就一般而言，“生死”一词是指在上至有顶、下至无间地狱之中受生流转的意思。未学过经论的人谈到生死，以为是从这一家转生到另一家，或是在六道中流转，这是一种依文解义的说法而非生死的本意。虽然某些学者主张在生死中数数结生等为生死之义，但应以嘉却·格桑嘉措的定义为最正确：有漏取蕴的受生相续为生死。所以，截断业烦恼所控制的后有结生之流，即是解脱生死。此外，就像一名囚犯想要脱离监狱，首先要生起想脱离的心，如果不曾想过监狱的过患，就不会生起这种心念；同样地，如果没有希求解脱生死之心，也不可能勤修解脱之法；", "而要生起求解脱心，就一定要如《四百论》中所说，对生死生起厌恶之感：诸智畏善趣，等同诸地狱。也就是说，应当思惟生死的痛苦。具体的思惟方法可分两种，一是由四谛之门思惟，一是由十二缘起之门思惟。这里先讲第一种方法：", "薄伽梵在波罗痆斯地区初转法轮时，对贤者五弟子说：诸比丘！此是苦圣谛！此是集圣谛！此是灭圣谛！此是道圣谛！佛陀讲了三遍四谛，共计十二相，称为“四谛法轮”。所谓“谛”，是指诸圣者如实所见、真实不虚，故名为“谛”（真实）。按照因果的顺序，理应先说集谛，然而佛陀却将四谛的次第颠倒过来，先说苦谛，这里面有重要关键：为了使度化的对象对痛苦生起厌离，所以佛陀先开示苦谛，如果对苦不起厌离，自然也就不会起断除苦因之心；祈求离苦之心一旦生起，所化便会勤修离苦之道。所以，佛陀此说是为了所化修持的需要，想求解脱的人应将四谛作为取舍的主要对象。至尊弥勒在《宝性论》中，谈到知苦之后当断苦因等，以譬喻说明道：如病应知断病因，当得乐住应依药，苦因彼灭如是道，应知应断应证修。大意是说：就像生病的时候，先要认识病因，然后才能服药以断病因。第五世达赖喇嘛则以水为喻：“如同露营忽遭水淹，起寻水源欲作堵截。”因此，想要修习解脱苦病的方法，先要生起希求远离苦因的心，此心生起需先探究苦因，而探究苦因又需要先了解所受的痛苦，宗喀巴大师说：若不思惟苦谛失，终不能发解脱欲，若不思惟集流转，则不能断生死根，应厌三有希出离，了达生死系缚因。", "四谛依次各有四种别法：无常、苦、空、无我；因、集、缘、生；灭、静、妙、离；道、如、成、出。有漏取蕴有苦、乐、舍三种受，除有漏苦苦外，我们对其他两种受并不知其为苦。例如过去有位咒师曾对妻妾们说：“如果不是因为怕你们伤心，我随时都可以去持明刹土。”后来咒师生病，濒临死亡的时候，众妻妾说：“咒师啊！您现在马上就可以去持明刹土了，我们可难过了！”咒师却答道：“唉，我是无法留在这里了，否则我宁可与你们长厮守，也不愿去持明净土！”或者像阿杂惹麻努的故事。我们视生死为快乐而贪著，根本不知生死的本性是苦。知道痛苦的原因为“集谛”之后，便应断除集谛。“集谛”有两种：“业集谛”与“烦恼集谛”。远离痛苦的果即“灭谛”，能获得“灭谛”的方法即“道谛”，需修持“道谛”才能得到“灭谛”。关于知苦，《道次第广论》中开示有八苦、六苦、三苦等，这里将八苦摄入“人苦”、将三苦归入“周遍行苦”来讲。此处讲生死总体的六苦：", "己一、思惟生死总苦思惟生死总苦分六节：（庚一）无定过患；（庚二）无饱足过患；（庚三）数数舍身过患；（庚四）数数结身过患；（庚五）数数高下过患；（庚六）无伴过患。庚一、无定过患我们虽然偶尔能受生于善趣，但在生死中受生之后所领受的无非是苦，因为生死的快乐完全不可信赖。以人的前半生与后半生为例，怨仇与亲友、父母与子女等角色经常可以在同一生中互换位置。以前有户人家，户长的父亲经常以屋后池中之鱼为食，死后受生成水池中的鱼。母亲因为恋家而变成家犬。与他妻子通奸的仇人在被杀之后，因为贪恋其妻而投生为他的小孩。后来，他捕杀父亲所转生的鱼。吃鱼肉时，母亲所转生的狗跑来啃食鱼骨，遭他鞭打。他又常常将仇人投胎的儿子抱在怀中。舍利弗见到这一情形，口说一偈：食父鞭母，仇人抱怀，妻吞夫骨，生死可笑！《亲友书》也说：父转为子母为妻，怨仇众生转为亲，及相反事而死殁，故生死中全无定。我们通常假设怨敌、亲友的关系是永恒的，然而事实并非如此。即便是在同一世的前后半生中，亲友往往也可能变成怨家，仇人也可能成为亲人。", "贫富的情况也是如此，昨日的富人可能因为遭到抢劫而变成今日的穷人，类似的事件我们时有所闻，一切事情无一不是在刹那变化之中。", "（在详细叙述了“福增长者”的本生故事之后，帕绷喀大师说：）看过了长蛇盘绕的女尸、众多虫子啃食的大树，又看到一人被众多面貌狰狞的阎摩鬼卒捶打、摩羯鱼残遗骨骸堆积如山遮蔽日光，目犍连为福增解释说：“那条蛇是某个贪恋自己体貌的妇人转世，大木头是滥用僧伽木料、无所顾忌者的转世，被鬼卒捶打的人是某个猎人的转世，摩羯鱼骨骸则是你本人前世所遗留下来的。”福增的过去世曾是国王，臣僚请示如何判决一名罪犯，当时他正忙着下棋，随口说了一句：“按王法办”，此人就遭处斩。等棋下完之后，国王询问此事如何处置，臣僚们报告说已遵旨处决。国王虽然极为懊悔，却仍然因为杀害此一罪犯之罪而长久受生为摩羯鱼。有一天，有艘船险些被它吞入口中，船上的商人惊恐地念诵“归依佛”，摩羯鱼闻声闭口，不再吞食，以致饿死，海中诸龙将它的尸体送到海边。像这样前世为国王，后来变成摩羯鱼，又变成人等，生死无定的情况便是如此。庚二、无饱足过患色对蝴蝶有致命的吸引力，麋鹿、蜜蜂、大象分别对声、香、触有特别的贪爱，因而常招来杀身之祸。生死的快乐就像喝盐水一样，饮用再多也不会满足。例如，一个有一两银子的人，会想：“假使能得到十两银子，我就满足了。", "”可是等到他有了十两银子，又希望能得到一百两；等到有了一百两，又想得到一千两。得千思万，无有止境，永远也无法满足。《广大游戏经》中也说：国王当知若有人，悉得天界之欲乐，以及人间诸妙欲，此仍不足复追求。以人天的快乐为例，我乳大王虽能统治四洲及天界，仍然不知满足，最后福报享尽，复堕南赡部洲，留下遗嘱告诫世人，没有任何过患更重于欲望深而不知足。同样地，一个征服者征服了一个地方，便想再征服第二个地方，占领再多的土地仍然不觉满足，拥有再多，仍然想要扩充基业，不辞劳苦，夙夜匪懈。不能知足，即便累积再多财富，也与乞丐无异。以前印度有个穷人名叫“善顺”，在偶然的机会下得到一块无价之宝，他想把这块宝物送给最贫穷的人，几经思量，最后献给了波斯匿王，他说：“国王啊！因为您从不知足，所以您是最贫穷的人！”我们纵然欠缺财物，如果能知足，便是富翁。《亲友书》中说：若能少欲知满足，虽乏诸财仍富有。众生怙主藏巴嘉惹也说：知足者之家，富翁卧门旁，欲深者难知。相反地，如果不知足，就永远不会有满意的一天，所以说，不知足是最大的过失。庚三、数数舍身过患不管受取什么样的身体，都不能信靠。", "《亲友书》中说：虽得天界大欲乐，以及离贪梵天乐，后当仍堕无间狱，成火薪木苦恒连。或生天上居日月，自身光照遍世间，此后至于黑暗中，自手伸展亦不见。虽然我们过去受取过无数梵天、帝释等身，但都没有丝毫利益，后来又受生在无间地狱或变成奴隶等；虽然我们曾偶尔生为日、月天子，以身体的光明照耀四大部洲，死后却生在洲与洲之间不见天日的地方，伸手不见五指。天人的受用我们以前样样都享受过，然而任何受用都无法保信。我们曾经在天界多番享用钻石铺成的宝座、珍宝砌成的宫殿，现在却依然只有坐皮垫的分；因此，即使受生为帝释，到头来同样一无所有，受生为帝释又有什么意义？又，如所说：天趣天女乳腰柔，长受安乐妙触已，后堕地狱铁轮中，当受粗磨割裂触。虽然我们曾受生在天界，与众天子、天女长时期共相娱乐，死后却堕入地狱，被可怕的地狱鬼卒包围，受尽苦难；虽然我们曾无数次享用过天界的无死甘露，死后却受生在地狱中喝沸腾的铁汁；虽然我们曾作过转轮王等，统治过亿万臣民，拥有七政宝等，如今，事过境迁，非但当时的奢华荣耀荡然无存，甚至还因贪著欲尘永不知足而造下罪业，堕入恶趣，这不全是过患吗？", "有位师长临终时，别人请他口授遗嘱，他反复地说：“生死之事毫无意义！”我的依怙主大宝师长常举这个例子。同样地，我们在这个生死中，无论受取怎样的身体、获得再好的富乐受用，也都没有意义。当我们受生为转轮王时，脚上穿的鞋子，价值超过这世上所有的财富，尽管如此，又有什么利益？国王与乞丐游历于中有险道的时候，一切平等，没有孰优孰劣之分。所以，我们应该谨记京俄瓦之言，慎重其事：“觉窝敦巴！从无始以来，什么样的身体我们都已受取过，以前没有修过的大乘法，这一次自当好好修了！”庚四、数数结身过患我们过去在地狱中受生，喝过的烊铜比海水还要多，倘若不能斩断生死流转之流，将来要喝的烊铜还会更多。《亲友书》中说：虽取地丸如柏子，数母边际未能尽。《解忧经》中也说：数于地狱中，所饮诸烊铜，虽大海中水，非有尔许量。经中又说：生诸犬豕中，所食诸不净，其量远超过，须弥山王量。我们以前生为猪、狗的时候，吃过的秽物堆起来比须弥山王还要高，今后若不能斩断生死后际，所要吞下的秽物将会更多。《解忧经》中又说：又于生死中，由离诸亲友，所泣诸泪滴，非海能为器。", "我们过去因与父母、子女、兄弟等亲爱离别悲伤哭泣所流下的泪水，比大海里的水还多，如果现在还不能斩断生死后际，所流的眼泪还会更多。经中又说：由互相斗争，积所截头首，如是高耸量，出过梵世间。", "我们以前与仇人打斗，被仇人砍下的头颅，堆积起来比弥山王还高，今后若不能斩断生死流转之流，落地的头颅肯定比以前更多。又如经中所说：为虫极饥虚，所啖诸粪土，于大乳海中，充满极高盈。我们过去在污泥中受生为虫的时候，吃过的肮脏粪土，纵然以大海为容器也无法容纳，如果还不能从生死中解脱，今后所要吞食的粪土还会更多。又如龙猛所说：一一所饮母之乳，其量过于四海水，异生相续生死者，更饮乳水多于彼。我们在生死中不断受生，喝过的母乳比四大海还多，如果今后仍无法消灭流转，又将饮下更多的母乳。如前面下士道中所说，我们每死亡一次，与在恶趣中每受生一次，都会有那么多痛苦与恐惧，今后在无数类似的生死中所将遭受的痛苦与惧怕就更不必说了。蝎子让我们毛骨悚然，可是以前我们也曾受生为蝎子，那些蝎身堆积起来，将与须弥山一样高，若不能斩断生死流转之流，未来所受的蝎子之身必定比以前更多。庚五、数数高下过患律典中说：积聚皆销散，崇高必堕落，会合终别离，有命咸归死。财物如何积聚，终归是会销散；再高的权位，终归要堕落；聚合的尽头是离别；生命的尽头是死亡。这是有为法的“四边际”。", "生死中的任何盛事，最终都逃不出衰败的命运。格西桑浦巴因此说：“在此生死中，须多番仰覆，对此实感不安。”不仅如此，经过多番努力才挣来的房屋、财富等，可能被冤家抢走，也可能因为自身亡故而不知所终。现在我们师徒众人虽然相聚在一起，但在数年之后也终必分离。嘉却·格桑嘉措曾经说过：身居高位不多时，他人足下成奴仆。《亲友书》中也说：即成帝释世应供，由业力故复堕地，即成转轮圣王已，复于生死为奴婢。纵然高贵如梵天、帝释之辈，也会有这种下场；至于更低一级，如我们这个世界上的荣华富贵等，也没有什么真正的价值。杰·贡唐巴说：名誉地位枯树上，愈往上攀愈危险，细而折断奈何之，住于树下胡不可？即使不谈前生来世，此生中的权势地位也并不可靠，例如因失势而下狱等。以前的第司·桑结嘉措（佛海），曾主持制定政府多项政教法规，拥有极大的权势、财富与聪明才智，后来因为与拉藏汗结仇而被斩首，首级在堆隆赤桥桥头示众多日，无人敢出面处理，妻小等也被流放边疆；拉藏汗王后来也命丧准噶尔军之手。", "庚六、无伴过患我们从母亲胎中出生的时候，是独自一人；中间成长、衰老过程中患病与受苦时，也是一个人独自承受；死亡的时候，也像是从酥油中拔毛一般，独自一人去世，除自己之外没有同行的友伴。《入行论》中说：生时独自生，死时还独死，苦分他不取，何须作障亲？宗喀巴大师也说：不可保信三有众圆满，见过患已……意思是说，生死中的任何快乐与盛事都是不可保信的，所以，生死中没有永远可靠的朋友。以这样的认知来思惟生死中无休无止的痛苦，当能感受到一种失望沮丧的心情。因此，不管总的生死是否有边际，都应当设法结束自身的生死。想结束生死之苦，就应如前面所说，设法斩断生死流转之流。己二、思惟生死别苦此分二节：（庚一）思恶趣苦；（庚二）思善趣苦。庚一、思恶趣苦这些内容在前面下士道中已经谈论过了，就像患酒病者对酒已倒足胃口，不想再喝酒，这里就不再多谈。庚二、思善趣苦此分三节：（辛一）思惟人苦；（辛二）思惟非天苦；（辛三）思惟天苦。", "有人以为：“前面所讲的恶趣之苦是那么痛苦，若是生在人天之中，痛苦不就少了吗？”当知在生死中受生，纵然获得人天增上之身，仍脱离不了痛苦。辛一、思惟人苦受生为人虽然极为难得，但除了可得修法之利外，人身仍具有巨大的痛苦。此分七节，首先为“思惟生苦”。壬一、思惟生苦因为胎障等的关系，我们对以前所受的“生苦”已忘得一干二净，但以后如果再获人身，还是得承受所有的生苦。从入胎到出胎之间的胎脏五位，以及身体支分发育的每个阶段中，各有一种痛苦。首先当心识进入精血中央时，身体像乳酪状尚未成形，会产生像在地狱大铜锅中被烧煮的痛苦；而后长出五支分的芽胞时，便产生像被刑具迸开的痛苦；各支分生成时各有一种特别的苦；每当母亲喝下热的饮料、转动身体或躺卧等时，将产生如在热水中烧煮、狂风吹散、大山压迫的痛苦。此时的情况如《弟子书》中所描写的那样：难忍臭秽极逼切，狭窄黑暗遍蔽覆，住胎如入奈洛迦，身屈备受极重苦。如果现在要我们钻进一只装满各种秽物的铁瓶中，塞上盖子住上一天，根本无法忍受；然而我们却必须在狭窄、黑暗、肮脏、恶臭的母胎中待上九个月零十天。", "此后，当胎儿生起五想，厌恶住在胎内，渴望从胎门出生时，则如《弟子书》中所说：此如坚硬压油具，渐次压迫方得生。所受的痛苦像是从网眼中被拉扯出来。出产道时有如牛被剥皮之苦；纵然在柔软的褥垫上，也像被抛到荆棘上一样；风吹在身上，有如刀剑刺割；被母亲抱起时，则像麻雀被老鹰衔走般生起莫大的恐惧。此外，我们前世如智慧等所有功德，完全被障蔽住，什么都记不得，吃、睡、行、坐等基本动作都得重新学起。修生苦的时候，不能有隔岸观火的心态，要想到自己将来必然会遭遇生苦，像是亲身经历一般感受深刻，按照《阿难入胎经》中所描述的痛苦来做思惟。（帕绷喀大师指出，有人以为生苦已经受完了，所以似无大碍，但是要知道，在斩断生死后际之前，光是生苦这一种苦就有无量无边，极难忍受。）壬二、思惟老苦《广大游戏经》中说：老令妙色成丑陋，老夺威德夺势力，老夺安乐作毁訾，老夺光泽而令死。老来有盛色衰退、气力衰退、诸根衰退、受用境界衰退与寿量衰退等苦。", "诸根与智慧等逐渐减弱，身躯佝偻如弓、皮肤失去光泽、坐起艰难、头发苍白、皱纹满布，好像一具丑陋的行尸走肉，正如杰·密勒日巴所说：一者站起如拔橛，二者行走如捕鸟，三者坐下如袋坠，此三凑合时若至，老妪当愁幻身衰。以及：", "一者外皮起皱纹，二者内剩嶙峋骨，三者盲聋兼昏聩，此三凑合时若至，老妪皱眉示苦相。这一切都是我们在生死中徘徊所产生的过患。噶当派格西迦摩巴说：年老渐至，尚可忍受，当下降临，其苦难忍。今晚我们以少壮之身入眠，明早起来如果发现自己诸根已不明利、身体老态龙钟，我们如何能忍受？所以，应该趁现在诸根、智慧、身体等还没有衰坏的时候赶紧修法。否则，当老苦煎迫、形同死亡、诸根衰败、坐起维艰时，还谈什么修法呢？贡唐·丹贝准美说：老如灌顶水，从顶善灌注。头发白如螺，然非黑垢净，阎摩唾沫箭，白霜降使然。额纹如角环，然非少肥纹，已逝寿量数，时使所记存。以及：鼻涕滴不断，然非珍珠串，光彩韶华冰，已遭烈日化。齿发渐掉落，然非换新齿，此生食将尽，收餐具时至。又说：脸丑色憔悴，然非猴面具，借贷韶华还，丑陋本色现。头颅摇不停，然非责他过，因遭死杖击，脑颤苦难忍。弯腰道上行，然非寻遗针，此乃失记忆，韶华宝之状。起时用四肢，然非仿牛行，因腿难支身，而需借用手。坐时声砰然，然非愠于友，因喜乐心索，及韶华绳断。行时步巍巍，然非摆官态，年岁担沉重，压身失平衡。双手抖不断，然非悭吝财，因恐阎摩来，尽夺一切物。", "饮食极少量，然非惜食物，消化力弱故，老人忧胀死。", "身着轻薄衣，然非轻装舞，体力减弱故，衣亦成负担。喘息长呼叹，然非吹咒气，呼吸沉重相，消逝空中兆。频频改计划，然非无主见，为老魔所逮，不能随心意。诸事皆忘失，然非示浮夸，身根衰败故，记忆慧力失。当知白头发、皱纹的出现，就像是事业阎摩执行死刑的信号。此外，因惧怕死亡生起的惶恐不安也不知有多痛苦！壬三、思惟病苦《广大游戏经》中说：譬如冬季大风雪，草木林药夺光荣，如是病夺众生荣，令根色力皆衰损。患病会使身体素质变坏，使我们受到身心苦恼的长期折磨，对平素愉悦的事情失去兴趣，而被迫承受不想要的痛苦，更有将要丧命的忧伤之苦。正如“身力尽失口鼻枯”等所描述的，纵然是壮年男子，也禁不起疾病折磨，他将辗转病榻，体力消失、光泽减弱。若欲开广，则应思惟罹患各种疾病的痛苦，例如，死的时候有剧烈的“解支节”苦，以致连遗嘱也无法立下的情形。（帕绷喀大师随之讲了悉达多太子因目睹病、老、死等而修行解脱的故事。）壬四、思惟死苦《广大游戏经》中说：若死若殁死殁时，永离亲爱之众人，不还非可重会遇，如树落叶同逝水。死亡使我们与各种享受、亲人、眷属、身体等圆满可爱的事情分离；死时将有剧烈的身心疾苦。", "《教诫国王经》中说，死时没有其他办法可以阻止，这在前面讲“念死”的时候已经讲过了。壬五、思爱别离苦我们与自己的师长、弟子、兄弟、朋友、父母、亲属等一起亲热地开怀畅饮，欢聚结束时，总觉得难以分离；至于失去权力、地位、财物受用等的痛苦就更大了。即便是出家人，也有因失去戒律而感到的忧苦等，还有其他各种各样的爱别离苦。这些并非我们个人所遭到的不公平待遇，而是生死中本来就有的征相。壬六、思怨憎会苦“怨憎”是指不称心的人或事，例如：碰到怨家而被打劫，遇到病魔而受折磨发疯等，以及与人发生口角，或触犯王法、遇到强盗等，无数的事件都可能招来怨憎会苦。一旦产生恶缘，我们便身陷纠纷之中，身心疲苦不堪，这也是生死中的固有过患。以毛驴为例，身患鞍疮却仍须背负重担，这是它自身业力所导致的必然结果。格西博朵瓦语录中说：不论我们受生在六趣中哪一趣，一旦受生，便有病、死等苦，该病者病，该死者死，任何不应该发生的事不会突然出现，这是生死的定义或本性。只要我们在生死中，就逃不出这个局面，如果对此感到厌恶，就应断除生死，要断生死，就须断除生死之因。因此，如果我们不想再受生死之苦，就应当设法从生死中解脱出来。", "壬七、思求不得苦求不得苦，即是饥渴及因生活所迫而不得不忍受寒冷、炎热、疲劳、恐惧等苦。例如，当我们有要事求助于某位官员，起初总是满怀期盼，克服种种困难去面见官员，最后却往往大失所望。有些人以为，拥有土地的人一定很快乐，其实有土地的人也一样有苦：农民一早就要到田里耕作，白天要忍受烈日烧炙、冷风吹袭、灰土裹身；播种之后，又要收割；作物送入仓库之前，还要担心收成遭到霜冻、冰雹、霉烂、干旱等破坏；稼穑之后又担心收成可能欠佳，苦恼一桩又一桩接续不断。农民以为商人很快乐，但商人要抛下自己的父母、配偶、儿女，将自己的性命悬挂在靶子上（意为不顾一切地干下去），跋山涉水奔波于大江南北；晚上也无法安然入眠。有些商人非但得不到利润，反而还要蚀本；遇到土匪强盗，更有丧命之虞。同样地，没钱的人有没钱的苦：穷人老是担心今天饱了明天吃什么，常有觅不到食物的痛苦；有钱的人有有钱的苦：富人老是担心自己的财物被乞丐乞讨、被别人借贷、被做官的强夺，甚至担心被猫鼠等偷窃，常有无法积攒财富、保护财产之苦，担心破财之苦及他人索求之苦等。", "木匠、裁缝师等以手艺维生的人，总是担心招致东家不满、领不到工资或是日常必需品，常起我慢、嫉妒等心，经常偷一些木片、布片等零碎材料，却又无法借此积攒到足够的财货。虽然我们是出家人，但如果不能少欲知足、专注于正法，便难免有四处奔波赶拜经忏之苦。做官的以为当个平民百姓很快乐，但平民也有平民的苦：食不果腹、衣不蔽体，不能主宰自己的财产，又常因纳税、支差、口角、争斗等事耗去大半财物。有些人连饭都吃不饱而在山沟中流浪乞食；有些人家里已无糌粑可食，却仍免不了要缴交税赋、遭逢意外之灾或官府惩处等厄运。总之，日日夜夜有数不清的烦恼事，一生就这样在困苦中度过。老百姓反过来以为当官的很快乐，其实不然，如《四百论》中所言：上流为心苦，平庸从身生，二苦日日中，能坏此世间。纵然是统治一方的国王，国运一旦不济，便要遭受臣民的唾骂。他要为这个国家排忧解难，要担心能否战胜敌国，要担心能否保护同胞，要担心律法能否慑服民众，要担心权力是否会丧失等等的痛苦。我们出家人每日仅食一餐，事务却极繁重。总之，如俗话说：“有财大如马，其苦亦如斯。”我们初次与别人打交道，会礼貌的说些客套话，熟悉了以后，所讲的大都是彼此的困难。", "嘉却·格桑嘉措曾说：贵贱僧俗男女众，服饰姿态虽有异，苦伴终生无不同，悲夫诸友此共相。尽管人们在外表上的穿着打扮等有高低之别，实际上都一样在受苦。我们也许苦于没有称心的住处、没有资财、没有朋友等问题，但拥有最好的住宅、最贴心的朋友、最富裕的受用，难道就不痛苦了？即便更换了成千上百名仆人、弟子与朋友等，也照样不会满意，依然不觉称心。不论与谁作伴，全是痛苦的朋友；不论受用何物，如品茗等，全是痛苦的受用；不论住在何处，如寺院等，都是痛苦的住所。我们现在也许不满意住在大寺院，想要搬到别处；一旦住进茅篷，也还是会感到不顺心，于是想外出云游；等到厌烦云游时，又想回到家乡，忙忙碌碌，没有停歇的一刻。我们所有的闲谈，不外乎是为了追求衣着、饮食、名声事不从愿而发的牢骚，这也是生死过患的一种表现。以上是对人苦的陈述，如果我们不能体认苦的真正由来，便很可能以为所有的痛苦都是由住所、友伴等外在条件所造成的，而将“生死”想成是远在天边的某个地方。我们不应有这样的误解，而应该知道先前所讲述一切痛苦的根源就在于生死。在脱离生死之前，不论我们到哪里，都要经受前面所说的无边痛苦。", "辛二、思惟非天苦那么受生为非天是否会有些许快乐呢？当知受生为非天也是纯苦无乐，《亲友书》中说：诸非天中意苦重，因其本性瞋天福，彼等因有趣性障，虽具智慧不见谛。非天的住处在须弥山海平面以下，有四座城市，称为“具光”“月鬘”“妙处”和“不动”，与天界之间除了有一段距离外，两处就好像是楼上与楼下一样。虽然非天与天界大体上有些类似，但还是无法与天界相比。天神经常掠夺非人中的漂亮女性，又能享用长生不死的琼浆玉液等，受用丰裕，因此非天常常妒火中烧。我们一看到仇人稍有享受，心中就不免生起几分嫉妒和不快，非天对天神盛大的享受所产生的难以忍受的情绪就更不用说了。一旦忍无可忍时，非天便只有向天界发动战争一途了。打仗时，天界的大象“护地子”只要一甩动鼻子，便能将大擂石砸向非天。众天神即使被兵刃击中，只要头未断便不会死；非天一旦被兵刃击中任何要害都会致命。所以，每次战争非天总是以失败告终，永无得胜的机会。我们人世间打仗的时候，纵然两军势均力敌，士兵们也有深深的恐惧，非天与军容更为强盛的天神作战，又怎么会不害怕？他们的恐惧是无法言喻的。", "非天的军人终其一生经常得承受这种战争的痛苦，他们的妻子虽然留在家里，未亲自经历战事，但是会在“同观湖”中见到自己丈夫在战争中被杀戮的景况而悲痛欲绝。非天虽然具有智慧，但这是一种业障蒙蔽的所依身，所以该身中没有见谛的缘分。辛三、思惟天苦那么天神是否有快乐呢？当知欲界天神有死殁下堕、悚栗及斫裂杀害等苦。关于死殁下堕苦的情形，《亲友书》中说：身色变为不可爱，不乐本座花发萎，衣服垢染身出汗，是于先时所未有。天趣报死五死相，现于天界诸天神，等同地上诸人中，传报当死诸死相。天神有呈现远五死相与近五死相十种死相的痛苦。当天人皮肤的光泽开始减退、不想安住座上、身上挂着的花环开始枯萎、衣服染上污垢、身体出汗以及身光变弱、沐浴时身上沾水、从衣饰中发出刺耳的声音、眼睛闭合、耽著于一个地方等死相出现时，他们就会像在热沙上翻腾的鱼儿一样，在住所的某个角落徒发愁叹。这种痛苦需经历七天之久，天界的时间长度与人间不同，以四天王天为例，其七日等同人间三百五十年。", "尤其痛苦的是：天神们被称作“三时者”，也就是说他们了知以前因何受生为天、现在因何能享福、死后将往何处这三件事，因此他们知道自己死后受生的地方。由于天神总是无法因自身苦而生起出离心，也无法因他人苦而发起悲心等，所以非但不懂得行善，还将以前所累积的福德享用殆尽。这就像穿着一件价值十两银子的披单与穿着一件价值一两银子的披单相比，前者福报的消耗程度是后者的十倍。同样地，天界盛大的快乐享受，也将使天神耗去众多福德。人们常会说：我们现在是积福的时候，而非享福的时候。由于这个原因，天神死后大都堕入恶趣；他们已预先知道这个结局，所以苦恼也就格外深重。天神发现自己将与天界的住所、身体、受用、友伴等赏心惬意的乐事分离，而投生到恶趣之中，内心的痛苦要比地狱苦大上十六倍！我们死亡的时候，虽然多半不知道来生是好是坏，尚且如此痛苦不安；天神却因清楚见到自己将受生在恶趣里，于是发出“嗟呼众车园”等哀叹。再者，死相现前的天神如同死尸一样被遗弃一旁，其他的天子、天女连多瞧一眼都不愿意。即使他们渴切地请求以前认识的朋友说：“请到我跟前小坐一会儿吧！我就快要死了，快要投生到那些苦恼的地方去了，请让我再见你们一面吧。", "”那些朋友照样置若罔闻。一些关系比较亲近的朋友或许会用棍子将鲜花传送到他们头上，祝福说：“愿你死后生在人间，在那里培福后再转生到天上来吧！”除此之外不会再有别的表示。然而，此举只是徒增忧伤，让他们心里感到更加不安而已。此外，福德较薄的天神见到威势与受用洪大的天神会心怵恐慌，经受极大的痛苦与忧愁。与非天作战的时候，天神有被斫裂杀害的痛苦；弱小天神有被大力天神驱逐出自宅的痛苦。", "上界天虽然没有死相现前之苦，却由于“行苦”压迫，而有烦恼、障碍，对死殁与留驻亦无力掌握，仍为“粗重”所苦。《资粮论》中：色无色诸天，超越于苦苦，以定乐为性，住劫不倾动，然非毕竟脱，从彼仍当堕。以无色界为例，最初在该处受生时，心生“已受生”之念，随即入定历经多劫，最后死殁堕入下处，此即不得自在之苦。以前所培植的福德在该天身中耗尽，又没有新培植的福，所以死后堕入下处。又因为以前习惯于阻断妙观察慧的运作，所以必然会变得比一般人更为愚笨。某些人把根本定误认为解脱，所以在得定时以为已经证得解脱了，及至后来发现仍须受生，便因未能如愿而做毁谤，从而受生到无间地狱。所以，受生在无色界中只是落入一时的圈套，实际上与口饮烊铜的地狱没有什么差别。相较之下，还不如在人间做一个会念“嘛呢”计数的穷老太婆好些。正如嘉却·格桑嘉措所言：三界生死铁火宅，任至何方为苦烧，心中刺痛然无奈，漂流恶处心生厌。在生死之中，上至有顶下至无间，无论受生在哪里，都像住在六层燃烧的铁屋内，没有一处能免离痛苦。过去闹饥荒时，小孩子讨糌粑吃，给了各种蔓菁食品都摇头不顾，抱怨说我们给的都是蔓菁；", "同样地，无论生在何处，本质都是痛苦，只不过受苦的形式有所改变而已。我们就像是同在一个屋檐下不幸家庭的成员。", "简言之，由于我们不断地承受三苦的折磨，因此一切痛苦也可以归纳为三苦来说：我们目前在生死中认为是“乐”的种种，实际上纯为痛苦的自性；被认为是“舍”的种种感觉，实际上也是苦的自性。在热疮上洒上冷水，暂时似乎会有些许乐的感受，这只是生死中的乐受，稍后又会生起痛苦，所以是“坏苦”。一切有漏乐受，与之相应的一切心、心所，以及作为所缘的境，均是“坏苦”。热疮最初形成的时候，虽无明显的疼痛感，但有痛的自性在。在未遇到水等冷、热二触之时的感受为有漏舍受。这种舍受以及与之相应的一切心、心所和境，因为是受先前业烦恼的控制，并含有能生将来苦与烦恼的种子，伴有遍行粗重，所以称为“周遍行苦”。热疮一接触热水便会有明显的疼痛，这种剧烈的痛楚即是苦受。能触恼身心的有漏苦受，与之相应的心、心所与境，均是“苦苦”。我们平时认为是苦的那些苦受是“苦苦”，妄以为乐的那些乐受是“坏苦”。乐受并不具有乐的自性，因为感觉的时间一久，痛苦便自然生起，我们只是将前苦逐渐减轻、后苦尚未完全生起之间的感觉妄认为乐。例如，在树荫下待得太久，跑到太阳底下便似乎有些舒服安乐之感；", "但这并不是乐，如果是乐，就应该与痛苦的情形一样，愈持续就愈增加，即使在太阳底下待得再久也不会觉得不舒服，而且还会愈来愈快乐；实际情况却非如此，只要在阳光下曝晒一会儿，就会开始觉得不适，又得赶快回到树荫底下。因此，这种乐只不过是苦还不明显时的错觉而已，晒太阳的痛苦将逐渐由小而大。同样地，走路走累了，坐下来时会觉得舒服，这也是走路的苦逐渐减轻、坐着的苦逐渐增加两者之间产生的感觉，当时并不是没有苦，只是坐苦还不明显而已。当我们不耐久坐而想站起来活动活动时，也是同样的情形。《四百论》中说：如安乐增长，现见反成苦；如是苦增长，然非可转乐。", "有漏取蕴即“周遍行苦”。有漏取蕴一旦成就，便成为一切痛苦的容器。简言之，一切生死之苦都是因为受取取蕴而产生的：地狱的冷热之苦是由受取地狱的有漏取蕴而产生的；饿鬼的饥渴之苦是由受取饿鬼的取蕴而产生的；畜生中以驴为例，驴身一旦成就，便自然成为领受驮物、鞭打等苦的容器。总而言之，因芒刺扎身而疼痛难忍等一切痛苦，均系受取取蕴的产物。赤裸的背上荆棘的重负还未卸下之前会持续引生痛苦；同样地，在卸下有漏取蕴的重担之前，痛苦也是随时存在。（帕绷喀仁波切接着介绍了福增长者出家的经过，以及亲教师目犍连带福增到海边出示其前生尸骨等，而激发其出离心的故事。）“取蕴”一名的由来共有三种：如荆棘产生的火称为“荆棘火”，由过去近取烦恼所产生的蕴也是果立因名；或如倚仗国王的人称为“国王身边的人”，依赖于近取烦恼的蕴也是以所依赖的对象来立名；再一种就像能长出某种药或某种花的树便以该药或该花的名字来命名，蕴本身能生出近取烦恼，所以因立果名。由于这种蕴上永远依附有苦与烦恼的粗重，所以是行苦。有了这种蕴之后，纵然目前暂时没有苦受，但随即就会经由各种途径产生许多痛苦，所以，行苦遍及一切痛苦，也是其他两种苦的根本。", "它是容纳此生之苦的器皿和导致后世之苦的基础，因此这种蕴在一切苦之中最为可怕。所谓“生死”，即是身不由己地受业烦恼支配，受取有漏取蕴的担子，在有顶与无间地狱之间的某个地方受生，不断地流转生死。这个有漏取蕴也可以说就是生死。因此，厌离生死就是要厌离这个有漏取蕴。在没有对周遍行苦发起厌离之前，不可能真正做到厌离生死。（帕绷喀仁波切又按中等详略程度，将上述内容重述了一遍。）408掌中解脱菩提道次第二十四天教授"]}, {"c": "第十五天", "segs": ["思惟苦因与抉择解脱道性圣天论师说：此大苦海者，诸边岸全无，愚人沉此中，如何不生畏？（帕绷喀大师首先引用此颂略示前行改正动机之法，在回顾了以前已述的各科之后，又重讲一遍“发起求解脱心”的内容，并简单开示了加行法等修法，然后在头顶上观想师长本尊，同时思惟生死苦等。）在座间，我们应阅读《念住经》等开示生死过患的经典。经过思惟后生起出离心，其标准是：无论在生死中见到什么样的快乐与财势等，都明白这些只是迷惑我们的事物，本质都是苦的，从而对之生起厌离心；如果只对生死中一些不顺心的事，如被责骂、损失等，感到灰心，那只不过是一时兴起的假出离心罢了。只要生在生死中，就逃不出纯苦的本性，若今后不想再受苦，就必须斩断生死流转之流。厌恶生死而决意出离的意愿，就是出离心、求解脱心。宗喀巴大师说：修已于生死盛事，不生刹那之希望，昼夜唯求解脱心，起时是生出离心。又说：当他人为我铺设妙座、尊敬服侍时，我都会想到这一切是无常、这一切是苦，而生起不可抑制的厌恶感，过去至今向来如此。我们应该像这样对任何生死盛事都生起厌离。", "同样地，临死之时，因为必须与现世的友伴、财物等分离，会生起愁苦的感受，那也是一时的无常观，这不过是现世虚荣心的显现。因此，设法在心中生起清净的出离心极为重要。我们所求的主要目标是佛位，成佛的前提是要有菩提心，菩提心的前提是悲心，而悲心的生起则以“知母”等为前提。由于在自己身上修生死苦即生出离心，将出离心转移到他人身上即生悲心，所以在上士道中一定要修出离心，尤其在中士道中，更要以此出离心为主要之道。出离心生起之后，所做的一切善事将成为解脱之因。如果连造作的出离心都未能生起，那么，除了少数依福田力所做的善事外，绝大部分善事都将推动着生死的流转。如果没有认真修习“三主要道”，纵然勤修脉风、本尊、诵咒等高深法门，也丝毫不会导向解脱与一切智之道。因此，我们不要做无谓的努力，应暂时放下那些所谓的甚深之法，努力勤修出离心、菩提心、正见三者，才是最重要的。戊二、抉择趣解脱道自性此科分为两部分：（己一）思惟集谛生死流转次第；（己二）抉择能趣解脱道性。己一、思惟集谛生死流转次第这部分共分三段来讲：（庚一）烦恼发生之理；（庚二）烦恼集业之理；（庚三）死殁及结生之理。", "庚一、烦恼发生之理分四小节：（辛一）认明烦恼；（辛二）烦恼如何生起之次第；", "（辛三）烦恼之因；（辛四）烦恼之过。“思惟集谛生死流转次第”一科，既可以与上一段科判放在一起讲，也可以配合下一段来讲。这里按照《坦途》《捷径》引导的规矩，将之归入“抉择趣解脱道自性”这一段。在思惟了总、别生死的过患，因而厌离生死、生起求解脱的愿望时，我们应该探查究竟是什么原因造成了生死，如此才能斩断生死流转之流。集谛中有“业”集谛与“烦恼”集谛两种。我们所背负的取蕴重担是由业造成的，而业是由烦恼生起的。纵然有无数过去所造集的业，但如果缺少烦恼爱、取的俱有缘，则如无水滋润的种子，是无法引发受生的。相反地，就算没有过去造集的业，只要有烦恼在，即可立即造集新业，形成后来的生死之蕴。《释量论》中说：超度诸有爱，非余业能引，灭尽俱有故。又说：若有爱，仍当出生故。所以说，烦恼是造成生死的根本。所谓“烦恼”，是指产生后凭借其本身的力量，能造成该补特伽罗心相续极不宁静、不柔顺作用（的心理状态）。我们必须先认清什么是烦恼，否则就像不认识敌人而无的放矢那样，不知道什么时候该用对治法来消灭它。辛一、认明烦恼烦恼分两大类：根本烦恼、随烦恼。", "根本烦恼计有六种，如《俱舍论》中所说：有根随眠六，贪欲如是瞋，我慢无明、见，疑者……", "贪，见到中意的财物、躯体、饮食等对象后，起不愿与境分离之心。其他烦恼如布上沾了灰尘，较易洗除；贪则耽著于境，如布浸入油中，浸渍的面积会逐渐扩大，就愈难洗涤；面对喜欢的东西想看、想触摸，这种欲望深入心中，对所贪境的爱恋就愈来愈深。有道是：“爱绳系于生死狱”，我们对生死之所以生不起厌离，其根本也在于贪，贪是将我们束缚在生死内的主因。对治贪的方法，可修“不净观”等。不净观，即生起血污、脱落、肿胀、骨骸等想。如果贪著的对象是有情的身体，即应思惟充满三十六种不净物的臭皮囊。若因食肉而生起贪念，便应思惟其物是不净的，而且还犯杀生等过失，如此设法减轻爱著。瞋，就是对有情与非有情起瞋恨心、粗暴心，想要伤害对方的心态。例如见到仇人等不悦意的对象，心就变得极为粗暴。瞋的生起如同火的燃烧，能将善根摧毁，过失极为严重。杀生、捶打等事，都是因瞋而起。现在有些人称师长发怒为起威猛心，将瞋心冠上一个好听的名字，不把它视为过失，然而：罪莫大于瞋，苦行无过忍。又如“瞋刀能夺善趣命”等所说，瞋在所有烦恼中，是摧毁善根的罪魁、引入恶趣的祸首，过失极大。（大师提到摧毁善根的程度，因对象程度的不同而有区别。", "对此应修安忍等对治法。关于安忍的详细修法，在下面讲“六度”时会述及。师父若以饶益心而非瞋心来惩罚弟子是可以的。）慢，即因自己的权力、财富、功德、血统、智慧、持戒清净等，甚或因为自己的嗓子好、力气大，而起了瞧不起别人的自满情绪。就像从高山上往下看，万物都在自己脚下，睥睨万物一样。慢是一种高傲的心态，认为自己最好、别人都不如自己。这种慢只需在所缘境身上找到一丁点理由便可生起。噶当派祖师语录中说：看吧！大地春回，绿意萌生的时候，是从高高的山顶开始的，还是从低低的洼地开始的？又说：我慢高丘，不生德水。有慢心的人难以积累功德。师长所说的法对我慢重的人不会有什么利益。我们应该想一想“界”的分类，觉察自己无知的地方，有时从头到脚、由外到内仔细看一看，发现自己不知道的事还有很多；以这种对治法来断除慢心。无明，正如“不见”是“见”的反义，在“明了”前加上否定词“无”，即为“无明”，是不见、不知、不明的意思，好像闭上眼睛黑漆漆的，或是一片黑暗什么也看不见的那种感觉。无明是对四谛、业果、三宝等体性或本质的愚痴，是一切烦恼的根本。", "关于“坏聚见”与无明的关系，有两种说法：一派主张这两者是相同的，“坏聚见”即是无明；一派认为两者是不相同的，他们举例说明：“坏聚见”好比是将绳误认为蛇的错乱心，原因在于绳上黑暗笼罩，以致对绳的本质认识不清，这是无明。主张前一派的有吉祥月称、法称等师；主张后一派的是无著、世亲两兄弟。", "疑，即是对四谛、三宝、业果等心存有无、是非的疑虑。对三宝的怀疑能妨碍证悟的生起，胜者之王根敦珠巴（僧成）曾说：极愚空中遍游荡，尤能伤害求定解，坏解脱命之祸害，祈救疑虑罗刹难！对业果的怀疑势必导致对增上生（人天善趣）与四谛心存疑虑，这种疑虑能妨碍解脱，所以非常不利。以上为五种不属于见的烦恼。见，即五烦恼见。其中“坏聚见”，即将可坏灭的有法蕴聚视为我与我所的染污慧。当别人对我赞叹或毁谤，做出利害损益时，“哦！他对我这般这般……”内心深处的“我”似可呼之欲出，“坏聚见”将之执为实有，这是一切过失的根本。包括虫蚁在内的所有众生都有这种“坏聚见”。（大师举例说，当我们用草戏弄一只虫子时，它会立即害怕地蜷缩起来，装成死去一般，过会儿便掉头快速逃走，此即表明它具有“坏聚见”。）“边执见”，即将“坏聚见”所执之我视为恒常不变与实有等，或是认为死后我即湮灭等染污慧。虽然怀有这种见的主要是外道，但我们也有实有、断灭等见。“见取”，即将上述“坏聚见”“邪见”“常断见”三者中的任何一种见，及这些见所依靠的见者之蕴，执为最殊胜的染污慧。“戒禁取”，即以单脚站立之戒、事奉五火、跃上三尖叉等为解脱道；", "以披人皮禁行等为殊胜行；如某些人获得微细神通，发现前世曾受生为犬，于是误以为模仿狗叫、改作狗的装扮等就可以保证来世得人身，以此为最上乘而发出荒诞的言行，并将这种恶戒执为解脱主因。“邪见”，否认四谛、三宝、业果等为主要的邪见，以及以无为有的虚构、以有为无的断见歪曲。某些外道相信，这个世界是由遍入天的十行化身创造的；数论外道将事物分为二十五类，认为是由“自性”造成的；或以为是由大自在天所创造等等，这些是以未造为造的虚构，有的则是以有为无的歪曲。上述五种非属见者，以及这五种见合计为一，共为六种根本烦恼随眠。（帕绷喀大师指出，当这些烦恼各别生起时，我们要依靠对治方法来分别消除。然而，如《四百论》中所说：如身根遍身，痴遍住一切。痴周遍其他一切烦恼，而且是它们生起的因。由于对此难以体认，所以在后面还要细讲。）辛二、烦恼如何生起之次第由于六根本烦恼等一切烦恼是由我执与坏聚见所产生的，所以，主张坏聚见与无明为一事者，即相信坏聚见是一切苦与业、烦恼的根本；不同意者，则许无明为主因。根据中观应成派的见解，坏聚见是根本，亦即“遍计”与“俱生”坏聚见二类中的后者。", "俱生坏聚见又分“我执”与“我所执”两种，此处指我执坏聚见。当别人赞叹时，我们心里会想：“他们在说我好话”，这时候内心深处似乎有个实在的“我”在活动。因为有这种感觉，我们便将它执为我，认为是受用者，进而对己生爱、对他生瞋；对利我者生贪、对害我者生瞋、对无利无害者生痴。所以，《释量论》中说：有我知有他，执、瞋自他分，与此等系属，生一切过失。《入中论》中也说：慧见烦恼诸过患，皆从萨迦耶见生。", "又说：最初说我而执我，次言我所则著法。无明或坏聚见是六随眠的根本，贪、瞋、痴等从之而生，由此造业，由此在生死中流转。因为生死的根本就是这个坏聚见无明俱生我执，所以，为了断除烦恼，必须努力生起通达无我慧——我执无明的正对治。由于这个缘故，通达无我慧被称为是能消灭一切过失的万应灵丹。《四百论》中说：是故坏愚痴，即坏诸烦恼。《十地经》中也说：世间所有恶行，彼等一切皆因我执而生；若离我执，即不生恶行。但在真正通达无我慧之前，应该知道如何暂时压伏烦恼的方法，要压伏烦恼，又必须先知道产生烦恼的原因。辛三、烦恼之因烦恼因共有六种：1．所依，即烦恼种子或随眠。如果病根未除，只要饮食等事一不得法，便会旧病复发；同样地，因为有烦恼所依或习气的关系，只要一有机会，烦恼种子便可在我们心中生起烦恼。2．所缘或境，即悦意与不悦意境等。由于烦恼种子未断，所以与外境相遇即生烦恼，如《俱舍论》中所说：未断除随眠，复与境近住，起非理作意，烦恼因具足。", "因此我们应尽量与这些外境保持距离。出家众住在寺院和茅篷等里面，也是为了避开外境。我们初学者见不到这些外境便生不起烦恼，避开外境是个有效的方法。《修心文集》中说：依止对治以远恶境为主。嘉赛·妥美巴（无著贤）也说：远恶境故惑渐减，无散乱故善自增，心净于法起定见，住静处是菩萨行。我们应该如此远离能生烦恼的外境，居住于合宜之处，这很重要。3．猥杂，即交恶友招致的散乱。所谓恶友，是指那些喜欢吃喝玩乐、谈论招惹烦恼之事，忙于现世经营的人。我们不应听从这些人的话，不要受他们的影响，否则就会起烦恼、做坏事。过去潘波杰地区有两个人，一个喝酒、一个不喝，喝酒的那人去了热振，另一个去了拉萨。前去热振的那人在寺里遇见噶当派的众格西，去拉萨的则与恶友为伍。由于良友与恶友的不同影响，当这两人再次相遇时，以前喝酒的已经戒酒，不喝酒的却成了酒鬼！虽然我们对悭吝、瞋恚美其名曰节俭、威猛，但它们其实是有很大的过失。如果所依止的老师死守着财物不放，做学生的往往也有很重的悭吝心；跟随瞋心大的老师，情形也一样。因为恶友的行径比较容易传染，所以必须戒交恶友。然而，现在绝大多数人莫不追求现世的恶友。", "我们纵然无法全部舍离，也应小心谨慎，不要与他们太热络，这很重要。以前某个地方的人都喜欢喝得烂醉，唯独国王不饮酒，结果百姓却说国王醉糊涂了。如今，修行人虽然不太能与世俗人合群，这也没有什么不好，因为我们所要实践的，就是“出”“入”“得”三事。", "当恶友给我们出主意时，不要听从他，要像老牛的脖子那样刚硬，奉行“事前无牵累金刚”“事后无愧悔金刚”“与智慧金刚同行”等“噶当十秘财”教授。4．言教，即阅读能生起烦恼的邪法书籍。例如，观阅林·格萨尔王传奇故事等，或与性有关的论著、手册等邪说，导致贪、瞋、痴增长。相反地，我们应当多阅读大德祖师的传记，因为仰慕大德们的事业行传，能培植解脱的种子。如果与人杂处，谈论政治、军事、女人、官司等许多增长贪瞋的事，一定会使我们产生烦恼。5．串习，祥仁波切说“恶心习气如卷纸”，由于我们对烦恼极为熟悉，心念散乱的时候，贪、瞋等烦恼便任运生起。因为前世烦恼习气有强有弱，所以今生烦恼的力量也有强有弱，某些人甚至对微不足道的处境、对象也会生起很剧烈的贪、瞋。例如，瞋恚心盛的人对别人的瞪视也觉得难以忍受。如果有这种反应，只能努力修对治法来遮止，除此之外别无他法。6．作意，即对贪、瞋等对象不断加以虚构的非理作意。以衣服为例，非理作意即是不断地思惟这件衣服颜色有多么漂亮、裁剪有多么美、质地有多么好等可悦意的方面；若是对瞋恚的仇人，则是不停地想此人曾经对我做出什么样的伤害，以后又做出什么样的事令我不快；", "或是看到某位修行人受苦、不走运等，而认为业果不实。如果有上述六因生起，烦恼就会跟着来，因此，我们要尽力防止这些因的生起。如果不修对治法，烦恼就会愈来愈炽盛；反之，烦恼就会逐渐减轻。所以应当勤修对治法。", "辛四、烦恼之过《经庄严论》中说：烦恼坏自、坏他、坏净戒，退损失利护法大师呵，斗争恶名他世生难处，失得、未得意获大忧苦。如此颂所说，烦恼的过患繁多：烦恼一生起，心即成不善体性；倒执所缘境；加强烦恼种子随眠；贪、瞋等同类烦恼相续不断生起；犯大德所呵责的罪过，造下令今生、后世均不得安乐之业；延迟解脱与一切智的获得；令善行衰败等祸及自他；戒律败坏；利敬减少；遭到诸佛与护法神的呵责；某些人更因此而杀人害命等，造成自他的痛苦；现世中因官司、诤讼等导致身败名裂；后世受生于边地或恶趣等。简言之，无边的过失都是烦恼造成的。所以，当烦恼生起时，应当立即认识到这些烦恼是元凶而设法予以歼灭。《入行论》中说：一切天非天，设与我为敌，彼不能令我，入无间火中。此大力惑敌，掷我入狱火，须弥若遇之，亦不留灰烬。烦恼是最凶恶的敌人。与敌人讲和，对方也许会息怒、不再伤害我们；但如果与烦恼讲和，烦恼反而会加害我们。我们过去所受的一切苦难，例如在无间地狱中被烈火焚烧等，全是烦恼造成的，而且今后还将持续受到那些剧苦的伤害。因为烦恼迫使我们在生死中受苦，所以，比三界所有的仇敌更为凶恶。", "噶当派先德说：对烦恼，我们应该摆出搏斗的架势，尽力打击它们；对有情，则应开放我们的胸怀，尽力饶益他们。格西奔也说：我住在心的门口，手里拿着对治的短矛，它逼紧，我也逼紧；它放松，我也放松。我们也应该如此将烦恼视为主要敌人，随时运用对治法。庚二、烦恼集业之理业分“思业”与“思已业”两种。思业，如《集论》中说：云何为思？谓令心造作意业，于善不善及无记中，役使心为业。例如，一生起想说粗恶语的念头时（那种想要说以及促使我们非说不可的心），即是思业。思已业，即由思发起的身、语业。《俱舍论》中说：业谓思彼起，思即是意业，彼起身语业。烦恼所造的业分非福业、福业与不动业三种。以希求现世的心造集杀生等业为非福业，此业能令受生于恶趣；以希求后世心造集的福业能令受生为欲界天、人；不动业中，由厌烦外界欲乐、专求内三摩地乐受而造的业，能受生为初禅天至三禅天的天人；由厌烦三摩地所生乐受、希求舍受所造集的业，是受生为四禅以上天人的因。能引欲界生的福业与非福业，果在何处成熟并无确定，所以是动业。例如，某人虽已成为地狱中有，但因师长、仪轨、密咒等力量，该中有的情形可以发生变化，而受生在善趣之中。", "仲仁波切曾说：热振的居士们如能将财物共同享有，对死后培修善根很有帮助。（帕绷喀大师指出，以这样的共有制培修善根，对亡者中有利益极大。）能引上界生的业则为不动业。例如，造初禅业者只能受生在初禅天中，而不会受生在二禅等天中。《俱舍论》说：福欲界善业，不动从上起，由于彼地中，业熟不动故。任何不是由“三主要道”之一发起的业，都是生死的因；任何由厌离生死所做的业，全是解脱的因。如果我们没有出离心等却想修法，即便舍弃现世跑到茅篷里修三摩地，运气好的也不过是修一些受生于色界或无色界的因，此外无他。因此，想修法的人应当寻求无误的教授，这很重要。庚三、死殁及结生之理分三小节：（辛一）死如何发生之理；（辛二）死后成办中有之理；（辛三）于生有受生之理。辛一、死如何发生之理死缘：有的死亡是寿命竭尽造成的，有的是福报穷尽造成的，也有的是未舍不平等死，即经中所说的九种死缘。死心：临终时能引后世的业被触发，触发者为爱、取。具体情况是：因为想到将与此身分离而爱著现在之身为“爱”；将生热地狱者对热产生欲望即“取”。触发的对象：在众多黑、白业中，力量最强的将被触发；如果势均力敌，那么习惯较深的将被触发；", "如果习惯也相同，则先造者被触发。触发的时间：临终时由死者本人忆念，或由别人劝作忆念，在粗想仍现行之际，信心、悲心、贪欲、瞋恚等善、不善法在心中运作。粗想停止之后，微细的死心为无记心，善或不善均不能忆念。临终时心中如果生起信心等，将触发善业，因此在死心将要触发业时，让善念在心中明白显现出来是很重要的关键。平时修善的行者，如果在临终时生起瞋恚等烦恼，死心将触发不善业，使过去的不善业成熟而投生恶趣；平时作恶者的情况，依此可以类推。那时候，往善趣者的体温将从身体下部往上收入心间；往恶趣者的情况与此相反。解支节苦的大小，通过观察可以得知。“解支节”意为身体内部要害部分的坏死。有些人在临终时会出现幻觉，例如，空中掉下茶砖或被人压倒等等。前些时候政府财政部门的一个小官，因为曾经偷过茶，死时出现被许多茶箱压身的恐怖幻觉；后藏有个官员，死时声称有人压在他身上，在恐惧惊惶之中死去；有个行善的乞丐在等待施舍时死去，临终时见到华屋与白光；曲桑有个持诵“嘛呢”多遍的老太太，临终时出现瑞相等。这些征兆都是有关死状的前兆。辛二、死后成办中有之理与死有结束同时，如同秤的两头低昂，即形成本有的形状（即后世身体形状）。", "这里所说的“本有”，是指后世死有之前所具有的生蕴形象。有人说，死者中有的形象、容貌一如生前的样子，仍能与活在世上的人交流、捎来信息等，实际上这不是真的。纵然有人曾经有过一、两次的经验，也当知道来者并非死者，而是假冒死者形象的非人来欺骗世人。（帕绷喀大师又讲了杰·密勒日巴勾召一苯波家亡父的故事。）中有诸根具足、且有神通，其身神变的能力，除有加持力的所依及生处之外，均可通行无碍。地狱中有的颜色如烧焦的木段；饿鬼中有的颜色如水；畜生中有的颜色如烟；欲界天、人中有的颜色如上等黄金；色界中有的颜色鲜白；将受生于无色界者，则无中有。造不善者的中有身体如被黑夜笼罩；作善者的中有则散发白衣光或月夜的夜光。关于中有的寿量，各派说法不一，但多数主张为七天，与后世所生之处的时间单位相吻合。七日后发生一次“小死”，如果未获生处则每过七天一次“小死”，最多到七次。辛三、于生有受生之理以胎生为例，中有将父母的精血看成父母交合状，对此生起贪、瞋，受到贪、瞋的驱使，中有只见到父母的生殖器官，对此生瞋而死殁，受生成为生有。上述内容是根据《菩提道次第略论》《坦途》与《捷径》来思惟集谛生死的流转次第。", "现在我再根据《文殊口授》，从“十二缘起支”的角度，讲思惟集谛流转次第的方法，这方面是《菩提道次第略论》与《坦途》《捷径》所未讲，而见之于《菩提道次第广论》中的。如果只是根据科判来讲，那么依据前文简述集谛生死流转次第也就够了，但对已学过法相论典的人来说，如能根据“缘起”来思惟，由于补特伽罗根器各异，对有些人而言，这种思惟方法更好。（帕绷喀大师接着举了两个例证：过去中印度某国王，寄赠边地国王邬达惹耶426掌中解脱菩提道次第二十四天教授见次页插图。此图中圈所绘鸽、蛇、猪三者，表贪、瞋、痴烦恼；其外圈所绘为中有，左侧为行善上升者，故色白，右侧为造恶下堕者，故色黑；其外圈所绘为中有受生之处，自右上方开始，依次为人、饿鬼、地狱、畜生与天五道；其外圈所绘为五道众生于生死中流转之十二因缘，自右上方开始，依次为无明、行、识、名色、六处、触、受、爱、取、有、生与老死十二支。此轮为无常鬼所啖食，表诸行无常。左上角之光圈表涅槃，右上角之立佛以手示之，表引导众生离生死苦获涅槃乐。左上偈颂义为：“汝当求出离，于佛教勤修，降伏生死军，如象摧草舍。于此法律中，常为不放逸，能竭烦恼海，当尽苦边际。", "”详见《根本说一切有部毗奈耶》（T23，no.1442）卷34。法名为循努坚赞（童幢，103l～1107），师事仲敦巴十一年，噶当派密法十六明点之传承师长之一。", "第十五天思惟苦因与抉择解脱道性427十二缘起支此处为了加强我们的厌离心，特由十二缘起支之门来思惟集谛生死的过患。此法系佛陀在讲《稻秆经》时所说。所谓“缘起”，即如所谓“此有故彼有，此生故彼生”，因为有无明的缘故，所以产生“行”等。无明：即流转生死的根本。智慧见到的是无我；无明则将“补特伽罗”与“法”视为有我与自相有，因为与明智的认知正好相反，故称“无明”，就像是瞎眼的愚人一样。无明有两种：“业果愚无明”“真实义愚无明”。行：即以无明为动机，能召来后有蕴的造业。由业果愚无明之动机造“非福业”；由真实义愚无明之动机造“福业”与“不动业”。识：分“因位”与“果位”二类。“因位识”，为行支业习气当下所熏之识；“果位识”，为于生有当下结生之识。例如在以无明为动机造杀生业时，业道圆满之当下，为此业习气所熏之识，即“因位识”。由于此业力，于地狱生有结生当下的识，即“果位识”。每一种不善业均能引发多次的恶趣生，福业等情况可照此类推。如同沙子浸油或纸上盖印一般，识为业习气所熏染，日后被爱、取触发，便变得有力而能引生后身。名色：以胎生为例，受、想、行、识四蕴为“名”缘起；", "识所进入的受精卵“羯罗蓝”等为“色”缘起。它们又称为“名色”随一缘起。六处：此时眼、耳等六处虽已形成，但因根、境、识三者尚未会合，故不能取境。身与意根从“羯罗蓝”位起就有。如果是化生，下二界中，“名色”缘起与“六处”缘起同时形成；无色界中，只有“名”缘起与“意处”缘起，没有“色”与“五有色处”缘起。触：根、境、识三者会遇，取悦意、不悦意、不喜不厌三种境，为触缘起。受：以触为缘，产生乐受、苦受、舍受三种受。例如，值遇悦意境而生乐等。爱：对乐受起“不离爱”；对痛苦起“乖离爱”、想要逃避；对平等舍起“不坏爱”。这里所说的由受生爱，是说伴有无明的触缘所生的受，由此受生爱；如果没有无明，受是不会产生爱的。取：爱逐渐增强之后对境产生的希求与贪著。取分四种：对妙欲的贪著为“欲取”；对除坏聚见之外邪见的贪著为“见取”；对与邪见相关的恶戒与禁行的贪著为“戒禁取”；对谛实的执著、尤其对蕴的坏聚的执著为“我语取”。有：行将业习气熏染于识，次为爱、取所触发，从而变得有力而能引生后身。生：受到触发的业变得有力量而能形成后有，于是识在四生任何一种状态下结生，此最初结生，即为“生”缘起，然后依次形成“老、死”缘起。", "老死：老指蕴的状态逐渐变化、成熟；死为蕴同分的舍弃或坏死。如此妥善认清十二缘起支的区别之后，随后应该知道如何收入四支的道理。四支即：能引支、能生支、所引支与所生支。“无明”，如播种者；以此为动机而造的“行”业，如种子；“因位识”上留下所造业的习气，如播种于田。无明、行与识中的因位识，这两支半缘起为“能引支”。触发业种使之有生果能力的“爱”“取”二支，如为种子灌溉施肥，以适当的温、湿度培育；经爱、取触发后，能引发后有后生之蕴的“有”，就如同经水、肥、温、湿等培养过后，有发芽能力的种子。爱、取、有三者为“能生支”。", "于生有结生的“生”，如种子发芽。生缘起是“所生支”的一部分。上述“果位识”“名色”随一缘起、“处”“触”“受”四支半缘起为“所引支”。“老死”随一缘起为“所生支”的一部分，与生缘起同属“所生支”。以生天者为例，由“真实义愚无明”造生天的“能引业”、所造感生天上业的习气留在“识”上，为三能引支；希望受生在天界的“爱”，此一希求进一步加强的“取”，以及由这两者造成临终时决定能引业的“有”，为三能生支，这因位六支缘起在此生中圆满。其后受生在天上时，“名色”“处”“触”“受”为四所引支，“生”“老死”为二所生支，此果位六支缘起在后生天身中圆满。这是一重缘起的十二支在二世中圆满的情形。另以生恶趣者为例，由“业果愚无明”造不善业，次由爱、取触发等，可据前依次类推。由于造作某业的全部缘起无法在一世中圆满，所以最快也需要二世。如果业未经爱、取触发而被搁置，则三能引支需要一世，三能生支需要一世，四所引支与二所生支需要一世，共需三世才能圆满。例如，今生虽造恶趣业而留有习气，但临终时由师长等劝导生起善心，以致触发某种感生人中的业成熟而后世受生为人；", "如果以前所造的不善业，在后世死时又被爱、取触发，则其再下一世将堕恶趣。以此为例，能引与能生之间可以有多生间隔，但因属其他缘起之生世故，不算入此重缘起之内。总而言之，一重缘起的各支，少则两世，多则三世圆满，比两世更少或比三世更多的情形是不可能的。这些缘起由前支生后支，从而在生死中经受生、老死等一切苦恼。在某业果位的缘起当中，又产生种种其他业因位的缘起。老死由生而起，推至行由无明而起，由此可见，一支引发一支在生死中流转的根本即是无明。怙主龙猛说：", "从三出生二，从二而生七，从七复生三，数转三有轮。我们由三支烦恼造两支业，由此起七支苦，复由七支苦生三支烦恼，像这样反复不断地在三有生死中流转、受苦。当我们以修道来结束这种缘起时，应先断无明，无明断则行断，直至老死等一切痛苦全断。简言之，十二缘起支可归纳成业、烦恼、苦三重缘起：无明、爱、取三支为烦恼；行、有两支为业；其余七支为苦。如龙猛所说：初八九烦恼，二及十为业，余七者是苦。第一句说明初、八、九三支为动机；第二句说明行与有二支为身、语业；第三句说明其余七支为报应。由顺、逆两种次序思惟十二缘起修习生死总苦之后，像囚犯希望从狱中逃脱出来一样，想逃脱生死，便是出离心生起之时。生起求解脱心之后，接着即应学解脱之道。己二、抉择能趣解脱道性这部分共分两段来讲：（庚一）以何等身灭除生死；（庚二）修何等道灭除生死。庚一、以何等身灭除生死在思惟生死过患之后，我们将意识到：情器生死的本质如同遭受风吹的水月，刹那不住地坏灭无常；生死的诸般快乐好似毒蛇头下的阴影，利少害多；受生在五趣中任何一趣，都将不间断地受到痛苦的折磨。", "然后我们就像身处火宅、监狱的人不想继续留在那里，而想从其中逃脱出来一般，生起不假造作的希求解脱生死之心。", "当我们探索生死之因时，将发现造成生死的原因是业与烦恼，这两者中烦恼是主因，烦恼中又以无明为主因。所以，我们必须设法断除这个无明。至于修道之身，则必须依靠现在这个具足梵行三学的暇满人身来灭除生死。因为没有比人身更殊胜的修道之身，博朵瓦曾说：以前流浪许久未能自还，现在也无法自然还灭，所以必须断除，而断除之时也是现在得暇满之时。庚二、修何等道灭除生死想要斩断生死根本，必须根除作为生死根本的真实义愚无明俱生我执。否则，用其他对治方法只能暂时压伏烦恼而无法彻底消除。而对俱生我执来讲，一般善法是不能损伤它的，只有用一种与我执感受完全相反的心才能断除它。由于证无我慧能通达无自性，与执自性有的心正好相反，因此，我们必须证无我慧来根除俱生我执。若无此慧，再怎么勤修其他的善法，它们只会变成我执的朋友而无法攻击它。想在心中生起证无我慧，先要生起“增上定学”。譬如伐木时，光有锋利的斧子是不够的，还需要能握斧的强壮臂膀。没有利斧当然无法砍树，但如果没有强壮的手臂，也无法每次都将斧头砍在同一个地方。或者像晚上观壁画，需要一盏不受风吹的明灯。证无我慧好像利斧，能伐我执之树；或像照明本相的灯火，能如实见到真实情景；", "这又需要心离微细内散乱且一心专注的坚固三摩地，它就像握斧的强壮手臂或不被风吹动的灯火。要想在相续中生起心离内散乱的坚固三摩地，我们必须先生起能使心远离粗显外散乱的“增上戒学”。简言之，如《本地分》中所引《梵天请问经》所说：", "根本极坚固，喜乐寂静心，圣见与恶见，具足不具足。“圣见”是指作为我执正对治的证空性真理慧，为了生起具足圣见的毗钵舍那，必须先成就奢摩他，但如果没有戒学，就不具备生起奢摩他的条件。《亲友书》中说：或头或衣忽燃火，尚应弃舍灭火行，而当力求无后有，因无余事胜于此。应以戒慧静虑证，寂调无垢涅槃位，不老不死无穷尽，离地水火风日月。中士所修的法，就是“增上三学”。如果不继续作上士法类引导，此处便应详述“三学”。因为这里只是作共中士道的引导，并不是讲中士道的正行，所以，“定学”与“慧学”留待上士道止观时再讲，按照规矩，此处以“戒学”为讲述的重点，《亲友书》中说：戒是一切德依处，如动不动依于地。因为戒是一切功德的基础，所以戒律清净很重要。戒是圣教的根本，持戒者利益极大，犯戒者过失也很大。至于持戒的功德：佛教是否住世，取决于根本别解脱戒。如果有持律比丘存在，圣教即存在；否则，纵有菩萨、持明士之类的人物住世，圣教也并不因此而存在。所以，《别解脱戒》中说：于我涅槃后，当以戒为师。意思是说，我们应当将自己所受的戒视为大师佛陀的代表而爱惜守护。", "对我们初学者来讲，虽然目前难以实修三学中的定学与慧学，但我们相续中肯定有的、肯定能实修的“证正法”，就是自身的别解脱戒，所谓“佛教是否住世观待于僧伽”亦是此意。别解脱戒又是上两种律仪的基础或容器。所谓“住持圣教者”，并非专指在法座上说法的人，若能如理守护自身的律仪，即是“住持圣教者”。因为能对“教正法”做闻思，便是住持“教圣教”；持戒清净即是住持“证圣教”。三律仪中我们确定正在实修的即是别解脱戒，这是很殊胜的，经中说：“具戒比丘具光焰”等，又说：凡有持律比丘之方所，具足光明。当视彼处我非不在，我亦不需忧虑彼处。我们藏地有别于外国的特色以及久暂利乐的唯一根本，即是佛陀的教法。佛教是否弘扬，并不在于房屋与人口的众多，以及供品的华美等，而是取决于圣教根本别解脱戒是否存在！如果别解脱戒不清净、自身戒律退失，即便世界上佛教像尘土弥漫般弘扬于各地，但对个人来讲，圣教却已告隐没。《三摩地王经》中说：若经俱胝恒沙劫，净心以诸妙饮食，伞盖幢幡及灯鬘，承事百亿俱胝佛；若于正法极失坏，善逝圣教将灭时，昼夜能行一学处，其福胜前俱胝倍。意思是说：现在浊世中持戒的功德，要大于昼夜六时供养三世诸佛。该经又说：", "于此娑婆世界大师释迦牟尼教法中持戒一日，较于东北自在王佛刹经劫持戒，功德为大；现在但守护一学处，较过去劫守护全圆学处功德犹大。持戒功德比经俱胝劫供养众佛的功德还要大，所谓“具戒值佛世”等。我们平时所做的半月诵戒，不能像赶经忏般快速念过，也不是为了计数等其他目的，而是为了提醒自己守戒，所以应该按照戒本中的内容来检查，如理守护所接受的戒律。当我们念诵“圣教心要恒光显”与“愿增善慧胜者教”等颂文时，应当祈愿圣教心要首先在我们各自的相续中弘扬起来。至于犯戒的过患，如《比丘珍爱经》中说：或有戒为乐，或有戒为苦，具戒获安乐，毁戒则成苦。又如《具足净戒经》中说：诸比丘宁可离命而死，非可坏戒，何以故？离命而死唯令此生寿量穷尽；坏戒者，乃至百俱胝生常离种姓，永失安乐，当受堕落。犯戒者将于许多俱胝生中受苦。《毗奈耶分别》中说：若于大悲大师教，起轻微心稍违犯，由是而获苦增上，拆篱失坏庵没林。现成有于王严令，违越而未受治罚，非理若违能仁教，如香叶龙堕畜生。", "436掌中解脱菩提道次第二十四天教授此龙于迦叶佛世为精进比丘，以轻毁心，犯佛学戒，折伊罗钵树枝，遂堕龙身，备受众苦。详见汉译《佛本行集经》（T03，no.190）卷31。又称“近住律仪”。承许于一昼夜内断除杀、盗、淫、妄四根本罪，以及饮酒、着香鬘花饰与歌舞、坐高广床、非时食四支分罪之别解脱律仪。又称“近事律仪”。终生奉持五戒或其中之部分：不杀、不盗、不邪淫、不妄语、不饮酒。居士共分六种：1.一戒居士、2.二戒居士、3.多戒居士、4.圆戒居士、5.梵行居士、6.八戒居士。与八关斋戒类似，但有以下六大差别：1.授八关斋戒者需具足近事等以上之律仪。授大乘长净者则需具足菩萨律仪（亦可在佛像等前受）。2.出家众不可受八关斋戒，彼为一日戒故；然可受大乘长净，戒体不同故。3.受八关斋戒之动机为出离心，受大乘长净之动机至少为造作之菩提心。4.八关斋戒仪轨始于归依，次三返受戒；大乘长净仪轨则述及佛昔日所做之菩萨行，受法者当仿效佛陀，发菩提心受持八戒。5.受大乘长净者需断肉食一日，受八关斋戒者则不需。6.受八关斋戒者所得之果视其动机而定，受大乘长净者则决定获究竟菩提。", "详见墀江仁波切所造《受大乘长净仪轨易行法·登大菩提宫之梯》，收录于《解脱之门》，昆明：云南民族出版社出版，2006。", "清楚自己是否犯戒，所以应当根据自己的慧力，阅读《毗奈耶经》《学处摄颂》《三事学处》《本事教集颂》等典籍，清楚了解每一条戒的内容。“不敬”是犯戒之门，所以我们应当对大师佛陀、佛陀制定的戒律，以及共同修梵行的友伴生起恭敬，尤其要对自相续中的戒生起大师佛陀想而加以恭敬。戒是大师涅槃后的代表，不可轻视之。烦恼多也是犯戒之门，贪、瞋等烦恼哪一种较强盛，相应的犯戒情事就会随之出现。就像打仗时，勇士、将领必须先将最厉害的敌人制伏，我们也应该运用对治法来对付心中力量强大的烦恼。具体来说，贪欲重者当修不净观，即将身体观作臭皮囊，生起瘀肿、脱落、腐烂、骨骸想等；瞋恚重者当修慈愍；我慢重者当修老死、不定、数数高下过患等，以及思惟界的分类，因为如果连目前自身中的蕴、界、处、根、身触等都不知道，其他又知道些什么？愚痴重者当修缘起与烦恼总对治法——空性见。“放逸”也是犯戒之门，所以，我们在行、住、坐、卧、饮、食等一切威仪中，当保持不忘取舍的正念，并时时检查自己三门有无被罪堕染污。我们必须以正念、正知、有惭、有愧的方法来关闭这些犯罪之门。万一被罪堕玷染，便应在“长净”等时一而再、再而三地忏除。", "虽然《毗奈耶经》中，说“僧残”等罪应以“迁”“悦”“解除”三法忏悔，但温萨巴父子主张：若能妥善地做到追悔、防护，则“僧残”以下的罪即可忏净。虽然我们无法像无与伦比的阿底峡尊者、文殊怙主宗喀巴大师父子等，做到持戒严谨、丝毫不为过失所染，至少应拼舍性命守护四根本与饮酒戒。", "由于别解脱律仪是受自于轨范师、亲教师及僧伽大众，也应在僧伽前忏除与别解脱学处相违背的罪堕。自己单独忏除虽能净罪，但不能净堕，所以无效。戒律之中，有人对违犯受水、脱鞋、着长袖衣等学处觉得无所谓，这是错误的。撇开他胜、僧残等不讲，犯上述细行对圣教形象也有极大的损害，所以，应当努力做好“舍堕加持”等事。正如烧饭、煮茶等世间俗事，需要备齐酥油、盐、肉等原料；想要成办所求后世之身，单有持戒或布施等也是不够的。出家人应该在持戒清净的基础上，尽力修布施等法。某些人声称：“只有劣根者才需要别解脱毗奈耶，对上根利者来讲，无需这种局促的行持，因为密宗速道能转三毒为道”，从而对戒律一点也不重视，甚至行为放逸。密宗行者若具有别解脱律仪，仍要如理守护。《妙臂续》中讲：佛我所说别解脱，净戒调伏尽无余，在家咒师除形相、轨则，诸余尽当学。《文殊根本续》中说：能仁未曾说，毁戒咒能成，非趣涅槃城，境域及方所。于此愚恶人，何有咒能成？此毁戒有情，何能生善趣？且不得天趣，又无胜安乐，何况佛所说，诸咒岂能成？（帕绷喀大师最后指出，有些人既没有“出离心”，也没有“菩提心”“正见”，他们以修习所谓的“观心本面”度过一生，但这种精进是徒劳的，这些人当中，最好的只不过是造一些不动业而已。随后大师又将上述内容重述了一遍。）440掌中解脱菩提道次第二十四天教授"]}, {"c": "第十六天", "segs": ["发菩提心利益（嘉杰·帕绷喀仁波切先依照规矩，念了论中相关的几段文字，随后引用三界法王宗喀巴大师的话：“若无菩提心摄持，出离不成无上觉”等，讲了必须在出离心基础上发菩提心的道理，亦即前行纠正动机之法。接着回顾了已经讲述的各科，并重述了一遍“抉择趣解脱道性”的内容。大师接着说：是什么力量使我们在生死中流转呢？是业。业则由烦恼产生，更明确地说，是由烦恼根本无明所产生。为了根除无明，我们需要生起增上慧学；为了生起增上慧学，又需要有定学与戒学作为前提，所以说，戒是功德的基础。大师又说，在修烦恼对治法时，我们先要让烦恼现前，然后认清其体性，再来修对治法。这一方法使我们在散乱时也能体认烦恼。）丁三、于上士道次第修心此科分三大段：（戊一）显示入大乘门唯是发心及其利益；（戊二）发菩提心之理；（戊三）既发心已学行之理。戊一、显示入大乘门唯是发心及其利益如果我们只是像下、中士道中说的，以出离心为动机，勤修增上三学，以求个人获解脱位、消灭生死，是不够的；因为既不能断一切所断，也不能圆满一切功德，所以，所成办的自利与利他只有些许而已。", "我们应当一开始就直入大乘，《摄波罗蜜多论》中说：无力引发世间利，彼二乘者当永弃；一味利他为体性，悲宣佛乘应趣入。格西博朵瓦也说：涉河不需二撩衣，最初即入大乘道。不能直入大乘，就会变成过一次河撩两次衣。不仅如此，由于阿罗汉们在寂乐界中入定时，有不可思议的安乐感，所以不愿出定而入定多劫；在此期间，某些地狱众生却可能因获得暇满、入大乘道而成佛。由此可见，阿罗汉获得佛位的时间反而延迟。因此，大乘种姓者闻大乘法熏留习气，纵然生起邪见堕入地狱，也要比入小乘道证阿罗汉成佛要快，所以更为善妙。例如，以前声闻迦叶为六十位比丘讲小乘法、使他们将证阿罗汉时，文殊来到会场为他们开示大乘法，他们不但听不进去，反而生起邪见，结果受生在地狱中。迦叶为此事向大师佛陀抱怨，佛陀却夸奖文殊的善巧方便。阿罗汉在入灭定时，即便佛陀亲自劝说他们入大乘，由于太习惯定中寂乐，往往对修发心等提不起劲；纵使精进，也因自苦已解，所以难起悲心等。“第一双”弟子对大师佛陀所说的大乘道果虽然十分赞叹，但是也说：“我们已成焦种败芽，对此已无可奈何。”圣舍利弗等是变化的声闻，本人虽然没有这个问题，但考虑到其他真正的声闻乘人才作此感叹。", "所以说，对成佛而言，小乘行者有着极大的障碍。因此，我们对出离心一旦有了体验，即应决定趣入大乘道。在共下、中士道中修心，目的是为了在相续中生起出离心，而非修其正行道。我们的正行道，是修上士道之菩提心，下、中士道是其前行，学习总菩萨行是其结行。学上士道先要生起欢喜心，所以此处根据规矩，按照《文殊口授》先讲发心利益。发心利益共有十种：（己一）显示入大乘门唯是发心；（己二）获佛子名；（己三）映蔽声闻；（己四）成就最胜福田；（己五）易圆满资粮；（己六）速净罪障；（己七）成就所愿；（己八）损害与中断不侵；（己九）速疾圆满一切地道；（己十）成就出生众生无余安乐之良田。己一、显示入大乘门唯是发心是否进入大乘之列，取决于相续中是否生起菩提心。宗喀巴大师曾说：故法虽是大乘之法不为满足，最要是彼补特伽罗入大乘教。又大乘人依赖于菩提心，假如此人仅有粗浅了解，其大乘亦唯尔许。如果心中没有菩提心，纵然修习像“吉祥集密”生圆次第那般最深奥的密法，照样不会成为成佛的因，就连大乘资粮道也无法进入，甚至不能算是修大乘法；反之，如果发起菩提心，即便只持诵一遍“嘛呢”，即是大乘法，也即是成佛的因。", "《宝鬘论》中说：自与此世间，欲证无上觉，其本菩提心，坚固如须弥。假使没有菩提心，修密宗生起次第就如同看戏一般；修圆满次第“吸持与呼出”等“风如行”也和吹皮火筒没有两样。密法的迅捷特色也是在专修菩提心的基础上才能体现出来的。章嘉·若贝多杰（游戏金刚）曾请法于普觉·昂旺降巴，他后来赞叹说：", "喇嘛降巴在传大灌顶的时候，其灌顶开示完全是“道次第”的内容。别人看来，师长所讲的似乎不是密法，其实无庸置疑是通达道要之语。阿底峡尊者听说一个没有菩提心的“喜金刚”瑜伽师证得预流果，为之庆幸，并说：“这是没有我所说的菩提心所致，甚至有修喜金刚而堕入地狱的！”这还是最好的情况，有人没发菩提心却念诵许多忿怒本尊咒，后来变成恶魔或堕入地狱。（帕绷喀大师讲了过去有位修大闭关的人受生为曲水地神的经过。）假如那位证预流果的“喜金刚”瑜伽师有菩提心，便是即生成佛之因；本可成佛的因却用来获小乘果，这是没有菩提心的过错。对所谓的“甚深法”要做如是观。此外，还有以下几则故事：以前所说的婆罗门青年杂那加；印度有个修“降阎摩”的瑜伽师，死后变成恶魔来到藏地，被阿底峡尊者施食驱赶回去；以及潘波地区某“大威德金刚”瑜伽师，死后变成本尊形状的饿鬼，等候以前的侍者做烟供。现在大多数人很看重亲见本尊、神通变化这类的事，但如果没有菩提心，仍旧可能入恶趣，所以，任何的神通变化对我们都没有利益可言；反过来说，纵然不勤修别的法，有菩提心即有大乘法的根本，不论是显是密，成不成为大乘，完全取决于是否具有菩提心。", "倘若怀有菩提心，即便是布施畜生一握之食，包括那些无记威仪，也都能变成获得圆满菩提之因。大菩萨们甚至能以菩提心将不善业转成善业。仅有证空性慧不行，因为空性慧像母亲一样是三乘菩提的共因；菩提心则如父亲，是无上菩提的决定因。前者称为母，道理也在于此。", "简言之，除了不想求得佛位的人之外，所有人都必须以菩提心作为修持的中心。如果追究三乘功德等一切善事的根源，当可发现皆从菩提心出生。假如有人问我们主修什么，我们多半回答说是“马头”、是“金刚手”、或是“大威德”等。然而绝大多数人实际上是以烦恼三毒作为修持的中心！阿底峡尊者虽已善巧所学的一切法，但并不因此满足，为了求得菩提心教授，在海上辛苦漂泊达十三个月，后来在金洲大师处圆满听受教授，以菩提心作为修持的中心，并对开示此法的师长特别恭敬侍奉，即使金洲大师所持的见地是较下劣的唯识见。因此，我们应该观察观察，这个菩提心是否能在相续中生起。我们现在所拥有的躯体是发心所必须具备最好的躯体。至于法呢？修菩提心教授中最殊胜的就是“菩提道次第”。这些条件我们都已具备，如果不趁现在设法在相续中生起菩提心，是极其可惜的。有些人终生靠服食石子等辟谷术苦行活命，自诩为顶尖的修行者，却看不起菩提心，像这种偏离正等觉之道的人为数甚多，大家也都见过。我们应当审视自己有没有可能在相续中发起“无励力”的菩提心，如果有，当然最好；否则也要看看是否能发起“有励力”的菩提心；再不然，就要问问自己是否有可能“通达”此菩提心。", "连一座菩提心所缘都不修，单是勤修本尊、猛念密咒，这种辛苦是无益的徒劳，极为可惜。己二、获佛子名是否能成为佛子，取决于有无菩提心，有道是：发菩提心刹那间，系生死狱诸苦囚，皆应称为如来子……", "448掌中解脱菩提道次第二十四天教授引自《入行论·受持菩提心品》。分大小五明：工巧明、医方明、声明、因明与内明为大五明；修辞、辞藻、韵律、戏剧与历算为小五明。参阅《利益寿终者教授·解脱幻境》，昂旺多杰（语自在金刚）造，收录于《临终教授解脱幻境》，台北：盘逸有限公司，2014。汉译《大方广佛华严经》卷78：“善男子！譬如有宝，名：净光明，悉能映蔽一切宝色。菩萨摩诃萨菩提心宝亦复如是，悉能映蔽一切凡夫二乘功德。”（T10，no.279，p.431c22-24）汉译《大方广佛华严经》卷36：“善男子！如金翅鸟王子，初始生时，目则明利，飞则劲捷，威势力能超过一切其余众鸟，虽久成长，无能及者；菩萨摩诃萨亦复如是，发菩提心，为诸如来金翅王子，智慧清净，大悲勇猛，具自在力神通威势，一切二乘虽百千劫久修道行所不能及。”（T10，no.293，p.828c19-25）“善男子！譬如王子初始生时，即为一切耆旧大臣之所尊重，以种族真正增上自在故；菩萨摩诃萨亦复如是，于佛法中初发菩提一切智心，生如来家为法王子，即为一切久修梵行声闻、缘觉所共尊重，以菩提心大悲种姓增上自在故。", "”（T10，no.293，p.829c18-24）也说，譬如王子虽小然能映蔽诸耆老臣僚，金翅鸟虽小而能映蔽其他禽鸟；相续中发菩提心之初业菩萨，也能映蔽一切声闻、独觉众。此乃“增上意乐”的力量所致。同样的譬喻，还有金刚宝石虽然破碎，并不因此而丧失金刚宝石之名，依旧能胜过所有金饰，也能消除一切贫穷；相续中发起菩提心者，即便不能学菩萨行，但因其相续中有菩提心的缘故，仍不失“佛子”之名，既超胜一切善资粮珍宝，也能胜过声闻、独觉众的金饰，又能消除生死的贫穷。因此，若想认识什么是八万四千法蕴的心要，除此菩提心外，没有他法。阿底峡尊者曾教导说：舍弃现世！专修慈心、悲心与菩提心！己四、成就最胜福田相续中发起菩提心的人，当成为人天的最上供养田，所谓“人天世间应礼敬”。但是，此菩提心非短时间修行可以生起，阿底峡尊者就花了十二年时间。某些人多年勤修本尊与念咒，却远不如将这些力气花在修菩提心上，噶当派祖师们曾说：人人都有本尊可修，人人都有密咒可念，这都是因为没人有可供思惟的正法！所以，纵然只能安置一些菩提心习气也是很切要的。过去佛陀说法时，五百头大雁闻声受生到天上而见谛；", "未生怨王有极强的空性习气，某次供午斋时，供养文殊一件价值千两黄金的华服，文殊却消失无踪，未生怨王将华服穿在自己身上，他本人也消失了，从而通达空性，这便是以前习气的力量醒觉所致。此心生起时，梵天、帝释等都会前来供养，使发菩提心者容光焕发，并帮助他们实现一切愿望。因为正等觉佛是由菩萨产生的，而菩萨是由菩提心所产生，所以据说连佛也要恭敬菩萨。经中说：譬如当礼敬新月，而非满月；彼等敬信我者亦当礼敬菩萨，而非如来。假如有菩萨坐入车中，想受用五欲之乐、游逛嬉戏，却无骡马拉车，佛也要将拖车的绳索套在自己的脖子上。圣舍利弗辈纵然经劫入灭定，如来却不会因此而尊敬他。以前佛陀未将钵中美食的荐新供养文殊，以致钵盂没入地下。己五、易圆满资粮雍陇巴说：此菩提心一旦生起，便能借之积集资粮，能借之净治罪障，也能借之消除障难。宗喀巴大师也说：转二资粮如金术，摄纳众善为福藏。又如：顺易积集广资粮，犹如最胜点金术，垢身得此将转成，无价之宝胜者身，故应坚持菩提心。", "又说：余诸善行如芭蕉，果实生已即枯死；菩提心树恒生果，非仅无尽反增茂。圆满福德资粮，没有比发菩提心更殊胜的方法。倘若不是怀着菩提心，纵使经历几十万劫，将摩尼宝装满三千大千世界，一一布施给十万名有情，其果报照样有竭尽的一天，因为这一布施既非菩萨行，也不是成佛的因。反之，如果怀有菩提心，即便只布施畜生一握之食，其果报也是无穷无尽，因为这一布施既是菩萨行，也是成佛之因。怀菩提心供一炷香的功德，与供养有情数等量香的功德相同。心怀菩提心念一遍六字大明咒，也能获得念有情数等量咒的功德。佛陀住世时，有个穷人以菩提心供佛一盏小灯，阿难无法将这盏灯熄灭，如来宣称，就算是劫末的狂风也难将其吹灭，这是因为那人福德增长的缘故。《入行论》中说：何时为度尽，无边有情界，立志不退转，正受持彼心。即从彼时起，纵眠或放逸，福德力不断，量等虚空生。意谓受“行律仪”之后，即便在睡眠或放逸的时候，善德也会源源不断地出生。有心想祛除一位有情的头痛痼疾，福德尚且广大，何况是发心想解脱一切有情的无量苦病，福德又怎会不大呢？《入行论》中告诉我们：若思为治疗，诸有情头疾，具此饶益心，其福且无量；", "况欲除有情，无量不安乐，以及欲为彼，成办无量德。又说：偶备微劣食，嗟施少众生，令得半日饱，人敬为善士；何况恒施与，无边有情众，如来无上乐，满彼一切愿。简言之，凡是以菩提心为动机所造的善，其利益与一切有情数量一样多。己六、速净罪障净罪法中，没有比发菩提心更为殊胜的，正如《入行论》中所说：罪恶力大极难当，舍此圆满菩提心，何有余善能胜彼？其他忏罪法难以清净的极大罪障，发此菩提心即能消灭之。圣无著修习十二年的善业，抵不上他刹那生起悲心的力量，所以净治罪障以此为最殊胜。又如：如人虽犯极重罪，然依勇士得除畏；若有速令解脱者，不放逸者何不依？如果有菩提心，在遇到任何危险的关头，即罪障之果现前时，就好像与大勇士结伴同行，能化险为夷。所谓：菩提心如劫末火，刹那焚毁诸大罪。罪蕴再庞大，若以菩提心净治，就如劫火烧柴那般容易。所以说，为了消灭我们的罪业，与其百年勤修缺乏菩提心的净罪法，还不如修一座菩提心更为殊胜。", "己七、成就所愿菩提心发起之后，当能实现现前与究竟的一切目标。最殊胜的目标就是为一切有情除去不欲之苦，并为他们成办所欲之乐，《入行论》中说：以此无量有情众，顺利能获最胜乐。只要菩提心在相续中生起，常人难以修成的密续等中所说的明咒与事业法，均能轻易地获得成就。我们为什么连经、续、密籍中所说的那些小小成就，如降雨、防雹等也成就不了，正是因为没有菩提心的缘故。因此，若想消除自他人等的疾病障碍，及获取法力，就当发菩提心。我们事业成就不了，不可怪罪于羯磨集的教授有误。不仅如此，事业的成就也不一定要靠“吽吽呸呸”等密咒与密物，有菩提心者单靠说谛实语即能成就。例如，常啼菩萨以说谛实语治好了自己的身体；某次雅鲁藏布江江水泛滥，水淹拉萨地区，谁都无计可施，杰·蒙朗贝瓦（愿吉祥）在一块石头上写道：“蒙朗贝瓦若是菩萨，以此谛实请你速退！”然后抛入河中，河水立刻退走。因此，上至作为主要目标的一切智位，下至微小的事业，都能以菩提心成就。己八、损害与中断不侵转轮王睡觉时，金刚手、梵天、帝释与四大天王等也会时时保护。菩萨则得到双倍于转轮王的保护。因为昼夜六时都受到保护，一切伤害、魔祟、障难等绝不会发生。", "如果不发菩提心，纵使在修“酬补仪轨”时用鼓乐等召请护法，护法也不一定会来；反之，如果发起菩提心，毗沙门等四大天王会不请自来，像仆人那样随时保卫。", "454掌中解脱菩提道次第二十四天教授汉译《大方广佛华严经》卷78：“善男子！譬如有人，得解脱药，终无横难。菩萨摩诃萨亦复如是，得菩提心解脱智药，永离一切生死横难。善男子！譬如有人，持摩诃应伽药，毒蛇闻气，即皆远去。菩萨摩诃萨亦复如是，持菩提心大应伽药，一切烦恼诸恶毒蛇，闻其气者，悉皆散灭。善男子！譬如有人，持无胜药，一切怨敌无能胜者。菩萨摩诃萨亦复如是，持菩提心无能胜药，悉能降伏一切魔军。”（T10，no.293，p.826b28-c8）格西康陇巴法名为释迦云丹（释迦德，1023～1115），噶当派早期大德之一。指释迦牟尼佛成佛前在菩提树下战胜魔军的史实。详见汉译《菩萨本生鬘论》（T03，no.160）卷3，《慈力王刺身血施五夜叉缘起》。白哈尔起初系藏地一精灵，后为莲花生大师所降服，成为佛教护法。彼供养铁笔之意旨在迷惑二位大师勤于著述而疏于禅修。布顿·
