5.楞伽自在母16.树荫母W、护法1.四面大黑天2.帐面怙主3.法王内修4.法王密修5.法王外修6.六臂大黑天7.白摩尼怙主8.吉祥天女9.多闻子10.四臂大黑天11.大红司命主X、四大天王1.增长2.持国3.多闻4.广目624掌中解脱菩提道次第二十四天教授附录三菩提道次第体验引导修法教授625菩提道次第体验引导修法教授帕绷喀大师造仁钦曲札译第一章教诫观察修之重要及其修法扼要师长善慧能仁金刚持，父子传承诸师加持力，我与一切传承弟子众，自心与法融合求加持！", "已获难得利大暇满身，且见现世八法似稚嬉，由是一心成办久乐藏，如是诸友善哉唉嘛霍！我等虽能多闻与讲习，亦获开演百论之辩才，反观自心丝毫无长进，因无解证融合观修故。闻矣学矣解矣但尔许，无观察修所生猛利信，暇满、无常、厌离闻所生，仅伺察意终当消失故，于彼之后若不作引发，思所成之具量诸体验，前已消失后者未生间，多数行人渐成教油子。成恶习后虽闻道次第，以及具加持力师长语，亦难调伏心念转鄙陋，故当勤施深法免此过。此复由彼师长语加持，及自具量听闻所出生，闻所成之觉受如何妙，亦当郑重继生思所成。", "若谓如何生起思所成，即于彼彼随一所缘类，以诸犀利教理从各方，做观察修生起体验法。如立“师长即佛”为所修，次当数数运用犀利理，以求成立师长即是佛，即于引生此之定解法，再再努力修习谓“观修”。如是暇满、无常、出离心，发心、正见等诸所缘类，犀利观修生定解为主。如是观力所引思所成，纵然体验仅露其端倪，然亦免成教油子之险，坚固觉受基础将建立，故当学习善巧观修法。此从文殊师长语密出，唯是自宗别法观察修，余宗派中少分亦未说。于《菩提道次第广论》义，若细观察复作思惟者，观修原因、如何修法等，自宗殊胜别法获定解。单仅温习所缘忆念修，非是此中所谓观察修，此复心中默记诸文句，思惟其义亦非观察修。道之体性、次第、数量等，牢记心中回忆体如何，次第如何、数量又如何，亦忆念修非是观察修。当知观察修义如前说，立一所缘类成所修本，复次以诸生起定解法，甚深教理数数应观察。譬如我等于诸悦意色，因何而美数数思惟时，生起猛利贪欲、于贪境，做观察修故增现前贪。", "如是再再思惟某仇敌，如何于自做诸损害理，瞋恚渐增、此即于瞋境，做观察故瞋恚觉受盛。如是改弦易辙于善品，数数观察彼彼原因时，彼彼善心觉受即增长，一如先前贪欲、瞋恚理。修此等时教理何最利，尤其能令自心做转变，发起觉受最犀利之理，即应数数思惟反复修。不断思惟一种能立时，如闻母逝噩耗自心中，悲伤愈增感觉生起者，是达扼要之相再用功。数数思惟一种能立时，变成似熟悉者、自心中不生感动、此即未达要，亦是成教油子前兆故，猛利启请师长并积净，次修所缘行相求达要。或有未修亦于此等时，信心以及无常、出离等，忽然猛力生起时心念，生真证德心生大欢喜，稍后如前感觉全无时，以为退失而恼众所见。此乃暂时有限之现象，并非生起真实之证悟，是故生时不应起慢心，退时自亦不必起烦恼，然则此乃本尊与师长，加持相故当求令坚固。真觉受者是由辨别慧，数数修习信与无常等，体验依次生起乃比量，是故坚固不退非如前。此复从初依止知识法，乃至发心之间各所缘，最初但能了解“通达”修，复从依止知识法开始，至发心生“有励力觉受”，复次如前再修“无励力”，觉受生起妙法应了知。", "修时生起修即能生想，熟悉所缘名为“通达”相；尚需多种教理做思惟，如是能生觉受、不思时，不生此名“有励力觉受”；乃至思与不思无差别，何时思惟随即朗然起，此即“无励力之觉受”相，犹如自心生贪不需修，如是自心解与体验合，此时现起证悟之曙光。再者某些所缘易生起，仅七日许勤修即可生，或需数日数月方生起，或虽终年修习亦难生。例如“死亡决定”易生起，“死期不定”却极难生起，“死时除法余皆无益”理，极易生起其余悉如是。于易生者不需强拖延，生已即当改修次所缘，于难起者不做阻滞想，经年累月耽延需忍耐，乃至不生体验勤修习。前前所缘觉受已生者，以及后后有待生体验，除忆念修不需用其他，全力观修当前所缘类。第二章教诫依止善知识理之体验生起法如是观察修及修要诀，如何及修法等善示已，若谓最初做何观察修，以及如何具体修习法？当知总示三科、加行法，不需做观察修故最初，应从“依止知识法”开始。此复“依止利益”约七日，“不依倒依过患”一周许，若善思惟即可令心变。", "复次“根本修信”之一科，虽极重要生起却极难，滞留于此数月或数年，不应怯弱以为太长久，乃至心未转变一心修。此复若于每座修多科，恐成忆念修非观察修，故于每座但勤修一科。例如此段四科之第一，“师长是佛金刚持所许”，单立此项为所修目标，运用犀利能立之教理，乃至未生定解整座中，精进修习、今日如是修，明日修此、后天亦修此，本月修此、下月亦修此，如是未发体验持续修，体验生已转入次所缘。已生觉受忆念修即可，体验未起纵修次所缘，前者未起后者不生故，当于前者励力发体验。此节觉受生已当转入，“诸佛事业作者是师长”,于第二科如前勤修习。此科觉受生已再接修，“即于现在诸佛与菩萨，仍在利益有情”之一科。教理与师教授善配合，猛力观察修习如今日，明日、后日以及日、月、年，乃至未发体验持续修。引发体验见师实即佛，此较其余各科为最要，故当于此励力勤修习。此科觉受生已转次科，“自所见相无法决定”者，以观察修努力勤修习。如是修习力故于师长，真实见为诸佛之体性，自之师长与诸佛二者，感觉犹如和合为一时，即生依止知识法证悟。", "如是根本修信之四科，发体验已复于“念师恩”，四科依次修习生觉受。“加行令师喜”者可略思。第三章教诫令进程迅速修法奇特教授如是依师法中信与敬，各节科判觉受生起已，暇满开始乃至发心间，次虽应当依次发体验，然因依师法中“师即佛”，根本修信一科觉受者，不经长年观修难生起，为令觉受进程速疾故，修法奇特教授如是行：每日一座修习依师法，各科所缘修法均如前；一座自暇满起依次修。通过观察发起体验时，一则依师法之觉受增，二则暇满、无常、痛苦等，下、中士道体验依次生，依师法之一方究竟时，下、中觉受亦达高上位。如是若能旁求见观察，“三主要道”体验同时增，同时圆满道程极速疾。譬如核桃、杏与葡萄种，同时种植三者之树干，树枝、花叶亦将同时长，最终三者果实可同享。是故每日座或座之分，各各分为三段之一分，修习依止善知识之法；一分从暇满始至发心，依次转修各科生觉受；一分于甚深见勤观修。", "第四章于暇满生体验法如是分为三段修习时，依止善知识法如前修，自暇满始发起体验规：第一“认识暇满之体性”，当思“若生无暇将如何，目前未如是生堪庆幸”，非是空话、顾他当反观，现自具足以犀利观修，再再思惟定与相续合，如贫获宝感觉喜洋洋，即生认识“暇满”之证悟。复次接修“利大”所缘类，以诸甚深教理之观察，数数分析考察，若感觉，刹那无益虚度亦可惜，此时即生“利大”之觉受。复次转入“难得”所缘类，以诸猛利观察修习故，若觉纵然刹那之推延，亦如倾注金粉于水中，极感可惜对此难忍受，心中即生“难得”之证悟。第五章发起无常体验法复次接修“无常”所缘类，最初“不念死之六过患”，唯修七昼夜许即可生。“六种念死利益”约一周，修习定能令心做转变。复次“死决定”之三种因，彼之第一“死主决定来，无缘能令退却”之一科，无论持续数日或数月，亦当励力勤做观察修。该科体验生已转次科，“寿无可添不断减少”者，承接前科立为所应修，以观察修触动彼要害。如是觉受生已修次科，“生时亦无修法之闲暇”，于此道理勤做观察修。", "尤其修习“死相”一科者，乃是奇特无比念死诀，由此容易生起念无常。此复法会开示科判中，讲于修死九种因相后，修时在此间修为要诀。彼时以三因相决定死，当思死殁次第为何焉，修习令生恐惧战惊惊。依照拙著《劝念无常歌》，于其文义做诸观察修，再再思惟自身死情形，将生怖畏不复能安坐。如是修习死亡似现前，犹如降临自身极可畏，诸死殁相明了如现前，心惊胆战如是觉受出，即是生起“死决定”证量。复次“死无定期”根本中，第一因相“寿量不决定”，以观察修集中修此科，此时此刻死亡不降临，如是保证非有之道理，以观察修多方围绕修。忆念“死无定期”之教授，甚深秘密要义为如下：自身亲眼目睹或耳闻，有关他人猝死寿无定，死缘众多或正行走死，或正食时或正谈话死，或正言笑或正奔跑死，或正角力比试强弱死。此刻为人彼刻成尸体，此时存在彼时成乌有，此等本性数数应思惟。“我亦具足如是死本性，此时此刻不死岂能定？今夕不成尸身岂能定？今夕不做超荐岂能定？", "今夕不送尸林岂能定？”如是以犀利理做观察，自身何时纳入阎摩口，遭其獠牙噬咬不决定；又如自己为宿仇所囚，身陷囹圄弑期难预料，如是能念“不定”体验生。复次转入“死缘”所缘类，修习死缘众多活缘稀。若生觉受当修次所缘，“身命犹如水泡极脆弱”，以观察修励力勤思惟。如是死无定期三因相，于彼修法触及要害故，将念“此时不死难保证”，卧时将念“明晨能起否？”起时将念“今晚能卧否？”，去时将念“能返原地否？”返时将念“下次能去否？”，当念“明日后世何先至？”当念“糌粑与命何先尽？”，当念“茶叶与寿何先无？”当念“此刻不走难决定”，“无暇！无暇！”心生急迫感，如是即生“寿无定”觉受。念“死决定”虽稍容易生，“死无定期”之心难生起，不应考虑是否久耽延，数日、数月、数年当持续，乃至心未转变专注修。此科觉受生已改所缘，此复“死时除却正法外，亲友财物身体均无益”，此三因相经日、经月修，死时除法无益了知已，无需再修即生觉受量。此者易生不需长时修，体验生时即迁次所缘。第六章于恶趣苦生体验法复次说时修习恶趣苦，以及归依建立分别释，修时各各恶趣所缘类，其后接修归依为要诀。", "然于初发业者先别学，恶趣以及归依所缘类，体验端倪出已，将二者，合并为一如是极有效。是故最初先修三恶趣，第一大热地狱“等活”苦，此复当发体验想自身，现前生于该狱思诸苦，此刻现前降于自身上。若想“如是生者虽不妙，然此仅为想象故非真”，当思如是思惟虽非实，然自相续具有诸大力，能引“等活”造而未坏业，若遭触发转成具力“有”，决定堕入彼中毋庸疑。今但思惟尚起大恐惧，现前生于其中奈何之？当思如是痛苦能忍否？当思如是寿量能受否？如是已生相与决定生，二者轮流诚恳善修故，当下猛利希求救此苦，归依处及解脱方便等，心神惶恐茶饭亦不思，此等强烈感觉出现时，即是生起“恶趣苦”证量。如是“黑绳”“众合”与“号叫”，以及“大号叫”与“热”“极热”，并“无间”狱各别之痛苦，修法如前猛利而专一，精进修习生起诸觉受。复次四近边狱与八种，寒冷地狱修法均如前，非如观看远处景象般，当想自身现前生彼中，及决定生、彼时所受苦，长久猛利难忍之大苦，降于自身情形猛力修。由是极难忍苦令心惊，如前心生刺痛无食欲，希求救苦归依解脱法，猛力生起即此之证量。", "修习地狱苦之增进法：《念住经》中所说地狱类，当勤读诵彼苦差别状，绘成图像于彼善观察，应思“我舍此身后无间，亦具如是苦性奈何之？”数数忆念即成胜增进。复次感觉自身如现前，生于饿鬼类与畜生中，虽然目前此事未成真，然能引业心中多如藏，不久决定受生必无疑，当思彼时我将如何之。设想自身现前受生于，饿鬼类与犬、驴等畜生，或是虫蚁鸟兽等类中，思彼行住威仪何能忍？此处亦当诵读《念住经》，所说饿鬼、畜生之苦状。如是修故若思“于当下，若能闭恶趣门岂非善？现具关闭方便岂非善？”若能速速实施精进法，即是生起体验之标准，如同阿难二侄之故事。第七章学习归依如是三恶趣之诸痛苦，体验生已发起希求心，欲获能救此苦之归依，当思彼即三宝及功德。“可归依之四种因相”者，思惟一周即可令心转。复次思惟佛之身功德，以及语功德与意功德，事业功德略如《道次第》，广如二《庄严》与《宝性》等，诸大教典之中所说者，根据自心能力善修习。于三宝生不退转信心，猛力增长即此之证量。", "如是法功德与僧功德，略如《道次》广如诸大论，所说内容修习能观见，自宗大师、教法及随学，三宝功德、生起难劫夺，猛利信心此即觉受量。于此生体验已修次科，“了知三宝差别”之各节，发觉受故三宝相互间，能做明确区别即证量。生体验已接修次所缘，名为“由承许门归依量”：自思“师长佛为归依师，法宝即是真正之归依，僧伽乃是成办归依伴”，猛利至诚承许复心念：“无余归依大师助伴故，决定唯有三宝”即证量。生体验已转入次所缘，“不言有余之门而归依”：“唯我大师佛陀之教法，乃是求解脱者之津梁，由六别法之门而超胜；其余宗派大师及教法，苯波外道世间天神等，佛法之外其他师与教，由六别法之门而下劣。”善思惟故自宗之大师，彼之教法及随学三者，方堪归依余皆非归依，如是定解至诚而生起，由是希求归依余等心，少分亦不生起为证量。复次“归依功德”约七日，“归依学处”亦修一周许，可令心变如是当努力。归依所缘体验之发起，不需花费太久时间故，闻思诸大教典所说义，与修配合汇集三者行。三宝功德广大如虚空，亦如恒河沙数难计算，复如大海深邃难测度，窥见少分功德生信心，此福三界为器犹为小，是故于此努力切实修。", "第八章恶趣苦与归依诸别法合修法如是思惟三种恶趣苦，详念三宝功德之二者，各别觉受妥善发起时，次当合并此二而归依：依于何因而做归依者？即是怖畏恶趣苦折磨；及于能救此苦之三宝，发深忍信依此之二因，至心承许三宝为依怙，亲友、希冀处即归依体。倘若自身堕于恶趣中，不得归处归依亦不知，故应当下归依为最要。此复怙主寂天之善说，《入行论》中“睁大惊恐眼”，乃至“请速除怖畏”云云，如论所说应当善思惟。复次汇集彼等之别法，详广修法如下当实施：从自头顶师长之心间，放出归依全境住面前，自身周围六道有情绕，思已首先修习“等活”苦，觉受现前恐惧身战栗。“不需畏此、能救归依处，师长三宝面前空中住，彼等具有能力救此苦，是故我当至诚而启请，自他一切有情等活狱，其中痛苦当下愿救护。”如是想中多诵归依偈。如是“黑绳”“众合”“号叫”等，余热地狱及四近边狱，八寒冷狱、饿鬼、畜生等，分成各科各节依次序，修习各各痛苦、各节后，接做归依扼要甚稀有！如今归依计数人虽多，然于归依因与归依体，功德差别、承许、不说余，此等建立懵然皆不知，唯是口头空话重数量，如是计数岂成净归依？", "不能入于内道佛教门，如苦差般归依有何用？是故欲勤计数念归依，当于此间广修所缘类，如是精进方达彼扼要。本文《菩提道次第体验引导修法教授·通俗明了直指其要》者，是应巴康雪朵寺扎贡却珠仁波切致书请求，由恩德无比最胜依怙金刚持帕绷喀大乐藏吉祥贤，于事务极其繁忙之间隙忽然赐予。640掌中解脱菩提道次第二十四天教授附录四遥呼师长·速引三身无别师长加持之悲歌641遥呼师长·速引三身无别师长加持之悲歌帕绷喀大师造仁钦曲札译喇嘛钦！喇嘛钦！喇嘛钦！大乐法身诸佛智一味，此即一切恩师究竟体。至诚恳切祈祷师法身，三有愿皆不离悲摄受！智慧幻化具足七支佛，此即一切恩师幻化基。至诚恳切祈祷师报身，三有愿皆不离悲摄受！随所化类示现诸幻舞，此即一切恩师报身变。至诚恳切祈祷师化身，三有愿皆不离悲摄受！三身无别游戏现为师，此即一切恩师唯一体。至诚祈祷三身无别师，三有愿皆不离悲摄受！无量寂威本尊师为体，除此恩师别另无本尊。至诚祈祷普摄本尊师，三有愿皆不离悲摄受！诸佛合一总体现师相，除此恩师别另无诸佛。至诚祈祷普摄诸佛师，三有愿皆不离悲摄受！诸佛智悲力体现为师，圣三部主本即具恩师。至诚祈祷三部合一师，三有愿皆不离悲摄受！", "所放百五三部皆为师，收摄此等遍主亦是师。至诚祈祷诸部主宰师，三有愿皆不离悲摄受！佛陀正法僧伽作者师，普摄三宝即是具恩师。至诚祈祷普摄归处师，三有愿皆不离悲摄受！诸佛本体幻化现师相，慈悲摄受思之念恩师！诸佛无缘度化苦若我，示无谬道思之念恩师！抉择难得利大身利害，当取心要思之念恩师！忽尔死大怖畏降自顶，彷徨无措思之念恩师！现世圆满当下忽离去，孤独前往思之念恩师！自身赤裸堕于地狱火，至极难忍思之念恩师！饿鬼道中涓滴饮食无，苦亲领受思之念恩师！愚昧畜生丑陋缘分劣，苦亲领受思之念恩师！苦恼若我如今将堕彼，救护归处思之念恩师！业果如影随形精取舍，如法而行思之念恩师！无边三有如牢众苦源，解脱方便思之念恩师！可畏有海涡卷众苦母，堕落逼恼思之念恩师！三主要道二次深觉受，自相续中易生师加持！勇猛发起出离求解脱，精进修习三学师加持！", "增上心担自力度众生，精熟菩提心宝师加持！勇往广大菩萨行彼岸，一心随行佛海师加持！空与缘起显空互伴现，通达离边见顶师加持！基位三有转成三身道，生次觉受速生师加持！风心融入中脉四喜空，朗然现起幻身师加持！二取表皮蜕尽本面露，值遇胜义师尊师加持！灭二障戏大乐法身界，与师三密合一师加持！乃至菩提安住心不离，子继父业愿师悲加持！喇嘛钦！喇嘛钦！喇嘛钦！", "附录五策励自他一切人等痛念无常歌·心匙645策励自他一切人等痛念无常歌·心匙帕绷喀大师造仁钦曲札译呜呼哀哉具恩师，伏祈大悲做瞻视！苦恼若我众行径，一生自欺似无心。劝告自己衷心语，《心匙》心中当牢记，萦绕心髓不散乱，思惟自身之本性。无始生死至今生，已经无数生死轮，虽受种种乐与苦，然犹未办少分利。难得暇满昔虽获，皆未受益而虚掷，如今若能自爱者，当修善行久乐藏。貌似精明实愚痴，耽著童戏般现世，忽遭可畏阎摩逼，无计可施终将临。自念尚且不死故，忙于无尽现世业，可畏阎摩忽现前，宣布死期终将临。虽勤筹措明日事，即刻起程终将临，剩事残饮未竟业，无奈放舍终将临。铺衾而卧但今日，如朽木颓卧“末床”，无力翻身拈摸手，牵捉衣友终将临。除却今日难再穿，“末衣”内外遍裹缠，犹如石块渐僵硬，初见自尸终将临。", "“末语”遗嘱与愁叹，悲哀之中强欲言，舌根干故难达意，极灰心时终将临。“末食”圣物与舍利，伴诸流汁注口中，纵然一口难下咽，流出尸口终将临。洽心合意众亲友，悲悯苦恼围绕住，“末伴”哭泣伤别离，从今永决终将临。可怖幻象如浪涌，断肢节苦甚难忍，无可奈何苦痛中，此生相没终将临。善念提示极重要，是故师友兴大悲，虽于耳旁勤提醒，唯增沮丧终将临。喉间频发唏嘘声，呼吸渐短气壅滞。最后停止入断弦，今生完结终将临。百般珍惜悦意身，终成反胃腐烂尸，此身粗褥亦难忍，终置荒凉尸林地。此身芒刺亦难忍，终遭剁削骨肉碎。此身蚤虱亦难忍，终为鸟兽食殆尽。尸身虽以锦衣裹，终将置于焚化炉。此身爇香亦难忍，终被焚烧火蕴中。炽燃柴薪烧骨肉，收骨灰时终将临。此身厚衣亦难忍，终被埋于窄地坑。悦耳大名之前后，加“已故”语终将临。亲戚朋友与仆役，哭声四起终将临。", "衣帽家当散四方，无一剩余终将临。独往中有险关道，凄惨惆怅终将临。四大颠倒仇敌至，生大恐惧终将临。见处山崩断岩下，土雨压身奈何之？幻见趣入大海中，巨浪涡卷奈何之？闻似大火爆炸声，心耳俱裂奈何之？黑暴劫风包卷起，幻相可畏奈何之？大红业风紧驱迫，为暗吞没奈何之？阎摩使者绳索捆，惘然被牵奈何之？牛头蝎面众狱卒，百般折磨奈何之？死主阎摩法王前，算善恶帐奈何之？推诿生前贪瞋诈，阎摩揭穿奈何之？自罪异熟当惩罚，入阎摩狱奈何之？地狱烈火铁地上，自身裸卧奈何之？兵刃雨降身破碎，受而不死奈何之？烊铜锅煮骨肉烂，受犹不死奈何之？身火无二极炽燃，然犹不死奈何之？冰穴风袭身冻裂，成千百片奈何之？堕入饥渴饿鬼中，多年饥饿奈何之？若成劣缘愚傍生，互相啖食奈何之？极难忍受恶趣苦，真正临头奈何之？现应速速不放逸，当下精进正是时，不仅适宜恐迟故，应即速速提精神。具恩师父之口授，善慧佛陀论心要，显密全圆道修法，当于心中起实证。自他二利久乐藏，日日尽力求获取，试与阎摩做竞赛，三门合一勤修行！", "此《策励自他一切人等痛念无常歌·心匙》一文，是因离事专修者昂旺年札请求在先，布达拉宫四任管家索南衮嘎亦一再劝请，近来昂旺年札复作请求，由僭名帕绷喀活佛造于贡薄地区之楚·扎西德钦寺。愿众生利益增长！", "650掌中解脱菩提道次第二十四天教授附录六雍增·墀江仁波切造仁钦曲札译“平等舍”修法口传教授雍增·墀江仁波切造仁钦曲札译菩提心修法有两种：一、七因果；二、自他平等相换。这两种修心法的前行都含有“平等舍”修法，如《摄波罗蜜多论》中说：于诸有情心平等，起父母想饶益心，及以慈心调伏之。这里所讲的“平等舍”与“四无量”中的“平等舍”是不一样的。“四无量”中的“平等舍”，是由于发现众生因贪、瞋在生死中流浪，故而祈愿一切众生远离贪、瞋而住于“平等舍”。此处所讲的“平等舍”是修心，摆脱亲、疏与贪、瞋的控制，进而对一切有情生起平等心的“平等舍”。这种平等舍又有两种差别：“七因果”中“知母”的前行“平等舍”，仅是对仇敌、亲友、中庸三者遮除亲、疏与贪、瞋的“平等舍”，是一种与声闻乘共同的“平等舍”修法；“自他平等相换”前行的“自他平等”，就不单是上述的“平等舍”，而是一种在思想与行为方面为一切有情拔苦、予乐不分远近的平等心，是大乘不共的殊胜“平等舍”修法。修“知母”前行“平等舍”时，应设想我们面前有特别憎恶的仇敌、极为可爱的亲友与非敌非友的中庸三种有情。", "面对这三种人，我们分别会生起明显的悦意、不悦意与漠然这三种心。以仇敌为例，观察一下自己为什么会对他生起不舒服和不喜欢的心，将会察觉到：那是由于此人在今生曾伤害过我们。于是，应做如下思惟来破除瞋恚：“此人在过去多生之中曾作过我的父母和亲友，曾帮助我无数次。不仅如此，说不定在今生当中或死亡之前，也可能成为朋友来帮助我。不论如何，有一件事绝对可以确定，那就是在后世解脱生死之前无数次的受生中，此人将与过去一样，对我施行无数次的饶益。在过去、现在、未来三个时期，此人已为我、将为我成办无量的利益，像这样的至友，如果只以今生一时的少许伤害，就对这位‘敌人’生起瞋心而加以抛弃，我不就和凶残的野兽、非人没有两样了吗？所以，从今以后绝对不能生起这种恶念。”同样地，对亲友生起悦意与贪恋时也应该观察原因，如此便可发现这是因为他们在今生中成为我们的亲属，或在财物、饮食方面曾照顾过我们。随后就该做如下思惟来破除贪恋：“这位亲友在过去多生中曾是我的仇人，我们曾经彼此杀害无数次，吃对方的肉，喝对方的血；而且，在今生死亡之前，他也可能变成我的冤家，对我毫无利益可言；", "即便在今生中不曾伤害我，也难保在后世中我们不会成为仇敌而互相伤害。如果只因为目前稍有助于我，就对这位亲友过分贪恋，不正像贪著于魔女的诱惑或猪贪恋于猪倌一样？因此，我不应对所谓的至亲生起贪恋。”当我们对中庸的众有情生起漠然之心，应该想到：“此人目前虽然对我没有特别的利益和损害，看起来似乎与我毫无关系，事实不然，在许多生中，此人曾经是有助于我的朋友或亲人，将来也必定会如此，所以将此人抛弃是不合情理的。”简言之，我们应思惟过去、现在和未来三世因缘，对敌、友破除贪、瞋，修习使心平等的“平等舍”。修“自他平等相换”修心前行之“舍”时，必须对敌、友、中庸三者不分远近亲疏地给予喜乐，消除他们的痛苦，但如果不仔细思考其中的缘由，是不可能产生出这种平等的态度与行动的。这里分“观待世俗之能立”与“观待胜义之能立”两部分来讲。一、观待世俗之能立又分成“观待他人之能立”与“观待自身之能立”。", "（一）观待他人之能立又可细分为三因：1．纵然在梦中，自己也不愿有丝毫痛苦，对快乐又永不知足；同样地，所有的有情，包括微小的虫蚁在内，也都想要快乐、不愿受苦，所以对他们做取舍的分别并不合理。2．假设有十个乞丐前来乞食，由于他们都是来乞讨的，所以对他们的施食就不会有亲疏之分。同样地，一切有情缺乏快乐，不要说是无漏乐，就连些微的有漏乐也是少如晨星。正因为他们求乐的心相同，所以应该不分亲疏，而平等地为他们成办利乐。3．假如有一群痛苦的病人需要照顾，由于他们身受的苦痛一样，因此不应起贪瞋与取舍的分别，否则会有过失；同样地，一切有情都受烦恼三毒控制，全受到生死总别之苦，所以，对他们无法有取舍之别。“从有情的立场来看，这样的说法似乎言之成理，不过他们与我并没有多大关系，我又何必去承担那种责任呢？”这种念头一来，便应接着修。（二）观待自身之能立在此也可细分成三因来思惟：1．当知我们所求的解脱与一切相智，都必须依靠一切有情才能获得；不仅如此，无始以来的许多生中，一切有情都曾作过我的父母、朋友等亲人，并饶益我，所以，不应有敌、友等亲疏与取舍的分别。2．“虽然他们曾帮助过我，但也曾伤害过我啊？", "”有这种怀疑时，应当思惟：这些有情对我所做的伤害只是一时的，而直接与间接对我所做的利益却非常多，以我们现在的情况为例便可了知，因此，不应有亲疏与取舍的分别。3．不仅如此，由于我们已确定会死亡，而且死期不定，就像关在同一个牢狱的死囚，明日就要一起被处决，今晚还在做自他的分别和贪瞋的分别，实在是无聊之举。当自己、他人和一切有情都将落入无常鬼之口，还要做贪瞋与取舍的分别，完全无道理可言。二、观待胜义之能立此外，我们还必须思惟观待胜义之能立，在此也可细分成三因：1．称损害者为敌、称饶益者为友，这些都是错乱心安立与执著的结果。如果这个论点可以成立，那么，如来的一切智也应做这样的认可才是，为什么佛并没有将为他抹檀香膏的人视为亲友，也没有将用刀斧砍他的人视为仇敌，如《释量论》中说：于刀割香涂，观一切平等，说名为离贪。因此，所谓“敌友”的分类纯属自心错乱之相。2．我们通常将所谓的仇敌与亲友看成是永恒的、持久的。如果真是如此，怨敌与亲友应该不会有变化。事实不然！中士道修心中有一节是修“无定过患”，当依“父转为子母为妻”等引文所说，思惟敌友转变不定的情形。因此，过分执著敌友的观念做取舍的分别是没有道理的。", "3．《集学论》中说：自他唯观待，妄如此彼岸。彼岸自非彼，观谁而成此？我们看待问题往往有各自的角度。例如，对同一个人来讲，有人将他视为亲友，也有人将他视为仇敌，从而出现两种迥异的态度，就像此山与彼山是相对的。从胜义的角度来看，这种看法不能成立。所以，执著于一方，做贪瞋与取舍的分别是不合理的。", "在详细思考了上述九种因由之后，我们应当做出如下五种决定：一、如上所述，不论我们是以世俗的理由还是以胜义的理由思惟，对有情心生贪瞋与分别，且做出取舍，是根本站不住脚的；不单如此，这种贪瞋之心将成为现后、久暂千百种伤害与痛苦的根本，如同把我们关入生死牢狱不得解脱的狱卒，好似牵我们入地狱火中的索命鬼；仿佛让我们在梦中也不得安宁的毒瘤。因此，我们必须根除这样的恶心。相反地，为一切有情予乐、拔苦的平等心，对我们目前与将来都有极大的利益，而且是三世诸佛菩萨所履行和将履行的唯一之道，是诸佛菩萨一致公认的修持中心，当思：“不论那些有情是饶益我还是伤害我，我都应该尽最大的努力来断除贪瞋与亲疏之心，在予乐、拔苦的思想与行动上必须做到没有丝毫的分别！祈请师长本尊加持，使我有能力修持！”同时念诵《供养师长仪轨》中的颂文：痛苦虽微皆不欢，快乐纵多终不足，自他不二愿加持，见他受乐心欣喜！配合祈祷，决意成就平等心，无论在思想与行动上都愿意为一切有情予乐、拔苦。二、在思惟自他平等之后，再思惟我爱执的过患。当知：从造不善业受生无间狱，乃至于声闻、独觉、阿罗汉偏堕寂边，以及某些菩萨道行迟缓等现象都是我爱执造成的。", "换言之，生死、涅槃二者的所有过患，都是我爱执的习气所产生的。经多方思惟后，常念：“这个我爱执是产生现后、久暂一切伤害的根本，有如毒的种子一般，不将之根除，将永无安乐之时。因此，从现在开始，刹那都不应受此恶心的支配，祈请师长本尊加持，使我能断除我爱执！”同时念诵：观我爱执如重病，引发非爱众苦因，应当怨彼记恨彼，加持除此我执魔！配合祈祷，决意断除我爱执之恶念。三、其次应当思惟他爱执的功德。当知现世的快乐、名声，以及生死中天、人的快乐，直到成佛，生死、涅槃二者的一切幸福，都是仰仗他爱执的力量产生的。经多方思惟，当念：“这些有情是出生一切利乐的根本，基、道、果三阶段不可或缺的唯一亲友，不论对我施行何等伤害，都应当视他如师长佛陀、爱他如同如意宝般，刹那也不离弃，祈请师长本尊加持，使我能生起他爱执。”同时念诵：爱护诸母令享乐，视为无边功德门，纵使众生仇视我，爱彼如命愿加持！配合祈祷，决意将他爱执作为修持的中心。四、再三思惟我爱执的过患与他爱执的功德之后，便应当致力修持这两种爱执心的互换。那么，我们是否有能力做这种修持呢？", "当思：“过去大师佛陀与我一样在生死中流浪，然而，佛陀以爱他为重，因此自他二利都得圆满，终而成佛；我却因为只顾着成办自利，结果非但不能成就丝毫自利，更遑论利他，所以才会沦落到目前这种局面。”用这样的方式思惟两种爱执的功过，可以帮助我们修两种爱执的互换。此外，如果我们的心能熟习修持，就能把他人的身体当成自己的。如同称父母的精血为自己的身体而执为“我所”那样。思考了这些理由，便可明白我们是能够做到自他相换的。于是当念：“我能修也必修这个自他相换，祈请师长本尊加持，使我能修自他相换法门！”同时念诵：总之凡愚为自利，能仁专修利他行，了知功罪利害心，自他互易愿加持！配合祈祷，决意修持自他相换。五、将我爱执过患与他爱执功德二者放在一起思惟。例如：由于我爱执的关系，杀害其他有情，受生于地狱、寿命短促；因为他爱执的缘故，断除杀生，受生于善趣、获得长寿。这样不断地交替思惟十善业道的妙果与十不善业道的恶果等功过，最后认识到：“总之，我爱执是一切衰损的门径、他爱执是一切功德的基础，因此，在任何情况下，我都不应放弃自他相换，且应以它作为修持的中心，祈请师长本尊加持，使我具有这样的能力！", "”同时念诵：我爱执即众苦门，爱护众母为德本，故于自他互易行，修为心要愿加持！配合祈祷，决意对自他相换修法产生兴趣而修持。如果上述这些前行所缘的修习做得恰到好处，正行配合自他相换思惟的取舍所缘，便会自然地修到要点；反之，如果这些前行只是一些空洞言辞，在修正行取舍时，眼睛半睁半闭、装模作样地做修法状，到头来也不过是修些空话罢了。关于共与不共的正行所缘修法，应根据各种引导与师长的教授来修，在这里就不多写了。口说自他相换如诵咒，事关紧急胆大且妄为，师尊父母悉皆抛脑后，空具大乘者名我悲哀。", "附录七雍增·墀江仁波切造仁钦曲札译修心“取舍”所缘广略修法雍增·墀江仁波切造仁钦曲札译修心“取舍”所缘广修法：观我爱执恶心在内心成一黑团状，诸有情坐在自己面前，虽然体性上分属六道，但外表都现苦恼母亲之相。修“取”时，观想下至无间地狱，上至色、无色界有顶，八苦或三苦所摄之一切生死苦果呈黑气相，各别从六道依次取来；因业烦恼集之业集中有十不善、五无间、违犯三律仪学处等，烦恼集中有六根本烦恼、二十种随烦恼等烦恼及习气，这些也依次取来；声闻、独觉、菩萨相续中见道、修道之逆品，包括微细所知障在内的一切所断，也依次取来。所取来的一切均呈黑气相融入自心，将我爱执恶心碎为齑粉。母亲有情得以脱离苦与苦因，身体变成澄净光明之体。修“舍”时，舍身、受用、善根三者。第一，舍身时观自身变成无数或仅有一身均可，不需观成摩尼宝的形状、颜色等。想自身如同如意宝、能够变出一切想要的事物。施予外器世间，从地狱开始的一切不净器世间过患均得以清净，转成如净土一般；施予内情世间，恶趣有情之身由此转成善趣具七功德之暇满身，天、人等善趣有情之一切身粗重过患得以清净，转成相好庄严之身等。", "舍受用时，观想自身变成如意身，属于自己的食物、财产、房屋等，不属于自己的一切有主、无主受用等，如虚空藏出生一切所需资具，施予有情，一切母亲有情得以圆满世、出世间之一切顺缘。舍善根时，观想自相续中的三学、闻思修三慧、包括念诵一句陀罗尼以上的三世善根，呈白光相施予有情。一切有情由此在相续中顺易生起信等七圣财、四无量、六度、三十七菩提分、四续部道之证德等。", "此外，可观想将师长、佛、菩萨心相续中的断、证功德以及无量善资粮取来，因为他们不会将这些功德据为己有。将之施予有情，由此具足一切成佛因缘，当下即可成佛。此处如果想修“以果为道发心”之法，观想从资粮田主尊心间放出一个化身融入自己，于是自己转成释迦佛，放出与有情数量相同的光束、普照一切有情，于是有情都成佛，变成释迦佛之身，像“加行法”前行中所说的那样修。假如此处不修“以果为道”，则将上述的“当下即可成佛”改想成“均已成佛”。修上述“取舍”时，应从无间地狱开始依次修，包括三恶趣、人天、声闻、独觉、有学无学圣者、十地直至最后有菩萨。例如，观声闻、独觉、菩萨断除盖障而圆满二资粮成佛时，“取舍”之对象应分别与各自本分之程度相应。修心取舍所缘略修法：与《供养师长仪轨》中的“唯愿大悲师加持”等三次祈祷配合起来修，在面前观想所缘境诸有情呈苦恼母亲之相。做第一遍祈祷时，观一切母亲有情之苦呈黑气相从她们的右鼻孔中冒出，进入自己左鼻孔，攻击内心那个我爱执恶心黑团，它就像一小撮灰尘遭大水冲刷一样，变得荡然无存。这是取母亲有情相续之生死苦果。", "修“舍”时，观自己的这个暇满身变成如意身，放出白光，进入母亲有情的左鼻孔与她们融合，她们的所有身粗重过患得以清净、获得修法圆满之身——具足大乘四轮之暇满身。做第二遍祈祷时，观想诸有情相续中作为生死因之业，与八万四千烦恼等粗细业烦恼集呈黑烟相从右鼻孔冒出，经自己左鼻孔入内，同时变成霹雳、冰雹状，落到心中我爱执恶心黑团之上，如雷击石、碎为齑粉。此为取苦因诸集。修“舍”时，观想自己由前生布施所生善果呈白光相从右鼻孔出，变成所需受用，同时自己的食物、财产、房屋、书籍等一切受用也变成如虚空藏般，施予有情，由此一切修法顺缘无不具备，受用圆满等同梵天福报。做第三遍祈祷时，观想诸有情相续中的一切所知障呈黑气相从右鼻孔冒出，经自己左鼻孔入内，同时变成蜘蛛、蝎子、蛤蟆、蛇、虎、豹等凶残动物相，如兀鹰争食尸肉，将内心我爱执恶心那坨黑团啖食殆尽。修“舍”时，观想自相续中闻思修三慧、三学等过去已累积、未来将累积之所有善根，呈白光相放出右鼻孔，进入诸有情左鼻孔与他们融合，一切有情由此在相续中容易发起从恭敬善知识开始，直至无学双运的一切殊胜地道断证功德，从而成佛。", "简言之，“取”分三次：取生死苦果、取苦因业与烦恼障、取所知障；“舍”也分三次，舍自身、舍受用、舍善根，依次与三次祈祷合修。如果有兴趣也有时间，可修“取舍”乘风息之法：“取”时吸气；“舍”时呼气。上述所缘修法主要是针对苦恼有情，是普通的修法。如果要进一步缘清净地菩萨、有学无学声闻、凡圣菩萨等来修“取舍”，则应配合他们的断证程度等来修。以十地菩萨为例，可以观想自己的身、受用、善根变成利他的资具与供品、而做施舍，应像这样的做法懂得如何修相应的“取舍”所缘。修“舍”时，如果依上述所说观想霹雳、冰雹、蜘蛛、蝎子等相感到不舒服，可只观黑气之相。当师长示疾时，亦可观想将不净业感景象中的师长三密违缘取来，自身、受用、善根变成药物、供品等所需顺缘而供养之，师长的三密及事业由此得到增广，不费力地任运实现所有利益圣教、众生的心愿。依靠殊胜福田，我们将积集广大的福德资粮。由九因相之门修自他平等之“平等舍”修法，以及上述配合《供养师长仪轨》文句之“取舍”修法，是每日将“修心”法作为定课人士的心宝。不可将教授降格为讲说之法，当作商品来卖；像我这样法已成魔的做法不值得效仿。", "正如扎·贝珠仁波切所言：烦恼之火烧自心，喜说妙香散十方，具粗暴行之线香，日后愿令圣者喜。虽然自己是三毒的仆人，但想到这对信解修心法的后人在需要这些教授时会有很大的帮助，我墀江巴，将具恩师长的教授笔录成文。", "664掌中解脱菩提道次第二十四天教授附录八帕绷喀仁波切编仁钦曲札译大乘修心七义根本文帕绷喀仁波切编仁钦曲札译敬礼大悲！为显其法源清净故开示作者殊胜：甘露藏教授，金洲所传来。令于教授起敬重故开示其法殊胜：如金刚日树，文义等应知。五浊厚重时，转为菩提道。如何正以教授引导弟子之次第共有七义：一、开示加行基础法先学诸加行。二、正行修菩提心此中分二：有关胜义菩提心与世俗菩提心两种修法，古籍中大多先说胜义菩提心修法，本文根据自宗文殊怙主宗喀巴大师之轨矩，依照《修心日光》《善慧密意庄严》《甘露藏》、格邬仓《根本文句》等诸论样式，依殊胜密意，将胜义菩提心置于后述。是故先说修世俗菩提心：众过归于一，思众皆有恩。取舍间杂修，先从自身取，复令乘风息，境毒三善根。", "结行略教授，于彼策念故，威仪尽诵持。修胜义菩提心者：获坚固示密，思诸法如梦，观心亦无生，对治自然解，道体住赖耶，座间士如幻。三、转恶缘为菩提道罪满情器时，恶缘转觉道，遇缘即修习，四行胜方便。四、开示一生修持之总纲摄教授心要，应修五种力。大乘迁识法，五力重威仪。五、开示修心纯熟之量诸法归一要，二证取其主，常怀欢喜心，纯熟量为倒，五大纯熟相，散乱亦能主。六、开示修心三昧耶常学三总义，心改身如故，勿说缺支节，莫思他人事，先治重烦恼，不求于果报，莫啖杂毒食，不可讲情义，勿作世诤骂，勿俟于狭路，不可刺其心，莫推诿他人，莫作经忏用，众利勿争先，天莫变成魔，乐莫求他苦。一贯众瑜伽，一除诸障难，初后修二事，二境皆安忍，舍命护二戒，勤学三难事，取三主要因，修三不退失，具三不舍离，于境无偏党，周遍且深透，特殊尤常修，不待众缘备，今当修主要，远离六颠倒，莫轻尝便舍，斩绝专修习，观察令解脱，不思有所恃，气量勿狭小，莫须臾便舍，勿著于声誉。最后以“于菩提心获自信颂”作为结束：我因多信解，轻苦与恶名，获伏我执教，今死亦无憾！", "新、旧噶当派文集中虽有大量《修心七义》根本文句与注疏等，然正文次第互不相同、文句多寡参差不齐。或与引导科判不相吻合，或有非属通行之文句等，情形不一。有鉴于此，长时以来拟编写一根本文，按照符合自宗文殊怙主宗喀巴大师语教传统之诸论，即《修心日光》《善慧密意庄严》《甘露藏》等之密意编排。后于木亥年（1935）昌都甘丹强巴林寺讲《菩提道次第广论》时，由一心专修者朗忍巴·彭措贝丹献礼劝请，于是细察多种本释编成此根本文句，另以科判庄严合成一文，僭名帕绷喀活佛书，愿众生利益增长！", "附录九雍增·墀江仁波切造仁钦曲札译670掌中解脱菩提道次第二十四天教授《入中论》礼赞中：“悲性于佛广大果，初犹种子长如水，常时受用若成熟，故我先赞大悲心。”梵文amṛta，文中加粗楷体为《大乘修心七义根本文》原文。汉译《杂宝藏经》（T04，no.203）卷1，《慈童女缘》。汉译《大方便佛报恩经》（T03，no.156）卷2。汉译《大方广佛华严经》（T10，no.279）。汉译《大宝积经》（T11，no.301）卷58，《文殊师利授记会》。汉译《宝行王正论》：“愿彼所作恶，于我果报熟，是我所行善，于彼果报熟。”（T32，no.1656，p.504c23-25）汉译《大乘庄严经论》（T31，no.1604）。汉译《瑜伽师地论》（T30，no.1579）卷35，《本地分中菩萨地第十五》。引自《入行论·静虑品》，全颂为“若人欲速疾，救护自与他，当修上密诀，名自他相换。”许叶片亦能除病，喻此法能除我爱执，文义等应知。五浊厚重时难入正道，于此时节，以修心法为伴侣故，恶缘无法扰动，能将恶缘转为菩提道。", "如何正以教授引导弟子之次第共有七义：一、开示加行基础法先学诸加行，即思惟暇满、利大、难得、死无常、恶趣苦、归依、业果与生死苦等。二、正行修菩提心若详细思惟，将知有、寂一切皆是发心助缘，观待生死本性，能策发“汝应发心”之念；观待声缘堕寂静边之理，亦激励发心。须发心的原因之一是：一切有情皆为死无常所遍覆，而且如《四百论》中所说：是故无常者，一切转为苦。生死之处、身、受用等一切，皆具无常与苦之自性故，思惟三界众生之苦状而发心。又思惟众生皆随业烦恼转、于烦恼品缘起中连续流转之理而发心。此中分二：有关胜义菩提心与世俗菩提心两种修法。因利根所化串习空性之关系，古籍中大多先说胜义菩提心修法，本文根据自宗文殊怙主宗喀巴大师之轨矩，仿照《修心日光》《善慧密意庄严》《甘露藏》、格邬仓《根本文句》等诸论样式，依殊胜密意置于后述，是故先说修世俗菩提心：初应修自他平等，其修法出处为《集学论》所说之自他平等串习已，菩提心者当坚固。", "所谓“自他平等”者，并非自他二者在无我方面平等，生死中受苦平等，或求乐、不欲苦平等，乃是指对其他有情亦能生起珍爱自己之心。其修法请参阅余论。复次，如格西夏博岗巴所说：若未能视自如仇之前，师长等任何人均不能利益之；若能视自如仇，方能生起一切利益。故应众过归于一，亦即如《入行论》中所说：尽世所有苦，皆从自利生。以及：世间诸灾害，所有怖畏苦，悉从我执生，留此魔何益？荡巴云：苦乐二报非关他，根源在己定日瓦。《修心利器轮》中说：由此我获敌，亦捕隐藏贼，扮我欺诳者，是我执无疑。毒、兵刃、诤讼、疾病、人与非人损害、三恶趣苦等，一切皆依我爱执生。龙猛《菩提心释》云：于有情离贪，如毒行应离，声闻离贪故，仅获劣菩提，不舍有情故，获圆满菩提。诸声闻众误入下劣道亦是我爱执之过。总之，如《入行论》所说此何须繁说，凡愚作自利，能仁行利他，观此二差别。", "认定我爱执为一切衰损之根本。该论又云：尽世所有乐，悉从利他生。诸有情是出生现前与究竟一切善资粮之大库藏，犹似如意宝，亦如良田及乳汁无尽之牝牛，恩德极大，故应珍视。然如《入行论》所说：有情与诸佛，同能生佛法，若是敬信佛，何不敬有情？我等现在虽于佛像前献供敬礼，发离苦求乐之愿，祈祷相续中生起地道功德，然却轻弃作为息苦生乐之因，与出生大乘地道果之因的有情。见此轻视极为错误已，于诸有情思众皆有恩。其他有情之苦及苦因我悉取之，我之身、受用、善根等皆舍予有情，取舍间杂修。若念他人痛苦无害于我，故毋需除之，如是则年少时不应积财养老；若念相续各异故不同者，则自己不需除母亲之苦；若念母恩大故不同者，当知一切有情皆是具恩母亲，此外且有手不应除足病之过；若念彼是一聚合故不同者，当知所谓聚合是多刹那与多支分积聚而成，无独立之聚合；若念自己重要故不能舍离者，当知无始以来虽为成办自利，然悉无所成且堕于生死百般衰损之泥沼中。《入行论》云：若不能真换，自乐及他苦，非仅不成佛，生死亦无乐。心力弱者最初将自己下午之苦于上午取之等，先从自身取而做修心，若串习者，次于亲友、中庸、仇敌等依次增修，最终能取遍虚空众生之苦；", "复令取舍乘来去之风息。依悦意、不悦意、中庸三境生起三毒时，决断为有情之三毒，而发起愿诸有情远离三毒之三善根。结行略教授，于彼策念故，口诵“愿彼等罪熟我身，我所有善熟于他”等，及“众生所有苦”等取舍之启请文，且如《华严经·净行品》中所说，配合威仪瑜伽，威仪尽诵持。修胜义菩提心者：方便分获坚固之后，示密胜义菩提心修法；所取外境之所摄诸法，唯于心中如是显现，此外无微尘许实有，是故思诸法如梦；能取内心之所摄诸法亦无自性有，故尔观心于胜义中亦无生；不仅有法能所二取所摄之诸法，即使法性本身亦应抉择为无实，是故对治自然解；通达空性能得涅槃，若未通达则不能消灭生死，且能生起生死因果，是故空性为有、寂一切之根本“赖耶”，而且从空性能现起一切缘起故，道体住赖耶；座间士如幻——如幻分二种：胜义谛如幻，可言有而非实有；虽显而空、现相如幻，此中依后者修。三、转恶缘为菩提道此中分二：略示和广说。初者，于不善之增上果：天龙争斗、黑品增长、疾病灾荒、动乱斗诤等内外一切中断现起时，以及种种罪果充满情器时，应以此法将逆缘、顺缘与中断转修道助伴，能害者转为善知识，将此等纷乱恶缘转觉道。", "金洲云：恶缘善劝请，魔鬼佛神变，病苦罪扫帚，苦法性显现。《入行论》云：又苦诸功德，谓以厌除慢，悲愍生死者，羞恶而喜善。第二广说分二：依意乐发心转变与依加行积净转变。初者，境、时与苦、乐、好、恶等，遇缘即修习为一切皆善，亦即如喀切班钦所说：苦乐回向善资粮，利乐虚空愿充满，若苦承担一切苦，痛苦大海愿枯竭。", "嘉瓦扬贡巴云：种种苦不幸，堪布身中尽。余处亦如是：富不可喜贫可喜，富者积护痛苦大，贫者苦行佛法成，佛徒心向乞丐身；赞不可喜谤可喜，赞者我慢傲心生，谤者自过全显露；乐不可喜苦可喜，乐者烦恼五毒盛，苦者昔造恶业尽。苦是师长之大悲，苦为安乐必经道，彼若无者乐亦无；苦为悉地之桥梁，能令证德广增上。此视安乐非庄严、视痛苦为庄严与功德之法，非说除此大乘修心时外，即不需重视，此在三士道修法中均极重要。因为最初学下士道时，于现在未死前之乐视为过失，舍弃现世，重视归依与业果之取舍，视积资净障等修法苦行中所受之苦为庄严，甘之如饴，生起希求后世之心；学共中士道时，了知后世虽或能得善趣天人身与富乐圆满，然亦是有漏乐，不可保信，终会转变，重又聚集苦因与引发痛苦，由是心生厌离，视一切生死乐为过失，如呕吐患者见食，以希求解脱之心，视三学修持苦行之苦为庄严而非负担，以消灭集苦生死；学上士道时犹为重要，众所周知不须赘言。总之，若不视乐为过失，则不能解脱生死与恶趣，若不为法受苦即不能获得解脱；若不见希求自乐为过患，则不能生起利他之心；若不受苦行精进之苦，则六度行之修持不能究竟。", "第二：四行胜方便——一切善根回向菩提因等积集资粮，清净妨碍道于相续中生起之违缘罪堕，念魔碍之恩德悲愍施放朵玛，于诸护法托付增长发心之事业，由此等门增长修心之修持。", "四、开示一生修持之总纲摄教授心要，应修五种力——心不随我执、贪、瞋等转者为牵引力，不离修心意乐者为串习力，令发心不坏且增长故积集资粮者为白法种子力，思我爱执过患而断除者为破坏力，愿诸善根为发心不坏及增长之因为发愿力。又有大乘迁识法——一切财产施予会众者为白法种子力，于身不贪者为牵引力，念烦恼过失者为破坏力，愿不离发心为发愿力，相续修习发心者为串习力；五力重忆念佛之行传，做狮子卧姿等威仪。五、开示修心纯熟之量佛说诸法归于对治我爱执与我执之一要；他人之证明与自己问心无愧之二证取其主；贫富苦乐皆一味故常怀欢喜心；心纯熟量为与前不同，能将我爱执之心颠倒；具有能忍众苦之大苦行者，珍爱他人之大菩萨，不违越法行之大沙门，羞犯微细罪堕之大持律师，纯熟大乘正道之大瑜伽师，是为五大纯熟相；且如善巧马术者，能应付突发事件，散乱亦能主。六、开示（十八种）修心三昧耶常学：1．修心不违承许之戒；2．不流于怪诞；3．不堕偏党之三总义；4．以前之意乐心改而身威仪不须修饰如故；5．勿说他过缺支节；6．莫观察及思他人过失事；7．依对治先治重三毒烦恼；8．修习修心，不求于生死快乐与自利菩提等果报；", "9．莫啖为驱鬼而做修心等、与八法之心混杂及搀杂我爱执动机的如毒之食；10．不可讲情义——不于烦恼做对治而放逸懈怠，及于仇敌长期怀恨；11．勿作世间说他人过失与驳斥之诤骂；12．勿俟于他人有难时之狭路；13．不可当庭广众斥责对方，揭发过失而治罚之，及以猛咒逼迫天魔等而刺其心；14．莫以欺诈方便推诿过失于他人；15．莫为驱鬼消灾而将修心等作经忏用；16．众利与功劳等勿争先；17．天莫变成修心不成为我爱执对治反成其助伴之魔；18．莫为自乐故令他人受苦或希望他人生苦，即乐莫求他苦。七、开示（二十二种）修心学处1．以此修心修持作印定之一，贯彻于衣食住行等一切威仪之众瑜伽；2．妙缘、恶缘与烦恼等随生何者，唯以修心对治即可，亦即一除诸障难；3．一切善加行最初须发心、最后须回向菩提，故初后修二事；4．于苦乐二境皆安忍，不失修心之修持；5．舍命护佛法总三昧耶与修心十八三昧耶之二戒；6．勤学初念烦恼对治难、中退烦恼生起难、后断烦恼相续难之三难事；7．取值遇贤妙师长、自心堪能、衣食顺缘具足之三主要因；8．修敬信师长、欢喜修心、防护三门不退失之三不退失；", "9．具身不离敬礼旋绕等业、语不离祈祷念诵、意不离发心之三不舍离；10．于修心之境无敌、亲、中庸三者之偏党；11．修心之修持着重周遍于一切境及一切事、且非唯口说之深透；12．于家眷、仇人、恩将仇报者、因宿业自然不喜见者，及父母等五类难修之境较难修心故，应专门分别而修，亦即特殊尤常修之修心；13．不待衣食顺缘等众缘备方做修心；14．后世较今生重要，修心较其他修持重要故，今当修主要；15．远离不能忍修法苦行而忍俗务苦行之安忍颠倒、不尝法味而尝世俗味之味著颠倒、对有罪者不起悲心而于正法行者起悲心之悲心颠倒、于弟子等不教授佛法而授以现世学问之求心颠倒、不希求正法而希求世间之欲心颠倒、不随喜善而随喜恶之随喜颠倒等六颠倒；16．于修持莫时修时辍、轻尝便舍；17．斩绝专修习至究竟；18．观察令断疑解脱；19．为利有情做修心故，饶益他人时不思有所恃；20．气量勿应有于他人微少损害亦忿恨等之狭小；21．随逐苦乐如夏季天空须臾变化，随时舍弃修持，如是之莫须臾便舍；22．于修持勿著于功绩与名闻等声誉；最后以（格西切喀瓦大师所说）“于菩提心获自信颂”作为结束：我因多胜解，轻苦与恶名，获伏我执教，今死亦无憾！", "新、旧噶当派文集中虽有大量《修心七义》根本文句与注疏等，然正文次第互不相同、文句多寡参差不齐。或与引导科判不相吻合，或有非属通行之文句等，情形不一。有鉴于此，长时以来拟编写一根本文，按照符合自宗文殊怙主宗喀巴大师语教传统之诸论，即《修心日光》《善慧密意庄严》《甘露藏》等之密意编排。后于木亥年（1935）在昌都甘丹强巴林寺讲《菩提道次第广论》时，由一心专修者朗忍巴·彭措贝丹献礼劝请，于是细察多种本释编成此根本文句，另以科判庄严合成一文，僭名帕绷喀活佛书，愿众生利益增长！", "680掌中解脱菩提道次第二十四天教授依菩提道次第明晰引导坦途与捷径垂赐经验引导修法科判·至尊师长口授依菩提道次第明晰引导坦途与捷径垂赐经验引导修法科判·至尊师长口授以大恭敬顶礼、归依于至尊师长正士具无缘大悲者足下，愿一切时中大悲摄受！菩提道次第引导分四：甲一、为显其法根源净故开示造者殊胜；甲二、令于教授起敬理故开示其法殊胜；甲三、如何闻说具二殊胜法之理；甲四、如何正以教授引导弟子之次第。甲一、为显其法根源净故开示造者殊胜，分三：乙一、圆满种姓中受生之理；乙二、其身获得功德之理；乙三、获已于圣教所作事业之理。乙三、获已于圣教所作事业之理，分二：丙一、于印度所作之理；丙二、于藏地所作之理。甲二、令于教授起敬理故开示其法殊胜，分四：乙一、通达一切圣教无违殊胜；乙二、一切圣言现为教授殊胜；乙三、易获佛陀密意殊胜；乙四、极大恶行自趣消灭殊胜。甲三、如何闻说具二种殊胜法之理，分三：乙一、听法之理；乙二、说法之理；乙三、结束时如何共作之次第，善根圆满回向菩提。乙一、听法之理，分三：丙一、思惟闻法利益；丙二、于法与法师发起承事；丙三、正听闻之理。丙三、正听闻之理，分二：丁一、断除违缘器之三过；", "丁二、依止顺缘六种想。乙二、说法之理，分四：丁一、思惟说法利益；丁二、于大师与法发起承事；丁三、以何等意乐及加行而说；丁四、于何等境应说与不应说之差别。甲四、如何正以教授引导弟子之次第，分二：乙一、道之根本依止知识法；乙二、既依止已如何修心之次第。", "乙一、道之根本依止知识法，分二：丙一、座上如何修之理；丙二、座间如何修之理。丙一、座上如何修之理，分三：丁一、加行法；丁二、如何修正行；丁三、如何作结行之次第。丁一、加行法，分六。丁二、如何修正行，分四：戊一、依止知识利益；戊二、不依止与不如法依止之过患；戊三、意乐依止法；戊四、加行依止法。戊一、依止知识利益，分八：己一、近得佛位；己二、令诸佛欢喜；己三、魔与恶友不能加害；己四、一切烦恼恶行自然遮止；己五、地道诸德辗转增长；己六、一切生中不缺离善知识；己七、不堕恶趣；己八、无难成办现前与究竟一切利益。戊二、八种不依止过患与上述相反，八种不如法依止过患者：己一、若轻毁师长即轻毁诸佛；己二、若于师长生瞋，即坏与彼剎那数相等劫之善根，并经等量劫生于地狱；己三、虽依咒乘亦不得殊胜成就；己四、虽勤修续义亦与修地狱相似；己五、功德未生不生，已生退失；己六、此生中为病等不如意事缠绕；己七、后世漂流于无边恶趣；己八、一切生中匮乏善知识。戊二、意乐依止法，分二：己一、根本修信；己二、念恩生敬。己一、根本修信，分三庚一、应观师为佛之原因；庚二、能观之原因；庚三、如何观法。", "庚三、如何观法，分四：辛一、师长是佛乃金刚持所许；辛二、师长是一切佛事业之作者；辛三、即于现在诸佛菩萨仍在利益有情；辛四、自所见相无法决定。己二、念恩生敬，分四：庚一、师恩胜佛；庚二、说法恩；庚三、加持心相续恩；庚四、以财物摄受为眷属恩。戊四、加行依止法，分三：己一、供献财物；己二、恭敬承事；己三、依教奉行。", "以下一切所缘类中，每一所缘类除正行修法外，加行、正行、结行三者及座间如何修法等，均照前类推。乙二、既依止已如何修心之次第，分二：丙一、于有暇身劝取心要；丙二、如何正取心要之理。丙一、于有暇身劝取心要，分三：丁一、认明暇满；丁二、思惟利大；丁三、思惟难得。丙二、如何正取心要之理，分三：丁一、于共下士道次第修心；丁二、于共中士道次第修心；丁三、于上士道次第修心。丁一、于共下士道第次修心，分二：戊一、发生希求后世之心；戊二、依止后世安乐方便。戊一、发生希求后世之心，分二：己一、此世不能久住而念死；己二、思惟后世二趣苦乐如何。己一、此世不能久住而念死，分三：庚一、不念死之过患；庚二、念死之胜利；庚三、正念死之理。庚一、不念死之过患，分六：辛一、不念正法过患；辛二、虽念不修过患；辛三、虽修不净过患；辛四、修不殷重过患；辛五、自谋不善过患；辛六、临终时将追悔而死过患。庚二、念死之胜利，分六：辛一、利大利益；辛二、力大利益；辛三、最初重要利益；辛四、中间重要利益；辛五、最后重要利益；辛六、临终时欢喜而死利益。庚三、正念死之理，分二：辛一、修习死亡九种因相；辛二、修习死相。", "辛一、修习死亡九种因相，分三：壬一、思惟死决定；壬二、思惟死期无定；壬三、思惟死时除正法外余皆无益。壬一、思惟死决定，分三：癸一、死主决定当至，无缘能令退却；癸二、寿数无可添益，不断减损；癸三、于生时亦无闲暇修法而死。", "壬二、思惟死期无定，分三：癸一、总瞻部洲人，别于浊世，死期无定；癸二、死缘极多，活缘微少，故死期无定；癸三、身极脆弱，故死期无定。壬三、思惟死时除正法外余皆无益，分三：癸一、财物无益；癸二、亲友无益；癸三、身亦无益。己二、思惟后世二趣苦乐如何，分三：庚一、思地狱苦；庚二、思饿鬼苦；庚三、思旁生苦。庚一、思地狱苦，分四：辛一、思大有情地狱或热地狱苦；辛二、思近边地狱苦；辛三、思寒冷地狱苦；辛四、思独一地狱苦。庚二、思饿鬼苦，分三：辛一、思饥渴苦；辛二、思疲畏苦；辛三、思寒热苦。庚三、思旁生苦，分五：辛一、思互相吞噉苦；辛二、思愚痴苦；辛三、思寒热苦；辛四、思饥渴苦；辛五、思役使苦。戊二、依止后世安乐方便，分二：己一、趣入圣教最胜之门修净归依；己二、于一切安乐根本业果发深忍信。己一、趣入圣教最胜之门修净归依，分五：庚一、依何因归依；庚二、归依何境；庚三、归依量为几何；庚四、归依利益；庚五、归依学处。庚二、归依何境，分二：辛一、正说认明归依境；辛二、可归依此之原因。庚三、归依量为几何，分四：辛一、由知功德之门归依；辛二、由知差别之门归依；辛三、由承许之门归依；辛四、由不言有余之门归依。", "庚四、归依利益，分八：辛一、入内道佛子数；辛二、为一切律仪之基础；辛三、灭尽往昔所集诸业障；辛四、顺易累积广大福德；辛五、人与非人不能为害；辛六、不堕恶趣；辛七、无劳成就现前与究竟诸事；辛八、速疾成佛。", "庚五、归依学处，分二：辛一、各别学处；辛二、共同学处。辛一、各别学处，分二：壬一、应遮学处；壬二、应修学处。辛二、共同学处，分六：壬一、由念三宝功德之门再再归依；壬二、由念恩之门嚼啖之先应作供养；壬三、安置他有情于归依；壬四、由念利益之门昼三次夜三次归依；壬五、随作何事皆倚仗三宝；壬六、下至戏笑乃至命难亦不舍三宝。己二、于一切安乐根本业果发深忍信，分三：庚一、思惟业果总相；庚二、思惟业果别相；庚三、思业果已如何进退之理。庚一、思总业果，分二：辛一、正明思惟总相；辛二、分别思惟。辛一、正明总思，分四：壬一、业决定理；壬二、业增长广大；壬三、不遇未造业；壬四、已造业不失。辛二、分别思惟，分三：壬一、思黑业果；壬二、思白业果；壬三、附带开示具力业门。壬一、思黑业果，分三：癸一、正明黑业道；癸二、轻重差别；癸三、示彼等之果。癸三、示彼等之果，分三：子一、异熟果；子二、等流果；子三、增上果。壬二、思白业果，分二：癸一、正明白业道；癸二、示彼等之果。庚二、思惟业果别相，分三：辛一、异熟功德；辛二、异熟作用；辛三、修异熟因。以上于共下士道次第修心之理科判说讫。", "丁二、于共中士道次第修心，分二：戊一、发起求解脱心；戊二、抉择趣解脱道自性。戊一、发起求解脱心，分二：己一、思惟生死总苦；己二、思惟生死别苦。", "己一、思惟生死总苦，分六：庚一、无定过患；庚二、无饱足过患；庚三、数数舍身过患；庚四、数数结身过患；庚五、数数高下过患；庚六、无伴过患。己二、思惟生死别苦，分二：庚一、思恶趣苦；庚二、思善趣苦。庚二、思善趣苦，分三：辛一、思惟人苦；辛二、思惟非天苦；辛三、思惟天苦。辛一、思惟人苦，分八：壬一、思惟生苦；壬二、思惟老苦；壬三、思惟病苦；壬四、思惟死苦；壬五、思爱别离苦；壬六、思怨憎会苦；壬七、思求不得苦。戊二、抉择趣解脱道自性，分二：己一、思惟集谛生死流转次第；己二、抉择能趣解脱道性。己一、思惟集谛生死流转次第，分三：庚一、烦恼发生之理；庚二、烦恼集业之理；庚三、死殁及结生之理。庚一、烦恼发生之理，分四：辛一、认明烦恼；辛二、烦恼如何生起之次第；辛三、烦恼之因；辛四、烦恼之过。庚三、死殁及结生之理，分三：辛一、死如何发生之理；辛二、死后成办中有之理；辛三、于生有受生之理。己二、抉择能趣解脱道性，分二：庚一、以何等身灭除生死；庚二、修何等道灭除生死。于共中士道次第修心之理科判说讫。丁三、于上士道次第修心，分三：戊一、显示入大乘门唯是发心及其利益；戊二、发菩提心之理；戊三、既发心已学行之理。", "戊一、显示入大乘门唯是发心及其利益，分十：己一、显示入大乘门唯是发心；己二、获佛子名；己三、映蔽声闻；己四、成就最胜福田；己五、易圆满资粮；己六、速净罪障；己七、成就所愿；己八、损害与中断不侵；己九、速疾圆满一切地道；己十、成就出生众生无余安乐之良田。", "戊二、发菩提心之理，分二：己一、正明修菩提心次第；己二、以仪轨受持发心。己一、正明修菩提心次第，分二：庚一、由七因果之门修心法；庚二、由自他相换之门修心法。庚一、由七因果之门修心法，分八：辛一、修平等舍；辛二、知母；辛三、念恩；辛四、报恩；辛五、悦意慈；辛六、悲心；辛七、增上意乐；辛八、正修发心。庚二、由自他相换之门修心法，分五：辛一、自他平等；辛二、由众多门思 ubaocdn.com/s/M2mGMrBbi6", "https://aka.doubaocdn.com/s/Xn1T7txsJz", "https://aka.doubaocdn.com/s/b8rtoffRrQ"]};
const READY = {};
for(const k in ONLINE_AUDIO){ READY[k] = ONLINE_AUDIO[k].length; }
async function loadData(){ return true; }

/* ===== 状态 ===== */
const state = {
  ch: 0,        // 章索引
  seg: 0,       // 段索引
  playing: false,
  audio: null,
  autoNext: false,
  fontSize: "font-m"
};
const LS_KEY = "zjyj_reader_v1";
function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({ch:state.ch, seg:state.seg, auto:state.autoNext, fs:state.fontSize}));
  }catch(e){}
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s){
      if(s.ch !== undefined && BOOK[s.ch]) state.ch = Math.min(s.ch, BOOK.length-1);
      if(s.seg !== undefined) state.seg = s.seg;
      state.autoNext = !!s.auto;
      state.fontSize = s.fs || "font-m";
    }
  }catch(e){}
}

/* ===== 工具 ===== */
function segAudioPath(ch, seg){
  const key = String(ch+1);
  const urls = ONLINE_AUDIO[key];
  if(urls && urls[seg]) return urls[seg];
  return "";
}
function segReady(chIdx, segIdx){
  const key = String(chIdx+1);
  const urls = ONLINE_AUDIO[key];
  return !!(urls && urls[segIdx]);
}
function fmt(t){
  if(!isFinite(t) || t<0) t=0;
  const s = Math.floor(t%60), m = Math.floor(t/60);
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

/* ===== 渲染 ===== */
function chapterSubtitle(chIdx){
  const s = BOOK[chIdx].segs[0] || "";
  const m = s.match(/^([^（。]{2,20}?)（/);
  if(m) return m[1];
  return "";
}
function render(){
  const ch = BOOK[state.ch];
  document.getElementById("chTitle").textContent = ch.c;
  document.getElementById("chSub").textContent = chapterSubtitle(state.ch);
  const ready = segReady(state.ch, state.seg);
  document.getElementById("segProgress").textContent =
    "第 " + (state.seg+1) + " 段 · 共 " + ch.segs.length + " 段" + (ready ? "" : "（音频制作中，可先阅读）");
  const bt = document.getElementById("bodyText");
  bt.innerHTML = "";
  const parts = ch.segs[state.seg].split("（");
  if(parts.length>1 && parts[0]){
    bt.textContent = parts[0];
    const note = document.createElement("span");
    note.className = "note";
    note.textContent = "（" + parts.slice(1).join("（");
    bt.appendChild(note);
  }else{
    bt.textContent = ch.segs[state.seg];
  }
  bt.classList.toggle("playing", state.playing);
  document.body.className = state.fontSize;
  updatePlayerUI();
  document.getElementById("main").scrollTop = 0;
  renderList();
}
function updatePlayerUI(){
  const playing = state.playing;
  const ready = segReady(state.ch, state.seg);
  const pb = document.getElementById("btnPlay");
  pb.classList.toggle("pending", !ready);
  const ico = document.getElementById("playIco");
  ico.innerHTML = playing
    ? '<path d="M7 5h4v14H7V5zm6 0h4v14h-4V5z"/>'
    : '<path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/>';
  document.getElementById("btnPrev").disabled = state.seg === 0;
  document.getElementById("btnNext").disabled = state.seg >= BOOK[state.ch].segs.length-1;
  document.getElementById("chkAuto").checked = state.autoNext;
  document.querySelector('[data-for="chkAuto"]').classList.toggle("on", state.autoNext);
  // 时间与进度
  const a = state.audio;
  if(a && playing){
    document.getElementById("fill").style.width = (a.currentTime/a.duration*100)+"%";
    document.getElementById("time").textContent = fmt(a.currentTime)+" / "+fmt(a.duration);
  }else{
    document.getElementById("time").textContent = "00:00 / 00:00";
    if(!playing) document.getElementById("fill").style.width = "0%";
  }
}

/* ===== 音频控制 ===== */
function ensureAudio(){
  if(!state.audio){
    state.audio = new Audio();
    state.audio.preload = "auto";
    state.audio.addEventListener("timeupdate", () => updatePlayerUI());
    state.audio.addEventListener("ended", onEnded);
    state.audio.addEventListener("play", () => { state.playing = true; render(); });
    state.audio.addEventListener("pause", () => { state.playing = false; updatePlayerUI(); });
    state.audio.addEventListener("error", () => {
      state.playing = false;
      updatePlayerUI();
      showToast("音频加载失败");
    });
  }
}
function playSeg(){
  if(!segReady(state.ch, state.seg)){ showToast("本节音频制作中，暂不能朗读"); return; }
  ensureAudio();
  if(state.playing){
    state.audio.pause();
    state.playing = false;
    updatePlayerUI();
    return;
  }
  state.audio.src = segAudioPath(state.ch, state.seg);
  state.audio.currentTime = 0;
  state.audio.play().then(()=>{
    state.playing = true;
    document.getElementById("bodyText").classList.add("playing");
    updatePlayerUI();
  }).catch(()=>{ showToast("无法播放，请检查音频文件"); });
}
function onEnded(){
  state.playing = false;
  if(state.autoNext){
    nextSeg(true);
  }else{
    updatePlayerUI();
  }
}
function goSeg(delta, keepPlaying){
  const ch = BOOK[state.ch];
  let s = state.seg + delta;
  if(s < 0) s = 0;
  if(s >= ch.segs.length) s = ch.segs.length-1;
  if(s === state.seg && !keepPlaying) return;
  const wasPlaying = state.playing;
  if(state.audio){ try{ state.audio.pause(); }catch(e){} }
  state.playing = false;
  state.seg = s;
  saveState();
  render();
  if(keepPlaying || wasPlaying && keepPlaying){
    playSeg();
  }
}
function nextSeg(keepPlaying){ goSeg(1, keepPlaying); }
function prevSeg(){ goSeg(-1, false); }

/* ===== 目录 ===== */
function renderList(){
  const list = document.getElementById("chList");
  if(!list) return;
  list.innerHTML = "";
  BOOK.forEach((ch, i) => {
    const item = document.createElement("button");
    item.className = "ch-item" + (i===state.ch ? " current" : "");
    const n = READY[String(i+1)];
    const readyAll = n && n >= ch.segs.length;
    item.innerHTML =
      '<span class="no">第' + String(i+1).padStart(2,"0") + '天</span>' +
      '<span class="nm">' + ch.c + '</span>' +
      '<span class="cnt">' + (n ? n + "/" + ch.segs.length : ch.segs.length) + '</span>' +
      '<span class="state ' + (readyAll ? "" : "pending") + '"></span>';
    item.addEventListener("click", () => {
      if(i === state.ch){ closeDrawer(); return; }
      if(state.audio){ try{ state.audio.pause(); }catch(e){} }
      state.playing = false;
      state.ch = i; state.seg = 0;
      saveState();
      render();
      closeDrawer();
    });
    list.appendChild(item);
  });
}
function openDrawer(){ document.getElementById("drawer").classList.add("open"); }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); }

/* ===== toast ===== */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ===== 事件 ===== */
document.getElementById("btnDrawer").addEventListener("click", openDrawer);
document.getElementById("btnClose").addEventListener("click", closeDrawer);
document.getElementById("drawerMask").addEventListener("click", closeDrawer);
document.getElementById("btnPlay").addEventListener("click", playSeg);
document.getElementById("btnPrev").addEventListener("click", prevSeg);
document.getElementById("btnNext").addEventListener("click", () => nextSeg(false));
document.getElementById("chkAuto").addEventListener("change", (e) => {
  state.autoNext = e.target.checked;
  saveState();
  updatePlayerUI();
});
const FONTS = ["font-s","font-m","font-l"];
document.getElementById("btnFont").addEventListener("click", () => {
  const i = (FONTS.indexOf(state.fontSize)+1) % FONTS.length;
  state.fontSize = FONTS[i];
  document.body.className = state.fontSize;
  saveState();
});
document.getElementById("bar").addEventListener("click", (e) => {
  if(!state.audio || !state.playing) return;
  const r = e.currentTarget.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
  state.audio.currentTime = ratio * state.audio.duration;
});
// 左右轻扫翻段
let touchX = null;
document.getElementById("main").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, {passive:true});
document.getElementById("main").addEventListener("touchend", (e) => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 70){
    if(dx < 0) nextSeg(false);
    else prevSeg();
  }
  touchX = null;
}, {passive:true});

/* ===== 启动 ===== */
(async function init(){
  const ok = await loadData();
  if(!ok) return;
  loadState();
  render();
  document.getElementById("chkAuto").checked = state.autoNext;
  document.querySelector('[data-for="chkAuto"]').classList.toggle("on", state.autoNext);
  document.body.className = state.fontSize;
})();
</script>
</body>
