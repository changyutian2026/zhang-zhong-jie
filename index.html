亲便出主意说：“儿子，在辩论时，你既要展示你的丰富知识，也要以骂人为武器。那些沙门怕犯戒便会默然，这样大家就会以为他们输了。”劫比罗言听计从，后来在与众比丘辩论的时候，他佯作很不耐烦的样子，说道：“象头！你懂什么是法，什么是非法？”同样地，他又称其他人为“马头”“骆驼头”“驴头”“牛头”“猴头”“狮头”和“虎头”等共十八种，所以他在此生受生为有十八个头的摩羯鱼。诋毁凡夫僧伽也是不可以的，因为四人以上的凡夫僧伽与圣僧伽无别，如前已述。所以，如称他们为老朽，即无异于嘲弄弥勒与文殊。轻视现在和自己一样的僧众，与嘴里念诵“归依僧”是背道而驰的。我的大宝师长说：“当僧众在大殿里的座位上面对面就地而坐时，应相互以对方为归依境。否则的话，你也许会对全场的僧众评头论足。”例如，在你往上首方向看的时候，心里或许会想：“座首的某某老喇嘛为人十分悭吝，坐在他下面的那家伙比他更坏、脾气特别大，再下面的某某……哎呀！在这些人当中，找不到比我更好的人了！”“归依僧”这句话，本意为归依十方一切僧伽，而不是一部分。", "但如果我们是那样想的话，这句归依文则应改成“归依僧，但不包括某某和某某”。所以，应如杰·贡却岩拉（宝支）所说：遇见贤友圣僧时，念为修道护送者。无论遇到凡夫僧伽还是圣僧伽，我们都应该把他们看作如同在险地遇到的救生员，对此要有这种认识。在修顺品增长时，观想菩萨众的菩提心和六度行、声闻、独觉的十二头陀功德与增上三学、勇士勇女的乐空智、护法众的四种事业等，均成甘露相注入自他有情。计数广修归依时，甘露降净应分三个步骤来做：初“略示”，次“广说”，最后“结义”。例如，归依师长时，先观五部师长同时降甘露光明等为“略示”；随后详观五部的各部作甘露降净为“广说”；最后又观五部师长同时降甘露光明等为“结义”。如果每一种观想用念珠各诵一圈的话，则共计七圈。以下各类照此类推。归依佛中可细分为四续部和显教殊胜化身五种；归依法中可细分为声闻、独觉、大乘共同道，下续部事、行、瑜伽续和上续部无上瑜伽续五种；归依僧中可细分为菩萨、声闻、独觉、勇士空行和护法五种。此外，仪轨中虽未明言，但根据规矩，此处应加诵“归依师长本尊三宝”等，并观甘露降净。观甘露降净是密教轨，观光明降净是显教轨，据说有此区别。", "甘露降净有三种观法：一、从光筒中降下；二、缠绕光明而降；三、如大雨倾注。发心其次诵“归依发心偈”，前二句的“归依”修法如前。“我以所修施等诸资粮”等后二句为“发心”，诵时心想：“我依靠布施等‘舍’所生善根之力，持戒等‘护’所生善根之力以及安忍等‘修’所生善根之力，为利一切有情当获佛位。”这些发心所缘行相下面将会详述，这里就不多说了。“归依”好比是归顺于国王的统治，而“发心”就好像是向国王交纳赋税。此处应修“以果为道发心”之法，具体做法是：观想从师长释迦佛身中，分出第二个与他一样的师长释迦佛，融入自身，于是自己成佛，体性为释迦佛。从自身中放出无数的释迦佛融入众有情，于是一切有情也都成佛，体性也为释迦佛。然后修喜，心想：“我发心将一切有情安置于佛地的愿望终于实现了！”这个“以果为道发心”修法的功德，与密法中的“胜曼荼罗王”修法相同，功德也近似。除此之外，还具有“根绝生死”“净六道处”等义，是含有殊胜深要的修法。", "然后修“四无量”，首先反思：“我这样将一切有情置于佛地，充其量不过是一种想象而已，实际上自己并无这样的能力，这到底是由什么原因造成的呢？”其次当想：“原因是，因我贪著自方、瞋恨他方。所以，如果我能安住于对一切有情没有贪瞋的平等舍中该有多好啊……”这样子来修“四无量”。关于“四无量”的所缘行相，下面会详细讲述。仪轨的文句中，每一种“四无量”都各具四无量：“岂不善哉”为“欲无量”；“愿其安住”为“愿无量”；“我令具足”为“增上意乐无量”；“唯愿师长本尊加持能如是行”为“祈祷无量”。口传中有这一说法。次发“殊胜心”，即“尤其为利益母亲有情故……”，这与前面所说的“四无量”二种，并不是另做发心之法，而是使发心力量增长的教授。修“平等舍”时，我们当如父母发生争吵的孩子，心想：“为了将一切有情安置于没有贪瞋的大平等舍中，我应成佛！”同样地，“慈”是想：“为了将热地狱中的有情安置于清凉的快乐中，直至为了将一切有情安置于圆满菩提的快乐中，我应成佛！”“悲”是想：“为了使有情脱离地狱之苦以及微细所知障之苦，我应成佛！”这些修法中也各自包含有三士道修法。", "有人或许会想：在未做下士道修心之前，为何先修发心等法呢？当知在此“菩提道次第”中，我们并不是修真正的下士道和中士道，它们只是作为发大乘心的基础来修的，所以从一开始就应以该心摄持，就像登山者计划以登上山顶为目的，然后从山脚开始起步；或如画佛像时，先要划梵线等规定尺寸，然后再着手开始画那样。两个“速”字中的第一个“速”字，是指较波罗蜜乘为速的、在一生中成佛；第二个“速”字，是指较此更速的、在浊世短暂一生中成佛。前者为下三部的速疾特点，后者为无上部的速疾特点。或者可以解释为：第一个“速”字，是指依靠无上部在浊世短暂的一生中成佛，是无上部总的特点，为萨迦、格鲁、宁玛等各派所共有；后一个“速”字，是指更为迅速的、仅在十二年内成佛。如果我们按照甘丹耳传教授来修，视“师长瑜伽”为道的生命那样重要，并合修“集密”“胜乐”“大威德”三大本尊的话，便可有此成就。仲巴达浦巴的口传中说：除了因为修行者本身的原因修不成外，在宗喀巴大师的耳传教规中，如果能修像以前至尊密勒日巴和嘉瓦·果仓巴那样苦行的话，成佛当不迟于三年！", "可作此语例证的，如温萨巴父子等许多格鲁派“教授传承”的祖师，他们不需要特别地吃苦，便能在即生抵达佛地。“文殊口授”派归依境以上所说为“捷径派”归依境的情况。《文殊口授》“中传派”中，除“资粮田”外，未说“归依境”观法。“南传派”中，除“资粮田”外，提到另一种与前不同的“归依境”，可以肯定是一种不同的耳传口授。其具体观法是：面前有一朵从地面往上生长的美丽虹云，云中有许多盛开的莲花。中央最大的莲花上观释迦佛。在佛的左右臂处，各观一朵莲花，弥勒、文殊安住其上。此二师背后，深广传承众师长，一位接着一位，成环圈状围绕释迦佛，二派的最后一位师长毗邻而住，观想这些师长也都坐在莲花上。释迦佛前方稍低之处，观结过法缘的众师长。在此不需观修行加持派。上方虚空虹云之中及众师长左右观诸佛；其下观菩萨、声闻、独觉；再下面观护法。在结有法缘的众师长下面，观三朵杂色莲花：中央莲花日垫上，观上士法主“速作智慧怙主”；右边莲月之上，观中士法主“毗沙门”；左边莲日之上，观下士法主“事业阎摩”。", "立此三尊为“三士法主”的原因是：“速作智慧怙主”是一切佛悲心体性“观自在”的化现，若依之为护法，修上士道时极有助于我们迅速生起悲心；中士道时，应以修习三学、特别是以修习戒学为主，而四大天王之一的“毗沙门”过去曾在大师前立誓，保护三藏中的律藏和三学中的戒学，所以若依之为护法，对心中生起这些道是极有帮助的；“法王阎摩”为一切众生开示无常以及善恶业果的差别，所以若依之为护法，修无常、业果等下士道时，这些证德便容易在我们心中生起。护法配合行道之法便是如此。至尊文殊曾授予宗喀巴大师关于师长本尊等如何与行道配合、以便速疾成佛之法，像这样的深密教授虽然无量无边，但在此不便明言。左右侧众护法和这些“三士法主”应处于同一高度。归依所缘行相前面已说，后面还将讲述。（帕绷喀大师说，在此应该加上吉祥萨迦派的教授，作“归依祈祷”：“敬礼归依师长本尊，伏请加持我之相续！”）132掌中解脱菩提道次第二十四天教授"]}, {"c": "第五天", "segs": ["加行法之二（第四、五加行）吉祥圣龙猛曾说：金宝盘除粪，斯为是大痴；为人而造罪，实为极蠢儿。（帕绷喀大师首先引用经教，略述纠正动机之法。然后请大家在听法之前，认真地检查自己的动机和威仪。又像前几天一样，大师重述了“所闻之法即是有缘之士能往佛地的大乘法范”及科判等内容。）第四大科“如何正以教授引导弟子之次第”，分两部分。第一部分为“依止善知识之理”，其加行法共有六种。此处我们按照《捷径明晰引导》的规矩，将“六加行法”放在前面讲，前三种加行昨天已讲完了。第四加行：观想资粮田宗喀巴大师说：故于听闻不能持文，思惟不能解义，修习相续不生，慧力至极微劣之时，依福田力，是要教授！由于我们被厚重的业障所压伏，致使听闻而不能记住文句，思惟而不能理解文义，修习而相续中不生证悟。在此穷途末路之际，如果我们向殊胜田祈祷和积福、净障的话，这些困难便能迅速得到解决。宗喀巴大师曾请问至尊文殊道：“为了迅速在相续中生起证悟，应该致力于哪些方法？”文殊回答说：“视师长与本尊无别而祈祷；", "努力积福、净障；修所缘行相为近取因，应将这三件事合起来加以努力！”如果我们自以为是地勤修所缘行相、而不以积福净障来成熟相续和以祈祷来获取加持的话，证悟的生起将是极其缓慢的。如果相续成熟的话，我们便能毫无困难地迅速生起证悟。过失成熟，如同脓包成熟容易穿漏；功德成熟，犹如果实成熟自然坠地可以受用。宗喀巴大师为了教导我们，以身作则在沃喀却隆修顶礼与供养曼荼罗等广大积净之法，从而感得圣五父子现身，出现佛护以《中观根本颂佛护释》梵箧加持的景象。是日，宗喀巴大师生起想看《佛护释》之念，当阅至第十八品时，大师示现通达中观应成派无垢正见之相。大师以前曾读过这部释论多次，但此番因为相续成熟，方显示出通达相。像这样的先德事例有许多。以我们这一法流的一位祖师——杰·格桑丹增（贤劫持教）为例：有一天，他应邀去塔波仲巴庄园做佛事，于是请杰·格桑克珠（贤劫智成）挑选一部经书准备带去念诵。格桑克珠交给他一部《噶当选集》，当他一看到书中的《修心吟修金刚歌》时，便在心中油然生起了无造作的菩提心。据说当他次日修加行法做祈祷的时候，在念到该金刚歌作者名号“悲悯摄受众生具善师”的地方时，额头出现一种明显的热烘烘的感觉。", "因此像这样当相续成熟时，即便依靠一种微小的外缘，我们也能很容易地突然生起证悟！格西铎巴也说：若能兼修积集资粮，净治罪障，祈祷本尊与师长，并克勤殷重思惟，虽觉百年亦不能生者，然诸有为法不安住故，终当生起。", "又如先贤教授口传中所说：“若不积福则如无润之种。”积福、净罪与祈祷之事是极其重要的。在寺院中，出家人除辩论之外，也要在大殿和讲经院里做许多念诵，道理也就在于此。所以我们出家人对此应当努力地去做。积福、净罪和祈祷所依靠的对象是资粮田，因为修资粮田十分重要，所以在此单另分出一科来修。“资粮田”一词的训诂，为“积集资粮之田地”。正如世人对能有很好收成的良田极为爱惜一样，在此我们也应认真地观想积福、净障及祈祷所依靠的大力之田。我们在世俗田地中播下一升或一握种子，其收成不会超过一斗；但我们在资粮田中，即便播下少许的种子，也会产生无量广大之果。对世俗田地来说，除了特定的下种时间外，其他时节是无法耕种的；而此资粮田则不然，我们能一年四季连续不断地在资粮田中播种善乐的种子。所以，如果我们不在这样的田地中种植福德种子的话，那是件极其可惜的事。宗喀巴大师说：如是能生若现若后一切善乐最胜福田，于其四季一切时中，常恒无间堪种一切善乐种子。复应于此，如经说云：“当以信犁耕耘福田。”若未能作，至极堪惜。又说：于最胜田尚不见如庸俗之田，此是我等无贤善相。既然观想资粮田如此重要，那么我们应该怎样来观呢？", "每种“加行法”中各有一种不同的资粮田观法，所以这里先按《捷径》来讲。生起资粮田之前，需收摄前面所说的归依境，而仪轨中对此未做说明。这是什么缘故呢？因为收摄法有三种不同的教授，为便于行者选择，所以未说。这三种教授是：一、观归依境化黄光融入自己眉间；二、观归依境化空，盖上无所缘的印记；三、观归依境升入空中，等到下面观完资粮田后，与所召请的智慧尊一起融入。此外，这些教授在仪轨中隐而未说，也是因为需要师长口传的缘故。", "加持地基观资粮田的第一步是加持地基。在我们念诵“一切地基愿清净”时，不要去想自己正处在像狭小寝室那样的地方，而应该像《净土庄严经》中所说的那样，观想地基极为宽广，如同广阔的平原高低均匀。黄金地基上，以吠琉璃宝绘成网格纹，或观吠琉璃地基上，以黄金绘成网格纹。这种地基的质地十分神奇：压之下陷，举之复原，触之能生乐感。宝树遍布地基各处，种种变化之鸟安栖于树上发出法音，浴池之中金沙铺地，周边有宝山环绕等等。“砾石”是指水边的砂砾和卵石；“瓦片”是指破碎的陶器碎片，在印度，人们常将旧的陶瓷器皿扔在户外，致使地上布满了陶片；“险处”是指悬崖绝壁。应观大地之上没有这些弊端存在。加持供品其次应当加持供品。即使实际陈设的供品只有七碗净水和一枝香，但在观想中，我们可以想象大供养云充满整个虚空和地基，就像圣普贤的供养云一样。这样的话，我们便能积集如观想那般大量的资粮。如《大方广经》中说：“水供为主水供伞”，观想水供现为伞、盖、幢等之相（帕绷喀大师说熏香、灯、涂香、馔食等也应这样配合起来观想）。如馔食等不便观想者，可以观在光明网中间。《供养云陀罗尼》有两种效用：一为加持供品之咒；二为奉献供品之咒。", "据说若诵此咒的话，即便我们实际供养的东西很少，但也会在诸佛菩萨面前降下极大的供养雨。次诵“谛力颂”，在念到“愿如是成就”时，想象的供品便如自己心量的大小而变为现实。", "观资粮田关于正观资粮田的方法，《捷径》中提到两种，一为此“明晰引导”本身的资粮田观想法；一为《供养师长仪轨》资粮田观想法。这里采用《供养师长仪轨》资粮田是有深义的，因为此殊胜教授出自《甘丹变化经函》，嘉瓦温萨巴和大成就者却吉多杰（法金刚）等先德均依此“三重萨埵师长瑜伽”即生获得双运之位。“乐空无别”等颂文之意为：自心乐空无二智所了相现为虚空之相，从虚空中生起资粮田。这样修的目的，旨在视一切相为乐空智的游戏。这里面有许多如何配合“欸旺”之义对乐空智引发定解、以及乐空智所了相如何现为本尊的甚深解说，但因为本次法会中有许多听众尚未获得灌顶，而且现在也不是讲密法的时候，所以暂且只说那么多。不管怎样，我们应在面前空中密布普贤供养云的中央观资粮田。观宝地基中央有一大乳海，乳海之内有一棵七宝所成的满愿树：树根为金；树干为银；树枝为吠琉璃；树叶为水晶；树梗为冰珠；鲜花为红珍珠；果实为石精。或者观根等七支均由七宝所成。此树如同如意摩尼宝，只要意想一下便能满足一切需求。树叶等被风吹动时，能发出演说无常、无我等“四法印”之声。满愿树中央有一朵硕大无比的鲜花，花上有一个八大狮子擎举的宝座。", "实际上，这些狮子是诸大菩萨为恭敬佛陀等缘故而化现的。狮子能威镇一切野兽，表佛陀威光映蔽魔罗、世间天神以及外道邪众。如果狮子数量为八，表“八自在”，如为四，则表“四无畏”。", "宝座之上有十一层莲花，从下往上层层逐渐缩小。最上面那层莲花共有四瓣，中央莲花蕊上置有日垫，系火晶摩尼宝所成；其上置有月垫，系水晶摩尼宝所成，形状像两个没有柄的圆鼓重叠。莲花出于淤泥而不染，表不染生死过失的“出离心”；太阳能使一切未成熟的农作物成熟，表“胜义菩提心”，能成熟相续；月亮能除毒热，其光鲜白，表“世俗菩提心”，能除瞋恚热恼且体性洁白。以莲、日、月为座垫，表上座者掌握这些“主要道”：莲花表下、中士道；日、月表上士道。观想主尊在莲、日、月三层座垫之上，当观《供养师长仪轨》资粮田主尊。至于主尊究竟是谁，则众说纷纭：有人说是宗喀巴大师，有人说是自己的根本师长，也有人说是“杰喇嘛却巴”。实际上，主尊应称为“师长善慧能仁金刚持”。这里的“师长”是指自己的师长；“善慧”是指宗喀巴大师；“能仁”是指大师释迦牟尼；“金刚持”是指胜者金刚持。此四尊体性无别，即是此处所观的资粮田主尊。那么，这是否意味着将四位有不同相续的人想成和合为一体呢？当然不是，相续不同的四位怎么可能合为一体？他们本来就是同一体性，而我们却执意认为是不同的相续，对此我们当依教依理在心中引发成立为同一体性的定解。", "虽然这四尊实际上是同一体性，但我们却以为：青蓝色身、手持铃杵、具报身相的“金刚持”完全不同于光头、赤足、具化身相的“释迦牟尼”。但事实上并非如此，佛陀在讲《毗奈耶》和修多罗（显经）时，现殊胜化身相；说怛特罗（密续）时，现金刚持相。例如，佛陀在讲《集密续》时，现为三面六臂金刚持相；讲《胜乐续》时，现为四面十二臂嘿汝嘎相等。虽然配合不同的经续显现成无量不同的身相，而实际上都是同一位释迦牟尼。所以说，“金刚持”和“释迦牟尼”是同一体性而非不同的相续。释迦牟尼本人已在完成其度化事业之后示现涅槃，但以后仍在圣地印度化现为班智达和成就者的身相为众生说法；在藏地前弘期中，佛化现为“堪布”“阿阇梨”等身相为众生说法；在藏地后弘期中，佛化现为阿底峡尊者、宗喀巴大师等众多智者成就师之身相为众生说法。因此，宗喀巴大师的体性也就是释迦牟尼。佛陀自己说过，在未来五浊极盛的时代，他——能仁金刚持——将化现为师长相而来。对此诸位可能会想：“那么，现在能饶益我的能仁金刚持的化身究竟是谁呢？”不是别人，就是你的师长！《等虚空续》说：众生皆有五佛性，犹如舞师及图画，皆称大乐唯一性，一性示现多态舞。", "此颂有多种解释法，有配合“身远离”来讲的，有配合“依止善知识法”来讲的等等。此处若配合“依止善知识法”来讲的话，譬如“跳神”时，一位演员身着“黑帽装”出场，观众们便说“黑帽来了”，而实际上是演员假扮的。那人退场后，换上“法王”的面具重新出场，观众们又说“这是法王”，但实际上仍是那个演员。正如同一个演员穿上不同的服饰便有了不同的称谓；是同一位胜者金刚持化现为释迦牟尼、宗喀巴大师与自己师长之相。所以，他们除了外表不相同外，实为同一体性。获得这样的定解之后，所观资粮田主尊当立名为“师长善慧能仁金刚持”。", "不仅如此，我们也应定解师长为总摄一切诸佛智慧为一的体性，如仪轨颂文中所说：“一切诸佛为体性”。在下面的“依止善知识法”中，我将会对此做出详细的解释。如果我们对此未能妥善理解的话，再怎么修所谓“甚深”的师长瑜伽，也不过是徒有其名而已。《菩提道次第广论》中所说：著名之师长瑜伽教授亦应如前所说而知，仅修一、二座所缘全无所至。所谓“三恩”者，显教中是指赐予学处、经教和引导三者；密法中是指授予灌项、密续讲解和教授三者。如果我们从某位师长那里获得此三者全部，即应称该师为“具足三恩”师长。主尊外表身相为宗喀巴大师。大师现比丘相，身着袈裟，“袈裟”为鸭黄色出家服装。宗喀巴大师右手结说法印，左手结定印、捧持充满甘露之钵。双手的大拇指与食指捏持优波罗花茎，花瓣在两耳旁开放。右侧花上为智慧剑，剑尖有小团火焰燃烧；左侧花上为《般若八千颂》，能自动发声诵经，或者也可以特别观想自己正在做闻、思、修的某部经论。大师身披郁金花色三法衣，郁金花有浅黄、红黄和红三种颜色，分别为祖衣、上衣和下衣之色，大师头戴黄色尖顶班智达高帽。", "这里面有许多表义，但因为时间不够，现在无法细讲，请大家自己去阅读一下《喜足天众引导》和《供养师长仪轨引导》这两种书。宗喀巴大师心间观释迦佛，释迦佛心间观胜者金刚持，金刚持心间观“三摩地萨埵”蓝色吽字。他们不是四件层层迭套的器皿，而是为我们显示出：师长的外相虽然是普通比丘，但内相却是释迦牟尼佛，所以在宗喀巴心间安置释迦佛；密相是胜者金刚持，所以在释迦佛心间安置金刚持。有人认为“师长三重萨埵”就是这三尊，但正确的理解应是：前二尊为“三昧耶萨埵”，胜者金刚持为“智慧萨埵”，心间“吽”字为“三摩地萨埵”。此“三重萨埵”修法中具有殊胜的密法深要，但在此不便解说。师长足结金刚跏趺而坐。观修师长五蕴为五如来等，是《集密根本续》中略说而《释续金刚鬘》中广解的“集密身曼荼罗”教授。如果我们想广修的话，就应按“集密身曼荼罗”原样，观各尊为三面六臂。如果观力不及的话，可按照瑜伽续中所说，观为一面二臂。从头顶到发际之间，观师长色蕴体性“毗卢遮那”；发际至喉间，观师长想蕴体性“无量寿”等。观五蕴五如来在身体中央如主心木状，下面一尊的顶髻刚好碰到上面一尊的莲花座。观四界四佛母与五佛中的四尊相对而坐。", "观眼等六处，加上筋脉、关节，为“地藏”等八菩萨，其中筋脉体性为“弥勒”，置于头顶，“普贤”置于八大关节处。至于观色等五境为五金刚女，颂文中虽未明说，但当如“集密身曼荼罗”，观为与各自对应的男性菩萨相互拥抱之相。这里的“罗汉”并不是指声闻、独觉阿罗汉，而是指大乘阿罗汉，亦即佛陀圣者。另观（主尊全身）每一毛孔中有一佛刹，有的佛刹中，佛在降魔；有的佛刹中，佛在转法轮等，化现无量十二种事业游戏，此即师长身中映现一切世界之意。在某一观自在密续中说：本尊每一毛孔中有某某佛刹，有某某如来安住其中等等，此说适用于一切诸佛。“二万一千”是多数词，我们不必拘泥其数。观主尊右手等十肢体的体性，为“降阎摩”等十大明王。主尊心间共有五尊，其安置法为：“阿閦”最大，其心间为“释迦佛”；“释迦佛”心间为“金刚持”；“阿閦”前方与之相对而坐的是“摩摩枳”；“阿閦”背后向其背而坐的是“文殊”。观想主尊全身放光，从光端放出“护方神”等种种变化。药叉、密迹等众大天神是主尊的足垫。我们纵然无法清楚地观想这些所缘，但最主要的是应在心中引生这样的定解：师长的蕴、界、处等，实为五部如来父母及其他寂怒本尊。以上为主尊观想法。", "观想眷属观想眷属的方法是：从主尊心间向右方放光，光明由小变大，光端上显现“广行派”众师长；左方为“深见派”众师长；前方为结过法缘的众师长；后方稍高处为“修行加持派”众师长。“修行加持派”安置法中有许多教授深要。此派中著名的师长有：金刚持、谛洛巴、那若巴、种毗巴、阿底峡等。然而杰·珠康巴主张只需观想深、广二派，因为这二派的加持传承是经师长代代相传，从未中断过；喀铎·洛桑贡穷（善慧小修）则认为，此系“集密”“胜乐”“大威德”三种传承；杰·昂旺降巴（语自在慈）和喇嘛雍增仁波切则主张以“噶当十六明点”和“甘丹耳传”这二种传承为主。将上述五种传承合起来观想的教授深要，是我师长的口授。这里我将毫无保留地为大家揭示这一殊胜耳传教授：中央除“金刚持”外，从至尊文殊至自己师长之间的诸位师长，均观为文殊相，上下重叠成为一行；其右侧观父续“集密”和“大威德”师长传承，分两行上下重叠；左侧为母续“胜乐”师长传承和“十六明点”师长传承，也分两行上下重叠，共观五行。杰·喜饶嘉措（慧海）的著作中也有类似的说法。", "此外尚有其他教授，大家应参考《噶当经函》、噶钦·南喀多杰（虚空金刚）的有关《供养师长仪轨》著作、彩却林雍增仁波切的《供养师长仪轨引导文》《道次第传承师长传》，以及方才所说的杰·喜饶嘉措的著作等。新、旧噶当派师长的安置法中，也有一种很特别的教授。以上为观想诸位师长。然后，在第一层四瓣莲花的前瓣上，观“集密圣派阿閦三十二尊”；右瓣上，观“大威德金刚十三尊”；左瓣上，观“总摄轮鲁伊巴派六十二尊”；后瓣上，观“具颅喜金刚九尊”。或者按照教授：右瓣上，观父续之王“集密”；左瓣上，观母续之王“胜乐轮”；前瓣上，观双具父母二续扼要的“大威德金刚”。无论如何，如果我们心力所及，应观能所依全圆曼荼罗。不然的话，应观能依之全圆主尊眷属。再不行的话，单观主尊亦可。其次，于第二层莲花上，观以“时轮”为主的无上部各本尊；第三层，观瑜伽续本尊；第四层，观行续本尊；第五层，观事续本尊；第六层，观殊胜化身相佛；第七层，观菩萨；第八层，观独觉；第九层，观声闻；第十层，观勇士和空行；第十一层，观护法众。", "在资粮田诸尊的三处，安置“三金刚”自性三种子字：即头顶上安置身金刚“毗卢遮那”体性的白色“嗡”字等等（帕绷喀大师又说，虽然念诵仪轨中未明言，但也应在脐间安置“宝生”体性黄色“娑”字，和在密处安置“不空成就”体性绿色“诃”字）。虽说“三金刚”是佛所独具的特法，但因为资粮田中的声闻、独觉等，只是化现为声闻等相而体性即佛，所以也可以安置三字。又当了知资粮田诸尊均系师长的变化。此外，也有观资粮田诸尊都是“三重萨埵”的教授。（帕绷喀大师说，观资粮田诸尊时，应具如下三要：一、在意想上，应妥善观想；二、在信解上，应想“此即某某师长或本尊等”；三、在信心上，应想资粮田为殊胜福田。）像这样观想完毕后，次当迎请“智慧尊”，但是实际上，并无迎请的必要，因为只要我们生起信解，佛便会出现在我们面前。经中说：谁若重信解，能仁住其前。我们在辩论时所说的“没有佛的证量不能缘及的地方”，对理解这一点很有帮助。如果配合密法关要来讲的话，则更容易理解。由于证双运位者身心成为一体，所以他们智慧遍及的地方，身体也一样能遍及。论中说：智于刹那间，周遍所知轮。以及：智所周遍处，身亦遍所有。", "由于自己面前这个地方，为佛的一切智所周遍，因此佛身也周遍于此。所以，除了因为自己的业障看不见外，我们只要信解观想，资粮田诸尊就一定会出现在我们面前，这和无著观修弥勒以及月官观修观自在的故事是一样的。对于佛来讲，他们是不必花力气降临于某地的，就像天上的月亮映印在有水的器皿中一样，只要我们一观资粮田，他们便自然出现在我们面前。我们看不见他们，就像泉眼和祠堂中有龙、厉鬼等居住而我们却看不见一样。由于所获加持的大小和积福的多少，视有无“面前真有资粮田”这一信念而定，所以为了消除“面前并没有归依境”这样的疑虑，或为加强信解之故，我们应迎请“智慧尊”。在口诵“唯愿一切有情大依怙”等时，想具足智、悲、力三种功德的资粮田诸尊，各各大显神通降临此处，如《摩揭陀贤女传》中所述。此时观资粮田诸尊心间种子字放光，从十方诸佛心间各请一整体资粮田前来，合并为一个资粮田后，又分化无量，资粮田每一尊身中都有一整体资粮田融入，所以当信解资粮田每一尊均为普摄归依处的体性。我们这样修的话，就不会对资粮田诸尊做优劣的分别，另外也有将来道位与果位的缘起在里边。做“勾”“入”“缚”“喜”则是密宗的修法。", "沐浴圣众资粮田诸尊本身并无需要清净的罪障或污垢等，但为了净治我们自身的罪障，应沐浴资粮田圣众，如经典中说：法身虽无垢，恭敬承事故。观想浴室的方法有许多种。此处配合无上部修法，观浴室为四方四门。门外有牌坊，室内有四条宝柱承托屋顶，顶下饰有珍珠宝盖，此外没有其他屋顶。室内中央为浴池，水晶地基上铺满金沙，池底中央较周边为高，形如龟背，再者如无上部总轨，观木座或狮座，数量与资粮田诸尊数相等。浴池的三面有三座阶梯，每座有四级，周围有宝台和挂衣服的宝衣架。此外观想将用作供养的新衣和浴瓶等。如果我们有浴具的话，可在浴盘中注入少量瓶水代替浴池。另用瓶水在镜面上画两条横线和两条竖线，成九格状。然后用瓶水在中央和四方格中各点一点：九格表浴室，五点表五部佛。在念到“珍珠伞盖具光焰”的句末停顿处时，观资粮田诸尊如鸟飞降，或由梯而下进入浴室。诸尊降临后，从自心间放出无数供养天女，以三个为一组，分别从事沐浴、涂香和献衣的工作，这是根据密宗的规矩来修的。观想供养天女舀取池中的水为圣众沐浴，由此资粮田诸尊心相续中产生大乐。浴毕擦身时，和开光法一样，观天女用浴巾碰触资粮田诸尊的额、喉、胸间和双肩五个部位，同时念咒。", "想诸尊身上所有的湿气集中于这五个部位，然后擦干，这和我们洗澡要从头到脚地擦是不一样的。涂香时所供的香，色泽如金、香气优雅，质料不是普通的油脂。随后向无量圣众奉献各色新衣，或寂静装，或忿怒装。特向仲敦巴大师供养猞猁皮袍、外褂蓝布。为表三士道摄于六度之中，衣带缠绕腰部六圈，这样观想有极大的缘起关要。然后也可向资粮田诸尊供养各自的饰物和手帜。念“悲悯我与众生故”等时，观想资粮田诸尊各返原位，仍像以前一样安住。那些换下来的旧衣服，化为黄光融入自己眉间；或作为各自应得的圣物，分发给六道众生的代表。观浴池下面有六道水渠，池水流入六趣各处，消除各趣有情之苦。因为人最贪，所以观想池水变为众人所需的一切资具。最后想浴室等化空、成无所缘。第五加行：摄集积净关要——奉献七支及曼荼罗积福净罪十分重要！格西铎巴说：若能兼修积集资粮，净治罪障，祈祷本尊与师长，并克勤殷重思惟，虽觉百年亦不能生者，然诸有为法不安住故，终当生起。摄集积净关要的七支与曼荼罗修法，在我们修行的自始至终都极为重要，有些人轻视这些修法，认为只有那些不能广修善行的人才修这些法，或只是视为善行的前行而在正行中不需要，但这些想法是错误的。", "由此七支之门，依靠师长诸佛菩萨最上资粮田修习积福净障之法是最殊胜的，在显密教典中再也找不到比这个更好的修法了。即便在密法中，此七支也是极重要的：四种续部均说应修“七清净”；无上部各“生起次第”中，也都说应由敬礼、供养等七支之门积福净障。文殊怙主大宗喀巴也是因为在沃喀修习积净，才生起殊胜证德的。像这样，如果相续成熟的话，我们便能很快地生起证德。（帕绷喀大师又详细解释说：登地菩萨们也以勤修积净为主，如初地菩萨变化出一百个身体，到一百个佛刹中奉献供品。同样地，二地、三地等菩萨也依次变化出更多的身体，做更多的供养，直至成佛。他们尚且如此，我们这些人自然就不必说了。）所以，此七支法行在显密二者中是积净修法的集大成。其效用有二种：打个比方说，过失成熟，犹如脓包行将穿漏；功德成熟，如同果实即可受用。古德教授中说：“若不积福则如无润之种”，因此我们应该配合修所缘行相，由七支之门勤修积净，光修一些相似道全无所至。“七支”的意思是：比方说，有一辆由七个零件组成的车子，如果少一个零件的话，车子便无法开动；同样地，如果七支中有一支不全，也达不到积净的关要。礼敬七支中的第一支为礼敬。", "礼敬分身、语、意三种，由“所有十方世界中”等颂文依次对此加以说明。各引导文中说，当观自己化身无量，每一身体有无数的头等等。如果这样观想不太容易的话，可以意想自己无始以来所受取的无量身体，均现人相而做礼敬。“于一尘中尘数佛”等一颂，意为所有佛陀能同时安住于同一粒微尘中。譬如，一百个人同时看一粒麦子，在这一粒麦子中能同时趋入一百个人的眼识；同样地，一切佛陀的智慧能同时趋入同一粒微尘，在一粒微尘中有多少智慧趋入就有多少色身趋入，这是因为诸佛具有双运功德、亦即风心同转所致。如果是出于对资粮田的恭敬，那么我们即便是竖一下手指也是身礼敬。身礼敬里面有几种不同的顶礼法：“蜷礼”，为五体投地；“展礼”，为全身仆地。“展礼”系出自《华严经》：“善财童子如树木倒地，全身仆地而做顶礼。”关于顶礼的功德，《辨业经》中说有十种功德，例如：形体美妙、身色如金等。此外，经中说，顶礼所获的福报是：顶礼时身体所压地下尘沙数量的一千倍即将来受生为转轮王之次数。这种“展礼”法也见于密续，且是班钦那若巴的顶礼规矩。普觉·昂旺降巴曾说：如果相信顶礼有这些功德的话，你会希望自己的身体比现在的长得更大一些，手脚更长一些。", "两手掌心合拢成扁平状是外道礼拜法，我们不这样做。顶礼时应空心合掌，将大拇指放入掌内，外形如摩尼宝。像这样将双手置于头顶、眉间、喉间和心间，能分别感得佛的顶髻相、白毫相、六十音支佛语和一切相智佛意。顶礼具有积福和净罪双重功效，所以能清净顶礼者的身、语、意三门罪障。如果仆下时将手指蜷拢，据说是感生圆蹄畜生之因，所以应将手指伸开，铺在地上而不要握拳，由此成就佛的“手足趾缦网相”。手与额头应碰地。起身时应迅速起立，像狐狸那样灵活，这有迅速超脱生死的缘起关要。如果不很快起身而仆在地上的话，将感生为蛇等腹行类有情，所以头碰地后即应起身，不要将休息和顶礼混在一起。前后二次顶礼之间，身体应完全伸直，不然的话，背稍有点驼即当感生为畜生等驼背类有情。为了积福，我们每一次顶礼都要如法地来做，不要为了追求数量而草草了事。在宗喀巴大师开创的教规中，前行不以十万等数量为主，重质不重量。某些声称已完成前行的人，在修十万次顶礼时以最偷懒的方法来做，这样做是不对的。在成佛之前，我们需要不断地积福净障，对于初业行人来说，更要花毕生的精力勤修积净！", "与正修比起来，积福净障更为重要，如果以为前行已经完成而可以放松休息的话，那是不会有任何成就的。如果我们勤于积福净障，就不一定要为了达到十万这个目标，而将身体搞得很累、心理负担很重。以前有四位闭关者同修前行，当其他三人完成定额时，有一个人还远远落后。在问及已完成多少时，他反问道：“难道你们最关心的只是些数字吗？”当然最理想的，是我们在保持如法顶礼的同时，能有较多的数量。计数的目的只是为了随喜自己的善业。总的来讲，礼敬之事也可以附带地或偶然地来做。例如，我们在路上遇见身、语、意所依等时，下至恭敬合掌也算是礼敬。对于一位善于修持的人来讲，身体的一切运动都能转化为修法。", "供养第二供养支，即“以诸妙花妙花鬘”等三颂。假设我们有一块极为肥沃的土地而不去耕种，任其荒芜一年的话，我们将会对此备感可惜；但如果我们不在资粮田中积集福德的话，将比这个更可惜一百倍、一千倍！我们所修之善至少应以希求后世之心来摄持，不然的话，所集的一切善根通常都不能成为正法；唯一例外的是：如果我们对佛积集礼供等福德的话，就算连希求后世之心都没有，也决定成为获得佛位之因！原因是：依靠“佛田”之力能得殊胜之果。譬如，对于良田来说，即便我们不善于耕种，但由于土地肥沃的关系，也照样能结出果实。“涂香”，即由煎煮各种香料所制成的香膏。“妙华”等为“有上供养”。“最胜庄严”等一句，可加在前文一切偈颂之后。“烧香”为单一的熏香，如纯檀香等；“末香”，即旃檀等香粉；“积”，即香粉堆；另一种说法是：“积”是指装有香粉的布袋，将之系在华盖上，使香气随风飘散。《普贤行愿品》中所说的七种供养，即“妙花”等七种。诸佛菩萨以发心和愿力所变化的所有微妙供具，为“无上供养”。虽然我们现在无法来做这样的供养，但还是有别的东西可供：即《慧海请问经》中所说的“受持正法”和“发最上菩提心”二种；", "加上《大悲白莲华经》中所说的“一心专修所闻法义”，共为三种。根据师长教授，可再补充一种：“善根转变为供品而奉献之”。我们可以奉献这四种“无上供养”。从受持教、证正法到只受持一句陀罗尼都是“受持正法”，而“受持正法”乃是无上供养。“一心专修所闻法义”，是指将所闻、所记的法义立即用于实修，我们应效仿京俄瓦大师阅《毗奈耶》而扔皮革的故事。如果我们想等到黄道吉日等一切条件都具备了再开始修法，恐怕到死也等不到这么一天。从打扫住处开始，我们懂得怎样做后，便马上去实修，这即是“修行供养”。所以，那些学大论的人也应实修所闻的法义、一心专修，千万不要成为像布顿仁波切（宝成）所说的那种人：唯求自胜凌辱他，谄诳恶口具坏心，说诸绮语令他恼，如是辩论地狱因！“善根变为供品”，即如“清净戒律大海中”等及“听闻大海阏伽漩”等颂文中所说，观听闻等善根变为供品之相而做奉献。《供养师长仪轨》中也说观想众善根变成花园之相而做奉献，即“实设意化如意海”等颂文中所示。“发最上菩提心”，即发心后为令诸佛菩萨欢喜而做奉献。以上四种也是“无上供养”，是我们现在所备可以供献的。", "没有比这些更为殊胜的供养，所以我们这些出家人应以奉献“修行供养”为主，只需勤供已有的这些便可，不必因为没有财物供养而去冒“邪命”的险。此外也应奉献卓隆巴《圣教次第》中所说的那些供养：身、塔、现前、非现前，自作、教他、财、广大，非染、修行供养十。", "献曼荼罗（帕绷喀大师说：《坦途》与《捷径》在此处献曼荼罗，与《文殊口授》不同。《坦途》和《捷径》是先献供养，后献曼荼罗；《口授》是按照向师长等奉献礼品的规矩，先献曼荼罗，后献供养。）“曼荼罗”译成藏文为“金廓”（译音）：“金”意为心要，“廓”意为取，合起来即“取心要”，内含深意。关于曼荼罗的形状，可以根据所修的事业，采用四方形等样式。某些人声称，外在的供养比起内在的修持并不显得重要，但在密宗的《事师五十颂》中却教导我们说：合掌持花曼荼罗，敬事开演师长尊。以前瑜伽自在吉祥贡巴瓦（曾入定七日）出定时，久未供献的曼荼罗上已积满灰尘。那日正好仲仁波切来访，看到这个情况后便问道：“你为什么不供曼荼罗呢？”贡巴瓦回答说：“我一直在专心内修所以忘了。”仲仁波切闻言呵斥道：“你在胡说些什么！阿底峡比你修得要好吧！但他仍然每天三时供曼荼罗。”从此以后，瑜伽师对献曼荼罗特别精进，后来生起了证德。关于曼荼罗的质料，如果我们富有的话，可用金、银、铜等制成；不然的话，用石板、陶瓷或木头亦可。宗喀巴大师在沃喀时所用的曼荼罗就是石质的。", "至于放在曼荼罗上的“堆”，最好是用珍宝、谷物和香药，不然的话，用石子和砂子等亦可。如果我们有钱，应选最好的来供，这样能积较大的福德。曼荼罗的尺寸越大越好，最小不可小于自己的茶碗。每年或每月之中，我们至少一定要供一次曼荼罗。具体做法是：首先用食指醮一点“牛净物”或香水，然后用大拇指按住曼荼罗中央，以食指在周围画个圈。或者反过来作：用大拇指醮一点“牛净物”或香水，然后用食指按住曼荼罗中心，以大拇指在周围画个圈。正供时，左手握籽捏住曼荼罗底边，以右手腕擦曼荼罗表面：向外擦多次时，想象擦去罪障；向内擦三次时，信解获得身、语、意加持。次按规矩设置各堆。关于曼荼罗东面的认定有二种说法：一说朝供养境的一面为东，一说自己前面为东。供养时，应以朝向资粮田的那面为东；祈祷时，则以面向自己的这面为东，表求赐加持之意，当以后者为上。卓贡却帕（众生怙主法圣）的规矩是设三十七堆曼荼罗：须弥山王、四洲、八小洲、众宝山等四，七宝、宝藏瓶、嬉女等八，加上日、月、伞、幢。宗喀巴大师教派则修二十三堆。二十三堆曼荼罗和二十五堆曼荼罗的区别是：计不计大自在金刚地基和外铁围山二堆。", "供曼荼罗时，我们应按照《俱舍论》中的描述，来观想须弥山王与四洲。因此，我们应当详细了解《俱舍论》中所说的世界形成情况，至少也要知道个大概。（帕绷喀大师随后简略地介绍了一下：）须弥山王周围有七大海、七金山及铁围山围绕，中央为四宝所成的“须弥山王”。“东洲”白色、“南洲”蓝色、“西洲”红色、“北洲”黄色。观想这些洲中，“珍宝山”等宝物堆得满满的，这四种好像是各洲特产似的，所以放在各洲堆之上。“满愿牛”的体性是宝，它所出的粪尿全是金子；“自然稻”是一种没有壳等的粮食，晨割夜长、夜割晨长。在二十五堆中，考虑到这些已间接地与各洲一起供了，因此不另外设堆。七宝，即如“赡部河金善制成”等所说，置于靠近须弥山王堆的四方四隅。“嬉女”等八天女住在须弥山王的层级上，可置于前面八堆之上。在二十五堆中，考虑到这些已包括在须弥山王中一起供了，所以不需另外设堆。“日”“月”分置右方与左方；“众宝伞”在后方；“尊胜幢”在自己前面，这样放置有缘起的关要。或是“日”在西，“月”在东，“伞”在北，“幢”在南，这样放另有一种缘起。天、人所珍爱的一切财物均堆放在须弥山王中央，与曼荼罗一起奉献。", "观想曼荼罗中可包含整个世界，曼荼罗没有变大，四洲与天界也没有变小。彩却林雍增仁波切对此举例说明道：当他住在扎什伦布时，曾在茶碗中的一个小水泡中看到整个人脸。我们也可以像一颗玻璃珠中能映现整个面庞、或针孔中可见整座山等那样来观想。一千个“三千大千世界”合为一个“无量世界”，一千个“无量世界”合为一个“海世界”；一千个“海世界”合为一个“海相续世界”。“香涂地基”等一颂，我猜想是“常啼”供养“法上”菩萨时所诵的偈颂，但尚待核实。这里有“观想佛土”和“观为佛土”两种念法：第一种中的“佛土”作供养境佛资粮田解；第二种为观想为佛土然后奉献之意，因为须弥及四洲等秽土是不堪供养的，所以我们应刹那将须弥及四洲等秽土转变成净土后再做供养。如果我们这样来观想供养的话，便能获得供净土的功德。达波的曼荼罗偈颂中，说“供伴梵王具律仪”等，意为自己如果是具戒比丘的话，在供曼荼罗时应观梵天为助伴；如果不是的话，应观比丘和梵天为助伴。但因为须弥四洲是有情共业所成，所以我们可以将自业所成的那一份增上果须弥四洲作为供养，不必依靠梵王的帮助。如果我们观想力较大，可观百千万个四洲等，不能的话，只供一组亦可。", "如能好好地供曼荼罗的话，我们便能获得供真正须弥四洲等的功德。例如，“法阿育王”的前生中，有一世年幼时，将沙土信解为黄金供在“善观”佛的钵中，于是获得供金的功德，后来能在一夜间建成一千万座舍利塔。所以，供曼荼罗能容易地圆满资粮，也不会犯谄诳等邪命的过失，没有比这个更为殊胜的积福方法了。当知此铜盘中具有如此大的关要！结行中，倾倒曼荼罗堆有二种方法：求加持朝内；除中断向外，我们可酌情采用。此外当知不以数量为主而以观想为主。如果我们想计数的话，可以在此处供养的时候做，配合《归依发心颂》诵“香涂地基”偈，供养须弥山王、四洲及日、月七堆。吉祥女比丘尼因为供曼荼罗而亲见大悲观自在，宗喀巴大师也因为在沃喀却隆供曼荼罗等发大精进而证得中观正见，所以我们大家也应勤修此法。158掌中解脱菩提道次第二十四天教授"]}, {"c": "第六天", "segs": ["加行法之三（第五、六加行）月官论师曾说：犹如小象意贪著，深井口边数口草，非但无获堕深渊，活命世间求乐同。譬如有一头象，因为贪著可怕深渊边上的几口草，跑到那里而不慎跌入深渊；我们也因贪著现世的快乐而造作出种种的不善业，一旦堕入恶趣大深渊中，再想从那里逃出来是很困难的，所以我们应该追求一种长远的目标。而实现这一目标的最胜方法，莫过于修“菩提道次第”，因此，诸位来听法应具有这样的动机：为了利益有情之故，我当获得佛位！为此我来听“菩提道次第引导”，然后去实修。（在回顾了前几天已讲完的科判之后，帕绷喀大师接着说：座上修分加行、正行和结行三部分。加行六法中第五加行“奉献七支及曼荼罗”里面的前二支已讲完了，现在接着讲第三支忏罪支。）忏悔我们相续中，先前未生的证德不能新生，已生的证德不久即退失，这归咎于我们的罪障在作怪。不仅如此，我们现、后世中遇到的一切不快之事都是罪业所致，要想摆脱这些麻烦，我们就必须忏罪。若能忏悔，就是像“无间业”和“定受业”这样的大罪也能清净。虽然“一切有部”说不能清净，但如是能净是“应成派”所许。《亲友书》中也说：先时虽放逸，后若改勤修，犹如云翳除，良宵睹明月。", "孙陀罗难陀，央具理摩罗，达舍绮莫迦，翻恶皆成善。经中说：智罪重亦轻，愚罪轻亦重。这也是指是否善巧忏悔法而言的。婆罗门绮莫迦（具乐）曾弑其母；央具理摩罗（指鬘）曾杀一千九百九十九人；达舍（未生怨王）曾弑其父造无间业，但这些人后来都见谛了，这是因为他们能猛力忏悔所致。所以，如果我们忏悔力量大的话，能从根本上清净罪业；力量中等的话，能使罪业变轻；力量小的话，也能使罪业停止增长。但如果不做忏悔，我们所造之罪将每天翻倍，这样一来，即使原先是很小的罪也会变成极大的罪。例如：我们在杀了一只虱子后不忏悔的话，十五天之后，此杀生之罪便是原来的一万六千三百八十四倍！这几乎和杀人的罪差不多了。我们不想忏罪，对罪业生不起恐惧心，是因为对业果没有信心造成的。如果有的话，哪怕是细小的罪我们也会耻于违犯，这就是为什么阿底峡尊者在旅行时，当他发现自己犯了一种小的“恶作”时，便立即命令全队停止前进而做猛力的忏悔。", "我们大多数人不相信自己有罪需要忏悔，这是因为对自己犯罪的情况不加思考造成的。如果深究的话，我们可以发现：从今天清晨破晓时分到现在，自己的意、口已犯有多少瞋恚、绮语、粗恶语等；对我们这些出家人来说，除了“他胜”，仔细检查一下“僧残”以下的戒，可以发现所犯的罪堕纷若雨降。不仅如是，若不愿穿圆裙，而自称没什么要紧，即成完全的密宗“根本堕”；同样地，所犯的菩萨戒“根本堕”也多如雨降。别解脱“他胜”、菩萨“恶作”、菩萨“根本堕”、密宗“粗罪”和密宗“根本堕”罪，后者均比前者重十万倍。如果计算一下的话，从清晨到现在，我们已积集了许多圆满的恶趣因！所以，我们每天都在造十不善业和违犯三律仪制限。（帕绷喀大师进一步指出：那些造大罪业的人将受生于地狱中；造中等罪业的将受生于饿鬼中；造小罪业的将受生于畜生中。）这里所谓的“大”，不一定是杀人打马等粗显的罪业。以极强的瞋心称弟子为“老狗”等以上的罪，就是大不善业。对殊胜田毁谤等，是由福田门故罪业力大。所以，仅今日一天之中，我们便已造集了圆满的三恶趣因！如果是这样的话，我们该怎么办呢？", "一味地害怕呆坐是无济于事的，我们必须在今生未死之前，勤修十万顶礼和十万《百字明》等，在无始生死罪业清净相未出现之前，努力地忏悔防护。关于净罪相的内容，系出自《准提陀罗尼经》，大家可以去参阅一下《菩提道次第广论》中所引的文字。我们每天晚上临睡前，应配合“金刚萨埵修念”，诵二十一遍《百字明》；及配合念诵《堕忏》做展礼等，努力忏悔。罪堕晨犯夜忏，夜犯晨忏，不与罪堕同行超过一整天。即便不修许多其他的法，专勤于此也未尝不可。若能忏悔现、后世一切痛苦根源——罪业的话，我们便能消除痛苦，证德也会自然地生起。现世中罹患疾病等，是因为能感病痛的不善业已经成熟，所以想靠做经忏等强行灭除，往往并无效应。但是，做经忏的果会在将来别的时候成熟，所以我们不要因为经忏无效而生起邪见。（在生病等时做经忏），如同豆子已经在田里长成，然后再往田里播撒麦子试图消灭它们一样。果一旦成熟的话，我们便无计可施。因此我们应在受果之前忏罪，就像消灭种子那样。忏悔能使小罪根本清净，重罪转弱，并使恶趣“定受业”代之以现世罹患大病等。总的说来，罪业无功德可言，但经过忏悔便能清净，也算是它的一种功德吧。", "所以没有一种罪是不能借忏悔来清净的，由于净罪程度的大小视忏罪的心、行强弱而定，所以我们应以强烈的追悔和防护心等来做。有些修行者在现世屡遭不幸之事，这是事实，但也是极好的征兆。因为他们那些后世将受的恶业（如感生地狱等），已在现世成熟了。有些修行者经常遗失或丧失财产，这表明他们那些将感生饿鬼的恶业已在现世成熟了；相反，有些作恶者却似乎时来运转，例如得享高寿等等，但这是将前生修善留下的果，提前在现世中消耗殆尽的征兆。所以，他们将来只会堕入单纯领受痛苦之处。仲敦巴法王在后半生中，也示现身患麻风病之相。所以，大家对这些情况不要有邪见，应对疾病等生起欢喜。忏悔能清净我们的罪业，瞋恚则能摧毁我们的善根，这二者有极大的利害关系。此外当知，忏悔应具足四种对治力。关于“依止力”的认定，有人认为是忏悔境，本派则以“归依、发心”为依止力。正如在何处跌倒，就需在何处站起来；我们犯罪的对象不出佛和有情二种，所以也要依靠佛和有情来净罪，此即“归依”与“发心”，这二种修法前面已经解释过了。", "“破坏力”即追悔心，有了追悔心，防护心也会跟着出现。为了使追悔心具有力量，我们应当明白业果的道理。譬如有三个人都吃了有毒的食物，其中一个人死了，一个人病了，另一人虽然还没有出现症状，但一定会极其懊悔，并多方设法使毒物排出体外，而且今后再也不想吃这样的东西了。同样地，我与一切有情过去都造集了如毒的罪业，他们有的已经死后投生在恶趣里了，有的则为三毒痼疾所缠，行将堕入恶趣。而我因为也造了罪业，结果将与他们一样，所以应该对此生起追悔和防护之心。作为“遮止罪恶力”的防护心应极为坚固才行，我们要认真地修，不要听了忏罪功德后，便不加注意，使防护罪恶的心松懈了。关于防护心的具体修法，对粗恶语等十分容易犯的罪业，如果说今后永不再犯，极有可能会成为妄语，可是又不能因此就不加以防护；因为缺乏防护心，将使四力不全。所以，能够完全戒除的罪，我们要下决心完全戒除。否则，就应当下决心在一年、一个月或一天中不犯。若能每天下决心断除，便有逐日能断的关要。像这样熟练之后，我们就能断除以前的恶习！这是我大宝师长所说的巧妙教授。“遍行对治力”，也就是由追悔之门正做净罪的方法，主要有六种：（一）诵如来名号；（二）诵陀罗尼咒；", "（三）诵经；（四）修习空性；（五）供养；（六）修造佛像。我们可以根据情况，选择一种来修。不仅如是，凡是为了净罪目的而修的任何善业——包括念诵《六字大明咒》等，都是“遍行对治力”，而不一定要诵“发露、忏悔”这样的文句。所以，对我们出家人来讲，在我们走向辩经院时，如果以净罪为目的承受寒冷炎热的苦行，那么这些也就会成为净罪的因，但同时也需要具足四力。上述六种之中，依止名号之类比较容易修。另外，按照先德的规矩，在念诵《堕忏》的同时，自做顶礼。《堕忏》本身明文叙述了全部四力。宗喀巴大师的事业广如虚空，也是因为由《三蕴经》之门勤做积福、净障等功德所致。《堕忏》与顶礼合修来做忏悔，是宗喀巴大师的宗风。洛札大成就者也是以此法门来净障的，后来的所有智者成就师也都致力于此，大成就者洛桑南杰（善慧尊胜）亦称赞此法功效卓著。就像能滋生高额利息的巨债一旦被免除，负债者极感轻松一样；我们也应以轻松愉快的心情来修净罪之法。那些想顶礼计数的人，应认真地思考“礼敬支”中所说的内容，但在“礼敬支”中，身敬礼只需合掌便可，实际的顶礼计数应放在“忏悔支”中做比较好。具体方法是：首先念三遍“变多咒”同时顶礼三次。", "然后配合《堕忏》继续顶礼。虽然《堕忏》诸尊已观在资粮田中，但此处为了郑重其事，特观从师长心间放出三十四束光明：上下各十，左右各七。光端上有三十四个大象抬举的宝座，均饰以珍珠。因为动物中大象的力气最大，所以观想由大象来抬座有净罪力大的缘起关要。三十五佛的身色、手帜多不相同，为了便于观想，我们可将他们分为五组，每组七尊，每组的身色和手帜分别与五部佛的一部相对应，即第一组七尊为“阿閦”，其余四组分别为“毗卢遮那”“宝生”“阿弥陀”和“不空成就”之相。第一组七尊中，有二尊例外：“释迦牟尼佛”仍为师长心间的那一尊；“龙自在王佛”颈部以上为白色，其余部分为蓝色，结“伏龙印”：双手握拳，二中指上竖相抵。这三十四尊佛应观在资粮田前面，略近自己之处。《堕忏》念诵法中有三种不同的口授：第一种是从头念到尾计为一次；第二种是从大师“释迦牟尼佛”念到“须弥山王佛”算作一次，反复地念诵这些名号；第三种是依次念诵各如来名号多次，例如一座中诵二十五遍《堕忏》的话，即念诵各如来名号二十五次。这第三种教授比较容易观想，也较容易思惟各尊的功德。后二种念诵法中，在诵完如来名号之后，只需念一遍“如是等十方”作为结束即可。", "念诵这些如来的名号有许多功德，大家可以去阅读一下《堕忏大疏》等以求定解。如果在三十五佛名号之上，再加诵“如来七兄弟”名号的话，据说在此末法时代较易满我们的愿。因为我们都希望能速得加持和功德，所以应当加诵“如来七兄弟”名号并做顶礼。在《堕忏》原文中，本来并没有这么多“如来”的称谓，但因为不做赞叹直呼其名是不合适的，所以按照宗喀巴大师的规矩，在所有佛名前，我们都应冠以“如来”的尊称。然后我们可诵《总忏悔文》等，再转入“我由贪瞋痴增上”等正文。此颂表明：造罪的因是三毒；途径是身、语、意三门；体性为不善。“别悔除”意为按照三律仪各自的做法来忏悔，此时我们应回忆平时所造的那些罪业，然后认真忏悔。随喜第四支为随喜，由于随喜是菩萨的修法，所以对我们来讲比较难以实践，然而如果我们能好好地随喜的话，那就再没有比这个更为殊胜的积福方法了。（帕绷喀大师接着讲了“穷人贤善”的故事：以前有个穷人名叫“贤善”，由于他对频婆娑罗王为佛陀及其声闻弟子所做的供养心生随喜，结果他的功德比正做供养的频婆娑罗王还要大。）正如宗喀巴大师所说：不须劬劳积大福，随喜善事最殊胜。", "我们不需劳动身口，只要舒服地坐着“随喜”，便能摄集无量资粮。以前频婆娑罗王曾问佛，在统治王国的同时，修什么法最合适。佛答以修“随喜”“发菩提心”和“回向”三法。因此，我们也要修没有嫉妒和竞争之心的随喜。如果一个我们不喜欢的人做了什么善事的话，我们往往会出于嫉妒而说这样的话：“他不过是装装样子罢了，其实对谁都没有好处。”相反地，对我们这些出家人来说，假设隔壁寮房的人献了一次“百供”、而我们能对此至心随喜的话，我们必定能获得如下相应的功德：如果对方的证悟层次比自己低，我们所获的功德便是对方的一倍；如果与对方证悟相同，我们所获功德便与对方相等；即便对方证悟层次比自己高，我们也能获得大约相当于对方一半的功德。试问还有比“随喜”更有利可图的修法吗？如果我们对佛菩萨等先贤的事业心生随喜，由于心量高低悬殊的关系，我们大约能获得相当于他们十分之一的功德。我们就是穷尽一生力行善事，也难敌初地菩萨一天所积善根的一小部分，佛的善根就更不必说了。但如果我们能对他们的事业心生随喜的话，便能获得大约一半的功德。所以，这是一种只需一动念便能摄集广大资粮的巧妙方法。", "在此中部地区（前藏），由于圣教极为兴盛，所以礼供、旋绕、斋戒、修行及学法的人很多。如果我们能对之随喜，将获得极大的善根。根据师长的规矩，此处应对诸佛最初发心等事业，印藏诸大智者成就师的事业，以及包括隔壁邻居诵经以上的一切善业依次随喜。", "此外，随喜可以分成二种修法：对自己的善业修随喜；对他人的善业修随喜。第一种又可分成两部分：比量随喜前世之善；现量随喜今生之善。比量随喜前世之善：首先，我们应该注意到今生中我们已获得善妙所依身，具备了修法的顺缘等事实，随后我们应当不断地思惟：“这是因为我前生中能修净戒、布施、安忍等所致，真是太好了！”总的来说，因为我们前生在成办久远目标方面没有失误，所以才会有现在这样的圆满暇满身。至于将来会受生在哪里，比丘们，你们现在问问自己就可以知道！有位古德曾说：前世宝生赐，现在宝人身。现在比丘宝，勿堕后世崖！所以，检查一下自己现在的行为，即可知道我们后世将生在何处，没有必要去找有神通的人占卜、打卦。现量随喜今生之善：即通过回忆自己平素亲身所做的那些念诵、布施、供斋、闻思，在大殿及辩经院中所做的苦行，以及持戒不犯等等而生起欢喜心，此时应远离骄慢，如果起慢心，反将使我们的善根减小。如果你喜欢记帐的话，应当时常算算自己的善业。我们大都喜欢计算自己有多少钱物等，但钱再多，充其量也不过能带来现世的少许快乐罢了；而如果善根增长，便能给予你从人天妙身直到佛位的无穷快乐。", "相对地，因为罪业能把你带到离地面许多由旬之下的“金刚地狱”等地方，所以也应该算算这笔帐（帕绷喀大师接着谈了以前格西奔用黑白石子计算善恶业的故事）。所以，我们宁可现在自己给自己算一笔帐，也不要将来在阎摩面前算总帐时无话可说。第二，对他人的善业修随喜。我们可以随喜仇敌的善业、亲友的善业、非仇非亲者的善业；也可以随喜五种补特伽罗的善业；或是通过阅读大德的传记，对他们的事业至心随喜。随喜他人的善业能生起新的福德，随喜自己的善业能使自己已有的福德增长，杰·贡唐巴说：若欲安睡积大福，便应修习随喜法。由于我们生活在藏地这个佛法兴盛的地方，所以我们在行、住、坐、卧间，都可以因为听到他人的善事而修习随喜。在菩萨随喜的因中，必然有利他之心。譬如，做父亲的有责任要解决全家的温饱问题，但当他的长子自己有办法解决这些问题的话，父亲将为此而特别高兴。所以，菩萨的随喜法与一般的稍有不同。劝转法轮第五支为劝转法轮。大师成佛后，在最初的七天七夜中未转法轮。后来，如经中说：因诸异生信梵天，故由彼请转法轮。经过梵天的启请，佛才为“最初五弟子”说四谛法轮。佛对“五弟子”说了三次四谛，共计十二异门，此为转“教法轮”；", "经由转“教法轮”，“阿若憍陈如”首先证得阿罗汉果，其他四人证得预流果，此为在所化心中转或证得“证法轮”。“证法轮”的获得依赖于“教法轮”，而“教法轮”又依赖于劝请，所以就有了“劝转法轮”这一支。（此处，帕绷喀大师引用《俱舍论》中“于中唯见道，说名为法轮”等文，做了一段插叙。）劝转法轮时，如果我们有曼荼罗的话，可以在曼荼罗上设置九堆，观为千辐金轮而做奉献。然后劝请，信解自己成为大梵天王，放出无数相同的梵天，到十方佛刹诸佛面前敬献金轮。不行的话，可观与资粮田诸尊相同之数；再不行的话，就只观一尊。请不入涅槃第六支为请不入涅槃。经中说：“佛不入涅槃”。总的来讲，佛是不会入涅槃的，正法也不会消亡，但因为殊胜化身要示现涅槃相，所以我们仍需劝请他们不入涅槃。不做这样的劝请是极大的错误！就像佛陀临涅槃时，曾对阿难说：由于如来久习“四无畏”和“四神足”，并获得如同金刚般坚固的身躯，所以如果佛同意的话，他能住世一劫或一劫以上。但因为阿难被魔所加持，没有及时理解佛陀的意思去做劝请，导致佛陀于八十岁时示涅槃相。所以劝请不要错过时机是极为重要的。此处可在曼荼罗上设置五堆，观想为金刚座。", "然后奉献与资粮田诸尊数相同的宝座，融入资粮田座中。如果观想困难的话，只献一个宝座也可以。“劝转法轮”和“请不入涅槃”两支中，都应信解师长同意你所做的请求。回向第七支为回向。最后的“回向”十分重要，这与“纠正动机”二件事，在噶当修心典籍中，称之为“初后修二事”。“回向”与“发愿”的区别为：“发愿”能包括“回向”；回向需要有可回向之物。回向有六个方面：一、以何回向？善根；二、为何回向？为令善根永不竭尽；三、回向何所？无上菩提；四、回向何事？为利益一切有情；五、以何方法？《现观庄严论》中说：“有方便无相。”以三轮无所缘等方便、智慧双运之心回向，破除对所回向物的实执；六、回向体性，即希求善根永不竭尽而将善根转为圆满菩提之思（心所）。发愿的力量是很大的，例如：我们现在能够听到正法，那是因为大师佛陀的愿力所致；舍利弗能成为“智慧第一”，也是因为他以前发愿的力量。善业如马，发愿如辔。正如金、银等材料是造成佛像、还是造成器皿，全依赖于工匠的做法一般；善业的结果是好、是坏，也依赖于回向发愿。", "例如：过去有个人，具有大力善根，本来能受生为“六事”婆罗门，但因为临终前看见一头漂亮的大象而生起贪爱，从而受生为帝释的座骑——大象“善住”。我也是因为年轻时，只顾发“最上大宝圣教未普及”等等这样的愿，致使现在没完没了地讲经说法，那时候没有发愿在寂静的山林中一心专修，真是太可惜了！我们千万不要为了现世快乐的目的而发愿回向。如果我们不做回向的话，善根就会被瞋恚所摧毁。《入行论》中说：千劫所修集，布施供佛等，一切诸善行，一瞋恚能坏。瞋恚能摧毁千劫善根。《入行论》中说：若有瞋恚诸佛子，百劫所修施戒福，一刹那顷能顿坏，故无他罪胜不忍。说是能坏百劫所积善根。所坏善根的多寡有百劫和千劫之分，是因为能瞋之人和所瞋之境二者的证悟高低有别：如果是非菩萨瞋恚菩萨的话，即坏千劫中所积善根；如果是大力菩萨瞋恚力弱菩萨的话，即坏百劫中所积善根。避免善根被瞋恚摧毁的方法，如《慧海请问经》中所说：犹如滴水落海中，海水未竭彼无尽，如是回向菩提善，未获菩提亦无穷。", "我们所拥有的善根，就像一滴水，如果将它回向，让它与犹如大海般的佛菩萨善根混和在一起的话，那么我们的善根在未获菩提以前都将永不竭尽（帕绷喀大师又举了两个邮差将糌粑混在一起的例子。）虽然现在流通的经中没有上述这段文字，但佛所说的经有很多，想必另有一部经也称为《慧海请问经》。至于如何回向，经中说：“令与一切有情共”，及《现观庄严论》中说：“殊胜遍回向，不颠倒体性”等，破除实执为殊胜回向。将善根回向圆满菩提，虽然也可以像一般人所理解的那样，心想：“为了利他，愿此善根成为获得圆满菩提之因。”但另有一种修法更为切要，即令我们的善根“与一切有情共”，也就是将我们的善根融合于诸佛广大利他事业的无尽善根之中，或是作为诸佛菩萨利他事业的助缘，奉献给诸佛菩萨，由此愿我们的善根，成为将一切众生安置于圆满菩提的因。", "《经庄严论》中说：诸坚固回向，具足希求思。如前所说，回向是一种令善根无尽的思心所。关于“回向见证者”，我们应请求师长与佛菩萨作为我们的回向见证人，就像向朋友求援一样。“集密”修法中，在收摄曼荼罗之前先发愿，也是请作见证之意。所以，尽管我们的善根很微弱，但如果将之回向为圆满菩提因的话，我们的善根在未获菩提前就永远不会竭尽。回向善根有三种方法：一、回向自他相续中佛教增长；二、回向一切生中善知识摄受；三、回向获得圆满菩提，这三大回向可任选其一。例如，“恒河沙数菩萨愿”为受持正法之愿，回向圣教增长。因为正法由教圣教和证圣教二者构成，所以，这种愿即是回向善根成为教、证二者增长之因；“敬礼供养悔露罪”等为回向获得圆满菩提；由于因——受持正法与果——获得圆满菩提二者均依赖于善知识摄受方能实现，所以也可回向师长摄受，如“无上大师之圣教”等。所以这三种我们可任选其一来回向。“少分善”有谦逊、戒除骄傲之意；“尽我所积”意为所造集的一切善业；“一切回向大菩提”意为将这些善根均回向获得圆满菩提。为因回向与为果回向没有区别，就像乞讨因位的青稞与乞讨果位的糌粑没有区别一样。", "但在不知道怎样来做回向的情况下，我们可以念诵“文殊勇士如实知”等来回向，三世诸佛都称这是最殊胜的发愿并这样来做，因为这两个偈颂中，包括了无数像文殊和普贤等那样的大菩萨做回向的菩萨愿内容。此外，我们应该以助伴“无所缘见”来摄持。七支作为三毒的对治情况如下：“礼敬”对治我慢；“供养”对治悭吝；“忏悔”对治三毒；“随喜”对治嫉妒；“劝转法轮”对治谤法；“请不入涅槃”对治轻毁师长；“回向”对治瞋恚。七支也可以包括在积、净、增三事中：前四支半为积福；忏悔为净罪；随喜的一部分和回向为增长善根。殊胜怙主达波大宝师长的口授中，说七支各有所感之果：“敬礼”能成就佛的顶髻，如前已述；“供养”能成就受用虚空藏；“忏悔”能断尽二障；“随喜”能成就见皆合意之身；“劝转法轮”能成就梵音之语；“请不入涅槃”能成就“寿持明”或获得金刚身；“回向”能成就佛的总体功德。这些说法不见于其他书中。祈祷曼荼罗其次供“祈祷曼荼罗”，共有二派：一派将之归于上面的第五加行中；另一派则说是属于下面的第六加行，前一种说法是师长的规矩传承。正如对国王有要事相求，我们应该先献上厚礼一样；", "因为我们将向资粮田请求极为重要的三件事，所以也应该先供曼荼罗。三大事并不是指长寿、无病等自利的要求，而是指这样三件事：一、断除不敬善知识等颠倒心；二、生起一切不颠倒心；三、息灭外、内障碍。如果与密法合起来讲的话，祈祷文可改为：“从不恭敬善知识起，乃至明、增、得三微细二相所有一切颠倒心，加持速灭。”我想本加行法中，也可加入这些密法的内容。据说，一切与修法有关的内容，无不包括在这三件事中。", "关于“障碍”，修法的外障碍：包括国王不如法治国、战争等；内障碍：包括患病等；秘密障碍：为不信受正法、顽固不化等。按照规矩，在每件事后，我们都应加诵“启请加持”。第六加行：如教授启请决定令与自心和合如前已述，我们心中能生起证德的最好方法，是视师长与本尊无别而祈祷。因为我们心中证悟的生起，依赖于佛菩萨的加持，而加持又依赖于祈祷。（帕绷喀大师指出：虽然有许多不同的祈祷文，但因为“无等向导大师薄伽梵”等具有极大的加持力，所以如果不念诵此文的话，将是件十分可惜的事。祈祷广行派和深见派二派之首的大师佛陀时，分别称大师为“无等向导”和“无等善说”，这是配合深、广道分别赞佛为“悲圆满”和“智圆满”来说的，因为释迦佛曾赞叹“缘起说”为无等善说等等。）正如有要事请求大官，需要面子大的人代请一样，我们观想前方现平日所见之相的根本师长，分出一模一样的一个化身，安住在自己顶上，像领经师一样，与自己一起向佛菩萨祈请。“吉祥根本大宝师长尊……伏请赐予身语意悉地。”此颂念第一遍时，想师长分身降临自己头顶；念第二遍时，观从师长身中降甘露净罪，并分身融入自己。", "《文殊口授》加行法中各颂第四句没有念两遍的规矩，《坦途》《捷径》加行法中各颂末句均诵两遍。第一遍：祈祷根本师长时，信解净治心中生起深、广二道的不顺品；祈祷广大行派师长和甚深见派师长时，信解分别净治心中生起广大道和甚深道的不顺品。第二遍：信解从各位师长身中分身融入自己，由此生起甚深、广大相应的证德。由于宗喀巴大师原著《道次第传承师长启请·开胜道门》中“瑜伽自在吉祥贡巴瓦……”等噶当“道次第派”，紧接在广行派师长之后，有人或许以为他们是广行派，其实不然。札果堪钦的祈祷文，在“具有甚深广大正法故”等后面，紧接着说“成就大自在者尸罗燃”等，似乎二派是合在一起的；其实也并非如此。按照教授，正确的念诵方法应该是：由于到阿底峡尊者这一代深、广传承合流，所以广行派传承念到阿底峡尊者为止，不包括以后的噶当派；深见派传承也念到阿底峡尊者和仲敦巴父子为止。然后按弟子年龄长幼排列：贡巴瓦最老，所以先念噶当“道次第派”传承，诵至南喀坚赞（虚空幢）；其次为“教典派”传承，从博多瓦念到却嘉桑波（法依贤）；其次为“教授派”传承，从京俄·楚臣拔（尸罗燃）念到南喀坚赞（虚空幢）。", "从这里开始，三种传承合流，所以只念宗喀巴大师一尊的祈祷文，选用“缘悲颂”是因为加持力特别。因此，在资粮田中，围绕弥勒、文殊的见、行派传承师长也都到阿底峡尊者和仲敦巴为止。围绕贡巴瓦的内邬素巴等七位“道次第派”师长，均应观想在见、行二派之前，如寺院中的班级聚会。“道次第派”的左侧或右侧，观“教典派”师长，博朵瓦周围有九师围绕；“道次第派”的右侧或左侧，观“教授派”师长，京俄瓦周围有七师围绕；在这三派之前，观宗喀巴大师，大师左右两侧，依次排列“新噶当派”众师长。此传承师长祈祷文言简意赅，每四句中概要地介绍了各位师长的生平。如果我们了解诸师生平的话，在此应加以回忆，并生起随喜和随学之念。在诵末句第二遍时，想自己也获得了各位师长生平所成就的教、证功德。按照规矩，最后应加上“愿于吉祥师长行”等一颂。祈祷结束后，假如我们不准备另外做“道次第速修”等，在此可以念诵《功德之基》作为代替；如果另做的话，就不必念诵此文，接着收摄资粮田便可。", "收摄资粮田观想“师长金刚持”心间放光，照亮资粮田其他各尊。接着如镜面上呵气后收摄状，从四大天王开始，从下往上依次（化光）收入四瓣莲花上的四本尊，四本尊（也化光）收入金刚持心间。然后，深见派众师长收入“文殊”；广行派众师长收入“弥勒”；加持派众师长收入“金刚持”；结过法缘众师长收入“现通常所见相的根本师长”。此时，我们应对此五尊观想明了，心想：“我是有缘能亲见佛菩萨之人！”然后弥勒、文殊二尊化光融入主尊，金刚持则作为智慧萨埵融入。中央现通常所见相的根本师长如果化光的话，将有损于缘起关要，所以不论根本师长是否住世，均不化光，而如麦粒嵌入酥油般，融入主尊心间金刚持。狮座与满愿树融入主尊莲座。主尊化光融入自己顶上师长，主尊的莲座也随之融入顶上师长的莲座。观顶上师长为大师释迦牟尼相，视其为总摄一切归依处体性，略供七支及曼荼罗。然后，就像在同一个地方猛力钉橛一样，我们向师长独尊祈祷，做“安橛启请”。我们不要频繁地改换祈祷的对象，以为这样会得到什么好处，祈祷境太多反而成不了事。此处由总摄三宝与归依处之门祈祷师长。这一“四身体性”祈祷文系出自《甘丹变化经函》，所以有很大的加持力。", "此颂每一句的字数均应一致，不要念成长短不一的样子（藏文举例略）。在学“修心——自他相换”的时候，因为“圣观自在”是大悲本尊，所以此处我们可以改念成：“具足四身体性师长尊，师长观自在前我启请。”依次类推，我们在修“正见”时，可改念成“师长妙吉祥前我启请”。以上所说的加行部分，从最初的依止善知识法到最后的止观之间均适用。在正修各种所缘类时，师长安住于自己顶上不做收摄。如果所缘境不清晰的话，应重新向师长献曼荼罗和祈祷。", "丁二、如何修正行从这里开始，我们应当修正行。首先根据自己的能力，选择《菩提道次第广论》《菩提道次第略论》《坦途》《捷径》等来修心。在修习各种所缘类前，先做生起当前这一类证德的祈祷，并观想从师长身中降五色甘露流，清除妨碍生起当前这一类所缘的障碍，而在心中生起当前这一类所缘的道。“安橛启请”——末句“能仁金刚持前我启请”——以上的加行法，均适用于下面所说的一切所缘类。随后按照《坦途》中所说的祈祷，即：“我与一切母亲有情，在生死中长时受生、领受种种猛利大苦”等等。修上士道时，应略去“在生死中长时受生”数语。然后开始修正行。所谓“修”者，是指将我们的心与某一所缘相结合，令心惯熟于此。例如，将不信善知识之心转而与信心相结合，令心惯熟于信心等。所以，修的目的是为了控制自心。确切地说，是为了将自心从烦恼的控制下摆脱出来，而与所缘相结合。这里面有两种修法：“观察修”和“止住修”。所谓“观察修”，是指广泛地应用教、理、喻、因等进行思惟而修。为了便于大家理解，我换个角度来讲：其实我们平时就一直在做“观察修”，但是修的内容却错了，因为我们修的是三毒！", "以瞋恚为例，如果我们不首先去想某某仇人的话，瞋恚是生不起来的。但一旦想到某某仇人时，我们通常会不断地想下去：“此人去年曾对我说过什么样的话，做过什么样的事，又怎样地侮辱我，最后那人又以什么样的眼神看我。”像这样，我们会越想越生气，脸也变红了，拳头也捏得出了汗。这时候，如果那个仇人出现在眼前的话，我们会毫无疑问地一拳打在那人的头上！这就是能生起瞋恚的“观察修”。贪欲等其他烦恼也一样。我们在辩论时的思惟，如果不是单纯只为了想击败对手，而能平心静气地围绕某一论题，从各方面进行观察分析的话，就是这里所说的“观察修”。我们都是“大修行者”，但与真正的大修行者不同，我们只对烦恼三毒做“观察修”，所以成就地狱等的速度比别人快，将很快就到达一切山谷红如映红宝的险恶世界。因此我们应以观察暇满是什么、为什么说暇满难得、暇满是如何利大等等，来代替对无益之事的观察修。在对每一科获得定解之后，我们就应专修暇满、利大、难得等各科。如将碱与盐随便混放在一起，不按先后次第地随意挑选所缘来修，以为只要修的是正法就没有过失，这种修法是错误的。万一养成恶习的话，将对我们形成极大的障碍；", "因为这是种导致沉没、掉举的有过修法，所以会使我们一生的善行都染上过失。如果养成这种恶习，我们将永远无法肯定地说：“我在修这个所缘”，所以应当避免开这种恶习。以“死无常”为例，我们可以使用与“死无常”有关的教、理、喻、因，再加上别的相关内容来修，最简单的，如“听说今天村里某个人去世了”等等。此外，我们当以师长所说的教授为基础，在此之上再增添其他有关内容，甚至“擦康”内的一纸散页，都可以作为补充来修。如果我们从多方面对所缘加以思惟，便较容易生起证悟，就像前面所说的从多方面思惟而生起瞋恚一样。所以，奢摩他之前的一切修法是“观察修”，奢摩他成就之后的心一境性等是“止住修”。（帕绷喀大师最后提到，有些人称“止住修”为孤萨黎修法，“观察修”为班智达修法；又说“观察修”能损害“止住修”等等，那都是不合理的。）"]}, {"c": "第七天", "segs": ["依止善知识——道之根本（嘉杰·帕绷喀仁波切引用寂天大菩萨的话，作为第七天开示的开场白：）依此人身舟，能渡大苦海。此舟难再获，愚者莫贪睡！我们现在所获得的清净人身，如同能够横渡生死大海的舟船，所以不要贪著未死之前的那些短暂的快乐，而应去追求一种能利益今后一切生的远大目标。不然的话，今后恐难再得这种像舟船一样能救渡我们出大苦海的人身。因此，我们现在应该利用这个机会去实现这一远大目标。为了实现这一目标，我们必须了解怎样去实现它的方法，所以先纠正听法动机来闻法：为了利益一切母亲有情，我应获得正等觉位，为此我来听受三士道次第甚深引导，然后去认真地实修。（帕绷喀大师接着列举了以前讲述过的那些科判。）第四大科“如何正以教授引导弟子之次第”有两部分：一是“道之根本依止知识之理”；二是“既依止已如何修心之次第”。今天，我将从依止知识法开始讲起。讲“加行法”本来包含复讲在内需要讲四次，我现在无法这样来讲，但从依止知识法开始的正行引导，仍然需要重复四次。你们日后若传法，也必须遵照这一规矩。", "世俗上那些用眼睛看就可以学会的职业，如木工、雕塑佛像的工匠等，初学时犹需依靠师傅的教授，更何况是能实现利益今生来世这一远大目标的成佛之道？我们想要了解此中的情况，岂有不依靠善知识之理！有些人以为只要自己看看经书就行了，可以不需要师长。这种想法是不对的，我们必须要依止一位具足德相的善知识。譬如，在我们准备动身去印度等地之前，必须先请教某位向导，这位向导不是随便什么人都可以充任的，他应该曾经去过那里，有这种经验的人方可引导我们；同样地，为我们开示菩提道的善知识，也必须能为我们指引成佛的道路才行。如果随便依止而碰上恶友的话，那将走入歧途。所以最初的依止知识法极为重要，宗喀巴大师称之为“道之根本”，是具有深刻含义的。最初依止知识法分四个方面：（戊一）依止知识利益；（戊二）不依止与不如法依止之过患；（戊三）意乐依止法；（戊四）加行依止法。戊一、依止知识利益我们必须先思惟依止的利益和不依止的过患，只有这样我们才会生起强有力的依止欲。", "关于依止知识的利益，我依据师长的口传，根据《捷径》来讲，共分八节：己一、近得佛位依照我的依怙主——达波大宝师长的口传，此节又分二小节来做引导：一、实修师长所示教诫故近得佛位；二、供养恭敬师长故近得佛位。一、实修师长所示教诫故近得佛位总而言之，使修行者能向佛位接近者，乃是依止善知识所产生的功德。某些人在一生当中，便能获得依靠其他法需要修无数大劫才能获得的那些地道，即是他们如理依止善知识的结果。无上密宗的速疾特点，也是因为以“师长瑜伽”为道之生命而得到体现的，例如杰·密勒日巴等祖师的行传。（随后帕绷喀大师引述“大恩刹那能赐给”及“大悲刹那能赐给”等颂文，并解释说：如果我们如理依止师长的话，仰赖师长的恩德和悲心，能于刹那间赐予我们大乐界法身位。所谓“刹那”，这里是指浊世短暂的一生。人的寿命，相对于下界地狱和上界天的寿量来讲，短暂如一刹那般。为了说明这个问题，大师又讲了无著上升兜率天的故事。不仅如此，相对于生死的前后边际来讲，人的一生也短暂如一刹那。）如果不如理依止师长的话，就算我们修像无上密宗等那样高深的法，也是生不起丝毫地道证德的。", "反之，如能妥善了知依止法的话，即便需要多劫才能修成的双运位，我们也能很快地得到。如《道次第甘露藏》中说：多劫海中虽勤修，仍极难得大双运，然说若依师长力，浊世短寿亦易成。就是在显教中，如果依止师长方面做得特别出色，也能迅速地完成修道。（帕绷喀大师接着讲了常啼菩萨的行传，而后又继续说）当我们见到佛时，多半会以“我见到高于师长的佛”而感到满足。但常啼却不是这样，他虽然已亲见无量诸佛，却仍不满足，继续寻访师长。他的这种做法深得要领：如果遇不到与自己有前世因缘的师长，任何人都无法对自己有大的利益。当时，虽然常啼有帝释赠予的珍宝可以供养，但为了圆满大力资粮的缘故，仍以割肉、洒血等方式来敬事法上大师。起初，常啼在亲见诸佛时，已得“法流三摩地”，为大乘“大资粮道行者”。当他遇见法上，法上为之说法后，顿登八地获“无生法忍”。他能这样迅速地完成修道，是因为他的依师法无与伦比。否则在不净七地中，通常需要圆满无数大劫的资粮方能获得八地。所以说，趣向佛位是快还是慢，取决于我们的依师法是如理还是不如理。我们能依止师长的话，即使师长只开示一项教授，而我们只修那么一项教授，也一样能如其所修而接近佛位。", "当然，依止一位开示全圆道的师长，要比依止一位仅能引导下士道的师长，进步快得多。如果弟子这方面能刻苦耐劳、是可造之器，又遇到能开示全圆道师长，成佛便如随手即可塑造之物，毫不困难。帕荡巴说：师随所欲皆可导，信敬为酬定日瓦。又如龙猛所说：若人堕自须弥顶，虽不愿堕亦必堕；若得师恩利益教，不欲解脱亦解脱。当某人从高山顶上往下堕落时，纵然不愿意下堕也无法返回原处；同样地，如果我们能如理依师而得到师长引导的话，纵然不想解脱也必将得到解脱。反之，如果我们不依止师长，那是无法获得丝毫修道进步的。", "二、供养恭敬师长故近得佛位为了成佛，我们必须积集无量资粮，而最容易积集这样广大资粮的方法，莫过于供养师长。在许多密续和论典中，都说供养师长一毛孔的功德，要胜过供养十方一切佛菩萨，例如说：师长一毛孔，胜过十方佛，及菩萨福德，是故供师长，诸佛菩萨见。萨迦班智达也说：于千劫中修显教，布施头足手财福，此师长道刹那摄，故应侍奉修喜悦。千劫中布施头、手、足等所致的广大资粮，我们只需做一件能取悦师长的小事便能积集。资粮圆满愈快，距离佛位也就愈近。就供养的对象来说，畜生、人、声闻、独觉、菩萨、一切佛、诸位师长，后者均比前者来得力大。以前格西堆陇巴曾说：“邀请堆陇一切僧众赴宴供养，不如施食于洛巴的狗福德大。”据说他总是将零碎的食物积攒起来，包括碗内剩下的酥油汁，留给他师长洛巴的狗吃。密续中说：较供三世一切佛，供师一毛孔为胜。这里所谓的“毛孔”不是真的指师长身上的毛孔，而是指师长的座骑、家犬和仆役等。", "己二、令诸佛欢喜此节中有二种思惟法：一、满诸佛愿故令生欢喜；二、住师长身受供养故令生欢喜。一、满诸佛愿故令生欢喜十方诸佛虽然都乐意为我们说法，但不要说是受用身，即便是业净凡夫可见的殊胜化身，我们连亲见的缘分都没有，更别说要见诸佛真身现前为我们说法了。因此，诸佛必须显现符合我们缘分之身才能为我们说法。为此，十方诸佛为了我的缘故，变化成师长前来，就像现在各大寺派遣代表一样。我们若能如理依止师长的话，诸佛将洞察这一切并感到喜悦。这一情况如《甘露藏》中所说：如理依止善士时，此时速疾离三有，犹如母见子受益，无余佛陀至心喜。诸佛就像悲悯独子的母亲一样，他们的一切所做，全是为了将我们从生死和恶趣的痛苦中解救出来。所以，当我们能如理依止一切幸福安乐的根本——师长——时，诸佛见到自己的愿望已经实现，因而感到喜悦。二、住师长身受供养故令生欢喜如果我们未能如理依师，那么再怎么供佛，他们也是不会高兴的。反之，若能如理依止的话，如《文殊口授》中所说：诸具此义者，我当住彼身，受余行者供，由彼令欢喜，能净其业障。", "诸佛不请自来，住在师长身中，高兴地接受我们所献的供养。所以，供养诸佛菩萨，只有献供的功德而无欢喜纳受的功德；供养师长，则有献供和欢喜二种功德。己三、魔与恶友不能加害经中说：如理依止善知识者能增长大福德。由于行者的福德增长，所以魔与恶友不能为害。《广大游戏经》中说：具福之人满众愿，摧魔速获大菩提。另一部经中说：于诸具福人，天或魔类众，不能作中断。己四、一切烦恼恶行自然遮止依止善知识，我们便能正确了解何者应舍、何者应取，从而依法行事。不仅如此，那些坐在善知识跟前以及与师长生活在一起的人，也能自然而然地消灭恶行。《华严经》中说：若诸菩萨为善知识所摄持者，诸业烦恼难以取胜。《甘露藏》中也说：于彼恒敬依止者，诸惑恶行自然灭。己五、地道诸德辗转增长以前，仲敦巴与阿麦·强曲仁钦（觉宝）二人认真地服侍觉窝，他们与一心专修的大瑜伽师贡巴瓦比较，看谁的证悟大，结果他们二人的证悟高于大瑜伽师。由此可见，如理依止师长是生起地道功德的最重要因素。", "仲敦巴曾问阿底峡尊者：他在遇到尊者之前所修之法是否入道。尊者以神通观察后说道：“只有你为师长赛尊所做的那些服侍，才算入道。”你们中的一些人或许认为，以上所说只适用于坐在法座上说法的师长，例如授比丘戒的亲教师或授灌顶的金刚阿阇梨等。其实不然，对于在自己寮房中，与自己同吃、同作、同坐的教书老师，我们也应如理依止。有一次，当阿底峡尊者生病而大便失禁时，仲敦巴不顾污秽，亲自用手舀取捧出室外。依此之力，他突然生起他心通，能知道大鹏鸟飞十八天所经的地区，包括蚂蚁在内一切有情的细微心理变化，而且现在名扬十方，被称为“噶当教法的大祖师”。阿底峡尊者在印、藏二地的事业广如虚空，也是完全得力于如理依止师长。所以当知，大德事业的广大与否，也取决于此。洽域瓦·循努沃（童光）依止京俄瓦十分如法，依教奉行。所以，当他有一天外出倾倒垃圾，返回登上第三级楼梯时，突然生起了“法流三摩地”。萨迦班智达最初向杰尊·札巴坚赞（名称幢）请求讲述“师长瑜伽”修法时，札巴坚赞拒绝了，他说：“你只对我作叔父想而不作师长想。”后来札巴坚赞生病时，由于萨班认真地做了护理工作，札巴坚赞才将“师长瑜伽”赐给他。", "从那以后，萨班不再单纯地视他为叔父，而生起了真佛想，结果成为精通五明的班智达。赤钦·丹巴饶杰也是如此，当他经师患病时，赤钦悲痛欲绝，由于他妥善地做了护理工作，因而通达中观正见。普觉·昂旺降巴有一天费了很大周折，才将一包很重的干牛粪送到杰·珠康巴的住处，珠康巴赐给他一颅杯做过加持的陈年“内供”，昂旺降巴饮用后心相续受到了加持，从那之后，他时常生起不可抑制的厌离心。因此当知，地道证悟将依赖于此而得到极大的增长。《道次第甘露藏》中说：地道证德即生长。", "己六、一切生中不缺离善知识博朵瓦在《蓝色小册》中说：故当多方观法缘，观后依止应敬师，后不缺师为法性，诸业功不浪施故。我们若能如理依止善知识，此“造作等流果”将保证我们在今后一切生中不缺善知识。我们现在如能对某位普通凡夫善知识生起真佛想而如理依止的话，以后当能值遇像弥勒、文殊那样的师长，并从之听法。《甘露藏》中说：今生如理取悦师，其等流果于诸生，值遇殊胜善知识，得闻圆满无误法。己七、不堕恶趣如果我们能如理依止善知识的话，师长对我们的呵斥等能消除我们的恶趣能引业，从而不堕恶趣。过去，每当格西堆陇巴见到格西拉索瓦时，总是对他一味地呵斥。拉索瓦的弟子娘摩瓦对此心怀不满，口出谤言。拉索瓦却说：“不要这样讲！师长像这样对我每做一次呵斥，不啻如嘿汝嘎亲做加持一次！”卓贡·藏巴嘉惹说：捶打是灌顶，由此得加持，责骂即猛咒，能除诸中断。说明师长的打骂能消除我们的恶趣业。《地藏经》中说：为彼摄受者，应经无量俱胝劫中流转恶趣所有诸业，然于现世因病疫等，或饥馑等损恼身心而得清净，下至呵责或唯梦中亦能清净，虽于无量俱胝佛所种诸善根，谓行布施或护学处所生者，然彼以一上午即能映蔽。", "己八、无难成办现前与究竟一切利益此节如同依师利益的总结。简言之，如理依止师长是世间、出世间一切功德的根本。从最下不堕恶趣乃至最上成佛之间的一切幸福快乐，依靠师长都能不费力地获得。宗喀巴大师说：一切功德之基具恩主，如理依止乃是道根本。《甘露藏》中说：总之依师于现前，离无暇得天人身，究竟尽诸生死苦，能获决定善妙位。阿底峡尊者说：“我依止的师长虽然多达一百五十二位，但没有一位不放在心上的。”由于尊者的依师法十分出色，所以他在印、藏二地的事业才会量等虚空，获得如此这般的成就。戊二、不依止与不如法依止之过患不依止的过患，正好与上述八种依止利益相反，也就是“不能趣近佛位”等等。不如法依止的过患也有八种。如果我们在决定依止以后，又不如法依止的话，过失将极为严重。所以，我们应该先认真地观察能不能依止某位师长，然后再决定是否要向其求法。己一、若轻毁师长即轻毁诸佛师长代表一切佛的总体前来度我，如果轻视毁谤师长，就是轻视毁谤一切佛。对一位佛尚需视为非同小可的对象，更何况是一切佛呢！如果说法者有说法之心，听者有听法之心，而从说法者处听受一句以上的佛法，这位说法者就是此处所说的“师长”。", "我们通常会十分小心地依止某位名气较大的师长，而怠慢其他像教字母的启蒙老师等，这样做是不对的。例如，杰·珠康巴在对他的启蒙老师还俗一事未生净相之前，不能生起任何证德。《甘露藏》中也说：诸善知识如是说：诸佛事业现为师，不敬师即轻诸佛，有何异熟重于此！《黑仇降阎摩续释难》中引经说：设唯闻一颂，若不奉为师，百世生犬中，后生贱族姓。又如《事师五十颂》中说：于彼思为怙主已，既为弟子若轻毁，即名轻毁一切佛，是故恒常当得苦。己二、若于师长生瞋，即坏与彼刹那数相等劫之善根，并经等量劫生于地狱如果我们对师长发怒的话，经历的时间有多少刹那（最短的时间单位），我们亦将破坏与此刹那数相等劫中所积的善根，并将留在无间地狱中经历同样数量的劫数。《时轮续》中说：瞋师一刹那，即坏一劫善，等量劫中受，地狱等大苦。例如，若对师长发怒有“一弹指顷”，将破坏六十五大劫中所积的善根，并将住在无间地狱中达六十五大劫。因此，假如我们对师长犯有不敬、轻毁、瞋恚等过失，或是令师长感到不悦的话，如果师长尚在世，我们便应在师长跟前忏悔；如果师长已去世，则应在师长穿过的衣服等前面忏悔。", "194掌中解脱菩提道次第二十四天教授藏译《集密根本续》（དེ་བཞིན་གཤེགས་པ་ཐམས་ཅད་ཀི་སྐུ་གསུང་ཐུགས་ཀི་གསང་ཆེན་གསང་བ་འདུས་པ་ཞེས་བྱ་བ་བརག་པའི་རྒྱལ་པྲོ་ཆེན་པྲོ།D81Ca，no.442），同汉译《佛说一切如来金刚三业最上秘密大教王经》卷1：“复次，若有造无间业诸众生类，广造诸恶极重罪已，能起净信修秘密者，亦得一切最上成就。若有众生造杀生业、行不与取、受诸邪染、起大妄语，造如是等诸恶业者，若能起净信解修秘密法，如是等人亦得成就。何以故？诸大士当知秘密法中，若染、若净、若怨、若亲，皆悉平等，若了知者，乃能安住最上大乘秘密法要，是即成就诸佛自性，以如是故于一切法得离疑惑。唯除毁谤阿阇梨者，如是等人设使勤求于秘密法不能成就。”（T18，no.885，p.474a6-15）藏译《吉祥金刚心庄严续》（དཔལ་རྲོ་རེ་སིང་པྲོ་རྒྱན་གི་རྒྱུད་ཅེས་བྱ་བ།D82Cha，no.451）。", "兰达惹的命令稍有违背，致使他在该生中得不到殊胜成就。热穹巴因为三次违背密勒日巴的命令而未获得殊胜成就，据说他要再受生三次才能获得成就。以前，有一位下等种姓的阿阇梨，他有一个上等种姓的弟子，那个弟子具有在空中飞行的能力。一天，当他飞临其师上空，心中想到师长没有这项能力时，便立即坠落地面。班钦那若巴因为忘记师命去和外道辩论，而不能即生获得殊胜成就，只能在中有位成佛。过去里域地区有两位沙弥，文殊本来授记说他们将即生获得殊胜成就，但他们却因为对法王松赞干布生起邪见、心怀疑虑，而未能成就殊胜悉地；取而代之的，是获得了带一袋金子回家的成就。所以，如果我们对师长起邪见的话，生起证悟的时间将延迟，本来能得的大悉地也将变小。此外，我们应当避免与恶友为伍，因为他们能使我们的证德衰退。如今大多数人都一味地贪著现世，所议论的全是现世的事。我们自己也似乎把这些人看作是亲人和朋友，然而他们实际上是恶友。所谓“恶友”，并不一定是披毛长角的鬼怪，而是那些表面上貌似亲密，实际上却使你造不善业及退失善业者。我们绝不能听从那些人，应将他们视为像疯象、虎豹那样可怕的对象，避免与之交往。", "现在常有人对少欲、知足的修行者，说这样一些貌似中听的话：“不要放弃现在的享受，对自己太苛刻不会给你带来什么好的结果。”当知这种人就是恶友！对此我们虽不必严词反击，但在行动上却不可受他影响。己六、此生中为病等不如意事缠绕《事师五十颂》中说：若有轻毁轨范师，便由疫气、伤害病，鬼魅、炽燃或诸毒，增上愚痴而命终。王法、火难或毒蛇，水或空行或盗贼。鬼魅、邪引所杀害，从此堕入有情狱。故于一切轨范师，何时不应恼乱心，若由愚痴而故为，地狱之中定烧煮。诸凡所说无间等，极可怖畏众地狱，一切轻毁轨范者，佛说当住于彼处。如果我们轻视毁谤阿阇梨的话，就是在今生中，也会发生种种不如意的事。（接着帕绷喀大师举了一些实例。比如：过去在印度，当佛智论师有一次说法时，正值其师大成就者帕仓巴来到该地，佛智装作没有看见，后来又对师长妄语说是未见，结果导致眼珠突出坠地。达波·绛贝伦珠仁波切有一个侍者，名叫楚臣（戒），他对仁波切缺乏信心和恭敬，后来在果嘎岭被强盗用巨石砸破脑袋致死。内邬素巴的一个弟子由于破坏三昧耶，所以在临终时出现恐怖景象等等。）己七、后世漂流于无边恶趣《金刚手灌顶续》中说，这是轻毁师长的最大过患。", "虽然在其他经典中，说有许多因造罪而入地狱的事例，但这一密续却未说明轻毁师长者将投生于何等地狱。该续中，金刚手问佛道：“薄伽梵，若有轻视阿阇梨者，彼等当感何异熟？”薄伽梵回答说：金刚手，莫作是语，天人世间悉皆恐怖！秘密主，然当略说：勇士应谛听，我说无间等，诸极苦地狱，即是彼生处，住彼无边劫，是故一切种，不应轻师长。因为薄伽梵考虑到，如果详实回答的话，将会引起天、人世间的恐怖，那些大菩萨也会因悲心难忍而昏倒，所以只概略地说需长年滞留于无间地狱。因此，我们无论如何不能轻毁师长。不要说是自己轻毁师长，就是用眼睛去看那些轻毁师长的人也不可以。（帕绷喀大师举了大成就者林日巴的例子：有一次林日巴说法时，适逢洽译师的一个破誓弟子来到该地，他立即感到口齿僵硬，无法继续说法而中途退场。）己八、一切生中匮乏善知识这与前面所说的依止知识利益之一正好相反。如果遇不到善知识的话，我们将不断地受生在连“法”的名字都听不到的无暇处。简言之，如宗喀巴大师所说：所有现后诸福聚，缘起善成根本者，谓由意乐及加行，如理亲近善知识。世人所有的幸福快乐都是如理依止善知识的结果，所有的不幸失意都是不依止或不如法依止善知识的结果。", "如果我们不如法依止师长的话，不仅使我们在现世中遇不到其他善知识，在来世各生中也将遇不到善知识。《甘露藏》中说：虽百返获善趣身，因彼不敬等流果，生无暇处不得闻，下至“正法”“善士”名。此依止知识法不要说出于故意，即便在不观不想情况下，许多平凡的事，其微细缘起也会导致各种善恶的结果。（帕绷喀大师接着举了一些事例来说明这一点：密勒日巴供养玛尔巴一口空锅属错误缘起，而当他首次与玛尔巴见面时，将玛尔巴赐予的酒全部喝干又属正确缘起。玛尔巴先向本尊顶礼再向师长那若巴顶礼视为错误缘起。由于仲敦巴师事赛尊巴和阿底峡尊者，阿底峡尊者师事金洲，密勒日巴师事玛尔巴均极如法，以及宗喀巴大师在琼波勒巴灌顶室的墙上涂金等，所以后来他们的弘法事业十分广大。）因为依师法具有极大的关要，所以很小的善恶缘起也会产生重大的后果。嘉曹法王最初是带着诤辩的念头来找宗喀巴大师，（帕绷喀大师讲了些嘉曹法王来到宗喀巴大师跟前发生的一些情况，然后说：）“像这样动机虽不好，但缘起极好，以及动机虽好但缘起极不好的情况多种多样，所以我们对此应当小心谨慎。”称说自己师长的名号时，许多人称之为“某某先生”，这样的称呼是不对的。", "在称师长名时，应加上“尊前”等敬词。每当阿底峡尊者称金洲之名时，必合掌赞叹；如果听到别人说到金洲的名字时，他便立即起身以示恭敬。就我而言，虽然不是自赞，但当别人突然提我大宝师长的名号时，心里总是感到极大的不安。（帕绷喀大师又说，如果师长尚在世的话，不可使用“难称其名”一词。）（随后，大师又重述了上面的那些科判，一中一略共两次。）200掌中解脱菩提道次第二十四天教授"]}, {"c": "第八天", "segs": ["意乐依止法宗喀巴大师说：于三有乐不贪著，为暇满义而精进，志依胜者所喜道，诸有缘者净意听。（帕绷喀仁波切引用上述宗喀巴大师的教诫作为第八天教授的前行，以此来纠正听众的听法动机。具体做法是：此颂第一句配合共中士道正见来讲；第二句配合共下士道来讲；第三句配合菩提心来讲。随后大师又回顾了以前讲过的那些科判，并重述了正行“依止知识法”的第一和第二两科。）由于本次法会所依据的科判内只讲了正行应修的所缘，所以我准备在这里再讲一些如何观察善知识的方法，这一法类虽不见于《坦途》与《捷径》科判，但《文殊口授》中有，所以现在依据该论来讲。善知识的德相既然依止善知识有前面所说的那些利益，不依止善知识又有那些过患，那么我们应该依止怎样的一位善知识呢？我们所依止的善知识，必须能引导我们走完全圆道，而不是随便找个什么人就行的。例如，某个人虽然心地善良但功德有限，像这种人是无法为我们引导全圆道的。弟子纵然具足信心、智慧和精进，但如果师长未能了解掌握显密全圆教法的话，这位弟子一辈子将只能修一些片面或单一的法，如归依引导、本尊成就法、风脉修法等。在这种情况下，纵获有暇也成不了什么大利益。", "这就是为什么我们一定要依止一位具相善知识的道理所在。", "关于善知识的德相，虽然传授别解脱律仪者的德相、传授菩萨律仪者的德相及传授密宗律仪者的德相各不相同，但这里所说的善知识德相，是指有开示全圆道次第的能力。师长具不具足德相应该在依止之前观察。这种观察师长德相的做法，不仅那些想依止善知识的人需要，那些想成为毗奈耶、显教、密乘三者善知识的人，也应该自我观察，看看自己是否具有这三者的师长功德，如果发现不具足的话，应该要设法去弥补。单单备齐长寿瓶和沐浴资具，以及仅仅能靠背诵来施行仪轨，算不上是具足德相的师长。在师长的德相中，分别有毗奈耶中所说的阿阇梨德相、大乘共同道善知识德相和密宗金刚阿阇梨德相。在此我主要讲的是大乘共同道师长的德相。《经庄严论》中说，师长应该具足以下十种功德：知识调伏静近静，德增具勤教富饶，善达实性具巧说，悲悯离厌应依止。其中“调伏”是指以戒律调伏身心相续；“静”是指以三摩地息灭散乱；“近静”是指以智慧彻底消灭我执。就像将一块普通木头放在供香盒中会染上香气一样，我们也会熏染上师长所具有的那些功德或过失，因此，我们所依止的师长功德一定要胜过自己。“善达实性”是指以闻所成慧获得正见，此专指应成派见。", "前面所说的智慧，可以是获得自续派以下之见的智慧，所以没有重复的过失。其他德相容易理解，勿庸赘述。如果师长未能具足这一切德相的话，则至少必须具备以下五种：以戒、定、慧三学调伏相续，心怀悲悯，通达真实性。博朵瓦曾经说过：“我的阿阇梨耶巴祥尊，既无多闻也不耐劳，连致谢的话也不大会说，但因为他有上述五种功德，所以凡是在他跟前的人均能受益。", "年敦完全不善于说法，即便是为别人解释供养功德，也没人能够听懂，大家心里在想：不知道他现在在说些什么。但因为他有这五种功德，所以亲近他的人悉蒙法益。”这里所说的“致谢”是指表达自己的满意之情，或是说“谢谢”这类的客气话。然而在末法时代，就是这样的师长也很难得，在这种情况下，我们要记住以下择师要点：所依止的师长应该功大于过；视后世较现世为重；视别人较自己为重。否则的话，我们也许会碰上恶知识，像以前“央具理摩罗”（指鬘）一样，因受邪道知识的误导而犯下大罪。所以，我们首先应该认真地进行观察，如果发现此人值得依止，才可奉之为师。弟子的德相从弟子这方面来讲，如果他具备以下五种德相的话，修法就一定能成功：一、对自宗不贪著、对他派不瞋恚、不堕党执、住于公正；二、具有分辨善恶的智慧；三、有大希求心；四、对师长起大恭敬；五、专心听法。那么，具备这些德相的弟子又该怎样来依止师长呢？戊三、意乐依止法此科分两部分：（己一）根本修信；（己二）念恩生敬。如果我们能运用教理，以“绕边绕山”的方法来修习这二节的话，我们便会产生极大的渴望，想如理依止善知识；不然的话，我们对师长就会只剩下求法的念头。", "己一、根本修信分三小节：（庚一）应观师为佛之原因；（庚二）能观之原因；（庚三）如何观法。这里所说的“信”，是指对师长生起真佛想的信心。在所有“道次第”所缘类中，这与“知母”二科最难生起。尽管困难，但我们还是要努力去修，不然的话，它们后面的那些道就无法在我们心中生起。总的来说，信心是生起一切白法（善法）的基础或根本。《宝炬经》中说：信为前行如母生，守护增长一切德……以前，当有人连续两次请求阿底峡尊者说：“阿底峡，请传教授！”时，尊者一直默不作声。当此人再次大声喊叫时，尊者笑而答道：“嘿嘿，我的耳朵好得很，我的教授是：信心！信心！信心！”又如嘉瓦·温萨巴大师所说：总之开悟之大小，赖修大小信心力，于悉地源具恩师，思惟功德不观过，愿持此教为中心，此誓无碍达究竟！我们能不能生起证悟，依赖于我们对师长是否有信心，以及信心的大小。要想成就最胜悉地，我们必须要具备两个条件：一是具有视师为真佛的信心；二是具有无误的教授。但是即便教授有误，如果我们有信心的话，还是能成就微小共同悉地的。以前有个藏人，到印度向师长求法，师长说了一句印度话“麻里勒札”，意思是“滚出去”。", "此人不解其意，还认为是师长传予的教授，便计数诵持，后来他竟能以此为自己和别人治病。还有一位老妪，她计数诵持“准提天女咒”，将“杂”误念成“巴”，而变成“嗡巴勒布勒绷德娑哈”。然而有一次当地闹饥荒时，她却能煮石而食。如果我们单有智慧而缺乏信心，是不可能达到任何成果的。信心有三种，这里所要修的信心，是指观师为真佛的“澄净信”。关于生起这一信心的方法，我将按照格邬仓父子所传的教授来讲：在第一节“根本修信”中，分“应视师为佛之原因”等三个部分。庚一、应观师为佛之原因应视师为佛的原因很简单：我们都想获利而不愿亏损。如果是为了获利，那么师长是否真的是佛也就无关紧要了，为什么呢？因为视师为佛对我们有很大的利益，能使我们不费力地成就今生、后世的一切愿望等等。例如，有个老妇人因为相信一颗狗牙是佛的舍利，而使狗牙生出真舍利的故事。尽管师长本身的加持有大有小，但从我们自己这边来说，我们怎样来看待师长，或如佛、或如菩萨等等，就会出现怎样的加持，如《蓝色小册》中说：师长加持大与小，不关本身待自己。所以，我们能不能获得悉地，取决于我们对师长信心和恭敬的大小，阿底峡尊者也说：汝藏人不获悉地，乃于师长仅起凡庸想所致。", "反之，如果师长真的是佛，但我们对之不起信心的话，我们也见不到师长的功德，还会遭到亏损、产生种种的痛苦。例如，佛陀虽然有无边的功德，但提婆达多和善星除了见到佛陀有一庹光明外，见不到其他任何功德，从而产生失利的后果。格西博朵瓦说：若不敬诸师，依佛亦无益，如善星故事……庚二、能观之原因我们不仅应该这样来看待师长，实际上我们自己也能够这样来做，因为当我们的心注重于师长功德这方面的话，我们便能消除对师长的不信。纵然发现师长有一些微小过失，我们也可以通过以下二种方法来防止产生不信：一、注重于师长功德这方面，身心为强烈的信心所压倒，使之不能成为信心的障碍；二、将观察过失转化为生起信心的助缘。《金刚手灌顶续》中说：应取轨范德，终不应执过；取德得成就，执过不成就。由于受恶劣习气的影响，我们总是侧重于思惟师长的过失。但是，如果我们能转而注重于思惟师长功德的话，观察师过之心就会自然而然地消失，就像晦日虽有月亮升起，但天空为日光笼罩而看不见月亮一样。又比如，因为我们总想着自己的功德，所以见不到自身的过失。", "即使发现师长稍有过失，我们也可以想，这是师长为了调伏所化所做的善巧方便，这样我们就能将观察师过转化成生起信心的助缘。再者，当我们处在初业行人的阶段时，我们所见到的师长均现凡夫相；获“法流三摩地”时，所见到的师长现殊胜化身相；获初地等时，所见到的师长则现受用身等相。直至有一天，所有的情器也都将显现为“无量清净”。", "庚三、如何观法为了对此生起不可动摇的定解，我们必须依教、依理来加以成立，分四个方面：（辛一）师长是佛乃金刚持所许；（辛二）师长是一切佛事业之作者；（辛三）即于现在诸佛菩萨仍在利益有情；（辛四）自所见相无法决定。辛一、师长是佛乃金刚持所许有人认为：“那些善知识本来不是佛，但我在修依止善知识法时，应该假装这样来看。”这种想法很危险，不应该执著这类错误的思想不放，这是极其重要的。相反地，我们应该这样来思考：“虽然师长是佛，但我却认识不到。师长是佛的原因是：现在金刚持正现师长相住世度化。”《二章续》中说：我于末法时，现阿阇梨身。另一部密续中说：最后五百年，我现轨范相，当知彼即我，于彼生恭敬。以及：未来浊世时，我现凡夫身，种种方便相。经中也说：见有义谛听，我于末法时，当现亲教身，住阿阇梨相。像这样在许多显经、密续中，金刚持悲悯教诫道：未来浊世时，他本人将现普通阿阇梨相出现于世，希望弟子们到时候能认得他，所以不必以为再也无法见到他而感到失意。这些话都是很容易明白的，可以直接按字面的意思来理解。此外当知所谓的“浊世”，就是指现在。", "因此在我们自己的师长中，肯定有金刚持化现的阿阇梨！原因是：我们深深地为业烦恼所苦，对于这些情况，慈悲的金刚持悉知悉见；另外金刚持也知道，现在正是能决定利益我们的良机，因为我们具有能了知取舍处及能修教义的人身等等。再者，当知现在所有的师长都是金刚持的化身，如果不这样看，而对每一位师长都想出一种理由来加以否定的话，我们便会将每一位师长都排除在外，到最后属于金刚持的化身一个也没有，这当然是与上述经教相违背的。在师长中一定有佛的化身，所以当思：只想着师长为什么不是佛的理由而失去认识佛的化身的机会，乃是自己的恶念所致。因此，我们应当将一切师长都视为佛的化身。对那些容易生起信心的人来讲，单讲这些经教即可；如果再用正理来加以成立的话，我们便能获得更大的定解，所以接着讲第二点。辛二、师长是一切佛事业之作者以前在介绍资粮田的时候，我曾经说过：诸佛之意——乐空不二智——在法界中是“一味”的，就像空中虽然只有一个月亮，但却能在有水的器皿中各别映现出影子。在所教化的有情面前，当以声闻身作调伏者，诸佛乐空不二智便现声闻相；当以独觉身作调伏者，便现独觉相；当以菩萨或佛身作调伏者，便现菩萨相或佛相。", "不仅如此，如《父子相见经》中所说：有时现梵释，有时现魔相，饶益诸有情，世人难测度……当以魔或梵天身作调伏者，诸佛乐空不二智便示现魔或梵天相，甚至化现鸟兽等相来调伏有情。诸佛对我们显现普通善知识相，是因为这样做方适合我们的缘分，除此之外，别无其他引导的方法。诸佛纵然对我们显现比普通师长相高级的受用身等相，但因为我们见不到，所以也没有什么意义。其他殊胜化身、菩萨等相，我们也一样没有看得见他们的宿缘。同样地，如果诸佛显现比普通师长相低级的鸟兽等相的话，因为我们对之难起信心，所以也无法利益我们。因此，正如《供养师长仪轨》中所说“从佛三身庄严轮”等，一切佛的三身全部都摄集在师长的三密之中，所以，师长是一切佛的化身或事业的执行者。譬如：一位跳舞的演员，他可以穿上“阿杂惹”装跳“阿杂惹”舞，也可以换上“法王”装跳“法王”舞，除了服装有变化外，这两个角色实际上是由同一位演员扮演的。又如同一种朱红颜料，可以绘画出许多不同的图案，虽然形状不同但本质上都是朱红。我们应该以同样的态度认识自己的师长，当思诸位师长全是金刚持的化身，是调伏我们的一种善巧方便。", "此外，正如艾绒依靠聚光镜方能取火，或是虽获众食若不进口难入腹中，佛的加持和贤善事业，只有通过师长才能得以实现，或者说由于师长能做一切贤善事业，所以师长是一切佛事业的执行者。有人可能会想：虽然师长是一切佛事业的执行者，但不一定就是佛。如有这样的疑虑，我们便应做如下思考：佛的事业，也就是佛利益有情时所做的加持，必须通过师长方能趣入有情的相续。如果这样的话，师长就只能是佛而不是凡夫。不然，一切佛将依赖有情作为一切事业趣入之门，这就变成诸佛要依赖凡夫才能做利生之事。但事实并非如此，佛在利益有情的时候，连那些声闻、独觉和诸大菩萨都不依靠，怎可能依靠凡夫呢？所以，佛陀仅仅是为了使有情能有见到他的缘分才化现为凡夫的。例如，当佛变化成船、桥等物时，我们却以为这些是由木匠建造的。", "正如萨迦班智达所说：日光虽炽热，无镜火不生；如是佛加持，无师不能入。噶举派师长达沃仁钦（月光宝）也说：障云清净时，彼日轮之光，以净镜缘起，能降薪木上。（帕绷喀大师以聚光镜为喻，说明诸佛必须依靠师长，才能使其事业趋入所教化者的相续中。由此可知，如果师长不是佛，诸佛就不会依靠他们，这种情况和“富人和穷人”那则比喻中所表现的意思完全相似；因为诸佛必须依赖师长，说明师长只能是佛。）辛三、即于现在诸佛菩萨仍在利益有情我们可以肯定地说，现在金刚持正以化身在利益众生，为什么呢？因为佛对一切有情的情况悉知悉见、毫不混乱，而且，佛对有情的悲悯要胜过母亲对于独子的感情。所以，他们永不间断地做各种最能利益一切有情的事业；现在也一样。因此，有什么理由说他们不来利益我们呢！再者，诸佛的最初发心，是为了饶益我们，积集资粮是为了能圆满利益我们，成佛也是为了利益有情。所以，他们在成就佛果之后不可能不来利益我们的。如果一切佛不愿利益我们而将我们舍弃的话，那就是一件最糟糕的事了。因此，所有的佛肯定在利益我们。至于利益的方法，则如以下偈颂所说：诸佛非以水洗罪，亦非以手除众苦，非将所证迁于他，示法性谛令解脱。", "除此之外，别无他法。而能作饶益的佛的化身，除了为我们开示如何获得最上利益——增上生和决定善方法——的师长之外，别人是没有资格的。所以格邬仓·绛央蒙朗说：过去佛菩萨，利现在众生，若获真实解，知即具相师。我师长也说：每个有情的头上，都有全体的佛坐着。辛四、自所见相无法决定有人可能又会想：“虽然必须承认师长是真佛，以及是一切佛事业的作者。然而因为我见师长有这样、那样的过失，所以我只能视他为凡夫而非佛。”对此我们应当明白，自己的感觉是不可靠的、也是不肯定的。由于我们视物的标准是受业力控制，又因为我们无法肯定曾经造过某种业和未曾造过某种业，所以在我们的业感景象中，事物存在与否也是不能确定的。例如，《入中论》中提到，“鬼见脓河心亦尔”。它的意思是说：当天、人、饿鬼三者同时看同一茶杯中的水时，因为业力不同的关系，分别见为甘露、水和脓血。而对于那些饿鬼来讲，夏季的月光是热的、冬季的日光是冷的。对《时轮》和《俱舍》各自特别的所化来讲，所见到的须弥山形状分别是圆的和方的。又例如，以前圣无著曾将至尊弥勒视为一条下身腐烂、爬满虫蚁的母狗；佛智论师将阿阇梨“文殊知识”看成是一个耕地、喝虫粥的僧相俗人；", "谛洛巴在世时，周围所有的人都以为他是个打鱼的，根本没人去猜测他可能是个大成就者，那若巴最初见到他时，他正在炙烧活鱼；黑行师也曾将“金刚亥母”看成是一个癞妇。所以，我们能见善知识是人，而不是马、狗、驴什么的，就应当觉得庆幸！京俄·洛卓坚赞（慧幢）说：我等恶业障虽重，见师为人当欢喜；不见犬驴福报大，至心生敬释迦子。不仅如此，如果单凭现象就能裁定诸事，那么既然一切法显现如实有，就应该是实有了，这显然是错误的。（帕绷喀大师随后又举了一个例子说，以前有个比丘，为干渴所恼，外出求水时，由于他像饿鬼一样来看待周围的一切，所以见不到恒河而迳直离河远去。）在这里，我们需要运用《释量论》中关于“不现不可得因”的那些解释，仿照“未见鬼故不能成立无鬼”来立如下之量：见师长即真佛为隐义之补特伽罗相续中，无缘见师为真佛；无见师为真佛之能缘量故。所以，不能亲见师长为佛，并不等于师长不是佛。反之，有人见似真佛不一定就是真佛。以前，当第四代付法师近隐阿罗汉在说法时，“他化自在天魔”前来破坏，近隐将此魔调伏后说道：“因为我未曾见过佛陀，所以你变化成佛陀的样子给我看。", "”于是魔便变化出与佛一样的身体，具有相好等，近隐误以为见到真的佛陀而准备顶礼时，魔的化身就消失了。而以前的那些大成就者，像吉祥怙主龙猛等，在一般人眼里，虽显现为普通比丘相，事实上却是真正的佛。", "不管怎样，当追究过失的心自然现起时，我们不必立即强压下去。譬如，当我们准备洗去衣服上的污垢时，应该先让污垢浮现出来；因此，我们也应该先让这种寻过心显现出来，然后再做如下思考：“不知道我所见的这种过失，师长是真的有还是假的有。”如前所说，这未尝不是一种业感幻相。疸病患者将白螺看成是黄色的；风病患者将雪山看成是蓝色的；坐船有船行木移的感觉；有翳障的人，眼前似毛发乱坠；连这么一点点暂时的幻因都能造成这样的障碍，更何况我们长期以来完全被无量的业烦恼所蒙蔽呢？我认识的一位活佛，有一次外出朝圣时身患疸病，在他寓所里有三个银盒，但他却看成是金的。次日早晨病愈，方见其本相。嘉瓦·温萨巴有一次造访绒区的降钦寺，有几个萨迦派的学者不懂声明学上的难点却在那里辩论，温萨巴便为他们解释有关声明学的知识，并用梵文念了《般若八千颂》。但他们根本不相信他是个格鲁派的“人”，而认为他是个格鲁派的“鬼”。所以，我们应该观察师长的内在断、证功德，而不要去考虑师长的外相。佛的法身，只有佛才能相互见到，连圣者菩萨也无法见到；佛的受用身，只有圣者菩萨能见到；佛相好庄严的殊胜化身，只有“业净凡夫”以上的那些人能见到。", "《道次第·甘露藏》中说：乃至未离恶业障，无量诸佛虽亲临，除此现在所见相，无缘得见相好身。即便佛陀在世时，那些外道徒众也见不到佛陀的妙相等，只见到一大堆过失；提婆达多将佛陀的一切事业都看成是虚假骗人的。虽然我们只能根据自己的程度来看师长，但总的来说，这些还算不坏。果洛阿里上部有个土匪，有一次他去拉萨朝“觉窝”像，却连像前的供灯也没有见到。温·嘉赛仁波切的上一世告诉他必须清净业障，所以他做了“万供”、顶礼和绕佛，后来他能见到供灯，但还是不能见到“觉窝”像。果芒甘珠尔喇嘛·洛桑顿丹仁波切（善慧有义）传《甘珠尔》时，求法者中有一个僧人，既听不到念经的声音也看不到经书，他只看到师长面前放着一盘肉，师长不是在念经而是在吃肉！每天晚上散会时，他见师长将肉收起来走了。像这样的业感景象千奇百怪，所以说，我们见物的层次取决于我们业障清净的程度。我们对现象不可相信，除师长之外，坐在身边的人、朋友、亲戚、就连门口的狗，我们也无法断定他们究竟是什么，他们也许是天神，也可能是魔等。唯一可以确定的是我们自己。所以，离我们一步之遥的东西都是可以怀疑的。", "嘉瓦·温萨巴在即将获得双运位的时候，仍有人给他起绰号，称他为“温萨疯子”。“具誓法王”曾扮作宗喀巴大师的弟子，有一次，当宗喀巴大师准备给一些非器之人传授极为秘密的密法深要时，法王出面制止。坚赞桑波（幢贤）对此心感失望，克珠杰却说不必过分着急。薄伽梵本人也曾说过：我与似我者，方能判定补特伽罗的程度。印度有个沙弥，他听说瓦支格惹岛上的所有男人和女人都是密宗的“勇士”和“勇女”，为此他特地来到该岛探访。当他亲眼见到那些人时，却未能发现他们有什么特别的功德，反而对一个骗子产生了信任！那若苯穹也将至尊密勒日巴视为凡夫、口出谤言：人称密勒日巴者，未见之前名声大，说如印度大成就，待我近前做观察，却是裸卧一老汉！由于我们对那些与我们同吃、同作的亲戚朋友都不明底细，所以不管他们是谁，我们都应生起“净相”，这是利益大而害处小的。我们不能单凭现象来判断某人，以寂天大菩萨为例，当时许多学者都认为他是“三想者”（只关心三件事），发现不了他有任何功德。见某人有过失并不说明某人就一定有过失，我们看事物的方式往往受角度及成见的影响。", "善星比丘将佛如实见到后开示的那些业果道理，视为佛是为了自利而做的欺骗，他也不相信佛能断尽一切过失。像他那样的三藏法师都会被不正确的想法和成见所迷惑，我们自然就不必说了。又如，喜欢睡觉的弟子，往往会不满诵经到深夜的老师；而那些喜欢喝酒的学生，却对贪杯的老师心生欢喜，认为有功德。所以，我们怎能肯定所见到的师长过失就一定不是师长的功德呢？再者，师长的那些过失难保不是为了利益我们的缘故，有意装出来的。如果利生需要，如来可以示现心怀瞋恚或悭吝，以及盲人、疯子、犯戒等各种相。（帕绷喀大师随后讲了《父子相见经》和《大涅槃经》等经典中如何广说的情况。）总而言之，显密教典中虽有了不了义以及是否可如言取义等各种说法，但胜者金刚持承诺自己将来当现师长相而来说法，既是了义的，也是可以如言取义的。除师长之外，无人能为我们开示解脱和一切智道，这一事实便可说明这一点。金刚持说师长是佛，我们却认为不是，而觉得师长这样那样的过失，这些是不定因、相违因，故应运用上面所说的那些能立因，以“绕边绕山”的方式来修，从而认识到师长本来就是佛。", "像这样以教理来成立，从而获得师长即佛的定解，换句话说，如能生起师长与一切佛似乎是合在一起的体验时，便是已生起如理依止善知识的证德。我们的究竟目标是将自心与师意合二为一，也就是在成正等觉时，自心与师意大乐法身二者合二为一。那时，我们便在师长体性中成佛、获师长位，师长的身、语、意与自己三门和合无别。而实现这一目的的缘起关要，便是我们从现在起就应亲近和随顺师意。己二、念恩生敬按照格邬仓父子的口授，分以下四种来修：（庚一）师恩胜佛；（庚二）说法恩；（庚三）加持心相续恩；（庚四）以财物摄受为眷属恩。第一“师恩胜佛”中又分两部分：一、师恩总胜一切佛；二、师恩别胜释迦牟尼佛。庚一、师恩胜佛一、师恩总胜一切佛如上所说，从功德这方面来讲，师长与佛是相等的；但从恩德这方面来讲，总而言之，师恩要比一切佛的恩德还要来得大些。在过去无量劫中，虽有无数的佛在引导众生，但我们却不是他们教化的对象。正如所谓：“无量诸佛未调伏”等，单作为大师释迦牟尼积资对象的佛，就有四万五千、七万六千或七万七千之众。", "不仅如此，即便在本劫中，也有“拘楼孙”（坏生死）、“拘那含牟尼”（金仙）、“迦叶”（饮光）等佛出世，引导无边所教化者，然而他们却不能调伏我们。我们现在的师长，能为我们开示圆满无误之道，纵佛亲临，他们的所为也无过于此。所以，师长在功德这方面虽然与诸佛相等，但在恩德这方面却较一切佛为大。格西博朵瓦说，师长好比是施食于饥饿濒死者的人；诸佛则如向生活本已奢华者再给予一份肉那样的人。诸佛只有在我们抵达较高修道层次时，才会对我们现身和安慰我们，而在我们现在弱小无力时却爱莫能助，就像有人在我们脱贫致富时才布施食物、钱财给我们那样；而师长却能在我们快堕入恶趣深渊的时候，现身引导我们，如同某人在我们贫穷时施食于我们一样。所以，我们现在能生起想获得佛位的愿望，乃是师长的恩德所致。克珠杰也说：大悲胜过一切佛，无等大师前启请。在我们遇不到其他任何佛菩萨的时候，值此匮乏正法之际，只有师长能为我们宣说正法，所以说师长的悲心极大。二、师恩别胜释迦牟尼佛很久以前，有位转轮王名叫“辐辋”，他有一千个儿子。", "当他们发菩提心并各选一个世界作为未来教化之处时，他们发现在斗诤劫中人寿百岁时候的众生很难调伏，于是纷纷舍弃不选，只有大师释迦牟尼的前生——婆罗门“海尘”，发心调伏那些斗诤劫中的有情。所以，对人寿百岁时的所教化者而言，大师释迦牟尼要比其他佛的恩德大，但是对我们这些人连大师佛陀也无法调伏，只能仰赖师长来调伏，所以师恩尤重。在大师佛陀之后，印度出现过许多班智达和成就者，如七代付法师、八十大成就者、六庄严二殊胜等。藏地圣教前弘期中，出有“堪洛却松”、主仆二十五人等；后弘期中出有萨迦五祖、玛尔巴和密勒日巴等、阿底峡尊者父子及宗喀巴父子等智者成就师，但他们都无法为我们直接开示脱离广大苦海的最佳方法——正法甘露。简言之，由于我们过去受生的地点、时间不对，所以那些先德谁都不能引导我们，而将我们弃置了，我们只得留在浊世中最糟糕的时代，正如《入行论》中所说：饶益众有情，无数佛已逝，然我因自过，未得彼教养。因此，我们应当想：“现在这位师长能对我做这样的引导方便，师长的悲心真大啊！", "”庚二、说法恩师长的恩德远不止上述的那些，以前，当释迦牟尼还是菩萨时，他曾为了一个偈颂的缘故，宁愿让凶猛的罗刹把自己的儿子、女儿、妻子和他本人吃掉。当大师受生为乞林嗄哩达王时，为了听法，他的身体被钉上一千枚铁钉；当他受生为嘎那夏瓦王时，为了听法，他的身上竖有一千支灯烛；他也曾为法而跳入火坑；当他受生为妙色王时，为了听法，他剥皮为纸、析骨为笔。阿底峡尊者也一样，他为了听此“道次第”，不顾风暴、摩羯鱼等的危险，在大海中漂浮十三个月，忍受众苦。玛尔巴、密勒日巴等祖师也是为了求法的缘故，历经艰辛。以前去印度的道路不像现在，十分难走，但是那些译师仍拚舍生命前往求法。他们全都以金曼荼罗供养师长，作为传法的报酬，当他们事后回忆起路途的艰辛时，往往战栗不已。我们现在求法不需要受一点苦，师长便为我们开示全圆道之法，纵佛亲临也无过于此。由此可见，师长之恩真是昊天罔极！阿底峡尊者曾说：“你们现在不需要受苦，就能听到这样的深法，福报很大，所以你们应该认真地听法！", "”又如某人因服用药、食、毒三者而濒临死亡时，如果有位医师能使他将所服的毒吐出、将所进的食物转变为药、将所吃的药转变为无死甘露，这样的话，这位医师的恩德是极大的；同样地，我们像吸毒一样造有许多堕恶趣的不善业，对于这些恶业，师长命我们忏除。对于那些为了现世长寿、无病、利敬、声望的目的而造的善业，师长命我们生起善妙动机和做清净回向发愿来加以改变，使之成为能利益我们后世的正法。对于那些为了获得后世增上生和解脱之故所造的善业，师长命我们将之转变为无上圆满正觉之因。所以，还有谁的恩德比师长更大呢？《甘露藏》中说：等同一偈字数劫，供养亦难报师恩；遑论开示全圆道，如是恩德谁能量？又如：如人羁狱受大苦，某人出资赎出狱，令住受用圆满处，当称彼为大恩人。是故诸师于我等，开示解脱恶趣法，暂令随欲而受用，人天富乐施大恩。次善开示无上法，能灭生死诸衰损，导往三身妙果位，此等恩德胡不大？庚三、加持心相续恩我们心中所生的一切证德，是通过祈祷师长等加持我们心相续后所产生的结果，如果我们以“师长瑜伽”作为道之生命的话，我们将取得极大的修道进步，这也是因为师长加持的关系。", "师长加持其弟子心相续的事例很多，例如：当谛洛巴将泥曼荼罗扔在那若巴脸上时，那若巴顿时生起三摩地达七日之久。又如，由于师长的加持，我们现在心里常能想着佛法，这是以前自己所做不到的。", "今年四月廿四日，出现了归依怙主大宝师长对我做加持的妙相，由于师长的加持，方有现在“道次第”等的听讲。以前，当归依怙主大宝师长在达波与二十五位格西共修“会供轮”时，我亦恭逢其会，从开始诵《供养师长仪轨·乐空无别》起，相当长的一段时间中，我一直在流泪，心中生起了不可抑止的出离心，这也是师长加持的结果。如果我们祈祷师长，那么今生、后世的一切善事和愿望就都会实现。大成就者谛洛巴曾说：诸增益最上即师，那若巴！嘉瓦·果仓巴说：修生次虽多，修师为无上；做念诵虽多，祈祷为无上；若恒常祈祷，不退德定至。（帕绷喀仁波切随后又举了几个例子：以前热振地方有个人向仲敦巴像供灯，因而顺利办成事的情况；仲毗巴加持阿底峡尊者的情况，以及珠康巴加持喇嘛降巴仁波切的情况。）庚四、以财物摄受为眷属恩由于现在的这些人很看重财物，所以师长往往先以财物来摄受他们成为弟子，然后再引导他们进入正法之门。我的归依怙主达波大宝师长住茅篷的时候，贡波上部的止美丹喀家族派了一个仆人前来问卦，并带了一包酥油作为供养。由于师长的住处很高，那个仆人爬得疲惫不堪，他边走边骂：“这个师长真和野兽差不多，别的地方不住，偏偏喜欢住在这么高的山上。", "”当他来到师长跟前时，师长赐给他茶、美食及会供面食，由此他转而对师长生起了信心，并从师长那里得到广大加持。所以，真正使那位仆人生起信心而成为师长弟子的，是师长的财物，他说：“这些会供真是美味可口啊！”在寺院中，有无数像这种老师以财物来摄受、教导弟子的事例。阿底峡尊者说：“我所有的功德都是师长的。”这句话的意思是：一切功德仰赖师长之恩才得以出生。在不做观察的情况下，我们总以为现在的安、乐、名三者都是自己一手造就的，其实不然。例如，有兄弟二人，一个进入法门，从而成为另一个的归依境。他可以与其他出家众在寺院中集会，受用应得的正法和财物之分，安住于少事少业之中。然而，他之所以能成为一名比丘，并不是他自己所能做到的，这是亲教师和轨范师授予近圆律仪的恩德所致。我们现在每天能读几百页书，且能观察书中的文义，这是教字母老师的恩德所致。我们现在有机会获得灌顶，进入较佛出世更为稀有的密法之门，如果不犯三昧耶的话，在十六生内我们绝对能得四身果位，而为我们授灌顶、从而在我们相续上种下这种能熟种子的，乃是金刚阿阇梨之恩。如果未得能熟灌顶等的话，那么就连密法方面的书我们都不能看。", "我们应该一边回忆师恩，一边数念珠：“这位师长曾赐我这种恩德，那位师长曾赐我那种恩德……”不仅如此，我们今生所得的人身、快乐、幸福、财富等，这一切是我们前世净戒、布施之果，而这也是命我们这样做的阿阇梨之恩。因此，我们的幸福快乐一概来自于师长之恩德。有人或许会想：“这些并不是出于一位师长的恩德，而是先后有许多不同的师长各自给予我的部分恩德。”但是，一切师长的变化根源——一切佛的心，即乐空不二智，在法界中是一味的。因此，这所有的师长是胜者金刚持一人所示现的不同身相。例如：我们藏地的先祖、制定法规者、翻译佛经者、弘扬主持圣教的王臣、译师、班智达、历辈达赖喇嘛等，这一切全是“莲花手”的化身游戏。所以说，自己的所有师长体性是一。正如宗喀巴大师所说：世间普遍赞说之“师长瑜伽”教授者，应知即是如前所说。单修一、二次所缘境全无所至。我们在修《供养师长仪轨》等师长瑜伽之前，首先应该懂得：自己的师长是一切佛的体性；一切佛是师长的变化游戏。如果我们缺乏这种理解，光念诵文字是不会有任何进步的。", "若能明白一切佛的心在乐空法身中是一味的，以及由此现为师长的道理，我们便能了知百部、五部、三部、一部等一切，都是师长的变化游戏。不然的话，我们恐怕就会只对坐在法座上讲经的、名声较大的师长貌似恭顺，而对寺院中不起眼的教书老师缺乏敬意。如能理解方才所说的内容，我们对一位师长生起的净相便会扩展到一切师长身上。令师欢喜也是如此。同时也将明白，如果自己令一位师长不喜，便是令一切师长不喜，由此我们将意识到一切师长之间的恩德没有差别，在依止法方面也不会产生偏颇。像这样思惟师长的大恩之后，据说最起码我们应口诵念恩文句来加以巩固。善财童子在依止善知识时所做的念恩偈颂如下：我此知识说正法，普示一切法功德，遍示菩萨威仪道，专心思惟而来此。此是能生如我母，予德乳故如乳母，周遍长养菩提分，此诸善识遮无利。解脱老死如医王，如天帝释降甘雨，增广白法如满月，犹日光明示静品。对于怨亲如山王，心无扰乱似大海，如同船师遍救护，善财是思而来此。菩萨启发我觉慧，佛子能生大菩提，我诸知识佛所赞，由是善心而来此。救护世间如勇士，是大商主及依怙，此给我乐如眼目，以此心事善知识。", "《道次第甘露藏》中所说者如下：出离犹如火坑家，效仙人行居静处，得尝正法甘露味，仰赖诸位尊师恩。所遇文殊师长教，百千劫求亦难得，于彼教法生信心，亦是诸位经师恩。是故我视诸师为，救恶趣难之依怙，出生死海之商主，善趣解脱之向导。治惑痼疾之医师，灭大苦火之河水，除无明暗之灯炬，示解脱道之杲日，出生死狱之救星，降正法雨之密云，排忧解难之亲友，恒常慈育之父母。在念诵这些偈颂时，我们应当循文思惟师长的恩德。关于加行依止法，《文殊口授》中将之列于第四加行之末，所以请大家不要将这些不同传承的教授混淆。（帕绷喀大师又说，我们在修“意乐依止法”及以下每一种所缘类之初，均需祈祷和修“甘露降净”，结束时则应对所修内容生起定解。）226掌中解脱菩提道次第二十四天教授"]}, {"c": "第九天", "segs": ["加行依止法及于有暇身劝取心要无等阿底峡尊者曾说：所知类多寿苦短，寿量几何不能知，故如鹅取水中乳，自当喜取己所欲。（嘉杰·帕绷喀仁波切首先援引上述偈颂，作为第九天教授的开场白，对我们略赐纠正动机之法。然后回顾了先前讲述的那几科，又简略重述了一遍“意乐依止法”。）戊四、加行依止法如《经庄严论》中所说：当由财利及承事，并修行门依知识。加行依止法中有下、中、上三类方法。学生在依止教书老师学法时，此三者皆备。所以，对师长如理修依止法，就是修“师长瑜伽”。如果我们与师长共住而作依止的话，便不需另求师长瑜伽所缘；如果我们不在师长跟前，则应生起资粮田，修献浴、礼拜、供养等法。取悦善知识的最上方便，即是如教修行供养。至尊密勒日巴说：我无财物可奉献，然以修行报师恩。以及：坚韧耐苦之修行，是令师喜之侍奉。", "《文殊口授》广、略二派中，均将“加行依止知识法”归入第四加行法，所以这两派在说完第三加行法后，会接着讲“意乐依止法”。在“加行依止法”开始时，会先迎请师长资粮田，再做供养等后三种加行法。这是我们不在师长跟前，或未能与师长共住等情况下，以财物取悦师长的修法。此《文殊口授》派中，加持地基等如前，次诵“谛力颂”。中传派的资粮田观想法如下所述：在吠琉璃地基上，观想绘有金羯磨金刚图案，视之似有突起之状，触之则无凹凸之感。在其中央，观想一座宏大的四方形珍宝宫殿，具有四门，但无牌坊，与药师宫殿相似。宫内中央有一个大狮子座，上有四级，形如无瓶之塔。第一层（最上层）上面，后侧有三个狮座，中央座上坐有释迦牟尼佛，左右两边坐有文殊、弥勒，二尊背后分别为甚深见和广行派的师长。前侧也有三个狮座，分别为阿底峡、俄·勒贝喜饶和仲敦巴三尊之座。第二层上面有三个狮座，中央为宗喀巴大师之座，右为杰·喜饶森格（慧狮子）之座，左为根敦珠（僧成）之座；第三层上有三个狮座，五世达赖喇嘛安住于中央座上，右座之上为赤·金巴嘉措（布施海），左座之上为吉祥师长降巴却丹（弥勒具法）；", "第四层三个狮座上，中央为根本师长，右侧及左侧座上，有人说是观想师长的心传弟子，但根据教授，应观师长之师与师长之师的师长。观想其他师长均坐在锦缎长垫上。这里有二种安置资粮田各尊法：一派是将一切三藏师长置于各层的左右二侧，佛、菩萨、声闻、独觉、护法等置于各层的后侧。另一派则将见、行二派众师长置于各层前方，从各层三位师长的左右侧开始依次排列，其他经、律、论三藏的传承师长观在各层左右侧和后方。这两派都说不必观想本尊等，但如果我们想修的话，可以意想他们以不现身的方式安住在我们面前。此外，应当观想后方各尊面向自己而住，不为狮座所障蔽。", "四门外各有一个浴室，室内中央设有浴池，地基高起，上设与资粮田各尊数目相等的座位。七支等修法与他派近似。南传派的资粮田与此不同，如该派念诵仪轨中所说，在自己面前，观想一个由狮子所擎举的巨大七宝座，共有七层，形似噶当供台。狮子站立在地基上，狮座前方竖有三架梯子。最上面一层带有背扆，像床的靠背一样，其左右二角饰有类似手柄的东西，称为“弯铁箭”。此背扆由珍宝制成，上端饰有宝顶。每一层级各有两个小金梯，左右侧各一。以前提到的三个梯子架在狮座中央的位置。背扆突起的正中为金脊瓶，左右二侧竖有尊胜幢。第一层上，释迦佛所坐的宝座带有背扆，象征六度的龙、大鹏鸟等六灵捧座，敷设五层妙衣座垫。左右两边为文殊和弥勒所坐之座，各敷三层座垫，但没有狮子。前方为现凡常相根本师长所坐的两层座垫，不需另设宝座。右侧和左侧各有一个座垫，分别为师长之师和师长之师的师长所坐。根据口授，观想其他师长均安坐在长垫上。中央留出空地作为通道。现凡常相根本师长的右手结说法印，左手捧托经袱，带有五层函头标签。文殊的左边和弥勒的右边，分别为见、行二派师长。紧接在广大行派后面的，是“道次第派”。", "由于缘起十分重要，所以观想在座次之末各设一个空的座垫。其余在第一层上坐不下的师长，可观想均匀地分散坐在第二层和第三层上；第四层观“教授派”，以京俄瓦为座首；第五层观菩萨众，诸佛分坐在最上面四层的左右二侧；第六层观声闻、独觉众；第七层观护法众。", "《文殊口授》广、略二派是显教规，所以不说观想修行加持派师长，如果我们想要观想的话，可以观想他们以不现身的方式安住在前。此外，这二派也不生起“三昧耶尊”等，而只做迎请宾客的观想。就像我们现在请客吃饭，先设好座位，加持好供品，然后迎请资粮田“智慧尊”前来，就坐于各自的座位上。关于诸尊受邀前来的情形，我们应该像摩揭陀贤女迎请大师佛陀及其眷属那样来做胜解。（随后，帕绷喀大师根据传承规矩，详细地讲述了这个故事。）然后沐浴圣众。浴室与前面讲述的那种不同，呈四方形，四方有四个水晶门，室内没有浴池，但设有许多浴瓶。观想浴室上方为花格窗和屋顶，上面系着装有香泥或香膏的袋子，浴水从香袋中迳直注入瓶中。献浴时放出三个一组的比丘，当圣众就座于前面所说的座位上后，将圣众脱下的衣服收集起来，衣服化为黄光，随后敬献沐浴。其他内容与前面相同。如果我们平时不具备瓶等物品，那么在念加行法时不一定需要修沐浴法。然而，若能时常修习的话，可有清除污秽和不净等功德。其他与沐浴法有关的内容，与以前所讲的《捷径》相同。单作《文殊口授》引导时，应按照上述次第来讲。此派在修心时不收资粮田。", "如果我们想做加行法计数的话，可在最后一座诵《功德之基颂》之前修：不收资粮田，从《供养云陀罗尼》开始重新念，略修的话则单作七支计数。（帕绷喀大师指出，由于现在的教授是与《文殊口授》合讲，所以在此讲解该派的加行法。至于平时的修法，大师建议我们仍按照《加行法·有缘颈严》来修，因为这个法本所具有的加持和甚深教授要胜过其他。）丁三、如何作结行之次第座末修完每一种道次第所缘类时，当念诵释迦佛名号和密咒，以及回向发愿。丙二、座间如何修之理修行者的所有时间全都包含在座上与座间中，所以“座间如何修之理”这一科极其重要。我们在座上修心之后，如果在座间让自心无意义地散漫游荡的话，将大大地损害座上的正行修持。反之，如果我们能善用座间这段时间的话，将使我们的暇满具有真正的价值。所以说，在宗喀巴大师的那些著作及引导文中，将时间分为座上与座间，是具有极大关要的。以此处所说的所缘类为例，我们应该在座间阅读开示依师法的具量经论，如那若巴师事谛洛巴、密勒师事玛尔巴、仲敦巴师事师长赛尊巴与阿底峡等的传记。据说，如果在座间广泛阅读其他各类典籍的话，将导致智慧的败坏。", "比如，看小说会使瞋恚变大，因此我们不要去看这类书籍，应设法使智慧增长。为了防止在座间生起烦恼，我们应当修习“密护根门”，虽然通常的做法，是以不观看会产生烦恼的境等来防护诸根，但对我们来讲不太可能做到，所以我们不妨采用一种较缓和的方法：例如，眼根在看到悦意的色境时，不要让自己的意识随着它转。此外，我们应经常以正念、正知来监督自己的三门，如想详细了解，大家可以去参阅寂天所造的《入行论》，该论中有一品，专门讲如何守护正知的内容。如该品摄要中所说：应数数观察，身心诸状态，仅此简言之，即护正知义。", "这个护正知法很要紧，对自己身体所做的动作、嘴里所说的话、心里所起的念头等三门所做的事，我们都要三思而行。譬如，当我们走进一幢房子，在搞清楚只有两个出口之后，我们只要守住这两个门就能将贼挡在外面。同样地，如果我们能守住自己的三门，不让它们为所欲为的话，也就能将犯过之门关闭。我们应该像格西奔那样来护心。有个故事说，格西奔由于护心而不再吃乳酪，并称自己为贼。如果我们让自心胡思乱想的话，就会像某人做白日梦那样：某人在没有生儿子前，先假想给他儿子起名叫“达瓦札巴”，然后又想象因为跳舞不当而引起儿子的猝死。我们应该遵循阿底峡尊者的话：众中观自语，独处观自心。我们平常总是不依正念做事，而在散乱中造下罪业。在那个时候，就连自己的行为是否构成罪业也意识不到。我们在行走、坐下、谈话当中，常不经意地杀死虱子等虫类。如果当下能以正念提醒自己“不要这样做，这是罪业”，就不会鲁莽行事了。同样地，当与许多人一起谈论事情时，我们应该用部分的心思来观察自己讲的话，想一想“现在我准备说些什么”。如果粗恶语、绮语等快要说出口时，应立即管住自己的舌头。一人独处时，我们应当观察自己的心，想一想“我现在心里在想些什么。", "”由于我们经常忘记护心而不能及时加以注意，所以，更应该保持正念、正知，随时提醒自己必须不忘护心。过去格西喀惹巴像做记录一样，在墙内四周写上“心勿散乱”的标语，而我们之中大多数人却喜欢记着：“某人欠我一两银子未还，应索回。”这类的事来提醒自己，这种做法实在无意义可言。", "所以，这个护正念法是最重要的座间修法。再者，我们在闭关时，切莫一方面在关房门前竖起像雪山一样大的关石，另一方面却一点都管不住自己的心，我的师长曾说：“心修行者在身体的关房内，做正念、正知的闭关。”我们应该这样时刻保持正念、正知，精熟于心不散乱的方法。正如密勒日巴大师所说的：“万有皆现为经书”，我们应该把所见到的一切，视为激励我们修习慈心、悲心、出离心等的劝说者。如以前杰·珠康巴见到蚂蚁啮咬蜜蜂时，即对业果生起定解。当我们去集市的时候，如果生起贪等烦恼的话，那么每走一步便造下一种罪，返家时便背着一袋极重的罪业回家。反之，在我们去的时候，如能认真观察自心并保持正念、正知的话，我们便可发现，集市里有最好的修出离心和无常的劝勉者。以此为表，我们应该将万有都视为修法的鼓励者。（帕绷喀大师又说了“饮食知量”的做法。并指出，我们可以按照《一昼夜修行法》等书中所说，念诵“常施不净咒”做回施饿鬼等法，这些法方便易行且功德极大。）乙二、既依止已如何修心之次第分两部分：（丙一）于有暇身劝取心要；（丙二）如何正取心要之理。丙一、于有暇身劝取心要这部分主要是讲思惟暇满、利大和难得这一类法。", "根据传统，在合讲“讲解引导”和“经验引导”时，有两种方式：一是为生起决定故，稍作开广来讲；二是总结开示修法，以下所有所缘类均应仿照此例。如此处《科判》中所说的那样，除变换正行各科之外，加行与结行等科应按照“依止善知识法”一节中所说的那样来修。我们每天在绮语空谈中度日而毫无惋惜之心，那是因为不思暇满、利大、难得之过。如果我们思惟的话，则会激励我们专心地修法。详细地说，思惟暇满、利大和难得，会使我们生起一种喜洋洋的感觉；思惟死无常，则会给我们带来一种悲切切的心情。这部分分三个方面：（丁一）认明暇满；（丁二）思惟利大；（丁三）思惟难得。丁一、认明暇满这一节又分二小段：一、有暇；二、圆满。想要从有暇身中获取有价值的东西，我们首先要认识什么是暇满。不然的话，就像某个乞丐不知自家炉台实由黄金砌成，最终还是乞丐。所以，我们首先应该对暇满加以体认。一、八有暇所谓“有暇”，是指远离修法的八种无暇。八种无暇，如《亲友书》中所说，即：执邪倒见生傍生，饿鬼地狱无佛教，及生边地懱戾车，性为騃哑长寿天。于随一种受生已，名为八无暇过患，离此诸过得闲暇，故当策励断生死。", "这八无暇包括属非人类的四种无暇以及属人类的四种无暇。第一类属非人类的四种无暇中，地狱有情因为有炎热或寒冷的大苦而无暇修法，正如我们在头部做烧炙治疗时，就算别人要我们修法，我们却因痛苦而无有闲心来修一样。如果我们现在投生在地狱里，所受的苦要比赤热铁锅内的老鼠痛苦大百倍、千倍，所以不要说是修法，就连“法”的名字也听不到。我们的心全为痛苦所占据，除此之外一无所成，因此不可能修法。当思：“我没有生在那样的环境里，真是太幸运了！”如果我们投生在饿鬼中，则会因为受到巨大的饥渴而无暇修法。就像我们在极其饥饿的情况下，纵然师长等人劝我们修法，我们也只顾先求饮食而无暇修法。我们没有生在像饿鬼这样的环境中，实在是够幸运的。如果受生在畜生中呢？我们便会因为呆蠢和愚痴而无暇修法。例如，我们对狗、驴等动物说：“念一圈‘嘛呢’，你马上就会成佛。”它们根本不懂你在说些什么。连念一圈嘛呢都不会，又怎么会懂其他的法？各种动物因为承受各自的痛苦而无暇修法，所以，我们未受生为畜生是极其幸运的。大多数人都以得到几两银子为走运，然而这种事并不值得庆幸。", "当看到狗、驴等畜生的时候，我们不要只观看，而应想到：“我没有变成这样子真幸运啊！”长寿天人居住在无色界和色界广果天的一部分。他们最早受生的时候，心想：“我已受生为天！”最后死亡的时候，心想：“我从天界死去。”除此之外，全在三摩地中虚度时日，就像沉睡一样，最后将毫无意义地死去。其他天人的情况，如《声闻地》中所说的那样，除少许有大善习气的天人外，其他大多数天人终日因欲乐而散乱，不能修法。例如，舍利弗有一位弟子，生前是个年轻的医师，有“药王”的美誉。有一次他碰巧见到舍利弗，便立即从坐骑大象上跳下，献上供养，动作非常地迅速。后来舍利弗在天界中说法，医师因散乱于天界的快乐，只稍稍竖起一指以示敬意，随后又去玩乐，使得舍利弗无从为他说法。天人生不起修法心、出离心等善心，而且只能听一些从天鼓和变化的鸟类等发出的法音，不像我们有师长可以作详细的教授开示。属人类的四种无暇：假如我们出生在懱戾车等无佛法的边野地区，将连“法”的名字都听不到。假如出生在无佛出世的地方，则因为没有佛教而不知修法，我们纵然想修也不会有任何结果。所以当思：“如果我们现在像他们这样的话，该怎么办呢？我们没变成这样真幸运啊！", "”即便出生在有佛法的“中国”，如果我们生来心智不明、口齿不清，是个傻子、哑巴的话，亦不知法应该如何来修，或可能自以为是地修些错误的法。心怀邪见是人道最大的障碍，所以《亲友书》将其列为无暇之首。以外道为例，即便寿命很长，却连念一圈嘛呢的善根也不可能积聚，这不是一件最糟糕的事吗？即使我们有八项意义虽小却难以全数完成的事待做，真能全部完成时，我们都会觉得很幸运了，更何况是八项意义重大、又难以凑齐的条件，一旦凑齐时，我们怎能不认为是极其幸运的呢？二、十圆满圆满共有十种：五种属于自己；五种属于他人。五自圆满，即《声闻地》中所说的：人、生中、根具、业未倒、信处。“人”，是指在成就后世利益方面要胜过其他各趣。我们现在是人当然毫无疑问，但是否做到了人的价值则很难说。“中国”，是依佛法名词所说的“中国”；“生中”，即生于有四众弟子的地方。“根具”，指先天诸根具足，以及没有不适合受别解脱律仪的生理缺陷，如“随欲黄门”等。我们没有生理缺陷，所以“根具”。假如犯有“五无间”罪，今生便不能得阿罗汉果。我们没有犯这种罪，所以“业未倒”。“信处”，原本是说信毗奈耶，但这里也可理解成相信三藏和“菩提道次第”的道理。", "以上这些圆满是自身应该具备的，所以称“自圆满”。我们本身就具备了这五种。五他圆满，即所谓：佛降、说正法，教住、随教转，有他具悲悯。如果佛陀不降临于世，就不会有正法出现。佛陀虽然降世，但要是未说法便入涅槃的话，那么降世便无意义可言。虽然我们现实并不具备这两种圆满（“佛降”与“说正法”），但因为佛陀的代表——师长依然住世说法，所以我们在这个意义上仍具足这两种圆满。教法未衰住世，是指修行的教法，亦即实证圣道。现在是佛教住世十个五百年中的“教期”，虽然佛教已属“教期”，但如果我们心中能生起“证教法”的话，对自己来说，“果教法”依然弘扬。正如噶当派先德们所说：“我们心中虽然没有总体的教法，但我们个人的教法不应让它湮没。”纵然佛教在整体上得到弘扬，但如果我们自心中教法湮没的话，便是个人教法的湮没。目前佛教不仅依然住世，而且我们还能进入圣教。显密双运、见行清净的宗喀巴大师教法，汲取了印度及藏地新、旧各派的精华而扬弃了所有的杂质。由文殊怙主亲做整顿的教法，犹如净化过的纯金，我们能遇到这样的教法实在是难中之难。此外，这一教法的显密法类中，还具有空前未有的善说。", "达仓译师在后半生中，因意识到宗喀巴大师教法的殊胜而心生感动，为此写了一篇赞颂，将那些殊胜点透彻地表达出来。关于宗喀巴大师教法的显密法类如何胜过其他宗派的情况，如果要详细说的话，讲上许多天也讲不完。以前有个蒙古人，向班禅仁波切供养后，发愿后世能获得人身、遇到佛教，班禅仁波切说这都能办到。当蒙古人发愿想值遇宗喀巴大师教法时，班禅仁波切则未置可否。我们现在不仅遇到了这样的教法，而且还没有其他的违缘，例如，我们能轻易地“从有家到无家”而出家等，所以具备了第四种他圆满：“随教转”。只有像优陀夷比丘那样的人，才真正具备《声闻地》中所说“亲见他人证得四果的任何一果而入佛教”等的四种他圆满，这些条件连怙主龙猛也没有。但如“证期”中的人对获四果者心生仰慕那样，如今我们也可以仰慕大德高僧的懿行作为替代，所以我们现在仍能具足这一圆满。第五种他圆满：“有他悲悯”，是指具备施主等顺缘、便于修法，这一条件我们也是现成的。假设我们今生计划要完成十八件大事，到头来或许只可能完成其中的一些，但若想全部完成则极为困难。", "我们现在却做到了比这个更为困难的事，前世所发的十八大愿：“这十个要有”“这八个不要有”都实现了，八有暇与十圆满我们全都已具足。", "丁二、思惟利大这一节又分三小段：一、思惟观待现前利大；二、思惟观待究竟利大；三、思惟下至每一刹那亦为利大。一、思惟观待现前利大如果我们希望后世不要生于恶趣，而生于善趣的话，那么不管哪一种天、人果位，这个暇满人身都能为我们办到。成就善趣之身需要戒，而此身即能持戒；善趣受用之因为施，此身也能布施；眷属圆满之因为安忍，这也需要靠现在这样的人身来修。因此，如果我们想要成就任何的善趣天、人身和幸福快乐，除非不修，修是必然会有成就的。如果我们后世想成为梵天、帝释、转轮王，暇满人身也能办到。不仅如此，其他像八种异熟功德、善趣七功德身、大乘四轮妙身等，也均能成就。往生极乐、香巴拉等净土的因，此身也能修成。以前，隆睹喇嘛在世的时候，他连碗里的糌粑也不贪著，住在茅篷里修法使暇满具有意义。他修足了后世受生为香巴拉王的资粮并且也发了愿。为了确定起见，他向班禅贝丹益西寄上一份供养，并在附函中问道：“我的愿望可否实现？”班禅知道他的意思，于是回信说：“老喇嘛野心真不小，但是你的愿望可以实现。”二、思惟观待究竟利大为了成就解脱，我们必须要依靠能成就的法——三学道。", "三学之首是戒，以别解脱律仪为例，它要靠出离心才能生起。但天等其他各趣之身难以发起出离心，俱卢洲人也不适合受戒，其他三洲中，以赡部洲人最为殊胜。菩提心也以人身所发起的最有力，《弟子书》中说：广大心力人所获得者，此道非天龙得非非天，妙翅持明似人腹行得。密宗律仪的情况与此相同。往趣一切智的工作，以此身来做，力量最大、最好。不仅如此，初业行人以密宗道于一生中即身成佛之身，也必须是“业地”赡部洲具有六界的胎生人身。这个条件我们已经具备。我们发愿的对象通常是极乐净土，而极乐的菩萨们却发愿要受生到此洲来。所以，我们只是男儿不自强罢了，事实上，再也没有比我们现在这个人身更好的修法之身了。据说“觉窝”像里有一个“需求普应”的摩尼宝，当它转到佛像的膝盖时，在那里祈求的人定能满愿。于是，有些人便对着佛像的膝盖发愿。然而，即便我们获得数十万个“需求普应”摩尼宝，拿它们当枕头或是护腮，它们也无法使我们在死时不堕恶趣，但我们这个人身却能为我们实现这样的长久目标。与嘉惠我们一天的摩尼宝相比，能嘉惠一百年的摩尼宝自然要来得殊胜；同样地，能为我们成办究竟安乐的，就是我们现在的这个人身。", "我们每个人都因为不去修法而不能成就，其实至尊密勒日巴所获得的人身我们也同样有。密勒日巴的身体同我们的身体相比，并无孰优孰劣之分。看一下至尊密勒与龙王二者的差别，我们便可明白：虽然龙王的库藏里如意宝堆积如山，头上挂满摩尼宝饰等，却连投生恶趣的门都无法关上，更遑论是成佛的因了。反过来看看密勒日巴，他虽然穷得连糌粑都吃不上，但却因为获得宝贵的有暇身而即身成佛。", "（帕绷喀大师又举了京俄瓦的例子：京俄瓦为使暇满有意义而精进修法时，大瑜伽师劝他松缓一些，但他回答说：“我之所以这样做，是因为觉得暇满太难得了。”大师说，我们也应该具有这样的态度。）所以，如果我们把这样的人身浪费掉，实在是太可惜了，就像一个乞丐得到满满一袋金子，却连一分钱也不用就将它扔掉一样。三、思惟下至每一刹那亦为利大在上述两种利大之外，如再加上书中未明说的教授：“每天与每刹那之利大”，获益会更大。如果我们连一炷香的时间也不浪费，且精进于积资、净障的话，我们将成办无量解脱与一切智的因。我们对虚耗我们的暇满从不感到惋惜，却对损失一、二块银元长吁短叹，这是错误的。圣马鸣说：如商至宝洲，空手返家乡。正如我们到了宝洲不取珍宝，反而欠债空手而归一样；如果我们在侥幸一次获得暇满身时不去修法，反而造尽罪业堕入恶趣的话，那是再可惜不过的了。丁三、思惟难得这一节分三小段：一、由因之门思惟难得；二、由喻之门思惟难得；三、由体性之门思惟难得。一、由因之门思惟难得如上所述，我们所获得的暇满身具有极大的利益，不仅如此，它还极其难得，不是常常能得到的。", "如果不是那么难得，我们现在尽可以将它浪费了，等以后得到时再努力使之有益也未尝不可。然而，现在的这个暇满，是需要凑足很多因缘才能得到的，因为福报和愿力的关系，我们才这么幸运，以后是否能再得这样的暇满，那就很难讲了。过去有位蒙古喇嘛在讲暇满方面的法时，有个汉人对他说：“师长！您大概没去过汉地吧？我们汉地的人多得很呢。”我们不应该有这种邪见。虽然从总体上来讲，人是有很多，但如果自己要堕恶趣的话，再多的人对你也没有帮助。我们今后是否再得暇满，取决于暇满的因具不具足，对此我们应该以比量来做推断。举例来说，外界秋收的青稞、麦子，即使只有一把那么多，它们的生长也必须依赖春季的播种。如果不下种子，要长出一盆子鲜花是不可能的。同样地，暇满也必须多种因的聚集才能获得。总的来讲，仅仅为了获得像天之类的善趣身，也需要持一些戒。至于能获暇满身的因，则如龙猛所说：“戒乐施受用”，及《般若经摄颂》中所说：戒断多生傍生体，及八无暇常得暇。我们必须以净戒为基础，以布施等为助缘，加上不染贪著现世的无垢净愿，方可获得暇满身。据说，能布施而不持戒者当生为龙，能持戒但不布施者将生为乞丐等。", "我们不做观察时，总以为自己的戒似乎还清净，但正如以前一位蒙古格西所说的那样：“有律仪时无毗尼，有毗尼时无律仪。”如果认真观察的话，我们可以发现自己连一条觉得心安的戒都持不好。我们心里想的全是烦恼，做的全是罪业。如果我们连密宗戒与菩萨戒的根本堕、恶作的条款都不知道，就不必再谈什么持戒了。像这样没有能获得暇满的因，却梦想有暇满的果，不啻如春天里播毒种，却想在秋天收谷子一般。不仅如此，如《入行论》中所说：虽刹那作罪，尚住无间劫，况无始生死，作恶岂善趣？如果造一种罪业也能把我们引入恶趣的话，我们相续中从无始以来积集的罪蕴，多如国王的库藏，在这种情况下，我们怎可能有继续获得善趣身的希望呢？我们有些人的想法是：“仰赖大宝师长的恩德，我的来世大概不会差到哪里去吧？”但是假如我们自己不去修法，大宝师长根本帮不了忙，就像佛陀也无法救护他的堂兄提婆达多免于堕入地狱一样。那些将难得一次获得的妙身白白浪费掉，又指望再得暇满善加利用的人，如同一个乞丐将已得的一袋金子扔进河里，却发愿想再得一袋金子享用一般。不为现世发愿是很难的，我们在拉萨“觉窝”像前发愿时，总是先想到长寿、无病和开运之类的事。", "所以可以肯定地说，我们大多数人不会利用此身来修清净的正法。《入行论》中说：我以如是行，人身且不得，人身若不得，唯恶全无善。如果我们现在不去修法，将来堕入恶趣之中，又会以该身成办更多恶趣的因，结果没完没了地在各种恶趣之间流浪。信心、智慧、出离心等善品一点都没有；贪、瞋、我慢等能造不善业的烦恼却一应俱全。大家看一下狗的例子便可了知。投生到恶趣之后修人身，要比用此身来修成佛困难得多。我们现在得到的这个人身，就像已拉到半山腰的大铜球一样，即便我们无法再从半山腰往上拉，也应设法使它不滚落下去。如果掉下去的话，我们要将它再送回半山腰，又是一件艰难的事。我们此身中即便生不起解脱、一切智等上道的证德，至少也要做到不堕恶趣。如果失去暇满，一旦堕落下去，我们将不断地在恶趣中游荡，几乎没有解脱的机会。我们一旦走岔，就会越走越远；所以应该小心，不要在此生人身上做错事。自己不去修，将来就会堕恶趣，如果肯去修，纵然年迈也不必灰心；我们当效法“福增长者”的故事。二、由喻之门思惟难得如博朵瓦《喻法集》中所用的譬喻“房顶草、龟颈”等，总而言之，善趣身多如山谷中繁茂的草，而具足暇满身者，则如房顶上疏落的几根草。", "所谓“龟颈”的情形是这样的：譬如大海中有一只盲龟，每过一百年才从水里探出一次头，而海面上有一段带有一孔的金牛轭随风漂流。对这只盲龟来讲，它的头正好套进轭孔的机会几乎是没有的。我们这些人在生死大海之中，因为受业与烦恼的控制而睁不开慧眼，大半在这个恶趣与那个恶趣之间流浪，即便可能侥幸从恶趣中解脱，在人间须臾受生，恐怕也极难遇到佛教，因为各个广大世界的各个地方不一定都有佛教弘扬，就像漂荡不定的金牛轭一样。如果这只龟经常游出海面的话，或许还能碰到金牛轭，但它每过一百年才会探一次头。以此为喻，如果我们常常获得人身的话，也许有一天我们能遇到佛教出现，但事实并非如是，我们只有偶尔一、两次的机会获得这样的人身。如果金牛轭老是停在一个地方，海龟偶尔浮出水面，也许真能碰上；但这段金牛轭并非久留一地，而是在巨大的海面上居无定处地漂来漂去。以此为喻，如果佛教能在一个世界中久住的话，我们在得人身的某个时候或许能与之相遇，然而佛教并不留住于一个世界，即便住世，时间也极短暂。像这样海龟与牛轭相遇的机会，不能说没有，但是微乎其微，然而获得暇满人身比之更难，可谓绝无仅有。", "这个譬喻的意义是：大海为生死处，海龟为人身，眼盲为无明，牛轭为佛教等。（帕绷喀大师说，这样子配合来思惟难得，是珠康巴大师的语教传统。）（大师又解释了博朵瓦《喻法集》中的另一个词——“洛定子”。）以前仲·洛定家族有一个青年，他懂得掘金之道，后来放弃掘金，到谢区做买卖。当地人知道他的声望后，都对他说：“愿我即彼洛定子，愿我能掘黄金山。”他闻言打消了经商的念头，复萌掘金之心。同样地，我们所获得的这个妙身，本是极乐世界众菩萨发愿寻求的目标，我们却将它无意义地耗费掉，实在是太可惜了。又有所谓“藏鱼”，说的是以前有个后藏人来到前藏吃鱼，一下子吃太多了，差点呕吐出来，他觉得将这等美味吐出来有点可惜，于是将自己的咽喉勒得紧紧的。如果我们对吐出少许美食都觉得可惜，那么对无意义地丢弃多劫难遇、侥幸一次获得的人身，怎不感到惋惜呢？所谓“虫礼”，是说佛像面前地下有一条红色虫子爬出来，并口称“敬礼佛”，这种事相当罕见；同样地，我们从恶趣的地下爬出来，化作人形而装作闻思正法的样子，这种情形也是少有的。我们应该如此这般地运用各种譬喻来思惟：我们所获得的暇满身，是极其稀罕与难得的！", "三、由体性之门思惟难得众生因为造恶的多、行善的少，所以从善趣和恶趣死殁后，前往恶趣的极多，投生善趣的极少。因此，《毗奈耶事教》中说，从善趣往恶趣及从恶趣往恶趣的，量如大地之土；从恶趣往善趣及从善趣往善趣的，量如用指甲尖挖取的土。总的来说，六道之中，人趣数量极少。饿鬼比地狱少，畜生比饿鬼少。畜生里面，生活在地上的比生活在水里的少，然而在容纳不下十人大的地方，就有上亿个虫蚁。“中有”数量也很多，例如，一匹马死后不久，尸体内便会生出成千上万的虫子，一百匹马死掉的话，便会有百倍的中有将受生为虫子。能够受生为人，又能生在有佛出世的“明灯劫”中者，为数甚少。在许多万个“黑暗劫”之间才有一个“明灯劫”。即便在每个“明灯劫”当中，空、成、住、坏四劫各有二十中劫，共八十中劫。其中三劫的六十中劫中，无佛出世；住劫二十中劫之初，人寿可达无量岁的时期，以及寿命增长时期，佛也不出世，佛只在寿命递减的时期出世。“中间增减”期虽有佛出世，但如果我们受生在前佛已现涅槃、教法湮没，而后佛未出世的那段期间，这其实和“黑暗劫”没什么区别。我们现在受生在赡部洲，幸好不是这个阶段。", "释迦佛教法湮没至弥勒佛出世的时间间隔，据说为人寿四十九亿岁，我们也没有受生在这样的黑暗时代中。现在虽然有佛教，但佛教只存在于这一洲，我们正好生在这个洲内。这一洲内佛教弘扬的地方，只有西藏、蒙古等几个最小的地区。我们便是受生在弘扬佛法的大本营——西藏。至于西藏的情况，以前格桑国师曾说：“我所属的安多拉卜楞寺，出家众有一、两千人，其中格西约五百名，经商的约五百人，二者都不是的也有五百多人。”像他所说的那样，我们每家如有兄弟十人的话，只有两、三个人能入佛门，其中能修习“道次第”等清净法的，为数更稀少。我们幸好未受生在这种身不由己的地方。（帕绷喀大师说，除此之外，根据我师长的口传教授，三种思惟暇满为何难得的方法是：一、“因”难成办故暇满难得；二、“体性”难凑全故暇满难得；三、“喻”难出现故暇满难得。）所以，这一暂时获得暇满身的机会，便是决定久乐或久苦，以及上升或下堕的分界线。这一选择权就在我们自己手上，不需要仰赖他人，因此我们应当对自己未来的苦、乐做出无误的选择。如果选择错误，那就不是只影响一、两天的小事，而是影响到生生世世长远目标的大错。", "所以，我们应该告诫自己：“从现在起我还有一段时间可以活，真是太好了！在我生命剩下的这段日子里，不管是两年、三年还是多少年，如果再不夜以继日地苦修正法，我是否还有足够的勇气回到恶趣中去？”我们侥幸一次获得的有暇身，如同十八种无价的珍宝凑在一起，所以最重要的是不可“入宝洲而空返”。譬如有个人到达宝洲后，不去取珍宝，而是以歌舞耗时，并且还向其他商人借了很多的债，最后取不成珍宝，反而负债而返。这个人不是疯子是什么？同样地，我们现在这个时候，正是求取解脱和一切智珍宝的最佳时候，如果我们不去求解脱和一切智，反而去修恶趣因的话，还有比我们更自欺或更愚笨的吗？正如寂天所说的那样：得如是暇已，我若不修善，无余欺过此，亦无过此愚。我们这个侥幸一次获得的暇满身，即便在短至一碗茶的时间内，也能用来做积福、净罪等事。因此，我们应该利用它来取心要：最好的是力求即身成佛；不然的话，也应力求获得解脱；再不然，至少也应努力保证使自己来生不堕恶趣。", "虽然师长善知识如实开示了前往解脱和一切智之道，但是如果自己不去修的话，就像高明的医师虽然给予许多药品，而患者不去服用，终究也治不了病一样，《三摩地王经》中说：受其珍贵众良药，若不服用疗病药，非医致使非药过，唯是病者自过失。如是于此教出家，遍了力根静虑已，若于修行不精进，不勤现证岂涅槃？经中又说：我虽宣说极善法，汝若闻已不实行，如诸病者负药囊，终不能医自体病。《入行论》中也说：此等应身行，唯言说何益？若唯诵药方，岂益诸病者？（帕绷喀大师总结说，想不想按照师长所开示的教授去修，完全取决于我们自己。所以，我们应该将余生全部用于修法，努力使我们的暇满具有意义。然后，大师又将上述内容重讲了一次，并简略开示了修所缘法。大师接着说，启请顶上师长及展开科判而修照前。由此生起证悟的标准，如格西博朵瓦所说：若知暇满难得理，岂有邪行安乐住？及如宗喀巴大师所说：若知难得无劣住，若见利大惜无益，若思惟死虑后世，若思业果遮放逸。又如吉祥贡巴瓦一心修法，连拔火棍粗细的柽柳刺入腿中也顾不得拔出来。如果我们能做到这样的话，便是生起了暇满、利大和难得的证德。）252掌中解脱菩提道次第二十四天教授"]}, {"c": "第十天", "segs": ["死亡无常（嘉杰·帕绷喀仁波切首先引用大智者成就师——根敦丹增嘉措（僧伽持教海）的话说：此是具量经论心，非是臆造虚妄法；此是大车之论典，非是愚者之言谈；此是智成之觉受，非是眩翳之幻相；此是无上菩提道，非是可畏悬险地。并配合介绍所说法的殊胜，简略地告诉我们改正动机的方法。然后回顾了前几天已讲述的各科，并且又将道之根本依止善知识法“加行依止法”之后的内容重述了一遍。）在座间，我们应该多阅读开示“暇满”法类的书籍。在思惟暇满、利大和难得之后，我们对人身会生起取其心要的愿望，此时便可开始以“三士道次第”来修心。随着在三士道中修心的程度，我们依次可取小、中、大三类心要。如果我们想获得佛位，就必须依次生起前后各道才行，因为前面的道没有生起，后面的道也就无法生起。以康巴人朝“觉窝”像为喻，他们先以“觉窝”像为目标，离家出发，依次行经各站，最后抵达目的地。除此之外，是无法一蹴而就的。同样地，如果下面的出离心等未生起的话，上面的悲心等道也是生不起来的。《入行论》中也这样说：先前如是心，自利诸有情，梦中尚未梦，何能生利他？", "所谓“下、中士道”，意思是指在下士和中士共同的“道次第”中修心，而不是在下士和中士的正道中修心。譬如说，现有三人分别前往札什伦布、陇和曲须。第一个人的目的地虽说是札什伦布，但他也必须和其他二人同走一条路。当其他二人到达目的地曲须和陇后，他则继续前往札什伦布，而不停留在这两个地方。因此，在“道次第”中，即便在修下、中士道的时候，我们的目标也应锁定在“为利有情愿证佛位”上面。所以，发心是正行，共下、中士道是发心的前行。有人或许会想：“那么，从一开始就讲上士道好了，何必另立下、中士之名呢？”当知这样讲有两个目的：第一，为了使那些无法在上士道中修心的人能渐次修心，所以让他们先从下、中士道学起，这样能广益上、中、下不同心力的人士。第二，某些人对前行道不熟悉，连出离心都未在相续中生起，却自夸为大乘人和密宗师，为了摧伏他们的增上慢，所以这样子说。为了生起菩提心，我们必须先生起对他人的苦难深感不忍的悲心；为了生起悲心，我们必须先了解自己是如何受苦的。为此我们需要先了解一切生死的自性是苦的，在这之前，我们又先要对恶趣的苦心生恐惧，因为如果不害怕恶趣，也就不会对天、人的快乐心生厌离。", "所以最初应在共下士道中修心，它就像是房屋的地基或垫石一样。我们无法像已获证悟者那般可以越级证果。杰·密勒日巴早期也在玛尔巴跟前学共同道，他的许多证道歌都与此有关。不仅如此，密法的迅捷特色也必须依靠“道次第”才能体现起来，《坦途》与《捷径》的书名便反映了这一情况。密勒日巴能即生成就双运，并不是单靠密法，当知他在前世已将三士道全部修完。《最初修心》等文章中说，他的前生是噶当派大德洽扯却。", "（帕绷喀大师说，虽然应该先修共同道，然后入密宗之门，但我们却不按部就班，往往是一开始就学密宗。在不守护三昧耶的情况下，纵然我们看起来好像能修二次第，实际上却与求生金刚地狱等无差别。）因此，我们必须从一开始就纠正态度，并生起宏大的心量：“如果需要的话，即便一个所缘类，我也要花毕生的时间去修！”然而我们却时常都倒着来，往往对俗事怀着大的心量，对佛法反而轻忽了。对俗事不必多虑，对佛法则应多多用心。“没有修不成的法”，如果我们具有这样的信念，并努力实修的话，那么用不了数年或数月的工夫就能修成一个所缘类。格西迦摩巴曾说：汝言思而不生，汝于何时思耶？昼日散乱，夜则昏睡，汝勿说妄语！我们的情形比他说的更糟，我们连一个完整的所缘类都没有在一座早课内修过，却在抱怨为何还生不起证悟，这是绝对错误的想法！有些人没有“骨石相遇”般脚踏实地的修持，只是在念诵一、二遍《功德之基颂》时装模作样地闭闭眼睛，就指望能生起“菩提道次第”的体悟，这种愿望太不实际。噶当派的贡巴仁钦喇嘛（修宝师长）说：眼光要放远一点，心量要放大一点，情绪要放松一点。意思就是说，我们的眼光要放远些，把目标锁定在遍智佛地上；", "对于下、中士道，心量要放大些；修法时，情绪要做到松紧合适；即使平日的行持也要做到松紧有度。我们有时听师长说法，会生起不可抑制的出离心，急切地想修法，但没过几天，又照常胡作非为，这是不究竟之相。", "丙二、如何正取心要之理本段分三节：（丁一）于共下士道次第修心；（丁二）于共中士道次第修心；（丁三）于上士道次第修心。丁一、于共下士道次第修心此节又可分两方面：（戊一）发起希求后世之心；（戊二）依止后世安乐方便。戊一、发起希求后世之心此又分两部分：（己一）此世不能久住而念死；（己二）思惟后世二趣苦乐如何。己一、此世不能久住而念死分三部分：（庚一）不念死之过患；（庚二）念死之利益；（庚三）正念死之理。庚一、不念死之过患分六小节：（辛一）不念正法过患；（辛二）虽念不修过患；（辛三）虽修不净过患；（辛四）修不殷重过患；（辛五）自谋不善过患；（辛六）临终时将追悔而死过患。辛一、不念正法过患如果心里不念及死亡的话，我们就只会考虑现世的种种需要，整天为衣、食等忙碌，妨碍我们去修佛法。反之，若我们能认真地念死的话，便会一心一意地为后世做准备。就像准备出发的康巴香客全力打点行装一样。我们对现世的衣、食、名三者有如此大的贪著，也是因为不念死的缘故。如果不以忆念无常来指导我们，我们哪一天不念死，哪一天就会流于现世的经营。辛二、虽念不修过患宗喀巴大师说：此复仅念今后边际定当有死，虽皆共有。", "然日日中，乃至临终，皆起恶念：今日不死，今亦不死。如果不念死的话，我们的心老是执于不死，而一味地推延修法的时间，心里想：“明天修好了，后天修好了。”像这样纵然念及佛法也无法去修，心怀散乱，总是惦记着发财等事，永远没有修法的机会，就这样耗去一生的时光。辛三、虽修不净过患虽然我们这些人都在修法，但修的都不是清净的法，因为我们不能克服现世的虚荣。我们所做的闻、思只是为了想作个学者或求名；禅修、念诵也多半是为了要消除现世的违缘；不见访客的大修行者，目的也在于求名等等；不掺杂罪行的修行几乎一样也没有。曾有人请问阿底峡尊者：“只考虑现世的人会有怎样的果报？”大师答：“果报也只有那样。”又问：“会有什么样的后世呢？”答道：“地狱、饿鬼和畜生！”只求现世的果报是：今生能成就一些小利，后世则堕恶趣。这样的话，我们和那些在家人就没有任何差别了。修法首先要舍弃现世，但这并不意味着我们必须要成为乞丐，因为乞丐不是为了舍弃现世而去流浪，我们要舍弃的是“世间八法”。凡掺杂世间八法的，就不是正法。瑜伽师洽扯却曾逐一询问阿底峡尊者说：“我去修行好呢？去讲经好呢？还是边修行、边讲经好呢？”尊者回答说这些都无益。", "他接着问：“那么，做什么才好呢？”回答是：", "“舍弃现世！”嘉玛瓦说：佛法修持一无成，汝愚自矜为佛徒，修法首须舍现世，当观自心之有无！堆陇巴曾对人说：“老兄！布施固然不错，但修法更好！”这些都说明，佛法与世间法是对立的。博朵瓦也说过：“有两个尖头的针不能缝衣。”如果不念死，我们就不会有舍弃现世之念；如果不能舍弃现世，得利时便高兴，不得利时便沮丧；对于苦、乐、称、讥、赞、毁的反应也一样，如此，终为八法所控制。“八法”即龙猛所说的：利无利苦乐，称无称毁誉，了世俗八法，齐心离斯境。（帕绷喀大师接着又讲了某人向博朵瓦献绿松石的故事。）林日巴也说：生死分别城邑中，世间八法僵尸游，此即可畏尸陀林，师当于彼修等味。因此，我们应该舍弃现世，做到“心极法依止”。倘若对生活有所顾虑，就应想：“即便不富裕也可以。”这样即能做到“法极穷依止”。我们的大师释迦佛从有家到无家而出家时，抛弃一切王室的荣华富贵，改穿从垃圾堆里拾来的衣服等等，就是“心极法依止”和“法极穷依止”的榜样。宗喀巴大师也一样。做到“法极穷依止”之后，我们或许又会想：“我会不会因为找不到粮食而饿死呢？”这时候应想：“如果我会为修法苦行而死的话，死就死吧！”如此才能做到“穷极死依止”。", "虽然我们应该有这样的决心，但事实上修行人因断粮而饿死的事从未发生过。具足大恩的大师佛陀将能够受生转轮王六万次的福德回向给我们，所以，即便世间发生饥荒，世人用珍珠来交换等量面粉的时候，佛陀的弟子仍不会饿死。正所谓：若大修行不下山，面团自会滚上坡。格西奔也说：我作白衣的时候，虽然带着像刺一样多的箭、刀和矛，但仍然感到仇人很多，不够防御；因为我一个人能敌四十人，人们就给我安个绰号叫作“吓四十”。我虽然白天上山打劫，晚上来村里行盗，但衣食仍感不足。现在呢？自我修法以后，衣食不再匮乏，仇敌自然消灭。又所谓：若弃贪如尸，妙欲降如鹰。（帕绷喀大师又提到说，宗喀巴等先德事业大如虚空，也是因为舍弃现世、如法修行的结果。有一位萨迦派人士还以为宗喀巴大师是修什么怀摄法，于是跑去问大师，什么是一切怀摄法中最甚深的法。大师接着说，或许有人会想饬终和处理后事还是需要一些钱的，那时应想：“什么都无所谓，死就死吧”，如此才能做到“死极荒沟依止”。大师详细开示了我们需要噶当派“十秘财”的道理。密勒日巴也说过，如果他死的时候没人哭泣，尸身周围没人聚集，他的心愿就满足了。", "）虽然我们也许会认为办丧事的钱财是必需的，但事实上，人们看到尸体就反胃，总想迅速将它移走，所以根本不需要担心自己的尸体会留在床上没人管。", "如果我们能这样子毅然决然地舍弃现世，现世的安、乐、名三者反而会铺天盖地地涌来。简要地说，就是：希求现世的人是世俗人，舍弃现世的人是修行人。格西博朵瓦曾问仲敦巴：“法与非法的界限在哪里？”仲敦巴回答说：“能对治烦恼的是法，不能对治的即非法；与一切世间法不相顺的是法，相顺的是非法。”这句话明白道出了佛法与世间法二者对立的关要。然而，我们似乎谁都能将念经和治家这两桩事一并做。因为我们这些人以“世间八法”作为修持的中心，除了身体外相像个修行人外，内心实与世俗人无异。舍弃现世修清净法的主要方便是修“死无常”。如果不能舍弃现世，我们所修的法就会流于现世的目的。所以，我们必须等观世间八法，抛弃对衣、食、名三者的耽著。至于舍弃现世的标准，我们当以嘉旺格桑和班禅洛桑益西为楷模。嘉旺格桑除了铃杵和三法衣之外，从不想拥有别的东西。（帕绷喀大师并讲述了班禅洛桑益西的故事：他对别人供养一百个马蹄银锭一事深感不悦。）我们很容易遭到衣、食、名三者中的一项、两项，或所有项的系缚。这三者中，最难断的是求名。不论法师也好、律师也好、讲经师也好、禅师也好，希望出名的人很多。", "杰·卓尾贡波曾对此详加解说：现世法、律、禅修师，但求现世法、律名，闭关书字于门楣，不见访客禅修师，亦求现世禅师名。", "又说：下至少物供三宝，心中亦欲他人见。有些自诩为大修行者或成就者的人，愿意在衣、食方面从简，依靠服食花精、石精等勤修苦行，但内心深处无丝毫求名之心的却很少。《喻法集》里面有一些与此有关的譬喻，如“松鸡、门槛、狐与猿”等。所谓门槛，是指人们只知探询远方的路况，而不提防“门槛”边的火塘；同样地，我们只喜欢探问佛地和密法等高深之道，却不愿舍弃对现世的耽著，不去解脱贪著现世的系缚。这种过失也是因为“不念死”造成的。辛四、修不殷重过患如果不念死的话，我们修法就不会努力，修持也就难免中断。每当我们修善行的时候，总是很容易就感到疲乏，也生不起大精进，这就是不念“死无常”所导致的过失。格西喀惹巴因念“死无常”的缘故，连去砍伐禅房门边棘刺的空闲都没有。密勒日巴的衣服和糌粑袋破了，也无暇缝补，依然勤修善行。如果我们念“死无常”的话，也就能够心无旁骛地长时间勤修善行，并在每次修法的时候，无有怯弱，心感畅快。辛五、自谋不善过患若不念死，便会大大地贪著于现世。因为追求现世的利益，连带也将对饶益者和损害者等生起贪、瞋、痴三种烦恼，并因此与别人打斗、争吵，导致被别人骂是恶人等等。", "要知道，即使是打斗时留下的小疮疤，这一切伤害都是自己造成的。简言之，若不念死，就是在自毁今生和后世的一切利益。", "辛六、临终时将追悔而死过患如果不念死的话，我们所修的法只不过是徒有其表，因为与现世的希求相掺杂，所以修不成任何正法。某天有个称作“死亡”的怨敌突然出现的时候，将发现以前孜孜以求的权力、地位、财产等都帮不上忙了，真正能帮助自己的只有神圣的正法，但因为未曾好好修持，临终将会生起极难忍受的懊悔之心，为时已晚之际，只有自食苦果。譬如，以前有个名叫蒙卓却札的人，他身患热病，自知死期将至，因而说出追悔的话。迦摩巴曾说：现在必须畏死，临终时则须无所恐惧。我等正与此背道而驰，现在无畏，至临终时则用指抓胸。我们应当生前就对死无常产生恐惧而好好修法，临终时才能无所畏惧。但事实上我们的做法正好与此相反：现在丝毫没有自己会死的念头，常保持安乐的心情；临终时则手忙脚乱，不知所措。在临终的时候，无论是拥有百库黄金的富翁，还是统御各方的国王，这些财富和权力转眼成空，对自己一点益处都没有、毫无价值。临终时真正有利益的安心事一样也没修成，在这种情形下，如果一场致命的大病突然袭来，那时候纵然心想：“如果此番能不死的话，我一定要修法。”也为时已晚了。", "俗话说：“食物在手的时候，如果自己不吃的话，一旦被狗衔去，纵有想吃之心也无济于事。”以上所述为不念死的六种过患。庚二、念死之利益这一部分分六小节：（辛一）利大利益；（辛二）力大利益；（辛三）最初重要利益；（辛四）中间重要利益；（辛五）最后重要利益；（辛六）临终时欢喜而死利益。", "辛一、利大利益念死的利益极大，大师在《大般涅槃经》中说：一切足迹中，象迹第一；一切想中，无常与死想是为第一。念死能促使我们去修真正的佛法，因为希求后世能获得胜妙之身，我们便会勤于布施、净戒等善业。简言之，从三士道至双运间的一切“道次第”，均由念死所引发。密勒日巴也是因为受到其师雍敦施主去世的影响而心向佛法。许多大成就者为了提醒自己念死无常，所以手里经常拿着骨笛和颅碗，这也是为什么《毗奈耶》说要在浴室内画上骷髅等像的缘故。京俄仁波切说：如果我们每天清早不修一座无常的话，这一天就会成为世俗人的一天。祥尊耶巴也说：如果上午不念死，那么这上半日即成现世者；如果中午不念死，那么从中午至晚上这段时间即属现世者。凡是为现世所做的事就不是正法。辛二、力大利益如果我们能念死无常的话，那将对摧坏不顺品贪欲、瞋恚等，以及对圆满资粮有很大的力量。它好像是一把能同时击破所有烦恼和恶行的锤子。", "辛三、最初重要利益念死是最初令我们开始修法的主因。辛四、中间重要利益念死是中间鞭策我们精进修法的助缘。辛五、最后重要利益念死使我们最后修法达到究竟、道果圆满。辛六、临终时欢喜而死利益由于我们已修清净正法的关系，临终时便可安心，就像游子将返家园一样。隆睹喇嘛仁波切曾说：“无常出现时我不会害怕，因为上午的老比丘下午将受取天身。”因此，修行到最高层次的人，能以愉快的心情面对死亡；中等者不会感到心怵；最下者也不致追悔而死，因为他想到：“我已认真修法了，现在死而无憾。”密勒日巴大师说：我因畏死逃上山，通达本心空性理，今死纵临亦无忧。庚三、正念死之理这部分分两小节：（辛一）修习死亡九种因相；（辛二）修习死相。这里所说的详细教授，为噶当派古德所未发，系从宗喀巴大师语教中所出。宗喀巴大师语教中，含有许多与众不同的甚深、广大教诫，例如对印度密续经典密意的阐明、触及觉受关要的方法、条理清楚的科判次第等等。辛一、修习死亡九种因相思惟死亡的九种因中，有三根本：（壬一）思惟死决定；（壬二）思惟死期无定；（壬三）思惟死时除正法外，余皆无益。每一根本又各有三种因，共为九种。", "壬一、思惟死决定第一根本“死决定”的三种因：癸一、死主决定当至，无缘能令退却我们是绝对会死的，无论我们有什么样的身体、走到哪里去、用何等的方法，都无法让死主退走。胜妙身无法使死主退走，《无常集》中说：若佛若独觉，若诸佛声闻，尚须舍此身，何况诸凡夫？获得金刚身的佛陀薄伽梵，以及印、藏众多证得双运的大成就者，现在除了在谈论中他们似乎还存在外，事实上均已入灭。既然大师佛陀等也要示现坏金刚身而入涅槃相，你我之辈又怎能不死呢？当大师临近涅槃时，舍利弗等数万弟子先佛入灭。后来大师命人在拘尸那城外的双娑罗树间布置最后的卧床，接着调伏了最后的两位所化弟子：乾闼婆王“善爱”与自然外道“须跋陀罗”。由于不忍心见佛陀入涅槃，“须跋陀罗”也立即入灭。大师临涅槃时，将上衣脱下并告诉弟子：“如来难见，现当瞻视！”之后为了凸显无常是最后的言教，以及表示当以此为主要修持的缘故，大师说：“一切有为法皆无常，此乃如来最后之语！”随后入灭。散居在各地、已获生死自在的阿罗汉们，听到大师涅槃的消息后，也大多相继入灭。使得存世的阿罗汉还差一位才满五百。", "不仅如此，七代付法师、八十大成就者、六庄严二胜等印度的那些班智达与成就者，以及西藏的“师君三尊”、阿底峡尊者父子、文殊怙主宗喀巴父子等，也已入灭，现在全都只存在于言谈中。既然如此，我们又何尝不会死呢？以前彩却林雍增仁波切讲《道次第》的时候，与会者达数千人，而今师徒之中一个也没留下。曲桑仁波切曾经像现在一样，在本地讲过法，但现在只剩下轶事流传。目前参加法会的诸位，百年之内也将全部去世，届时只能留下一些口头记载而已。再者，汉、藏、蒙等赡部洲中所有现在还活着的人，包括今日出生的婴儿在内，一百年后肯定都会死亡，一个也不会剩下。既然如此，我们当然也不会例外，这是大家可以亲眼目睹的事实。同样地，也没有一个地方可以避免死亡的侵袭。《集法句经》中说：住于何处死不入，如是方所定非有，空中非有海中无，亦非可住诸山间。以前波斯匿王的儿子“琉璃王”准备屠杀释迦族的时候，目犍连想以神变力将“琉璃王”及其军队带到外铁围山之外，但佛陀说这无益于阻止这场灾难。一些释迦族的青年男女藏在如来的钵内，另有些人被安置到太阳的宫殿里。但在屠杀发生之日，这批人也一样死去。", "死亡要来的话，我们无法用快跑来逃避，无法用钱财来赎取，也无法用权势或力量来抗争。正如《无常集》中所言：具足五通之仙人，虽能行空飞万里，所经之处未有死，如是之地终难抵。如果逃走能解脱死亡威胁的话，那么获得五通、有神变力的仙人应能逃出死主的魔爪，然而仙人也无法解脱，终将死亡。", "权势或力量也无法使死亡退却。狮子虽然有一掌击破象头的力量，但临终时却蜷起爪子而死。具力转轮王也必然要死，他的权势帮不了任何忙。如果分析一下我们对钱财喜爱的程度，可以发现，我们似乎迷信到以为钱财有赎死的功能。然而，就连转轮王的财宝也无法赎死，其他人的钱财就更不必说了。《教授国王经》中说：譬如若有四大山王，坚硬稳固成就坚实，不坏不裂，无诸陨损，至极坚硬，纯一实密，触天磨地。从四方来，研磨一切草木本干及诸枝叶，并研一切有情生命众生。此非速走易得逃脱，或以力退，或以财退，或以诸物及咒药等易于退却。大王！如是此四极大怖畏来时，亦非于此速走能逃，或以力退，或以财退，或以诸物及咒药等易于退却。何等为四？谓老、病、死、衰。大王！老坏强壮，病坏无疾，衰坏一切圆满丰饶，死坏命根。从此等中，非是速走易得逃脱，或以力退，或以财退，或以诸物及咒药等易于静息。如经文所说，当四座坚硬的大山从四方迅速进攻过来、研碎草木等物的时候，任何方法都难以击退它们；以此为喻，老、衰、病、死这四座山也是难以退却的。癸二、寿数无可增添，不断减损我们将来的死亡是必然的，因为我们的寿命长短全由宿业决定，无法增加一丁点。", "随着每一刹那的消逝，我们正慢慢地向阎王靠近。", "如《入行论》中所描述的那样：昼夜无暂停，此寿恒损减，亦无余可添，我何能不死？又如《集法句经》中说：譬如舒经织，随所入纬线，速穷纬边际，诸人命亦尔。嘉却·格桑嘉措说：生已命无刹那住，如驰趣往阎摩前，悲夫生者行死道，恍如罪犯赴刑场。我们从出生开始，连一口气的时间都不曾稍停，比纵马飞驰还要快地奔向死亡之地。马还因为疲乏等缘故会稍加休息，死亡却刹那不停地飞奔过来，所以我们正一分一秒地与死亡靠拢。《集法句经》中又说：如诸定被杀，随其步步行，速至杀者前，诸人命亦尔。譬如，当一头羊被牵往屠宰场时，它正步步向死亡靠近。同样地，我们在出生之后，便朝死亡奔跑，从未有暂停的时候。扣掉过去的岁月，我们的寿命已所剩无几，并将随着呼吸、小时、日、月、年而逐渐消耗完毕。“现在我要死了，我要走了”的一天会突然间到来。所以，根本不可能有“我不会死”这种自信。（帕绷喀大师说，即便在我们惬意松弛地躺下、准备睡觉的时候，我们仍然向死主奔去。）癸三、于生时亦无闲暇修法而死我们的寿命极短，很可能在没空修法的情况下已向阎王报到。假定我们可以活六十年的话，这当中我们每个晚上需要睡觉，所以睡眠已花掉我们半辈子。", "另外三十年中，扣掉吃饭等时间，能够真正用于闭关修“四座瑜伽”等修法的时间，实在不超过五年。新年元旦的时候，我们为了讨吉利而大办庆宴。之后的每个月中，我们又以“大愿法会”等各种节日的名义忙碌散乱，一年就这样在瞬息间过去了。贡唐仁波切说：不思修法过二十，想修想修又二十，不行不行十余载，此乃空耗一生传。我们年轻的时候，根本想不到佛法，之后虽然有修法之心，但总是在“想修、想修”之中拖延，不肯实际去做，结果得不到任何佛法上的成就。我们老了之后，除了为后世发发愿外，因为老不中用而什么也做不了。现在有许多人虽然有修法之心，但终日散乱；也有不少人因为无力修法而追悔莫及。当我们看到这类情况时，应该意识到这些做法是不对的。此外，我们不要将那些日复一日影响修法的无益之事想得那么重要，而应下定决心，在死主阎王临降之前尽力修法。杰·昂旺降巴说：譬如平原上堆有一堆麦子，有一股洪水正从附近的山谷冲下来，准备把麦子卷走。如果我们在一旁观看，什么也不做的话，将连一颗麦粒也收不到，全被洪水冲走。但若能迅速地努力抢救的话，我们至少还能收回一部分。要是运气好，甚至还能全部救回而实现最大的目标。", "同样地，我们也应在死亡到来之前，尽其所能，修习三士道。", "思惟上述三因之后，我们将认识到死亡的必然性，从而做出必须修法的决定。壬二、思惟死期无定第二根本“死无定期”的三种因：癸一、总赡部洲人，别于浊世，死期无定如果死期是确定的话，我们或许可以先完成诸如降伏仇敌、保护亲友等世俗的事情，趁早快活一番，等到死期将至之前再修法。但这种确定性是没有的，所以思惟死无定期这一节很重要。《俱舍论》中说：北俱卢千年，余二半半减，此中寿无定，末十初无量。这是说，其他各洲人的寿命长度大多数是确定的，而赡部洲人最初的寿命可达无量岁，最后则以十岁为长寿之最。因此，赡部洲人的寿数是不确定的。尤其是在浊世时期，人的寿命长短更不确定。总而言之，虽然我们没有会永远不死的想法，但我们在未死之前，总是怀着这种念头：“死是肯定的，但今年不大可能会死。”其理由是，某些人认为自己还年轻，所以暂时还不至于死。但这种理由是站不住脚的，死亡并不因为年龄的长幼而有先后次序，父母痛心幼子夭折的事例多的是。同样地，年纪比我们小，但比我们早死的也有很多，有的人甚至刚生下来就死了。另有些人认为，自己没病所以暂时还能活一段时间，但这也是说不准的，许多卧病在床的人没有死，无病而猝死的却大有人在。", "有的人在吃饭间死去，他们起先丝毫不会意识到自己将在吃完饭之前死亡；在许多集会中，有些人自己走进集会大殿，却变成一具尸体被人抬出来，放在尸轿里；有些官员在实施政务中，等不到完成的那一天就留下未竟之业死去。我们有时在一些大德的文集里，可以发现有所谓的“未竟之著”，这只是一种委婉的说法，实际上是指该文作者未能写完全书就逝世。虽然常有某人去世的消息从周围山谷的上部和下部传来，但我们这些人却从没想到同样的事也会发生在自己身上。相反地，我们把这类事当作看热闹，甚至还有这样的期盼：“这家伙法衣真不错，我要是有这么一套就好了。”与此类似的死亡，某一天肯定会发生在我们身上，而什么时候来却是未知的。正如所谓：明日与后世，未详孰先至，不重明日计，当勤后世利。《集法句经》中说：上午见多人，下午有不见，下午所见者，次晨有不见。我们哪里有明天不会死的把握？正因为没有，所以我们应该思惟：“不为死做准备肯定是错误的，因为虽然不知道它什么时候来，但它必定是会来的。既然我无法肯定自己将活到年老，所以我不必制订许多计划来保证将来有个幸福的晚年。", "”如果无法想象自己今天或明天会死的话，我们至少也应这样思惟：“明年这个时候，难说是否会轮到自己死。”以本次法会在座的诸位为例，座首、座中、座尾的听众中，谁将轮到第一个先死，我们是无法肯定的。", "阎王不会在我们死亡之前先捎个口信来，说：“喂！现在你该走了。”有一天它会突然降临，就像霹雳一般，我们终将要留下未竟之事而去。就算是最普通的出家人，他们也必须留下茶、酥油、糌粑，甚至是喝到一半的面汤而赴黄泉，此即死无定期的表征。认为自己可以长生不老，是我们“常执”的一种表现。这种邪见一直在欺骗我们，直至我们意识到自己死期已至的那天。甚至在死亡的当天，垂危的病人或许还在想：“我今天还不会死吧！”有些人遇到本命凶年的时候，可能还会动念去想一想今年是否可能会死。但事实上，从一岁至一百岁间所有的非凶年中，我们也不敢说不会在该年死亡。以今年廿八岁者为例，你们应该想到：“我今年是极可能死的，因为与我年龄相同的某某就是这个年龄死的。”如果有人要我们立誓说今年一定不会死，我们是做不到的，所以只能作出怀疑的样子。“死无常”并不像“无我”的意义那样难懂。除非你不去思考，否则我们住在大寺院或人口稠密的城市中，只要心里一想，它就会像眼见、手触般清晰地出现在我们面前。因此，我们应该配合我的依怙主大宝师长的话来加以思考，他说：如果我能一个月、两个月不死，但愿我能成办后世的利益；", "如果我能一年、两年不死，但愿我能实现来世永久安乐的目标。癸二、死缘极多，活缘微少，故死期无定现在能保护我们不死的，只有自己前世的愿力、福德和诸佛的悲心，除此之外，死缘极其繁多。我们周围有八万种死缘障碍对我们虎视耽耽，就像苍蝇盘旋于腐肉一般，正伺机把我们吃掉或夺走我们的呼吸。此外还有如雾气笼罩般的四百零四种疾病、三百六十种魔鬼、十五种厉害的童子魔、三百六十种非人等，全都在觊觎我们的寿命。", "除了这些外缘外，我们体内的风、胆汁、涎液等以及四大只要稍不平衡，就会夺走我们的生命，就像同在一个器皿中的四条蛇，哪一个力大就把其他三个吃掉一样。所谓：死缘极众多，活缘唯少许，此等亦成死，故当常修法。不仅内、外死缘众多，活缘变成死缘的也有许多。例如房屋倒塌、舟船沉没、被马摔下踩死、遭亲友出卖、食物不消化等等。所以，龙猛说我们的寿命就像狂风中的灯烛一般：安住死缘中，犹如风中烛。癸三、身极脆弱，故死期无定虽然如上所述死缘极多、活缘极少，但如果我们的身体坚不可摧，死缘再多也不会威胁到我们。然而我们的身体就像水泡一样，连一根刺也可以要我们的命，死亡实在是不须重大因缘的。即便我们有坚固结实的身体也没有用，《亲友书》中说：七日燃烧诸有形，大地须弥及大海，尚无灰尘得余留，况诸至极脆弱人。该文又说：若其寿命多损害，较风激泡尤无常，出入二息能从睡，有暇醒觉最稀有！意思是说，我们在入睡的时候，粗气的呼吸停止了，只剩细四大的风在鼻孔中继续流动，在粗四大风的呼吸停止之后，又能苏醒过来不死，实在是一件极稀有的事！", "因此，我们应当思惟死无定期，从而生起立即修法的念头。就像有个想杀我们的仇人肯定要来，但什么时候来不知道，所以从即日起便要积极防范。我们常常这样子自己骗自己：“法是一定要修的，但等我明年此时把事情办完后再修吧。”杰·贡唐巴说：心想今年或本月，现世之事先完成，次方修习清净法，此乃欺诳一切鬼。我们常有完成某事后再修法之心，但是世俗的事情就像阵阵波浪一样，永无结束之时。完成一件事后，另一件事势必接踵而至，待那件事完成后，又有下一件事出现，于是又想等到那件事完成后再修。正如所谓：俗事犹如老人须，剪而又剪须愈多。贡唐巴说：明日修法黎明前，今日死期已迫近，如今不应作自欺，从即日起修正法！有些人喜欢安排修法的时间，心想：“等这事完了再修法”或是“明天再修”，殊不知在事情完成之前，“今日你该死”的噩耗已经像霹雳般出现。以上述三因思惟“死无定期”之后，我们应下定决心从现在起就彻底放下俗事，不再推明天、等后天，而应从即刻起便修法。这并不意味着学僧可以不去大殿和辩经院而跑到山洞去，而是应该把自己现在所修的法转变成真正的法。", "以过去口头上的念诵为例，我们恐怕都曾念过上千遍“归依发心偈”，但念诵时真正做思惟的或许一遍也没有，由此可以发现，真正的佛法我们实在少得可怜。虽然像积极经商和努力耕耘这类事无法转变成正法，然而对我们这些出家众来讲，却应将日前所做的事转变为正法。", "（帕绷喀大师解释说，导致我们大多数人正法匮乏的，大半是因为我们不愿修，而不是不懂得修。）壬三、思惟死时除正法外，余皆无益第三根本“死时除正法外余皆无益”的三种因：癸一、财物无益纵然我们富贵如梵天、帝释或转轮王，死的时候还是连一名仆人、一件财物都带不走，所以这些东西在死时都无益处。统治各地区的国王将死的时候，连一粒麦子也无法带走，甚至乞丐也得放下不离手的叫化棒而去，所谓：国王须舍河山去，乞丐须舍棍杖去。《大树经》中也说：纵然积有百年粮，死之次晨空腹行，纵然积有百年衣，死之次晨赤身行。又如《入行论》中说：死时皆须舍，然我不了知，为诸亲与仇，造种种罪业。以及：生既孤独生，死亦孤独死，苦分他不取，能障友何用？以前有个人将一块大石头打磨成工整的四方形，别人问他这将派什么用，他回答说没什么用，以后准备把它扔掉。我们的情况与此人相似：最终将放下现世中苦苦积揽的所有财物而去。", "癸二、亲友无益纵然有许多亲爱如心肝肺腑的仆众、弟子、亲戚围绕在我们尸床旁牵扯依恋，也都不能使我们不死。我们也带不走他们中的任何一个，只能孤独地前往“中有”的险狭之道。正如大成就者弥札佐格所说：陛下任何富，死赴他世时，如敌劫于野，独身无子妃。及《入行论》中所说：鬼卒来抓时，亲友有何益？以及班禅却坚所说的：“恩爱眷属皆永离”等。如果有人知道今年冬天就会死的话，他怎么还会去忙明年的事呢？现在我们对到印度或汉地去旅行感到很兴奋，认为是件了不得的大事，忙着打点行装。这种旅行虽然可以带着马匹、骡子和仆从一起走，但当我们“大搬家”去后世时，却只能独自一人去，既没有道伴，也带不走丝毫财富受用。癸三、身亦无益当我们死殁时，就算一切山都变成黄金、一切人都变成朋友，对我们而言也全没用。财物受用、亲戚朋友等就不必说了，即使连我们从胎里带来的，担心它受冻、挨饿，连刺扎也禁不起的、像如意宝般受爱护的身体也要留下。所以当如班禅却坚所说的：“素珍卫身需时欺”等，思惟必须与最受爱护的身体分离的情形。在思惟上述三因之后，如果我们光是坐着害怕发抖是没有用的。贡唐·丹贝准美说：", "法是无谙道向导，法是长征道路粮，法是难行道商主，三门今当合正法！密勒日巴大师说：弟子贝达绷谛听！具信富女听我言：后世时较现世长，行路干粮已备否？行路干粮若未备，当作布施以备之！以及：弟子贝达绷谛听！具信富女听我言：后世怖较现世大，护送卫士已备否？护送卫士若未备，当修正法以备之！我们死的时候，旅途上的向导、商主、路粮就是正法，假如我们生前未曾修法的话，便和路旁死去的老狗没什么两样。想一想，如果我们这样子死去，那该有多么悲哀！我们应该像回家的旅客那样，不做长留他乡的打算、只想着如何打点回家的行装，对现世没有丝毫贪恋，决意只修正法！辛二、修习死相这一修法是我大宝师长的教授。（帕绷喀大师指出，因为这主要是“经验引导”的修法，所以修的时候，我们最好能按照如下所说来思惟。）具体修法是按照《依怙大悲颂》和班禅却坚的《解脱中有险难启请》中所讲的内容来忆念。我们大家都知道自己有一天将死去，那么死的时候到底是怎样一种情形呢？让我们来观察一下。《中有启请》中说：扁仓却走经无救，亲故临视皆永诀，自己亦无奈何时，忆师教授求加持。", "当我们临近死亡的时候，不论再怎样请医诊治和筵僧诵经，我们的病照样愈来愈严重。医生虽然当着我们的面说一些安慰的话，实则已经对家属发出病危通知。亲友们虽然表面上仍鼓励我们，背地里却已清楚我们即将死去而开始收拾物品。我们的体温开始降低，呼吸变得急促，鼻子塌陷，嘴唇上翻，皮肤光泽消失等等，表露出种种难堪的内、外死相。我们也将对以往所犯的罪业心生悔意，又缺乏因忏悔、防护恶业和修习清净善业而产生的把握。“解支节”的痛苦和四大融入次第的各种征象一一出现。我们就这样在种种可怕的幻觉之中死去，现世的鲜明景象杳然无存。我们的尸体被床单包裹起来，放置在房间的一个角落。一道挂帘将尸体和房间的其余部分隔开，并燃起一盏昏暗的油灯。如果死者生前是师长的话，他的遗体便被套上灌顶服，修饰打扮一番。虽然我们现在忙着追求华屋、软垫和暖衣，但在死后，我们的身体将被叠作三叠，并被皮绳捆起来，扔在地上。虽然我们现在忙着受用各种可口的食品，但总有一天我们将只剩希望能嗅一下“烟施”气味的份。虽然我们现在享有诸如“格西”“古雪”“比丘”之类好听的称号，但总有一天我们的身体将被称作“尸体”，我们的名字前也将加上“已故”的字样。", "所以，作师长的看到灌顶装时，应当想到这就是自己死后遗体上穿的东西；当我们看到床单时，应当想到这就是自己死后裹尸用的尸布，我们应该像这样来忆念。杰‧密勒日巴所说的：可畏之物名为尸，瑜伽师身脉中有。也是指我们现在的这个身体。因为地风融入和火风融入等关系，我们将感受到山体破裂、厚土压身、进入熊熊烈火之中、被洪水或狂风卷走等景象。有些师长说：“我已为亡者作了最好的‘中有开示’。”但与其在尸头旁作开示，不如在未死前作真正的“中有开示”来得有意义。因为我们平时习惯的那些基本动作，如受用饮食等，在临终的时候都做不来，而需要别人搀扶等等。既然如此，那么生前不熟悉的法，在那时肯定更加派不上用场。然而仰仗诸佛不可思议的加持力，“中有开示”等法还是会有一点益处的。修习死相的依据出于《入行论》：何时赴寒林，他骨及我身，同属坏灭法，于彼作等观。意为别人死后送到寒林去的骨头和我现在自身的骨头，我应不加区别地平等看待。寒林中的枯骨曾经与我现在的身体一样，都是为死者生前所珍爱的。印度那些大成就者手执的腿骨和颅骨，不是为了恐吓和威胁他人，而是为了忆念死相。", "原在某人头上的那个颅碗，本是那人极其珍爱的头颅，用手指戮他脑袋时，他也会呼疼的。如果你是一介贫僧的话，当设想自己的房间将变得空空如也，有人将搬进来住。他们会议论说，你已去世多少天了。自己身上的法衣也将穿在别人身上，那人会说：“我买的这件法衣是已故某某的。”我们现在未能受用的物品、衣服，总有一天会被别人买去使用。这些东西就像嘉却·格桑嘉措说的那样：富乐圆满届时定舍如喜借贷之庄严。这一切都只不过是暂时借来用的罢了。如果我们想象不出自己死亡情景，也可以到别人死去的尸身前观看。这一教授是不可能观不起来的。当我们见到捆尸用的马兰草绳时，怎会不感到害怕？这是肯定会使我们恐惧的，问题只怕我们不去思考而已。", "如果想到连一件法衣都没有穿坏前人就会死，我们将意识到生命是多么的短暂，这是《教诫王经》中所说的。此外，我们当时常思惟《夏玛尔道次第》中所述的无常修法，作为防止受用丰衣美食时生起骄慢的对治。例如，当我们见到自己的衣服等受用物时，应想：“这些东西现在似乎为我所有，但总有一天会被别人转手贩卖。”别人也一定会说：“这是已故某某的遗物。”对于自己的身体，我们也应想到：“现在这个身体我虽然百般呵护，但总有一天会变成尸体，让人看到就害怕，碰到就恶心。”以及被绳索捆起来等种种情形。此外，我们当设想剩余的糌粑被用来作超荐供养，及师长在枕边作“中有开示”等情景。自己的头盖骨等也可能被人拿走，别人将议论说：“这是某某的头盖骨，货色怎么样？”这一天必定会到来。所以，我们一定要在这些事情发生之前努力修法，以保证自己将来能心无懊悔。（至于“死无常”证德在心中生起的标准，帕绷喀大师说，我们应该有像格西喀惹巴一样的态度。然后大师又约略重述了一遍上述的内容。）"]}, {"c": "第十一天", "segs": ["第十一天《大游戏经》中说：三有无常如秋云，有情生死等观戏，众生寿行似闪电，如崖瀑水速疾逝。如经所说，三界以及地基、须弥山等的无常，犹如秋天的云彩一般；众生的生死就像演戏一样，片刻不停地变换角色；我们的生命也不长久，如闪电般一闪即过，而且刹那坏灭永不停息，如同悬崖边飞奔直下的瀑布。思及至此，我们应当生起立即修法之念。而三世诸佛唯一走过的路，就是“菩提道次第”，我们能够修行这样的法门，自然是最殊胜的。所以，我希望大家能这样来改正动机：为了成佛以利益一切有情，我必须听闻“菩提道次第”引导，然后去实修。（随后嘉杰·帕绷喀仁波切回顾了已经讲过的科判，又将昨天讲的“无常”部分重述了一遍。）己二、思惟后世二趣苦乐如何“生起希求后世意乐”一科中有两部分，第二部分为“思惟后世二趣苦乐如何”，其中思惟善趣苦部分将在下面中士道中说，此处单讲恶趣苦。如昨日所述，我们的死是必然的，而且死无定期。死了之后，我们的心识仍然相续不断，所以必定会再次受生，而受生的地方只有两个：善趣或恶趣。将来我们会到何趣中，靠比量便能推断。像我以前说过的那样，我们不需要问卦、推算以求知道自己后世将生在哪里。", "行善升善趣，作恶堕恶趣，大师佛陀早就为我们授记好了。《本生鬘》中说：应善定解善非善，诸业他世生苦乐，断恶励力修善业。我们总是喜欢说要做长远考虑，于是对现世的苦乐、得失做了许多分析。然而这并不算长远考虑，真正的长远考虑，是扩大心量去观察自己后世将去哪里。观察后将发现，我们后世可去的地方只有两个：要么是善趣，要么是恶趣。我们将去二趣中的哪一趣自己是无法做主的，不然的话，现在也就不会有恶趣众生了。我们的业决定了我们的后世：善与不善业交互混杂，二者中哪一个力大哪一个便先成熟；如果二者力量相等，那么我们最习惯做的那一个便先成熟；如果连这也相等的话，那么哪一个先做哪一个便先成熟。《俱舍释》中说：业生死何重，何近何串习，何先做彼等，前前得异熟。我们所造的善与不善二业，以不善业力量来得最大。因为我们大多数的思想，全都是贪等烦恼的念头，由此所发起的一切业自然是不善的。甚至我们所做的善业，也经常受到不善念头的控制，能为后世回向的，为数极少。以老师训斥学生为例，他先发起极大的忿怒心，骂的时候唯恐骂得不刻毒，最后又感到很痛快等等，加行、正行和结行三者全都很有力量，所以我们所做的大部分罪业力量都很大。", "说到所修的善业呢？就像以前一个念《兜率天众颂》的人，一会儿心思散乱，一会儿同别人说话，所以不得不多次从头重新念起一样：虽然口里面在念经，心里却散乱于世俗方面的事。纵然我们有一些微弱善根，也可能被瞋怒和邪见摧毁殆尽；而那些小小的不善业，却在日复一日地成倍增长。不仅如此，我们以前受生为罗刹、非人、鳄鱼及猛兽等时，造有很多严重的罪业。在此之上，今生中又如前所说的那样，造集了众多力量强大的罪业。以我们现在的能力来判断，我们可能到死为止也无法靠忏悔和防护来清净这些罪业！因此，我们可以用现量来判断：善与不善两种业中，我们习惯于造不善业，因此不善业的力量最大。既然这样，我们后世除了恶趣之外，是无处可去的。（帕绷喀大师指出：只有获得加行道忍位的人才有把握不堕恶趣，甚至连一些大菩萨也可能投生到恶趣里。）设想今天晚上，我们作为一名比丘，在舒服的房间里，一张柔软的床垫上躺下，忽然因为某种恶缘而致死，明天早晨醒来时，我们将发现自己已来到一个所有山谷都充满烈火的地方。这该怎么办呢？像这种受生于恶趣的情形，我们通常把它看得很远，视如观景，所以生不起厌离心。龙猛说：逐日当忆念，极热极冷狱。", "我们应该像修本尊“生起次第”那样，观想自己受生在那些恶趣中，修出真实的感受，从而生起恐惧之心。我们往往很重视修习本尊天身，但如果开始时先修一下地狱身的话，利益可能会更大一些。当我们因修热地狱苦而改变心态之时，就是出离心开始萌发之时，所以效果比较好。此外，因为我们有了厌离心，所以能消除我慢、贡高等等，功德极大。寂天说：苦有诸功德，谓以厌除慢，悲悯生死者，羞恶而喜善。因为以此暇满身较易生起出离心和悲心，所以我们应当重视修习生起出离心和悲心的主因——苦。修恶趣苦分三段：（庚一）思地狱苦；（庚二）思饿鬼苦；（庚三）思畜生苦。庚一、思地狱苦思惟地狱苦又分四小节：（辛一）思大有情地狱或热地狱苦；（辛二）思近边地狱苦；（辛三）思寒冷地狱苦；（辛四）思独一地狱苦。辛一、思大有情地狱或热地狱苦热地狱的地理位置：印度金刚座下面三万二千踰缮那的地方为“等活地狱”，再往下每隔四千踰缮那为其他各个热地狱。热地狱中所有地基和山脉全由燃烧的赤铁构成；在那里，连一块巴掌大的、如人间似的土地也找不到。如杰·贡唐巴所说：寿命无常小睡中，无义苦乐梦纷乱，忽醒已处地狱内，陷荆棘坑奈何之！", "大凡将生于热地狱的人，临终时会有怕冷的感觉，所以对热生起贪爱，由此引发受生热地狱的业成熟。经验像入睡般的死亡和做梦般的中有过程后，醒来时，此人发现自己已来到热地狱中。", "地狱的火力要比人间的火力高七倍。与地狱
