<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>掌中解脱 · 有声书</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23A63C2B'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23F6F1E5' font-family='serif'%3E掌%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{
  --paper:#F6F1E5;
  --paper-2:#EFE8D8;
  --ink:#2F2A24;
  --ink-soft:#6B6152;
  --seal:#A63C2B;
  --seal-soft:rgba(166,60,43,.10);
  --gold:#B8924E;
  --line:rgba(47,42,36,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
  font-size:16px;
}
#app{height:100%;display:flex;flex-direction:column}

/* ===== 顶部栏 ===== */
header{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.icon-btn{
  width:44px;height:44px;border:none;background:none;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-radius:10px;
}
.icon-btn:active{background:var(--seal-soft)}
.icon-btn svg{width:24px;height:24px}
header .title{
  font-size:17px;font-weight:700;letter-spacing:2px;
  display:flex;align-items:center;gap:8px;
}
header .title .seal-dot{width:8px;height:8px;border-radius:50%;background:var(--seal);display:inline-block}

/* ===== 正文区 ===== */
main{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:26px 26px 120px;
  scroll-behavior:smooth;
}
.chapter-head{
  text-align:center;margin-bottom:8px;
}
.chapter-head .kicker{
  font-size:12px;letter-spacing:6px;color:var(--gold);
  text-indent:6px;margin-bottom:6px;
}
.chapter-head h1{
  font-size:24px;font-weight:700;letter-spacing:3px;
}
.chapter-head .sub{
  font-size:13px;color:var(--ink-soft);margin-top:6px;letter-spacing:1px;
}
.chapter-head .rule{
  width:56px;height:2px;background:var(--seal);margin:16px auto 4px;border-radius:2px;
}
.seg-progress{
  text-align:center;font-size:12px;color:var(--ink-soft);margin:10px 0 22px;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  letter-spacing:1px;
}
.body-text{
  font-size:20px;line-height:2.05;letter-spacing:.5px;text-align:justify;
  text-justify:inter-ideograph;
  transition:color .3s;
}
.body-text.playing{color:var(--seal)}
.body-text .note{
  display:block;font-size:13px;color:var(--ink-soft);line-height:1.7;
  padding:14px 0 0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
.font-s .body-text{font-size:18px}
.font-l .body-text{font-size:22px}

/* ===== 底部控制 ===== */
.player{
  flex:0 0 auto;
  background:var(--paper-2);
  border-top:1px solid var(--line);
  padding:10px 16px calc(var(--safe-b) + 12px);
  position:relative;z-index:20;
}
.player .track{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.player .track .bar{
  flex:1;height:4px;background:rgba(47,42,36,.15);border-radius:4px;position:relative;cursor:pointer;
}
.player .track .bar .fill{
  position:absolute;left:0;top:0;bottom:0;background:var(--seal);border-radius:4px;width:0%;
}
.player .track .time{font-size:11px;color:var(--ink-soft);font-family:"Noto Sans SC",sans-serif;width:88px;text-align:right}
.player .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.player .ctrl-btn{
  width:52px;height:52px;border:none;background:none;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:14px;
}
.player .ctrl-btn:active{background:var(--seal-soft)}
.player .ctrl-btn svg{width:26px;height:26px}
.player .ctrl-btn:disabled{opacity:.3}
.player .play-btn{
  width:74px;height:74px;border-radius:50%;
  background:var(--seal);color:#FDF9EF;
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 14px rgba(166,60,43,.30);
  margin:0 auto;
}
.player .play-btn:active{transform:scale(.96)}
.player .play-btn svg{width:30px;height:30px}
.player .play-btn.pending{background:var(--ink-soft);box-shadow:none;opacity:.65}
.player .opt{display:flex;align-items:center;gap:14px}
.player .opt label{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.switch{position:relative;width:38px;height:22px;border-radius:22px;background:rgba(47,42,36,.25);transition:background .25s;flex:0 0 auto}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .25s}
.switch.on{background:var(--seal)}
.switch.on::after{left:19px}
.player .opt input{display:none}

/* ===== 目录抽屉 ===== */
#drawer{
  position:fixed;inset:0;z-index:50;pointer-events:none;
}
#drawer .mask{
  position:absolute;inset:0;background:rgba(32,28,22,.42);opacity:0;transition:opacity .3s;
}
#drawer.open{pointer-events:auto}
#drawer.open .mask{opacity:1}
#drawer .panel{
  position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);
  background:var(--paper);transform:translateX(-102%);transition:transform .3s;
  display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.18);
}
#drawer.open .panel{transform:translateX(0)}
#drawer .panel header{
  border-bottom:1px solid var(--line);
}
#drawer .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 0 30px}
.ch-item{
  display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;color:var(--ink);
  border-bottom:1px solid rgba(47,42,36,.05);
}
.ch-item:active{background:var(--seal-soft)}
.ch-item .no{
  font-size:12px;color:var(--gold);letter-spacing:1px;flex:0 0 auto;
  font-family:"Noto Sans SC",sans-serif;
}
.ch-item .nm{flex:1;font-size:16px;letter-spacing:1px}
.ch-item .cnt{font-size:12px;color:var(--ink-soft);font-family:"Noto Sans SC",sans-serif;flex:0 0 auto}
.ch-item .state{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--seal)}
.ch-item .state.pending{background:rgba(166,60,43,.28)}
.ch-item.current{background:var(--seal-soft)}

/* toast */
#toast{
  position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);
  background:rgba(47,42,36,.92);color:#F6F1E5;font-size:13px;padding:9px 16px;border-radius:20px;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:60;
  font-family:"Noto Sans SC","PingFang SC",sans-serif;letter-spacing:.5px;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon-btn" id="btnDrawer" aria-label="目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="title"><span class="seal-dot"></span>掌中解脱</div>
    <button class="icon-btn" id="btnFont" aria-label="字号">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h9v3H8v9H5V9H3V6zm13 1h-2l-5 12h3l1.2-3h5.6l1.2 3H23L16 7zm-1.5 6 1.8-4.6L18 13h-3.5z"/></svg>
    </button>
  </header>
  <main id="main">
    <div class="chapter-head">
      <div class="kicker" id="kicker">菩提道次第二十四天教授</div>
      <h1 id="chTitle">第一天</h1>
      <div class="sub" id="chSub">纠正动机与观察所修之法</div>
      <div class="rule"></div>
    </div>
    <div class="seg-progress" id="segProgress"></div>
    <div class="body-text" id="bodyText"></div>
  </main>
  <div class="player">
    <div class="track" id="track">
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="time" id="time">00:00 / 00:00</div>
    </div>
    <div class="row">
      <button class="ctrl-btn" id="btnPrev" aria-label="上一段">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6V5zm12 .7v12.6c0 .9-1 1.4-1.7 1L8 13v-2l8.3-4.3c.7-.4 1.7.1 1.7 1z"/></svg>
      </button>
      <button class="play-btn" id="btnPlay" aria-label="朗读">
        <svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg>
      </button>
      <button class="ctrl-btn" id="btnNext" aria-label="下一段">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2V5zM6 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5c-.7-.4-1.6.1-1.6.9z"/></svg>
      </button>
      <div class="opt">
        <label><input type="checkbox" id="chkAuto"><span class="switch" data-for="chkAuto"></span>连播</label>
      </div>
    </div>
  </div>
</div>

<div id="drawer">
  <div class="mask" id="drawerMask"></div>
  <div class="panel">
    <header>
      <div class="title" style="font-size:16px"><span class="seal-dot"></span>目录</div>
      <button class="icon-btn" id="btnClose" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="list" id="chList"></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ===== 数据（在线发布版：内嵌，无需 fetch） ===== */
const BOOK = [{"c": "第一天", "segs": ["纠正动机与观察所修之法（作为引导的加行，无等法王帕绷喀大师首先开示如何纠正我们的听法动机。）哦！是啊！正如三界法王宗喀巴大师所说：暇身胜过如意宝，唯有今生始获得，难得易失如空电，思已则觉世间事，纵劳无益如扬糠，故应昼夜取坚实。至尊恩师如是修，欲解脱者如是行。从无始以来直至现在的一切生中，我们在生死中没有哪一种痛苦未曾经历过，也没有哪一种快乐未曾享受过。虽然受取过那么多的身体，但它从来不曾使我们获得任何真正有价值的东西。如今值此获得清净暇满身之际，我们必须要做一些有真正价值的事。我们在不做观察的时候，对获得这样的妙身，一点也感觉不到特别的欣喜，还不如得到一二两银子感到更高兴些；对于浪费我们的暇满，一点也不觉得惋惜，还不如失去一二两银子感到更可惜些。然而，我们所得的这个身体，其价值远胜如意摩尼宝十万倍！如果将如意摩尼宝洗三次、擦三次使之干净后，安置在幢顶上供养，那么衣食等现世的快乐都能不劳而获。但是即便获得这样的如意摩尼宝一百个、一千个、一万个甚至十万个，它们也无法使我们后世不入恶趣，而这还只是暇满身所能为我们办到的最小利益。", "依赖此暇满身，如果我们想要不入恶趣，它就能为我们办到。同样地，如果我们想成就梵天、帝释等身，它也能为我们办到。同样地，如果我们想去妙喜、极乐、兜率等净土，它也能为我们办到。不仅如此，我们现在没有获得解脱与一切智位，仅仅是因为我们未去修罢了，事实上，依靠此身同样能办到。尤其是用别的方法需要修三大阿僧祇劫才能获得的双运金刚持位，依靠此身却能在浊世短暂的一生中获得成就。我们现在的人身远胜于十万俱胝个如意摩尼宝，所以如果这样的妙身得到后又白白浪费的话，那将比白白扔掉十万俱胝个如意摩尼宝更为可惜，再没有比这个更亏损、更愚痴、更自欺的事了！怙主寂天曾说：得此闲暇身，我若不修善，自欺莫胜此，亦无过此愚。如果我们想取心要，必须就从现在开始。这有两个原因：死决定与死期不定。举例来说，我们现在参加法会的这些人，一百年后恐怕一个也不在了。以前，我们的大师释迦牟尼佛，虽多劫修集二种资粮，获得如金刚般坚固的身体，但末了还是显现出涅槃相。后来印度、西藏的智者、成就师、译师、班智达等也已全都示现涅槃相，只剩下一个名字供后人说：“某某时代有某某大师在世。", "”现在我们在任何地方，都无法指着某个人说：“此人从很久以来一直未死而活到了今天。”当然我们也不应该有这样的指望。既然如此，我又怎么会成为唯一的例外呢？", "不仅死亡是决定的，而且死期还是不定的。我们之中没有人能肯定地说，明年此时自己是否还穿着三法衣坐在人群当中。明年这个时候，我们或许已经投生在畜生中，身上披着长长的毛、头上长着竖起的角；也许已经投生在饿鬼中，连一滴水都得不到；也恐怕已经投生在地狱中，正受着寒、热、烧、煮的痛苦；这一切都难保不会发生。心相续在死后是不会就此终止结束的，我们必须不断地再次受生，而所生之地不外乎善趣与恶趣两个地方。倘若我们受生在无间地狱，那么我们的身体将与烈火区分不出来。即使是生在地狱中痛苦最轻的“等活地狱”，每天也要受死一百次又活一百次等等的苦楚。现在我们把手放入火中一会儿都无法忍受，又怎能忍受那样的大苦呢？地狱中所受的苦与我们现在这个身上所受的苦是一样的，不要认为它会变得轻一些。如果生在饿鬼中的话，多年之中将连一滴水都难以得到，我们现在视禁食斋等为畏途，又怎能忍受投生在饿鬼中的苦呢？假如受生在畜生中的话，以狗为例，仔细研究一下它的住所、它是如何觅食的、以及通常它能获得怎样的食物等等，然后设想一下，一旦受生为狗，我们又该如何忍受这般痛苦呢？", "我们总喜欢把恶趣想成是极为遥远的地方，但事实上恶趣与我们之间的距离仅在呼吸之间。在不做观察的情况下，我们似乎不大会担心自己将堕入恶趣，我们常对自己说：“毕竟我平时还能持戒，也能念念经。至于罪嘛，我从未做过杀人打马这样的大恶。”然而这只是不善于观察而导致的自欺。如果认真加以思考，我们可以发现，入不入恶趣是不能由我们自己决定的，而是取决于我们所造的业。我们相续中有很多业，善与不善混在一起。哪种业力量最大，临死前就会被爱、取所触发。如果我们检查一下我们现在相续中哪种业力量大的话，我们会发现多半是不善业的力量大。", "业力的大小，与造业的动机、正行及结行等强弱有关。因此，即便是我们认为很小的不善业，实际上也会变成很大的恶业。譬如说，虽然只用一个词去骂自己的弟子，如果责骂的动机是带有很大的瞋恚，骂又骂得极为恶毒、粗鲁，最后又生起很大的傲慢。这样的话，加行、正行、结行三者都做得很“圆满”。另以杀虱子为例，如果以极强的瞋心动机，杀的时候先用手指挤压虱子，折磨它很长一段时间，再将它杀死，最后又沾沾自喜地想：“这下我感到好多了。”这样的不善业也会变得很有力量。另一方面，我们总感觉自己所作的善业力量很大，但实际上却非常微弱。善业要成为大力的善业，加行动机、正行与结行回向等各方面都必须清净才行。关于我们作善时最初的动机，姑且不论是否出自最上的菩提心和中等的出离心，恐怕就连最下的希求后世之心都很少见。在通常的情况下，我们首先想到的是，希望能实现现世安乐的意愿，然而任何想达到这些目的的发愿全部是罪业。正行也多不清净，修法又缺乏热忱，即便用念珠念一圈“嘛呢”都难以专心致志，不是瞌睡就是散乱，连好好念一遍《兜率天众颂》都很困难。结行中的回向发愿也多半流于现世这一方面。所以，我们自以为很大的善，实际上却极微弱。", "有些人加行不清净，有些人动机和结行不清净，更有人这三者都不清净。由于我们相续中不善业的力量很大，因此只有不善业会在临终时被触发。一旦被触发，那么下辈子去的地方也就只有恶趣。所以可以肯定地说，我们下辈子几乎都将投生在恶趣之中！现在我们当中有许多人，喜欢跑到据说有神通的师长那里去求卦、求预言和推算，询问自己后世将生在何处。那师长如果说好，便觉得放心，如果说不好则会感到害怕。然而这岂是保信之法？我们根本没有必要靠打卦、预言、推算去了解后世将到何处去。大悲大师释迦佛早就在珍贵的经典里对此做了授记，印度、西藏的众多班智达、大成就者也都做了授记。譬如，圣龙猛在《宝鬘论》中说到：不善感诸苦，如是诸恶趣；善感诸乐趣，诸生获安乐。所以，我们现在虽然不能以现量决定后世将往何处，但由于佛能如实观见“极不现事”，因此我们可以依靠佛的圣言量用“信解比量”来获得决定。我们投生恶趣几乎是肯定的，既然这样，就应该马上去寻找一种能够使我们免于受生恶趣的方法；而想要从恶趣中解脱出来，就必须找到有能力救护我们的归依处。", "如同将被处决的罪犯请求有权有势的官员庇护一样，犯有重大罪业的罪人面临恶趣判决时，能够救他的也只有三宝，所以我们必须向三宝求归依。仅仅向三宝求救是不够的，凡是他们鼓励的事我们就必须去修，凡是他们禁止的事我们就必须去断，这样才可以。如果佛能用手来救拔我们，用水来洗去我们的罪障，那么佛早就做了，我们现在也就不会受苦了。然而事实并非如此，释迦牟尼佛只能为我们说法，并劝导我们对业果做出无误的取舍，经中说：诸佛非以水洗罪，亦非以手除众苦，非将所证迁于他，示法性谛令解脱。因此，我们必须想到：为了解脱恶趣我应归依三宝；对于解脱恶趣的方法——业果取舍——我应如理地去修！能做这样的思惟，便是根据“共下士道”来纠正我们的动机。", "那么，单从恶趣中解脱出来就行了吗？不行！即使我们能逃脱恶趣，获得一、两次善趣身，但最终还是会遇到某种恶业而堕回恶趣，所以这种结局是不稳固和不可靠的。过去我们曾多次得到过善趣身，但又都堕入恶趣，现在也肯定会再次发生。在前生中，我们曾多次受生为大梵天或帝释，住在天宫内，而死后又不得不多次堕入地狱，在炽燃的铁地上翻腾、打滚。同样地，我们曾在天界长时间受用天甘露，而死后又得去喝地狱里的烊铜；我们曾与天子、天女一起娱乐，然后又被地狱中可畏的狱卒所包围；我们亦曾受生为转轮王，为十万户臣民之主，然后又受生为世上最下贱的奴仆，如驴倌、牧童等；我们亦曾受生为日月天子，以自身光明照耀四大部洲，然后又受生在洲与洲之间暗无天日、伸手不见五指的地方。如是等等，不管我们得到多少生死的快乐，这里面没有一样是靠得住的、真正有价值的。我们以前已受过那么多的苦，如果现在还不从生死中解脱的话，将来要受的苦比这还要多。假如把我们过去受生为猪、狗等畜生时吃过的脏东西、粪便等放置在一起，那将比须弥山还要高；除非我们解脱生死，否则还必须吃更多这样的东西。假如把我们过去被怨家砍下来的头堆聚在一起，恐怕要超过梵天世界；", "如果还不斩断生死，使其结束，那么被敌人砍下来的头将会更多。假如把我们过去在地狱中喝过的烊铜汇聚在一起，那将比大海里的水还要多；除非我们从生死中解脱出来，否则还要喝更多的烊铜。所以，只要能好好地想一想我们以后无止尽地在生死中飘荡的情形，便足以在我们心中引发对生死的恐惧。在生死中，即便天、人之身也不外乎纯系痛苦的自性。生于人中，有生、老、病、死之苦，与所爱的人分离之苦，与怨家遭遇之苦，得不到想要的东西之苦等；生于非天中，有战争中身体被割裂之苦，及长时间因嫉妒而忧愁之苦等；生于天中，欲界天有死相笼罩之苦。上界诸天虽然没有明显的痛苦，但仍具“周遍行苦”的自性，有难以安住本位不得自在、最终必须下堕等之苦。总而言之，在没有彻底解脱生死之前，一切都逃不出苦的自性；所以，我们必须从这种环境下解脱出来，而且必须以我们现在的人身开始。我们之中大部分的人，总认为我们在今生中绝不可能获得解脱而将希望寄托于来世；然而事实上，以我们现在的人身是能够办得到的。我们已获得暇满人身——这是修法的殊胜身——也遇到了佛教等。在现在远离一切违缘、具足所有顺缘的情况下，如果我们还无力求解脱，那么何时才行呢？", "所以，我们应该当下即求解脱生死，而获得解脱的方法，不是别的，就是宝贵的增上三学。因此，我们必须想到：为了从生死大苦海中解脱出来，我必须尽力学习宝贵的增上三学！能做这样的思惟，即是根据“共中士道”次第来纠正我们的动机。那么，这样就足够了吗？不够！因为即便为了个人自身的利益而获得声闻、独觉的阿罗汉位，也还难以完全圆满自利，利他也是很微小的，这是因为我们尚未能断除“所知障”和“四种无明”等的缘故。正如所谓“渡一次河需撩二次衣”，就算由小乘道获得阿罗汉位，最后还是得发菩提心入大乘资粮道，从头开始学佛子行；就像新入寺者，从行茶僧开始干起，直到升任堪布，后来转到其他寺院，也还是得再从行茶僧干起一样。因此，从一开始就入大乘是十分重要的。又如《弟子书》中所说：诸亲趣入生死海，现如沉没漩涡中，易生不识而弃舍，自离无愧何过此！", "虽然我们与其他有情众生互不相识，但他们没有一个未曾作过我们的母亲；正如我们在生死中有过无数次受生一样，我们也有过无数的母亲，因此每一个有情都曾当过我们的母亲。他们每次当我们母亲的时候，与我们今生的母亲没有差别，全都是以同样的恩德来抚养我们；因此，一切有情与今生之母无丝毫不同：都曾作过我们的母亲，都曾以恩德抚养过我们。有些人也许会想：这一切有情不会是我的母亲。如果是的话，我应该认得，可是我并不认得呀！然而单靠不认识这一点，并不能作为证明他们不是母亲的理由，事实上有许多人甚至连自己今生的母亲也不认得！我们也可能这样想：他们之前作我母亲的时代已经过去了，所以不应该再把他们视为有恩之母。然而，就他们曾作我母亲与他们曾给我恩德这件事而言，前生与今世并没有丝毫的不同。譬如，去年饶益于我、施我饮食财物者，与今年饶益我、施我者，恩德相同，这个事实并不会因为时间有前有后而发生变化。因此，一切有情全都是对我们有恩的母亲。", "像这样的恩人堕在生死大海的漩涡中，如果我们就这样随随便便地抛弃他们，只顾自己求解脱的话，不就像眼看着母亲等极亲爱的亲属被大海的漩涡卷走，在大海中害怕地哭叫，即将沉没，而这个作儿子的却在岸边心不在焉地唱歌跳舞，只顾自己玩乐，还有比这种更下贱与无耻的行为吗？木船与皮筏一旦被卷入漩涡，定会有极为恐怖的灭顶之灾。像这个譬喻所说的那样，我们现在似乎觉得，我们与这一切被卷入生死大海漩涡的有情没有任何关系，而实际上并不是这样，他们全都是我们有恩的母亲。对于这些恩人，我们必须报恩！施饥者以食物，施渴者以饮水，施贫者以财物，让他们满足暂时的需求，虽然也有一点报恩的意味，然而仅此并没有多大的利益。最上等的报恩方法，就是要让他们具足一切安乐、远离一切苦恼，再也没有比这更超胜的报恩了。所以，我们应该生起慈心：“愿一切有情具足安乐”；生起悲心：“愿一切有情远离痛苦”；我们也应该生起增上意乐，心想：“使这些母亲具足一切安乐、远离一切痛苦的担子就落在我的肩上，因此，我应该靠自己去完成这项使命。”然而，我现在有这样的能力去做吗？目前不要说是一切有情，恐怕就连一个有情我们也没有能力去利益。那么谁才有这样的能力呢？", "虽然声闻、独觉与清净地菩萨能利益有情，但并不圆满，无法与佛相提并论；因此，在利益有情方面，只有佛是无与伦比的。比如说，佛身所出一一光明都能成熟和解脱无量有情；在每个有情面前，佛均能变化出适合于这个有情的界、根、意乐及随眠的色身，并用该有情的语言为之说法等等。那么，我有没有能力获得这样的佛位呢？有的！成佛所需身中最殊胜的是暇满身，赡部洲人所具有的胎生六界之身，是极其殊胜的，以此便能在一生中成就双运金刚持位；我们只是没有去修才没能成佛罢了。成佛的方法是大乘法，而我们已遇到了圆满无误的圣教心要——“佛陀第二”宗喀巴大师的显密双修无垢教法。简言之，我们只是被自己的不精进所蒙骗，事实上我们具有远离一切违缘、具足一切顺缘之妙身；如果现在还不能去修，将来肯定不会再有比这更好的身和更妙的法了。有些人说：现在是浊世、是恶劣的时代。其实从无始以来，我们从未经历过比现在更好的时代！现前侥幸能获得这样一次良机，值此之际，我们更应尽力地去修习佛位；因此，我们应当想到：为了利益一切有情，我必须尽力去获得无上圆满菩提！并忆念菩提心的所缘行相。能做这样的思惟，便是根据上士道次第来纠正我们的动机。", "只有当行者生起“无励力”的体验时，才算真正地发起了菩提心。", "为获得这样的佛位就必须要修行，为了修行就必须要知道修法。尽管我们有修法之心，跑到僻静的地方，自以为是地念念咒、发发愿或修一、两次“住心”；若不知修法的话，还是不知道该怎样下手的。想了知修行的方法，就必须学习一种圆满无误的教授，而这样的教授之王，便是我将要讲的“菩提道次第”。因此，诸位务必发起这样的动机来听法：我要认真地听闻“菩提道次第”，然后将它用于实修。无论我们做什么事，最初的纠正动机是最要紧的，尤其是在听“菩提道次第”引导的时候，更不能以为随便用什么动机都可以；最低条件，必须要由造作的菩提心摄持才行。已有菩提心体验的人，只需简单地回想一句短语——“为利有情愿成佛”即可；但对初业行人来说，单靠这个是无法让我们的心改变的，只有从“暇满”“利大”“难得”开始依次忆念，才能令心转变，引出菩提心所缘行相。不仅“道次第”如此，我们甘丹山派在传任何灌顶、经教和引导之前，都要以一整套“三士道次第”来纠正动机。我的大宝师长时常教诫说：即便在发愿中，也包含着简略但全面的“三士道次第”，这是我们新、旧噶当派无上的特别之处。所以，在座肩负弘扬圣教之责的诸位，都必须这样来学。", "然而有一个例外是，在传“长寿灌顶”时，按照传统，师长只讲“暇满”“利大”“难得”之类，而不讲“无常”，这是因为怕缘起的关要有错误的缘故。在参加本次法会的人当中，有的是抱着“我能来听法，这因缘真是太好了，修则非我所能”的想法来；有些人则是随大众而来，心想：“如果你们去，那我也去。”但从另一方面讲，由于此次说法与其他大灌顶等不同，人们至少不会这样想：“我来求这个法是为了能做经忏。”如果是大灌顶的话，有些人可能就会有这种想法：“求了这个法之后，我便能以念咒等获得降伏魔鬼的能力，以及息灭病魔、招财、怀摄等等。”还有些人尽可能地多听闻，将法视为做买卖的资本，然后跑到蒙古等地方去兜售；这些都是假托佛法而造集的大罪！将佛所说的能成就解脱与一切智的方法用于现世的目的，就如同把国王从宝座上请下来而委以打扫的工作一样；因此，如果诸位觉得自己有上面所说的那些不好的动机，就请你们将之丢弃，至少要好好地生起造作的菩提心来听。以上所说是有关如何纠正听法动机的内容，现在我们转入正行部分。关于所听之法，首先要弄清楚以下几点：第一，所修之法必须是大师佛陀所说的；其次，必须是经过诸位班智达阐释抉择的；", "第三，必须是由那些大成就者修习后在相续中发生证悟的。我们应该修这样的法，至于其他佛没有讲过的，任何智者、成就者都不知道的所谓甚深教授，再怎么修，其结果也只能是佛未曾得到的，或是其他智者、成就者根本成就不了的。因此，我们首先必须观察所修之法，如萨迦班智达所说：事关马宝等，不大之买卖，问他善思量；于今生小事，尚如此勤苦，诸生长久事，虽有赖正法，妙劣不观察，遇法即信受，如狗食不可。我们在做马的买卖时，通常要做多次的调查研究，请教专家和询问众人意见。或以购茶的僧人为例，他总要反复地观察茶叶的色泽、重量和形状，要认真地研究茶叶是否有被水泡过等毛病，和询问别人的意见；而这种事即便上当，最坏的情况，其实也不过是损失几杯茶而已。人们似乎常对这种暂时的小事做详细的研究，却对实现我们今后诸生长远目标的基础——所修之法——不做任何的观察，就像狗吃东西一样，随便遇到什么吃什么就觉得满足了。这实在是个可怕的错误，绝对不可！因为法若有误，势必会导致今后诸生的长远目标也发生差错。因此，我们在实修前，必须对所修之法加以认真观察。如果能够这样观察，就可以发现再没有比这个“菩提道次第”更殊胜的法了。", "密法的甚深，也依赖于“道次第”才得以体现。“三主要道”没有在相续中生起来，我们是无法靠密宗道在一生中成佛的。以前我曾听过不少“净相”和“伏藏法”等被认为是甚深的教授，也见过很多“羯磨集”等所谓稀有的密法，但是这里面根本见不到“三主要道”体验法或体性特别的教授。这个“菩提道次第”既不是宗喀巴大师创造的，也不是阿底峡尊者发明的，它是由佛陀正等觉本人所传下来的。一旦理解了这个教授，将认识到不管经题中是否有“道次第”这个名字，其实一切佛经都是“道次第”。例如，一切佛经中最上、最胜、最妙的是大宝《般若波罗蜜经》，此经包含八万四千法蕴一切关要，正式宣讲的是“甚深道次第”，隐义宣说的是“广大道次第”。其传承之次第是：“广大道次第”由佛陀上首弟子弥勒传于无著；“甚深道次第”由文殊传于龙猛，从而形成二种不同的“道次第”传承。弥勒造“五法”，无著造“五地”，龙猛造“六正理聚”等论以解释“道次第”。以前，深、广道次第是分别传承的。无等阿底峡尊者从金洲大师处听受广大道次第，从正理杜鹃处听受甚深道次第，而将教授合流。不仅如此，他还是由文殊传寂天的“广大行传承”和密法传承等显密全圆传承的继承者。", "阿底峡尊者在藏地造出了摄集圣教全圆关要的《菩提道灯论》，现在流行的“道次第”一名就是从那时起开始有的。从那以后，见、行传承虽已合流，但因为广略的不同又分为噶当“教典”“道次第”和“教授”三派。后来，宗喀巴大师在洛札大成就者和扎廓堪钦·却嘉桑波二位大师前听受这三派教授，从那以后，这三派又变成一个传承。宗喀巴大师在热振的狮子岩脚下著出《道次第传承师长启请·开胜道门》一文，并将阿底峡尊者“侧头像”迎请来。在做启请的时候，大师亲见“道次第”一切传承师长现身说法，尤其是亲见阿底峡、仲敦巴、博朵瓦、霞惹瓦诸师达一月之久。最后，仲敦巴等三位师长融入阿底峡身中，阿底峡将手置于宗喀巴大师头顶上说：“去做利益圣教的事业吧！我将作你的助伴！”实际上，这是劝请宗喀巴大师著述《道次第广论》。于是宗喀巴大师完成了《道次第广论》奢摩他章以下的部分，后来又经至尊文殊劝请，完成了大毗钵舍那章。这部论著姑且不论其他方面，只要看一看造论的劝请者，就可以知道这是部包含了加持宝藏的大论。该论后跋中的“从佛菩萨微妙业”等数语，便隐含着这层意思。后来，宗喀巴大师又省去《道次第广论》中的繁说，摄其要义著出《道次第略论》；", "前者以“讲传”为主，此论则以“耳传”为主，教授的关要各有不同，可相互补充。宗喀巴大师意识到，将来会有人不知如何将这些较广的教授用于实修，他本人曾指示说：“然能了解一切讲说皆为修持者，实属少数，可先将所应修持之事予以摘略，另著专书详述。”于是有了嘉旺·索南嘉措（福海）的《道次第·纯金》；第五世达赖喇嘛的《道次第·文殊口授》（此论可视为《纯金》的注解）；班禅·洛桑却坚（善慧法幢）的《坦途》；至尊洛桑益西（第五世班禅善慧智）的《捷径》（此论犹如《坦途》的注解）。宗喀巴大师的三种道次第，以及上述四种“明晰引导”，加上达波·昂旺札巴（语自在称）的《善说精髓》，这八种合起来便称为“道次第八大引导”。由于这些本颂、注释无法以一概全，所以必须分别获得它们的引导传承。特别是《文殊口授》引导传承，有广略二种，因传承住持者分别来自中部和南部，所以分为“中传”和“南传”二派。其引导传承也必须分别获得。仲巴达浦巴父子后来看到《文殊口授》时说，如果早些看到此论，他们在修这些所缘的时候就不会有那么大的困难了；可见在《捷径明晰引导》与《文殊口授》二论中各包含着对方所没有的深要。", "大师释迦佛在世的时代，只有“经教传承”，别无“引导传承”，由于后来的人单靠“经教传承”无法理解，所以才另有“引导传承”。引导可分成几种形式：“讲解引导”是指对书本上的文字进行详尽的解释；“明晰引导”是指不做文字上的广释，而直接提出教授的心要进行教导，就像善巧医术者把新鲜的尸体剖开，直接为弟子介绍五藏六腑的构造一样；“经验引导”是指师长针对弟子的相续，根据自己的经验进行讲解；“体验引导”是指让弟子住在禅房附近，每次为弟子开示一种所缘类，然后令其回去修。如果前面的体验尚未生起，则不说后面的所缘，直到前面的体验生起，才会再接着讲下一个。这些引导各有其经验加持，对调伏相续利益极大；现在这里所讲的，便是采用“经验引导”的方式。为了方便那些从别处赶来，缘分不大，且只能听一、两次的人，现将《捷径》和广、略《文殊口授》以及与后面“自他相换”章有关的《修心七义》这三部论合起来讲。施主们启建这次法会，旨在为已故的两位公爵大人回向善根，在我这边，我想说的是：其他灌顶等法对师徒双方而言，利弊俱存。讲《道次第》则没有这个问题，所以我很乐意为大家讲，也能肯定这将给每个人带来极大的利益。", "因此，我恳求诸位尽自己最大的努力去实修，并应当为已故和在世的施主们祈福。（接着帕绷喀大师略微传了三种《道次第》的开头部分，然后散会。）24掌中解脱菩提道次第二十四天教授"]}, {"c": "第二天", "segs": ["阿底峡尊者生平与藏地道次第引导的起源（第二天，大宝师长嘉杰·帕绷喀仁波切做了如下开示：）法王大宗喀巴说：一切佛经心要义，是诸菩萨所赞道，有缘求解脱津梁，我今随力而宣说。一切佛经的心要精华是“出离心”。下士道中，这意味着厌恶三恶趣；中士道中，这意味着厌恶生死中的一切。如果不依靠像“道次第”这样的教授，是生不出“出离心”来的。诸菩萨大士所赞之道是大宝“菩提心”，求解脱的津梁是“离边见”。如果不依靠像“道次第”这样的引导法，这些也是不可能生起的。所以，为了成佛，就必须在相续中生起这“三主要道”，要生起这三个主要道，就必须依靠道次第才行。因此，诸位在听法前，请你们先认真检查一下所有的动机和威仪，正确的动机应该是：为了利益一切有情，我应获得佛位，为此我来听受三士道次第经验引导，而后去实修。你们将要听到的法，是有缘者趣向佛位的大乘法范、是龙猛和无著二位大车的轨辙、是吉祥无等阿底峡尊者和三界法王大宗喀巴心髓般的甚深教授，是八万四千法蕴一切关要无不具足、经过编排整理而成的修持次第，也是任何一个补特伽罗成佛所必需的修法。", "讲“菩提道次第”简略经验引导必须根据科判，即必须以正行的某一科为基础，在这之上做到“道次第”的体性决定、数量决定和次序决定；再决定此科内什么是所缘、什么是相关的解释、什么是教理、什么是故事、什么是教授口诀，然后才去修。如果听闻和修习不依科判，胡乱地混一起，便很难利益自心；这好比把茶、酥油、盐和碱混放在一个器皿中饮用，味道肯定不佳。“道次第”科判有很多种，如《道次第广、略论》科判等。修持应以自己获得的某种“道次第”科判为基础。现在呢，是依据我大宝师长的规矩，以《捷径》为主，另以众多教授为庄严所造的科判来讲。这一科判以前未写成文字，我曾郑重地在大会上或私下向师长请求，花了很大的功夫才将它编写成文字。这个科判广略适中，生起体验的方法十分特别、与众不同，具有很多的关要。现在我就按这个科判来讲。印度两大佛学中心之一的吉祥那烂陀寺诸位智者，主张由“三清净门”说法，即：阿阇梨语清净、弟子相续清净和所说法清净。止迦摩啰室啰寺的智者们认为以下三事为最重要的前导：正法作者殊胜、正法殊胜，以及如何闻说该法之理。这里按后者讲。“菩提道次第”引导分四大科：（甲一）为显其法根源净故开示作者殊胜；", "（甲二）令于教授起敬重故开示其法殊胜；（甲三）如何闻说具二殊胜法之理；（甲四）如何正以教授引导弟子之次第。这四条是《道次第广论》的科判，按照口传，不论讲哪一种广、略“道次第”教授都要有这四科，否则，听者便生不起决定，所以现在从第一大科讲起。", "甲一、为显其法根源净故开示作者殊胜如昨天已说的那般，我们在观察所修之法时，应该按照印度智者的规矩，看看它们是否符合以下三个条件：必须是佛陀所说的、必须是经班智达抉择过的、必须是经诸成就自在者修习后在心相续中生起证悟的。从修行者自己这方面来讲，如果信心、智慧和精进不足，便不会有收获；但从法这方面来讲，如果修的是相似法，也绝对不会有结果。我们见过不少有智慧、肯精进的人，因为这个原因而浪费了一生。其他所谓甚深的教授，诸如“净相”等等，不管它们是什么，大都如我前面说过的那样，不外乎是些“本尊成就法”以及依此而修的各种“事业法”。在这些教授中，有的时候甚至连三宝都没有明确提及，更不要说有生起“三主要道”体验的方法了。正如一切江河的源头应该出自雪山一样，正法的源头也必须出自大师佛陀。如果师长有时间并且知道如何详细解说的话，应该从大师佛陀开始，讲解“道次第”所有传承师长的传记，亦即师长们如何依此道获得果位的情况。由于传承师长数量太多、内容又很长，所以现在没有时间详谈，在此我只能简单地介绍一下。", "（随后嘉杰·帕绷喀仁波切简单讲述了从大师佛陀至阿底峡尊者之间两种不同传承的更替，以及从阿底峡尊者开始传承合流的一些情况。）像这样，从阿底峡尊者那时开始，传承便合流了，尊者在西藏造《菩提道灯论》，从而将这些教授引入西藏。“道次第”这个名字也是从那时起开始有的。由于《菩提道灯论》是此后《道次第》《胜道》《圣教次第》等一切相关著作的根本文，所以，阿底峡尊者实际上也是这些著作的作者。宗喀巴大师也说：故彼《菩提道灯论》之造者，亦即此《菩提道次第广论》之造者。", "虽然在此应该详述阿底峡尊者的传记，但因条件不允许，故而只能简单地讲一下。此传记分三部分：乙一、圆满种姓中受生之理阿底峡尊者的诞生地位于东印度萨霍尔境内的榜噶拉城。这个城市很大，约有三万五千名居民，周围属民达十万户。王宫名“金幢”，具有十三层金顶和二万五千座金幢。是个财富众多、权势强大的王国。国王名“善吉祥”，王后名“吉祥光”，阿底峡是他们的次子，诞生时伴有众多稀有的征兆。乙二、其身获得功德之理尊者诞生后满十八个月时，父母带他前往附近毗札麻拉城中的寺院。一路上，全城百姓争相瞻仰小王子的风采。王子看见人山人海的场面，问父母道：“这些人是谁？”父母回答说：“他们是你的臣民。”王子便以大悲心看着他们，最稀奇的，他还用悦耳的声音说道：愿此等众悉如我，常生王家父母贤，国政权势福德盛，皆为正法所长养。抵寺后，父母等其他人均发愿今生长寿无病、受用圆满，后世不堕恶趣、生于善趣等等，这位王子却发愿道：我得暇满人王身，诸根无过见三宝，常敬顶戴三宝尊，今后请作归依处。愿终不为家法缚，处僧伽中获法财，远离我慢供三宝，悲心观照诸有情。", "尊者诞生为王子后满十八个月，便能说出归依和发心这样的话，仅此就足以令人对他生起极大的信心。", "随着年龄的增长，王子逐渐成长为一位智者，如《噶当宝籍》中所说：王子三岁时，善历算、字、声，年甫六岁时，能辨内、外道。知道如何分辨内、外道的差别是件很困难的事，尊者自己曾说：“在印度只有我、那若巴和馨底巴三人知道分辨内、外道的差别。现在那若巴已去世，我来了西藏，所以目前印度的形势是很艰险的。”尊者在六岁时就能分辨内、外道的差别，表明从那时开始他已经是个极为善巧的智者了。王子十一岁时，许多有望成为王妃的王女们用唱歌跳舞等各种方法，试图唤起王子贪欲，但这反而增强了王子的厌离心。另外，度母也化作一名绀色童女前来劝请：莫贪莫贪有缘者，如象沉溺芦苇塘，勇士若溺欲泥中，清净戒衣岂不毁？第一个“莫贪”是指莫贪现世，第二个“莫贪”是指莫贪生死；就如同大象沉溺一样，身躯庞大的动物要比其他动物更难从淤泥中拔出。由此比喻看来，“勇士若溺”也就说明：如果普通人作恶，除他自己之外，对圣教和众生不会有大的损害；但是如果大活佛的行为有所闪失，那么将会导致整个地区圣教的衰败。相对地，如果大活佛凡事都能如理而行，也将使该地区的圣教得到弘扬。所以，对你们这些大活佛来讲，具备智、尊、贤三德和守护甘丹派清净见、修是很重要的。", "这些是别义，现在接着讲阿底峡的故事。小王子很高兴地对上述劝请做了回答。不久，他身披戎装，由一百三十名骑士陪同外出巡游，表面上是游山，实际上是寻访师长，做善巧方便之行。他遇到了住山的胜敌婆罗门，婆罗门授以归依发心，并告之应往那烂陀寺，寻访其无始生中之师菩提贤。然后他又遇到了菩提贤大师，供上珍宝，令大师欢喜，大师入三摩地加持王子身、语、意三门，授与许多发心教诫，遣送王子至正理杜鹃师处。师授与发心及教诫后，又遣送王子至其前生之师阿瓦都帝巴处。王子与大师会面时，大师说：“今日回到你的王国去吧，观察了家室的过患后再回来。”王子的父母看到王子回到家中十分高兴，便问：“月藏，你到哪里去了？走得不累吧？心里没有厌烦吧？你能回来真是太好了！”王子回答说：往求能仁归依师，遍访山中阿兰若，所至皆见生死过，所遇亦说生死失。任做何事心不快，愿许出离求正法。父母告诉他说：“你虽厌恶生死，但仍然可以主持国政，供养三宝，惠施贫穷，建立伽蓝，迎请僧众，这样做也能让一切人众获得安乐。”王子答道：“我长时间观察生死，已没有丝毫贪恋国政之念。", "对我而言，金殿和牢狱无异，妃子和魔女无异，三甜饮食和狗肉脓血无异，宝饰锦衣和垃圾堆中的粗毛毡没有丝毫的区别。所以，我要去密林中修习禅定。今天我准备带一点肉、奶、蜂蜜和糖，回到至尊阿瓦都帝巴跟前去。”接着又唱了一首歌，双亲也只好由他去了。王子随后携带一千名骑士返回森林，顶礼于阿瓦都帝巴足下，大师为他做发心大乘灌顶，并说：“去黑山寺见吉祥罗怙罗，他也是你前世的师长。”王子随后去见罗怙罗大师，当时大师正在宣说密续，遥见王子，知其为求法而来。为了使众人生起敬畏，便向王子身上降下一道霹雳，那道霹雳转而落到了外道的黑塔山上。大师的瑜伽师弟子们看到这一情况，便问大师来者是谁，大师答道：“此人于五百五十二世前生中，一直都是大班智达身。现在为榜噶拉法王善吉祥之子，但他却不贪恋王位而前来求善行。”大家都感到可贵，忙从座位上站起来迎接，才刚见面，王子便请求道：师长正士请存念！虽欲离家修解脱，然因种姓高贵故，终遭系缚榜噶拉。虽依胜敌、菩提贤、阿瓦都帝、理杜鹃，诸得悉地之师长，然犹未能离王位。今日受教至师前，请赐大乘发心灌。决定解脱此系缚！", "大师闻言极为喜悦，单独为他授“喜金刚”灌顶和全部教诫，经十三日圆满，并立密号为“智密金刚”。罗怙罗大师随后计划派遣八位赤身裸体、形状可畏的男女成就者，随同王子返回榜噶拉，以改变国王准备让他继承王位的想法，然后再将王子护送到阿瓦都帝巴大师那里。王子便改换“嘿汝嘎”装回国。当他走近王宫时，被众人认了出来，大家都很害怕。这些男女瑜伽师作疯狂相，奔跑跳跃历时三个月。大家知道王子已决意舍弃王位，都悲伤地流泪。特别是王子的父亲说：噫唏我儿初诞时，见诸瑞相自思量，能绍王位心欢喜，为何今欲依林薮？王子答道：倘我如言继王位，虽能须臾与父聚，然非诸生皆父子，无大利益铸大错。若我舍弃大王位，修习解脱菩提道，一切生中安乐伴，故请听许令得便。王子母亲便对国王言道：", "虽甚爱顾有何益？众生首为业力牵，今可放舍如其愿，愿后生生永相聚。王子最后得蒙父母开许，于次日清晨由那些男女瑜伽师陪同，前往密林中阿瓦都帝巴大师处，学习“中观法”，并获得微细业果的教诫。从二十一岁至二十九岁间，专勤修行。简言之，尊者能在大师跟前于一座上同时做闻、思、修三者。《蓝色小册》中也说：“追随阿瓦都帝巴七年。”金幢王宫下统辖十万户民众，拥有二万二千个浴池、七百二十座花园及五万六千棵椰子树。王城属民有三万五千名，城墙共计七重，中间有三百六十三座桥相连。王宫有二万五千个金幢，中央殿顶有十三层，国王受用富甲汉地君王。然而像这样拥有无上财富和权力的王位，却被尊者弃之如唾尘而往求正法。我们的大师释迦牟尼佛，得转轮王位如掌中之物，但佛也弃之如唾尘而出家。对于这些事迹，我们应该仰慕学习。现在，如果有人对我们说：“放弃你的梵行吧，我将委任你做一个宗本。”有多少人能毫不迟疑地加以拒绝呢？许多人甚至连暗小寮房里的杂物都难以割舍，更何况是王位呢？如唾尘般抛弃王位后，尊者主要依止阿瓦都帝巴大师共计七年，并在许多其他得悉地的师长前学金刚乘，对全部经论和教诫均获得善巧。", "当他萌发“只有我最善巧密咒”之念时，众空行母在梦中向他出示了许多他以前从未见过的密典，从而将他的慢心破除。当尊者自恃“现在我应该做密咒梵行，以期即生获得大印殊胜悉地”时，罗怙罗鞠多大师以神通力穿墙无碍，来到他的面前说道：“你为何想舍弃有情去求成就？你必须出家，对圣教和许多众生会有大利益。”吉祥嘿汝嘎也在面前虚空中显现来劝请。我们的大师释迦佛和怙主弥勒也在梦中劝其出家。就这样，尊者于二十九岁时，请获得加行道忍位的大众部戒护上座为亲教师，出家受近圆戒。尊者随后依止一百五十七位师长，研习一切明处和显密教典、教诫，特别是在法铠大师前，十二年中听受并通晓八百卷《大毗婆沙论》，此论总摄毗奈耶四部等微细规矩一切关要。此外，尊者对十八部各自的受食法、净水法等微细规矩能遍知无余，从而成为印度十八部一切大众的顶上摩尼宝。听受并掌握了当时印度所有的显密正法之后，尊者经常思考这样一个问题：“什么是成佛的捷径？”住在黑山秘窟的罗怙罗鞠多大师以神通力知道后，来到尊者的面前说：“能亲见到本尊和众多曼荼罗天众，获得许多共同悉地，三摩地不动如山，光是这些算不上什么大成就。你应该专修慈心、悲心和菩提心。", "‘大悲观自在’是悲心之本尊，所以当依之为本尊，并立下誓言：在生死未空之前，我当利益有情。”后来，尊者绕金刚座时，在旋绕道上，见到有两尊泥像做问答状。金刚座南方虚空中，出现两位童女，相貌胜过凡人身、如同天女，其中一位问道：“要想速疾成佛，当学何法？”另一位回答：“应学菩提心！”并说了一种很妙的修菩提心方法。尊者见状便停止旋绕，侧耳倾听，像将水从一个器皿注入另一个器皿一样，对他们的谈话全能了解，当尊者住在龙猛论师所建的石院附近时，出现一老一少两位妇女，老的对少的说：“要想迅速成佛，就应学菩提心！”在绕金刚座主殿时，寺檐下一座佛像出声道：“喂，大德！要想速疾成佛，就应学慈心、悲心与菩提心！”在绕石院小屋时，一座象牙释迦牟尼像也开口说道：“瑜伽师！一个人要想迅速成佛，就应学菩提心！”随后，尊者想知道，到底谁有全部的教授能使大宝菩提心未生令生、已生增长以臻究竟，于是做了探访。当时，大金洲大师被称为“菩提心之主”，为了到金洲大师跟前去听受全部的菩提心教授，尊者决定到金洲去。尊者随一群从赡部洲去金洲经商并熟知航海路线的商人出发，坐船在海上漂泊了十三个月始抵目的地。", "当时，“他化自在天魔”对将来佛教的弘扬难以忍受，为了阻止尊者获得菩提心教授，他兴风作浪使船偏离航道，并化作如山一般大的摩羯鱼挡住去路，又从空中落下霹雳等等，造成很多严重的损害。为此，班智达乞叉底蘖沙向阿底峡尊者猛力启请，尊者便入“红降阎摩”三摩地调伏魔王与魔军，如此，方渐次抵达金洲。即使是像阿底峡尊者这样才十八个月大，便能脱口说出精通菩提心话的智者成就师，尚且要以这样的苦行再加努力去求发菩提心教授。由此观之，大乘道最主要的因素，除此大宝菩提心外再没有别的，我们对此应获得确定。虽然在途中滞留达十三个月之久，但尊者始终保持出家相未曾稍有破坏，不像我们有些人，出了寺院就换俗装。出家人离寺外出，应该一直穿着出家装，当知即使是这种外相也能利益圣教。现在的僧人朝山，一出寺院外墙便改着俗装，手持长枪；不认识的人看到，还以为是杀人越货的强盗，不免令人心生忧惧。克珠一切智曾说：袈裟法衣二件套，诸出家众庄严身，出家反作在家相，斯乃灭教之行径。有些人说，我们只要重视内在的修心即可，在外表上随心所欲亦无妨，但这种做法有损圣教整体的典范；因此，僧伽大众的外表威仪必须做到寂静、调柔。", "例如，圣阿说示就是以他的威仪，将舍利弗置于真理之中的。", "现在再接着讲阿底峡尊者的故事。尊者到达金洲之后，遇见一些住在岸边的禅师，他们是金洲大师的弟子。于是，师徒一行在那里停留了十四天，并向那些禅师请教金洲大师的传记。如果换作是我们的话，也许会立即到大师跟前去；尊者非但不这么做，反而还去请教大师的传记，这是向我们表明认真观察师长的重要性。禅师中有些人急忙地跑到金洲大师跟前，向大师禀告说：“最近，在东、西印度无人能比的大智者燃灯吉祥智和他的一百二十五名弟子，经过十三个月的艰难航行来到这里，目的是为了在师尊前，听受《能生三世一切佛之母》和发愿心与行心的大乘修心教授。”金洲说：“像这样的大智者能降临我们这个地方实在是太好了，应该出去迎接他。”当尊者师徒一行走近金洲大师所住的宫殿时，远远地看到一队出家人，由金洲大师率领前来迎接。他们总共有五百九十七位，其中五百三十五位是比丘，全穿着同样颜色的三法衣，拿着滤水瓶，优雅地持着锡杖，犹如阿罗汉一般，能引发人们的信心。他们由六十二位沙弥陪同，这一景象宛如世尊在世，罗汉围绕，引发尊者师徒极大的信心，令大家感到欢喜之至。", "尊者与乞叉底蘖沙班智达等善巧五明的班智达和善巧三藏的比丘众，如大众部所赞叹的那样，脚穿“真米玛”鞋，身着克什米尔红花所染的三法衣。一切以缘起为重故，他们手托着最大的、无有漏孔的铁钵，可容下摩揭陀量制一升之水的铜滤水瓶，并持教主佛陀所赞叹的锡杖，如是等等，一切佳兆都妥善地具足了。所有人都带着班智达帽，手持白拂，毫无我慢。一百二十五名弟子跟在尊者后面，不疏不密，中间保持可容一人的距离，宛如五彩霞帐，逐渐走近怙主金洲所在的地方。由于一切都很圆满，这使善品天神们很高兴，从空中降下缤纷的花雨。金洲所有的百姓，对于两位大师的事业心感希有、生大信心。", "随后，尊者将一只盛满金、银、珍珠、珊瑚、吠琉璃等宝物，内外透明的宝瓶作为供养，献到大金洲大师手中，这便构成了尊者能如瓶满注地听受修菩提心教授的缘起。见面之后，金洲大师将尊者带入“银伞”寝宫中。为重缘起，大师先授以《现观庄严论》及教授，花十五座时间妥善解释圆满。师徒双方相互间极为尊重，连枕共居。十二年中，尊者对弥勒传给无著的《佛母般若波罗蜜经》中的全部隐义，以及文殊传给寂天的修自他相换菩提心的教授进行听闻、思惟和修习，并达到究竟。在大师跟前，尊者心中生起了无造作的自他相换菩提心。大师也宣布他为圣教之主，并授记他将前往藏地，培养那里的弟子，大师说：勿住于此往北方，应往北方之雪域。乙三、获已于圣教所作事业之理丙一、于印度所作之理尊者返回中印度后，有一段时间住在金刚座，曾经三次以正法击败外道的邪说，将他们安置在内道佛教中，做了许多有益于圣教的事业。后来，由“大力”王迎请前往止迦摩啰室啰寺。虽然尊者本人以大众部为主，但他对其他所有的部派也都很善巧，而且一视同仁、不分亲疏，所以成为东、西、中印度一切僧伽的顶上摩尼宝。在佛教中，尊者就像是胜者佛陀重新降临于世，为三藏和四续部所摄显密全圆教法之主。", "丙二、于藏地所作之理当时，藏地的前弘期佛教已经衰亡，后弘期佛教虽然正在逐渐地兴起，但有些人因信受毗奈耶而毁谤密法，有些人因信受密法而毁谤毗奈耶，视显密如冷热般矛盾。另有许多冒牌的班智达从印度来到藏地寻求黄金，用贪欲道和邪咒欺骗藏人，这些情况对清净佛教在藏地的弘扬造成了极大的困扰。藏王拉喇嘛益西沃（智光）心里对此不悦，为了在藏地弘扬清净的佛教，他派遣二十一名聪慧的青年去印度迎请能饶益藏地的班智达。这些人中，除大译师仁钦桑波（宝贤）和小译师勒贝喜绕（善慧）二位幸存下来并精通教法外，其他人都因印度的炎热而死去，即使如此，却仍未能将尊者迎请来藏。他们返回藏地后，向国王汇报了印度诸位智者的行持与见地，说明显密内部并无矛盾之处。并进一步推荐说，只有一位班智达能饶益藏地，他的名字叫“吉祥燃灯智”。此人本是王种出身，后来去了止迦摩啰室啰寺。印度所有的班智达都异口同声地说，如果能将他请来就肯定能饶益藏地。听到这些情况后，国王的疑虑一扫而光，尤其是当他一听到尊者名字时，便不由自主地生起了强烈的信心。于是国王委托嘉·准森（精进狮子）率八人携带许多黄金前往印度迎请尊者，但还是没有成功。", "后来，法王为了筹集迎请班智达的顺缘，亲自外出寻找黄金而来到噶啰国。当信奉外道的噶啰国王得知他是位为佛教办事的法王时，便给他下了最后通牒：要么放弃佛法，要么丢掉性命。并将他绑起来投入监狱。拉尊·强曲沃（菩提光）为了要救他的叔叔来到噶啰国，噶啰王也要他做出选择：要么停止迎请班智达并归其统治，要么用与国王体重相等的黄金来赎回国王。拉尊选了后者，他设法带来了一百两黄金准备赎回国王，然而遭到了噶啰王的拒绝，他说：“你带来的金子只够赎回身体，你还得再把头的重量补上。”拉尊无计可施，遂来到关押他叔父的牢房门前呼喊：“大恩人呀！您现在遭难乃是宿业所致。如果我出兵来打噶啰王的话，恐怕会使许多人丧生而堕入恶趣。他提出要我放弃迎请班智达的打算并服从他的统治，这样的要求，我想比要您为法牺牲性命更糟糕，故未答应。后来他又提出用与您等量的黄金来交换，所以我现在去找黄金，很快就会回来赎您。在这期间，您应思惟宿业、向三宝启请，并从内心深处至诚修福。”益西沃听完他的请求后笑了起来，说：“贤侄！以前我曾以为你有点娇弱的公子哥味道，不能吃苦耐劳。现在看来，即便我死了，你也能够继承祖业。", "你方才说的那番话很有见地，我感到十分欣慰。我心里想的是，在未将无过法度在藏地建立之前，我不能死，但我毕竟年事已高，即使现在不死，在这里也活不过十年，为了这点事花去这么多黄金，这会使三宝为我感到羞耻。我从无始生死以来，从不曾为法而死，现在如能为法而死，真是太好了！所以一分一厘的黄金都不要给那个国王，获得等身重量的黄金已经很困难了，你再到哪里去找等头重量的黄金呢？”“把所有的黄金都带到印度去，尽一切可能请尊者班智达来藏，并为我捎个口信，就说：‘我是为了您和佛教的缘故，将生命布施给噶啰王的，所以请您在一切生中以大悲摄受我！我主要的目的是请您来藏地弘扬佛法，希望您能应我之请，并加持我在下一世能与您相会！’贤侄，就这样把我忘了吧，心里多想着佛教！”拉尊看到自己的叔父在身体没有力气、说话声音发颤、人已极为虚弱的情况下，仍念念不忘藏地的有情、佛教和尊者，对他的这种毅力感到万分的敬佩，于是在恋恋不舍中离他而去。从此，拉尊·强曲沃生起了极大的勇气，意欲圆满其叔父未竟之志。当时藏地有“红行脚僧”、号称班智达的“着绿裙者”，以及“十八强盗僧”等妄称为密法的许多粗野邪法流行。", "为了找到合适的人选迎请尊者来藏，以善巧方便消灭这些邪说，拉尊向三宝启请并做占卜推算，结果发现这件事当由拏措译师去完成。当时，译师正在贡唐的金寺专心修持；国王（指拉尊）将他召到阿里。因担心他不愿接受去印度的任务，拉尊便请译师坐到他自己的座位上恭敬供养，赞扬他智、尊、贤三方面的大功德，然后说：“先辈王臣在此地建立了佛教，随后又创立规矩，并广作弘扬，但是现在的情况却是佛教低微、魔种有情得胜。所有去世的智者如果知道的话，一定是很难过的。我叔侄二人派了很多人带了许多黄金去印度，但除了人死财耗之外，全都未能将尊者请来，拉喇嘛益西沃不甘心失败，亲自去找黄金，却被恶王关进牢狱为法捐躯。所以您可向尊者苦求说：‘像我们这些藏区边地的无明有情尚具有这样的心力，您是众生的归依处，您的大悲心又该是怎样的呢？’”“现有七百两黄金，请您带去献给尊者，对尊者说：‘我们藏地如同饿鬼城，要找到羊身上虱子般大小的黄金都很困难，现在我们已竭尽藏地所有的财富，此番怙主若再不肯来藏，那么既然您们这些大德的悲心如此有限，我也只能怎么好就怎么做了。", "’持律师，请您将这些话向尊者直说好了，如果最终他还是不愿意来的话，请您务必再向他禀呈这一切。”拉尊边说边哭，眼泪打湿了他的衣裙和桌子。拏措译师楚臣嘉瓦（戒胜）以前从未去过那么远的地方，心里也不大想去，但当他听完拉尊这番话后，一时间也无法回答去或不去。", "正如俗话所说：看着哭泣的面孔会让你也想跟着哭泣。译师知道拉尊的这番话说的都是实情，他虽然没有与益西沃见过面，但听说过他的为人，也知道他们叔侄俩为了迎请尊者，花费了很多人力和财物，为了藏地的利益承受了极大的痛苦。当他看到贵为人主的拉尊痛哭不已和听到这番话后，拏措译师的身体开始发颤、泪流满面，无法正视拉尊的脸。最后，他决定不顾生命危险，放下对现世快乐的贪著，同意接受拉尊的请求。就这样，译师师徒七人携带七百两黄金上路前往印度。拉尊送了很长一段路，并嘱咐译师说：“比丘，您此行为我办事，虽然会十分艰辛，但您要拼舍性命努力前去，回来后我会酬报您的大恩的！”在译师他们走远后，拉尊又高声嘱咐：“一路上多启请大悲观自在！”在拏措译师一行抵达跋薄宗时，他们遇到了一位独行客，那人说：“诸位好像是到远方去办大事的，你们在路上如能照我告诉你们的这样口诵：‘敬礼三宝！愿三世佛陀的生源正法能在雪山国内增广！’事情就会成，一路上就不会有灾难发生。”当问及是何人时，那人说：“你们以后自然会知道的。”像这样，当拏措师徒等人途中发生危难时，仲敦巴显现多种身相前来化险为夷。最后，拏措一行来到了止迦摩啰室啰寺的门楼底下。", "嘉·准森从门楼的一个石孔中向下用藏话喊道：“藏地大德，你们从哪里来？”译师回答：“我们从阿里上部来。”嘉·准森说：“那里有个守门的童子，你们可以把行李交给他保管，然后找个地方好好睡一觉，明天第二明相末时会开门的。”译师便将黄金等物品交给那个男孩保管，男孩把黄金等放入内室后说道：“可以信赖的人是最好的朋友，你们放心去睡吧。”译师等人心想，此人小小年纪便能说出这样的话，恐怕不是一个凡人，于是大家都感到很放心。", "次日早晨，寺门刚打开不久，有一个头带“季凌”帽，身穿二件藏地牧区所产的氆氇衣，手里拿着一只小碗的男孩从里面出来，用藏地牧区方言问他们道：“你们从藏地哪个地方来的？路上是否遭到危险？”译师等人一听马上忘了旅途的劳顿，回答说：“我们从阿里上部来，一路平安，您是哪一位啊？您准备去哪里？”男孩说：“我也是藏人，准备回藏地。我们这些藏人嘴巴太松，不知道重要的话要保密，保密才能办成大事。嘉·准森就住在藏人宿舍里，到那里一打听就知道了。”随后便很快地离去了。译师师徒沿着一条长长的巷子往里走，路上遇到一位手持芭蕉杖的老仙人向他们问道：“你们从哪里来呀？有何贵干？”译师答道：“我们是从藏地阿里上部来此迎请阿底峡尊者的。请问嘉·准森的住处在哪里？”那位老者一听这话，便拄着手杖皱起了眉头，说：“今早那个童子说的话一点不假，你们藏人没有喉结（意为说话没有遮拦），对巷子里闲游的人都能说出内心的话，像这样子还想办成什么大事吗？幸好对我说无妨，千万记住，今后除尊者外一概不可再随便对外人说。我来为你们引路去嘉·准森的住处。”于是拏措一群人便跟着老者走，老者在前从容而行，他们在后穷追猛跑还是赶不上。", "老者先来到藏人宿舍门前道上等候，等他们赶到后说：“要想成办大事就该慢慢地去做，急事需缓办，稍安勿躁；就像爬山一样，要安步当车。这就是你们要找的房子。”译师走进房内，向嘉·准森献上黄金作为见面礼。嘉·准森问他从何处来，译师便将原由详细说了一遍。嘉·准森听完后说：“您好像是我以前教过的弟子，但我现在一下子认不出了。请您告诉大家，目前千万不可说出迎请阿底峡的话，只说是来求学的。此处有位惹那阿迦惹上座，他的势力很大，连阿底峡都要听他的，这事绝不能让他知道。现在可供养他半两黄金，并告诉他：‘我是从藏地来的，并不打算迎请班智达，只请您费心为我推荐一位与班智达不相上下的学者。’我们必须小心行事，绝不能着急，慢慢地想办法，等把尊者请到这里后再做进一步的请求。”于是，拏措与嘉·准森二人便前往上座惹那阿迦惹处，供上半两黄金。拏措照着嘉·准森教他的话做了请求。上座很高兴地说：“这太好了，其实我也不是想硬把人才留在这里，而是因为其他班智达无法调伏有情。印度是佛教的发源地，如果让阿底峡离开这里的话，那么一切有情的安乐就会减少。”如是这般，说了许多安慰的话。一时间，藏人与阿底峡仍无法见面。", "后来，大悲观自在的化身从多方面安排了能使阿底峡去藏地的缘起。有一天，趁其他印度班智达和国王不注意，嘉·准森找了个闲静的时辰，叫来拏措译师，并带他到阿底峡的寝室。他们在一肘宽的曼荼罗中央放上整块黄金，周围放上一堆堆散金，献给尊者。译师、嘉·准森向尊者详细讲述了藏王如何如何地是位菩萨，法王三代是如何弘法的，朗达玛又是如何灭法的，僧团又是如何因为喇钦波（贡巴饶赛）的恩德而得到扩大的情况，以及拉喇嘛叔侄为迎请尊者所经历的痛苦，并转达了益西沃的口信，又谈了目前藏地邪法是如何盛行的情况，最后才请求说：“现在藏王菩萨派遣这位大德来迎请怙主您前去，请勿再像去年那样推辞了，请您以大悲心顾视一下藏地吧！”尊者答道：“藏王真是一位菩萨！三代法王是菩萨的化身。那位喇钦波也是位菩萨，否则的话，藏地的佛教就不会再度兴起。那位拉喇嘛也是位菩萨，违背菩萨的命令是不可以的。我感到有愧于那位国王，他浪费了那么多的人力和财物。虽然我对你们藏人心怀慈悯，但我已衰老，又掌管许多寺中钥匙，另有许多未竟之事，恐怕难以赴藏。但我会做一下观察，你们先将黄金收回吧。”说完尊者仍将供养退还给他们。", "然后，尊者出于对藏地所化（应度弟子）的悲悯，便对赴藏是否能利益佛教，以及对自己寿命是否会发生障难做了观察。大悲观自在和至尊度母等都说，此行必对圣教和有情极有利益，尤其是由一位居士来做这件事，更能产生很大的利益，但寿命却会因为赴藏而减少。当问及寿命会减少多少时，本尊们说，如果不赴藏能住世九十二岁，如果赴藏则不超过七十二岁。实际上是授记尊者的寿量将减少二十年。当时，尊者内心生起了不顾自己生命的大勇气，心想：“如果能够利益藏地，寿命缩短就让它缩短吧！”尊者明白：印度的所有僧众和施主们都一致反对他赴藏，因为他们担心这样一来会导致佛教在印度——佛教发祥地式微。于是尊者便以善巧方便，声称将赴金刚座等各大圣地广做供养，丝毫不露出赴藏之意，然后再往返于各大圣地，将“文殊金刚”等许多有加持力的佛像，以及许多经典，交给一个商人——仲敦巴法王善巧方便的化身——悄悄请了出来。最后，尊者向上座提出请求，准许他短期去尼泊尔和藏地的众多殊胜圣地朝礼。上座知道，尊者本人乐意到藏地去，藏地众人又坚持要迎请，只得同意他短期赴藏。但是，他要拏措译师发誓，一定要在三年之内将尊者送回印度。", "当尊者师徒一行离开印度到达跋薄宗时，拉尊亲自率领三百名骑士前来做盛大的欢迎。（嘉杰·帕绷喀仁波切随后详细讲述了他们见面后的情况，如众人是如何一见面便油然生出信心、相续变得调柔，以及后来阿底峡与大译师仁钦桑波会面的情况。）过后一段时间，拉喇嘛强曲沃郑重启请阿底峡。他流着眼泪，详细讲述了此间北方雪域中，三代法王历经千辛万苦建立佛教的情况和后来朗达玛灭佛的情况，以及他的祖先阿里法王们不顾生命危险，在藏地重建佛教的情况；也谈到现在仍有些人依密法攻击毗奈耶，或依毗奈耶攻击密法，视显密二者如冷热矛盾，各人凭自己的喜好行事的情况。特别是称作“红裙阿阇梨”和“绿裙阿阇梨”那两个人，对头上盘髻的咒师开示“和合”和“超度”之法，那样的胡言乱行导致佛教衰败到极点的情况，然后说道：“大悲的尊者！您现在不必为我们这些粗野的藏地所化开示那些甚深和稀有之法，请您先开示业果以作培养；特别是求您大悲摄受，为我们开示一种您所亲证的、能总括所有佛的显密教典及注释，而且包含全圆无误之道、易于修持、能利益藏地全体民众之法！”最后，他还请问了一些细节问题，例如：行律仪之身是否必须具足别解脱律仪？依靠单独的方便或智慧能否成佛？", "可否为未获灌顶者讲解密续？可否为梵行者实授智慧灌顶？未获金刚阿阇梨灌顶者可否做密法诸业？尊者对他所提的这些问题十分喜悦，为此造了《菩提道灯论》，将一切显密教典及注释密意浓缩在短短的三张纸中。论的开头部分说：敬礼三世一切佛，及彼正法与众僧，应贤弟子菩提光，劝请善显觉道灯。文中称强曲沃（菩提光）为“贤弟子”，并不是因为他献了很多供养，而是因为他求法的方式令尊者感到十分的高兴。我的大宝师长说，如果当时强曲沃请求说：“您传个灌顶吧！您传个随许吧！”尊者是不会感到高兴的。像这样以答疑的方式著出《菩提道灯论》后，流行于藏地的那些邪法和粗暴的行为便立即自动消失了。当尊者在阿里上部弘法将满三年时，由于拏措译师曾向上座立过誓言，译师便劝请尊者返回印度，尊者也同意了，遂往南行至布森地方。以前至尊度母曾一再对尊者说，在藏地依靠一位大居士能极大地饶益圣教，此时又一再说居士快要来了。于是，尊者天天关注着，并说：“我的居士还没有出现，度母是不是在说妄语？”有一天，当尊者被一位施主请去时，仲仁波切（指仲敦巴）来了。他先到尊者的住处，得知尊者被一位施主请去，但马上就要返回的消息。", "仲仁波切说：“如果让我选要早一刹那值遇大乘善知识，还是晚一刹那值遇大乘善知识，我当然选前者，所以我不能耽搁，我要到尊者去的地方找他。”结果在半路上就和尊者相遇，仲仁波切先全身伏地做顶礼，随后来到尊者跟前，尊者将手放置在他头上，用梵语说了许多吉祥赞。那天早些时候，尊者曾对那位施主说：“我需要一份食品给我的居士。”因为尊者从不食肉，所以那天的宴会食品是糌粑和酥油，尊者将带回的那份赐给了仲仁波切。仲仁波切将糌粑吃了，将留下的酥油制成一盏能通宵燃烧的油灯，供在尊者的枕边。据说从那时起，直至尊者圆寂，仲仁波切总是在尊者枕边供上通宵燃烧的油灯，从不间断。就在当天晚上，尊者为仲仁波切灌顶，认定为上首弟子。后来，尊者等人逐渐从布森走到芒隅的济仲地区，准备经尼泊尔返回印度时，前方发生大战乱，挡住了去路，无法通行。仲敦巴设法迎请尊者返回藏地，拏措则设法请尊者回印度。由于途中发生战乱不能前进，译师感到十分棘手，异常焦虑。尊者安慰他说：“不必如此不安，你已经尽了努力却做不到，是没有过失的。”译师闻言喜出望外，便请求道：“那么请您返回藏地吧！”就这样，尊者决意返藏。", "当时途中发生战乱，致使尊者无法赴印，乃全体藏民之福。由于尊者无法返回印度，拏措他们便致书上座。信中说明，根据上座的命令，他们护送尊者返回印度，但至尼泊尔边界时，因半途发生动乱无法继续前进，所以目前被迫返回藏地；他们允诺日后战乱平息时再护送尊者回来；信上又说尊者抵藏后造了一部论，利生之事也极其广大，所以最好能常住藏地，请示这样做是否可行。随信附上尊者亲笔手书的《菩提道灯论》和许多黄金，派人专程送往印度。当时的印度和我们藏地不同，他们的规矩是：班智达们定期集会，审查一年之中新问世的论著。按照座位顺序将论文各页依次下发，大家各读一页后，如果发现词义均无过失，便上报国王，给作者颁发奖品，诏告天下可流通该篇论著。如果文句优美但文义有过失，便将该论系在狗尾上，把狗带到城里的街巷中游行，以羞辱该论及其作者，并上报国王，诏告天下今后禁止传布该论。尊者的著作本不需要做这样的审查，但还是按当地规矩将《菩提道灯论》发给班智达们。", "由于《菩提道灯论》在短短的三页纸中，简要而圆满无误地开示了一切显密教典所诠译的内容，且凭借此论能将一切佛经展现为教授，故而得到班智达们的一致认可，大家备感惊讶，反应强烈，异口同声地说：“看来尊者到西藏去不仅对藏人有利，也对我们印度人有利。如果尊者住在印度，是不会造出这样一部论著的，因为我们印度人智慧和精进都很大。他考虑到西藏人愚钝且精进微小，所以才会造出这样一部词少义丰的论著。”上座惹那阿迦惹听到这么多赞同尊者住藏的言论，只好回书藏地说：“既然班智达们做了这样的赞叹，尊者本人也喜欢留在藏地，又有这么大的利生事业，尊者可以留在藏地。请他造一部《菩提道灯论》的解释给我们，作为代替。”消息传到藏地，拏措喜不自胜、如释重负，他说：“上座强加给我、像山一样的重任，从今天起总算可以摆脱了。”（嘉杰·帕绷喀仁波切指出，现存的《丹珠尔》中，被称作尊者造《自释》一文，有部分内容为后人搀伪。）尊者赴前藏之前，仲仁波切曾写信给那里的上层人士，信中说：“我将尽力迎请尊者到前藏来，你们得到确切消息后，务必马上出来迎接。", "”因此，当尊者临近前藏时，仲仁波切致书嘎瓦·释迦旺曲（释迦自在）等前藏诸位法师，希望他们赶紧前来迎接尊者的到来。当以嘎瓦为首的前藏法师着手准备欢迎时，枯敦问信中为何未列入他的名字？当被告知在“等”字中已包括时，他便说：“我难道只属于‘等’字中的人吗？”遂别众先行，众人一见也纷纷起程前来迎接。他们全身作藏地大法师的装束，头戴圆顶帽，身披马氅等。当尊者远远看见这群人时，便说：“来了许多藏地的鬼怪。”并用斗篷将自己的头裹起来。后来那些大法师下马换上三法衣前来致敬，尊者才欢喜答礼。尊者抵达前藏，在那里广转法轮，做了许多对圣教和众生有益的事。尊者在阿里上部驻锡三年、聂塘九年，前后藏其他地区五年，一共住藏十七年。《噶当教法史》等说是十三年，说法不一。十七年一说是本派至尊大宗喀巴所主张的，因为拏措依止尊者的时间算计，在印度为二年，在藏地为十七年，如他自己所说：“依止伴随十九年。”藏王强曲沃等以极大的努力迎请阿底峡尊者来藏所产生的最重要成果，以及尊者所说一切法中最主要的就是这部《菩提道灯论》。", "当尊者准备起程赴藏的时候，至尊度母和尊者的一位师长班智达黑哈那曾授记说：子较父威严，孙较子威严，曾孙更威严，三代孙更上，复次转败坏。“父”是指尊者本人的时代，“子”是指仲敦巴和勒贝喜饶等人的时代，“孙”是指三兄弟的时代，“重孙”是指朗日塘巴和霞惹瓦等人的时代，“第三代孙”是指桑结温敦和桑结贡巴（佛修）等人的时代。“更威严”的意思是，后一辈的教法均要比上一辈的教法来得兴盛。但由于以后的学人不再满足于“道次第”本身，加了一点密咒和随许法进去，因而使传承稍有败坏。就这样，阿底峡尊者将藏地已隐没的圣教规矩重建了，将苟延残存的规矩增广了，将那些被邪解垢秽污染的佛法妥善清理了，使大宝圣教远离了污垢。尊者将此“菩提道次第”传给了仲敦巴，仲敦巴请问道：“您为何将密咒教诫授予他人，而将此道次第授予我？”尊者回答说：“因为除您之外，我找不到可托付此法的人。”尊者将“道次第”教授私下隐密地传授给仲敦巴，仲敦巴则向大众宣讲，后来形成了三种传承：“噶当教典派”由博朵瓦传霞惹瓦，该派是在诸大教典基础上讲解“菩提道次第”；“噶当道次第派”由贡巴瓦传内邬素巴，配合《圣教次第》讲解“道次第”，比前派稍简略；", "“噶当教授派”由京俄瓦传洽域瓦，配合“缘起心要”引导等师长教授讲解“道次第”。我的胜归依处大宝师长叙述赤钦·昂旺诺布（语自在宝）的口传说，虽然现在不直接以噶当三派来命名，但不表示这三派不存在。研究五部大论者将大论与“道次第”合起来修，就是“噶当教典派”；如果无法做到这样，但慧力和精进还可以的人，闻思《道次第广、略论》而修，就是“噶当道次第派”；这也不行的人，在《坦途》《捷径》等简略教授基础上，具足一切道的要点来修，就是“噶当教授派”。如前已述，至尊大宗喀巴又将噶当三派合流。至尊大宗喀巴造《道次第》广、中、略三论的情况，前面也已经说过了。如宗喀巴传中所说，他能经常与至尊文殊会面，就像师长与弟子一样，至尊文殊赐给他的显密深法不计其数。所以，此“道次第”也可以说是宗喀巴大师从至尊文殊那里听受来的。尽管如此，宗喀巴大师仍然十分强调可回溯至正法源头大师释迦佛的“远传”。此外，他从不说“净相”“近传”之类的东西，这是十分稀有的行传。当宗喀巴完成了《菩提道次第广论》毗钵舍那章之前的部分时，他向至尊文殊做了汇报。至尊文殊和他开玩笑说：“难道我所开示的《三主要道》还不能包括所有的法吗？", "”大师禀告说：“我编写此论，是以至尊所说的《三主要道》为命根，以《菩提道灯论》为所释根本文，在这基础上，再加上许多噶当派教授作为补充而成的。”宗喀巴开始并不打算著出大毗钵舍那一章，认为这对众生不会有很大利益。然而至尊文殊却对他说：“毗钵舍那章也要写出来，对众生将会有中等的利益。”像这样不可思议的秘密行传还有许多，在这里虽说应该详述大师的传记，但现在时间不够充裕，只能请大家去仔细阅读一下有关大师生平的著作吧。在至尊大宗喀巴的教法中，不仅有阿底峡尊者全部的教法，而且具有能在浊世短暂一生中成就无学双运的无上甚深奇妙教授。如果认真研读的话还可以发现：在大师所说的那些“道次第”中，还包括有噶当派祖师“道次第”中所没有的许多甚深奇妙教授。从宗喀巴大师传下来的“道次第”传承有许多种，但其中最著名和最重要的传承是“八大引导”，昨天已提到过了。其中《纯金》和《文殊口授》二论是单依显教说的；《坦途》和《捷径》二论是配合密法说的。《文殊口授》引导传承中简略的一种——即南传派传承的情况——是这样的：伟大的第五世嘉旺大师在《文殊口授》上做了朱批，从而产生出一种较略的道次第。", "其归依境、资粮田、浴室等观想法均与《口授》中传派不同，有其自己的教授。他将此法传给了唉巴喇嘛·降巴仁钦（慈宝）。唉巴喇嘛又传给森夏堪钦·洛桑克尊（善慧智尊），此人智慧卓绝，能在心中设想出各种各样广略不同的朱批派教授。为了断疑，他决定去请教此论的主人——伟大的五世。在他们会晤期间，发生了一件稀有的事情：一杯茶的工夫，洛桑克尊便听完了整个教授。洛桑克尊曾任则错巴寺堪布，其后半生在朗忍却定（一茅篷名）一心专修，获得很高的成就。洛桑克尊传法于耶巴的大成就者彭措嘉措（圆满海），在三个月之内将“经验引导”传授完毕。此师在心相续中生起殊胜的止观证德后，在耶巴地区以“经验引导”培养了许多弟子，并由“胜乐身曼荼罗”之门获得悉地；大多数南传派师长都是这样的。此师传法于唉喇嘛·喀觉丹达（空行教宏），后者又传法于堪钦·根敦绛央（僧伽文殊）。堪钦担心批注在广论上的南传《文殊口授》日久难免会引生误读，以讹传讹，所以他另外编了现在通行的这个本子。起初只有手抄本，后来由嘉杰·珠康仁波切刻版流通。堪钦·根敦绛央传法于杰·昂旺图朵（语自在力）；昂旺图朵又传法于达札堪钦·丹巴嘉措（教海）。", "据说丹巴嘉措在达札求学期间需服青年僧人差役，有一次在劈柴时获得空性见。他传法于色脱喇嘛·格丹（有缘），此师的行传极为稀有，他对别人供养的银子、绸缎、氆氇等从不贪著、也不布施，所有东西都被他扔进附近的一个石缝里。过了几代以后，人们还能在那里找到氆氇、银币这类的物品。他不做供施是因为考虑到，做了之后自己可能会生起傲慢心。色脱喇嘛传法于杰·洛桑群佩（善慧法增），洛桑群佩又传法于格西土丹惹杰（佛教增长），格西在修持时，先是吟诵《道次第传承师长启请》，然后哑然无声，别人以为他睡着了，走近一看才发现他正在专心修持。", "格西传法于比丘强曲妥美（菩提无著），此人既不是格西，也不是师长什么的，仅是榜却寺一名普通的僧人。他住在章日日错（一茅篷名），每天到一块小小的青草地去，做完朵玛供后便一心专修“道次第”，由于相续中生起了慈悲心，于是老是坐在那儿哭泣。后来被一牧童发现，觉得一个老人独自哭泣十分奇怪，便天天暗中跑去看热闹。当时，《口授》南传派引导只有这位比丘才有，由于这一传承面临中断，达札堪苏·洛桑金巴（善慧施）——我的胜归依处大宝师长追随他受出家律仪——仔细寻访谁还可能拥有南传派的引导传承，结果发现除此比丘获得引导外，再也没有别人了。虽然他不指望比丘能传经验引导，但他担心如果连引导传承也不求的话，这一传承会有中断的危机。于是，有一天与比丘会晤时，他请求说：“现在，《口授》南传派的引导传承除您之外别人都没有，这个传承如果中断的话真是太可惜了，所以请您将传承传给我，回头我再加上教理，把详广的教授奉还给您。”那位比丘说：“像我这样的人怎能给别人传法呢？”他不以为自己有这个能力。最后终于同意传法时，比丘将甚深教授集中在一起，完全根据自己的经验来传，这使得杰·洛桑金巴大为震惊。", "他后来赞叹道：“我说要将教授奉还给他，实在是令人害臊，他其实是位噶当教授派的大格西！”杰·洛桑金巴也获得殊胜止观三摩地，并由“身曼荼罗”之门获得悉地。杰·洛桑金巴长期住在洛札下部的榜忍寺，他弟弟杰·格桑丹增（贤劫持教），住在达札上部的拉定日错（一茅篷名）。格桑丹增几次请求洛桑金巴来拉定日错都未能成行。后来，洛桑金巴在定中观看，茅篷的内外一切全都了了分明。有一次，格桑丹增前来拜访，他对弟弟说：“我已参观过你的整个茅篷了。”随后详细讲述了那里的景物，包括门前左右二侧的柏树，接着又问道：“你走廊内一大块白的，摇摇晃晃的是什么东西？”原来，他在定中看到的是块随风摇动的布帘。洛桑金巴将法传给他弟弟格桑丹增，后者通过显密修持也同样获得很高的成就。此师每每显示神异，如说法时，从他左右两眼各放一道白光，分别右绕和左绕弟子群，临近散会时又将光收回等。又能在说法的同时做绕寺等事，遇见者莫不称奇，此师亲见整个《供养师长仪轨》资粮田，圆寂时顶骨上自然现出《供养师长仪轨》主尊像，至今仍供奉在拉定日错。", "格桑丹增传法于成就之王格桑克珠（善缘智成），此师也由“总摄轮”之门获得悉地，我的依怙主大宝师长就是在他门下听受此法教授的。以上所说是有关《文殊口授》南传派传承的简单情况，另有详细的传记著作，大家应该去了解一下。《口授》中传派，由遍知伟大的五世赐给赤钦·金巴嘉措（布施海），然后依次传至赤钦·洛桑伦珠（善慧任成）；杰·洛桑金巴亦曾在他跟前受法。《捷径》明晰引导由遍知班禅洛桑益西（善慧智）著出后，在一段时间内没人来求此法的引导传承。班禅上了年纪后，眼不良于视，如果需要传一些重要的经教，即便是一、二页，求法人也要写成很大的字呈上才行。当时大成就者洛桑南杰（善慧尊胜）正离事专修，漫游于各地茅篷，当他看到《捷径》后，意识到如果不求此法引导传承，将对未来的学人很不利，于是肩负所有家当来到札什伦布寺，通过知客，他请求班禅大师最好能传授其著作的所有文集，特别是能传一下《捷径》的引导。知客对此感到很惊讶：一个普通僧人，求法的胃口那么大，何况大师的眼睛又不好，便对他说了许多泼冷水的话，最后扔下他走了。", "洛桑南杰没有气馁，一连三次做了和以前一样的请求，但知客就是不管，洛桑南杰急了，他说：“我不再来向您求法了，请把这个请求转达到班禅仁波切的耳朵里。”知客见他动了怒，便去向大师报告。大师一听，高兴地同意了，视力等各方面的问题也没有了，将教授全部传给了他；此事我的大宝师长曾谈起过好几次。然而在我们的传承中，洛桑南杰并不怎么出名。我们的传承由杰·昂旺降巴（语自在慈）依次传下来的情况，见之于《有缘颈严》。以上只是粗略地讲述了作者的殊胜。我的大宝师长说，如果师徒双方都有时间，可以详谈的话，应该按照喇嘛雍增仁波切的二卷本《道次第传承师长传》来讲。虽然现在无法这样来讲，但希望大家去请一部回来经常阅读。在读完每位师长的传记之后，我们应该发愿、诵：“吉祥师长身云何”等，并修随喜。56掌中解脱菩提道次第二十四天教授"]}, {"c": "第三天", "segs": ["道次第教授的殊胜与如何讲听此法寂天怙主说：此暇满身极难得，既得能办士夫利，倘若此生未办利，后世怎得此圆满？这样的暇满身我们已经获得了，在这个时候，如果我们耽著现世这一点点快乐，只做些降伏仇敌、保护亲友之类事情的话，这是连畜生也能做到的，不应在这上面上当受骗。如果我们的行为不比畜生高明，不修一种能决定利益我们后世之法的话，以后再想获得这样的暇满身是很困难的。因此，值此侥幸获得一次暇满身之际，我们应该好自为之，尽自己最大的努力来修法，而这又得依赖于修习像“菩提道次第”这样的法。所以，我请求大家好好地发起菩提心的动机来听，做这样的思惟：我应当获得佛位以利益一切母亲有情，为此我来听受“菩提道次第”甚深教诫，然后去认真地实修。（帕绷喀大师接着说：“所听的法即是有缘之士能往佛地的大乘法范”等等，和前两天一样。又说：“如果按科判来讲的话，菩提道次第引导分四”等等，正行科判也和以前一样。", "随后又简单重述了第一大科的内容，即昨天所讲的，从大师佛陀依次传来产生“菩提道次第”教授的情况，以及后来依据《菩提道灯论》为根本文，出现《道次第》《圣教次第》等许多“道次第”论著的情况，然后说：“详细的可参阅《菩提道次第传承师长传》。”以上是简要重述昨天所说的内容。）今天讲第二大科：", "甲二、令于教授起敬重故开示其法殊胜“菩提道次第”由“四殊胜”和“三别法”之门超胜其他教授。“四殊胜”为：（乙一）通达一切圣教无违殊胜；（乙二）一切圣言现为教授殊胜；（乙三）易获佛陀密意殊胜；（乙四）极大恶行自趣消灭殊胜。乙一、通达一切圣教无违殊胜“圣教”，就是佛陀所说的一切圣言。如《般若灯广释》中所说：言圣教者，谓无倒显示，诸欲得甘露胜位，若人若天，所应遍知、所应断除、所应现证、所应修行，即薄伽梵所说圣言。“通达一切圣教互不相违”，意思是要懂得一切圣教是任何一个补特伽罗成佛所必须的修法。“无违”意为一致。大乘、小乘、毗奈耶、密法等有时候在语言表达上似乎互相矛盾，但实际上，都是任何一个补特伽罗成佛之道的主体或支分，所以互不相违。譬如，某人身患大热病时，医生先是告诫他应戒肉、酒等物，如果不戒会有生命危险。后来在热病转症的紧要关头，即风大占主导地位时，医生又对他说要饮酒、吃肉等等。同一个医生对同一个病者，前后说出吃不吃肉、酒两种不同的话，表面上看似矛盾，实际上是为了治疗同一个病者，根据需要所开出的两种不同处方。", "同样地，有人以为大小乘和显密法是针对各别所化说的，而不必全包括在同一个补特伽罗成佛所需的修法中。其实不然，这些是同一个说法者所说的，任何一个补特伽罗成佛所需全备的修法。详言之，最初在下、中士阶段，先修小乘藏中所说的无常、苦等法；等稍进一步至上士阶段时，再修大乘藏中所说的发菩提心和六度等法；转成密宗根器后，再修金刚乘中所说的二次第及密行等法。因此，一切圣教是像你我等任何一补特伽罗成佛所必须的、循序渐进的修法，它们全都是一致的。所以，佛陀的一切圣言，根据情况可分成道的主体或道的支分，对于一个补特伽罗成佛所需的修持来讲，没有一部佛经（圣言）是不需要的。不仅如此，诸位菩萨的主要任务是利益有情，而所化分为三类，应该为他们分别开示趣向各自解脱之道。但是，如果自己不先去了解，那是无法为他人开示的，《释量论》中说：彼方便生因，不现彼难宣。所以，作为成办利他的支分，菩萨决定需要在相续中生起了知三乘道的“道相智”，如《般若波罗蜜多经》中说：善现！诸菩萨应当发起彼一切道，应当了知一切道，谓所有声闻道、所有独觉道、所有佛陀道。《现观庄严论》中也说：诸欲饶益众生者，道智令成世间利。", "再者，所得的佛位是尽一切过失、具一切功德的，因此，成就佛位的大乘道也应该能遮止一切过失类和成就一切功德类，绝对没有不能除某种过失和不能生起某种功德的圣言的；所以一切圣言都决定摄入大乘道的支分之中。如果讲得更精确些，“无违”可以分成以下二种：通达一切能诠“教圣教”无违和通达一切所诠“证圣教”无违。如前面所说，三藏和四续部等佛经及注释，在每一个补特伽罗成佛所需的修持中都是一致的，没有丝毫矛盾的地方。如能这样理解，便是通达一切“教圣教”无违。这些经论的所诠内容可概括为：断十不善持戒等，能获人天位增上生的下士道；四谛进退和三学等能获解脱决定善的中士道；发心、六度等能获一切智决定善的上士道。这一切在任何一个补特伽罗成佛所需的修持中，也都是一致的，没有丝毫相互矛盾的地方。如能这样理解，便是通达一切“证圣教”无违。这也就是法王仲敦巴所说的：“能知以四方道摄持一切圣教者，谓我师长。”这句话如同上述解说的根本文。其解释有许多种：有的说“四方”是指三士道和密宗；也有说如骰子，每掷一次都是四方形，即在每一个所缘类内包括道的全部。", "但按照我依怙主大宝师长的说法，这句话的含义是：正如一块正方形的座垫，移动时能同时带动它的四角；佛经及注释的所诠内容也能整个地包括在一个补特伽罗成佛所需的修持中。这才是要点所在。乙二、一切圣言现为教授殊胜如果我们未遇到像“菩提道次第”这样的法，是不能将一切圣言视为实修教授的。事实上，最上教授就是佛陀的圣言及其注释等诸大教典。在这个世界上开示教授的师长，没有能超越释迦佛薄伽梵的，他所说的一切圣言也就是最上教授。《宝性论》中说：此世间中更无善巧于胜者，遍智正知无余胜性定非余，是故大仙自立契经皆无乱，坏牟尼轨故彼亦损于正法。现今对于像大宝《甘珠尔》那样的佛陀圣言，除了在做经忏时需要用一下外，一般人根本想不到它们是可供实修的教授。对于解释佛经的诸位大车的论典，也只是在听闻和辩论时用一下而已。甚至在那些已完成全部学业、准备开始实修的人当中，也有一些人不知道如何将自己一生经过闻、思加以抉择的内容用于实修；相反地，却跑到那些妄称为“大修行”其实什么也不懂的人跟前去，学一些本尊“成就法”和“明心见性”等，然后自以为是地修一修，正如大宗喀巴指出的那样：虽然多闻贫于法，圣言不现教授过。", "这都是不能将圣言视为教授所产生的过失。我们格鲁派大寺院中有位格西，返回康区老家后，跑到一位宁玛派师长那里去求“能用来实修的教授”，然后修一些零散的相似法。这事已在当地造成极为恶劣的影响，使人们误以为格鲁派中只有可供讲说的法，而无可供实修之法。我认为这个人是格鲁派教法的败类，同时也令我感到十分沮丧。经过闻、思抉择后的法必须用于实修；用于实修之法必须先经闻、思的抉择。《道次第广论》中说，如果我们闻、思时抉择的是这件事，在实修时却是另一件事；这就好比赛马前规定的是跑这条道，而比赛时跑的却是另一条道。（嘉杰·帕绷喀仁波切进一步解释说：这好比赛马时，先规定明天跑的是这条道，而明天正式比赛时，跑的却是另一条。）像这样无法将一切经典视为教授，乃是不懂“菩提道次第”之过；如果懂的话，我们便会知道，圣言等一切经论都能摄入“道次第”中而整个地加以修持。以前，赤钦·昂旺却丹（语自在胜）在完成寺中的学业后，在杰·绛央协巴（妙音笑）跟前听受了《三主要道释》等许多教诫，这使他明白显密教法无余密意均能在一座上修，他说：“我现在才意识到，以前对无量经论所做的一切研习，实际上都是在研习‘菩提道次第’啊！", "”此乃视圣言为教授之相。同样地，大成就者桑结南杰（善慧胜）在传《般若八千颂》经教的整个过程中，不断地重复说：“唉呀！我现在老了，不然的话，这经里说的可都是能用来实修的啊！”如果我们理解“道次第”的话，那么在辩经院中所辩论的一切内容都能容易地摄入“道次第”中而视为教授。比如，我们在辩论“发心”的时候，可将之与上士道修菩提心相配合；辩论“缘起”时，可将之与道次第中士道相配合；辩论“静虑、无色”时，可将之与奢摩他章配合。我们去为别人诵经祈福时，任何翻开的佛经内容都能归入实修法中。甚至“擦康”中随便哪一张经论散页，其内容也都能加在我们所修的所缘类中。我年轻的时候，有一次在寺院外绕寺道旁的“擦康”内看到一张散页，上面印有嘉却·格桑嘉措（贤劫海）的一首道歌：见彼幼蜂小斑虎，鲜花丛中飞不停，采集拾弃须臾顷，由此可闻同喻歌：我见浊世众凡夫，由自不净心感受，敌友变动刹那间，故我未得可信友。我马上将此与中士道中的“怨亲不定”过患联系了起来。像这样，对一切佛语及其注释能不舍一字全部视为教授者，就是所谓的“噶当”（教授）。", "宗喀巴大师曾向噶居·仁钦佩（宝增）询问“噶当”之意，仁钦佩答道：“此意为不舍佛语一字全都视为教授！”宗喀巴大师闻言大喜，后来他在一次法会中赞叹道：“今天，噶居赐给我极大的智慧，他说……”如果能产生这样的认识，我们便能容易地将一切圣言——包括“擦康”内的一纸散页在内——全都并入任何一个补特伽罗成佛所需的教授中，也就是全部地并入我们自己成佛所需的教授中。我们应当明白，这一切经论好像是佛陀等专门为我说的，从而对一切经论生起极大的恭敬。瑜伽师强曲仁钦（菩提宝）说：言悟入教授者，非说仅于量如掌许一小函卷而得定解，是说了解一切圣言皆是教授。我们应该照这样来了解，这句话如同此处所说主题之根本。那么，视一切圣言为教授要具足什么样的关要呢？有人心想只要听闻“道次第”便足够了，而事实上的要求是：我们必须领会圣言及注释之义是如何摄入从依止知识法开始直至止观之间的“道次第”中的。以及不论科判的广略，我们必须对一切支分在心中获得决定。然后知道如何用于实修，亦即对应做“观察修”者便做“观察修”，对应做“止住修”者便做“止住修”。", "一旦达到这样的认识，那么我们所见到的任何圣言，便能很容易地分别与自己所修的各种所缘类一一相配合，这才是将圣言视为教授的标准。为使大家易于理解，我再讲一个我的大宝师长曾经用过的譬喻：假如有一个人，稻子、麦子、豆子等什么都没有储藏，当他偶尔获得这样一捧东西时，比如说稻子吧，对他来讲，那是没有什么大用处，到头来也只会将它丢弃。同样地，如果不具足道之一切支分，也就不知道应该将所见到的圣言与相应的道的某一方面相配合，更不会知道将之用于实修；反之，如果此人拥有几升稻子、麦子和豆子等物的话，他就可以将他所得到的那一捧稻子加到已有的稻子中去。同样地，如果我们具足道之一切支分，便可容易地将所见到的圣言与相应的道的某个方面配合起来。因此，只要我们具足道的一切支分，无论广略，我们都能获得修道的进步。", "（帕绷喀仁波切又用官员家具与僧人家具的譬喻，对此详加说明。）“通达一切圣言无违”与“一切圣言视为教授”之间的差别在于：前者不能包括后者，后者却能包括前者。乙三、易获佛陀密意殊胜如前面曾经说过的那样，佛语及其注释乃是最上教授，它们虽然包含着佛陀的究竟密意，但如果我们不依靠像“菩提道次第”这样的师长教授，单靠这些大教典，那是无法获得佛陀的究竟密意的。即使有可能，也需花费很长的时间，经受极大的困难才行。依靠此“道次第”，我们却能毫无困难地、容易地获得诸大教典中所说的佛陀密意。那么，什么是佛陀的密意呢？我的殊胜归依处大宝师长解释说：当以总“三士道”、别“三主要道”为佛陀密意，这一说法是可靠的，因为宗喀巴大师曾明确地说过，正见是佛陀的究竟密意。《三主要道》中说：现相缘起不虚妄，离执空性二了解，何时见为相违者，尚未通达佛密意。此颂正面说若不理解正见，即是未理解佛的密意，所以反过来说：如果理解正见的话，便能获得佛陀的密意。此外，“一切佛经心要义”是指出离心，“是诸菩萨所赞道”是指发心，“有缘求解脱津梁”是指正见，由此可以推导出出离心、菩提心也是佛陀的密意。", "所以，依靠“道次第”，我们便能很容易获得诸大教典的所诠内容——三主要道——在相续中如何生起的关要。当我们能毫无困难地在相续中对“三主要道”生起真正的理解时，便可说是容易地获得了佛陀的密意。打个比方来说吧：诸大教典好比是大海，“三主要道”等佛陀的密意好比是海中的珍宝，而“菩提道次第”就像是能入大海的船筏，开示“道次第”的师长就像是船长。海中虽有珍宝，但是如果不依靠船筏入海，不仅得不到任何珍宝，还会有丧命之虞；同样地，如果我们不依靠“道次第”而直探诸大教典的话，那将极难获得佛陀的密意。但如果在有经验的师长船长带领下，坐着“菩提道次第”船筏而入教典大海的话，那么就能容易地从教典大海中获得佛陀究竟密意的珍宝。乙四、极大恶行自趣消灭殊胜此处所谓的“极大恶行”，在《菩提道次第广论》等文中，指的是谤法业障。如果未能对前三种殊胜生起决定的话，我们就会经常不断地对佛的各种教言生起大小不等的不恭敬心。例如，分判乘的优劣，或将法分成用于讲说的与用于实修的等等，从而造集严重的谤法业障。这种谤法业障是极重的，《遍摄一切研磨经》中说：曼殊室利！毁谤正法业障细微。曼殊室利！", "若于如来所说圣语，于其一类起善妙想，于其一类起恶劣想，是为谤法。彼谤法者，由谤法故，是谤如来，是谤僧伽。若作是云：此则应理，此非应理，是为谤法。若作是言：此是为诸菩萨宣说，此是为诸声闻宣说，是为谤法。若作是言：此是为诸独觉宣说，是为谤法。若作是言：此是非诸菩萨所学，是为谤法。谤法者过失极其严重，《三摩地王经》中说：若毁此赡部，洲中一切塔，若毁谤契经，此罪极尤重。若杀尽殑伽，沙数阿罗汉，若毁谤契经，此罪极尤重。", "如果我们能对前三种殊胜获得决定，那么就会感到佛语中无一字可舍，而将其全部视为实修教授，对它们生起同样的恭敬。这样的话，我们也就不会去分判法的优劣，从而自然而然地堵塞最严重的谤法之门。此外，一旦我们能如理思惟“依止善知识”法时，便会自然而然地断除依善知识而犯的那些业障；如果我们能对“暇满”“无常”之类获得决定，就能自然消灭贪著现世的过失；乃至如果修“发心”所缘类，便能自然消灭依我爱执而生的过失；如果修“无我”所缘类，便能自然消灭依我执而生的过失。因此，如果我们在相续中一一生起各种所缘类的话，便能自然而然地消灭它们各自所对治的重大恶行。对上述这些殊胜生起理解的次第，也可以用譬喻来加以解释：譬如有一位画师，在绘制唐卡前，他必须先备齐用具，例如画布、颜料、画笔等等。他明白，这些材料和工具全是用来绘制唐卡的必要条件，而绝不会有丝毫不利条件，此喻等同“通达一切圣教无违”。然后，他又知道如何正确使用这些材料和工具来绘制唐卡，此喻等同“一切圣言现为教授”。由此画师能妥善地完成唐卡的制作，此喻等同“易获胜者密意”。这四种殊胜有两个名字：“能诠文四殊胜”与“所诠义四殊胜”。", "论的本身已具备“能诠文四殊胜”，而“所诠义四殊胜”则必须由行者自己来完备，这是最重要的。以上所说为“四殊胜”。此“菩提道次第”不仅具足这四种殊胜，而且拥有“三大别法”。“三别法”为：一、总摄一切显密圣言所诠而作开示故，所诠圆满；二、以调心次第为主而作开示故，易于受持；三、以善巧二大车轨之二师教授为庄严故，胜出余轨。", "一、所诠圆满本“道次第”虽然无法容纳圣言及其注释的全部文字，却能包含一切经论要义而作开示。所有圣言及其注释的文义全都包含在“三士道次第”中，也能包含在现在所说的简略“道次第”中来讲，因此，一切圣言的所述内容均能包含于“道次第”中而作开示。至尊宗喀巴在上呈喇嘛邬玛巴的信中说到：我感到吉祥燃灯智的这个教授——菩提道次第教授——是将圣言及其释论的所有教授总汇为一个道次第而说的，善于听讲的双方，在讲解与实修时，会发现这教授并非仅仅是些零碎的教授，而是将所有圣言加以汇编而产生的。所以，我无需开示太多其他的引导。在其他教派中，引导的名称种类众多，如“归依”等“四大加行”及“正行”等。在我们新、旧噶当派中，则无需如此繁多的引导，一切都包括在“道次第”。由于《菩提道灯论》能将一切圣言所说的内容浓缩在三页纸中而作开示，而且又是其他一切“道次第”的根本教典，所以其他“道次第”著作，也同样可以将一切圣言所说内容包括起来而作开示，正如至尊宗喀巴所说的：总摄佛经心藏义，能得一次善讲闻，说听一切正法福，悉能摄尽应思惟。", "我们对“菩提道次第”做闻、思、听、讲，也就是闻、思、学习所有圣言及其注释之义，即便单做一次“速修”，也能成为修习一切圣言及其注释之义。噶当派格西堆陇巴大师也说：当我讲“菩提道次第”的时候，赡部洲中一切经函全都颤栗而心想：这白发老僧正掏出我们的心！事实上也是如此，如能妥善地讲听“菩提道次第”，那么师长便是讲了赡部洲中一切经函的心要。所以说，此“菩提道次第”收回来能包含一切圣言之义，放出去便如开启圣言百门的钥匙，因而再也没有比本法更为精要的了。由此可知，格西堆陇巴大师在讲“道次第”时说：“我剖开了佛法的大牦牛”，说的也是这个意思。慧力弱的人虽然无法详细研习“道次第”著作，但是如能依靠某种略论，如“明晰引导”等，具足一切所缘类支分来修的话，还是可以取得修道进步。相对地，倘若不具备其中任何一种所缘类，便无法获得进步。譬如，你虽有一包包治热病用的药——冰片二十五味，但你不必全部吃下去。如果这二十五味药都配全的话，你只需短期服用便能痊愈。但如果有一味不全，那么其他各味就是吃下去再多，也是无效的。所以，值此有缘遇到像这样的教授之王之际，我们应当一心专注于此。", "二、易于受持下至在生死中承受各种痛苦，上至获得解脱安乐等等，这一切的造作者就是我们自己的心。调心法中最殊胜者无过于“道次第”，因为“道次第”以详述调心法为主，所以说本法“易于受持”。三、胜出余轨由于本法是以精通龙猛派的正理杜鹃大师与精通无著派的金洲大师这二位大德的教授为庄严来讲的，所以超胜于其他派别。如至尊大宗喀巴所说：赡部智者顶上严，名称幢幡极显耀，龙猛无著善传来，此菩提道次第者。", "像这样的“三别法”，连《现观庄严论》中都没有，密续之王《吉祥集密》中也没有，因为一者这二部教典中未包含全部的显密内容；二者它们不以调心次第为主。由于我们现在有缘能对这样的由“四殊胜”和“三别法”之门超胜他法的“菩提道次第”做闻、思、修三者，因此，我们绝不应满足于一些相似的和不全面的教授，而应以极大的精进入于此道，这是最要紧的。甲三、如何闻说具二殊胜法之理此科极为重要，如达波大修行者昂旺札巴所说：听讲入道此关要，前行妙诀当爱重。下面的所有闻说是否落实到我们自相续上，以及我们是否能获得修道进步，均观赖于此科。又如所谓：“初一若错，乃至十五。”如果我们从此处开始发生错误的话，所有的闻、思、修都将不得要领。所以这里分三方面来细讲：（乙一）听法之理；（乙二）说法之理；（乙三）结束时如何共作之次第。乙一、听法之理分三：（丙一）思惟闻法利益；（丙二）于法与法师发起承事；（丙三）正听闻之理。丙一、思惟闻法利益首先，为生起强烈的听法欲望，思惟一下闻法的利益是很重要的。如果我们能正确地思惟，便能对听法发起很大的欢喜心，如《听闻集》中所说：由闻知诸法，由闻遮诸恶，由闻断非义，由闻得涅槃。", "只有依靠听闻我们才能知道一切取舍的关要：知道律藏之义后，我们便能以增上戒学遮止罪行；知道经藏之义后，我们便能以定学断除散乱等无意义之事；知道对法藏之义后，我们便能以慧学获得涅槃。又如《本生鬘》中说：闻除痴暗为明灯，盗等难携最胜财，是摧痴敌器开示，方便教授最胜友，虽贫不变是爱亲，无所损害愁病药，摧大罪敌最胜军，亦是誉德最胜藏，遇诸善士为胜礼，于大众中智者爱。听闻犹如“消灭愚痴黑暗之明灯”。我的大宝师长曾说：你仅仅知道一个“噶”字，便能消除不知道“噶”字的黑暗，而生起了知的智慧光明。同样地，在你学会三十个藏文字母的时候，便能消除这三十处黑暗，而生起三十处光明。如果你不做听闻的话，其他的就不必说了，即便驴头那么大的“噶”字也认不得，你所能做的只有摇头的份儿。这一点，想想自己家里那些从未受过教育的人即可明白。像这样听闻愈广，消除的无明就愈多，智慧光明也就愈大。如《听闻集》中所说：如入善覆蔽，黑暗障室内，纵然有众色，具眼亦莫见。", "如是于此中，生人虽具慧，然未听闻时，不知善恶法。如具眼有灯，则能见诸色，如是由听闻，能知善恶法。正如你眼睛睁得再大也看不清暗室中的用具一样，即便你具有慧眼，若无听闻之灯的话，也是无法知道取舍关要的。反之，如果在黑暗中将灯点亮，视力正常的人便能明见室内所有的东西。同样地，依靠听闻之灯，有慧眼的人便能了知一切法。《菩萨地》中详说需以“五想”来做听闻的方法及听闻的功德等。“五想”的内容是：因为听闻能时刻增长智慧故，应当作“眼目”想；由于听闻能授予慧眼得见“如所有性”与“尽所有性”故，应当作“光明”想；佛与佛法在世上极难出现故，应当作“宝”想；最终能施予大菩提果故，应当作“大胜利”想；从现在起就能获止观之乐故，应当作“无罪”想。听闻是种“殊胜财富”，因为它是盗贼等无法拿走的。世俗的财物可以被盗贼偷走、被仇人抢走，但听闻等“七圣财”和智、尊、贤三种功德，却是别人偷不走的。（大师诙谐地说：寺中有人回家探亲，会因为背负其他世俗财物而感到又苦又累，但若带的是这些圣财，就不需如此了。）死时我们能够带走的，也是这些；", "所以你们这些无牵无挂的单身僧人，不应追求像铜箍茶桶或铜茶壶这类的东西，而应希求那些圣财，这才是最重要的。听闻又像是“摧毁痴敌之利刃”，因为依靠听闻能使你根除一切烦恼怨敌。", "听闻又像是“开示无误教诲的最胜友”，我们在做事时，以前的听闻能指导我们：什么事可以做，什么事不可以做；怎样做应做的事，怎样避免不应做的事，以及做了某事之后可能产生的益处和过患等等。我的大宝师长说，当拉喇嘛益西沃身陷囹圄时，仍能表现出那么大的志气，也是因为受了“听闻之友”的劝告。听闻又像是“虽贫不弃之亲友”。那些世俗朋友在你荣华富贵的时候貌似亲附，而在你危难之时却假装不认识你。但是听闻却能在你受苦、生病及死亡的时刻，格外地帮助你，它才是最好的朋友。以前当彩却林雍增仁波切离事专修，无权无势的时候，有一次碰巧在路上遇到一位外出经商的叔叔，他走过去打招呼，他叔叔却假装不认识他。后来，当他担任（第八世达赖喇嘛）经师，权势炙手可热的时候，那位叔叔来拜访他，表明他们是叔侄关系。同样的例子还有，过去有个人，在他过穷日子的时候，亲戚中没有人来认他，但在他做了生意、发了点财之后，有些人便来认他，说他是自己的叔叔等，结果引来一大帮“亲戚”。有一天，他将那些人全请来吃饭，并将一堆银块放在首席的位子上，对之顶礼说道：“本无叔叔生叔叔，银块银块我顶礼。”这些故事说明，现世的亲友是不堪信任的。", "如果我们想寻求一位真正的亲友，那么寻求闻、思、修三者才是最好的。《格邬仓道次第》中，有“敬礼少许茶”等语，但我大宝师长的说法，则如方才所说的那样，因此，我将师长的话不加更改地告诉你们。听闻又像是“治疗烦恼病之良药”“摧毁不善军之援军”，也是“名誉、道德与最胜宝藏”，它是“遇见善士时所能给予的最上礼品”，并能够使你“在大众之中得到智者的敬爱”。其他如《本生鬘》所说：若由闻法发信意，成妙欢喜获坚住，启发智慧无愚痴，用自肉买亦应理。", "像这样依靠听闻对三宝的功德生起信心后，我们便会对供佛等事认真地去做；对于“业决定”等生起信心后，我们便会乐于做行善断恶之事；明白四谛中（苦、集二谛）的过患与灭、道二谛的功德后，我们便会坚定地为希求的目标奋斗等等，听闻的利益可以说是无量无边。即便需要我们割下自己的肉去买这个听闻的话，那也是值得的。因此，当我们现在有这个机会，可以不用割肉而舒舒服服地坐着听法的时候，应尽自己最大的努力来听。这个偈颂是“月王子”以每句一千两黄金的代价求来的。听闻愈广，可供思惟的东西也就愈多；思惟的东西愈多，修持体验的生起也就愈快。因此，我主张诸位当中那些智慧大的人和年纪轻的人，应该入大寺院学习五部大论。因为仅就认识“三宝”而言，学与未学二者的差别也极大。一个不读书的老师，不应该让学生步自己的后尘；相对地，如果督令学生认真学习的话，那么他本人也将在后世生起与之等量的智慧。对于那些老年人与根器钝（慧力弱）的人来讲，虽说也应该学习大论，但很可能是在无法解疑中度过一生。尽管因为这样而无法广大听闻，但他们仍可闻思像“菩提道次第”这样的法，而对全圆道获得理解。", "在班禅却坚的梦境中，宗喀巴大师对他说：为利自他故，听闻当无厌，视三地菩萨，听闻亦无厌。我们也应该这样去做。我们智慧再怎么弱，怎么可能没有能力或没有时间来听闻“道次第明晰引导”这样的法呢？为何我们要自称“我们不是学者”，而自断法缘呆住一旁呢？就像马、象、羊等根据各自的能力来背负东西那样，我们应该根据自己的慧力来做听闻。然而，无论听闻是广是略，从最初的“依止善知识法”直至最后的“双运”，这中间的各种所缘类一定要全部具备。不然的话，即便对某些所缘类了解很多，但终因其他所缘类有所欠缺，而变得像生活必需品匮乏的那样：虽有一百条毯子而没有一件衣服可穿，或是虽有一百件衣服而无一条毯子可铺。如果所缘类全备的话，则无论听闻是广是略，都能使我们获得修道的进步。譬如，无论是大官的家具还是僧人的家具，都有同样的基本功用。丙二、于法与法师发起承事如《地藏经》中说：专信恭敬听闻法，不应于彼起毁谤，于说法师供养者，谓于师起如佛想。我们应当像恭敬和侍奉佛陀那样来侍奉和恭敬法师。《菩萨地》中说，应离三种杂染及不介意法师五处而做听闻。离杂染之一的“离贡高杂染”，是说我们应由以下六事来做听闻：一、应时听闻；二、发起恭敬；", "三、当作侍奉；四、不应忿恚；五、如教奉行；六、不求过失。其中“应时听闻”，是指我们应在师长高兴且有空的时候求法。只顾自己方便来安排时间，狂妄自大、自以为是是不对的。以前，格西博朵瓦在前藏上部的噶康寺整理许多经书而忙得头昏脑胀时，有一个人前来求法，格西作发怒状，站起身来将那人赶了出去，那人只好狼狈地逃走。所以我们应该懂得选择适当的时候求法。“发起恭敬”是指向师长顶礼及师长莅临时起立等。“当作侍奉”是指为师长洗手洗脚等。“不应忿恚”是指承事师长时无有恼怒。“如教奉行”是指遵师命而行。“不求过失”是指不作非难。“离轻慢杂染”，则是我们不可以轻视法与法师。", "“不介意五处”是指我们不应将师长的五个方面视为过失而抛弃师长：一、犯戒；二、下层种姓；三、容貌丑陋；四、文辞鄙恶，表达方式欠佳；五、语调不雅。丙三、正听闻之理正听闻之理分为两节：（丁一）断除违缘器之三过；（丁二）依止顺缘六种想。丁一、断除违缘器之三过所谓“器之三过”是指：一、如器皿倒覆之过；二、如器皿有污垢之过；三、如器皿底部有漏孔之过。第一，如果器皿倒覆的话，你再怎么灌注好东西也不会跑到里面去。像这样，虽然你身体是坐在会场里，但如果不好好用耳朵来听、心思散乱的话，那么法师说些什么，你就一点儿也不知道，这和不参加法会没什么不同。因此，我们应当“如鹿贪声”那般，集中一切思想来听。“一切思想”意为我们必须集中所有注意力，而不是用一半的心听法，另一半心却散乱于别的事情。据说鹿对声音极为贪著，在它侧耳倾听的时候，即使边上有人向它射箭亦浑然不知，我们应该如是而行。第二，虽然器皿没有倒覆，但如果器内有污秽或有毒的话，这将使注入的东西不堪受用。像这样，虽然你好好地用耳朵来听，但某些人的动机是想见闻广一些，某些人是想将来为别人讲经等等。", "且不谈这些情况，即便以希求独自获得涅槃乐的动机来听，在这里也属于器皿有垢之过。所以，我们至少要以造作的菩提心这一动机来听。第三，虽然器皿没有倒置，也没有污垢等，但如果器底有漏孔的话，再怎么灌注好东西也一点儿留不住它们。像这样，虽然好好地用耳朵来听，动机方面也没有过失，但如果记不住所听之法的话，还是会马上忘掉。要做到不忘所闻是困难的，因此我们应以某一科判和书本为基础，在阅读每一章节时，回忆师长曾经讲过的与此有关的内容，不断复习。尤其是在课后，与法友互相讨论来做温习是很重要的。薄伽梵曾在经中郑重地告诫我们：善谛听闻，意思念之。这里的“善听闻”是说应断“器皿有污垢之过”；“谛听闻”是说应断“器皿倒覆之过”；“意思念之”是说应断“器底有漏孔之过”。丁二、依止顺缘六种想六想为：一、对自己作病人想；二、对正法作药品想；三、对善知识作良医想；四、对认真实修作治病想；五、对如来作善士想；六、对正法理作久住想。一、对自己作病人想这一条很关键，如果具有此想的话，其他各种想便能自然地产生。自己没有生病而观修自己成病人，这虽然是一种颠倒的做法。然而，事实上，我们的确是身患烦恼重疾的病人。", "迦摩巴说：若非实事，作实事修，虽成颠倒。然遭三毒极大重病之所逼迫，病势极重，我等竟无能知自是病者。我们也许会想：“如果我有病，我应该知道才对，为何我不知道呢？”这就像是发高烧的人，神志不清，以为自己不是病人，而照样唱歌跳舞一样；我们所患的烦恼病极为严重，时间又很长，所以根本不知道自己是个病人。", "我们也可能这样想：“如果我有病，我应该感到疼痛才对呀？为何我感觉不到呢？”事实上，我们是在不断地感受三毒的剧痛。若问：“那是怎样的情形呢？”举个例子来说吧，我们到集市里去，看到一件很中意的东西，但买不起，回到家时，心想：“我要是有这样东西就好了。”随之而来的便是一种不愉快的感觉，这便是贪欲引起的疼痛；当别人对自己说些不好听的话，或是见、闻、回忆某些不称心的事时，会产生不愉快的情绪，难以忍受，这便是瞋恚引起的疼痛。像这样仔细观察我慢与嫉妒等烦恼，我们将会发现，它们可以不断引生难以忍受的强烈痛苦；所以说，实际上我们正身患贪病、瞋病、嫉妒病等多种疾病。如果对普通的疾病我们都会发生怖畏，那么对身患这么多的疾病，我们怎能不感到害怕呢？《入行论》中说：若遭常痛逼，尚须依医言；况长遭贪等，百过病所逼。此外，在生活中如果我们生病达一、二个月之久，那将是件极为可怕的事；更何况我们在生死中为烦恼病所苦，是从无始以来直到现在呢！除非我们从生死中解脱出来，否则我们的烦恼病是难以痊愈的。博朵瓦说：“无痊愈时之病者，无抵达时之旅客（医不好的病人，有如到不了目的地的旅者）。”此话的确不假。", "二、对正法作药品想当病人知道自己患病时，就应该寻找药物来治疗；而正法正是能息灭那些烦恼疾病的药物，所以我们应该寻求正法。三、对善知识作良医想如果病人不去访求医生看病而胡乱吃药，将药性的冷热和服用的先后次第搞错，这样的话，非但治不好病，反而有丧命的危险。所以必须依靠一位有经验的医师才可以；同样地，如果不亲近善知识，以为单靠学学经书就可以，并自以为是地诵读和修行等，这样的话，证悟的体验绝不会生起，心相续只会变得越来越僵化。因此，如果我们真有修法之心，就必须郑重地亲近与有经验之医师相仿佛的善知识。病人找到医生时，会生起极大的欢喜，对医生的话言听计从，恭敬服侍；同样地，找到善知识之后，也应该如是而行。《摄功德宝》中说：故诸勇求胜菩提，智者定应摧我慢，如诸病人依医师，亲善知识应无懈。四、对认真实修作治病想药品虽然能治病，但是如果病人从医生那里取来许多良药而不服用，只放在枕边，不遵医嘱，应该做的不做，不应该做的全去做，这样的话，根本治不好病。医生和药品对此都没有责任，这是病人自己造成的。", "同样，我们在犹如良医的善知识那里，听受许多能治烦恼病的教诫而不加实修的话，深广教诫获得再多，也无益于身心，师长与法都不能对此负责，这是弟子自己的过失。如《三摩地王经》中说：彼若数数勤访求，获遇聪慧明了医，医亦安住其悲悯，教令服用如是药。受其珍贵众良药，若不服用疗病药，非医致使非药过，唯是病者自过失。如是于此教出家，遍了力根静虑已，若于修行不精进，不勤现证岂涅槃？", "该经又说：我虽宣说极善法，汝若闻已不实行，如诸病者负药囊，终不能医自体病。《入行论》中也说：此等应身行，唯言说何益，若唯诵药方，岂医诸病者？所以说，为了治病单获得药品是不够的，必须妥善加以服用而且按照医嘱行事才行；同样为了消灭烦恼疾病，我们应该将教诫之义与自心结合起来而加以实修。《道次第广论》中说：闻已了知所有需要，即是行持，故闻义后应随力行持，是极大关要。有些人喜欢尽可能地多累积所闻与所得的教授数量，只在文字上下功夫而不实修。《劝发增上意乐经》中说，这些人就像是求蔗糖者只贪食甘蔗树皮的滋味一样：甘蔗树皮全无实，所喜之味藏于内，若人但只嚼蔗皮，不获甘蔗精美味。如其外皮言亦尔，思此中义如其味。该经又将这类人比作模仿他人的戏剧演员：如有处居戏剧场，谈说其余勇士德，自己失坏殷重修，如是爱著言说失。因此，应该致力于实修而不是单注重于文字，如若不然，没有比这个更能使我们成为“教油子”的原由了。据说听闻数量多而修习数量少乃“教油子”之因。", "我们在最初听法的时候，似乎觉得有些受益，但如果不以经常回忆和修习来加以巩固的话，以后再听时，这种感觉便会较以前减弱些，每次听讲，感觉愈来愈弱，最后发展成不论所闻之法是如何精深，都会以为全是老生常谈，因而对自心没有丝毫的益处；这时候就变成“教油子”了，那是很下流的。如婆罗流支论师在《百颂论》中说：出家复还俗，女人事三夫，野干脱网罟，此三为狡诈。噶当派祖师也说：法能调罪人，难调教油子，油能鞣糙皮，难鞣包油皮。如果因为别的法成为“教油子”的，尚且可以为其开示“菩提道次第”来作教化，但如果对“道次第”也变得油滑的话，那就无药可救了。所以，对这一要点，务必加以慎重！不论我们修什么法，应先妥善听闻，然后将所闻之义与自心结合起来，必须做到闻、思、修三者互不乖离，当如仲敦巴法王所说的那样：我听闻时思修增，我思惟时闻修增，我修习时闻思增，于一事上摄无余。了知将法转为道，吾乃无偏噶当巴，如面具眼知诸义，悉善通达是噶当。又如对于一个手脚残废的麻风病人来说，单靠吃一二剂药是无济于事的，必须长期服用许多药力强的药物才行；", "经无始以来，我们所患的烦恼病势已极为严重，对此仅修一两次教授之义是不能奏效的，必须像河水长流一般，认真努力地勤修方能解决问题。如月官论师所说：此心中亦恒愚昧，长时习近重病疴，如具癞者断手足，依少服药有何益？", "我们必须像格西·京俄瓦一样，能马上将教授用于实修：京俄瓦在阅读《毗奈耶》的时候，当他一看到“皮革事”中说出家人不可以使用皮革物时，便马上将座垫下的一块兽皮垫扔掉；当他继续往下读至在边远地区可以特别开许使用皮革物时，又将以前扔掉的那块皮垫子捡回来铺在座垫底下。五、对如来作善士想最早宣说本法的大师佛陀，他自己已现证诸道与果，并为别人如实宣说，所以在开示取舍关要方面没有丝毫的错误，是“善士夫”，即公认的楷模者。我们当用“佛所开示的这个法怎会有错误呢？”这样子的心来修“念佛”。另一种说法是：“对善士作如来想。”这里所说“善士”是指自己的师长，当思师长为如来释迦牟尼的化身。六、对正法理作久住想这也就是说，我们应当思惟：“由于听闻像这样的正法，而能使佛教久住于世，这是多么好的事啊！”总之，第五想是修忆念如来恩德，第六想是修报答佛恩。尤其重要的是，在听法时，应将所闻之法直接放在心里。如果将心放在一边，所闻之法放在另一边的话，那么任何甚深而犀利的教授都是无法利益自心的。譬如，照一下镜子便可知道自己脸上有没有黑垢斑点，如果发现有的话即当清除掉；", "听法也像照镜子一样，可以从法镜中检查自己的念头和行为有没有过失。如果发现有过失的话，应该为此感到苦恼，想一想，我们的心怎么会变成这样的呢？然后当尽最大的努力来消除这些过失。我们当如《本生鬘》中苏达萨之子“斑足王”对月王子所说的那样：我鄙恶行影，明见于法镜，意极起痛恼，我当趣正法。以前当薄伽梵尚在有学道，受生为月王子的时候，苏达萨之子喜欢杀人而食。有一天，王子驾临一座花园，在一位清净仙人（婆罗门）跟前听法。忽然外边传来阵阵喧哗声，王子派人查看究竟发生了什么事，得知是苏达萨之子来到此地。卫兵们报告说：“那个可怕的吃人魔王，苏达萨之子斑足来到了这儿，我们的骑兵、象队、战车和步兵都被打散了，现在不知该怎么办才好，请您拿个主意吧！”王子闻言大喜，不顾嫔妃等人的阻拦，来到最为嘈杂的地方。他看见斑足怒气冲冲，挥剑舞盾，正追杀他的禁卫军。王子没有一点害怕犹豫，说道：“我是月王子，我在这儿，你过来吧！”斑足便回过头来说道：“我要找的就是你。”然后跑来，将王子背在肩上回去。斑足所住的地方到处是人的骨骼，人血染红了地面，豺狼等猛兽和鹫、乌鸦等凶禽发出阵阵怪声，四周被烧尸的烟熏得黑黝黝的。", "斑足将月王子关在这间可怕的房子里，他一边休息，一边贪婪地盯着月王子漂亮的面庞。此时月王子心里却想着尚未向花园的清净仙人供养说法酬金，而流出了眼泪。苏达萨之子说：“不许哭！你月王子向来以坚强著称，现在被我抓起来，你却哭了，真是怪事！所谓：‘大难临头时，坚强是没用的；苦恼忧愁时，听闻是无益的；捶打之下是没有不发抖的。’看来此话不假。你要对我说实话，你是因为怕我杀你，还是因为怕离开你的亲友、嫔妃、儿子、父母而流泪，或是为了别的什么，你一定要照实说。”王子回答说：“我曾向一位婆罗门求法，但还没有向他供养酬金。所以请先让我回去吧，供养了之后，我保证一定回来。”“你说的全是假话，一旦侥幸从阎王的口中逃出，有谁还想特意回来送死？”“我不是已经保证了要回来的吗？我月王子从不违背诚实，它就像是我的生命一样。”尽管斑足不相信王子的话，但还是决定考验一下他的品格，于是说道：“那么你走吧，我要看看你是否真的说话算数。回去做你想对那个婆罗门所做的事，随后尽快回来。在这同时，我将把用来烧你的火准备好，等着你。”于是王子回到了家里，向那位婆罗门献上四千两黄金作为四个偈颂的供养。", "王子的父亲用各种方法阻止他回斑足那里，可是没有成功，王子又回到了斑足的住处。当斑足远远看见王子时，他感到十分诧异。王子说：“现在你可以吃我了。”斑足说：“我自己知道什么时候该吃你，现在火里有许多烟，用有烟的火烤肉，肉也会染上烟味，味道就不香了，所以再过会儿。你先告诉我，你从那个婆罗门那里到底听到些什么重要的东西？”“婆罗门的嘉言能分辨法与非法，你的所作所为比罗刹还要恶劣，像你这种人还要听法干什么？”斑足对王子的话难以忍受，说道：“等等！你们王族用兵刃屠杀野兽，这也是与法相违背的。”月王子回答说：“那些屠杀野兽的国王其行为固然与法相违背，但吃人肉的人比他们更为下贱，因为人要比野兽高级，吃自然死亡的人肉尚且不可，何况是为了食用而杀人？”苏达萨之子又说：“你回到我这里来，说明你对教义还不是很精通。”“我回到这里来是为了信守诺言，这正说明了我对教义的善巧。”斑足又言道：“凡受我控制的人都觉得很害怕，你却十分勇敢，不慌不忙，似乎毫不惧怕死亡。”月王子说道：“那些作恶多端的人，死时会感到懊悔，我没造过什么罪业，因此用不着恐惧，所以现在就做祭祀把我吃了吧！", "”月王子的这番话使斑足生起了信心，他热泪盈眶，毛发竖立，对月王子认罪道：“如果故意对像您这样的人造罪，那就像喝强烈的毒药一样。请为我开示一下那位婆罗门所说的嘉言吧！”然后又说了前面引过的那个偈颂，即“我鄙恶行影”等。月王子发现斑足已成为堪闻正法之器，于是对他说：", "处极低劣座，发起调伏德，以具笑目视，如饮甘露语，起敬专至诚，善净无垢意，如病听医言，起承事闻法。随后，苏达萨之子便将自己的肩帔铺在一块厚厚的石板上，请月王子坐在上面。他本人则面对王子而坐，说道：“圣者，现在请讲吧！”王子便为他说法道：一次或无意，值遇诸正士，无需极亲密，即成坚固性。就这样，斑足驯服了自心。为了报恩，他释放了原先打算杀掉的、关在监牢里的九十九位王子。并向月王子保证，今后将受持诚实的禁行，并发誓不再杀生和吃人肉。在听法时，如果我们能将自心与法相对照的话，纵然自心极其粗犷像苏达萨之子那般，也是会被驯服的。但如果我们将法与心二者分离来听的话，那么即便是最贤良的师长和最深奥的教授，也不能对自己的身心有丝毫的利益。有些人听法，只是为了获得一些以前不曾了解和听过的教授，以这样的态度来听法是不能利益自心的。有些人听法，则是对教授中有趣的故事等感兴趣，而忽视那些甚深的要点。比如，以前嘉却·格桑嘉措在讲“道次第”的时候，据说当时有人称：“今天我获得了大智慧，原来潘域的麻伊洽喀（地名）就是伦珠宗！”我们应该避免这类事情发生。", "还有些人来听法，专门喜欢观察师长所说的内容是否与经论相符，而来纠正师长。喇嘛彩却林雍增仁波切说：“现在的这些弟子似乎都成了师长的考官！”当知佛法是根本无法利益这类人的。因此，听法时，最重要的是要将法落实到自心上面。所以说，师长在讲这个“菩提道次第”的时候，并不是以避免言词上的失误为主，而是以驯服弟子的心为主。你们这些听法的弟子，也应避免上述那些不正确的听法态度，而应将师长所说的一切内容落实到自己的心上面，以驯服自心为主来听。如果这样做的话，证德的端倪在本次法会中就会生起。师长在法座上讲，要比请师长到家里供养后再请法更为有效；同样地，弟子在法会中调柔自心，要比自己在私下里修更有效。以前，格西博朵瓦所说的任何法，甚至《飞鸟寓言》等都能对听众的心有极大的利益。当时有一位大学者，名叫格西却吉沃色（法光），他所说的法虽然甚深而广大，却无法利益他人的心，有人向博朵瓦请教这件事，博朵瓦说：“他所说的虽然都是嘉言，但我们两个在讲解的方法上有所不同。”当问及有何不同时，博朵瓦说：“他是以掌握知识为目的来讲的，而我是将一切正法之箭指向内心来讲的。", "”后来此话传到了格西却吉沃色的耳朵里，他便跑到博朵瓦跟前来听法，觉得对自心有很大的利益，他说：“我并没有学到以前未曾学过的教授，但我理解了以前未曾理解的教授。”我们也应该像他那样来听法。我们也应遵循格西·敦巴大师的教导，他说：“对一个大乘师长来说，在讲解所开示的教授时，当能引发无量理解；在实修时，当尽可能地使弟子得益于最终开示和在开示当下获得最大的利益。”关于“最终开示”一词的解说不一，我大宝师长的口授解释为：虽然师长一次讲有许多法，但是开示之末的总结，应该是最能利益弟子相续的。这一节说的是“讲闻入道”的教授。如前所述，如果从这里开始发生错误的话，正如所谓“初一若错，乃至十五”，无论我们所得的法是如何地深广，也会像天变成魔一般，那些法只会成为烦恼的朋友。因为这种事屡见不鲜，所以我们对此必须努力加以避免，这是极为重要的。", "乙二、说法之理分四：（丙一）思惟说法利益；（丙二）于大师与法发起承事；（丙三）以何等意乐及加行而说；（丙四）于何等境应说与不应说之差别。丙一、思惟说法利益说法者当如《俱舍论》中说：法施谓如实，无染辨经等。说法者所做的法施中不应夹杂烦恼，这很重要，如果说法是为了求利，心想：“我将获得供养”，或是心想：“我将由众多弟子恭敬款待”“我将获得学者的称谓和名誉”等等，这样做是利小害大而且折福的。说法甚至不应为了自己获得好的异熟果，而应出于大悲、以利益弟子的意愿来讲。不要像曲桑杰·益西嘉措（智海）所说的那样：“说法灌顶的时候，似乎很有辩才；担心没有供养时，却又感到深深的沮丧。”如果说法不是为了名利，那么说法者便能获得极大的利益。《劝发增上意乐经》中说，将发生二十种利益：慈氏！无染法施，谓不希欲利养恭敬，而施法施。此二十种是其胜利，何等二十？", "谓成就念，成就胜慧，成就觉慧，成就坚固，成就智慧，随顺证达出世间慧，贪欲微劣，瞋恚微劣，愚痴微劣，魔罗于彼不能得便，诸佛世尊而为护念，诸非人等于彼守护，诸天于彼助发威德，诸怨敌等不能得便，其诸亲爱终不破离，言教威重，其人当得无所怖畏，得多喜悦，智者称赞，其行法施是所堪念。", "其中“成就念”，意为不忘失正法；“胜慧”意为胜义修所成定解慧；“觉慧”意为世俗思所成定解慧；“成就坚固”意为不能劫夺；“成就智慧”是指资粮道和加行道位的世间智；“出世间慧”是指见道和修道位的智慧。（帕绷喀大师另外还详细讲述了这二十种利益中含有各种业果的道理，即六种为等流果，四种为离系果，九种为增上果，一种为异熟果。）《郁伽长者请问经》中还提及其他利益：出家者仅施一句偈法，较在家者布施无量财物尤为殊胜。说法者在忆念了这些利益之后，当思：“这些就是我的安乐资具！”这些利益不单是坐在法座上说法的大法师能获得，就是一般的老师，若能为学生如法开示者都能获得。我们在念经的时候，如果设想有许多天、龙、非人等有情聚集在自己的周围，自己在为他们说法的话，也能获得同样的利益。背诵经论也是一样。甚至在平时谈话中，如果我们能为别人开示取舍要点的话，也能获得殊胜的利益。（帕绷喀大师指出，在这些情况中，有说法者能不能成为师长的区别。", "）丙二、于大师与法发起承事如同达波·昂旺札巴所说：“佛说《佛母》自设座……”薄伽梵在开演《般若经》时，舒展以相好为庄严、如金枝叶一般的双手，亲自敷设法座等，表明法是连佛陀也应恭敬的对象，所以说法者应该发起大恭敬来讲法。", "同样地，在第一次结集时，阿难等坐在由五百位阿罗汉祖衣堆积起来的座上说法，以示正法的伟大。法衣等是佛陀的衣服，用它来挥灰和铺作座垫等，像许多人平时常有的举止，是绝对不被允许的；但为了显示正法的伟大，却应这样做。说法者也应该忆念大师佛陀的功德和恩德而对大师生起恭敬。丙三、以何等意乐及加行而说关于说法时的意乐（思想），应如达波·昂旺札巴所说的那样：吝法自赞厌说法，举过推延嫉应断；于徒修慈具五想，如理说善乐资想。说法者应断除下列过失：“吝法”，吝啬那些重要的教授精要，秘不示人；“自赞”，在说法时附带地自称自己以前是如何如何做的；“厌说法”；“举过”，以贪瞋为动机，述说他人的过失；“推延”，不想说法，推延懈怠；“嫉”，担心别人胜过自己。说法者应对听众发起极大的慈悲，住于“五想”而为之说法。所谓“五想”，就是对自己作医师想、对正法作药物想、对听众作病人想等等。在以前所说六想中，除去对认真实修作治病想，因为这一种想是弟子们应该努力做的。此外应思：“如理开示所致的善根，就是我的安乐资具。”关于说法时应有的加行（行为），说法者应该先做沐浴等清洁工作，穿上新衣，然后坐在高座上，舒颜微笑。", "为了使听众理解所说的义理，说法者当在说法中使用譬喻、经教及理由。", "像我现在坐在这么高的法座上，而诸位活佛却坐得比我低，这使我感到心怵而且不快。但因念及正法的伟大，故而假装这么坐一坐。如今在卫藏和后藏地区，这些规矩还保留着，这是件极好的事。（帕绷喀大师同时指出一些稀奇古怪的事，例如某些大喇嘛坐在高座上听法，称之为“接受传承”，而师长却坐在低座上传法，称之为“奉献传承”。）“舒颜微笑”，是指在说法时，师长应对弟子面含微笑。但也有例外，如隆睹喇嘛仁波切在说法时，经常手持棍棒呵斥弟子。说法时不允许有下列情况出现：像鸟雀营巢般科判参差杂乱；或是像老人挑食般跳过难点，只挑容易的讲；或是像盲人依杖而行一般，自己没有妥善地理解意思，全凭主观臆断来讲。我的胜归依处大宝师长曾说：当说法者离开寝室走向讲法堂时，应好好地纠正说法的动机。观想该法的亲疏传承师长上下重叠安住在法座上，然后向法座顶礼三次。再观一切师长一个个依次融入，最后融入自己根本师长。当自己登上法座时，观想根本师长融入自身。入座时应当念诵无常文句，例如“如星翳灯幻”等，并弹指。当思这些事都是无常的、转眼即逝的，以克服骄慢。不然的话自己也许就会想“今天我可真是个人物啊！”从而生起骄傲。", "接着，虽说应当念诵“伏魔咒”，但根据规矩，可念诵《般若心经》及“退魔法”以代之。在此之后，可以用“缓吟急讽”的调子来念诵《六加行法》广轨，这是珠康巴·格勒嘉措（乐善海）的规矩。珠康巴大师在讲“道次第”的时候，常费很长的时间用拖腔来念“加行法”，有些人担心，这样做会影响正式讲经的时间，故而请求改念一个比较简短的“加行法”。大师却回答道：“你们在胡说些什么！", "正式的讲解能不能达到关要，关键就在于此！”而未予以同意。如前所说，我们应当希愿在法会中就能生起“菩提道次第”的最初证德，而这需要依赖积资、净障及祈祷等，这是珠康巴大师的密意所在。因此，我们在念诵“加行法”时，嘴里不要讲不该讲的话，眼睛不要东张西望，心里不要急躁等。为了使每一座法的所缘体验在法会中就能生起，努力地做积净和祈祷是十分重要的。供养曼荼罗之后，说法者应捧起经书碰触头顶。次应讲述如何纠正动机之法，并发愿希望此次法会能饶益弟子的心相续。这也是珠康巴大师的规矩：用经书或帽子遮面而发愿。随后在诵“归依发心偈”第三句时，师长应改念“我以所修法施诸资粮”，弟于则改念“我以所修听法诸资粮”，像大家都知道的那样念。随后，应当复习已说的“道次第”部分，最好是复习以前每天所讲的内容。不然的话，随力所能复习前一、两天或前三天等内容，并由一位主要弟子重述一遍，即便在条件不允许的情况下，说法者也应说明，按照规矩应当这样来做。其次说法者应结说法印，念诵“天与非天人与非人王”等，观想帝释等天、龙、非人聚集，前来听法。因为众天神无法忍受坐在地面上，因此师长也应观想，准许他们停留在半空中听法。", "诸位当中那些肩负弘法重担的大德们，请将这些要点牢记在心！丙四、于何等境应说与不应说之差别总而言之，不可以为未请求者说法，如《毗奈耶经》中说：“未请不应说。”即便请求，也不可以立即就讲，首先应该谦逊一番，而说：“我懂得不太多，所以无法为您讲。”或是说：“在像您这样的大德第三天道次第教授的殊胜与如何讲听此法93汉译《月灯三昧经》卷5：“应先作是言：我学习不广。又复作是言：汝等甚黠慧，于汝大人前，岂敢辄宣说？”（T15，no.639，p.582c6-9）汉译《月灯三昧经》卷5：“观其机器已，不请亦为说。”（T15，no.639，p.582c10-11）具体是：“立为坐者不应说法，坐为卧者不应说法，坐于底座为坐高座不应说法，妙恶亦尔。在后行者为前行者不应说法，在道侧者为道行者不应说法，为诸覆头、抄衣、双抄、抱肩及抱项者不应说法，为头结髻、着帽冠、着鬘、缠首不应说法，为乘象、马、坐辇、余乘、及着鞋履不应说法，为手执杖、伞、器、剑、钺、及被甲者，不应说法。”可参阅汉译《根本说一切有部苾刍习学略法》。参看本书附录一《菩提道次第明晰引导捷径前行念诵次第易行仪轨·有缘颈严》。94掌中解脱菩提道次第二十四天教授"]}, {"c": "第四天", "segs": ["加行法之一（第一、二、三加行）吉祥月称说：若得自在住顺处，设此不能自摄持，堕落险处随他转，后以何因从彼出？我们现在已经从那些无暇修法的地方解脱出来，获得了暇满之身，能够自由自在地修习正法。在现在这种环境下，如果我们不去设法实现一种长远目标的话，将来我们又会堕入恶趣的深渊中，为痛苦所控制，假如我们堕入到那些连“法”的名字都无缘听到的地方，有谁还能修法从恶趣中跳出来呢？所以，在我们现在能自主的时候，应尽力去实现一种久远的目标。因为像“道次第”这样的法能使我们实现这一目标，所以我请求在座的诸位发起这样的动机来听：我当获得佛位以利益一切有情，为此我来听“菩提道次第”引导，然后去实修！（接着帕绷喀大师又像以前一样，重述“所听的法即是有缘之士能往佛地的大乘法范”等等，以及科判的设置，并简单地重复了昨天所讲的内容。）今天讲第四大科：甲四、如何正以教授引导弟子之次第此科分两部分：（乙一）道之根本依止知识法；（乙二）既依止已如何修心之次第。", "即便在宗喀巴大师著作的科判安排法中，我们可以发现，它们也开示了极其重要的实修要点：正如树木的叶子、果实等等均依赖树根而得以生长，所谓“道之根本”云云，显示从“暇满”“难得”直至“无学双运”之间的一切证悟也均依赖“依止知识法”而生。“既依止已如何修心”中的“已”字，在文法上是“从格”词，说明正确的依师法是“暇满”乃至“双运”之间一切证悟生起的根源。由此可见，依师法在一开始是最为重要的。前述三条科判是按照《道次第广论》来讲的，从这以后的科判则按《明晰引导》来讲，故与《广论》科判有所不同。乙一、道之根本依止知识法此科分两部分：（丙一）座上如何修之理；（丙二）座间如何修之理。将科判分成座上与座间是有很大关要在其中的：人一生的行动包括在日常生活的每一个昼夜中，每一个昼夜又包括在修法的座上与座间这二个阶段中，所以，我们“三门”的活动可以摄入座上与座间这二个阶段，如果这二个阶段都有意义的话，那么每一个昼夜也就有了意义。这样持续不断的话，一个月、一年，乃至人的一生就会都有意义了。丙一、座上如何修之理此科又分为三：（丁一）加行法；（丁二）如何修正行；（丁三）如何做结行之次第。", "丁一、加行法我们通常容易忽视加行，那是错误的。譬如，为了煮一壶好茶，我们在最初采购的时候，就应郑重其事；同样地，我们应该认真地修加行，因为它们是正行的体验能在我们心中生起的因。加行法共有六个方面：一、洒扫住处、庄严安布身语意所依；二、由无谄诳求诸供具、端严陈设；三、身具八法或随宜威仪坐安乐座，从殊胜善心中修归依发心；四、观想资粮田；五、摄集积净关要——奉献七支与曼荼罗；六、如教授启请，决定令与自心和合。第一加行：洒扫住处、庄严安布身语意所依打扫住处是金洲大师的行持。我们应做打扫的经典依据是：“菩提萨埵当于净处结跏趺坐……”应做打扫的原因是：譬如，我们想请一位大喇嘛或大官到家里来，自然先要认真地做好清洁工作；这样做，是为了向到我们住处来的师长、佛、菩萨等表达我们的敬意。打扫时，如果我们的动机只是为了自己的舒适与周围环境的美观，那就与布达拉宫、色拉寺、哲蚌寺的清道夫没什么两样，不会有丝毫的功德。反之，如果我们是为了获得佛位，利益一切有情的缘故，对修“道次第”引导所缘的加行资粮田恭敬服侍，以这种思想来做的话，就会产生极大的功德。经中列举了五种打扫功德：一、令自心清净；二、令他心清净；", "三、众天神喜欢；四、造集美丽业；五、死后往生天界。我的大宝师长说：众善品天神时常来到人间，保护那些如法修行的人，但他们忌讳不净。如果我们的住处不够清洁的话，他们便无法靠近和保护我们了。打扫住处不仅使善品天神感到高兴，也使师长与佛等感到喜悦。“造集美丽业”不但是指将来我们的躯体美丽，也指戒律清净。假如戒律清净的话，纵然我们的外表不够美，但在诸佛菩萨眼里，我们却是极美的，宗喀巴大师的话与此相似：诸具慧者惭愧衣，是戒非是细罗衣，颈严嘉言非璎珞，顶严是师非摩尼。“往生天界”主要是指往生净土。圣周利槃陀迦就是靠打扫住处而证得阿罗汉果的。下面简单地叙述一下他的故事：以前，舍卫城中有一位婆罗门，他的每个儿子都在出生后不久便悉数夭折了。婆罗门家附近住着一位老婆子，她对婆罗门说：“如果再生儿子的话，请通知我一下。”后来，婆罗门又生了个儿子，他便将那位老妪叫到家中。老妪为婴儿洗了澡，用白布裹了起来，嘴里塞满酥油，然后交给一位小女孩，说道：“抱着他站在大路的交叉口上，如果有沙门或婆罗门经过，你就向他们敬礼，说：这个婴儿敬礼于圣者足下！如果到晚上他还活着，你就把他抱回来，如果死了，你就扔了他吧。", "”那位姑娘办事很认真，她遵嘱来到大路的交叉口等着。最先遇到的是几个外道，姑娘便照着老婆子的话，对他们说了一遍。那些外道回答道：“愿他能活下去！愿他能够长寿！愿他能满足父母双亲的心愿！”后来又有几位比丘经过，他们也做了同样的祝愿。随后，姑娘抱着婴儿来到通往祇陀林的路上，在那里遇到外出化缘的薄伽梵，她将话又向佛陀说了一遍，佛陀回答说：“愿他能满足父母双亲的正法心愿！”太阳落山后，姑娘见婴儿还活着，便将他抱回家中，因为他曾被抱着站在大路上，故而得名为“摩诃槃陀迦”（大路）。摩诃槃陀迦长大后，对婆罗门的《吠陀》及其支分都极为精通，他能为约一百位婆罗门子弟教授婆罗门的秘密语。后来，婆罗门再度得子，那位老妪也再次被叫到家中，所有过程又像以前一样进行了一遍。但这次找来的姑娘做事十分懒惰，她只把婴儿带到一条小道上等着，在那里沙门和婆罗门一个也没有，昼夜六时观察众生的薄伽梵发现这一情况后，便故意来到这条小路上。姑娘请佛陀祝愿，佛陀便如前做了祈愿。后来姑娘见婴儿未死，便将他抱了回来。此儿因而得名为“槃陀迦”（路）。", "槃陀迦长大后被送去上学，照例首先应学会念诵“悉昙”等字，但他念了“悉”字忘了“昙”字，念了“昙”字忘了“悉”字。他的老师只得对其父婆罗门说：“我还有其他许多婆罗门子弟要教，这个孩子我教不了。”婆罗门又将他交付给教念《吠陀》的老师，让他学习“吠陀”，照例首先要学会“嗡希”等词，但他记住了“嗡”字忘了“希”字，记住了“希”字忘记了“嗡”字。这位老师也开始感到厌烦，他对婆罗门说：“您的长子摩诃槃陀迦我一教就会，这个孩子却怎么教也教不会，因为我还有其他学生要教，所以这个孩子我实在不能再教了。”因为槃陀迦反应迟钝、十分地迟钝，智力低下、十分地低下，故而他的名字被改为“周利槃陀迦”（小路）。兄弟俩的父母去世后，摩诃槃陀迦进入佛门，精通三藏成了阿罗汉。槃陀迦将家产耗尽后，来找其兄。摩诃槃陀迦观察后，发现弟弟与自己有法缘，便命他出家受近圆戒，然后教他念一个颂子：身语意三不造罪，离欲不执诸世间，具足正念并正知，有害痛苦皆不近。槃陀迦学了三个月之久还未能学会，而当地的那些牛倌和牧童却已耳熟能详，反过来教他念了。", "后来有一天，摩诃槃陀迦考虑是用赞扬还是呵斥的方法来调伏弟弟时，他发现用呵斥的方法较为有效，于是他揪着槃陀迦的后颈，将其赶出了祇陀林，并责骂道：“你真迟钝，太迟钝了，还要出家干什么？你就给我待在这儿吧！”槃陀迦心想：“现在我既不是沙门，也不是婆罗门了。”想着想着便哭泣起来。大师佛陀为大悲心趋动，他来到槃陀迦面前问道：“槃陀迦，你为何哭泣？”“我被阿阇梨骂了一顿。”随后大师说道：愚人做赞叹，智者做呵斥，智者呵为上，愚人赞则非。“我的孩子，你的阿阇梨并没有经历三大阿僧祇劫，以无量善行圆满六度而说此圣言；我却是这样的人，你愿意跟着如来学吗？”“尊者，我反应迟钝、十分地迟钝，智力低下、十分地低下，像我这种人怎能跟您学呢？”大师闻言说到：愚人自知愚，故于彼为智，愚自诩为智，彼为最愚痴。接着大师赐给槃陀迦两句话：“扫尘”和“除垢”，但槃陀迦仍然无法记住。薄伽梵决定要清净他的恶业，于是说道：“槃陀迦，你能为众比丘擦鞋吗？”“我能的，尊者！”“那么好吧，你就为众比丘擦鞋子和靴子吧！”佛陀又要求比丘们让槃陀迦这样去做，以清净其恶业，并要他们教他这两句话，佛陀的话被照办了。终于有一天，槃陀迦学会了这两句话。", "那时，佛陀对他说：“现在你不用擦鞋了，去打扫寺院吧，同时念这两句话。”槃陀迦便很努力地去做打扫的工作。因为佛力的关系，寺院右边的尘土刚扫完，左边的又满了，左边的尘土刚扫完，右边的又满了。由于槃陀迦勤奋地打扫，他的业障由此得以清净，有一天他心想到：“大师说的‘扫尘、除垢’，到底是指内在的尘土还是外在的尘土呢？”以前听过的三个偈颂此刻映现在他的脑海里：此尘是贪非尘土，尘乃贪名非尘埃，诸智者众除彼尘，如来教中不放逸。“此尘是瞋……”“此尘是痴……”等，依次类推。槃陀迦努力修习这些偈颂文义，最终证得了阿罗汉果。此颂在经里虽说是这个样子，但在加行法引导和诸位师长的口授传承中，为了实修时易解起见，第一句改为“尘者非土是贪尘”等，像这样来念比较好。薄伽梵为了将槃陀迦的功德宣扬出去，便让阿难去告诉槃陀迦要他为比丘尼说法，并告诉比丘尼众槃陀迦将是她们的大师。槃陀迦明白佛的意思是要替他宣扬功德，于是同意了：“我将如教奉行。”那些比丘尼们闻言却极为惊讶，她们说：“你们看，我们妇女被人轻视到如此程度！他在三个月中，连一个偈颂都学不会，怎么能来为我们这些三藏法师作开示呢？", "我们要想办法，今后不再使那些少闻寡学之人来到我们这里。”于是十二位比丘尼中，有的准备了一个极高的法座，但没有梯子可以登上去；有的跑到舍卫城中向城里居民宣布说：“我们的大师，一位殊胜的大声闻明天将到我们那里，凡听他说法未能见谛的，都将在生死中长期流转，所以请大家务必前来听法。”成千上万的普通百姓，有的为看热闹，有的为善根所激发，纷纷聚集前来听法。次日，槃陀迦乞食完毕，内从正定而起，外由几位比丘陪同，来到比丘尼的夏季住处说法。当他来到法座旁时，见法座极高，不清楚这些比丘尼是出于信心还是恶意，于是稍稍入定观察，知道是恶意后，槃陀迦便舒展手臂如象鼻般，将法座压低，坐了上去。这一举动有些人能看见，有些人不能见。入座后他先入定，从座上隐没，跃入空中，在四方显示四种神变。最后，他收回神变，重新坐在狮座上，开始说法：“姐妹们！我费了三个月才记住的那个偈颂，它的意思要讲七天七夜才能讲完。薄伽梵所说的‘身语意三不造罪’是开示断除十不善，‘诸世间’是指五蕴，‘执’是指贪、瞋、痴三者的执著……”槃陀迦仅仅详尽地开示了半个颂子，当时就有一万二千名听众见谛。", "某些人证四果之一，某些人成声闻、独觉或大乘人，亦即各自发菩提之心，大多数人则对三宝生起了信心。随后，槃陀迦来到祇陀林，佛陀为他授记道：“此槃陀迦是我所有善巧转变有情之心的声闻弟子中，最为殊胜者。”所以，以为打扫等比不上修法重要，这种想法是要不得的。佛经中说，给孤独长者，每天到祇陀林的欢喜园中做清扫工作。有一天，家主有事没来，也没有别人能做打扫，佛陀便亲自以金枝般的双手做清扫工作。我的大宝师长曾说：历辈遍知胜者之王修加行法所用的扫帚、草束都扫秃了，变得像驴尾似的。这些扫帚的柄被上好的黄布裹了起来，作为圣物供人朝拜，这是极具关要的行传。因此，我们初业行人应认真对待打扫工作才是。无论室内有无灰尘，最好在每座修法前都做打扫，不然的话，至少每天要打扫一次。具体的做法是：发起如前所说的动机之后，我们应该想象：我们正在扫除的尘垢，就是自他相续中的障碍。观此修法即圆满、成熟、净治三法中的一支，是净治佛刹的因。并如槃陀迦传记中所说，口诵“扫尘、除垢”，或念：尘者非土是贪尘，尘乃贪名非尘埃，诸智者众除彼尘，如来教中不放逸。此外配合瞋与痴，边做念诵边做打扫。", "在我们主修“依师法”时，“贪尘”可改作“尘者非土是不信”等；主修空性时，可改作“相执”。口做念诵、心做观想，与当前所修的内容保持一致。病人和老者无法亲手打扫时，可请弟子等代做，自应口诵意观。因动机的大小有别，每一挥帚，所获的功德差别也很大。住处门前应堆设四座标记，观想为四大天王，或只设一座标记做这样的观想，也可堆设一座标记，观想为毗沙门天王，据说这样做有不生障碍和戒律清净的大关要。在大寺院和其他不便设标记的地方，至尊绛贡仁波切口授中说，我们应观想，住处的四面外墙即四大天王便可。", "然后陈设身、语、意所依。师长、本尊等像应按“资粮田”各尊的次序排列，如果因为尺寸大小不一不便排列的话，可稍作变更。我看过许多人将护法、王魔、厉鬼等像置于佛像之首，以为他们最具神威，这暴露出他们心中没有清净的归依；也有人将金像、银像、铜像等排在首位，而将泥像等放在最后，这表明他们只将佛像视为一种财产。至于唐卡，如果按照新、旧次第来排列也是不对的。有些人将唐卡当帐子用，在室内团团围起来，这样的做法是极其错误的。有的人睡觉时将脚正对着佛菩萨像，一点也不觉得不安，这也是心中没有归依的明证。有些人将破旧的唐卡和佛像视为房间里的垃圾，而将它们送往擦康，这无异将他自己的福德往外送。所以我们应对佛像等作真的佛菩萨想。即便我们没有很多的身、语、意所依，但“身所依”中必须要有一座大师像，以便忆念佛陀，一座宗喀巴大师像，以便忆念师长；“语所依”中应有一部《般若波罗蜜摄颂》或《菩提道次第》；“意所依”中至少要有一个塔的“擦擦”。如有铃杵的话，也应供在“意所依”之中。有的人将铃杵视为普通的工具，其实它们是“意”的象征，如果轻视的话，过失是极为严重的。", "除开始修法的第一天外，虽然没有必要每天陈设身、语、意所依，但每天在修此科时，我们仍应瞻视佛像及作真实佛菩萨想，不可以为：“我已熟知房间里的佛像，何必再看？”如果我们每天瞻仰的话，就会一次次地在心中留下殊胜的习气。据说朝拜佛像的功德要比朝拜佛的真身大十六倍，《妙法莲华经》中说：吾人虽以扰乱意，观见壁绘如来像，彼等渐见俱胝佛。虽然经里本来说的是“供养壁绘如来像”，但口传中，却是这样讲的。假如我们怒气冲冲地观看佛像，也能有这样功德的话，那么当我们以信心来做瞻仰时，自然也能获得同样的利益。圣舍利弗成为佛陀的“第一双”（上首二弟子）弟子后，永不离佛的真身。据说这是因为他过去世看到佛的绘像深感稀有的结果。圣舍利弗过去世中曾受生为一个邮差，一天晚上，他留宿在一座荒芜的佛殿里。他点燃一盏极亮的油灯，借着灯光，一边休息一边修鞋，抬头看见壁画中的如来像，他自忖道：“要是能当面见到这样神奇的人物该有多好啊！”由于不断地发愿，最后终于让他遇到了释迦佛。我们现在所见的泥像、铜像等，当我们获得“法流三摩地”时，即是真正的“殊胜化身”；当我们获得初地时，即是真正的“受用身”。所以，对佛像作真身想极其重要。", "第二加行：由无谄诳求诸供具、端严陈设“无谄诳”分两个方面：物无谄诳与动机无谄诳。“物谄诳”，是指以不正当的手段获得的供品。对出家人而言，是指以“五邪命”的方法取得的物品；对在家人而言，是指以经营屠宰业、短斤缺两等极为恶劣的手段获得的物品；我们与其用这样得来的供品供养，还不如不供的好。供养的梵文为“布拶”，本意为令生欢喜。我们供养的目的，本来是为了使佛菩萨欢喜，如果我们奉献上述那种供品的话，怎能令他们生起欢喜呢？但是如果已经成办了这样的供物，为了清净自他的罪恶而做供养，如此供养则是好事。五邪命为：谄媚奉承、旁敲侧击、赠微博厚、巧取讹索和诈现威仪。“谄媚奉承”是指为了从施主等那里获得一些布施，故意装出一副笑脸使别人布施钱财等；如果没有这样的动机，而是出于正直的禀性，说了些中听的话，致使别人布施，就不成为邪命。“旁敲侧击”是指为求供养，间接地向施主等乞讨。例如说：“现在我尚有足够的茶和酥油，但粮食短缺。”或是“您去年惠施的糌粑对我帮助极大。”等；如果没有这种求利的动机，而是禀性正直地说这样的话，则不成“旁敲侧击”。“赠微博厚”是指向别人布施少许财物，以便取得较大的回报。", "例如向施主奉献哈达和递茶等，假意款待，内心则希望得到固定的供养和馈赠等大的回报。现在我们出家人常做这样的邪命，还说是“愿者上钩”。如果没有这样的动机，而是禀性正直地对施主殷切款待，也不成邪命。“巧取讹索”是指在别人不愿意的情况下强做乞讨，以及将他原本打算供养给别人的东西据为己有，或是间接地乞讨。例如说：“某某施主布施的茶和酥油对我帮助很大。”如果没有求利的动机，而是禀性正直地说这样的话，也不成邪命。“诈现威仪”是指在寮房里随随便便，而在施主等面前装出一副持戒精严、循规蹈矩的样子，以求得到一些布施；如果没有这样的动机，只是为了不让在家居士退失信心而在寮房外装出敦肃的样子，我的胜归依处大宝师长说，这不成为“诈现威仪”。我们这些出家人，像这样置三律仪于不顾，靠经商等置办财物来做供养，过失远比功德为重大。“动机谄诳”是指在奉献供养时掺杂有不良的动机，例如为求出名、为讲排场等。正如卓贡仁波切所指出的那样：即便供三宝，亦欲他人见。我们所做的每一次供养，全都流于求名求利等世间八法，稍微好些的，其动机也不外乎是求长寿、无病等等。例如，在供“千僧斋”时，心里想的不是积福，而是出名。", "如果今天有个贵客要到寮房来，便里外打扫，陈设的供品也比往日为丰富，还献上供灯，点燃供香，让室内散发着甜甜的香气，然后坐等贵客光临。这到底是什么样的动机？我们应该仔细去想一想！这样的供养，很难说是利大还是害大。有一天，格西奔贡嘉听说将有一位施主前来拜会，于是把对三宝的供养陈设得好好的，当他坐下来检查自己的动机时，发现自己这样做只是为了施主的情面和讲排场而已，于是站起来，在供品上撒上一把灰，说：“比丘不应该作假啊！”又将灰整齐地堆成一堆。帕当巴桑结在定日上部的绕佛道上听说此事后极为高兴地说：“藏地所有的供养中，奔贡嘉的供养是最好的，为什么呢？因为他能在世间八法的脸上撒上一把灰！”这一赞叹不是为奔贡嘉所做的供养，而是为他撒的灰。所以我们供养的动机，别说不可为世间八法，即使是为了独自获得增上生和决定善也是不可以的，应该尽力以菩提心来摄持，这很重要。至于“端严陈设”，有些人似乎以为不必如此讲究，对供品的形状和排列十分随便，这样的态度是错误的。供品的形状和排列应尽可能的美观，因为端严陈设供品是自己将来成佛时所具相好的因。献供时，我们应亲手奉献，如果让弟子和仆人等代做的话，自己不能得亲手献供之福。", "阿底峡尊者年届耄耋之时，不顾双腿打颤，坚持自己供水。别人说：“尊者啊！您累了，我们来帮您供吧！”尊者回答说：“那么在我吃饭的时候，你们是否会说：尊者啊！您累了，我们来帮您吃吧，而把我应得的食物吃掉呢？”以前，印度那些大法王在做大布施时，并不是让大臣等去做，而是建造一座“布施房”以堆放所施的财物，国王坐在里面亲手布施。因此，修习布施的一个重要关键，就是要亲手奉献。关于供品，如果自己饮食十分充足的话，食物的“荐新”应该选择最好的来供，而不是选那些腐烂的酥糕和枯黄的菜叶。我们大多将好的酥油和糌粑留给自己享用，而将不好的部分指定为“供面”和“供油”；这样做不等于把自己的福德全都扫光了吗？（帕绷喀大师同时指出：因为酥油灯供的是光明而不是酥油，所以在这种情况下，酥油略有变质是可以用的。）那些离事专修、资财匮乏的人，也不必因为自己没钱供养而感到沮丧。如果有足够的信心，供品随处可得。阿底峡尊者曾说：“藏地所有的水都具足八支，因此，在藏地单供净水即可。”又说：“如果印度有这种报春花的话，我会用黄金去买来供养。”如果我们得不到别的供品，单供净水也能积集很大的福德，八支的每一支都能产生一种功德。", "按照我大宝师长的说法，如钦·绛贝央（妙音）的《俱舍论释》中所说：清凉甘美轻、柔纯无臭味，饮不伤喉胃，具足八支水。供“清凉”水有戒律清净的功德；供“甘美”水有获得胜味的功德；供“轻”水有身心堪能的功德；供“柔”水有心相续调柔的功德；供“纯”水有神智清明的功德；供“无臭味”水有净障的功德；供“不伤胃”水有身不生疾的功德；供“不伤喉”水有语音和雅的功德。杰珠康巴·格勒嘉措起初住在色拉孜茅篷的时候，没有家具和日常用品，一贫如洗，就连供水的碗都没有。当他需要供水时，就将自己的饭碗好好地用水洗干净，然后用它来供水；当需要用它来吃饭时，他便向三宝“借回”，饭后又将之洗净再供净水。", "其他可以供养的东西，如夏季时盛开的鲜花，上等的树木、水果，澄净清凉之水等等，均可用心观想取来而做奉献。我的大宝师长说：我们也可仿效赤·达波彩佩（增寿）的行持，供养前先诵《供养云陀罗尼》加持，供养之后做回向善根等。因此我们手里没有供品没有关系，重要的是要有信心。在另一方面，也有人认为单单奉献一些水、花等意想的供品就可以了，而将实际的财物设法地积存起来。这种思想将会使他投生在饿鬼等恶趣中！所以当我们有实物时，应该选择最好的来供。舍事专修的出家人等也许会想：“我没有财物供养也无妨，有道是：出家人当以修行供养为主，所以我只做修行供养就可以了。”从而一点也不做财物的供养，这种想法会使他今后每一生中都无东西可供。当我们仅有指头大小的食物和半枝供香时，却仍能以虔诚的心将它们用于供养的话，那么我们的福德就会渐渐地增长，最终能奉献极大的供养，就像格西普穹瓦一样。格西普穹瓦曾亲口说：“我最初供的是甘松，气味辛辣；后来有四合长香可供，气味甘美；现在供的是沉水香和乳香等，气味香馥。”据说此师每配一次香供养，需花费二十二两黄金。又有一些人说：“我是有证悟的人，菩提当在修持中求，靠那些外相是不能成佛的。", "”这表明他们对佛法的理解极为贫乏！那些登地的菩萨尚需化身千百万，以百臂、千臂等经劫供养诸佛，何况你我之辈？认真想一想这个道理，然后我们应该用现在仅有的这个身体，尽自己最大的努力来做供养。关于献供的具体方法，这里以供水为例，稍作表述：必须先将供杯仔细地擦拭干净，然后将供杯一字排开放在供桌上。应当避免杯与杯之间的间距过远，否则将与师长分离；也应当避免两杯相触，否则就成为钝根；供献时如果发出响声，也将导致疯狂等等。空的盛器放在供桌上会减少我们的福德，所以在排列前，应先将供杯叠成一叠，往最上面的碗里注入少量的水，并诵三种子字加持，随后倒少许水到下面的一个杯中，再放到供桌上。依次重复进行整个过程，直至所有的杯子都排列在供桌上。这样的话，就没有一个杯子是空的。在献供（注水）时，如果单用一只手来做是不恭敬的，应该像为一位大王敬茶那样。注水时，水流的变化应该像麦子一样：两边细、中间粗。如果水太多溢出杯外，将导致破戒；反之，如果水太少，又将使受用减少。所以，水线应低于杯口约一粒麦子的距离。至于酥油灯，应该十分明亮才是，因为这是一种光明的供养。（帕绷喀大师又指出，作为长寿的缘起，供灯燃烧应尽可能地持久。", "）鲜花等其他供品的供法均照此类推。经中说，每一种供品都有十种功德。第三加行：身具八法或随宜威仪坐安乐座、从殊胜善心中修归依发心修法用的座子应后高前低，这里面既有密法的殊胜甚深关要，也可防止因久坐而导致臀部疼痛等问题。在座位下面，我们当用白粉划一个右旋万字。此万字表羯磨金刚，目的是在提醒我们大师佛陀在金刚座成佛的那段历史，此外也有令自己修持坚固之意。真正的羯磨金刚是本尊的标帜，我们不可践越（故而以万字代替）。然后铺设百节草和吉祥草，草与草之间不可缠乱，草尖当指向前，这也是为了忆念大师佛陀在这种草垫上成佛的行传。另外，经典中说：“百节草能增寿”，所以用百节草作座垫有增长寿命之效；“吉祥净且善”，吉祥草为能除障秽之物。在印度，当阿阇梨们遭受秽气侵染时，他们通常花一天时间躺在吉祥草苑中。因此铺设吉祥草有净除障秽的功用。“身具八法”中的八法，是指在“毗卢七法”之上再加“数息观”，如嘉瓦·温萨巴所说：", "足手腰为三，唇齿舌合四，头眼肩息四，即毗卢八法。我们的双足应结“金刚跏趺”，但在尚未修习密法“圆满次第”的阶段，做“菩萨跏趺”或“半跏趺”等均可；二手结定印，右手在上、左手在下，大拇指相抵，置于脐间；腰应挺直，各脊椎骨应当如铜钱上下重叠一般地保持垂直。（大师又进一步解释说：身直的话脉也直，脉内流动的风也直，这样一来就会提高心的堪能性。）牙齿和嘴唇不要故意闭拢或张开，应保持自然；舌尖抵住上颚，这样做就不会有口干的毛病，也可以防止在入定时滴口水等，有这些要点在里面；头应前倾，下巴内收，略抵喉结；“眼观鼻端”一语，实际上是指能见鼻的两侧即可，这有易断沉没与掉举的关要，有人修定时闭目而住，这样做是不对的。其他宗派的人说，上根者应眼观虚空做“法身观”等，但在本派中不这样做；二肩当保持水平，不可一高一低，此即“毗卢七法”。这里面有极为重要的圆满次第甚深关要，但现在不便明说。这些身关要的重要性，如洛札玛尔巴所说：“仅我玛尔巴译师之坐法，总集藏地一切修法亦难以匹敌。”“毗卢”是指毗卢遮那佛，该佛是清净色蕴的净分所显现的本尊。所以，称此七法为“毗卢七法”，是从这方面来说的。第八种法为“数息观”。", "如果心王与不善心所相应的话，要生起殊胜善心是很困难的。例如，当我们极为生气的时候，想简单地依靠念诵“为利一切母亲有情”等文来生起菩提心，那是一点儿也办不到的。因此，在心王与不善心所相应的时候，我们暂时先不忙于生起善心，而应先将心转为无记状态，然后再转为善心就容易多了。譬如，一块白布被污染时难以染色，但用水将它彻底地清洗之后，它就能被染成红、黄等各种颜色，非善非不善的无记心就像无垢的白布一样。那么，怎样以“数息观”将心转成无记呢？首先，摄心向内观察自己的动机，如果发现它受到贪、瞋等烦恼影响的话，（我们便应专注于自己的呼吸：）用鼻孔向外缓缓地呼气，不要出声、不要用力，也不要散乱等，并在呼气时心想：“气已呼出。”然后用鼻孔向内吸气，心想：“气已吸进。”以此为一次，心中默数“一”，这样从“二”数到“七”“九”“十一”“十五”或“二十一”等。不用数珠，心不散乱而默数呼吸。因为凡夫一心不能二用，所以贪等烦恼将渐渐平息，心将转成无记状态。有人说：呼气时观自心诸烦恼成黑光相外出，吸气时观诸佛菩萨加持成白光相入内，但这种观想仅起到促进作用，我们不一定非要这样来做。", "我的大宝师长曾以譬喻来解释，为何转成无记之后，生起善心就变得容易这一问题：冬季天寒时，如果自己仅有的一个座垫被他人占用时，你再怎么声色俱厉地要他站起来，他也照样置若罔闻。反之你无需直接命令他站起来，你只需说那边有一个盛大的表演，并装作自己也要去的样子，那么他就会站起来跑出去，这样你就能马上坐回自己的原位了。同样地，如果我们的心伴有贪等不善心所时，虽然强力排除也难以奏效。但当心专注于呼吸上时，心就会上当受骗，烦恼也将随之平息，然后再生起善心便容易多了。如果心未与不善心所相应而容易生起善心的话，就不一定需要“数息观”，因此，称“七法或八法”的道理也就在此。纠正动机无论是否需要数息观，我们在上座之初都要生起“殊胜善心”。不管做什么样的善事，最初的纠正动机是极其重要的。至尊宗喀巴大师在谈论有关修行要点《问难·纯白增上心》，曾向藏地诸大修行者提出这样一个问题：修法之始，如“梵语曰”那般重要者为何？对此，至尊洛桑却坚后来在《答问·善慧笑音》一文中答到：一切修法初，如同梵语曰，即善观自心，无上师尊意。一切修法之初，纠正动机极为重要，如经中说：诸法皆为缘，善住愿根本。", "龙猛论师也说：贪瞋痴三者，所生为不善；无贪无瞋痴，彼所生为善。阿底峡尊者说：譬如草木，若根是毒，枝和叶也是毒，若根是药，枝和叶也成为药；同样地，在贪、瞋、痴的根本上，做什么事都是不善的。若以烦恼为动机所做的闻、思、修三者，将引发极大不悦意异熟果；若以贤妙善心为动机，就是做杀生等不善业也能圆满广大资粮。以前，大师佛陀尚在有学道时，曾受生为船长，名为“大志”。有一次率五百人入海，得宝而归。当时有一歹徒，人称“俗人具短枪”，企图谋杀那五百位商人。船长为了保护五百位商人的生命，也为了保护“俗人具短枪”不堕恶趣，他以大悲心将之超度，据说由此提早圆满四万大劫的资粮。杀生业本身虽然不能圆满资粮，但大悲心这个动机却能圆满广大资粮。事实上，动机决定了一切：善或不善；异熟果悦意或不悦意；力大或力小。", "以前，印度有二位乞儿，分别来自王种和婆罗门种。一天婆罗门种乞儿去僧团那里乞食，但他去的不是时候，僧伽大众尚未用斋前不施“荐新”，所以什么也没得到。王种乞儿则比较有时间观念，他到的时候，正值他们准备扔掉吃剩的东西，故而得到很多。他问婆罗门种乞儿：“你得到一点吃的吗？”婆罗门种乞儿气恼地说：“如果我掌权的话，我将把所有释迦沙门的头砍下来扔到地上！”那个王种乞儿因为得到许多剩食，故而对僧团生起了信心，他说：“如果我有钱的话，我将每天供养百味食物献给佛陀及其僧团！”他俩边走边谈离开了舍卫城，来到一棵树前躺下休息。后来有一辆车经过，车轮将婆罗门乞儿的头辗了下来。当时舍卫城中的商人首领去世了，此人膝下无子，于是城中一切住户集会，商定当立福德最大者为新首领。他们四处观察，结果发现那个躺在树荫下的王种少年，因为其他树的影子都随着太阳的移动而移动，而那棵树的影子却丝毫未动。于是他得到了商人之王的灌顶，并如他先前承诺的那样，供养佛陀以及僧伽，后因闻法而见谛。经中说：诸法意为先，意速意为主，如由极毒意，或说或做事，彼能令得苦，如轮断头例；又如以净信，或说或做事，彼能令得乐，如荫相随例。", "这样的妙劣动机之果是有目共睹的。所以，不仅是在做善业之初，对于日常的一切事务，我们也应以贤妙的动机来做，这很重要。现在我们见面问安时，大都说：“您身体好吗？”阿底峡尊者则不然，他会这样问：“生善心否？”至尊大宗喀巴也说：", "黑白业即妙劣心，意乐妙则地道妙，意乐劣则地道劣，一切观待意乐故。由于动机有别，修善获得乐果的力量大小也有差别。以四人同时念一遍《度母赞》为例：第一个人以“菩提心”为动机，第二个人以“出离心”为动机，第三个人以希求后世为动机，第四个人以希求现世长寿、无病等为动机。他们念诵的数量多寡虽一致，但得果的情况却大不相同：第一个人的念诵为“菩提心”所摄持，因此成为圆满菩提之因和菩萨之行，是大乘法。其他三人的念诵则不然，第二个人的念诵为“出离心”所摄持故，仍是解脱之因和生死的对治，是中士法。其余二人的念诵则连解脱之因也谈不上，仅是普通的“集”而己。第三个人的念诵虽然不成为解脱和一切智之因，但成为遮退恶趣的方便和下士法。第四个人因为只考虑现世，所以其念诵不成为正法。结果是，除此人所希望的那点现世利益之外，很难有别的。有人曾问阿底峡尊者：“希求现世的快乐和利养、恭敬等而造作诸业，将有什么果报？”答：“果报也只有那样。”“那么后世有什么呢？”“地狱、饿鬼、畜生。”所以，当我们这些出家人在走向大殿和辩经场时，如果为菩提心所摄持的话，那么就是我们踏出的每一步，也能成为十万两黄金也难以相比的菩萨行。", "但如果去的目的，是为了想得到钱财及茶等，或是为了执事的情面，那么我们的行动就会成为上述阿底峡尊者所说的那样。修行者的修行是否成功也有待于此。阿底峡尊者说过：我的贡巴仁钦喇嘛说要修行，但如果修的时候这样想：因为修行可以招来整匹的布和整包的茶等许多东西，那么怎么修也是罪；如果修的时候这样想：我要出离生死海的边际，要播下大菩提的种子，那么，仅仅这一想的福报，就连虚空也容纳不了。", "因此，我们在做闻、思、修与恭敬、供施等善事时，不论大小，如果不纠正动机的话，一切都将无益。此处最初也应努力纠正动机，又因为这是大乘法的缘故，所以不是随便哪一种善心都可以，而应以“殊胜善心”菩提心来摄持。如果我们已经拥有自然不假造作的菩提心，便无需这样费力地纠正动机。但在需要生起造作的菩提心时，我们单靠念诵“为利一切母亲有情”等词句，是不能转变心意的。因此，我们应当像前几天说过的那样想：“噫！我今幸得此暇满身……，为利一切母亲有情，当获圆满佛位，是故当修菩提道次第引导。”从暇满、利大、难得开始直至发心，依次回忆，这样才能改变心意。众先德所说的纠正动机法有详有略。有些人以讽诵那些词句为足，当知这样做是一点儿都不能改变自心的。动机的纠正是在心里而不是在嘴上，所以心应当与口中所念词句的意思结合起来，尽力转变自心。观归依境像这样生起殊胜善心之后，我们应以此为动机，修“归依、发心”。由于现在是将三种“道次第”合起来讲，而各个“加行法”中，有着各自不同的“归依境”与“资粮田”，所以请勿混淆。按照规矩，现在在法会上，大家共念《南传派加行法》，因为它比较好念。", "至于个人日常的念诵，则仍应该依照《捷径加行法》来念。在归依之前，我们应该先观“归依境”。“捷径派”的“归依境”如下：在面前虚空之中，观想有一个八大狮子擎举的广大宝座。所缘境不可太高、也不可过低，因为太高或过低分别有生掉和生沉的危险。因此，最合适之处当观在正对眉心这个位置。", "狮座之上，中央与四方各有一小座，共五小座。中央的那个稍高于其他四个，中央座上观开示此法的具恩根本师长，外相为大师释迦牟尼佛，一如念诵仪轨中所说。因为一切道果的证德均依靠师长而生起，所以应观其体性为师长。观师长现释迦佛相，是为显示正法的根源，因为释迦佛是圣教之主。释迦佛右手按地，表战胜“天子魔”；钵内的无病药甘露，表战胜“蕴魔”；不死甘露，表战胜“死主魔”；无漏智慧甘露，表战胜“烦恼魔”。当思此表大师已胜四魔及表自己将迅速战胜四魔之意。在大师心间，观“智慧萨埵”金刚持；在金刚持心间，观“三摩地萨埵”蓝色吽字。因为这里的修法与密法相关，所以应观“三重萨埵”。你们可能会想：“我有许多开示道次第的师长，应该观哪一位呢？”当观以最能利益自心的师长为主。右边的座上观至尊弥勒，在小座的周围观“广大行派”众师长围绕；左边的座上观至尊文殊，如前观“甚深见派”众师长围绕；背后小座上观胜者金刚持，如前观“修行加持派”众师长围绕；前方小座上观自己根本师长，现通常所见之相，如果师长有独眼瞎等毛病，则不应观想那些缺陷。师长右手结说法印，左手作定印、手持充满无死甘露的长寿宝瓶。", "在甚深空性中入定同时说法，唯佛方能，所以此二表师长本身即佛。说法印也可表策励所化听法，定印表策励弟子实修所闻之法。又如至尊大宗喀巴所说：有缘修道主要障，坏身阎摩坏心痴。修法的主要障碍，是能坏心的愚痴和能坏身的死主阎摩。作为这二种障碍的对治，说法印表以说法战胜愚痴，寿瓶中的无死甘露表战胜死主。像这样有许多依此修习息、增、怀、伏事业的所缘甚深关要。师长周围观结有法缘的众师长围绕，包括教读师。平时当别人问我们有多少师长时，我们多半要用数珠从头开始一个一个地算；但当问及钱包里有多少钱时，我们却能脱口而出，当知此乃不重视道之根本之相。观想尚住世的众师长坐在锦垫上，已去世的众师长坐在莲月座上。这五组师长称作“五部师长”。在他们周围，有从本尊乃至护法的资粮田各尊围绕；均安住于上述的大座之上。关于五部师长周围本尊的安置法，我的大宝师长遵循彩却林雍增的规矩：内层为无上续，其外为瑜伽续，其外为行续，其外为事续，共作四层。曲桑结·益西嘉措（智海）的规矩，则是将四续部置于四方：前方为无上续，后方为瑜伽续等，仅作一圈。曲桑版资粮田图中，只见到无上续一部，也就是这个道理。", "不管修哪一种安置法，在本尊之外，次当观想殊胜化身相诸佛围绕，以贤劫千佛、药师八如来和《堕忏》三十五佛等为主。总的来说，佛虽有无数，但因贤劫诸佛与我们比较有缘，又据说七如来所发的愿将于释迦教法之末在此世界上实现，而《堕忏》的三十五佛清净罪堕的力量极为强大，所以是就此来观想的。诸佛周围有八大上首佛子等众天子相菩萨围绕；在此之外有十二独觉等独觉阿罗汉围绕；在此之外有圣十六上座等声闻阿罗汉围绕，现比丘相，安住头陀功德，手持乞化钵、锡杖和经函等。与声闻的不同之处为：众独觉头上略有顶髻突出等，具有与佛相似的相好。", "声闻之外有“堪札噶波罗”“极猛母”等《胜乐续》中所说的众勇士勇女围绕；在此之外有以“三士法主”为首的众出世间护法围绕；在此之外，四方观四大天王，有二种说法：一说观于座上；另一说不观于座上而观于座下云团之上。这是因为，前者是视四大天王为出世间护法来说的，而后者则视其为世间护法。我们不可将王魔、厉鬼等世间非人安置于资粮田中。过去有人曾敬献一幅资粮田画像给彩却林喇嘛雍增仁波切阅览，彩却林大师指出，护法众中绘有一位厉鬼，并说：“可否绘一摩尼宝将之代替？”“归依境”各尊之前，观想“证法宝”体性现为“教法宝”经函，五彩缤纷的函头标签朝向自己。观“归依境”的方法有许多种，例如：“普摄摩尼宝”观和“上下重叠”观等，但本派按此处所说的情形观想，因为这一归依境具足三宝之故。所观的诸尊，既不是像唐卡绘像那样扁平，也不是像泥像那样暗钝，而是以莹洁光明为体的虹身，且应想成是真身现前、光明照耀。《毗奈耶经》中以三种譬喻来赞叹佛身：如火住身形中；如酥油充满火焰；如灯置金器中。观想资粮田各尊作相互问答法义状。正如王宫门前车水马龙，有些人被派出去办事，也有些办完事回来的。", "相同地，从释迦佛到四大天王各尊，为利益有情而作收放种种化身的游戏。如果我们的观力能够胜任，也应观想各尊全身毛孔中充满佛刹等。想资粮田各尊以大欢喜关注自己。对此杰珠康巴·格勒嘉措言道：总的来说，我们老是不去做诸佛菩萨劝我们应该去做的事，而老是去做不应该做的事，所以我们没有让他们感到高兴的时候，但现在却稍稍有了一点可以使他们欢喜的原因。譬如，某位母亲有个禀性不良的儿子，总是干些不好的勾当，但当他偶尔做件好事时，那位母亲将会感到特别的高兴。同样地，虽然我们平素总是不听话，但现在却能假装修一次“道次第”时，这也使得诸佛菩萨感到特别的喜悦！归依念诵仪轨中，“我与一切母亲有情，从无始以来乃至现在，虽已领受总生死、别三恶趣种种痛苦……”一段，说的是在心中忆念归依二因，归依是否清净即有待于此。归依之因有二：怖畏与信心，前者为忆念生死总、别之苦而感生恐惧；后者为相信三宝有救苦的能力。大乘不共归依中，则再加上对其他受苦的有情生起悲悯，共计三因。等到下面讲归依正行时，我再详述这些内容。在自己周围，观想以父母为代表的一切有情围绕，他们的体性为各趣众生，正经受着各趣之苦，外表则为能说、解义的人相，呈黝黑状。", "诵归依文时，应观想自己带头领诵，一切有情跟着自己同做归依。在大会念诵时，四句归依合起来一块儿念。但在修“道次第”引导所缘时，为了修持的方便，可分开来各别计数。例如，念“归依师长”的时候，观想五部师长而做归依，并观甘露降注净治。如用念珠计数念一圈的话，那么前五十多遍应修净治不顺品的所缘，后五十多遍应修顺品功德增长所缘。在第一部分，观想降注以白色为主的五色甘露及光明，灌入自他一切有情的身心，我们无始以来所集的罪堕，特别是捶打师身、违背师语、恼乱师意、不信轻毁等，总依师长所造的一切罪障，均变成烟汁碳水向外流出，内身清净。接着在第二部分观顺品增长：想师长的身、语、意功德，变成以黄色为主的五色甘露及光明，注入自他一切有情，由此寿命、福德及教法功德悉皆增长，特别是获得师长的身、语、意加持。", "同样地，在念“归依佛”时，我们观想从密宗四续部本尊和显教诸殊胜化身，降注甘露并净治自他一切有情。依佛所造的罪计有：以恶心出佛身血、对佛像评论优劣、将佛像作抵押、将佛像当作商品来贩卖，及以恶心拆毁（塔等）意所依等等。其中第一种罪，如提婆达多将一块大石掷向佛陀，致使佛陀出血那样，我们现在虽然不可能犯，但可能会犯其他几种。“评论优劣”是指对佛像的形像提出批评。以前大瑜伽师献上一尊文殊像请阿底峡尊者观看，并问道：“不知此像是好是坏？如果您觉得好，我将用绒巴迦格瓦供养我的四钱黄金买下它。”尊者回答说：“至尊文殊之身无有不善，但做工中等。”我们也应这样，除了说工有好坏外，不可批评佛的身相。至于“抵押”和“贩卖佛像”之事则屡见不鲜，我们当谨防此类的事情发生。修顺品增长时，观想佛的十力、四无畏、十八不共法等，成甘露相注入，其他与前相同。诵“归依法”时，从以证正法为体的经函降注甘露，净治自他有情。依法所造的罪计有：谤舍正法、贩经如货、不敬佛经、卖经为食等等。这些罪过我们很容易犯，后果也特别严重。“谤舍正法”，例如，以大乘法为由毁谤小乘、或以小乘为由毁谤大乘；", "以及显、密、四续部、萨迦、格鲁、噶举、宁玛等各以自宗为由而对他派所做的一切毁谤；不以为然地跨越经书和字纸等举动也是谤舍正法之业。某些人喜欢将字纸等置于座垫下，似乎故意要造集恶业。《三摩地王经》等佛经中说，谤舍正法之业后果极为严重，前已详述。“贩经如货”，是指将经典当作财物来进行贩卖。“不敬佛经”，例如，将经典置于露地上，用牙垢涂抹经书，手指沾上口水来翻书页，将器具放在经书上等，过失极其严重。据说阿底峡尊者到达阿里的时候，同行一位咒师起先不愿来听法，后因听说尊者对一位文书用齿垢涂经难以忍受，而说：“啊呀！不可！不可！”时，这位咒师才生起信心前来听法。我们这些经常和经书打交道的人，应该加倍小心，因为这些过失极其重大。“卖经为食”，是指受用卖经得来的钱财，这种过失也是极为严重的。以前有一位大成就者，名叫温敦杰冈巴，是“香巴七宝”中的第五位大师，修观音法得成就。他的一位在家施主，因为家道中落而出售一套十万颂《般若经》，为忏此罪，施主请来杰冈巴等四位出家人，用卖经得来的钱买来食物供养他们。当天晚上，杰冈巴一下子病得十分严重，他入定观察，见体内有一个白色阿字来回跳跃而引起剧烈疼痛。", "于是向本尊祈祷，观自在现身说：你们这几个人卖经为食，此事极为不妙。因为你的罪障较轻，所以现世即报，而他们几个将别无选择地堕入地狱。你现在应该修造一部金字十万颂《般若经》来忏罪！本尊另外又说了供净障朵玛的方法，命他多修。杰冈巴照办后，身体就好了。修增长所缘时，应观“灭”“道”等法成甘露相注入自他一切有情。诵“归依僧”时，观想从显教僧伽声闻、独觉、菩萨三类、密宗僧伽空行与护法众降注甘露和净治自他一切有情。依僧伽所集的罪障计有：分裂僧团、劫夺僧财、毁谤僧伽、护法定期朵玛断缺等等。这些依僧伽所集的罪障，纵然经过四力忏悔，仍需领受少分异熟果，否则的话不能清净，例如善花月法师的故事。所以，这些罪比依法与佛所造的恶业更为厉害。由于我们这地方有许多僧伽，而且我们也经常要与僧伽打交道，极易犯这些过失，故应谨慎小心。“分裂僧团”只发生在佛在世时，现在不可能有，但与之类似的扰乱僧团之事却时有发生。“圣僧伽”是指已现证空性之人，缁素均可，一人即足；如果是凡夫的话，则至少四名一组的清净比丘方构成僧伽。因此，在是凡夫的情况下，如果某人在下至四人的僧众中挑拨离间，从而形成意见不合的二派，这就构成了“扰乱僧团”。", "其结果是，不但是这个人，所有参与此事者，都将手牵手地走向地狱。过去有一叫作“赛协”（明智）的格西，因他是在扰乱僧团后死的，所以格西敦巴说：“我的赛协如果死在三年前，死的就是一个三藏法师，可是他晚死了三年。”说明“他的栓橛就是寺院”并指出赛协现在仍住地狱，似已成为讲“道次第”众师长的传统说法。据说那个地区被罪恶之火所烧，有人在那里修了十二年也生不起任何证德。某些出家人觉得自己与别人合不来，而称“我们”“你们”，在僧团中分党结派，贪著自党、瞋恨他派，我想这就是扰乱僧团的根本所在吧！如果僧伽意见不合，诵读闻思和修习静虑就都不会兴盛，这是导致圣教衰败的罪魁祸首！所以当如经中所说：僧和合为乐，和合苦行乐。僧团大众当以团结为上。“劫夺僧财”，是指阻止别人供养僧伽、不向僧伽缴纳先前允诺的税、未经僧伽同意擅用公共财物等，这些事对寺院总管等人来讲，是很容易犯的。某些寺院里派出的对外联络僧，为了向施主表示亲热，故意说不需要那么多供养而使僧伽的供养减少。即便减少一片酥油，也是阻止别人供养。", "阻止供养者将堕入无间地狱，犯其他几种者将堕入独一地狱，后者如《僧护因缘经》中所说：当圣僧护从龙界返回时，在大海边见到许多“独一地狱”，这些有情地狱的形状，有的像绳子，有的像锅子，也有像扫帚、臼、柱子、墙和如绳紧束的东西，并发出哀怨声。当僧护问佛这些是造什么业的报应时，佛解释说：“如绳”和“如帚”有情地狱，是因为在迦叶佛教法时，那些人未经允许而擅用属于僧伽公共财物的绳子和扫帚的报应；“如锅”，是因为以前有一位仆人在煎药时，有几个比丘对他说了些不好听的话，他愤而将锅打破之果；“如臼”，是因为以前有个比丘，要一位当司库的沙弥为他舂一些清油，沙弥说他现在不得闲、过会儿再送来，比丘闻言大怒，破口骂道：“我如果手里有臼的话，不要说是清油渣，就连你也扔进去舂了！”故而遭此报应；“如柱”和“如墙”，是因为那些人以前在僧伽的道场里随便吐痰和擦鼻涕之果；“如绳紧束、腰成极细之状”，是因为以前有一位寺院执事，将僧伽的夏季供养削减到冬季供养上去，是削弱供养之报。因此，如果未经同意，就是动用僧伽木材供应中的一根拨火棍，也定将投生于“独一地狱”。“诽谤僧伽”，是指在公开场合或私下场合，给僧众起绰号、以恶口伤人。", "例如，以前有个名叫“摩纳瓦劫比罗”的婆罗门，因为对迦叶佛的僧众恶口诽谤，而受生为摩羯鱼。下面是这个故事的概况：很久以前，印度有五百个渔夫，在一条美丽的大河中，下网捕捞鱼、龟等水产。有一次，一条庞大的摩羯鱼不期闯入他们的网中，但五百个渔夫未能将它逮住，因为它很快顺流游走了。于是他们叫来附近的牧人、采药人以及过路人，在五百多人的帮助下方才将其捕获，并将它拖上岸。大家发现，这头鱼长着十八个头和三十六只眼睛。不久有成千上百的人来看热闹，包括外道六师等人。佛陀视不踰时，他决定利用这个机会为大家开示业果，所以在许多比丘僧伽的陪同下来到河边。那些没有信心的人却乘机说：“沙门乔达摩自称从不凑热闹，但现在却来了。”而那些有信心的人则说：“佛陀从不看热闹，他来这里想必是为大家开示稀有的正法。”大师在徒众中设座安住之后，便加持那头摩羯鱼，使他能回忆前生并开口说话。佛陀问道：“你是摩纳瓦劫比罗吗？”“我是劫比罗！”它回答道。“你受到身、口、意恶行的报应了吗？”“是的！”“谁是你的恶知识？”“我的母亲。”“她如今投生在哪里？”“在地狱里。”“你受生在哪里？”“畜生中。”“当你死后你将投生到哪里？", "”“投生到地狱里。”它说完后哭了起来。佛的弟子们感到十分奇怪：“这头鱼既能忆念前生、又能说人话，它到底是谁呀？”于是大家便请阿难去问佛。佛解释说，过去迦叶佛时代，在“讫栗枳”王当政时，从外地来了几个能言善辩的婆罗门。其中有位名叫“劫比罗设摩”的婆罗门，能驳倒其他所有的人，国王便赐给他一块地作为奖赏。婆罗门后来生了一个儿子，因其长着淡黄色的长发，所以起名为“摩纳瓦劫比罗”。此人经过学习文法等成为一名学者，经常在辩论中获胜。他父亲死后，其母担心他们的财产被别人夺走，便问他道：“你有把握驳倒其他所有的学者吗？”他回答说：“除了那些迦叶佛的沙门之外，其他人都不在话下。”母亲说：“你也要把他们驳倒才行。”劫比罗事母极孝，于是遵命外出辩论。在路上遇到一位比丘，比丘问他一个偈颂的意思，劫比罗无言以对返回家中。他母亲问道：“驳倒那些沙门了吗？”“母亲，说实话，今天我被驳倒了。”“这样的话，儿子，你应该学点佛教。”“但他们不教在家人呀。”“那你就出家，精通了之后再还俗。”经过母亲的一再劝说，劫比罗出了家并精通三藏。他母亲又来问：“能驳倒那些沙门了吗？", "”“母亲，我只精通教理，他们则教证功德皆备，所以我胜不了他们。”他母
